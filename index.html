<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PickleConnect</title>
<meta name="theme-color" content="#0D1B2A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">  

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --green:#2ECC71;--green-dark:#27AE60;--green-dim:rgba(46,204,113,0.12);
  --navy:#0D1B2A;--navy2:#142232;--card:#1A2B3C;--card2:#1F3347;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --text:#F0F4F8;--muted:#7A9BB5;--muted2:rgba(122,155,181,0.5);
  --accent:#F7C948;--blue:#5B9BF7;--red:#F75B5B;
  --nav-h:62px;
}
html,body,#root{height:100%;overflow:hidden;}
html,body{max-width:100vw;overflow-x:hidden;}
body{padding-top:0!important;padding-bottom:0!important;font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--text);font-size:15px;-webkit-text-size-adjust:100%;}

.app-shell{display:flex;flex-direction:column;position:fixed;top:54px;left:0;right:0;bottom:62px;max-width:480px;margin:0 auto;background:var(--navy);}
.screen-body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:16px;}
.screen-body::-webkit-scrollbar{display:none;}
.top-bar{display:none!important;}
.bottom-nav{display:none!important;}

.btn{padding:11px 20px;border-radius:12px;border:none;font-family:'DM Sans',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:7px;justify-content:center;}
.btn-primary{background:linear-gradient(135deg,#2ECC71,#27AE60);color:white;box-shadow:0 4px 14px rgba(46,204,113,0.35);}
.btn-ghost{background:transparent;color:var(--green);border:1.5px solid rgba(46,204,113,0.35);}
.btn-ghost:hover{background:var(--green-dim);}
.btn-danger{background:rgba(247,91,91,0.12);color:var(--red);border:1px solid rgba(247,91,91,0.2);}
.btn-sm{padding:7px 14px;font-size:0.78rem;border-radius:10px;}

.modal-overlay{position:fixed;inset:0;background:rgba(5,10,18,0.82);backdrop-filter:blur(8px);z-index:9950;display:flex;align-items:flex-end;justify-content:center;}
.modal-sheet{background:var(--navy2);border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;overflow-x:hidden;padding:20px 20px 90px;animation:slideUp .28s ease;}
.modal-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 18px;}

.pcn-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
.fab-wrap{position:fixed;bottom:62px;left:50%;transform:translateX(-50%);z-index:200;height:44px;display:flex;align-items:center;justify-content:center;pointer-events:none;width:200px;}
.fab{pointer-events:all;background:linear-gradient(135deg,#2ECC71,#27AE60);color:#fff;font-family:'Syne',sans-serif;font-size:0.68rem;font-weight:800;letter-spacing:0.06em;padding:0 18px;height:42px;border-radius:24px;display:flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 4px 16px rgba(46,204,113,0.5);cursor:pointer;border:2px solid rgba(255,255,255,0.2);transition:transform .15s;}
.fab.open{background:linear-gradient(135deg,#142232,#1A2B3C);}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
</style>

<script>
  const isNative = !!(window.Capacitor?.isNativePlatform?.());

  const FB_CONFIG = {
    apiKey: isNative ? "AIzaSyDjgdzr2gQlWMYnOYeLV56HBk5mdOXEDj8" : "AIzaSyDaFUszTD0-Ro292GOBSlS5vkZSdJM0NF4",
    authDomain: "pickleball-app-1bba7.firebaseapp.com",
    projectId: "pickleball-app-1bba7",
    storageBucket: "pickleball-app-1bba7.firebasestorage.app",
    messagingSenderId: "645604154338",
    appId: "1:645604154338:web:b92f87c2cd11d950b737bb"
  };

  window.db = null;
  window.auth = null;
  window.fbOk = false;

  try {
    if (!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    window.db = firebase.firestore();
    window.auth = firebase.auth();
    window.fbOk = true;
  } catch (e) {
    console.error('Firebase Infrastructure Integration Failure:', e);
  }
</script>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect, useRef, useMemo } = React;

  /* --- Fallback Component Stubs --- */
  function FabSheet({ onClose }) {
    return (
      <div className="modal-overlay" onClick={onClose}>
        <div className="modal-sheet" onClick={e => e.stopPropagation()}>
          <div className="modal-handle"></div>
          <h3 style={{fontFamily:'Syne', marginBottom:'12px'}}>Match Setup Menu</h3>
          <p style={{fontSize:'0.85rem', color:'var(--muted)', marginBottom:'20px'}}>Configure real-time matchmaking queue parameters or setup open court layouts.</p>
          <button className="btn btn-primary btn-sm" onClick={onClose}>Dismiss</button>
        </div>
      </div>
    );
  }

  function LoginPrompt({ onClose }) {
    return (
      <div className="modal-overlay" onClick={onClose}>
        <div className="modal-sheet" onClick={e => e.stopPropagation()}>
          <div className="modal-handle"></div>
          <h3 style={{fontFamily:'Syne', marginBottom:'12px'}}>Authentication Required</h3>
          <button className="btn btn-primary" style={{width:'100%'}} onClick={onClose}>Close Window</button>
        </div>
      </div>
    );
  }

  ...

  /* --- Application Entry Core --- */
  function App() {
    const [tab, setTab] = useState('home');
    const [user, setUser] = useState(null);
    const [profile, setProfile] = useState(null);
    const [loading, setLoading] = useState(true);
    const [showFab, setShowFab] = useState(false);
    
    const [showProfile, setShowProfile] = useState(false);
    const [showInbox, setShowInbox] = useState(false);
    const [showNotifSettingsApp, setShowNotifSettingsApp] = useState(false);
    const [chatP, setChatP] = useState(null);
    const [loginPromptPlayer, setLoginPromptPlayer] = useState(undefined);
    const [allPlayers, setAllPlayers] = useState([]);

    useEffect(() => {
      if (!window.fbOk) {
        setLoading(false);
        return;
      }
      return window.auth.onAuthStateChanged(async (usr) => {
        setUser(usr);
        if (usr) {
          try {
            const pDoc = await window.db.collection('profiles').doc(usr.uid).get();
            if (pDoc.exists) {
              setProfile({ uid: usr.uid, ...pDoc.data() });
            } else {
              setShowProfile(true);
            }
          } catch(err) {
            console.error("Profile synchronization failure:", err);
          }
        } else {
          setProfile(null);
        }
        setLoading(false);
      });
    }, []);

    useEffect(() => {
      window.__pcnSetTab = (tabId) => {
        setTab(tabId);
        if (window.__pcnOnTabChange) window.__pcnOnTabChange(tabId);
      };
      
      window.__pcnOpenProfile = () => setShowProfile(true);
      window.__pcnOpenNotifSettings = () => setShowNotifSettingsApp(true);
      window.__pcnOpenInbox = () => setShowInbox(true);

      const hash = window.location.hash || '';
      if (hash.includes('tab=')) {
        const targetTab = hash.split('tab=')[1];
        if (targetTab) setTab(targetTab);
      }
    }, []);

    if (loading) {
      return (
        <div style={{display:'flex', height:'100vh', alignItems:'center', justifyContent:'center', background:'var(--navy)', color:'var(--muted)'}}>
          <p>Syncing Player Profile Matrix...</p>
        </div>
      );
    }

    return (
      <div className="app-shell">
        <div className="screen-body px" style={{paddingTop:'16px'}}>
          <header style={{marginBottom:'24px'}}>
            <h2 style={{fontFamily:'Syne', fontWeight:800}}>PickleConnect Arena</h2>
            <p style={{fontSize:'0.8rem', color:'var(--muted)'}}>Active Node: <span style={{color:'var(--green)'}}>{profile?.name || user?.email || 'Guest Player'}</span></p>
          </header>

          {tab === 'home' && (
            <div className="pcn-card">
              <h4 style={{fontFamily:'Syne', marginBottom:'6px'}}>⚡ Live Match Feed</h4>
              <p style={{fontSize:'0.82rem', color:'var(--muted)'}}>Scanning local court geolocations for active, non-full match configurations...</p>
            </div>
          )}

          {tab === 'courts' && (
            <div className="pcn-card">
              <h4 style={{fontFamily:'Syne', marginBottom:'6px'}}>🏟 Court Layout Directory</h4>
              <p style={{fontSize:'0.82rem', color(--muted)'}}>Querying facility database parameters and open weather schedules...</p>
            </div>
          )}

          {tab === 'games' && (
            <div className="pcn-card">
              <h4 style={{fontFamily:'Syne', marginBottom:'6px'}}>🎮 Active Sessions</h4>
              <p style={{fontSize:'0.82rem', color:'var(--muted)'}}>No upcoming scheduled tournaments found on your timeline.</p>
            </div>
          )}

          {tab === 'players' && (
            <div className="pcn-card">
              <h4 style={{fontFamily:'Syne', marginBottom:'6px'}}>👥 Active Proximate Players</h4>
              <p style={{fontSize:'0.82rem', color:'var(--muted)'}}>Scanning community members using targeted distance metrics.</p>
            </div>
          )}
        </div>

        {tab === 'home' && (
          <div className="fab-wrap">
            <div className={`fab ${showFab ? 'open' : ''}`} onClick={() => setShowFab(!showFab)}>
              {showFab ? '✕ Close Menu' : '🏓 I WANT TO PLAY'}
            </div>
          </div>
        )}

        {showFab && <FabSheet onClose={() => setShowFab(false)} />}
        {loginPromptPlayer !== undefined && <LoginPrompt onClose={() => setLoginPromptPlayer(undefined)} />}
        {chatP && <ChatModal player={chatP} onClose={() => setChatP(null)} />}
        {showInbox && <Inbox onClose={() => setShowInbox(false)} />}
        {showProfile && <ProfileSetup onClose={() => setShowProfile(false)} />}
        {showNotifSettingsApp && <NotificationSettings onClose={() => setShowNotifSettingsApp(false)} />}
      </div>
    );
  }

  const container = document.getElementById('root');
  const root = ReactDOM.createRoot(container);
  root.render(<App />);
</script>

<script src="nav.js"></script>

</body>
</html>
