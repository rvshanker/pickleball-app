    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyDaFUszTD0-Ro292GOBSlS5vkZSdJM0NF4",
            authDomain: "pickleball-app-1bba7.firebaseapp.com",
            projectId: "pickleball-app-1bba7",
            storageBucket: "pickleball-app-1bba7.firebasestorage.app",
            messagingSenderId: "645604154338",
            appId: "1:645604154338:web:b92f87c2cd11d950b737bb",
            measurementId: "G-WM2DMSZM7F"
        };

        // Initialize Firebase
        let db = null;
        let auth = null;
        let isFirebaseConfigured = false;

        // Suppress Firebase permission errors in console
        const originalConsoleError = console.error;
        console.error = function(...args) {
            const errorString = args.join(' ');
            if (errorString.includes('permission-denied') || 
                errorString.includes('Missing or insufficient permissions') ||
                errorString.includes('Firestore')) {
                // Silently ignore Firebase permission errors
                return;
            }
            originalConsoleError.apply(console, args);
        };

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            auth = firebase.auth();
            isFirebaseConfigured = true;
            console.log("✅ Firebase initialized successfully!");
            console.log("💾 App uses localStorage as fallback (works without Firebase rules)");
        } catch (error) {
            console.log("Firebase initialization failed - using localStorage fallback:", error);
            isFirebaseConfigured = false;
        }

        // Storage helper with Firebase and localStorage fallback
        const storage = {
            async saveTournament(tournamentData) {
                if (isFirebaseConfigured && db) {
                    try {
                        await db.collection('tournaments').doc(tournamentData.id).set(tournamentData);
                        return true;
                    } catch (error) {
                        // Silently fall back to localStorage - this is expected without proper Firestore rules
                    }
                }
                // Fallback to localStorage
                localStorage.setItem(`tournament:${tournamentData.id}`, JSON.stringify(tournamentData));
                return true;
            },
            
            async getTournament(id) {
                if (isFirebaseConfigured && db) {
                    try {
                        const doc = await db.collection('tournaments').doc(id).get();
                        if (doc.exists) {
                            return doc.data();
                        }
                    } catch (error) {
                        console.error("Firebase get failed:", error);
                    }
                }
                // Fallback to localStorage
                const data = localStorage.getItem(`tournament:${id}`);
                return data ? JSON.parse(data) : null;
            },
            
            async getAllTournaments(userId = null) {
                if (isFirebaseConfigured && db) {
                    try {
                        let query = db.collection('tournaments');
                        
                        // Get public tournaments OR private tournaments where user is a participant
                        const publicSnapshot = await query.where('isPublic', '==', true).get();
                        const publicTournaments = publicSnapshot.docs.map(doc => doc.data());
                        
                        if (userId) {
                            const privateSnapshot = await query
                                .where('isPublic', '==', false)
                                .where('participants', 'array-contains', userId)
                                .get();
                            const privateTournaments = privateSnapshot.docs.map(doc => doc.data());
                            return [...publicTournaments, ...privateTournaments];
                        }
                        
                        return publicTournaments;
                    } catch (error) {
                        console.error("Firebase getAllTournaments failed:", error);
                    }
                }
                
                // Fallback to localStorage
                const tournaments = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key.startsWith('tournament:')) {
                        const data = JSON.parse(localStorage.getItem(key));
                        // Filter based on public/private and user access
                        if (data.isPublic || (userId && data.participants?.includes(userId))) {
                            tournaments.push(data);
                        }
                    }
                }
                return tournaments;
            },
            
            async deleteTournament(id) {
                if (isFirebaseConfigured && db) {
                    try {
                        await db.collection('tournaments').doc(id).delete();
                        return true;
                    } catch (error) {
                        console.error("Firebase delete failed:", error);
                    }
                }
                // Fallback to localStorage
                localStorage.removeItem(`tournament:${id}`);
                return true;
            },
            
            async getAllEvents() {
                if (isFirebaseConfigured && db) {
                    try {
                        const snapshot = await db.collection('events').get();
                        return snapshot.docs.map(doc => doc.data());
                    } catch (error) {
                        console.log("Using localStorage for events (Firebase permissions not set)");
                    }
                }
                
                // Fallback to localStorage
                const events = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key.startsWith('event:')) {
                        const data = JSON.parse(localStorage.getItem(key));
                        events.push(data);
                    }
                }
                return events;
            },
            
            async saveEvent(eventData) {
                if (isFirebaseConfigured && db) {
                    try {
                        await db.collection('events').doc(eventData.id.toString()).set(eventData);
                        return true;
                    } catch (error) {
                        console.log("Using localStorage for events (Firebase permissions not set)");
                    }
                }
                // Fallback to localStorage
                localStorage.setItem(`event:${eventData.id}`, JSON.stringify(eventData));
                return true;
            },
            
            async getAllCourts() {
                if (isFirebaseConfigured && db) {
                    try {
                        const snapshot = await db.collection('courts').get();
                        return snapshot.docs.map(doc => doc.data());
                    } catch (error) {
                        console.log("Using localStorage for courts (Firebase permissions not set)");
                    }
                }
                
                // Fallback to localStorage
                const courts = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key.startsWith('court:')) {
                        const data = JSON.parse(localStorage.getItem(key));
                        courts.push(data);
                    }
                }
                return courts;
            },
            
            async saveCourt(courtData) {
                if (isFirebaseConfigured && db) {
                    try {
                        await db.collection('courts').doc(courtData.id.toString()).set(courtData);
                        return true;
                    } catch (error) {
                        console.error("Firebase saveCourt failed:", error);
                    }
                }
                // Fallback to localStorage
                localStorage.setItem(`court:${courtData.id}`, JSON.stringify(courtData));
                return true;
            },
            
            async listenToTournament(id, callback) {
                if (isFirebaseConfigured && db) {
                    return db.collection('tournaments').doc(id).onSnapshot(doc => {
                        if (doc.exists) {
                            callback(doc.data());
                        }
                    });
                }
                // For localStorage, we'll poll
                const interval = setInterval(async () => {
                    const data = await storage.getTournament(id);
                    if (data) callback(data);
                }, 2000);
                return () => clearInterval(interval);
            }
        };

            { id: 4, name: "Civic Park", address: "100 Civic Park Dr, O'Fallon, MO", courts: 3, indoor: false, outdoor: true, lat: 38.8206, lng: -90.7304, rating: 4.0 },

                    {/* Navigation */}
                    <nav className="bg-white shadow-lg sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 py-3">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center space-x-2 cursor-pointer" onClick={() => setCurrentView('home')}>
                                    <div className="bg-green-600 text-white rounded-full w-8 h-8 md:w-10 md:h-10 flex items-center justify-center font-bold text-sm md:text-lg">
                                        P

                                {/* Desktop Navigation */}

                                            🏠 Home
                                        </NavButton>

                                        </NavButton>

                                            📅 Games
                                        </NavButton>
                                        <NavButton active={currentView === 'roundRobin'} onClick={() => setCurrentView('roundRobin')}>
                                            🔄 Tournaments
                                        </NavButton>
                                        <NavButton active={currentView === 'profile'} onClick={() => setCurrentView('profile')}>
                                            👤 Profile
                                        </NavButton>
                                    </div>
                                    {currentUser ? (
                                        <div className="flex items-center space-x-2 bg-green-100 px-4 py-2 rounded-lg">

                    )}

                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto px-4 py-8">
                        {views[currentView]}

                </div>

        }

        function LoginModal({ setShowLogin }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isSignup, setIsSignup] = useState(false);
            const [error, setError] = useState('');

            const handleAuth = async (e) => {
                e.preventDefault();
                setError('');
                
                if (!isFirebaseConfigured) {
                    setError('Please configure Firebase first (see instructions below)');
                    return;
                }

                try {
                    if (isSignup) {
                        await auth.createUserWithEmailAndPassword(email, password);
                    } else {
                        await auth.signInWithEmailAndPassword(email, password);
                    }
                    setShowLogin(false);
                } catch (error) {
                    setError(error.message);
                }
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div className="bg-white rounded-xl shadow-2xl p-8 max-w-md w-full">
                        <div className="flex justify-between items-center mb-6">

                            </h2>

                                className="text-gray-500 hover:text-gray-700 text-2xl"
                            >
                                ×

                        </div>

                                <label className="block text-sm font-medium text-gray-700 mb-2">Email</label>
                                <input
                                    type="email"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none"
                                    required
                                />
                            </div>

                            <div>

                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none"
                                    required
                                />
                            </div>

                            {error && (

                                    {error}
                                </div>
                            )}

                                type="submit"
                                className="w-full bg-green-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-green-700 transition-all"
                            >
                                {isSignup ? 'Sign Up' : 'Login'}

                            <div className="text-center">

                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <TermCard 
                                term="Kitchen (Non-Volley Zone)"
                                definition="The 7-foot area on both sides of the net where you cannot volley the ball. You can step in after the ball bounces. Most strategic area of the court!"
                            />
                            <TermCard 
                                term="Dink"
                                definition="A soft shot hit from the non-volley zone that lands in the opponent's non-volley zone. The most important shot in pickleball - master this to win games!"
                            />
                            <TermCard 
                                term="Volley"
                                definition="Hitting the ball in the air before it bounces. Cannot be done while standing in the kitchen!"
                            />
                            <TermCard 
                                term="Lob"
                                definition="A high, arcing shot hit deep into the opponent's court. Use it to move aggressive players back from the net."
                            />
                            <TermCard 
                                term="Baseline"
                                definition="The back line of the court, 22 feet from the net. Serves must be made from behind this line."
                            />
                            <TermCard 
                                term="Centerline"
                                definition="The line down the middle of the court dividing service areas. Serves must land in the diagonal service box."
                            />
                            <TermCard 
                                term="Two-Bounce Rule"
                                definition="After the serve, each team must let the ball bounce once before volleying. This prevents serve-and-volley dominance."
                            />
                            <TermCard 
                                term="Side Out"
                                definition="When the serving team loses the rally, service passes to the other team. In doubles, both players serve before side out (except first service of game)."
                            />
                            <TermCard 
                                term="Rally Scoring"
                                definition="Points can be scored by the serving or receiving team. Games typically played to 11, 15, or 21, win by 2."
                            />
                            <TermCard 
                                term="Third Shot Drop"
                                definition="A soft shot hit from the baseline after the serve return, designed to land in the opponent's kitchen. The most important strategic shot!"
                            />
                            <TermCard 
                                term="Erne"
                                definition="An advanced shot where you jump around the kitchen to volley near the net post. Named after Erne Perry who popularized it."
                            />
                            <TermCard 
                                term="ATP (Around The Post)"
                                definition="A shot that goes around the net post below the height of the net. Legal and spectacular when executed!"
                            />
                            <TermCard 
                                term="DUPR"
                                definition="Dynamic Universal Pickleball Rating - a skill rating system from 2.0 (beginner) to 8.0+ (professional). Most recreational players are 2.5-4.5."
                            />
                            <TermCard 
                                term="Stacking"
                                definition="A doubles strategy where partners align on the same side to keep their stronger forehand in the middle. Requires strategic positioning."
                            />
                            <TermCard 
                                term="Poach"
                                definition="When you cross over and hit your partner's ball. Aggressive net play that can surprise opponents."
                            />
                            <TermCard 
                                term="Paddle Face"
                                definition="The hitting surface of your paddle. Can be 'open' (angled up) or 'closed' (angled down) to control ball trajectory."
                            />
                        </div>
                        
                        <div className="mt-8 bg-white rounded-lg p-6 border-2 border-green-300">
                            <h3 className="text-xl font-bold text-gray-800 mb-4 text-center">Quick Rules Reference</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                                <div>
                                    <h4 className="font-bold text-green-600 mb-2">Serving Rules:</h4>
                                    <ul className="space-y-1 text-gray-700">
                                        <li>• Underhand serve only</li>
                                        <li>• Paddle below waist at contact</li>
                                        <li>• Serve diagonally cross-court</li>
                                        <li>• Must clear the kitchen line</li>
                                        <li>• One serve attempt (no second serves)</li>
                                    </ul>
                                </div>
                                <div>
                                    <h4 className="font-bold text-green-600 mb-2">Scoring Rules:</h4>
                                    <ul className="space-y-1 text-gray-700">
                                        <li>• Only serving team can score</li>
                                        <li>• Games to 11, win by 2</li>
                                        <li>• Tournament games often to 15 or 21</li>
                                        <li>• Call score as: Server-Receiver-Server#</li>
                                        <li>• Example: "5-3-2" (we have 5, they have 3, server 2)</li>
                                    </ul>
                                </div>
                                <div>
                                    <h4 className="font-bold text-green-600 mb-2">Fault Rules:</h4>
                                    <ul className="space-y-1 text-gray-700">
                                        <li>• Volleying in the kitchen</li>
                                        <li>• Serve doesn't clear the net</li>
                                        <li>• Ball lands out of bounds</li>
                                        <li>• Double bounce on your side</li>
                                        <li>• Hitting the ball twice</li>
                                    </ul>

                                <div>
                                    <h4 className="font-bold text-green-600 mb-2">Court Dimensions:</h4>
                                    <ul className="space-y-1 text-gray-700">
                                        <li>• Court: 20' x 44' (same as badminton)</li>
                                        <li>• Net height: 36" sides, 34" center</li>
                                        <li>• Kitchen: 7' from net on each side</li>
                                        <li>• Service boxes: 10' x 15' each</li>
                                        <li>• Smaller than tennis, bigger than ping pong!</li>
                                    </ul>
                                </div>
                            </div>

        // Simplified CourtsView, GamesView, ProfileView (keeping original implementations)
        function CourtsView({ setCurrentView }) {
            const mapRef = useRef(null);
            const mapInstanceRef = useRef(null);
            const [courts, setCourts] = useState([]);
            const [selectedCourt, setSelectedCourt] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [showAddCourt, setShowAddCourt] = useState(false);
            const [newCourt, setNewCourt] = useState({
                name: '',
                address: '',
                courts: 4,
                indoor: false,
                outdoor: true,
                rating: 4.0
            });

            // Load courts from storage
            useEffect(() => {
                loadCourts();
            }, []);

            const loadCourts = async () => {
                try {
                    const savedCourts = await storage.getAllCourts();
                    setCourts([...SAMPLE_COURTS, ...savedCourts]);
                } catch (error) {
                    console.log('No saved courts yet');
                    setCourts([...SAMPLE_COURTS]);
                }
            };

            const handleAddCourt = async () => {
                if (!newCourt.name || !newCourt.address) {
                    alert('Please fill in court name and address');
                    return;
                }

                // Improved geocoding - extract city and zip code for better positioning
                let lat = 38.8106; // Default O'Fallon, MO
                let lng = -90.7104;
                
                const addressLower = newCourt.address.toLowerCase();
                
                // Check for specific cities with accurate coordinates
                if (addressLower.includes('st. charles') || addressLower.includes('st charles') || addressLower.includes('63301') || addressLower.includes('63303') || addressLower.includes('63304')) {
                    lat = 38.7873;
                    lng = -90.4898;
                } else if (addressLower.includes('wentzville') || addressLower.includes('63385')) {
                    lat = 38.8114;
                    lng = -90.8529;
                } else if (addressLower.includes('st. peters') || addressLower.includes('st peters') || addressLower.includes('63376')) {
                    lat = 38.7875;
                    lng = -90.6298;
                } else if (addressLower.includes("o'fallon") || addressLower.includes('ofallon') || addressLower.includes('63366') || addressLower.includes('63368')) {
                    lat = 38.8106;
                    lng = -90.7104;
                } else if (addressLower.includes('lake st louis') || addressLower.includes('63367')) {
                    lat = 38.7872;
                    lng = -90.7854;
                } else {
                    // If no city match, add small variation to default location
                    lat += (Math.random() - 0.5) * 0.01;
                    lng += (Math.random() - 0.5) * 0.01;
                }

                const court = {
                    id: Date.now(),
                    ...newCourt,
                    lat: lat,
                    lng: lng
                };

                try {
                    await storage.saveCourt(court);
                    const updatedCourts = [...courts, court];
                    setCourts(updatedCourts);
                    setShowAddCourt(false);
                    setNewCourt({
                        name: '',
                        address: '',
                        courts: 4,
                        indoor: false,
                        outdoor: true,
                        rating: 4.0
                    });
                    
                    // Reinitialize map
                    if (mapInstanceRef.current) {
                        mapInstanceRef.current.remove();
                        mapInstanceRef.current = null;
                    }
                    setTimeout(() => {
                        initializeMap(updatedCourts);
                    }, 100);
                    
                    alert('Court added successfully!');
                } catch (error) {
                    console.error('Failed to add court:', error);
                    alert('Failed to add court');
                }
            };

            const handleCreateEvent = (court) => {
                // Store selected court in localStorage for the Games view
                localStorage.setItem('selectedCourtForEvent', JSON.stringify(court));
                setCurrentView('games');
            };

            const initializeMap = (courtsList) => {
                if (mapRef.current && courtsList.length > 0) {
                    const map = L.map(mapRef.current).setView([38.8106, -90.7104], 12);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap contributors'
                    }).addTo(map);
                    
                    courtsList.forEach(court => {
                        const marker = L.marker([court.lat, court.lng]).addTo(map);
                        marker.bindPopup(`<strong>${court.name}</strong><br/>${court.courts} courts`);
                        marker.on('click', () => setSelectedCourt(court));
                    });
                    
                    mapInstanceRef.current = map;
                }
            };

            useEffect(() => {
                if (courts.length > 0 && !mapInstanceRef.current) {
                    initializeMap(courts);
                }
            }, [courts]);

            const filteredCourts = courts.filter(court =>
                court.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                court.address.toLowerCase().includes(searchTerm.toLowerCase())
            );

            return (
                <div className="bg-white rounded-xl shadow-lg p-4 md:p-6">
                    <div className="flex flex-col md:flex-row md:justify-between md:items-center mb-4 gap-4">
                        <h2 className="text-2xl md:text-3xl font-bold text-gray-800">Find Courts 📍</h2>
                        <button
                            onClick={() => setShowAddCourt(!showAddCourt)}
                            className="bg-green-600 text-white px-4 md:px-6 py-2 rounded-lg font-medium hover:bg-green-700 transition-all"
                        >
                            {showAddCourt ? 'Cancel' : '+ Add Court'}
                        </button>
                    </div>

                    {showAddCourt && (
                        <div className="bg-blue-50 border-2 border-blue-300 rounded-lg p-4 md:p-6 mb-6">
                            <h3 className="text-lg md:text-xl font-bold text-gray-800 mb-4">Add New Court</h3>
                            <div className="bg-yellow-50 border-l-4 border-yellow-400 p-3 mb-4">
                                <p className="text-sm text-yellow-800">
                                    <strong>Location Tip:</strong> Include city name in address for better map placement (e.g., "123 Main St, O'Fallon, MO")
                                </p>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Court Name *</label>
                                    <input
                                        type="text"
                                        value={newCourt.name}
                                        onChange={(e) => setNewCourt({...newCourt, name: e.target.value})}
                                        placeholder="e.g., Springfield Park"
                                        className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Address *</label>
                                    <input
                                        type="text"
                                        value={newCourt.address}
                                        onChange={(e) => setNewCourt({...newCourt, address: e.target.value})}
                                        placeholder="123 Main St, City, State"
                                        className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Number of Courts</label>
                                    <input
                                        type="number"
                                        min="1"
                                        value={newCourt.courts}
                                        onChange={(e) => setNewCourt({...newCourt, courts: parseInt(e.target.value) || 1})}
                                        className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Type</label>
                                    <div className="flex space-x-4">
                                        <label className="flex items-center space-x-2">
                                            <input
                                                type="checkbox"
                                                checked={newCourt.indoor}
                                                onChange={(e) => setNewCourt({...newCourt, indoor: e.target.checked})}
                                                className="w-4 h-4"
                                            />
                                            <span>Indoor</span>
                                        </label>
                                        <label className="flex items-center space-x-2">
                                            <input
                                                type="checkbox"
                                                checked={newCourt.outdoor}
                                                onChange={(e) => setNewCourt({...newCourt, outdoor: e.target.checked})}
                                                className="w-4 h-4"
                                            />
                                            <span>Outdoor</span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <button
                                onClick={handleAddCourt}
                                className="w-full mt-4 bg-green-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-green-700 transition-all"
                            >
                                Add Court
                            </button>
                        </div>
                    )}

                    <input
                        type="text"
                        placeholder="Search courts..."
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                        className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none mb-6"
                    />
                    
                    <div className="rounded-lg overflow-hidden shadow-lg mb-6" style={{ height: '400px' }}>
                        <div ref={mapRef} style={{ height: '100%', width: '100%' }}></div>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {filteredCourts.map(court => (
                            <div key={court.id} className="bg-gray-50 border-2 border-gray-200 rounded-lg p-4">
                                <h4 className="font-bold text-lg mb-2">{court.name}</h4>
                                <p className="text-sm text-gray-600 mb-2">{court.address}</p>
                                <div className="flex flex-wrap gap-2 mb-3">
                                    <span className="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm font-medium">
                                        {court.courts} courts
                                    </span>
                                    {court.indoor && (
                                        <span className="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm font-medium">
                                            Indoor
                                        </span>
                                    )}
                                    {court.outdoor && (
                                        <span className="bg-orange-100 text-orange-700 px-3 py-1 rounded-full text-sm font-medium">
                                            Outdoor
                                        </span>
                                    )}
                                </div>
                                <button
                                    onClick={() => handleCreateEvent(court)}
                                    className="w-full bg-green-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-green-700 transition-all text-sm"
                                >
                                    Create Event Here
                                </button>
                            </div>
                        ))}
                    </div>

        // ENHANCED Round Robin View with Singles/Doubles support and guest access
        function RoundRobinView({ currentUser }) {
            const [players, setPlayers] = useState(['']);
            const [courts, setCourts] = useState(1);
            const [numRounds, setNumRounds] = useState(1);
            const [matchFormat, setMatchFormat] = useState('singles'); // 'singles' or 'doubles'
            const [schedule, setSchedule] = useState([]);
            const [scores, setScores] = useState({});
            const [tournamentId, setTournamentId] = useState(null);
            const [savedTournaments, setSavedTournaments] = useState([]);
            const [showLeaderboard, setShowLeaderboard] = useState(false);
            const [saveStatus, setSaveStatus] = useState('');
            const [isPublic, setIsPublic] = useState(false);
            const [tournamentName, setTournamentName] = useState('');
            const [scoresFinalized, setScoresFinalized] = useState(false);

            // Load tournament from URL parameter if present
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const tournamentIdFromUrl = params.get('tournament');
                if (tournamentIdFromUrl) {
                    loadTournament(tournamentIdFromUrl);
                }
            }, []);

            useEffect(() => {
                loadTournaments();
            }, [currentUser]);

            useEffect(() => {
                if (tournamentId && schedule.length > 0) {
                    saveTournament();
                }
            }, [scores, schedule, tournamentId]);

            // Real-time listener for current tournament
            useEffect(() => {
                if (tournamentId && isFirebaseConfigured) {
                    const unsubscribe = storage.listenToTournament(tournamentId, (data) => {
                        if (data && data.scores) {
                            setScores(data.scores);
                        }
                    });
                    // Return cleanup function properly
                    return () => {
                        if (typeof unsubscribe === 'function') {
                            unsubscribe();
                        }
                    };
                }
            }, [tournamentId]);

            const loadTournaments = async () => {
                try {
                    // Use 'guest' as userId for non-logged in users
                    const userId = currentUser?.uid || 'guest';
                    const tournaments = await storage.getAllTournaments(userId);
                    console.log('📋 Loaded tournaments for', userId, ':', tournaments);
                    setSavedTournaments(tournaments.sort((a, b) => b.createdAt - a.createdAt));
                } catch (error) {
                    console.error('Error loading tournaments:', error);
                }
            };

            const saveTournament = async () => {
                if (!tournamentId) return;
                
                // Use consistent userId - 'guest' for non-logged in users
                const userId = currentUser?.uid || 'guest';
                
                // Convert schedule to completely flat structure for Firestore
                const firestoreSchedule = [];
                schedule.forEach((round, roundIndex) => {
                    round.forEach((match, matchIndex) => {
                        firestoreSchedule.push({
                            roundIndex: roundIndex,
                            matchIndex: matchIndex,
                            id: match.id,
                            court: match.court,
                            team1: Array.isArray(match.team1) ? match.team1.join(', ') : match.team1,
                            team2: Array.isArray(match.team2) ? match.team2.join(', ') : match.team2
                        });
                    });
                });
                
                const tournamentData = {
                    id: tournamentId,
                    name: tournamentName || `Tournament ${new Date().toLocaleDateString()}`,
                    players: players.filter(p => p.trim() !== ''),
                    courts,
                    numRounds,
                    matchFormat,
                    scheduleFlat: firestoreSchedule,
                    scores: scores || {},
                    isPublic,
                    participants: [userId, ...players.filter(p => p.trim() !== '').map(p => `player-${p}`)],
                    createdBy: userId,
                    createdAt: Date.now()
                };

                try {
                    setSaveStatus('Saving...');
                    console.log('💾 Saving tournament:', tournamentData);
                    await storage.saveTournament(tournamentData);
                    setSaveStatus('✓ Saved');
                    setTimeout(() => setSaveStatus(''), 2000);
                    await loadTournaments();
                    console.log('✅ Tournament saved successfully!');
                } catch (error) {
                    console.error('Failed to save tournament:', error);
                    console.error('Error details:', error.message);
                    setSaveStatus('✗ Save failed: ' + error.message);
                    setTimeout(() => setSaveStatus(''), 3000);
                }
            };

            const loadTournament = async (id) => {
                try {
                    const data = await storage.getTournament(id);
                    if (data) {
                        console.log('Loading tournament:', data);
                        
                        // Rebuild nested schedule structure from flat data
                        let appSchedule = [];
                        
                        if (data.scheduleFlat) {
                            const roundsMap = {};
                            data.scheduleFlat.forEach(match => {
                                if (!roundsMap[match.roundIndex]) {
                                    roundsMap[match.roundIndex] = [];
                                }
                                
                                // Parse team strings back to arrays
                                const team1 = typeof match.team1 === 'string' 
                                    ? match.team1.split(', ').filter(p => p.trim()) 
                                    : [match.team1];
                                const team2 = typeof match.team2 === 'string' 
                                    ? match.team2.split(', ').filter(p => p.trim()) 
                                    : [match.team2];
                                
                                roundsMap[match.roundIndex].push({
                                    id: match.id,
                                    court: match.court,
                                    team1: team1,
                                    team2: team2
                                });
                            });
                            
                            appSchedule = Object.keys(roundsMap)
                                .sort((a, b) => parseInt(a) - parseInt(b))
                                .map(key => roundsMap[key]);
                        }
                        
                        setTournamentName(data.name || '');
                        setPlayers(data.players);
                        setCourts(data.courts);
                        setNumRounds(data.numRounds);
                        setMatchFormat(data.matchFormat || 'singles');
                        setSchedule(appSchedule);
                        setScores(data.scores || {});
                        setIsPublic(data.isPublic || false);
                        setTournamentId(data.id);
                        setShowLeaderboard(true);
                    }
                } catch (error) {
                    console.error('Tournament not found:', error);
                    alert('Error loading tournament: ' + error.message);
                }
            };

            const deleteTournament = async (id) => {
                if (!confirm('Are you sure you want to delete this tournament?')) return;
                
                try {
                    await storage.deleteTournament(id);
                    await loadTournaments();
                    if (tournamentId === id) {
                        resetTournament();
                    }
                } catch (error) {
                    console.error('Failed to delete tournament:', error);
                }
            };

            const resetTournament = () => {
                setTournamentName('');
                setPlayers(['']);
                setCourts(1);
                setNumRounds(1);
                setSchedule([]);
                setScores({});
                setTournamentId(null);
                setShowLeaderboard(false);
                setIsPublic(false);
            };

            const addPlayer = () => setPlayers([...players, '']);
            const updatePlayer = (index, value) => {
                const newPlayers = [...players];
                newPlayers[index] = value;
                setPlayers(newPlayers);
            };
            const removePlayer = (index) => setPlayers(players.filter((_, i) => i !== index));

            const generateSchedule = () => {
                const validPlayers = players.filter(p => p.trim() !== '');
                
                if (matchFormat === 'singles') {
                    // Singles: minimum 2 players
                    if (validPlayers.length < 2) {
                        alert('Need at least 2 players for singles');
                        return;
                    }
                    
                    const allRounds = [];
                    const playerList = [...validPlayers];
                    
                    if (playerList.length % 2 !== 0) {
                        playerList.push('BYE');
                    }

                    const maxPossibleRounds = playerList.length - 1;
                    const actualRounds = Math.min(numRounds, maxPossibleRounds);
                    const half = playerList.length / 2;

                    for (let round = 0; round < actualRounds; round++) {
                        const roundMatches = [];
                        for (let i = 0; i < half; i++) {
                            const player1 = playerList[i];
                            const player2 = playerList[playerList.length - 1 - i];
                            
                            if (player1 !== 'BYE' && player2 !== 'BYE') {
                                const matchId = `r${round}-m${i}`;
                                roundMatches.push({
                                    id: matchId,
                                    court: (i % courts) + 1,
                                    team1: [player1],
                                    team2: [player2]
                                });
                            }
                        }
                        allRounds.push(roundMatches);
                        playerList.splice(1, 0, playerList.pop());
                    }
                    
                    setSchedule(allRounds);
                } else {
                    // Doubles: minimum 4 players
                    if (validPlayers.length < 4) {
                        alert('Need at least 4 players for doubles');
                        return;
                    }
                    
                    const allRounds = [];
                    let playerPool = [...validPlayers];
                    
                    // Add BYE if odd number
                    if (playerPool.length % 2 !== 0) {
                        playerPool.push('BYE');
                    }
                    
                    const totalPlayers = playerPool.length;
                    const matchesPerRound = Math.floor(totalPlayers / 4);
                    
                    // Proper round-robin rotation (Berger tables algorithm)
                    for (let round = 0; round < numRounds; round++) {
                        const roundMatches = [];
                        const roundPlayers = [];
                        
                        // Build the player list for this round with rotation
                        if (round === 0) {
                            roundPlayers.push(...playerPool);
                        } else {
                            // Keep first player fixed, rotate others
                            roundPlayers.push(playerPool[0]);
                            for (let i = 1; i < totalPlayers; i++) {
                                const rotatedIndex = ((i - 1 + round) % (totalPlayers - 1)) + 1;
                                roundPlayers.push(playerPool[rotatedIndex]);
                            }
                        }
                        
                        // Create matches for this round
                        let courtNum = 0;
                        const playersInMatches = [];
                        
                        // Pair players: 0-1 vs 2-3, 4-5 vs 6-7, etc.
                        for (let i = 0; i < roundPlayers.length && courtNum < matchesPerRound; i += 4) {
                            if (i + 3 < roundPlayers.length) {
                                const p1 = roundPlayers[i];
                                const p2 = roundPlayers[i + 1];
                                const p3 = roundPlayers[i + 2];
                                const p4 = roundPlayers[i + 3];
                                
                                // Skip if any player is BYE
                                if (p1 !== 'BYE' && p2 !== 'BYE' && p3 !== 'BYE' && p4 !== 'BYE') {
                                    const matchId = `r${round}-m${courtNum}`;
                                    roundMatches.push({
                                        id: matchId,
                                        court: (courtNum % courts) + 1,
                                        team1: [p1, p2],
                                        team2: [p3, p4]
                                    });
                                    playersInMatches.push(p1, p2, p3, p4);
                                    courtNum++;
                                }
                            }
                        }
                        
                        // Find BYE player (player not in any match this round)
                        const byePlayer = roundPlayers.find(p => 
                            p !== 'BYE' && !playersInMatches.includes(p)
                        );
                        
                        if (byePlayer) {
                            roundMatches.byePlayer = byePlayer;
                        }
                        
                        allRounds.push(roundMatches);
                    }
                    
                    setSchedule(allRounds);
                }
                
                setScores({});
                const newTournamentId = `tournament-${Date.now()}`;
                setTournamentId(newTournamentId);
                setShowLeaderboard(false);
            };

            const updateScore = (matchId, team, score) => {
                setScores(prev => ({
                    ...prev,
                    [matchId]: {
                        ...prev[matchId],
                        [team]: parseInt(score) || 0
                    }
                }));
            };

            const calculateLeaderboard = () => {
                const validPlayers = players.filter(p => p.trim() !== '');
                const playerStats = {};

                validPlayers.forEach(player => {
                    playerStats[player] = {
                        name: player,
                        wins: 0,
                        losses: 0,
                        pointsFor: 0,
                        pointsAgainst: 0,
                        matchesPlayed: 0
                    };
                });

                schedule.forEach(round => {
                    round.forEach(match => {
                        const matchScore = scores[match.id];
                        if (matchScore && matchScore.team1 !== undefined && matchScore.team2 !== undefined) {
                            const team1Score = parseInt(matchScore.team1) || 0;
                            const team2Score = parseInt(matchScore.team2) || 0;

                            // Handle both singles and doubles
                            match.team1.forEach(player => {
                                if (playerStats[player]) {
                                    playerStats[player].matchesPlayed++;
                                    playerStats[player].pointsFor += team1Score;
                                    playerStats[player].pointsAgainst += team2Score;
                                    if (team1Score > team2Score) {
                                        playerStats[player].wins++;
                                    } else if (team2Score > team1Score) {
                                        playerStats[player].losses++;
                                    }
                                }
                            });

                            match.team2.forEach(player => {
                                if (playerStats[player]) {
                                    playerStats[player].matchesPlayed++;
                                    playerStats[player].pointsFor += team2Score;
                                    playerStats[player].pointsAgainst += team1Score;
                                    if (team2Score > team1Score) {
                                        playerStats[player].wins++;
                                    } else if (team1Score > team2Score) {
                                        playerStats[player].losses++;
                                    }
                                }
                            });
                        }
                    });
                });

                return Object.values(playerStats).sort((a, b) => {
                    if (b.wins !== a.wins) return b.wins - a.wins;
                    return (b.pointsFor - b.pointsAgainst) - (a.pointsFor - a.pointsAgainst);
                });
            };

            const getRoundWinner = (roundMatches) => {
                const roundScores = {};
                roundMatches.forEach(match => {
                    const matchScore = scores[match.id];
                    if (matchScore) {
                        const p1 = match.team1[0];
                        const p2 = match.team2[0];
                        roundScores[p1] = (roundScores[p1] || 0) + (matchScore.team1 || 0);
                        roundScores[p2] = (roundScores[p2] || 0) + (matchScore.team2 || 0);
                    }
                });
                
                let maxScore = -1;
                let winner = null;
                Object.entries(roundScores).forEach(([player, score]) => {
                    if (score > maxScore) {
                        maxScore = score;
                        winner = player;
                    }
                });
                return winner;
            };

            const leaderboard = schedule.length > 0 ? calculateLeaderboard() : [];

            return (
                <div className="max-w-6xl mx-auto">
                    <div className="bg-white rounded-xl shadow-lg p-4 md:p-8">
                        <div className="flex flex-col md:flex-row md:justify-between md:items-center mb-6 space-y-4 md:space-y-0">
                            <h2 className="text-2xl md:text-3xl font-bold text-gray-800">Round Robin Tournament 🔄</h2>
                            <div className="flex flex-wrap items-center gap-2">
                                {tournamentId && schedule.length > 0 && (
                                    <>
                                        <button
                                            onClick={() => {
                                                const url = window.location.origin + window.location.pathname + '?tournament=' + tournamentId;
                                                navigator.clipboard.writeText(url).then(() => {
                                                    alert('✓ Tournament link copied to clipboard! Share it with others.');

                                                    prompt('Copy this link:', url);

                                            className="bg-blue-600 text-white px-3 md:px-4 py-2 rounded-lg font-medium hover:bg-blue-700 transition-all text-xs md:text-sm"
                                        >
                                            📋 Share Link
                                        </button>
                                        <button
                                            onClick={() => {
                                                if (scoresFinalized) {
                                                    alert('Scores are already finalized!');
                                                    return;
                                                }
                                                if (confirm('Finalize scores? This will make them read-only. You cannot undo this action.')) {
                                                    setScoresFinalized(true);
                                                    alert('✓ Scores finalized! They are now read-only.');
                                                }
                                            }}
                                            className={`px-3 md:px-4 py-2 rounded-lg font-medium transition-all text-xs md:text-sm ${
                                                scoresFinalized 
                                                    ? 'bg-gray-400 text-white cursor-not-allowed' 
                                                    : 'bg-purple-600 text-white hover:bg-purple-700'
                                            }`}
                                            disabled={scoresFinalized}
                                        >
                                            {scoresFinalized ? '🔒 Finalized' : '✓ Finalize'}
                                        </button>
                                    </>
                                )}
                                {saveStatus && (
                                    <span className={`px-3 md:px-4 py-2 rounded-lg font-medium text-xs md:text-sm ${
                                        saveStatus.includes('✓') ? 'bg-green-100 text-green-700' : 
                                        saveStatus.includes('✗') ? 'bg-red-100 text-red-700' : 
                                        'bg-blue-100 text-blue-700'
                                    }`}>
                                        {saveStatus}
                                    </span>
                                )}
                                {schedule.length > 0 && (
                                    <button 
                                        onClick={resetTournament}
                                        className="bg-gray-600 text-white px-4 md:px-6 py-2 rounded-lg font-medium hover:bg-gray-700 transition-all text-sm md:text-base"
                                    >
                                        New Tournament
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* Saved Tournaments */}
                        {savedTournaments.length > 0 && schedule.length === 0 && (
                            <div className="mb-8">
                                <h3 className="text-lg md:text-xl font-bold text-gray-800 mb-4">Your Tournaments</h3>
                                <div className="space-y-3">
                                    {savedTournaments.map(tournament => (
                                        <div key={tournament.id} className="bg-gray-50 border-2 border-gray-200 rounded-lg p-3 md:p-4 flex flex-col md:flex-row md:items-center md:justify-between space-y-3 md:space-y-0">
                                            <div className="flex-1">
                                                <div className="flex flex-wrap items-center gap-2 mb-1">
                                                    <p className="font-medium text-gray-800">{tournament.name}</p>
                                                    {tournament.isPublic ? (
                                                        <span className="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs font-medium">🌍 Public</span>
                                                    ) : (
                                                        <span className="bg-purple-100 text-purple-700 px-2 py-1 rounded text-xs font-medium">🔒 Private</span>
                                                    )}
                                                    <span className="bg-gray-100 text-gray-700 px-2 py-1 rounded text-xs font-medium">
                                                        {tournament.matchFormat === 'doubles' ? '👥 Doubles' : '1️⃣ Singles'}
                                                    </span>
                                                </div>
                                                <p className="text-sm text-gray-600">
                                                    {tournament.players.length} players, {tournament.numRounds} rounds
                                                </p>
                                                <p className="text-xs text-gray-500">
                                                    {new Date(tournament.createdAt).toLocaleDateString()}
                                                </p>
                                            </div>
                                            <div className="flex space-x-2">
                                                <button 
                                                    onClick={() => loadTournament(tournament.id)}
                                                    className="flex-1 md:flex-none bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition-all text-sm"
                                                >
                                                    Load
                                                </button>
                                                <button 
                                                    onClick={() => deleteTournament(tournament.id)}
                                                    className="flex-1 md:flex-none bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition-all text-sm"
                                                >
                                                    Delete
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {schedule.length === 0 && (
                            <>
                                <div className="mb-6">
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Tournament Name</label>
                                    <input

                                    />

                                <div className="mb-6 space-y-4">
                                    <label className="flex items-center space-x-3 cursor-pointer">

                                        <div>
                                            <span className="font-medium text-gray-800">
                                                {isPublic ? '🌍 Public Tournament' : '🔒 Private Tournament'}

                                                    : 'Only participants can see this tournament'}

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">Match Format</label>

                                                <span className="text-gray-700">1️⃣ Singles (1v1)</span>

                                                    checked={matchFormat === 'doubles'}
                                                    onChange={(e) => setMatchFormat(e.target.value)}
                                                    className="w-4 h-4 text-green-600"
                                                />
                                                <span className="text-gray-700">👥 Doubles (2v2)</span>

                                        </div>
                                        <p className="text-xs text-gray-500 mt-2">
                                            {matchFormat === 'singles' ? 'Minimum 2 players' : 'Minimum 4 players (must be even)'}

                                <div className="mb-8">

                                        {players.map((player, index) => (

                                                {players.length > 1 && (
                                                    <button 
                                                        onClick={() => removePlayer(index)}

                                                    >
                                                        Remove

                                    </div>
                                    <button 
                                        onClick={addPlayer}

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 mb-8">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">Number of Courts</label>
                                        <select

                                            onChange={(e) => setCourts(parseInt(e.target.value))}
                                            className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none"
                                        >
                                            {[1, 2, 3, 4, 5, 6].map(n => (

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">Number of Rounds</label>
                                        <input

                                            onChange={(e) => setNumRounds(parseInt(e.target.value) || 1)}
                                            className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none"

                                <button

                        {schedule.length > 0 && (
                            <>

                                        <button

                                            className="bg-purple-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-purple-700 transition-all shadow-lg"
                                        >
                                            {showLeaderboard ? 'Hide Leaderboard' : 'Show Leaderboard'}
                                        </button>

                                {showLeaderboard && (
                                    <div className="mb-8 bg-gradient-to-r from-yellow-50 to-orange-50 border-2 border-yellow-300 rounded-xl p-4 md:p-6">
                                        <h3 className="text-xl md:text-2xl font-bold text-gray-800 mb-4 flex items-center">
                                            🏆 Overall Leaderboard
                                        </h3>
                                        <div className="space-y-2">
                                            {leaderboard.map((player, index) => (
                                                <div 
                                                    key={player.name} 
                                                    className={`bg-white rounded-lg p-3 md:p-4 ${
                                                        index === 0 ? 'border-4 border-yellow-400 shadow-lg' : 'border-2 border-gray-200'
                                                    }`}
                                                >
                                                    <div className="flex items-start justify-between gap-3">
                                                        <div className="flex items-center gap-2 md:gap-4 min-w-0 flex-1">
                                                            <span className={`text-xl md:text-2xl font-bold flex-shrink-0 ${
                                                                index === 0 ? 'text-yellow-500' :
                                                                index === 1 ? 'text-gray-400' :

                                                                {index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `#${index + 1}`}
                                                            </span>
                                                            <span className={`font-bold truncate ${index === 0 ? 'text-base md:text-xl' : 'text-sm md:text-lg'}`}>
                                                                {player.name}
                                                            </span>
                                                        </div>
                                                        <div className="flex gap-3 md:gap-6 text-xs md:text-sm flex-shrink-0">
                                                            <div className="text-center">

                                <div className="space-y-6">

                                    {schedule.map((round, roundIndex) => {
                                        return (
                                            <div key={roundIndex} className="bg-green-50 border-2 border-green-200 rounded-lg p-4 md:p-6">
                                                <div className="flex flex-col md:flex-row md:items-center md:justify-between mb-4 gap-2">
                                                    <h4 className="text-lg md:text-xl font-bold text-gray-800">Round {roundIndex + 1}</h4>
                                                    {round.byePlayer && (
                                                        <span className="bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full text-sm font-medium">
                                                            ⏸️ BYE: {round.byePlayer}
                                                        </span>
