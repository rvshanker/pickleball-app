<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PickleConnect - Pickleball Tournament Generator</title>
    <meta name="description" content="Create pickleball tournaments instantly. Track scores, manage courts, and share with players.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%2316a34a'/%3E%3Ctext x='50' y='50' font-family='Arial, sans-serif' font-size='60' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='central'%3EP%3C/text%3E%3C/svg%3E">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }
        
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        /* Smooth transitions */
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ============================================
        // FIREBASE CONFIGURATION
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyDaFUszTD0-Ro292GOBSlS5vkZSdJM0NF4",
            authDomain: "pickleball-app-1bba7.firebaseapp.com",
            projectId: "pickleball-app-1bba7",
            storageBucket: "pickleball-app-1bba7.firebasestorage.app",
            messagingSenderId: "645604154338",
            appId: "1:645604154338:web:b92f87c2cd11d950b737bb",
            measurementId: "G-WM2DMSZM7F"
        };

        let db = null;
        let auth = null;
        let isFirebaseConfigured = false;

        // Suppress Firebase permission errors
        const originalConsoleError = console.error;
        console.error = function(...args) {
            const errorString = args.join(' ');
            if (errorString.includes('permission-denied') || 
                errorString.includes('Missing or insufficient permissions') ||
                errorString.includes('Firestore')) {
                return;
            }
            originalConsoleError.apply(console, args);
        };

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            auth = firebase.auth();
            isFirebaseConfigured = true;
            console.log("✅ Firebase initialized successfully!");
        } catch (error) {
            console.log("Firebase initialization failed - using localStorage");
            isFirebaseConfigured = false;
        }

        // ============================================
        // STORAGE LAYER (Firebase + localStorage fallback)
        // ============================================
        const storage = {
            async saveTournament(tournamentData) {
                if (isFirebaseConfigured && db) {
                    try {
                        await db.collection('tournaments').doc(tournamentData.id).set(tournamentData);
                        console.log('✅ Saved to Firebase');
                        return true;
                    } catch (error) {
                        console.log('⚠️ Firebase failed, using localStorage');
                    }
                }
                // Fallback to localStorage
                const key = `tournament:${tournamentData.id}`;
                localStorage.setItem(key, JSON.stringify(tournamentData));
                
                // Also save to index
                const index = JSON.parse(localStorage.getItem('tournament:index') || '[]');
                if (!index.includes(tournamentData.id)) {
                    index.push(tournamentData.id);
                    localStorage.setItem('tournament:index', JSON.stringify(index));
                }
                
                console.log('✅ Saved to localStorage');
                return true;
            },
            
            async getTournament(id) {
                if (isFirebaseConfigured && db) {
                    try {
                        const doc = await db.collection('tournaments').doc(id).get();
                        if (doc.exists) {
                            return doc.data();
                        }
                    } catch (error) {
                        console.log("Firebase get failed, trying localStorage");
                    }
                }
                // Fallback to localStorage
                const key = `tournament:${id}`;
                const data = localStorage.getItem(key);
                return data ? JSON.parse(data) : null;
            },
            
            async getAllTournaments() {
                if (isFirebaseConfigured && db) {
                    try {
                        const snapshot = await db.collection('tournaments').get();
                        return snapshot.docs.map(doc => doc.data());
                    } catch (error) {
                        console.log("Firebase getAll failed, trying localStorage");
                    }
                }
                // Fallback to localStorage
                const index = JSON.parse(localStorage.getItem('tournament:index') || '[]');
                const tournaments = [];
                for (const id of index) {
                    const tournament = await this.getTournament(id);
                    if (tournament) tournaments.push(tournament);
                }
                return tournaments;
            },
            
            async deleteTournament(id) {
                if (isFirebaseConfigured && db) {
                    try {
                        await db.collection('tournaments').doc(id).delete();
                        console.log('✅ Deleted from Firebase');
                    } catch (error) {
                        console.log('⚠️ Firebase delete failed');
                    }
                }
                // Also delete from localStorage
                const key = `tournament:${id}`;
                localStorage.removeItem(key);
                
                const index = JSON.parse(localStorage.getItem('tournament:index') || '[]');
                const newIndex = index.filter(tid => tid !== id);
                localStorage.setItem('tournament:index', JSON.stringify(newIndex));
                
                console.log('✅ Deleted from localStorage');
            }
        };

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================
        
        function generateId() {
            return Math.random().toString(36).substring(2, 15) + 
                   Math.random().toString(36).substring(2, 15);
        }
        
        function generateSchedule(participants, courts, rounds) {
            const players = participants.map((p, i) => p || `Player ${i + 1}`);
            const stats = {};
            
            players.forEach(id => {
                stats[id] = { games: 0, partners: {}, opponents: {} };
            });
            
            const scheduleData = [];
            
            for (let round = 1; round <= rounds; round++) {
                // Sort by least games played
                players.sort((a, b) => stats[a].games - stats[b].games);
                
                const playingCount = Math.min(courts * 4, players.length);
                let playing = players.slice(0, playingCount);
                const sitting = players.slice(playingCount);
                
                const matches = [];
                
                // Greedy match assignment
                while (playing.length >= 4) {
                    let bestScore = Infinity;
                    let bestMatch = null;
                    
                    for (let a = 0; a < playing.length; a++) {
                        for (let b = a + 1; b < playing.length; b++) {
                            for (let c = b + 1; c < playing.length; c++) {
                                for (let d = c + 1; d < playing.length; d++) {
                                    const p1 = playing[a], p2 = playing[b];
                                    const p3 = playing[c], p4 = playing[d];
                                    
                                    const score =
                                        (stats[p1].partners[p2] || 0) +
                                        (stats[p3].partners[p4] || 0) +
                                        (stats[p1].opponents[p3] || 0) +
                                        (stats[p1].opponents[p4] || 0) +
                                        (stats[p2].opponents[p3] || 0) +
                                        (stats[p2].opponents[p4] || 0);
                                    
                                    if (score < bestScore) {
                                        bestScore = score;
                                        bestMatch = { team1: [p1, p2], team2: [p3, p4] };
                                    }
                                }
                            }
                        }
                    }
                    
                    if (!bestMatch) break;
                    
                    matches.push({
                        id: `r${round}m${matches.length + 1}`,
                        ...bestMatch
                    });
                    
                    playing = playing.filter(p =>
                        !bestMatch.team1.includes(p) && !bestMatch.team2.includes(p)
                    );
                }
                
                // Update stats
                matches.forEach(m => {
                    [...m.team1, ...m.team2].forEach(p => stats[p].games++);
                    
                    stats[m.team1[0]].partners[m.team1[1]] = (stats[m.team1[0]].partners[m.team1[1]] || 0) + 1;
                    stats[m.team1[1]].partners[m.team1[0]] = (stats[m.team1[1]].partners[m.team1[0]] || 0) + 1;
                    stats[m.team2[0]].partners[m.team2[1]] = (stats[m.team2[0]].partners[m.team2[1]] || 0) + 1;
                    stats[m.team2[1]].partners[m.team2[0]] = (stats[m.team2[1]].partners[m.team2[0]] || 0) + 1;
                    
                    m.team1.forEach(p1 => {
                        m.team2.forEach(p2 => {
                            stats[p1].opponents[p2] = (stats[p1].opponents[p2] || 0) + 1;
                            stats[p2].opponents[p1] = (stats[p2].opponents[p1] || 0) + 1;
                        });
                    });
                });
                
                scheduleData.push({ round, matches, sitting });
            }
            
            return { schedule: scheduleData, stats };
        }

        // ============================================
        // COMPONENTS
        // ============================================
        
        // Landing Page - Simple Tournament Generator (No Auth Required)
        function LandingPage({ onTournamentCreated, onShowAuth }) {
            const [formData, setFormData] = useState({
                name: '',
                participants: [],
                courts: 3,
                rounds: 10
            });
            const [participantInput, setParticipantInput] = useState('');
            
            const addParticipant = () => {
                if (participantInput.trim()) {
                    setFormData(prev => ({
                        ...prev,
                        participants: [...prev.participants, participantInput.trim()]
                    }));
                    setParticipantInput('');
                }
            };
            
            const removeParticipant = (index) => {
                setFormData(prev => ({
                    ...prev,
                    participants: prev.participants.filter((_, i) => i !== index)
                }));
            };
            
            const createTournament = async () => {
                if (formData.participants.length < 4) {
                    alert('Minimum 4 participants required');
                    return;
                }
                
                const { schedule, stats } = generateSchedule(
                    formData.participants,
                    formData.courts,
                    formData.rounds
                );
                
                const tournament = {
                    id: generateId(),
                    name: formData.name || 'Quick Tournament',
                    participants: formData.participants,
                    courts: formData.courts,
                    rounds: formData.rounds,
                    schedule,
                    stats,
                    scores: {},
                    isPublic: true,
                    createdBy: 'anonymous',
                    createdAt: new Date().toISOString()
                };
                
                await storage.saveTournament(tournament);
                
                // Update URL for sharing
                window.history.pushState({}, '', `/t/${tournament.id}`);
                
                onTournamentCreated(tournament);
            };
            
            return (
                <div className="min-h-screen bg-gray-50">
                    {/* Hero Header */}
                    <div className="bg-slate-900 p-8 text-white">
                        <div className="max-w-6xl mx-auto">
                            <h1 className="text-3xl md:text-4xl font-black italic tracking-tight">
                                PICKLE<span className="text-green-400">CONNECT</span>
                            </h1>
                            <p className="text-slate-400 text-sm mt-1">
                                Create tournaments in seconds
                            </p>
                        </div>
                    </div>
                    
                    {/* Main Form */}
                    <div className="max-w-4xl mx-auto p-6 md:p-8">
                        <div className="bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100 fade-in">
                            <div className="p-6 md:p-8">
                                <h2 className="text-2xl font-black uppercase mb-6 text-slate-900">
                                    Quick Tournament Generator
                                </h2>
                                
                                {/* Tournament Name */}
                                <div className="mb-6">
                                    <label className="text-xs font-black text-gray-400 uppercase block mb-2">
                                        Tournament Name
                                    </label>
                                    <input
                                        type="text"
                                        value={formData.name}
                                        onChange={(e) => setFormData(prev => ({ ...prev, name: e.target.value }))}
                                        placeholder="e.g., Saturday Morning Mixer"
                                        className="w-full bg-gray-100 rounded-2xl p-4 font-bold focus:outline-none focus:ring-2 focus:ring-green-500"
                                    />
                                </div>
                                
                                {/* Participants */}
                                <div className="mb-6">
                                    <label className="text-xs font-black text-gray-400 uppercase block mb-2">
                                        Add Participants (Min. 4)
                                    </label>
                                    <div className="flex gap-2 mb-3">
                                        <input
                                            type="text"
                                            value={participantInput}
                                            onChange={(e) => setParticipantInput(e.target.value)}
                                            onKeyPress={(e) => e.key === 'Enter' && addParticipant()}
                                            placeholder="Enter player name"
                                            className="flex-1 bg-gray-100 rounded-2xl p-4 font-bold focus:outline-none focus:ring-2 focus:ring-green-500"
                                        />
                                        <button
                                            onClick={addParticipant}
                                            className="bg-green-500 hover:bg-green-600 text-white font-black px-6 rounded-2xl"
                                        >
                                            ADD
                                        </button>
                                    </div>
                                    
                                    {/* Participant List */}
                                    {formData.participants.length > 0 && (
                                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2">
                                            {formData.participants.map((participant, index) => (
                                                <div
                                                    key={index}
                                                    className="bg-gray-100 rounded-xl p-2 flex items-center justify-between text-sm"
                                                >
                                                    <span className="font-medium truncate">{participant}</span>
                                                    <button
                                                        onClick={() => removeParticipant(index)}
                                                        className="text-red-500 hover:text-red-700 ml-1"
                                                    >
                                                        ✕
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                                
                                {/* Courts and Rounds */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                                    <div>
                                        <label className="text-xs font-black text-gray-400 uppercase block mb-2">
                                            Courts Available
                                        </label>
                                        <input
                                            type="number"
                                            min="1"
                                            value={formData.courts}
                                            onChange={(e) => setFormData(prev => ({ ...prev, courts: parseInt(e.target.value) || 1 }))}
                                            className="w-full bg-gray-100 rounded-2xl p-4 font-bold focus:outline-none focus:ring-2 focus:ring-green-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs font-black text-gray-400 uppercase block mb-2">
                                            Number of Rounds
                                        </label>
                                        <input
                                            type="number"
                                            min="1"
                                            value={formData.rounds}
                                            onChange={(e) => setFormData(prev => ({ ...prev, rounds: parseInt(e.target.value) || 1 }))}
                                            className="w-full bg-gray-100 rounded-2xl p-4 font-bold focus:outline-none focus:ring-2 focus:ring-green-500"
                                        />
                                    </div>
                                </div>
                                
                                {/* Generate Button */}
                                <button
                                    onClick={createTournament}
                                    className="w-full bg-green-500 hover:bg-green-600 text-white font-black py-5 rounded-2xl shadow-lg uppercase tracking-widest transition-colors"
                                >
                                    Generate Tournament
                                </button>
                                
                                {/* Auth Prompt */}
                                <div className="mt-6 text-center">
                                    <p className="text-sm text-gray-500">
                                        Want to track scores and save tournaments?{' '}
                                        <button
                                            onClick={onShowAuth}
                                            className="text-green-600 font-bold hover:text-green-700"
                                        >
                                            Sign in
                                        </button>
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }
        
        // Tournament View - Display schedule and allow score tracking
        function TournamentView({ tournament, user, onBack, onDelete, onScoreUpdate }) {
            const [scores, setScores] = useState(tournament.scores || {});
            const [scoresFinalized, setScoresFinalized] = useState(false);
            
            const isOwner = user && tournament.createdBy === user.uid;
            const canEdit = isOwner || tournament.createdBy === 'anonymous';
            
            const updateScore = (matchId, team, value) => {
                if (scoresFinalized) return;
                
                const newScores = {
                    ...scores,
                    [matchId]: {
                        ...scores[matchId],
                        [team]: value
                    }
                };
                
                setScores(newScores);
                
                if (onScoreUpdate) {
                    onScoreUpdate(newScores);
                }
            };
            
            const finalizeScores = async () => {
                setScoresFinalized(true);
                const updatedTournament = { ...tournament, scores };
                await storage.saveTournament(updatedTournament);
                alert('Scores saved successfully!');
            };
            
            const shareUrl = `${window.location.origin}/t/${tournament.id}`;
            
            const copyShareLink = async () => {
                try {
                    if (navigator.share) {
                        await navigator.share({
                            title: tournament.name,
                            text: `Check out this pickleball tournament!`,
                            url: shareUrl
                        });
                    } else {
                        await navigator.clipboard.writeText(shareUrl);
                        alert('Share link copied to clipboard!');
                    }
                } catch (error) {
                    console.log('Share failed:', error);
                }
            };
            
            return (
                <div className="min-h-screen bg-gray-50">
                    {/* Header */}
                    <div className="bg-slate-900 p-6 text-white">
                        <div className="max-w-6xl mx-auto">
                            <div className="flex items-center justify-between mb-4">
                                <button
                                    onClick={onBack}
                                    className="text-sm text-slate-400 hover:text-white"
                                >
                                    ← Back
                                </button>
                                
                                {isOwner && (
                                    <span className="bg-green-500 text-white text-xs px-3 py-1 rounded-full font-bold">
                                        👑 Your Tournament
                                    </span>
                                )}
                            </div>
                            
                            <h1 className="text-2xl md:text-3xl font-black">
                                {tournament.name}
                            </h1>
                            <p className="text-slate-400 text-sm mt-1">
                                {tournament.participants.length} players • {tournament.courts} courts • {tournament.rounds} rounds
                            </p>
                        </div>
                    </div>
                    
                    {/* Action Buttons */}
                    <div className="max-w-6xl mx-auto p-6">
                        <div className="flex flex-wrap gap-3 mb-6">
                            <button
                                onClick={copyShareLink}
                                className="bg-green-500 hover:bg-green-600 text-white font-bold px-6 py-3 rounded-xl"
                            >
                                📤 Share Tournament
                            </button>
                            
                            {canEdit && !scoresFinalized && (
                                <button
                                    onClick={finalizeScores}
                                    className="bg-blue-500 hover:bg-blue-600 text-white font-bold px-6 py-3 rounded-xl"
                                >
                                    💾 Save Scores
                                </button>
                            )}
                            
                            {isOwner && onDelete && (
                                <button
                                    onClick={() => {
                                        if (confirm('Are you sure you want to delete this tournament?')) {
                                            onDelete(tournament.id);
                                        }
                                    }}
                                    className="bg-red-500 hover:bg-red-600 text-white font-bold px-6 py-3 rounded-xl"
                                >
                                    🗑️ Delete
                                </button>
                            )}
                        </div>
                        
                        {/* Read-only notice */}
                        {!canEdit && (
                            <div className="bg-blue-50 border-l-4 border-blue-500 p-4 mb-6 rounded-lg">
                                <p className="text-blue-700 text-sm">
                                    📖 <strong>Read-only view.</strong> Only the tournament creator can update scores.
                                </p>
                            </div>
                        )}
                        
                        {/* Balance Stats */}
                        <div className="bg-white rounded-3xl shadow-lg p-6 mb-6">
                            <h2 className="text-sm font-black text-gray-400 uppercase mb-4">
                                Games Played Per Player
                            </h2>
                            <div className="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-8 gap-3">
                                {Object.entries(tournament.stats).map(([player, stat]) => (
                                    <div key={player} className="bg-gray-50 border p-3 rounded-2xl text-center shadow-sm">
                                        <div className="text-xs text-gray-400 truncate">{player}</div>
                                        <div className="text-xl font-bold text-green-600">{stat.games}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                        
                        {/* Schedule */}
                        <div className="space-y-8">
                            {tournament.schedule.map(({ round, matches, sitting }) => (
                                <div key={round} className="bg-white rounded-3xl shadow-lg p-6 border-l-4 border-green-500">
                                    <div className="flex justify-between items-start mb-4">
                                        <h3 className="text-xl font-black uppercase">Round {round}</h3>
                                        
                                        {sitting.length > 0 && (
                                            <div className="flex flex-wrap gap-2 justify-end">
                                                {sitting.map(player => (
                                                    <span key={player} className="bg-red-50 text-red-500 text-xs px-2 py-1 rounded">
                                                        Bye: {player}
                                                    </span>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                    
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                        {matches.map((match, i) => {
                                            const team1Score = scores[match.id]?.team1 || '';
                                            const team2Score = scores[match.id]?.team2 || '';
                                            const winner = team1Score && team2Score
                                                ? (parseInt(team1Score) > parseInt(team2Score) 
                                                    ? match.team1.join(', ') 
                                                    : match.team2.join(', '))
                                                : null;
                                            
                                            return (
                                                <div key={match.id} className="bg-gray-50 p-4 rounded-2xl border">
                                                    <div className="text-xs text-gray-400 mb-3 text-center">
                                                        Court {i + 1}
                                                    </div>
                                                    
                                                    {/* Team 1 */}
                                                    <div className="flex items-center justify-between mb-2">
                                                        <span className={`text-sm font-bold flex-1 ${winner === match.team1.join(', ') ? 'text-green-600' : 'text-blue-600'}`}>
                                                            {winner === match.team1.join(', ') && '🏆 '}
                                                            {match.team1.join(' & ')}
                                                        </span>
                                                        <input
                                                            type="number"
                                                            min="0"
                                                            value={team1Score}
                                                            onChange={(e) => updateScore(match.id, 'team1', e.target.value)}
                                                            placeholder="0"
                                                            disabled={!canEdit || scoresFinalized}
                                                            className={`w-14 px-2 py-2 border-2 rounded-lg text-center font-bold focus:outline-none ml-2 ${
                                                                !canEdit || scoresFinalized
                                                                    ? 'bg-gray-100 border-gray-300 cursor-not-allowed'
                                                                    : 'bg-white border-gray-300 focus:border-green-500'
                                                            }`}
                                                        />
                                                    </div>
                                                    
                                                    <div className="text-center text-gray-400 text-xs my-2">VS</div>
                                                    
                                                    {/* Team 2 */}
                                                    <div className="flex items-center justify-between">
                                                        <span className={`text-sm font-bold flex-1 ${winner === match.team2.join(', ') ? 'text-green-600' : 'text-red-600'}`}>
                                                            {winner === match.team2.join(', ') && '🏆 '}
                                                            {match.team2.join(' & ')}
                                                        </span>
                                                        <input
                                                            type="number"
                                                            min="0"
                                                            value={team2Score}
                                                            onChange={(e) => updateScore(match.id, 'team2', e.target.value)}
                                                            placeholder="0"
                                                            disabled={!canEdit || scoresFinalized}
                                                            className={`w-14 px-2 py-2 border-2 rounded-lg text-center font-bold focus:outline-none ml-2 ${
                                                                !canEdit || scoresFinalized
                                                                    ? 'bg-gray-100 border-gray-300 cursor-not-allowed'
                                                                    : 'bg-white border-gray-300 focus:border-green-500'
                                                            }`}
                                                        />
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }
        
        // Auth Modal
        function AuthModal({ onClose, onAuthSuccess }) {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            
            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                
                try {
                    if (isLogin) {
                        await auth.signInWithEmailAndPassword(email, password);
                    } else {
                        await auth.createUserWithEmailAndPassword(email, password);
                    }
                    onAuthSuccess();
                    onClose();
                } catch (error) {
                    setError(error.message);
                }
            };
            
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-black">
                                {isLogin ? 'Sign In' : 'Create Account'}
                            </h2>
                            <button onClick={onClose} className="text-gray-400 hover:text-gray-600">
                                ✕
                            </button>
                        </div>
                        
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="text-xs font-black text-gray-400 uppercase block mb-2">
                                    Email
                                </label>
                                <input
                                    type="email"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    required
                                    className="w-full bg-gray-100 rounded-2xl p-4 font-bold focus:outline-none focus:ring-2 focus:ring-green-500"
                                />
                            </div>
                            
                            <div>
                                <label className="text-xs font-black text-gray-400 uppercase block mb-2">
                                    Password
                                </label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    required
                                    className="w-full bg-gray-100 rounded-2xl p-4 font-bold focus:outline-none focus:ring-2 focus:ring-green-500"
                                />
                            </div>
                            
                            {error && (
                                <div className="bg-red-50 text-red-600 p-3 rounded-xl text-sm">
                                    {error}
                                </div>
                            )}
                            
                            <button
                                type="submit"
                                className="w-full bg-green-500 hover:bg-green-600 text-white font-black py-4 rounded-2xl uppercase"
                            >
                                {isLogin ? 'Sign In' : 'Create Account'}
                            </button>
                        </form>
                        
                        <button
                            onClick={() => setIsLogin(!isLogin)}
                            className="w-full text-center text-sm text-gray-500 mt-4 hover:text-gray-700"
                        >
                            {isLogin ? "Don't have an account? Sign up" : 'Already have an account? Sign in'}
                        </button>
                    </div>
                </div>
            );
        }
        
        // My Tournaments List
        function MyTournaments({ user, onSelectTournament, onBack }) {
            const [tournaments, setTournaments] = useState([]);
            
            useEffect(() => {
                loadTournaments();
            }, []);
            
            const loadTournaments = async () => {
                const allTournaments = await storage.getAllTournaments();
                const userTournaments = allTournaments.filter(t => 
                    t.createdBy === user.uid || t.isPublic
                );
                setTournaments(userTournaments);
            };
            
            return (
                <div className="min-h-screen bg-gray-50">
                    <div className="bg-slate-900 p-6 text-white">
                        <div className="max-w-6xl mx-auto">
                            <button onClick={onBack} className="text-sm text-slate-400 hover:text-white mb-4">
                                ← Back
                            </button>
                            <h1 className="text-3xl font-black">My Tournaments</h1>
                        </div>
                    </div>
                    
                    <div className="max-w-6xl mx-auto p-6">
                        {tournaments.length === 0 ? (
                            <div className="bg-white rounded-3xl shadow-lg p-12 text-center">
                                <p className="text-gray-400 text-lg">No tournaments yet</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {tournaments.map(tournament => (
                                    <div
                                        key={tournament.id}
                                        onClick={() => onSelectTournament(tournament)}
                                        className="bg-white rounded-2xl shadow-lg p-6 cursor-pointer hover:shadow-xl transition-shadow"
                                    >
                                        <h3 className="font-black text-lg mb-2">{tournament.name}</h3>
                                        <p className="text-sm text-gray-500">
                                            {tournament.participants.length} players • {tournament.rounds} rounds
                                        </p>
                                        {tournament.createdBy === user.uid && (
                                            <span className="inline-block bg-green-100 text-green-700 text-xs px-2 py-1 rounded-full mt-2">
                                                👑 Owned
                                            </span>
                                        )}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ============================================
        // MAIN APP
        // ============================================
        function App() {
            const [view, setView] = useState('landing'); // 'landing', 'tournament', 'myTournaments'
            const [user, setUser] = useState(null);
            const [showAuth, setShowAuth] = useState(false);
            const [activeTournament, setActiveTournament] = useState(null);
            
            useEffect(() => {
                // Auth state listener
                if (auth) {
                    const unsubscribe = auth.onAuthStateChanged((user) => {
                        setUser(user);
                    });
                    return () => unsubscribe();
                }
            }, []);
            
            useEffect(() => {
                // Deep linking - Check URL for tournament ID
                const checkDeepLink = async () => {
                    const params = new URLSearchParams(window.location.search);
                    const urlTournamentId = params.get('tournamentId');
                    
                    // Also check path format /t/:id
                    const pathMatch = window.location.pathname.match(/\/t\/([^\/]+)/);
                    const pathTournamentId = pathMatch ? pathMatch[1] : null;
                    
                    const tournamentId = urlTournamentId || pathTournamentId;
                    
                    if (tournamentId) {
                        const tournament = await storage.getTournament(tournamentId);
                        if (tournament) {
                            setActiveTournament(tournament);
                            setView('tournament');
                            
                            // Clean up URL to /t/:id format
                            window.history.replaceState({}, '', `/t/${tournamentId}`);
                        }
                    }
                };
                
                checkDeepLink();
            }, []);
            
            const handleTournamentCreated = (tournament) => {
                setActiveTournament(tournament);
                setView('tournament');
            };
            
            const handleBack = () => {
                setActiveTournament(null);
                setView('landing');
                window.history.pushState({}, '', '/');
            };
            
            const handleDelete = async (tournamentId) => {
                await storage.deleteTournament(tournamentId);
                handleBack();
            };
            
            const handleScoreUpdate = async (scores) => {
                if (activeTournament) {
                    const updated = { ...activeTournament, scores };
                    setActiveTournament(updated);
                    await storage.saveTournament(updated);
                }
            };
            
            return (
                <>
                    {view === 'landing' && (
                        <LandingPage
                            onTournamentCreated={handleTournamentCreated}
                            onShowAuth={() => setShowAuth(true)}
                        />
                    )}
                    
                    {view === 'tournament' && activeTournament && (
                        <TournamentView
                            tournament={activeTournament}
                            user={user}
                            onBack={handleBack}
                            onDelete={handleDelete}
                            onScoreUpdate={handleScoreUpdate}
                        />
                    )}
                    
                    {view === 'myTournaments' && user && (
                        <MyTournaments
                            user={user}
                            onSelectTournament={(t) => {
                                setActiveTournament(t);
                                setView('tournament');
                                window.history.pushState({}, '', `/t/${t.id}`);
                            }}
                            onBack={handleBack}
                        />
                    )}
                    
                    {showAuth && (
                        <AuthModal
                            onClose={() => setShowAuth(false)}
                            onAuthSuccess={() => {
                                // Optionally redirect to "my tournaments" view
                                setView('myTournaments');
                            }}
                        />
                    )}
                    
                    {/* Floating Action Button for logged-in users */}
                    {user && view !== 'myTournaments' && (
                        <button
                            onClick={() => setView('myTournaments')}
                            className="fixed bottom-6 right-6 bg-green-500 hover:bg-green-600 text-white font-bold p-4 rounded-full shadow-2xl z-40"
                            title="My Tournaments"
                        >
                            📋
                        </button>
                    )}
                </>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
