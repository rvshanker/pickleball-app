<script type="text/babel">
const {useState,useEffect,useMemo,useRef,useCallback} = React;
const S = window.LeagueScheduler;

// ── Firebase ──────────────────────────────────────────────────────────
const FB = {
    apiKey:"AIzaSyDaFUszTD0-Ro292GOBSlS5vkZSdJM0NF4",
    authDomain:"pickleball-app-1bba7.firebaseapp.com",
    projectId:"pickleball-app-1bba7",
    storageBucket:"pickleball-app-1bba7.firebasestorage.app",
    messagingSenderId:"645604154338",
    appId:"1:645604154338:web:b92f87c2cd11d950b737bb"
};
let db=null,auth=null,fbOk=false;
try{firebase.initializeApp(FB);db=firebase.firestore();auth=firebase.auth();fbOk=true;}catch(e){console.warn('Firebase init failed',e);}

// ── Helpers ───────────────────────────────────────────────────────────
const uid6 = () => Math.random().toString(36).slice(2,8);
const newId = () => (Date.now().toString(36)+Math.random().toString(36).slice(2,6)).toUpperCase();
const parseCourts = s => String(s||'').split(/[,\s]+/).map(x=>x.trim()).filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i);
const isNum = v => v!==null && v!==undefined && v!=='' && !isNaN(v);
function nextThursday(){
    const d=new Date(); const add=(4-d.getDay()+7)%7; d.setDate(d.getDate()+add);
    const p=n=>String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; // local date, not UTC
}
function fmtDate(iso){
    if(!iso)return'';
    const [y,m,d]=iso.split('-').map(Number);
    return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
const lc=e=>String(e||'').trim().toLowerCase();
const isAdminOf=(league,user)=>!!user&&!!user.email&&(league.adminEmails||[]).includes(lc(user.email));
// Leagues page shows only leagues you own or co-admin. Clear the old per-browser "recently viewed" list,
// which leaked other users' leagues on shared devices.
try{localStorage.removeItem('recentLeagues');}catch(e){}

// ── Storage (Firestore, with on-device fallback) ──────────────────────
const LS = id => 'league:'+id;
const lsGet = id => {try{return JSON.parse(localStorage.getItem(LS(id)));}catch(e){return null;}};
const lsSet = d => {try{localStorage.setItem(LS(d.id),JSON.stringify(d));}catch(e){}};
const localSubs = {};
function applyPatch(d,patch){
    const n={...d};
    Object.entries(patch).forEach(([k,v])=>{
        if(k.startsWith('scores.'))n.scores={...(n.scores||{}),[k.slice(7)]:v};
        else n[k]=v;
    });
    return n;
}
const store = {
    async create(d){
        if(fbOk)try{await db.collection('leagues').doc(d.id).set(d);return'cloud';}catch(e){console.warn('Cloud save failed, using this device:',e.code||e.message);}
        lsSet({...d,_local:true});return'local';
    },
    listen(id,cb){
        const local=lsGet(id);
        if(local&&local._local||!fbOk){
            const fn=d=>cb(d?{...d,_src:'local'}:null);
            (localSubs[id]=localSubs[id]||[]).push(fn);fn(local);
            return()=>{localSubs[id]=(localSubs[id]||[]).filter(f=>f!==fn);};
        }
        return db.collection('leagues').doc(id).onSnapshot(
            doc=>cb(doc.exists?{...doc.data(),_src:'cloud'}:null),
            err=>{console.warn('listen failed',err.code);cb({_error:err.code||'error'});}
        );
    },
    async update(league,patch){
        patch={...patch,updatedAt:Date.now()};
        if(league._src==='local'){
            const n=applyPatch(lsGet(league.id)||league,patch);lsSet(n);
            (localSubs[league.id]||[]).forEach(f=>f(n));return;
        }
        await db.collection('leagues').doc(league.id).update(patch);
    },
    async mine(uid,email){
        const out=[];
        if(fbOk&&uid)try{(await db.collection('leagues').where('createdBy','==',uid).get()).docs.forEach(d=>out.push(d.data()));}catch(e){console.warn('list failed',e.code);}
        if(fbOk&&email)try{(await db.collection('leagues').where('adminEmails','array-contains',lc(email)).get()).docs.forEach(d=>{if(!out.find(x=>x.id===d.id))out.push({...d.data(),_coAdmin:true});});}catch(e){console.warn('admin list failed',e.code);}
        for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('league:')){const d=lsGet(k.slice(7));if(d&&d.createdBy===uid&&!out.find(x=>x.id===d.id))out.push({...d,_src:'local'});}}
        return out.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    },
    async remove(league){
        if(league._src==='local'){localStorage.removeItem(LS(league.id));return;}
        await db.collection('leagues').doc(league.id).delete();
    }
};

// ── Scoring ───────────────────────────────────────────────────────────
// mode 'capped': a game that runs past gameTo (e.g. 15-13) counts as gameTo to gameTo-minus-margin (11-9),
// so long win-by-2 games don't hand out bonus points. 'raw' counts the real score.
const DEFAULT_SCORING={mode:'capped',gameTo:11,minPct:50};
const scoringOf=l=>({...DEFAULT_SCORING,...((l&&l.scoring)||{})});
function counted(a,b,sc){
    a=+a;b=+b;
    if(sc.mode!=='capped'||a===b)return[a,b];
    const hi=Math.max(a,b),lo=Math.min(a,b);
    if(hi<=sc.gameTo)return[a,b];
    const cl=Math.max(0,sc.gameTo-(hi-lo));
    return a>b?[sc.gameTo,cl]:[cl,sc.gameTo];
}
const scoreOf=(league,mid)=>{const s=(league.scores||{})[mid];return s&&isNum(s.a)&&isNum(s.b)?s:null;};

// ── Leaderboard ───────────────────────────────────────────────────────
function calcBoard(league,weekId){
    const sc=scoringOf(league);
    const nameOf={};league.players.forEach(p=>nameOf[p.id]=p.name);
    const st={};
    const touch=id=>st[id]=st[id]||{id,name:nameOf[id]||'(removed)',pts:0,pa:0,gp:0,w:0,l:0,sat:0};
    let gamesPlayed=0; // game slots (rounds) that have at least one score
    (league.weeks||[]).forEach(w=>{
        if(weekId&&w.id!==weekId)return;
        (w.rounds||[]).forEach(r=>{
            let any=false;
            (r.matches||[]).forEach(m=>{
                const s=scoreOf(league,m.id);if(!s)return;any=true;
                const [a,b]=counted(s.a,s.b,sc);
                const side=(team,f,ag)=>team.forEach(p=>{const x=touch(p);x.pts+=f;x.pa+=ag;x.gp++;if(f>ag)x.w++;else if(f<ag)x.l++;});
                side(m.team1,a,b);side(m.team2,b,a);
            });
            if(any){gamesPlayed++;(r.sitOut||[]).forEach(p=>touch(p).sat++);}
        });
    });
    // include players with no scored games yet (current roster, active)
    league.players.filter(p=>p.active!==false).forEach(p=>touch(p.id));
    const need=weekId?0:Math.ceil(gamesPlayed*(sc.minPct||0)/100);
    return Object.values(st).map(x=>({...x,diff:x.pts-x.pa,avg:x.gp?x.pts/x.gp:0,qualified:x.gp>=need,need}));
}
const SORTS={
    avg:{label:'Avg / game',fn:(a,b)=>b.avg-a.avg||b.diff-a.diff||b.w-a.w},
    pts:{label:'Points',fn:(a,b)=>b.pts-a.pts||b.diff-a.diff||b.w-a.w},
    w:{label:'Wins',fn:(a,b)=>b.w-a.w||b.avg-a.avg},
    diff:{label:'+/-',fn:(a,b)=>b.diff-a.diff||b.avg-a.avg},
};

// ── App ───────────────────────────────────────────────────────────────
function App(){
    const [user,setUser]=useState(null);
    const [ready,setReady]=useState(false);
    const [leagueId,setLeagueId]=useState(()=>new URLSearchParams(location.search).get('id'));

    useEffect(()=>{
        if(!fbOk){setReady(true);return;}
        return auth.onAuthStateChanged(u=>{
            setUser(u&&!u.isAnonymous?{uid:u.uid,email:u.email,name:u.displayName||(u.email||'').split('@')[0]}:null);
            setReady(true);
        });
    },[]);
    useEffect(()=>{
        const f=()=>setLeagueId(new URLSearchParams(location.search).get('id'));
        window.addEventListener('popstate',f);return()=>window.removeEventListener('popstate',f);
    },[]);
    const open=id=>{history.pushState({},'',id?`?id=${id}`:location.pathname);setLeagueId(id);window.scrollTo(0,0);};

    if(!ready)return<Center><div className="spinner"/></Center>;
    if(leagueId)return<LeagueView id={leagueId} user={user} onHome={()=>open(null)}/>;
    if(!user)return<LoginView/>;
    return<Dashboard user={user} onOpen={open}/>;
}

const Center=({children})=><div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:12}}>{children}</div>;

function Nav({children,onHome,user}){
    return(
        <div className="nav no-print">

            </div>
            {user?<button className="link" onClick={()=>auth.signOut()}>Log out</button>:<span style={{width:60}}/>}
            {children}
        </div>
    );
}

// ── Login ─────────────────────────────────────────────────────────────
function LoginView(){
    const [email,setEmail]=useState('');const [pw,setPw]=useState('');const [pwc,setPwc]=useState('');
    const [signup,setSignup]=useState(false);const [err,setErr]=useState('');const [msg,setMsg]=useState('');const [busy,setBusy]=useState(false);
    const ERR={'auth/invalid-credential':'Incorrect email or password.','auth/wrong-password':'Incorrect password.','auth/user-not-found':'No account with this email.',
        'auth/invalid-email':'Invalid email.','auth/email-already-in-use':'Email already registered — log in instead.','auth/weak-password':'Password must be 6+ characters.',
        'auth/too-many-requests':'Too many attempts. Try again in a few minutes.'};
    const submit=async e=>{
        e.preventDefault();setErr('');setMsg('');
        if(!fbOk){setErr('Login is unavailable right now.');return;}
        if(signup&&pw.length<6){setErr('Password must be 6+ characters.');return;}
        if(signup&&pw!==pwc){setErr('Passwords do not match.');return;}
        setBusy(true);
        try{
            if(signup){const c=await auth.createUserWithEmailAndPassword(email,pw);try{await c.user.sendEmailVerification();}catch(e){}}
            else await auth.signInWithEmailAndPassword(email,pw);
        }catch(e){setErr(ERR[e.code]||e.message);}
        setBusy(false);
    };
    const reset=async()=>{
        setErr('');setMsg('');
        if(!email){setErr('Enter your email above first, then tap Forgot password.');return;}
        try{await auth.sendPasswordResetEmail(email);setMsg(`Password reset email sent to ${email}. Check your inbox (and spam).`);}
        catch(e){setErr(ERR[e.code]||e.message);}
    };
    const toggle=()=>{setSignup(!signup);setErr('');setMsg('');setPwc('');};
    return(
        <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
            <div className="hero-bg" style={{padding:'44px 20px 56px',textAlign:'center'}}>

function CreateLeague({user,onClose,onCreated}){
    const [name,setName]=useState('Thursday Night League');
    const [names,setNames]=useState(()=>Array.from({length:12},()=>''));
    const [courts,setCourts]=useState('4, 5, 7');
    const [rounds,setRounds]=useState(8);
    const [busy,setBusy]=useState(false);const [err,setErr]=useState('');
    const filled=names.map(n=>n.trim()).filter(Boolean);
    const dup=filled.find((n,i)=>filled.findIndex(x=>x.toLowerCase()===n.toLowerCase())!==i);
    const cs=parseCourts(courts);
    const create=async()=>{
        if(filled.length<4){setErr('Add at least 4 players.');return;}
        if(dup){setErr(`"${dup}" is listed twice.`);return;}
        if(!cs.length){setErr('Enter at least one court number.');return;}
        setBusy(true);
        const id=newId();
        const doc={id,name:name.trim()||'League',createdBy:user.uid,ownerName:user.name,createdAt:Date.now(),updatedAt:Date.now(),
            isPublic:true,publicMode:'read',adminEmails:[],
            players:filled.map(n=>({id:uid6(),name:n,active:true})),
            defaultCourts:cs,defaultRounds:rounds,weeks:[],scores:{}};
        await store.create(doc);
        onCreated(id);
    };
    return(
        <Modal onClose={onClose} title="New league">
            <label className="slbl">League name</label>
            <input className="inp" value={name} onChange={e=>setName(e.target.value)}/>
            <div className="row" style={{justifyContent:'space-between',margin:'16px 0 8px'}}>
                <label className="slbl" style={{margin:0}}>Players ({filled.length})</label>
                <button className="btn btn-ghost btn-sm" onClick={()=>setNames([...names,''])}>+ Add</button>
            </div>
            <div className="grid2">
                {names.map((n,i)=>(
                    <input key={i} className="inp" style={{padding:'10px 12px'}} placeholder={`Player ${i+1}`} value={n}
                        onChange={e=>{const c=[...names];c[i]=e.target.value;setNames(c);}}/>
                ))}
            </div>
            <div className="muted" style={{fontSize:12,marginTop:6}}>You can rename players or add subs anytime later.</div>
            <div className="grid2" style={{marginTop:16}}>
                <div>
                    <label className="slbl">Usual courts</label>
                    <input className="inp" value={courts} onChange={e=>setCourts(e.target.value)} placeholder="4, 5, 7"/>
                    <div className="muted" style={{fontSize:12,marginTop:4}}>Change per week if needed</div>
                </div>
                <div>
                    <label className="slbl">Games per night</label>
                    <Stepper value={rounds} min={1} max={20} onChange={setRounds}/>
                </div>
            </div>
            {err&&<div className="err" style={{marginTop:12}}>{err}</div>}
            <button className="btn btn-g" style={{width:'100%',marginTop:16}} disabled={busy} onClick={create}>{busy?'Creating…':'Create league'}</button>
        </Modal>
    );
}

// Number of leading games to keep when changing players: everything up to the last game with a score
function keptRounds(league,week){
    if(!week)return 0;
    let k=0;
    week.rounds.forEach((r,i)=>{if(r.matches.some(m=>(league.scores||{})[m.id]&&(isNum(league.scores[m.id].a)||isNum(league.scores[m.id].b))))k=i+1;});
    return k;
}

function generateWeek(league,{date,courts,rounds,playerIds},existing,keep){
    const id=existing?existing.id:('W'+uid6());
    const prior=existing&&keep?existing.rounds.slice(0,keep):[];
    const hist=S.buildHistory(league.weeks,id);
    const res=S.generateNight(playerIds,courts,rounds-prior.length,hist,{priorRounds:prior});
    const fresh=res.rounds.map((r,ri)=>({
        matches:r.matches.map((m,mi)=>({id:`${id}_r${prior.length+ri+1}_${mi+1}_${uid6()}`,court:m.court,team1:m.team1,team2:m.team2})),
        sitOut:r.sitOut,
    }));
    return{id,date,courts,playerIds,numRounds:rounds,rounds:prior.concat(fresh),repeatPartners:res.stats.repeatPartners,
        createdAt:existing?existing.createdAt:Date.now(),...(existing?{updatedAt:Date.now()}:{})};
}

function NewWeekModal({league,onClose,onSave,editWeek,update}){
    const active=league.players.filter(p=>p.active!==false);
    const keep=keptRounds(league,editWeek);
    const [date,setDate]=useState(editWeek?editWeek.date:nextThursday());
    const [courts,setCourts]=useState((editWeek?editWeek.courts:league.defaultCourts||[]).join(', '));
    const [rounds,setRounds]=useState(editWeek?editWeek.numRounds:(league.defaultRounds||8));
    const [ids,setIds]=useState(editWeek?editWeek.playerIds:active.map(p=>p.id));
    const [newName,setNewName]=useState('');const [err,setErr]=useState('');
    const [busy,setBusy]=useState(false);
    const cs=parseCourts(courts);
    const used=Math.min(cs.length,Math.floor(ids.length/4));
    const sit=ids.length-used*4;
    const maxNR=S.maxNoRepeatRounds(ids.length);
    // show the active roster plus anyone already in this week (even if since deactivated)
    const shown=league.players.filter(p=>p.active!==false||ids.includes(p.id));
    const minRounds=Math.max(1,keep+1);
    useEffect(()=>{if(rounds<minRounds)setRounds(minRounds);},[minRounds]);

    const addPlayer=async()=>{
        const n=newName.trim();if(!n)return;
        setErr('');
        const existing=league.players.find(p=>p.name.trim().toLowerCase()===n.toLowerCase());
        if(existing){
            // already on the roster (maybe removed earlier) — bring them back and tick them
            if(existing.active===false)await update({players:league.players.map(p=>p.id===existing.id?{...p,active:true}:p)});
            if(!ids.includes(existing.id))setIds([...ids,existing.id]);
            setNewName('');return;
        }
        const p={id:uid6(),name:n,active:true};
        await update({players:[...league.players,p]});
        setIds(prev=>[...prev,p.id]);setNewName('');
    };
    const go=()=>{
        setBusy(true);
        setTimeout(async()=>{ // let the spinner paint
            const w=generateWeek(league,{date,courts:cs,rounds,playerIds:ids},editWeek,keep);
            await onSave(w);
        },30);
    };
    return(
        <Modal onClose={onClose} title={editWeek?'Change players':'Schedule a week'}>
            {editWeek&&<div className={keep?'ok':'warn'} style={{marginBottom:14}}>
                {keep?`Games 1–${keep} are kept as played (with their scores). Games ${keep+1}–${rounds} will be redrawn with the players ticked below.`
                     :'No scores yet, so all games will be redrawn with the players ticked below.'}
            </div>}
            <div className="grid2">
                <div><label className="slbl">Date</label><input className="inp" type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
                <div><label className="slbl">Total games</label><Stepper value={rounds} min={minRounds} max={20} onChange={setRounds}/></div>
            </div>
            <label className="slbl" style={{marginTop:14}}>Court numbers you got</label>
            <input className="inp" value={courts} onChange={e=>setCourts(e.target.value)} placeholder="e.g. 4, 5, 7"/>
            <div className="row" style={{justifyContent:'space-between',margin:'14px 0 8px'}}>
                <label className="slbl" style={{margin:0}}>Who's playing ({ids.length})</label>
                <button className="btn btn-ghost btn-sm" onClick={()=>setIds(ids.length===shown.length?[]:shown.map(p=>p.id))}>{ids.length===shown.length?'None':'All'}</button>
            </div>
            <div className="grid2">
                {shown.map(p=>{const on=ids.includes(p.id);return(
                    <label key={p.id} className={'check'+(on?'':' off')}>
                        <input type="checkbox" checked={on} onChange={()=>setIds(on?ids.filter(x=>x!==p.id):[...ids,p.id])}/>
                        <span>{p.name}</span>
                    </label>);})}
            </div>
            <div className="row" style={{marginTop:8}}>
                <input className="inp" style={{padding:'9px 12px'}} placeholder="New player or sub" value={newName}
                    onChange={e=>setNewName(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')addPlayer();}}/>
                <button className="btn btn-out btn-sm" onClick={addPlayer} style={{flexShrink:0}}>+ Add</button>
            </div>
            <div className="muted" style={{fontSize:12,marginTop:4}}>Untick anyone who isn't playing. New names are added to the league roster too.</div>
            <div style={{marginTop:14,display:'flex',flexDirection:'column',gap:8}}>
                {err&&<div className="err">{err}</div>}
                {used<1?<div className="err">Need at least 4 players and 1 court.</div>:
                 <div className="ok">{used} court{used>1?'s':''} in use ({cs.slice(0,used).join(', ')}) · {used*4} playing each game{sit>0?` · ${sit} sit out each game (rotated fairly)`:''}</div>}
                {used<cs.length&&used>=1&&<div className="warn">Only {used} of {cs.length} courts needed for {ids.length} players.</div>}
                {rounds>maxNR&&<div className="warn">With {ids.length} players, at most {maxNR} games can have all-new partners. Games after that will repeat a partner.</div>}
            </div>
            <button className="btn btn-g" style={{width:'100%',marginTop:14}} disabled={busy||used<1} onClick={go}>{busy?'Generating…':editWeek?(keep?`🔀 Redraw games ${keep+1}–${rounds}`:'🔀 Redraw all games'):'🎲 Generate matchups'}</button>
        </Modal>
    );
}

function WeekView({league,week,index,isOwner,canScore,update,onPlayer}){
    const [reshuffle,setReshuffle]=useState(false);
    const [copied,setCopied]=useState(false);
    const name=id=>(league.players.find(p=>p.id===id)||{name:'?'}).name;
    const scores=league.scores||{};
    const sc=scoringOf(league);
    const scored=week.rounds.reduce((n,r)=>n+r.matches.filter(m=>scores[m.id]&&isNum(scores[m.id].a)&&isNum(scores[m.id].b)).length,0);
    const total=week.rounds.reduce((n,r)=>n+r.matches.length,0);

    const setScore=(mid,side,val)=>{
        const cur=scores[mid]||{a:null,b:null};
        const v=val===''?null:Math.max(0,Math.min(99,parseInt(val,10)||0));
        update({['scores.'+mid]:{...cur,[side]:v}});
    };
    const copyText=async()=>{
        let t=`${league.name} — ${fmtDate(week.date)}\n`;
        week.rounds.forEach((r,i)=>{
            t+=`\nGame ${i+1}\n`;
            r.matches.forEach(m=>{t+=`Ct ${m.court}: ${m.team1.map(name).join(' & ')} vs ${m.team2.map(name).join(' & ')}\n`;});
            if(r.sitOut.length)t+=`Sit: ${r.sitOut.map(name).join(', ')}\n`;
        });
        t+=`\nScores & leaderboard: ${location.origin}${location.pathname}?id=${league.id}`;
        try{await navigator.clipboard.writeText(t);setCopied(true);setTimeout(()=>setCopied(false),2000);}catch(e){prompt('Copy the schedule',t);}
    };
    const del=()=>{if(confirm(`Delete week ${index+1} (${fmtDate(week.date)}) and its scores?`))update({weeks:league.weeks.filter(w=>w.id!==week.id)});};

    return(
        <div>
            <div className="card no-print" style={{marginBottom:12,padding:14}}>
                <div className="row" style={{justifyContent:'space-between',flexWrap:'wrap',gap:8}}>
                    <div>
                        <div style={{fontWeight:700}}>Week {index+1} · {fmtDate(week.date)}</div>
                        <div className="muted" style={{fontSize:13}}>Courts {week.courts.join(', ')} · {week.playerIds.length} players · {scored}/{total} games scored</div>
                    </div>
                    <div className="row" style={{flexWrap:'wrap'}}>
                        <button className="btn btn-ghost btn-sm" onClick={copyText}>{copied?'✓ Copied':'📋 Copy'}</button>
                        <button className="btn btn-ghost btn-sm" onClick={()=>window.print()}>🖨️</button>
                        {isOwner&&<button className="btn btn-ghost btn-sm" onClick={()=>setReshuffle(true)}>👥 Change players</button>}
                        {isOwner&&<button className="btn btn-red btn-sm" onClick={del}>Delete</button>}
                    </div>
                </div>
                <div style={{marginTop:10}} className={week.repeatPartners?'warn':'ok'}>
                    {week.repeatPartners?`${week.repeatPartners} repeat partnership${week.repeatPartners>1?'s':''} tonight (more games than unique partners).`:'✓ No one plays with the same partner twice tonight.'}
                </div>
            </div>
            {week.rounds.map((r,ri)=>(
                <div key={ri} className="round-card">
                    <div className="round-hd">
                        <span className="fd" style={{fontSize:18,fontWeight:800,letterSpacing:.5}}>GAME {ri+1}</span>
                        <span style={{fontSize:12,color:'#6ee7b7'}}>{r.matches.filter(m=>scores[m.id]&&isNum(scores[m.id].a)&&isNum(scores[m.id].b)).length}/{r.matches.length} scored</span>
                    </div>
                    {r.matches.map(m=>{
                        const s=scores[m.id]||{};const done=isNum(s.a)&&isNum(s.b);
                        const aWin=done&&+s.a>+s.b,bWin=done&&+s.b>+s.a;
                        const [ca,cb]=done?counted(s.a,s.b,sc):[0,0];
                        const adjusted=done&&(ca!==+s.a||cb!==+s.b);
                        const names=t=>t.map((id,i)=><React.Fragment key={id}>{i>0&&' & '}<button className="pbtn" onClick={()=>onPlayer(id,week.id)}>{name(id)}</button></React.Fragment>);
                        return(
                            <div key={m.id} className="match">
                                <div className="court"><small>Court</small><b>{m.court}</b></div>
                                <div className="teams">
                                    <div className={'team'+(aWin?' win':'')}>
                                        <div className="tnames">{names(m.team1)}</div>
                                        <ScoreInput value={s.a} win={aWin} disabled={!canScore} onCommit={v=>setScore(m.id,'a',v)}/>
                                    </div>
                                    <div className="vs">VS</div>
                                    <div className={'team'+(bWin?' win':'')}>
                                        <div className="tnames">{names(m.team2)}</div>
                                        <ScoreInput value={s.b} win={bWin} disabled={!canScore} onCommit={v=>setScore(m.id,'b',v)}/>
                                    </div>
                                    {adjusted&&<div style={{fontSize:11,color:'#64748b',textAlign:'right'}}>Overtime — counts as {ca}–{cb} on the leaderboard</div>}
                                </div>
                            </div>
                        );
                    })}
                    {r.sitOut.length>0&&<div className="sit">🪑 Sitting out: {r.sitOut.map((id,i)=><React.Fragment key={id}>{i>0&&', '}<button className="pbtn" onClick={()=>onPlayer(id,week.id)}>{name(id)}</button></React.Fragment>)}</div>}
                </div>
            ))}
            {!canScore&&<div className="muted" style={{textAlign:'center',fontSize:13}}>Only the organizer can enter scores for this league.</div>}
            {reshuffle&&<NewWeekModal league={league} editWeek={week} update={update} onClose={()=>setReshuffle(false)}
                onSave={async w=>{await update({weeks:league.weeks.map(x=>x.id===w.id?w:x)});setReshuffle(false);}}/>}
        </div>
    );
}

function ScoreInput({value,disabled,onCommit,win}){
    const [v,setV]=useState(isNum(value)?String(value):'');
    const focused=useRef(false);
    useEffect(()=>{if(!focused.current)setV(isNum(value)?String(value):'');},[value]);
    const commit=()=>{const cur=isNum(value)?String(value):'';if(v!==cur)onCommit(v);};
    if(disabled)return<div className={'score-ro'+(win?' win':'')}>{isNum(value)?value:'–'}</div>;
    return<input className={'score-inp'+(win?' win':'')} type="number" inputMode="numeric" min="0" max="99" value={v} placeholder="–"
        onFocus={e=>{focused.current=true;e.target.select();}}
        onChange={e=>setV(e.target.value.slice(0,2))}
        onBlur={()=>{focused.current=false;commit();}}
        onKeyDown={e=>{if(e.key==='Enter')e.target.blur();}}/>;
}

// ── One player's games ────────────────────────────────────────────────
function PlayerGames({league,pid,weekId,onClose}){
    const weeks=league.weeks||[];
    const [wid,setWid]=useState(weekId||(weeks.length?weeks[weeks.length-1].id:null));
    const sc=scoringOf(league);
    const name=id=>(league.players.find(p=>p.id===id)||{name:'?'}).name;
    const week=weeks.find(w=>w.id===wid);
    const rows=[];
    if(week)week.rounds.forEach((r,ri)=>{
        if(r.sitOut.includes(pid)){rows.push({ri,sat:true});return;}
        const m=r.matches.find(m=>m.team1.includes(pid)||m.team2.includes(pid));
        if(!m)return; // not playing that game (joined later / left early)
        const mine=m.team1.includes(pid)?m.team1:m.team2, opp=m.team1.includes(pid)?m.team2:m.team1;
        const s=scoreOf(league,m.id);
        let my=null,their=null,cm=null,ct=null;
        if(s){const t1=m.team1.includes(pid);my=t1?+s.a:+s.b;their=t1?+s.b:+s.a;const [ca,cb]=counted(s.a,s.b,sc);cm=t1?ca:cb;ct=t1?cb:ca;}
        rows.push({ri,court:m.court,partner:mine.find(x=>x!==pid),opp,my,their,cm,ct});
    });
    const played=rows.filter(r=>!r.sat&&r.my!==null);
    const pts=played.reduce((n,r)=>n+r.cm,0),pa=played.reduce((n,r)=>n+r.ct,0);
    const w=played.filter(r=>r.my>r.their).length,l=played.filter(r=>r.my<r.their).length;
    return(
        <Modal onClose={onClose} title={name(pid)}>
            {weeks.length>1&&<div className="chips" style={{marginBottom:12}}>
                {weeks.map((x,i)=><button key={x.id} className={'chip'+(x.id===wid?' on':'')} onClick={()=>setWid(x.id)}>Wk {i+1} · {fmtDate(x.date)}</button>)}
            </div>}
            {!week?<div className="muted">No weeks scheduled yet.</div>:<>
                <div className="grid2" style={{gridTemplateColumns:'repeat(4,minmax(0,1fr))',marginBottom:10}}>
                    {[['Pts',pts],['W-L',`${w}-${l}`],['Avg',played.length?(pts/played.length).toFixed(1):'–'],['+/-',(pts-pa>0?'+':'')+(pts-pa)]].map(([k,v])=>(
                        <div key={k} style={{background:'#f8fafc',borderRadius:10,padding:'8px 4px',textAlign:'center'}}>
                            <div className="fd" style={{fontSize:22,fontWeight:800}}>{v}</div>
                            <div style={{fontSize:11,color:'#64748b',fontWeight:700,textTransform:'uppercase'}}>{k}</div>
                        </div>))}
                </div>
                {rows.length===0&&<div className="muted">Not playing this week.</div>}
                {rows.map(r=>(
                    <div key={r.ri} className="pg-row">
                        <div style={{width:54,flexShrink:0}}>
                            <div style={{fontWeight:800,fontSize:13}}>Game {r.ri+1}</div>
                            {!r.sat&&<div style={{fontSize:11,color:'#047857',fontWeight:700}}>Court {r.court}</div>}
                        </div>
                        {r.sat?<div className="muted" style={{flex:1}}>🪑 Sat out</div>:<>
                            <div style={{flex:1,minWidth:0,fontSize:14,lineHeight:1.35}}>
                                <div>with <b>{name(r.partner)}</b></div>
                                <div className="muted" style={{fontSize:13}}>vs {r.opp.map(name).join(' & ')}</div>
                            </div>
                            <div style={{textAlign:'right',flexShrink:0}}>
                                {r.my===null?<span className="res p">not scored</span>:<>
                                    <div style={{fontWeight:800,fontSize:16}}><span style={{color:r.my>r.their?'#047857':'#0f172a'}}>{r.my}</span>–{r.their} <span className={'res '+(r.my>r.their?'w':r.my<r.their?'l':'p')}>{r.my>r.their?'W':r.my<r.their?'L':'T'}</span></div>
                                    {(r.cm!==r.my||r.ct!==r.their)&&<div style={{fontSize:11,color:'#64748b'}}>counts {r.cm}–{r.ct}</div>}
                                </>}
                            </div>
                        </>}
                    </div>
                ))}
            </>}
        </Modal>
    );
}

// ── Leaderboard ───────────────────────────────────────────────────────
function Leaderboard({league,onPlayer}){
    const [scope,setScope]=useState('season');
    const [sort,setSort]=useState('avg');
    const weeks=league.weeks||[];
    const sc=scoringOf(league);
    const rows=useMemo(()=>{
        const all=calcBoard(league,scope==='season'?null:scope).sort(SORTS[sort].fn);
        return all.filter(r=>r.qualified).concat(all.filter(r=>!r.qualified)); // non-qualifiers go to the bottom
    },[league,scope,sort]);
    const anyScores=rows.some(r=>r.gp>0);
    const latestWeek=weeks.length?weeks[weeks.length-1].id:null;
    const Th=({k,children,cls})=><th className={(cls||'')+(sort===k?' on':'')} onClick={()=>setSort(k)}>{children}{sort===k?' ▾':''}</th>;
    return(
        <div>
            <div className="chips" style={{marginBottom:10}}>
                <button className={'chip'+(scope==='season'?' on':'')} onClick={()=>setScope('season')}>Season</button>
                {weeks.map((w,i)=><button key={w.id} className={'chip'+(scope===w.id?' on':'')} onClick={()=>setScope(w.id)}>Wk {i+1} · {fmtDate(w.date)}</button>)}
            </div>
            <div className="card" style={{padding:'10px 8px',overflowX:'auto'}}>
                <table className="lb">
                    <thead><tr>
                        <th className="l" style={{width:34}}>#</th>
                        <th className="l" style={{cursor:'default'}}>Player</th>
                        <Th k="pts">Pts</Th>
                        <th style={{cursor:'default'}}>GP</th>
                        <Th k="w">W-L</Th>
                        <Th k="avg">Avg</Th>
                        <Th k="diff">+/-</Th>
                    </tr></thead>
                    <tbody>
                        {rows.map((r,i)=>(
                            <tr key={r.id} style={r.qualified?null:{opacity:.55}}>
                                <td className="l">{r.qualified?<span className={'rank'+(anyScores&&i<3?' g'+(i+1):'')}>{i+1}</span>:<span className="rank">–</span>}</td>
                                <td className="l">
                                    <button className="pbtn" style={{fontWeight:600}} onClick={()=>onPlayer(r.id,scope==='season'?latestWeek:scope)}>{r.name}</button>
                                    {(r.sat>0||!r.qualified)&&<div style={{fontSize:11,color:'#94a3b8'}}>
                                        {r.sat>0?`sat out ${r.sat}`:''}{r.sat>0&&!r.qualified?' · ':''}{!r.qualified?`needs ${r.need} games to qualify`:''}
                                    </div>}
                                </td>
                                <td className="pts">{r.pts}</td>
                                <td>{r.gp}</td>
                                <td>{r.w}-{r.l}</td>
                                <td>{r.gp?r.avg.toFixed(1):'–'}</td>
                                <td style={{color:r.diff>0?'#059669':r.diff<0?'#dc2626':'#64748b',fontWeight:600}}>{r.diff>0?'+':''}{r.diff}</td>
                            </tr>
                        ))}
                    </tbody>
                </table>
                {!anyScores&&<div className="muted" style={{textAlign:'center',padding:'14px 0 6px'}}>Scores will show up here as games are entered.</div>}
            </div>
            <div className="muted" style={{fontSize:12,marginTop:8,lineHeight:1.6}}>
                <b>How it's ranked:</b> average points per game (Avg = Pts ÷ GP), so sitting out doesn't hurt you. Ties go to +/-, then wins.
                {sc.mode==='capped'&&<> Games that go past {sc.gameTo} count as {sc.gameTo} to {sc.gameTo}-minus-the-margin (15–13 counts as {sc.gameTo}–{sc.gameTo-2}).</>}
                {scope==='season'&&sc.minPct>0&&<> To qualify for the season, play at least {sc.minPct}% of games.</>}
                {' '}Tap a name to see that player's games. Tap a column to re-sort.
            </div>
        </div>
    );
}

// ── Players tab ───────────────────────────────────────────────────────
function PlayersTab({league,isOwner,update}){
    const [editing,setEditing]=useState(null);const [val,setVal]=useState('');
    const [newName,setNewName]=useState('');const [err,setErr]=useState('');
    const players=league.players;
    const partnerCounts=useMemo(()=>S.buildHistory(league.weeks).partner,[league.weeks]);
    const taken=(n,except)=>players.some(p=>p.id!==except&&p.name.trim().toLowerCase()===n.trim().toLowerCase());
    const save=id=>{
        const n=val.trim();
        if(!n){setErr('Name can\'t be empty.');return;}
        if(taken(n,id)){setErr(`"${n}" is already on the roster.`);return;}
        update({players:players.map(p=>p.id===id?{...p,name:n}:p)});setEditing(null);setErr('');
    };
    const add=()=>{
        const n=newName.trim();if(!n)return;
        if(taken(n)){setErr(`"${n}" is already on the roster.`);return;}
        update({players:[...players,{id:uid6(),name:n,active:true}]});setNewName('');setErr('');
    };
    const toggle=p=>update({players:players.map(x=>x.id===p.id?{...x,active:x.active===false}:x)});
    const partnersOf=id=>{
        const others=players.filter(p=>p.id!==id&&p.active!==false);
        const played=others.filter(o=>partnerCounts[S._key(id,o.id)]).length;
        return{played,of:others.length};
    };
    return(
        <div>
            <div className="card" style={{padding:0,overflow:'hidden'}}>
                {players.map((p,i)=>{const pc=partnersOf(p.id);return(
                    <div key={p.id} style={{display:'flex',alignItems:'center',gap:10,padding:'11px 14px',borderBottom:i<players.length-1?'1px solid #f1f5f9':'none',opacity:p.active===false?.5:1}}>
                        <div style={{width:30,height:30,borderRadius:'50%',background:'#ecfdf5',color:'#047857',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:13,flexShrink:0}}>{p.name.slice(0,1).toUpperCase()}</div>
                        {editing===p.id?(
                            <>
                                <input className="inp" style={{padding:'8px 10px'}} autoFocus value={val} onChange={e=>setVal(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')save(p.id);if(e.key==='Escape')setEditing(null);}}/>
                                <button className="btn btn-g btn-sm" onClick={()=>save(p.id)}>Save</button>
                                <button className="btn btn-ghost btn-sm" onClick={()=>{setEditing(null);setErr('');}}>✕</button>
                            </>
                        ):(
                            <>
                                <div style={{flex:1,minWidth:0}}>
                                    <div style={{fontWeight:600}}>{p.name}{p.active===false&&<span className="muted" style={{fontSize:12}}> · inactive</span>}</div>
                                    {(league.weeks||[]).length>0&&p.active!==false&&<div className="muted" style={{fontSize:12}}>{pc.played}/{pc.of} partners so far</div>}
                                </div>
                                {isOwner&&<button className="btn btn-ghost btn-sm" onClick={()=>{setEditing(p.id);setVal(p.name);setErr('');}}>✏️ Rename</button>}
                                {/* rename keeps the player's id, so all past games follow the new name */}
                                {isOwner&&<button className="btn btn-ghost btn-sm" onClick={()=>toggle(p)} title={p.active===false?'Bring back':'Remove from roster (keeps history)'}>{p.active===false?'↩︎':'🚫'}</button>}
                            </>
                        )}
                    </div>
                );})}
            </div>
            {err&&<div className="err" style={{marginTop:10}}>{err}</div>}
            {isOwner&&<div className="row" style={{marginTop:12}}>
                <input className="inp" placeholder="Add a player or sub" value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')add();}}/>
                <button className="btn btn-g" onClick={add} style={{flexShrink:0}}>Add</button>
            </div>}
            <div className="muted" style={{fontSize:12,marginTop:8,lineHeight:1.5}}>
                Renaming updates every past schedule and the leaderboard. 🚫 takes someone off the roster without erasing their scores. Who plays on a given night is picked when you schedule the week.
            </div>
        </div>
    );
}

function AdminsCard({league,update,isOwner}){
    const [email,setEmail]=useState('');const [err,setErr]=useState('');const [copied,setCopied]=useState(false);
    const list=league.adminEmails||[];
    const add=()=>{
        const e=lc(email);
        if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){setErr('Enter a valid email address.');return;}
        if(list.includes(e)){setErr('Already an admin.');return;}
        update({adminEmails:[...list,e]});setEmail('');setErr('');
    };
    const url=`${location.origin}${location.pathname}?id=${league.id}`;
    const invite=`You're an admin of "${league.name}" on PickleConnect. Open ${url} and log in (or create an account) with the email I added — then you can schedule weeks, change players and enter scores.`;
    const copy=async()=>{try{await navigator.clipboard.writeText(invite);setCopied(true);setTimeout(()=>setCopied(false),2000);}catch(e){prompt('Copy this invite',invite);}};
    return(
        <div className="card">
            <label className="slbl">Admins</label>
            <div className="muted" style={{fontSize:13,marginBottom:10}}>
                {isOwner?'Admins log in with their own account and can schedule weeks, change players, enter scores and edit settings. Only you can manage admins or delete the league.'
                        :'You\'re an admin of this league. Only the league owner can add or remove admins.'}
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
                <div className="check" style={{cursor:'default',justifyContent:'space-between'}}><span>{league.ownerName||'Owner'} <span className="muted" style={{fontSize:12}}>· owner</span></span></div>
                {list.map(e=>(
                    <div key={e} className="check" style={{cursor:'default',justifyContent:'space-between'}}>
                        <span>{e}</span>
                        {isOwner&&<button className="btn btn-red btn-sm" onClick={()=>{if(confirm(`Remove ${e} as admin?`))update({adminEmails:list.filter(x=>x!==e)});}}>Remove</button>}
                    </div>
                ))}
            </div>
            {isOwner&&<>
                <div className="row" style={{marginTop:10}}>
                    <input className="inp" type="email" placeholder="admin@example.com" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')add();}}/>
                    <button className="btn btn-g" onClick={add} style={{flexShrink:0}}>Add</button>
                </div>
                {err&&<div className="err" style={{marginTop:8}}>{err}</div>}
                {list.length>0&&<button className="btn btn-out btn-sm" style={{marginTop:10}} onClick={copy}>{copied?'✓ Invite copied':'📋 Copy invite message'}</button>}
            </>}
        </div>
    );
}

// ── Small components ──────────────────────────────────────────────────
function Modal({title,onClose,children}){
    useEffect(()=>{const f=e=>{if(e.key==='Escape')onClose();};window.addEventListener('keydown',f);return()=>window.removeEventListener('keydown',f);},[]);
    return(
        <div className="modal-bg" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
            <div className="modal">
                <div className="row" style={{justifyContent:'space-between',marginBottom:14}}>
                    <div className="fd" style={{fontSize:24,fontWeight:800}}>{title.toUpperCase()}</div>
                    <button onClick={onClose} style={{background:'#f1f5f9',border:'none',borderRadius:8,width:34,height:34,fontSize:18,cursor:'pointer'}}>✕</button>
                </div>
                {children}
            </div>
        </div>
    );
}
function Stepper({value,min,max,onChange,step=1}){
    return(
        <div className="stepper">
            <button type="button" onClick={()=>onChange(Math.max(min,value-step))}>−</button>
            <span>{value}</span>
            <button type="button" onClick={()=>onChange(Math.min(max,value+step))}>+</button>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
