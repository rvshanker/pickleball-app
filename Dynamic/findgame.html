<script type="text/babel">
const{useState,useEffect,useRef,useMemo,useCallback}=React;

const FB={apiKey:"AIzaSyDaFUszTD0-Ro292GOBSlS5vkZSdJM0NF4",authDomain:"pickleball-app-1bba7.firebaseapp.com",projectId:"pickleball-app-1bba7",storageBucket:"pickleball-app-1bba7.firebasestorage.app",messagingSenderId:"645604154338",appId:"1:645604154338:web:b92f87c2cd11d950b737bb"};
let db=null,auth=null;
try{if(!firebase.apps.length)firebase.initializeApp(FB);db=firebase.firestore();auth=firebase.auth();}catch(e){console.error('FB:',e);}

const SKILLS=['Any','2.0-2.5','2.5-3.0','3.0-3.5','3.5-4.0','4.0-4.5','4.5-5.0','5.0+'];
const PTYPES=['Casual','Competitive','Tournament','Drilling','League'];
const PT_E={'Casual':'🎾','Competitive':'🔥','Tournament':'🏆','Drilling':'🎯','League':'🏅'};
const DAYS_SHORT=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

function haversine(a,b,c,d){const R=3958.8,dL=(c-a)*Math.PI/180,dN=(d-b)*Math.PI/180,x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dN/2)**2;return R*2*Math.asin(Math.sqrt(x));}
function fmtTime(ts){if(!ts)return '';const[h,m]=ts.split(':').map(Number);return `${h%12||12}:${m.toString().padStart(2,'0')}${h>=12?'pm':'am'}`;}
function fmtTimeRange(s,e){if(!s)return '';if(!e)return fmtTime(s);const[sh,sm]=s.split(':').map(Number);const[eh,em]=e.split(':').map(Number);const ss=sh>=12?'pm':'am',es=eh>=12?'pm':'am';const sv=`${sh%12||12}:${sm.toString().padStart(2,'0')}`;const ev=`${eh%12||12}:${em.toString().padStart(2,'0')}${es}`;return ss===es?`${sv}–${ev}`:`${sv}${ss}–${ev}`;}
function timeAgo(t){if(!t)return '';const d=Date.now()-t,m=Math.floor(d/60000);if(m<1)return 'just now';if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago';}
function getDateParts(ds){if(!ds)return{dayStr:'?',numStr:'?',rel:'future'};const d=new Date(ds+'T12:00:00');const today=new Date();today.setHours(0,0,0,0);const diff=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-today)/86400000);return{dayStr:DAYS_SHORT[d.getDay()],numStr:d.getDate(),rel:diff===0?'today':diff<=2?'soon':'future'};}
function isExpired(g){const t=g.timeEnd||g.time;if(!g.date||!t)return false;return new Date(g.date+'T'+t)<new Date();}
function slotsUsed(players){return(players||[]).filter(p=>p.status!=='declined').length;}
function ymd(date){return`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;}
function fmtFullDate(ds){if(!ds)return '';const d=new Date(ds+'T12:00:00');return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});}
function skillInRange(playerSkill,minSkill,maxSkill){
    const SKILL_N={'2.0-2.5':2,'2.5-3.0':2.5,'3.0-3.5':3,'3.5-4.0':3.5,'4.0-4.5':4,'4.5-5.0':4.5,'5.0+':5};
    const ps=SKILL_N[playerSkill]||0;const mn=SKILL_N[minSkill]||0;const mx=SKILL_N[maxSkill]||6;
    if(!minSkill||minSkill==='Any')return true;
    return ps>=mn&&(maxSkill==='Any'||maxSkill===minSkill||ps<=mx);
}

// ── Auth Screen ─────────────────────────────────────────────────────
function AuthScreen(){
    const[ld,setLd]=useState(false);const[err,setErr]=useState(null);
    const googleAuth=async()=>{
        setLd(true);setErr(null);
        const prov=new firebase.auth.GoogleAuthProvider();
        try{await auth.signInWithRedirect(prov);}
        catch(e){setErr(e.message);setLd(false);}
    };
    return(<div className="hero-bg">
        <div className="auth-screen">
            <div style={{fontSize:52,marginBottom:10}}>🎮</div>
            <div className="fd" style={{fontSize:32,fontWeight:800,color:'white',marginBottom:6}}>FIND GAMES</div>
            <div style={{fontSize:14,color:'rgba(255,255,255,.65)',marginBottom:28,maxWidth:320,lineHeight:1.5}}>Join or create pickleball games near you. Invite players automatically matched to your skill.</div>
            {err&&<div style={{background:'rgba(239,68,68,.15)',border:'1px solid rgba(239,68,68,.3)',borderRadius:10,padding:'10px 14px',marginBottom:14,fontSize:12,color:'#fecaca'}}>⚠️ {err}</div>}
            <button className="google-btn" onClick={googleAuth} disabled={ld} style={{justifyContent:'center'}}>

// ── Invite Players Step ──────────────────────────────────────────────
function InviteStep({game,profile,uLat,uLng,onInvitesSent,onSkip}){
    const[players,setPlayers]=useState([]);const[loading,setLoading]=useState(true);
    const[selected,setSelected]=useState([]);const[sending,setSending]=useState(false);
    const[search,setSearch]=useState('');

    useEffect(()=>{
        if(!db)return;
        // Single-field query avoids needing a composite Firestore index
        db.collection('findPlayers').where('status','==','active').limit(100).get()
            .then(snap=>{
                const raw=snap.docs.map(d=>({id:d.id,...d.data()}));
                // Group by uid, dedupe
                const byUid={};
                raw.forEach(p=>{if(!byUid[p.uid]||p.timestamp>byUid[p.uid].timestamp)byUid[p.uid]=p;});
                let arr=Object.values(byUid).filter(p=>p.uid!==profile.uid);
                // Score by match quality
                arr=arr.map(p=>{
                    let score=0;
                    if(skillInRange(p.skill,game.skillMin,game.skillMax))score+=30;
                    if(p.playTypes?.includes(game.playType))score+=20;
                    if(uLat&&p.lat){const d=haversine(uLat,uLng,p.lat,p.lng);if(d<=parseInt(game.radiusMi||25))score+=20;p._dist=d;}
                    if(p.availability==='Now'||p.availability==='Today')score+=10;
                    p._score=score;
                    return p;
                });
                arr.sort((a,b)=>b._score-a._score);
                setPlayers(arr.slice(0,40));
                setLoading(false);
            })
            .catch(()=>setLoading(false));
    },[]);

    const filtered=useMemo(()=>{
        if(!search.trim())return players;
        const q=search.toLowerCase();
        return players.filter(p=>[p.name,p.city,p.skill].some(v=>(v||'').toLowerCase().includes(q)));
    },[players,search]);

    const toggle=p=>{
        const alreadyInGame=game.players?.some(i=>i.uid===p.uid);
        if(alreadyInGame)return;
        setSelected(s=>s.includes(p.uid)?s.filter(x=>x!==p.uid):[...s,p.uid]);
    };

    const sendInvites=async()=>{
        if(selected.length===0){onSkip();return;}
        setSending(true);
        try{
            const batch=db.batch();
            const newRoster=[...(game.players||[])];
            selected.forEach(uid=>{
                const pl=players.find(p=>p.uid===uid);
                if(!pl)return;
                newRoster.push({uid,name:pl.name,skill:pl.skill,photoURL:pl.photoURL||null,status:'invited',invitedAt:Date.now()});
                // Write notification
                const nRef=db.collection('notifications').doc();
                batch.set(nRef,{
                    toUid:uid,fromUid:profile.uid,fromName:profile.name,type:'invite',
                    text:`${profile.name} invited you to a game on ${fmtFullDate(game.date)} at ${fmtTime(game.time)}`,
                    ref:game.id,read:false,timestamp:Date.now()
                });
            });
            await db.collection('games').doc(game.id).update({players:newRoster,updatedAt:Date.now()});
            await batch.commit();
            if(window.__pcnPlaySound)window.__pcnPlaySound('notification');
            onInvitesSent();
        }catch(e){alert('Error sending invites: '+e.message);}
        setSending(false);
    };

    return(<div className="ms"><div className="mh"/>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
            <div className="fd" style={{fontSize:20,fontWeight:800,color:'#0f172a'}}>🎯 INVITE PLAYERS</div>
            <button onClick={onSkip} style={{background:'#f1f5f9',border:'none',borderRadius:8,padding:'5px 10px',fontSize:12,fontWeight:600,cursor:'pointer',color:'#64748b'}}>Skip</button>
        </div>
        <div style={{fontSize:12,color:'#64748b',marginBottom:12}}>Players matched to your game's skill level, play type, and distance. Tap to select.</div>

        <div style={{position:'relative',marginBottom:12}}>
            <svg style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)'}} width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input style={{width:'100%',padding:'9px 12px 9px 36px',border:'2px solid #e2e8f0',borderRadius:10,fontFamily:'Outfit',fontSize:14,outline:'none'}} value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search players…"/>
        </div>

        {selected.length>0&&<div style={{background:'#ecfdf5',border:'1px solid #a7f3d0',borderRadius:10,padding:'8px 12px',marginBottom:10,fontSize:13,fontWeight:600,color:'#059669'}}>{selected.length} player{selected.length>1?'s':''} selected · {game.totalSlots-1-slotsUsed(game.players)} slot{game.totalSlots-1-slotsUsed(game.players)!==1?'s':''} remaining</div>}

        {loading?<div style={{textAlign:'center',padding:30,color:'#94a3b8'}}>Finding matched players…</div>
        :filtered.length===0?<div style={{textAlign:'center',padding:30,color:'#94a3b8'}}>No available players found</div>
        :filtered.map(p=>{
            const isSel=selected.includes(p.uid);
            const alreadyIn=game.players?.some(i=>i.uid===p.uid);
            return(<div key={p.uid} className={`inv-card${isSel?' sel':''}${alreadyIn?' sent':''}`} onClick={()=>toggle(p)}>
                <div className="inv-av">{p.photoURL?<img src={p.photoURL} referrerPolicy="no-referrer"/>:(p.name||'?')[0].toUpperCase()}</div>
                <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:700,fontSize:13,color:'#0f172a'}}>{p.name}</div>
                    <div style={{fontSize:11,color:'#64748b'}}>{p.skill}{p.city?` · ${p.city}`:''}{p._dist!==undefined?` · ${p._dist<1?p._dist.toFixed(1):Math.round(p._dist)} mi`:''}</div>
                </div>
                {p._score>=50&&<span style={{fontSize:9,fontWeight:700,background:'#ecfdf5',color:'#059669',padding:'2px 6px',borderRadius:6}}>Best Match</span>}
                {alreadyIn&&<span style={{fontSize:9,fontWeight:700,background:'#dbeafe',color:'#1d4ed8',padding:'2px 6px',borderRadius:6}}>Invited</span>}
                {isSel&&<span style={{fontSize:14}}>✓</span>}
            </div>);
        })}

        <div style={{display:'flex',gap:8,marginTop:12}}>
            <button onClick={onSkip} style={{flex:1,padding:'11px',border:'2px solid #e2e8f0',borderRadius:10,fontFamily:'Outfit',fontSize:13,fontWeight:700,cursor:'pointer',background:'white',color:'#64748b'}}>Skip</button>
            <button className="btn-g" onClick={sendInvites} disabled={sending} style={{flex:2,padding:'11px',fontSize:14,opacity:sending?.6:1}}>{sending?'Sending…':`Send ${selected.length>0?selected.length+' ':''}Invite${selected.length!==1?'s':''}`}</button>
        </div>
    </div>);
}

// ── Create Game Form ─────────────────────────────────────────────────
function CreateGameForm({profile,onClose,onCreated,uLat,uLng,editGame}){
    const[title,setTitle]=useState(editGame?.title||'');
    const[date,setDate]=useState(editGame?.date||'');
    const[time,setTime]=useState(editGame?.time||'');
    const[timeEnd,setTimeEnd]=useState(editGame?.timeEnd||'');
    const[court,setCourt]=useState(editGame?.court||'');
    const[playType,setPT]=useState(editGame?.playType||'Casual');
    const[skillMin,setSkMin]=useState(editGame?.skillMin||'Any');
    const[skillMax,setSkMax]=useState(editGame?.skillMax||'Any');
    const[totalSlots,setSlots]=useState(editGame?.totalSlots||4);
    const[notes,setNotes]=useState(editGame?.notes||'');
    const[isPrivate,setPrivate]=useState(editGame?.isPrivate||false);
    const[radiusMi,setRadius]=useState(editGame?.radiusMi||'25');
    const[saving,setSaving]=useState(false);
    const[showInvite,setShowInvite]=useState(false);
    const[createdGame,setCreatedGame]=useState(null);
    const today=new Date().toISOString().split('T')[0];

    const save=async()=>{
        if(!date){alert('Select a date.');return;}
        if(!time){alert('Set a start time.');return;}
        if(!court.trim()){alert('Enter court name or location.');return;}
        setSaving(true);
        const data={
            organizerUid:profile.uid,organizerName:profile.name,organizerSkill:profile.skill,
            organizerPhoto:profile.photoURL||null,title:title.trim()||`${playType} Game`,
            date,time,timeEnd:timeEnd||null,court:court.trim(),playType,
            skillMin,skillMax,totalSlots,notes:notes.trim()||null,
            isPrivate,radiusMi:parseInt(radiusMi)||25,
            lat:uLat||null,lng:uLng||null,
            players:[{uid:profile.uid,name:profile.name,skill:profile.skill,photoURL:profile.photoURL||null,status:'accepted',isOrganizer:true}],
            status:'active',createdAt:Date.now(),timestamp:Date.now()
        };
        try{
            let id;
            if(editGame?.id){await db.collection('games').doc(editGame.id).update(data);id=editGame.id;}
            else{const r=await db.collection('games').add(data);id=r.id;}
            setCreatedGame({...data,id});
            setShowInvite(true);
        }catch(e){alert('Failed: '+e.message);}
        setSaving(false);
    };

    if(showInvite&&createdGame){
        return(<div className="mo"><InviteStep game={createdGame} profile={profile} uLat={uLat} uLng={uLng} onInvitesSent={()=>{setShowInvite(false);onCreated();}} onSkip={()=>{setShowInvite(false);onCreated();}}/></div>);
    }

    return(<div className="mo" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
        <div className="ms"><div className="mh"/>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
                <div className="fd" style={{fontSize:20,fontWeight:800,color:'#0f172a'}}>{editGame?'✏️ EDIT GAME':'🎮 CREATE GAME'}</div>
                <button onClick={onClose} style={{background:'#f1f5f9',border:'none',borderRadius:8,width:30,height:30,fontSize:14,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
            </div>

            <div className="fg"><div className="fl">Game Title (optional)</div>
                <input className="fi" value={title} onChange={e=>setTitle(e.target.value)} placeholder="e.g. Saturday Morning Casual" maxLength={60}/>
            </div>

            <div style={{display:'flex',gap:8}}>
                <div className="fg" style={{flex:1}}><div className="fl">Date *</div><input type="date" className="fi" value={date} onChange={e=>setDate(e.target.value)} min={today} style={{fontSize:13}}/></div>
                <div className="fg" style={{flex:1}}><div className="fl">Start Time *</div><input type="time" className="fi" value={time} onChange={e=>setTime(e.target.value)} style={{fontSize:13}}/></div>
            </div>
            <div className="fg"><div className="fl">End Time (optional)</div><input type="time" className="fi" value={timeEnd} onChange={e=>setTimeEnd(e.target.value)} style={{fontSize:13}}/></div>

            <div className="fg"><div className="fl">Court / Location *</div>
                <input className="fi" value={court} onChange={e=>setCourt(e.target.value)} placeholder="e.g. Heritage Park Courts, Court 3" maxLength={120}/>
            </div>

            <div className="fg"><div className="fl">Play Type</div>
                <div className="og">{PTYPES.map(t=><button key={t} className={`ob ${playType===t?'s':''}`} onClick={()=>setPT(t)} style={{fontSize:12}}>{PT_E[t]} {t}</button>)}</div>
            </div>

            <div className="fg"><div className="fl">Skill Level Range</div>
                <div style={{display:'flex',gap:8,alignItems:'center'}}>
                    <select className="fi" value={skillMin} onChange={e=>setSkMin(e.target.value)} style={{fontSize:13}}>
                        {SKILLS.map(s=><option key={s} value={s}>{s}</option>)}
                    </select>
                    <span style={{color:'#94a3b8',fontWeight:700}}>—</span>
                    <select className="fi" value={skillMax} onChange={e=>setSkMax(e.target.value)} style={{fontSize:13}}>
                        {SKILLS.map(s=><option key={s} value={s}>{s}</option>)}
                    </select>
                </div>
            </div>

            <div className="fg"><div className="fl">Total Players Needed</div>
                <div className="stepper">
                    <button className="stepper-btn" onClick={()=>setSlots(Math.max(2,totalSlots-1))}>−</button>
                    <div className="stepper-val">{totalSlots}</div>
                    <button className="stepper-btn" onClick={()=>setSlots(Math.min(12,totalSlots+1))}>+</button>
                </div>
                <div style={{fontSize:11,color:'#94a3b8',marginTop:4}}>Includes yourself · {totalSlots-1} more needed</div>
            </div>

            <div className="fg"><div className="fl">Player Search Radius</div>
                <div className="og">
                    {['10','25','50','Any'].map(r=><button key={r} className={`ob ${radiusMi===r?'s':''}`} onClick={()=>setRadius(r)} style={{fontSize:12}}>{r==='Any'?'Any Distance':`${r} mi`}</button>)}
                </div>
            </div>

            <div className="fg"><div className="fl">Notes (optional)</div>
                <textarea className="fi" value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Any details about the game, rules, or requirements…" maxLength={300} rows={2}/>
            </div>

            <div className="fg"><div className="fl">Visibility</div>
                <div className="og">
                    <button className={`ob ${!isPrivate?'s':''}`} onClick={()=>setPrivate(false)} style={{fontSize:12}}>🌍 Public — Anyone can join</button>
                    <button className={`ob ${isPrivate?'s':''}`} onClick={()=>setPrivate(true)} style={{fontSize:12}}>🔒 Private — Invite Only</button>
                </div>
                <div style={{fontSize:11,color:'#64748b',marginTop:5}}>{isPrivate?'Only invited players can see and join.':'Visible to all players. Anyone can request to join.'}</div>
            </div>

            <button className="btn-g" onClick={save} disabled={saving} style={{width:'100%',padding:'13px',fontSize:15,opacity:saving?.6:1}}>
                {saving?'Saving…':'✅ Create Game & Invite Players →'}
            </button>
        </div>
    </div>);
}

// ── Game Card ────────────────────────────────────────────────────────
function GameCard({game,user,profile,onAction,expanded,onToggle}){
    const{dayStr,numStr,rel}=getDateParts(game.date);
    const expired=isExpired(game);
    const used=slotsUsed(game.players);
    const isFull=used>=game.totalSlots;
    const isOrg=game.organizerUid===user?.uid;
    const myInvite=game.players?.find(i=>i.uid===user?.uid);
    const amIn=myInvite&&myInvite.status==='accepted';
    const amInvited=myInvite&&myInvite.status==='invited';
    const openSlots=Math.max(0,game.totalSlots-used);

    return(<div className={`gc${isFull?' full':' open'}${game.isPrivate?' private':''}${isOrg?' mine':''}${amInvited?' invited':''}`} style={expired?{opacity:.5}:{}}>
        <div className="gc-head" onClick={onToggle}>
            <div className={`gc-date-block ${rel}`}>
                <div className="gc-day">{dayStr}</div>
                <div className="gc-num">{numStr}</div>
            </div>
            <div className="gc-info">
                <div className="gc-title">{game.title||`${game.playType||'Casual'} Game`}</div>
                <div className="gc-sub">📍 {game.court} · ⏰ {fmtTimeRange(game.time,game.timeEnd)}</div>
                <div className="gc-badges">
                    <span className={`badge-pill ${isFull?'badge-full':'badge-open'}`}>{isFull?'Full':`${openSlots} spot${openSlots!==1?'s':''} left`}</span>
                    {game.isPrivate&&<span className="badge-pill badge-private">🔒 Private</span>}
                    {!game.isPrivate&&<span className="badge-pill badge-public">🌍 Public</span>}
                    {isOrg&&<span className="badge-pill badge-mine">👑 You organize</span>}
                    {amInvited&&<span className="badge-pill badge-invited">📩 Invited</span>}
                    {game.skillMin&&game.skillMin!=='Any'&&<span style={{fontSize:10,fontWeight:600,color:'#94a3b8'}}>{game.skillMin}{game.skillMax&&game.skillMax!==game.skillMin&&game.skillMax!=='Any'?`–${game.skillMax}`:''}</span>}
                </div>
            </div>
        </div>

        {/* Invite banner for invited players */}
        {amInvited&&!expanded&&(<div style={{padding:'0 14px 10px'}}>
            <div className="inv-banner">
                <div className="inv-banner-text">🎾 {game.organizerName} invited you to play!</div>
                <div className="inv-banner-btns">
                    <button className="accept-btn" style={{flex:0,padding:'7px 14px',fontSize:12}} onClick={()=>onAction('accept',game)}>✓ Accept</button>
                    <button className="decline-btn" style={{padding:'7px 12px',fontSize:12}} onClick={()=>onAction('decline',game)}>✕</button>
                </div>
            </div>
        </div>)}

        {expanded&&(<div>
            {/* Roster */}
            <div style={{padding:'0 14px 8px'}}>
                <div style={{fontSize:10,fontWeight:700,color:'#94a3b8',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:6}}>Players ({used}/{game.totalSlots})</div>
            </div>
            <div className="roster" style={{gridTemplateColumns:`repeat(${Math.min(2,game.totalSlots)},1fr)`}}>
                {Array.from({length:game.totalSlots}).map((_,i)=>{
                    const inv=(game.players||[])[i];
                    if(inv){
                        return(<div key={i} className={`slot ${inv.uid===user?.uid?'mine':inv.status==='declined'?'declined-slot':inv.status==='invited'?'invited-slot':'filled'}`}>
                            <div className="slot-av">{inv.photoURL?<img src={inv.photoURL} referrerPolicy="no-referrer"/>:(inv.name||'?')[0].toUpperCase()}</div>
                            <div style={{flex:1,minWidth:0}}>
                                <div className="slot-name">{inv.name}{inv.isOrganizer?<span style={{marginLeft:4,fontSize:9,color:'#94a3b8'}}>👑</span>:''}</div>
                                <div className="slot-skill">{inv.skill}</div>
                            </div>
                            <span className={`slot-status ${inv.status==='accepted'?'st-accepted':inv.status==='invited'?'st-invited':'st-declined'}`}>{inv.status==='accepted'?'✓':inv.status==='invited'?'Pending':'Declined'}</span>
                        </div>);
                    }
                    return(<div key={i} className="slot empty" onClick={()=>!isFull&&!amIn&&!amInvited&&onAction('join',game)}>
                        <div style={{width:30,height:30,borderRadius:'50%',background:'#e2e8f0',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,flexShrink:0}}>+</div>
                        <div style={{fontSize:11,fontWeight:600,color:'#94a3b8'}}>Open Spot</div>
                    </div>);
                })}
            </div>

            {/* Notes */}
            {game.notes&&<div style={{padding:'0 14px 10px',fontSize:12,color:'#64748b',fontStyle:'italic'}}>"{game.notes}"</div>}

            {/* Actions */}
            <div className="gc-actions">
                {amInvited&&<><button className="accept-btn" onClick={()=>onAction('accept',game)}>✓ Accept Invite</button><button className="decline-btn" onClick={()=>onAction('decline',game)}>Decline</button></>}
                {!isOrg&&!amIn&&!amInvited&&!isFull&&!expired&&!game.isPrivate&&<button className="join-btn" onClick={()=>onAction('join',game)}>🏓 Join Game</button>}
                {amIn&&!isOrg&&<button className="leave-btn" onClick={()=>onAction('leave',game)}>Leave</button>}
                {isOrg&&<button className="btn-g" style={{padding:'9px 14px',fontSize:13}} onClick={()=>onAction('invite',game)}>+ Invite Players</button>}
                {isOrg&&<button className="cancel-btn" onClick={()=>onAction('cancel',game)}>Cancel Game</button>}
            </div>
            <div style={{padding:'0 14px 10px',fontSize:10,color:'#94a3b8'}}>By {game.organizerName} · {timeAgo(game.createdAt)}</div>
        </div>)}
    </div>);
}

// ── Calendar View ────────────────────────────────────────────────────
function CalendarView({games,user,onSelectDay,selectedDay,onToggle,expanded}){
    const[calDate,setCalDate]=useState(new Date());
    const year=calDate.getFullYear(),month=calDate.getMonth();
    const firstDay=new Date(year,month,1).getDay();
    const daysInMonth=new Date(year,month+1,0).getDate();
    const todayStr=ymd(new Date());

    // Build dot map
    const dotMap={};
    games.forEach(g=>{
        if(!g.date)return;
        const[gy,gm,gd]=g.date.split('-').map(Number);
        if(gy===year&&gm-1===month){
            if(!dotMap[gd])dotMap[gd]=[];
            const used=slotsUsed(g.players),full=used>=g.totalSlots;
            const inv=g.players?.find(i=>i.uid===user?.uid);
            if(inv&&inv.status==='invited')dotMap[gd].push('invited');
            else if(full)dotMap[gd].push('full');
            else if(g.isPrivate)dotMap[gd].push('private');
            else dotMap[gd].push('open');
        }
    });

    const cells=[];
    for(let i=0;i<firstDay;i++)cells.push(null);
    for(let d=1;d<=daysInMonth;d++)cells.push(d);

    const selectDate=d=>{if(!d)return;const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;onSelectDay(selectedDay===ds?null:ds);};

    return(<div className="cal-wrap">
        <div className="cal-header">
            <button className="cal-nav" onClick={()=>setCalDate(new Date(year,month-1,1))}>‹</button>
            <div className="cal-month">{MONTHS[month]} {year}</div>
            <button className="cal-nav" onClick={()=>setCalDate(new Date(year,month+1,1))}>›</button>
        </div>
        <div className="cal-grid">
            {DAYS_SHORT.map(d=><div key={d} className="cal-dow">{d[0]}</div>)}
            {cells.map((d,i)=>{
                if(!d)return<div key={`e${i}`}/>;
                const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const isToday=ds===todayStr;
                const isSel=ds===selectedDay;
                const dots=dotMap[d]||[];
                return(<div key={d} className={`cal-day${isToday?' today-cell':''}${isSel?' selected':''}`} onClick={()=>selectDate(d)}>
                    <div className="cal-dn">{d}</div>
                    {dots.length>0&&<div className="cal-dots">
                        {dots.slice(0,3).map((type,i)=><div key={i} className={`cal-dot dot-${type}`}/>)}
                    </div>}
                </div>);
            })}
        </div>
        {/* Legend */}
        <div style={{display:'flex',gap:12,marginTop:10,flexWrap:'wrap'}}>
            {[['dot-open','Open'],['dot-full','Full'],['dot-private','Private'],['dot-invited','Invited']].map(([cls,label])=>(
                <div key={cls} style={{display:'flex',alignItems:'center',gap:5,fontSize:10,color:'rgba(255,255,255,.6)'}}>
                    <div className={`cal-dot ${cls}`}/>{label}
                </div>
            ))}
        </div>
    </div>);
}

// ── Main App ─────────────────────────────────────────────────────────
function App(){
    const[user,setUser]=useState(undefined);const[profile,setProfile]=useState(null);
    const[games,setGames]=useState([]);const[loading,setLoading]=useState(true);
    const[uLat,setULat]=useState(null);const[uLng,setULng]=useState(null);
    const[showCreate,setShowCreate]=useState(false);const[editGame,setEditGame]=useState(null);
    const[showInviteFor,setShowInviteFor]=useState(null);
    const[expanded,setExpanded]=useState(null);
    const[tab,setTab]=useState('list');// 'list' | 'calendar' | 'invited'
    const[selectedDay,setSelectedDay]=useState(null);
    const[search,setSearch]=useState('');
    const[showF,setShowF]=useState(false);
    const[fType,setFT]=useState('');const[fSkill,setFS]=useState('');const[fVis,setFV]=useState('');const[fDist,setFD]=useState('');
    const clearF=()=>{setFT('');setFS('');setFV('');setFD('');};
    const fCount=[fType,fSkill,fVis,fDist].filter(Boolean).length;
    const[toast,setToast]=useState(null);

    const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(null),2500);};

    useEffect(()=>{if(!auth)return;auth.getRedirectResult().catch(()=>{});const u=auth.onAuthStateChanged(async u=>{setUser(u||null);if(!u){setProfile(null);return;}try{const s=await db.collection('profiles').doc(u.uid).get();setProfile(s.exists?{uid:u.uid,...s.data()}:{uid:u.uid,name:u.displayName||u.email,skill:'',photoURL:u.photoURL||null});}catch(e){}});return()=>u();},[]);
    useEffect(()=>{if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{setULat(p.coords.latitude);setULng(p.coords.longitude);},()=>{});},[]);
    useEffect(()=>{if(!db){setLoading(false);return;}const u=db.collection('games').where('status','==','active').onSnapshot(s=>{const arr=s.docs.map(d=>({id:d.id,...d.data()}));arr.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));setGames(arr);setLoading(false);},(e)=>{console.error('games listener:',e.message);setLoading(false);});return()=>u();},[]);

    // Handle accept/decline/join/leave/cancel
    const handleAction=async(type,game)=>{
        if(!user||!profile)return;
        if(type==='accept'||type==='decline'||type==='join'||type==='leave'){
            const ref=db.collection('games').doc(game.id);
            try{
                let roster=[...(game.players||[])];
                if(type==='join'){
                    const used=slotsUsed(roster);
                    if(used>=game.totalSlots){showToast('Game is full.');return;}
                    if(roster.find(i=>i.uid===user.uid)){showToast('Already in this game.');return;}
                    roster.push({uid:user.uid,name:profile.name,skill:profile.skill,photoURL:profile.photoURL||null,status:'accepted',joinedAt:Date.now()});
                }else if(type==='accept'){
                    roster=roster.map(i=>i.uid===user.uid?{...i,status:'accepted'}:i);
                    if(window.__pcnPlaySound)window.__pcnPlaySound('notification');
                }else if(type==='decline'){
                    roster=roster.map(i=>i.uid===user.uid?{...i,status:'declined'}:i);
                }else if(type==='leave'){
                    roster=roster.filter(i=>i.uid!==user.uid);
                }
                await ref.update({players:roster,updatedAt:Date.now()});
                if(type==='accept')showToast('✅ You joined the game!');
                if(type==='decline')showToast('Invite declined.');
                if(type==='join')showToast('✅ You joined the game!');
                if(type==='leave')showToast('Left the game.');
            }catch(e){alert(e.message);}
        }else if(type==='cancel'){
            if(!confirm('Cancel this game?'))return;
            try{await db.collection('games').doc(game.id).update({status:'cancelled'});showToast('Game cancelled.');}catch(e){alert(e.message);}
        }else if(type==='invite'){
            setShowInviteFor(game);
        }
    };

    // Filtered + sorted games
    const filtered=useMemo(()=>{
        let arr=[...games];
        if(tab==='invited')return arr.filter(g=>g.players?.some(i=>i.uid===user?.uid&&i.status==='invited'));
        // Hide private games (unless organizer or invited)
        arr=arr.filter(g=>!g.isPrivate||g.organizerUid===user?.uid||g.players?.some(i=>i.uid===user?.uid));
        if(selectedDay)arr=arr.filter(g=>g.date===selectedDay);
        if(search.trim()){const q=search.toLowerCase();arr=arr.filter(g=>[g.title,g.court,g.organizerName,g.playType].some(v=>(v||'').toLowerCase().includes(q)));}
        if(fType)arr=arr.filter(g=>g.playType===fType);
        if(fSkill)arr=arr.filter(g=>skillInRange(fSkill,g.skillMin,g.skillMax));
        if(fVis==='public')arr=arr.filter(g=>!g.isPrivate);
        if(fVis==='private')arr=arr.filter(g=>g.isPrivate);
        if(fDist&&uLat)arr=arr.filter(g=>g.lat&&haversine(uLat,uLng,g.lat,g.lng)<=parseInt(fDist));
        // Sort: invited first, then by date
        arr.sort((a,b)=>{
            const ai=a.players?.find(i=>i.uid===user?.uid);
            const bi=b.players?.find(i=>i.uid===user?.uid);
            if(ai?.status==='invited'&&bi?.status!=='invited')return -1;
            if(bi?.status==='invited'&&ai?.status!=='invited')return 1;
            if(a.date&&b.date)return a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||'');
            return 0;
        });
        return arr;
    },[games,tab,selectedDay,search,fType,fSkill,fVis,fDist,uLat,uLng,user]);

    const invitedCount=games.filter(g=>g.players?.some(i=>i.uid===user?.uid&&i.status==='invited')).length;

    if(user===undefined)return(<div className="hero-bg"><div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',color:'white'}}>Loading…</div></div>);
    if(!user)return <AuthScreen/>;

    return(
        <div className="hero-bg">
            <div className="content">
                {/* Header */}
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
                    <div className="page-title">Find Games</div>
                    <button className="post-btn" onClick={()=>{setEditGame(null);setShowCreate(true);}}>🎮 Create</button>
                </div>

                {/* Tabs */}
                <div className="tab-bar">
                    {[['list','📋 List'],['calendar','📅 Calendar'],['invited',`📩 Invited${invitedCount>0?` (${invitedCount})`:''}`]].map(([k,l])=>
                        <button key={k} className={`tab-btn ${tab===k?'active':'inactive'}`} onClick={()=>{setTab(k);setSelectedDay(null);}}>{l}</button>
                    )}
                </div>

                {/* Calendar view */}
                {tab==='calendar'&&<CalendarView games={games} user={user} onSelectDay={setSelectedDay} selectedDay={selectedDay} onToggle={setExpanded} expanded={expanded}/>}
                {tab==='calendar'&&selectedDay&&<div style={{fontSize:12,color:'white',marginBottom:8,paddingLeft:2}}>📅 {fmtFullDate(selectedDay)} · {filtered.length} game{filtered.length!==1?'s':''}<button onClick={()=>setSelectedDay(null)} style={{marginLeft:8,background:'rgba(255,255,255,.2)',border:'none',borderRadius:6,padding:'2px 8px',color:'white',fontSize:11,cursor:'pointer',fontFamily:'Outfit'}}>Clear</button></div>}

                {/* Search + Filter for list/calendar */}
                {tab!=='invited'&&(<>
                    <div style={{display:'flex',gap:8,marginBottom:10,alignItems:'center'}}>
                        <div style={{position:'relative',flex:1}}>
                            <svg style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)'}} width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                            <input className="search-input" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search games, courts…"/>
                        </div>
                        <button className={`filter-btn ${(showF||fCount)?'active':''}`} onClick={()=>setShowF(!showF)}>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
                            Filter{fCount>0&&` (${fCount})`}
                        </button>
                    </div>
                    {showF&&<div className="fp">
                        <div><div className="fp-label">Play Type</div><div className="fp-pills"><button className={`fp-pill ${!fType?'s':''}`} onClick={()=>setFT('')}>All</button>{PTYPES.map(t=><button key={t} className={`fp-pill ${fType===t?'s':''}`} onClick={()=>setFT(fType===t?'':t)}>{PT_E[t]} {t}</button>)}</div></div>
                        <div><div className="fp-label">My Skill</div><div className="fp-pills"><button className={`fp-pill ${!fSkill?'s':''}`} onClick={()=>setFS('')}>Any</button>{SKILLS.filter(s=>s!=='Any').map(s=><button key={s} className={`fp-pill ${fSkill===s?'s':''}`} onClick={()=>setFS(fSkill===s?'':s)}>{s}</button>)}</div></div>
                        <div><div className="fp-label">Visibility</div><div className="fp-pills"><button className={`fp-pill ${!fVis?'s':''}`} onClick={()=>setFV('')}>All</button><button className={`fp-pill ${fVis==='public'?'s':''}`} onClick={()=>setFV(fVis==='public'?'':'public')}>🌍 Public</button><button className={`fp-pill ${fVis==='private'?'s':''}`} onClick={()=>setFV(fVis==='private'?'':'private')}>🔒 Private</button></div></div>
                        {uLat&&<div><div className="fp-label">Distance</div><div className="fp-pills"><button className={`fp-pill ${!fDist?'s':''}`} onClick={()=>setFD('')}>Any</button>{['5','10','25','50'].map(d=><button key={d} className={`fp-pill ${fDist===d?'s':''}`} onClick={()=>setFD(fDist===d?'':d)}>Within {d} mi</button>)}</div></div>}
                        {fCount>0&&<div style={{marginTop:8,textAlign:'right'}}><button onClick={clearF} style={{background:'none',border:'none',color:'#fca5a5',fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'Outfit'}}>✕ Clear all</button></div>}
                    </div>}
                </>)}

                {/* Count */}
                {tab!=='invited'&&<div style={{fontSize:12,color:'rgba(255,255,255,.5)',marginBottom:10,paddingLeft:2}}>{filtered.length} game{filtered.length!==1?'s':''}</div>}
                {tab==='invited'&&invitedCount>0&&<div style={{fontSize:12,color:'rgba(255,255,255,.5)',marginBottom:10,paddingLeft:2}}>{invitedCount} pending invite{invitedCount!==1?'s':''}</div>}

                {/* Game list */}
                {loading?[1,2].map(i=><div key={i} style={{background:'white',borderRadius:16,marginBottom:12,height:100,overflow:'hidden'}}><div className="skeleton" style={{height:'100%'}}/></div>)
                :filtered.length===0?(<div style={{textAlign:'center',padding:'40px 16px'}}>
                    <div style={{fontSize:40,marginBottom:8}}>{tab==='invited'?'📩':'🎮'}</div>
                    <div style={{fontSize:16,fontWeight:700,color:'white',marginBottom:4}}>{tab==='invited'?'No pending invites':'No games found'}</div>
                    <div style={{fontSize:13,color:'rgba(255,255,255,.6)',marginBottom:14}}>{tab==='invited'?'You\'re all caught up!':selectedDay?'No games on this day':search||fCount?'Try different filters':'Be the first to create one!'}</div>
                    {tab!=='invited'&&<button className="post-btn" onClick={()=>setShowCreate(true)} style={{margin:'0 auto'}}>🎮 Create Game</button>}
                </div>)
                :filtered.map(g=><GameCard key={g.id} game={g} user={user} profile={profile} onAction={handleAction} expanded={expanded===g.id} onToggle={()=>setExpanded(expanded===g.id?null:g.id)}/>)}
            </div>

            <button className="fab" onClick={()=>setShowCreate(true)}>+</button>
            {toast&&<div className="toast-notif">{toast}</div>}

            {showCreate&&<CreateGameForm profile={profile} onClose={()=>{setShowCreate(false);setEditGame(null);}} onCreated={()=>{setShowCreate(false);setEditGame(null);}} uLat={uLat} uLng={uLng} editGame={editGame}/>}

            {/* Standalone invite panel */}
            {showInviteFor&&<div className="mo"><InviteStep game={showInviteFor} profile={profile} uLat={uLat} uLng={uLng} onInvitesSent={()=>{setShowInviteFor(null);showToast('Invites sent!');}} onSkip={()=>setShowInviteFor(null)}/></div>}
        </div>
    );
}
ReactDOM.render(<App/>,document.getElementById('root'));
</script>
<script src="nav.js"></script>
</body>
</html>
