const {useState, useEffect, useRef} = React;

// ── Constants & Helpers ───────────────────────────────────────────────
const RATINGS = [

const ratingInfo = key => RATINGS.find(r => r.key === key);

const FUNNY_5PLUS = [
    "Woah there! 🎾 Maybe try the ATP tour instead?",

    "I've been watching YouTube tutorials all week — fear me 📹",
    "My therapist said this was better than revenge 🧘",
];
const randFunnyComment = () => FUNNY_COMMENTS[Math.floor(Math.random() * FUNNY_COMMENTS.length)];

const DURATION_OPTIONS = [
    {label:'1 hr',value:60,funny:null},
    {label:'2 hr',value:120,funny:null},
    {label:'3 hr',value:180,funny:null},
    {label:'4 hr',value:240,funny:'💧 4 hours?! Stay hydrated!'},
    {label:'All Day',value:480,funny:'🌮 All day?! Say goodbye to your legs!'},
];

const AMENITIES = [
    {key:'restrooms',label:'🚻 Restrooms'},
    {key:'parking',label:'🅿️ Parking'},
    {key:'lights',label:'💡 Lights'},
    {key:'water',label:'💧 Water'},
    {key:'benches',label:'🪑 Benches'},
    {key:'shade',label:'⛱️ Shade'},
    {key:'indoor',label:'🏢 Indoor'},
    {key:'pro_shop',label:'🛒 Pro Shop'},
];

function buildTimeOptions() {
    const opts = [];
    const now = new Date();
    const todayStart = new Date(now); todayStart.setMinutes(0,0,0); todayStart.setHours(todayStart.getHours()+1);
    const todayEnd = new Date(now); todayEnd.setHours(23,0,0,0);
    const cur = new Date(todayStart);
    while (cur <= todayEnd) {
        opts.push({label:cur.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),value:cur.getTime()});
        cur.setHours(cur.getHours()+1);
    }
    const tomorrow = new Date(now); tomorrow.setDate(tomorrow.getDate()+1); tomorrow.setHours(6,0,0,0);
    const tomorrowEnd = new Date(tomorrow); tomorrowEnd.setHours(22,0,0,0);
    const tmr = new Date(tomorrow);
    while (tmr <= tomorrowEnd) {
        opts.push({label:tmr.toLocaleDateString([],{weekday:'short'})+' '+tmr.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),value:tmr.getTime()});
        tmr.setHours(tmr.getHours()+1);
    }
    return opts;
}

function groupByHour(players) {
    const groups = {};
    players.forEach(c => {
        const ts = c.arrivalTime || c.timestamp;
        const d = new Date(ts); d.setMinutes(0,0,0);
        const key = d.getTime();
        if (!groups[key]) groups[key] = {ts:key,players:[]};
        groups[key].players.push(c);
    });
    return Object.values(groups).sort((a,b) => a.ts - b.ts);
}

function headcount(players) { return players.reduce((sum,p) => sum+1+(p.guests||0), 0); }
const wIcon = (temp, wind) => wind > 20 ? '🌬️' : temp < 32 ? '🥶' : temp < 50 ? '🧥' : temp > 88 ? '☀️' : '⛅';

// ── PlayTimer ─────────────────────────────────────────────────────────
function PlayTimer({checkInTime, durationMins}) {
    const [remaining, setRemaining] = useState(0);
    useEffect(() => {
        const calc = () => setRemaining(Math.max(0, checkInTime + durationMins*60000 - Date.now()));
        calc(); const t = setInterval(calc, 10000); return () => clearInterval(t);
    }, [checkInTime, durationMins]);
    if (remaining <= 0) return <span style={{fontSize:11,color:'#ef4444',fontWeight:700}}>⏰ Time's up!</span>;
    const mins = Math.ceil(remaining/60000), hrs = Math.floor(mins/60), m = mins%60;
    const pct = Math.max(0, (remaining/(durationMins*60000))*100);
    return (
        <div style={{minWidth:80}}>
            <span style={{fontSize:11,color:'#059669',fontWeight:700}}>⏱ {hrs>0?`${hrs}h `:''}{m}m left</span>
            <div className="timer-track"><div className="timer-fill" style={{width:`${pct}%`}}/></div>
        </div>
    );
}

// ── PlayerRow ─────────────────────────────────────────────────────────
function PlayerRow({p, isNow}) {
    const ri = ratingInfo(p.rating);
    const nowMs = Date.now();
    const effectivelyNow = isNow || p.status==='now' || (p.status==='later'&&p.arrivalTime&&nowMs>=p.arrivalTime);
    const arrLabel = p.status==='later'&&p.arrivalTime&&!effectivelyNow ? new Date(p.arrivalTime).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}) : null;
    const guests = p.guests||0;
    return (
        <div className="player-item">
            <div className="player-avatar">{(p.userName||'?')[0].toUpperCase()}</div>
            <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:700,fontSize:14,color:'#0f172a',display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                    {p.userName}
                    {guests>0&&<span style={{fontSize:11,fontWeight:700,color:'#7c3aed',background:'#ede9fe',borderRadius:10,padding:'1px 6px'}}>+{guests} guest{guests>1?'s':''}</span>}
                    {ri&&<span className={`rating-badge ${ri.cls}`}>{ri.label}</span>}
                </div>
                <div style={{fontSize:12,color:'#64748b',display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                    <span>{effectivelyNow?'🎾 Playing':arrLabel?`⏰ Arriving ${arrLabel}`:'👀 Watching'}</span>
                    {effectivelyNow&&p.duration&&<PlayTimer checkInTime={p.timestamp} durationMins={p.duration}/>}
                </div>
                {p.comment&&(
                    <div style={{fontSize:12,color:'#059669',fontStyle:'italic',marginTop:3,background:'#f0fdf4',borderRadius:7,padding:'3px 8px',display:'inline-block',maxWidth:'100%',wordBreak:'break-word'}}>
                        💬 {p.comment}
                    </div>
                )}
            </div>
            <div style={{fontSize:10,color:'#cbd5e1',flexShrink:0}}>
                {new Date(p.timestamp).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
            </div>
        </div>
    );
}

// ── Edit Court Modal ──────────────────────────────────────────────────
function EditCourtModal({court, onClose, onSaved}) {
    const [name, setName] = useState(court.name||'');
    const [address, setAddress] = useState(court.address||'');
    const [numCourts, setNumCourts] = useState(court.numberOfCourts||4);
    const [amenities, setAmenities] = useState(court.amenities||[]);
    const [rules, setRules] = useState(court.courtRules||'');
    const [saving, setSaving] = useState(false);
    const [geoStatus, setGeoStatus] = useState(null);
    const [geoFixing, setGeoFixing] = useState(false);
    const [lat, setLat] = useState(court.lat||null);
    const [lng, setLng] = useState(court.lng||null);
    const geoDebounceRef = useRef(null);

    const toggleAmenity = key => setAmenities(a => a.includes(key)?a.filter(x=>x!==key):[...a,key]);

    const geocodeAddress = async (addr) => {
        try {
            const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addr)}&limit=1&addressdetails=1`);
            const d = await r.json();
            if (d.length) return { lat: parseFloat(d[0].lat), lng: parseFloat(d[0].lon), display: d[0].display_name };
        } catch(e) {}
        return null;
    };

    // Auto-geocode when address changes, debounced 900ms
    const handleAddressChange = (val) => {
        setAddress(val);
        setGeoStatus(null);
        if (geoDebounceRef.current) clearTimeout(geoDebounceRef.current);
        if (!val.trim() || val.trim().length < 8) return;
        geoDebounceRef.current = setTimeout(async () => {
            setGeoFixing(true);
            const geo = await geocodeAddress(val.trim());
            if (geo) {
                setLat(geo.lat);
                setLng(geo.lng);
                setGeoStatus({ok:true, msg:`📍 Auto-located: ${geo.lat.toFixed(4)}, ${geo.lng.toFixed(4)}`});
            } else {
                setGeoStatus({ok:false, msg:'Could not auto-locate. Try clicking Fix Location.'});
            }
            setGeoFixing(false);
        }, 900);
    };

    const fixCoords = async () => {
        const addrToGeo = address.trim() || court.address;
        if (!addrToGeo) { setGeoStatus({ok:false,msg:'No address to geocode.'}); return; }
        setGeoFixing(true);
        setGeoStatus(null);
        const geo = await geocodeAddress(addrToGeo);
        if (geo) {
            setLat(geo.lat);
            setLng(geo.lng);
            setGeoStatus({ok:true, msg:`📍 Found: ${geo.lat.toFixed(4)}, ${geo.lng.toFixed(4)}`});
        } else {
            setGeoStatus({ok:false, msg:'Could not geocode this address. Try a more specific address.'});
        }
        setGeoFixing(false);
    };

    const save = async () => {
        if (!name.trim()) { alert('Court name required.'); return; }
        setSaving(true);
        try {
            const updates = {
                name: name.trim(),
                address: address.trim(),
                numberOfCourts: numCourts,
                amenities,
                courtRules: rules.trim(),
            };
            if (lat && lng) { updates.lat = lat; updates.lng = lng; }
            await db.collection('courts').doc(court.id).update(updates);
            onSaved({...court, ...updates});
        } catch(e) { alert('Save failed: '+e.message); }
        setSaving(false);
    };

    const hasCoords = !!(lat && lng && lat !== 0 && lng !== 0);

const GROUPME_BOT_KEY = 'pickleGroupMeBotId';

async function postGroupMe(text, botId) {
    if (!botId) return;
    try {
        await fetch('https://api.groupme.com/v3/bots/post', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ bot_id: botId, text })
        });
    } catch(e) {
        console.warn('GroupMe post failed:', e);
    }
}

function buildCheckInMsg(name, status, guests, courtName, nowPlaying, nowLater, openCourts, arrivalTime) {
    const nameStr = name + (guests > 0 ? ` (+${guests} guest${guests !== 1 ? 's' : ''})` : '');
    const action = status === 'active' ? 'is playing at' : 'is heading to';
    const arrivalLabel = (status === 'later' && arrivalTime)
        ? new Date(arrivalTime).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'})
        : null;
    const line1 = arrivalLabel
        ? `${nameStr} ${action} ${courtName} at ${arrivalLabel}`
        : `${nameStr} ${action} ${courtName}`;
    return [
        line1,
        `🎾 ${nowPlaying} player${nowPlaying !== 1 ? 's' : ''} playing now`,
        `📅 ${nowLater} arriving soon  🏟 ${openCourts} court${openCourts !== 1 ? 's' : ''} rotating`,
    ].join('\n');
}

function buildCheckOutMsg(name, courtName, nowPlaying, nowLater, openCourts) {
    return [
        `👋 ${name} left ${courtName}`,
        `🎾 ${nowPlaying} player${nowPlaying !== 1 ? 's' : ''} playing now`,
        `📅 ${nowLater} arriving soon  🏟 ${openCourts} court${openCourts !== 1 ? 's' : ''} rotating`,
    ].join('\n');
}

function buildStatusMsg(courtName, field, value) {
    const labels = {
        condition: { open: '✅ Courts Open', closed: '🚫 Courts Closed', wet: '💧 Courts Wet', hot: '🥵 Very Hot', windy: '🌬️ Windy Conditions' },
        crowdLevel: { low: '🟢 Light crowd (0–12)', medium: '🟡 Busy (12–24)', high: '🔴 Packed (24+)' },
    };
    const map = labels[field];
    if (!map) return null;
    const label = map[value];
    if (!label) return null;
    return `${label} at ${courtName}`;
}

function applyPlaceholders(template, {name='', court='', players='', courts=''}) {
    return template
        .replace(/\{name\}/g, name)
        .replace(/\{court\}/g, court)
        .replace(/\{players\}/g, players)
        .replace(/\{courts\}/g, courts);
}

// Fire a GroupMe event for a given trigger type, using event_rules from Firestore if available
async function fireGroupMeEvent(courtId, trigger, defaultMsg, placeholders) {
    if (!fbOk || !db || !courtId) return;

    // Get bot config from Firestore only — no localStorage fallback
    // (localStorage would bleed Court A's bot into Court B)
    const botDoc = await db.collection('groupme_bots').doc(courtId).get().catch(()=>null);
    const botCfg = botDoc?.exists ? botDoc.data() : null;
    if (!botCfg?.enabled || !botCfg?.botId) return; // this court has no bot configured

    const botId = botCfg.botId;

    // Check if an event rule exists for this specific trigger on this court
    const rulesSnap = await db.collection('groupme_bots').doc(courtId).collection('event_rules')
        .where('trigger','==',trigger).where('enabled','==',true).get().catch(()=>null);

    // Only fire if an explicit event rule exists for this trigger
    if (!rulesSnap || rulesSnap.empty) return;

    const rule = rulesSnap.docs[0].data();
    const msg = rule.customMsg ? applyPlaceholders(rule.customMsg, placeholders||{}) : defaultMsg;
    if (msg) await postGroupMe(msg, botId);
}

function CourtPage() {
    const courtId = getCourtId();
    const [courtData,   setCourtData]   = useState(null);
    const [checkIns,    setCheckIns]    = useState([]);
    const [loading,     setLoading]     = useState(true);
    const [tab,         setTab]         = useState('now');
    const [showForm,    setShowForm]    = useState(false);
    const [userName,    setUserName]    = useState('');
    const [userRating,  setUserRating]  = useState('');
    const [arrivalTime, setArrivalTime] = useState('');
    const [showLaterTime,setShowLaterTime]=useState(false);
    const [duration,    setDuration]    = useState(120);
    const [guestCount,  setGuestCount]  = useState(0);
    const [comment,     setComment]     = useState('');
    const [funnyMsg,    setFunnyMsg]    = useState('');
    const [durationFunny,setDurationFunny]=useState('');
    const [guestFunny,  setGuestFunny]  = useState('');
    const [weather,     setWeather]     = useState(null);
    const [forecast,    setForecast]    = useState([]);
    const [wxUpdated,   setWxUpdated]   = useState(null);
    const [flashMsg,    setFlashMsg]    = useState('');
    const [flashDismissed, setFlashDismissed] = useState(false);
    const [flashInput,  setFlashInput]  = useState('');
    const [showEdit,    setShowEdit]    = useState(false);
    const [showFB,      setShowFB]      = useState(false);
    const [showGroupMe, setShowGroupMe] = useState(false);
    const [showTotalEdit,setShowTotalEdit]=useState(false);
    const [newTotal,    setNewTotal]    = useState('');
    const [tick,        setTick]        = useState(0);

    const checkInsRef = useRef([]);

    // Device identity
    const [deviceId] = useState(() => {
        let id = localStorage.getItem('pickleDeviceId');
        if (!id) { id = 'dev_'+Math.random().toString(36).slice(2,11); localStorage.setItem('pickleDeviceId',id); }
        return id;
    });

    useEffect(() => {
        const n = localStorage.getItem('pickleCourtUserName');
        const r = localStorage.getItem('pickleCourtRating');
        if (n) setUserName(n);
        if (r) setUserRating(r);
    }, []);

    // Tick every minute for auto-promote
    useEffect(() => {
        const t = setInterval(() => setTick(n=>n+1), 60000);
        return () => clearInterval(t);
    }, []);

    // Load court data
    useEffect(() => {
        if (!courtId || !fbOk || !db) { setLoading(false); return; }
        const unsub = db.collection('courts').doc(courtId).onSnapshot(doc => {
            if (doc.exists) {
                const data = {id:doc.id,...doc.data()};
                setCourtData(data);
                localStorage.setItem('lastCourtId', doc.id);
                localStorage.setItem('lastCourtName', data.name);
                if (data.flashMsg && data.flashMsgTime && (Date.now()-data.flashMsgTime) < 4*3600000) {
                    setFlashMsg(prev => {
                        // If the message changed, reset dismissed so new message shows
                        if (prev !== data.flashMsg) setFlashDismissed(false);
                        return data.flashMsg;
                    });
                } else { setFlashMsg(''); }
            } else {
                setCourtData(null);
            }
            setLoading(false);
        }, () => setLoading(false));
        return () => unsub();
    }, [courtId]);

    // Load check-ins (subcollection)
    useEffect(() => {
        if (!courtId || !fbOk || !db) return;
        const unsub = db.collection('courts').doc(courtId).collection('checkins')
            .onSnapshot(snap => {
                const now = Date.now(), cutoff = now - 24*3600000;
                // Delete any checked-out or stale docs we encounter
                snap.docs.forEach(d => {
                    const c = d.data();
                    if (c.status === 'checked-out') {
                        d.ref.delete().catch(()=>{});
                    }
                });
                const list = snap.docs.map(d=>({id:d.id,...d.data()}))
                    .filter(c => c.status !== 'checked-out' && c.timestamp > cutoff)
                    .sort((a,b) => (a.arrivalTime||a.timestamp)-(b.arrivalTime||b.timestamp));
                checkInsRef.current = list;
                setCheckIns(list);
            }, err => console.warn('Checkins:', err.message));
        return () => unsub();
    }, [courtId]);

    // Auto-checkout / auto-promote interval
    useEffect(() => {
        if (!courtId || !fbOk || !db) return;
        const tick = async () => {
            const now = Date.now(), list = checkInsRef.current;
            for (const c of list) {
                const startTime = c.status==='active' ? c.timestamp : c.arrivalTime;
                const expired = c.duration && startTime && now > startTime + c.duration*60000;
                // Delete expired active check-ins
                if (c.status==='active' && expired) {
                    await db.collection('courts').doc(courtId).collection('checkins').doc(c.id).delete().catch(()=>{});
                    continue;
                }
                // Also delete expired 'later' check-ins (in case promotion failed)
                if (c.status==='later' && expired) {
                    await db.collection('courts').doc(courtId).collection('checkins').doc(c.id).delete().catch(()=>{});
                    continue;
                }
                // Clean up stale checked-out docs
                if (c.status==='checked-out' && c.timestamp && now > c.timestamp + 10*60000) {
                    await db.collection('courts').doc(courtId).collection('checkins').doc(c.id).delete().catch(()=>{});
                    continue;
                }
                // Promote 'later' to 'active' when arrival time is reached
                if (c.status==='later' && c.arrivalTime && now >= c.arrivalTime) {
                    await db.collection('courts').doc(courtId).collection('checkins').doc(c.id).update({status:'active',timestamp:now}).catch(()=>{});
                }
            }
        };
        tick();
        const t = setInterval(tick, 15000);
        return () => clearInterval(t);
    }, [courtId]);

    // Weather (use court lat/lng when available)
    useEffect(() => {
        if (!courtData?.lat || !courtData?.lng) return;
        fetchWeather(courtData.lat, courtData.lng);
        const t = setInterval(() => fetchWeather(courtData.lat, courtData.lng), 3600000);
        return () => clearInterval(t);
    }, [courtData?.lat, courtData?.lng]);

    const fetchWeather = async (lat, lng) => {
        try {
            const pointRes = await fetch(`https://api.weather.gov/points/${lat},${lng}`,{headers:{'User-Agent':'PickleCourtConnect/2.0'}});
            const pointData = await pointRes.json();
            const fxRes = await fetch(pointData.properties.forecastHourly,{headers:{'User-Agent':'PickleCourtConnect/2.0'}});
            const fxData = await fxRes.json();
            const periods = fxData.properties.periods, cur = periods[0];
            const windGust = cur.windGust?parseInt(cur.windGust):null;
            setWeather({temp:cur.temperature,wind:parseInt(cur.windSpeed),gust:windGust,desc:cur.shortForecast});
            setWxUpdated(new Date());
            setForecast(periods.slice(0,12).map(p=>({dt:new Date(p.startTime),temp:p.temperature,wind:parseInt(p.windSpeed),gust:p.windGust?parseInt(p.windGust):null,desc:p.shortForecast})));
        } catch(e) {
            try {
                const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,wind_speed_10m,wind_gusts_10m&hourly=temperature_2m,wind_speed_10m,wind_gusts_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&forecast_days=1`);
                const d = await r.json();
                setWeather({temp:Math.round(d.current.temperature_2m),wind:Math.round(d.current.wind_speed_10m),gust:d.current.wind_gusts_10m?Math.round(d.current.wind_gusts_10m):null});
                setWxUpdated(new Date());
                const now = new Date();
                setForecast(d.hourly.time.map((t,i)=>({dt:new Date(t),temp:Math.round(d.hourly.temperature_2m[i]),wind:Math.round(d.hourly.wind_speed_10m[i]),gust:d.hourly.wind_gusts_10m[i]?Math.round(d.hourly.wind_gusts_10m[i]):null})).filter(h=>h.dt>=now&&h.dt.getDate()===now.getDate()));
            } catch(e2) {}
        }
    };

    const updateCourt = async (field, value) => {
        if (!fbOk || !db || !courtId) return;
        await db.collection('courts').doc(courtId).update({[field]:value,lastUpdate:firebase.firestore.FieldValue.serverTimestamp()}).catch(console.error);
        // GroupMe notifications for status changes
        const cName = courtData?.name||'Court';
        const openC = courtData?.openCourts !== undefined ? courtData.openCourts : (courtData?.numberOfCourts||4);
        const players = String(checkInsRef.current.filter(c=>c.status==='active').length||0);
        const courts = String(openC);
        if (field === 'condition') {
            const triggerMap = {closed:'status_closed', open:'status_open', wet:'status_wet'};
            const trigger = triggerMap[value];
            if (trigger) {
                const defaultMsg = buildStatusMsg(cName, field, value);
                if (defaultMsg) fireGroupMeEvent(courtId, trigger, defaultMsg, {court:cName, players, courts});
            }
        } else if (field === 'lightsOn') {
            const trigger = value ? 'lights_on' : 'lights_off';
            const defaultMsg = value ? `💡 Lights are ON at ${cName}` : `🌙 Lights are OFF at ${cName}`;
            fireGroupMeEvent(courtId, trigger, defaultMsg, {court:cName, players, courts});
        } else if (field === 'crowdLevel') {
            const crowdTriggerMap = {high:'crowd_high', low:'crowd_low'};
            const crowdTrigger = crowdTriggerMap[value];
            if (crowdTrigger) {
                const defaultMsg = buildStatusMsg(cName, field, value);
                if (defaultMsg) fireGroupMeEvent(courtId, crowdTrigger, defaultMsg, {court:cName, players, courts});
            }
        }
    };

        if (msg) {
            const cName = courtData?.name||'Court';
            const defaultMsg = `📣 ${cName} Announcement:\n${msg}`;
            fireGroupMeEvent(courtId, 'flash', defaultMsg, {court:cName});
        }
    };

                                    return <span key={k} style={{fontSize:12,background:'rgba(255,255,255,.12)',borderRadius:6,padding:'2px 7px',color:'#e2e8f0'}}>{a[k]||k}</span>;
                                })}

                            </div>

                                    <div style={{fontSize:10,display:'flex',alignItems:'center',gap:2}}><span>💨</span><span style={{color:'#7dd3fc',fontWeight:700}}>{h.wind}</span></div>
                                </div>
                            ))}
                        </div>
                    </div>

                {/* Last update */}

                            <div><div className="pill-label">Court</div><div className="pill-val">{condMap[courtData.condition].l}</div></div>

                                        <div style={{marginBottom:14}}>
                                            <span className="flbl">Comment <span style={{fontWeight:500,textTransform:'none',letterSpacing:0,color:'#94a3b8'}}>(optional)</span></span>
                                            <div style={{position:'relative'}}>
                                                <input className="field" value={comment} onChange={e=>setComment(e.target.value)} placeholder="e.g. looking for a 3rd or 4th…" maxLength={120}/>
                                                <button onClick={()=>setComment(randFunnyComment())} style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',fontSize:15,opacity:.5}} title="Surprise me">🎲</button>
                                            </div>
                                        </div>
                                        {!showLaterTime?(
                                            <div style={{display:'flex',gap:8}}>
                                                <button className="btn-g" onClick={()=>submitCheckIn('now',null)} disabled={!userName.trim()} style={{flex:1}}>👥 Playing Now</button>
                                                <button className="btn-out" onClick={()=>setShowLaterTime(true)} disabled={!userName.trim()}>⏰ Later</button>
                                                <button onClick={()=>setShowForm(false)} style={{background:'none',border:'none',color:'#94a3b8',cursor:'pointer',fontFamily:'Outfit,sans-serif',fontSize:13,padding:'0 8px'}}>Cancel</button>
                                            </div>
                                        ):(
                                            <div>
                                                <span className="flbl">Arrival Time</span>
                                                <select className="field" value={arrivalTime} onChange={e=>setArrivalTime(e.target.value)} style={{marginBottom:10}}>
                                                    <option value="">Select time…</option>
                                                    {timeOpts.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
                                                </select>
                                                <div style={{display:'flex',gap:8}}>
                                                    <button className="btn-g" onClick={()=>{if(!arrivalTime){alert('Select a time');return;}submitCheckIn('later',parseInt(arrivalTime));}} disabled={!userName.trim()||!arrivalTime} style={{flex:1}}>✓ Confirm</button>
                                                    <button onClick={()=>setShowLaterTime(false)} style={{background:'none',border:'none',color:'#94a3b8',cursor:'pointer',fontFamily:'Outfit,sans-serif',fontSize:13,padding:'0 8px'}}>Back</button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )
                            )}

                            {nowPlayers.length>0?(
                                nowPlayers.map(p=><PlayerRow key={p.id} p={p} isNow={true}/>)
                            ):(
                                <div style={{textAlign:'center',padding:'24px 0',color:'#94a3b8',fontSize:14}}>
                                    No one here yet — be the first! 🎾
                                </div>
                            )}
                        </div>
                    )}

                    {/* ── TAB: SCHEDULE ── */}
                    {tab==='schedule'&&(
                        <div className="card">
                            <div className="fd" style={{fontSize:19,fontWeight:800,color:'#0f172a',marginBottom:12}}>📅 COMING SOON ({laterTotal} players)</div>
                            {schedule.length===0?(
                                <div style={{textAlign:'center',padding:'24px 0',color:'#94a3b8',fontSize:14}}>Nobody scheduled yet.</div>
                            ):(
                                schedule.map(group=>(
                                    <div key={group.ts} className={`hour-block has-players`}>
                                        <div style={{fontSize:13,fontWeight:800,color:'#059669',marginBottom:8}}>
                                            ⏰ {new Date(group.ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})} · {headcount(group.players)} coming
                                        </div>
                                        {group.players.map(p=><PlayerRow key={p.id} p={p} isNow={false}/>)}
                                    </div>
                                ))
                            )}
                        </div>
                    )}

                    {/* ── TAB: CONTROLS ── */}
                    {tab==='controls'&&(
                        <div>
                            {/* Flash Announcement */}
                            <div className="card" style={{marginBottom:12,borderLeft:'4px solid #7c3aed'}}>
                                <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
                                    <div style={{width:36,height:36,borderRadius:10,background:'linear-gradient(135deg,#7c3aed,#a855f7)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,flexShrink:0}}>📣</div>
                                    <div>
                                        <div style={{fontFamily:'Barlow Condensed,sans-serif',fontSize:16,fontWeight:800,color:'#0f172a',letterSpacing:.3}}>FLASH ANNOUNCEMENT</div>
                                        <div style={{fontFamily:'Outfit,sans-serif',fontSize:12,color:'#64748b'}}>Broadcast a message to all visitors</div>
                                    </div>
                                </div>
                                {flashMsg&&(
                                    <div style={{background:'linear-gradient(135deg,#f5f3ff,#ede9fe)',border:'1px solid #c4b5fd',borderRadius:10,padding:'10px 14px',fontSize:14,fontWeight:600,color:'#4c1d95',marginBottom:10,lineHeight:1.4,display:'flex',gap:8,alignItems:'flex-start'}}>
                                        <span>📣</span><span style={{flex:1}}>{flashMsg}</span>
                                    </div>
                                )}
                                <div style={{display:'flex',gap:8}}>
                                    <input className="field" value={flashInput} onChange={e=>setFlashInput(e.target.value)} placeholder={flashMsg?'Update message…':'e.g. Court 3 is closed today'} style={{flex:1,fontSize:14}} onKeyDown={e=>{if(e.key==='Enter'&&flashInput.trim())saveFlashMsg();}}/>
                                    <button className="btn-g" onClick={saveFlashMsg} disabled={!flashInput.trim()} style={{padding:'10px 16px',fontSize:13,flexShrink:0}}>{flashMsg?'Update':'Post'}</button>
                                    {flashMsg&&<button onClick={clearFlashMsg} style={{padding:'10px 12px',borderRadius:9,border:'2px solid #e2e8f0',background:'white',color:'#94a3b8',fontWeight:600,fontSize:12,cursor:'pointer',fontFamily:'Outfit,sans-serif',flexShrink:0}} title="Remove announcement for everyone">🗑️ Remove</button>}
                                </div>
                            </div>

                            {/* Status Grid */}
                            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
                                {/* Crowd Level */}
                                <div className="card" style={{borderLeft:'4px solid '+(courtData.crowdLevel==='high'?'#ef4444':courtData.crowdLevel==='medium'?'#f59e0b':'#10b981'),marginBottom:0}}>
                                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
                                        <span style={{fontSize:20}}>{courtData.crowdLevel==='high'?'🔴':courtData.crowdLevel==='medium'?'🟡':'🟢'}</span>
                                        <div style={{fontFamily:'Barlow Condensed,sans-serif',fontSize:14,fontWeight:800,color:'#0f172a',letterSpacing:.3}}>CROWD LEVEL</div>
                                    </div>
                                    <div style={{display:'flex',flexDirection:'column',gap:6}}>
                                        {[['low','🟢 Light','0–12 people'],['medium','🟡 Busy','12–24 people'],['high','🔴 Packed','24+ people']].map(([v,label,sub])=>(
                                            <button key={v} onClick={()=>updateCourt('crowdLevel',v)} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',borderRadius:8,border:'2px solid '+(courtData.crowdLevel===v?'#059669':'#e2e8f0'),background:courtData.crowdLevel===v?'#f0fdf4':'white',cursor:'pointer',textAlign:'left',transition:'all .15s'}}>
                                                <span style={{fontSize:14}}>{label.split(' ')[0]}</span>
                                                <div style={{minWidth:0}}>
                                                    <div style={{fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:700,color:courtData.crowdLevel===v?'#059669':'#374151'}}>{label.slice(3)}</div>
                                                    <div style={{fontFamily:'Outfit,sans-serif',fontSize:10,color:'#94a3b8'}}>{sub}</div>
                                                </div>
                                                {courtData.crowdLevel===v&&<span style={{marginLeft:'auto',color:'#059669',fontSize:14}}>✓</span>}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Court Condition */}
                                <div className="card" style={{borderLeft:'4px solid '+(courtData.condition==='closed'?'#ef4444':courtData.condition&&courtData.condition!=='open'?'#f59e0b':'#10b981'),marginBottom:0}}>
                                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
                                        <span style={{fontSize:20}}>{courtData.condition==='closed'?'🚫':courtData.condition==='wet'?'💧':courtData.condition==='hot'?'🥵':courtData.condition==='windy'?'🌬️':'✅'}</span>
                                        <div style={{fontFamily:'Barlow Condensed,sans-serif',fontSize:14,fontWeight:800,color:'#0f172a',letterSpacing:.3}}>CONDITION</div>
                                    </div>
                                    <div style={{display:'flex',flexDirection:'column',gap:6}}>
                                        {[['open','✅','Open'],['closed','🚫','Closed'],['wet','💧','Wet'],['hot','🥵','Hot'],['windy','🌬️','Windy']].map(([v,icon,label])=>(
                                            <button key={v} onClick={()=>updateCourt('condition',v)} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 10px',borderRadius:8,border:'2px solid '+((courtData.condition||'open')===v?'#059669':'#e2e8f0'),background:(courtData.condition||'open')===v?'#f0fdf4':'white',cursor:'pointer',textAlign:'left',transition:'all .15s'}}>
                                                <span style={{fontSize:14,flexShrink:0}}>{icon}</span>
                                                <div style={{fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:700,color:(courtData.condition||'open')===v?'#059669':'#374151',flex:1}}>{label}</div>
                                                {(courtData.condition||'open')===v&&<span style={{color:'#059669',fontSize:14}}>✓</span>}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {/* Courts in Rotation */}
                            <div className="card" style={{marginBottom:10,borderLeft:'4px solid #3b82f6'}}>
                                <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
                                    <div style={{width:36,height:36,borderRadius:10,background:'linear-gradient(135deg,#3b82f6,#60a5fa)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,flexShrink:0}}>🏟️</div>
                                    <div style={{flex:1}}>
                                        <div style={{fontFamily:'Barlow Condensed,sans-serif',fontSize:16,fontWeight:800,color:'#0f172a',letterSpacing:.3}}>COURTS IN ROTATION</div>
                                        <div style={{fontFamily:'Outfit,sans-serif',fontSize:12,color:'#64748b'}}>Courts currently active for play</div>
                                    </div>
                                    <div style={{fontFamily:'Barlow Condensed,sans-serif',fontSize:28,fontWeight:800,color:'#3b82f6'}}>{open}<span style={{fontSize:16,color:'#94a3b8'}}>/{total}</span></div>
                                </div>
                                <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                                    {openOpts.map(n=>(
                                        <button key={n} onClick={()=>updateCourt('openCourts',n)} style={{minWidth:48,padding:'9px 8px',border:'2px solid '+(open===n?'#3b82f6':'#e2e8f0'),borderRadius:8,background:open===n?'#eff6ff':'white',color:open===n?'#3b82f6':'#64748b',fontFamily:'Outfit,sans-serif',fontSize:14,fontWeight:700,cursor:'pointer',transition:'all .15s',textAlign:'center'}}>{n}</button>
                                    ))}
                                </div>
                            </div>

                            {/* Total Courts + Lights + Restroom + Parking in a grid */}
                            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
                                {/* Total Courts */}
                                <div className="card" style={{marginBottom:0,borderLeft:'4px solid #0f172a'}}>
                                    <div style={{fontFamily:'Barlow Condensed,sans-serif',fontSize:14,fontWeight:800,color:'#0f172a',letterSpacing:.3,marginBottom:8}}>🏗️ TOTAL COURTS</div>
                                    {showTotalEdit?(
                                        <div style={{display:'flex',gap:6,alignItems:'center'}}>
                                            <input type="number" min="1" max="30" className="field" value={newTotal} onChange={e=>setNewTotal(e.target.value)} style={{flex:1,padding:'8px 10px',fontSize:15}}/>
                                            <button className="btn-g" onClick={handleTotalSave} style={{padding:'8px 12px',fontSize:13,flexShrink:0}}>✓</button>
                                            <button onClick={()=>setShowTotalEdit(false)} style={{padding:'8px 10px',background:'none',border:'2px solid #e2e8f0',borderRadius:8,color:'#94a3b8',cursor:'pointer',fontFamily:'Outfit,sans-serif',fontSize:12,flexShrink:0}}>✕</button>
                                        </div>
                                    ):(
                                        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                                            <div style={{fontFamily:'Barlow Condensed,sans-serif',fontSize:36,fontWeight:800,color:'#0f172a'}}>{total}</div>
                                            <button onClick={()=>{setShowTotalEdit(true);setNewTotal(String(total));}} style={{background:'#f0fdf4',border:'1px solid #10b981',borderRadius:8,padding:'6px 12px',fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:600,color:'#059669',cursor:'pointer'}}>✏️ Edit</button>
                                        </div>
                                    )}
                                </div>

                                {/* Lights */}
                                <div className="card" style={{marginBottom:0,borderLeft:'4px solid '+(courtData.lightsOn?'#f59e0b':'#94a3b8')}}>
                                    <div style={{fontFamily:'Barlow Condensed,sans-serif',fontSize:14,fontWeight:800,color:'#0f172a',letterSpacing:.3,marginBottom:8}}>💡 LIGHTS</div>
                                    <div style={{display:'flex',border:'2px solid #e2e8f0',borderRadius:10,overflow:'hidden'}}>
                                        <button onClick={()=>updateCourt('lightsOn',true)} style={{flex:1,padding:'10px 8px',background:courtData.lightsOn?'#f59e0b':'white',color:courtData.lightsOn?'white':'#94a3b8',border:'none',fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:700,cursor:'pointer',transition:'all .15s'}}>💡 ON</button>
                                        <button onClick={()=>updateCourt('lightsOn',false)} style={{flex:1,padding:'10px 8px',background:!courtData.lightsOn?'#1e293b':'white',color:!courtData.lightsOn?'white':'#94a3b8',border:'none',borderLeft:'1px solid #e2e8f0',fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:700,cursor:'pointer',transition:'all .15s'}}>🌙 OFF</button>
                                    </div>
                                </div>

                                {/* Restrooms */}
                                <div className="card" style={{marginBottom:0,borderLeft:'4px solid '+((courtData.restroom||'open')==='open'?'#10b981':'#ef4444')}}>
                                    <div style={{fontFamily:'Barlow Condensed,sans-serif',fontSize:14,fontWeight:800,color:'#0f172a',letterSpacing:.3,marginBottom:8}}>🚻 RESTROOMS</div>
                                    <div style={{display:'flex',border:'2px solid #e2e8f0',borderRadius:10,overflow:'hidden'}}>
                                        <button onClick={()=>updateCourt('restroom','open')} style={{flex:1,padding:'10px 8px',background:(courtData.restroom||'open')==='open'?'#10b981':'white',color:(courtData.restroom||'open')==='open'?'white':'#94a3b8',border:'none',fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:700,cursor:'pointer',transition:'all .15s'}}>✅ Open</button>
                                        <button onClick={()=>updateCourt('restroom','closed')} style={{flex:1,padding:'10px 8px',background:courtData.restroom==='closed'?'#ef4444':'white',color:courtData.restroom==='closed'?'white':'#94a3b8',border:'none',borderLeft:'1px solid #e2e8f0',fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:700,cursor:'pointer',transition:'all .15s'}}>🚫 Closed</button>
                                    </div>
                                </div>

                                {/* Parking */}
                                <div className="card" style={{marginBottom:0,borderLeft:'4px solid '+((courtData.parking||'available')==='available'?'#059669':'#ef4444')}}>
                                    <div style={{fontFamily:'Barlow Condensed,sans-serif',fontSize:14,fontWeight:800,color:'#0f172a',letterSpacing:.3,marginBottom:8}}>🅿️ PARKING</div>
                                    <div style={{display:'flex',border:'2px solid #e2e8f0',borderRadius:10,overflow:'hidden'}}>
                                        <button onClick={()=>updateCourt('parking','available')} style={{flex:1,padding:'10px 8px',background:(courtData.parking||'available')==='available'?'#059669':'white',color:(courtData.parking||'available')==='available'?'white':'#94a3b8',border:'none',fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:700,cursor:'pointer',transition:'all .15s'}}>✅ Available</button>
                                        <button onClick={()=>updateCourt('parking','full')} style={{flex:1,padding:'10px 8px',background:courtData.parking==='full'?'#ef4444':'white',color:courtData.parking==='full'?'white':'#94a3b8',border:'none',borderLeft:'1px solid #e2e8f0',fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:700,cursor:'pointer',transition:'all .15s'}}>🚗 Full</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ── TAB: INFO ── */}
                    {tab==='info'&&(
                        <div className="card">
                            <div className="fd" style={{fontSize:19,fontWeight:800,color:'#0f172a',marginBottom:16}}>ℹ️ COURT INFO</div>
                            <div style={{marginBottom:14}}>
                                <div style={{fontSize:11,fontWeight:700,color:'#64748b',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:6}}>Location</div>
                                <div style={{fontSize:15,color:'#1e293b',fontWeight:600}}>{courtData.name}</div>
                                <div style={{fontSize:13,color:'#64748b'}}>{courtData.address}</div>
                                <a href={`https://maps.google.com/?q=${encodeURIComponent(courtData.address)}`} target="_blank" rel="noopener noreferrer" style={{display:'inline-block',marginTop:8,color:'#059669',fontSize:13,fontWeight:600,textDecoration:'none'}}>
                                    🗺️ Open in Google Maps →
                                </a>
                            </div>
                            <div style={{marginBottom:14}}>
                                <div style={{fontSize:11,fontWeight:700,color:'#64748b',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:6}}>Courts</div>
                                <div style={{fontSize:24,fontWeight:800,fontFamily:'Barlow Condensed,sans-serif',color:'#0f172a'}}>{total} courts</div>
                            </div>
                            {courtData.amenities?.length>0&&(
                                <div style={{marginBottom:14}}>
                                    <div style={{fontSize:11,fontWeight:700,color:'#64748b',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:8}}>Amenities</div>
                                    <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                                        {courtData.amenities.map(k=>{
                                            const a = AMENITIES.find(x=>x.key===k);
                                            return a ? <span key={k} style={{background:'#f0fdf4',border:'1px solid #a7f3d0',borderRadius:8,padding:'5px 11px',fontSize:13,fontWeight:600,color:'#059669'}}>{a.label}</span> : null;
                                        })}
                                    </div>
                                </div>
                            )}
                            {courtData.courtRules&&(
                                <div>
                                    <div style={{fontSize:11,fontWeight:700,color:'#64748b',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:6}}>Rules & Notes</div>
                                    <div style={{background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:10,padding:'12px',fontSize:14,color:'#374151',lineHeight:1.6,whiteSpace:'pre-wrap'}}>{courtData.courtRules}</div>
                                </div>
                            )}
                            <button onClick={()=>setShowEdit(true)} className="btn-out" style={{marginTop:18,width:'100%'}}>✏️ Edit Court Info</button>
                        </div>
                    )}
                </div>
            </div>

            {/* Footer */}
            <div style={{textAlign:'center',padding:'20px 16px 28px',fontSize:12,color:'#94a3b8',borderTop:'1px solid #e2e8f0',marginTop:8,background:'white'}}>
                <a href="tournament.html" style={{display:'inline-flex',alignItems:'center',gap:8,background:'linear-gradient(135deg,#7c3aed,#a855f7)',color:'white',padding:'10px 20px',borderRadius:10,fontWeight:700,fontSize:13,textDecoration:'none',boxShadow:'0 4px 12px rgba(124,58,237,.3)',marginBottom:14}}>
                    🏆 Open Tournament Generator
                </a>
                <div style={{display:'flex',justifyContent:'center',alignItems:'center',gap:12,flexWrap:'wrap',fontSize:12,color:'#94a3b8'}}>
                    <span>© 2025 PickleConnect. All rights reserved.</span>
                    <span>·</span>
                    <span>Built for pickleball players</span>
                    <span>·</span>
                    <button onClick={()=>setShowFB(true)} style={{background:'none',border:'none',color:'#059669',fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:700,cursor:'pointer',padding:0}}>💬 Feedback</button>
                </div>
            </div>

            {/* Edit modal */}
            {showEdit&&<EditCourtModal court={courtData} onClose={()=>setShowEdit(false)} onSaved={c=>{setCourtData(c);setShowEdit(false);}}/> }
            {showFB&&<FeedbackModal onClose={()=>setShowFB(false)} courtId={courtId}/>}
            {showGroupMe&&<GroupMeSettingsModal onClose={()=>setShowGroupMe(false)}/>}
        </div>
    );
}

ReactDOM.render(<CourtPage/>, document.getElementById('root'));
</script>
<script src="nav.js"></script>
</body>
</html>
