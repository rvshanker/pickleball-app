<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

// ── Firebase ──────────────────────────────────────────────────────────
const FB={apiKey:"AIzaSyDaFUszTD0-Ro292GOBSlS5vkZSdJM0NF4",authDomain:"pickleball-app-1bba7.firebaseapp.com",projectId:"pickleball-app-1bba7",storageBucket:"pickleball-app-1bba7.firebasestorage.app",messagingSenderId:"645604154338",appId:"1:645604154338:web:b92f87c2cd11d950b737bb"};
let db=null,fbOk=false;
try{if(!firebase.apps.length)firebase.initializeApp(FB);db=firebase.firestore();fbOk=true;}catch(e){console.error('Firebase:',e);}

// ── Helpers ───────────────────────────────────────────────────────────
function haversine(lat1,lon1,lat2,lon2){const R=3958.8,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180,a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.asin(Math.sqrt(a));}
function timeAgo(ts){if(!ts)return '';const d=Date.now()-ts,m=Math.floor(d/60000);if(m<1)return 'just now';if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago';}
function formatAvailTime(ds,ts){if(!ds)return 'Anytime';const d=new Date(ds+(ts?'T'+ts:''));const now=new Date();const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());const target=new Date(d.getFullYear(),d.getMonth(),d.getDate());const diff=Math.round((target-today)/86400000);let l=diff===0?'Today':diff===1?'Tomorrow':d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});if(ts){const[h,m]=ts.split(':').map(Number);l+=` at ${h%12||12}:${m.toString().padStart(2,'0')} ${h>=12?'PM':'AM'}`;}return l;}
function getDeviceId(){let id=localStorage.getItem('pickleDeviceId');if(!id){id='dev_'+Math.random().toString(36).slice(2,11);localStorage.setItem('pickleDeviceId',id);}return id;}
function getConvoId(a,b){return [a,b].sort().join('__');}

const DEVICE_ID=getDeviceId();
const SKILL_LEVELS=['1.0-2.0','2.5-3.0','3.0-3.5','3.5-4.0','4.0-4.5','4.5-5.0','5.0+'];
const SKILL_LABELS={'1.0-2.0':'Beginner','2.5-3.0':'Novice','3.0-3.5':'Intermediate','3.5-4.0':'Advanced','4.0-4.5':'Competitive','4.5-5.0':'Expert','5.0+':'Pro'};
const AGE_RANGES=['18-25','26-35','36-45','46-55','56-65','65+'];
const GENDERS=['Male','Female','Non-binary'];
const PLAY_TYPES=['Casual','Competitive','Tournament','Drilling','League'];

const SKILL_COLORS={'1.0-2.0':'tag-slate','2.5-3.0':'tag-green','3.0-3.5':'tag-blue','3.5-4.0':'tag-purple','4.0-4.5':'tag-amber','4.5-5.0':'tag-pink','5.0+':'tag-pink'};

// ── Name Prompt ───────────────────────────────────────────────────────
function NamePrompt({onDone,onCancel}){
    const[name,setName]=useState(localStorage.getItem('pickleFindName')||'');
    const submit=()=>{if(!name.trim()){alert('Please enter your name.');return;}localStorage.setItem('pickleFindName',name.trim());onDone(name.trim());};
    return(
        <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onCancel();}}>
            <div className="modal-sheet" style={{maxHeight:'auto'}}>
                <div className="modal-handle"/>
                <div style={{textAlign:'center',marginBottom:20}}>
                    <div style={{fontSize:48,marginBottom:10}}>💬</div>
                    <div className="fd" style={{fontSize:22,fontWeight:800,color:'#0f172a',marginBottom:6}}>BEFORE YOU CHAT</div>
                    <div style={{fontSize:14,color:'#64748b'}}>Enter your name so the other player knows who they're talking to.</div>
                </div>
                <div className="form-group">
                    <div className="form-label">Your Name</div>
                    <input className="form-input" value={name} onChange={e=>setName(e.target.value)} placeholder="Display name" maxLength={40} autoFocus onKeyDown={e=>{if(e.key==='Enter')submit();}}/>
                </div>
                <div style={{display:'flex',gap:10}}>
                    <button className="btn-out" onClick={onCancel} style={{flex:1}}>Cancel</button>
                    <button className="btn-g" onClick={submit} style={{flex:1}}>Start Chatting</button>
                </div>
            </div>
        </div>
    );
}

// ── Post Form ─────────────────────────────────────────────────────────
function PostPlayerModal({onClose,onPosted,editData,userLat,userLng,locStatus}){
    const[name,setName]=useState(editData?.name||localStorage.getItem('pickleFindName')||'');
    const[skill,setSkill]=useState(editData?.skill||localStorage.getItem('pickleFindSkill')||'');
    const[age,setAge]=useState(editData?.age||localStorage.getItem('pickleFindAge')||'');
    const[gender,setGender]=useState(editData?.gender||localStorage.getItem('pickleFindGender')||'');
    const[playTypes,setPlayTypes]=useState(editData?.playTypes||[]);
    const[availability,setAvailability]=useState(editData?.availability||'Flexible');
    const[availDate,setAvailDate]=useState(editData?.availDate||'');
    const[availTime,setAvailTime]=useState(editData?.availTime||'');
    const[courtName,setCourtName]=useState(editData?.courtName||'');
    const[city,setCity]=useState(editData?.city||localStorage.getItem('pickleFindCity')||'');
    const[message,setMessage]=useState(editData?.message||'');
    const[showPhone,setShowPhone]=useState(!!editData?.phone);
    const[phone,setPhone]=useState(editData?.phone||'');
    const[showEmail,setShowEmail]=useState(!!editData?.email);
    const[email,setEmail]=useState(editData?.email||'');
    const[saving,setSaving]=useState(false);
    const togglePT=t=>setPlayTypes(p=>p.includes(t)?p.filter(x=>x!==t):[...p,t]);
    const handleSubmit=async()=>{
        if(!name.trim()){alert('Please enter your name.');return;}
        if(!skill){alert('Please select your skill level.');return;}
        if(playTypes.length===0){alert('Please select at least one play type.');return;}
        if(!userLat&&!city.trim()){alert('Location isn\'t available. Please enter your city/area.');return;}
        setSaving(true);
        const data={name:name.trim(),skill,age:age||null,gender:gender||null,playTypes,availability,availDate:availDate||null,availTime:availTime||null,courtName:courtName.trim()||null,city:city.trim()||null,message:message.trim()||null,phone:showPhone&&phone.trim()?phone.trim():null,email:showEmail&&email.trim()?email.trim():null,lat:userLat||null,lng:userLng||null,deviceId:DEVICE_ID,timestamp:Date.now(),status:'active'};
        localStorage.setItem('pickleFindName',name.trim());localStorage.setItem('pickleFindSkill',skill);
        if(age)localStorage.setItem('pickleFindAge',age);if(gender)localStorage.setItem('pickleFindGender',gender);if(city.trim())localStorage.setItem('pickleFindCity',city.trim());
        try{if(editData?.id){await db.collection('findPlayers').doc(editData.id).update(data);data.id=editData.id;}else{const ref=await db.collection('findPlayers').add(data);data.id=ref.id;}onPosted(data);}catch(e){alert('Failed: '+e.message);}
        setSaving(false);
    };
    const todayStr=new Date().toISOString().split('T')[0];
    return(
        <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
            <div className="modal-sheet">
                <div className="modal-handle"/>

                    <button onClick={onClose} style={{background:'#f1f5f9',border:'none',borderRadius:8,width:32,height:32,fontSize:16,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
                </div>
                <div className="form-group"><div className="form-label">Your Name *</div><input className="form-input" value={name} onChange={e=>setName(e.target.value)} placeholder="Display name" maxLength={40}/></div>
                <div className="form-group"><div className="form-label">Skill Level (DUPR/Rating) *</div><div className="opt-grid">{SKILL_LEVELS.map(s=><button key={s} className={`opt-btn ${skill===s?'sel':''}`} onClick={()=>setSkill(s)}>{s} <span style={{fontSize:10,opacity:.7}}>{SKILL_LABELS[s]}</span></button>)}</div></div>

                    <div className="form-group" style={{flex:1}}><div className="form-label">Gender</div><select className="form-select" value={gender} onChange={e=>setGender(e.target.value)}><option value="">Prefer not to say</option>{GENDERS.map(g=><option key={g} value={g}>{g}</option>)}</select></div>
                </div>
                <div className="form-group"><div className="form-label">Looking to Play *</div><div className="opt-grid">{PLAY_TYPES.map(t=><button key={t} className={`opt-btn ${playTypes.includes(t)?'sel':''}`} onClick={()=>togglePT(t)}>{PLAY_TYPE_EMOJI[t]} {t}</button>)}</div></div>
                <div className="form-group"><div className="form-label">When Are You Available?</div><div className="opt-grid" style={{marginBottom:10}}>{AVAILABILITY.map(a=><button key={a} className={`opt-btn ${availability===a?'sel':''}`} onClick={()=>setAvailability(a)}>{a==='Now'?'⚡':a==='Today'?'📅':a==='This Week'?'🗓️':'🤷'} {a}</button>)}</div>{(availability==='This Week'||availability==='Today')&&<div style={{display:'flex',gap:10,marginTop:8}}><input type="date" className="form-input" value={availDate} onChange={e=>setAvailDate(e.target.value)} min={todayStr} style={{flex:1}}/><input type="time" className="form-input" value={availTime} onChange={e=>setAvailTime(e.target.value)} style={{flex:1}}/></div>}</div>
                <div className="form-group"><div className="form-label">Your Area / City {!userLat?'*':''}</div>{userLat?<div style={{fontSize:12,color:'#059669',marginBottom:6,display:'flex',alignItems:'center',gap:4}}><div className="status-dot online" style={{width:6,height:6}}/> GPS detected — city optional</div>:<div style={{fontSize:12,color:'#d97706',marginBottom:6}}>📍 No GPS — enter your city so nearby players can find you</div>}<input className="form-input" value={city} onChange={e=>setCity(e.target.value)} placeholder="e.g. Dardenne Prairie, MO" maxLength={80}/></div>
                <div className="form-group"><div className="form-label">Preferred Court (optional)</div><input className="form-input" value={courtName} onChange={e=>setCourtName(e.target.value)} placeholder="e.g. Dardenne Prairie Community Park" maxLength={100}/></div>
                <div className="form-group"><div className="form-label">Message to Others</div><textarea className="form-input" value={message} onChange={e=>setMessage(e.target.value)} placeholder="Looking for doubles partner, any level welcome!" maxLength={280} rows={2}/></div>
                <div className="form-group"><div className="form-label">Contact Options</div><div style={{fontSize:12,color:'#64748b',marginBottom:10}}>🔒 Private in-app chat is always available. Optionally share:</div><div style={{display:'flex',gap:8,marginBottom:8}}><button className={`opt-btn ${showPhone?'sel':''}`} onClick={()=>setShowPhone(!showPhone)}>📱 Add Phone</button><button className={`opt-btn ${showEmail?'sel':''}`} onClick={()=>setShowEmail(!showEmail)}>✉️ Add Email</button></div>{showPhone&&<input className="form-input" value={phone} onChange={e=>setPhone(e.target.value)} placeholder="Your phone number" type="tel" style={{marginBottom:8}}/>}{showEmail&&<input className="form-input" value={email} onChange={e=>setEmail(e.target.value)} placeholder="Your email address" type="email"/>}</div>
                <button className="btn-g" onClick={handleSubmit} disabled={saving} style={{width:'100%',padding:'14px',fontSize:16,opacity:saving?.6:1}}>{saving?'⏳ Saving...':editData?'✅ Update Post':'🏓 Post & Find Players'}</button>
            </div>
        </div>
    );
}

// ── Private 1-on-1 Chat ───────────────────────────────────────────────
function ChatModal({player,onClose}){
    const[messages,setMessages]=useState([]);
    const[input,setInput]=useState('');
    const[sending,setSending]=useState(false);
    const[loadError,setLoadError]=useState(null);
    const senderName=localStorage.getItem('pickleFindName')||'Anonymous';
    const chatEndRef=useRef(null);
    const convoId=getConvoId(DEVICE_ID,player.deviceId);
    const otherName=player.name||'Player';

    // Listen to private messages
    useEffect(()=>{
        if(!fbOk){setLoadError('Database not available.');return;}
        setLoadError(null);
        const unsub=db.collection('conversations').doc(convoId).collection('messages')
            .orderBy('timestamp','asc')
            .onSnapshot(snap=>{
                setMessages(snap.docs.map(d=>({id:d.id,...d.data()})));
                setTimeout(()=>chatEndRef.current?.scrollIntoView({behavior:'smooth'}),100);
            },err=>{console.error('Chat error:',err);setLoadError('Could not load messages: '+err.message);});
        return()=>unsub();
    },[convoId]);

    // Mark read
    useEffect(()=>{
        if(!fbOk||messages.length===0)return;
        db.collection('conversations').doc(convoId).update({[`readBy_${DEVICE_ID}`]:Date.now()}).catch(()=>{});
    },[convoId,messages.length]);

    const sendMsg=async()=>{
        if(!input.trim()||sending)return;
        setSending(true);
        const now=Date.now(),txt=input.trim();
        try{
            const ref=db.collection('conversations').doc(convoId);
            const doc=await ref.get();
            const convoUpdate={lastMessage:txt,lastMessageBy:DEVICE_ID,lastTimestamp:now,[`participantNames.${DEVICE_ID}`]:senderName,[`readBy_${DEVICE_ID}`]:now};
            if(!doc.exists){
                await ref.set({participants:[DEVICE_ID,player.deviceId].sort(),participantNames:{[DEVICE_ID]:senderName,[player.deviceId]:otherName},createdAt:now,...convoUpdate});
            }else{
                await ref.update(convoUpdate);
            }
            await ref.collection('messages').add({text:txt,senderDeviceId:DEVICE_ID,senderName:senderName,timestamp:now});
            setInput('');
        }catch(e){console.error('Send error:',e);alert('Failed to send: '+e.message);}
        setSending(false);
    };

    return(
        <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
            <div className="modal-sheet" style={{display:'flex',flexDirection:'column',height:'80vh',padding:0}}>
                {/* Header */}
                <div style={{padding:'14px 20px',borderBottom:'1px solid #e2e8f0',display:'flex',alignItems:'center',gap:12,flexShrink:0}}>
                    <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',padding:4,display:'flex'}}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748b" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
                    <div className="inbox-avatar" style={{width:36,height:36,fontSize:14}}>{otherName[0].toUpperCase()}</div>
                    <div style={{flex:1,minWidth:0}}>
                        <div style={{fontWeight:700,fontSize:15,color:'#0f172a'}}>{otherName}</div>
                        <div style={{fontSize:11,color:'#64748b'}}>{player.skill}{player.playTypes?.length?' · '+player.playTypes.join(', '):''}</div>
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:4}}>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#059669" strokeWidth="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <span style={{fontSize:10,color:'#059669',fontWeight:700}}>Private</span>
                    </div>
                </div>
                {/* Secure notice */}
                <div style={{padding:'8px 20px 0'}}><div className="secure-banner"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Only you and {otherName} can see these messages</div></div>
                {loadError&&<div style={{padding:'10px 20px',background:'#fef2f2',fontSize:13,color:'#dc2626'}}>⚠️ {loadError}</div>}
                {/* Messages */}
                <div style={{flex:1,overflowY:'auto',padding:'12px 20px',display:'flex',flexDirection:'column',gap:4}}>
                    {messages.length===0&&!loadError&&(
                        <div style={{textAlign:'center',padding:'40px 20px',color:'#94a3b8'}}>
                            <div style={{fontSize:36,marginBottom:8}}>💬</div>
                            <div style={{fontSize:14,fontWeight:600}}>Start a conversation with {otherName}!</div>
                            <div style={{fontSize:13,marginTop:6}}>Say hi or suggest a time to play.</div>
                        </div>
                    )}
                    {messages.map(m=>(
                        <div key={m.id} style={{display:'flex',flexDirection:'column',alignItems:m.senderDeviceId===DEVICE_ID?'flex-end':'flex-start'}}>
                            <div className={`chat-bubble ${m.senderDeviceId===DEVICE_ID?'me':'them'}`}>
                                {m.text}
                                <div className="chat-time">{timeAgo(m.timestamp)}</div>
                            </div>
                        </div>
                    ))}
                    <div ref={chatEndRef}/>
                </div>
                {/* Input */}
                <div style={{padding:'12px 20px',borderTop:'1px solid #e2e8f0',display:'flex',gap:10,alignItems:'flex-end',flexShrink:0,background:'white'}}>
                    <textarea value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}} placeholder="Type a message..." rows={1} style={{flex:1,padding:'10px 14px',border:'2px solid #e2e8f0',borderRadius:12,fontFamily:'Outfit,sans-serif',fontSize:14,resize:'none',outline:'none',maxHeight:80,overflow:'auto'}}/>
                    <button className="btn-g" onClick={sendMsg} disabled={sending||!input.trim()} style={{padding:'10px 18px',fontSize:14,flexShrink:0,opacity:(sending||!input.trim())?.5:1}}>Send</button>
                </div>
            </div>
        </div>
    );
}

// ── Inbox ─────────────────────────────────────────────────────────────
function InboxModal({onClose,onOpenChat,players}){
    const[convos,setConvos]=useState([]);
    const[loading,setLoading]=useState(true);
    useEffect(()=>{
        if(!fbOk){setLoading(false);return;}
        const unsub=db.collection('conversations').where('participants','array-contains',DEVICE_ID).orderBy('lastTimestamp','desc')
            .onSnapshot(snap=>{setConvos(snap.docs.map(d=>({id:d.id,...d.data()})));setLoading(false);},err=>{console.warn('Inbox:',err);setLoading(false);});

    },[]);
    const getOther=(c)=>{const otherId=c.participants.find(p=>p!==DEVICE_ID);const name=c.participantNames?.[otherId]||'Player';const readTs=c[`readBy_${DEVICE_ID}`]||0;const unread=c.lastMessageBy!==DEVICE_ID&&c.lastTimestamp>readTs;return{otherId,name,unread};};
    const open=(c)=>{const{otherId,name}=getOther(c);const mp=players.find(p=>p.deviceId===otherId);onOpenChat(mp||{deviceId:otherId,name,skill:'',playTypes:[]});onClose();};

                </div>
                <div className="secure-banner" style={{marginBottom:16}}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>All conversations are private 1-on-1</div>

                :convos.length===0?<div style={{textAlign:'center',padding:'40px 20px',color:'#94a3b8'}}><div style={{fontSize:48,marginBottom:12}}>💬</div><div style={{fontSize:16,fontWeight:700,color:'#374151',marginBottom:6}}>No messages yet</div><div style={{fontSize:14}}>Tap "Message" on any player's card to start.</div></div>
                :convos.map(c=>{const{name,unread}=getOther(c);return(
                    <div key={c.id} className={`inbox-item ${unread?'unread':''}`} onClick={()=>open(c)}>
                        <div className="inbox-avatar">{name[0].toUpperCase()}</div>
                        <div style={{flex:1,minWidth:0}}>
                            <div style={{display:'flex',alignItems:'center',gap:8}}><span style={{fontWeight:unread?800:600,fontSize:15,color:'#0f172a'}}>{name}</span>{unread&&<div style={{width:8,height:8,borderRadius:'50%',background:'#059669',flexShrink:0}}/>}</div>
                            <div style={{fontSize:13,color:unread?'#334155':'#94a3b8',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',fontWeight:unread?600:400,marginTop:2}}>{c.lastMessageBy===DEVICE_ID?'You: ':''}{c.lastMessage}</div>
                        </div>
                        <div style={{fontSize:11,color:'#94a3b8',flexShrink:0}}>{timeAgo(c.lastTimestamp)}</div>
                    </div>
                );})}
            </div>
        </div>
    );
}

                {player.message&&<div style={{fontSize:14,color:'#334155',lineHeight:1.5,background:'#f8fafc',borderRadius:8,padding:'8px 12px',marginBottom:8}}>"{player.message}"</div>}
                <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:4}}>
                    {!isMine&&<button className="btn-g" onClick={()=>onChat(player)} style={{padding:'8px 16px',fontSize:13}}>💬 Message</button>}
                    {!isMine&&player.phone&&<a href={`tel:${player.phone}`} className="btn-out" style={{padding:'8px 14px',fontSize:12,textDecoration:'none',display:'inline-flex',alignItems:'center'}}>📱 Call/Text</a>}
                    {!isMine&&player.email&&<a href={`mailto:${player.email}?subject=PickleConnect - Let's Play!`} className="btn-out" style={{padding:'8px 14px',fontSize:12,textDecoration:'none',display:'inline-flex',alignItems:'center'}}>✉️ Email</a>}
                    {isMine&&<><button className="btn-out" onClick={()=>onEdit(player)} style={{padding:'8px 14px',fontSize:12}}>✏️ Edit</button><button onClick={()=>onRemove(player.id)} style={{padding:'8px 14px',fontSize:12,border:'2px solid #fecaca',background:'#fef2f2',color:'#dc2626',borderRadius:10,fontWeight:600,fontFamily:'Outfit,sans-serif',cursor:'pointer'}}>🗑️ Remove</button></>}
                </div>

// ── Main App ──────────────────────────────────────────────────────────
function App(){
    const[players,setPlayers]=useState([]);const[loading,setLoading]=useState(true);
    const[userLat,setUserLat]=useState(null);const[userLng,setUserLng]=useState(null);const[locStatus,setLocStatus]=useState('loading');
    const[showPost,setShowPost]=useState(false);const[editPlayer,setEditPlayer]=useState(null);
    const[chatPlayer,setChatPlayer]=useState(null);const[namePromptFor,setNamePromptFor]=useState(null);
    const[showInbox,setShowInbox]=useState(false);const[unreadCount,setUnreadCount]=useState(0);
    const[search,setSearch]=useState('');const[tab,setTab]=useState('all');
    const[filterSkill,setFilterSkill]=useState('');const[filterPlayType,setFilterPlayType]=useState('');
    const[filterGender,setFilterGender]=useState('');const[filterAvail,setFilterAvail]=useState('');
    const[showFilters,setShowFilters]=useState(false);
    const activeFilterCount=[filterSkill,filterPlayType,filterGender,filterAvail].filter(Boolean).length;

    // Location
    useEffect(()=>{
        if(!navigator.geolocation){setLocStatus('unavailable');return;}
        navigator.geolocation.getCurrentPosition(pos=>{setUserLat(pos.coords.latitude);setUserLng(pos.coords.longitude);setLocStatus('granted');},err=>{setLocStatus(err.code===1?'denied':'unavailable');},{enableHighAccuracy:false,timeout:8000,maximumAge:300000});
        if(navigator.permissions){navigator.permissions.query({name:'geolocation'}).then(r=>{if(r.state==='denied')setLocStatus('denied');r.addEventListener('change',()=>{if(r.state==='granted')window.location.reload();});}).catch(()=>{});}
    },[]);

    // Players
    useEffect(()=>{
        if(!fbOk){setLoading(false);return;}
        const cutoff=Date.now()-7*24*60*60*1000;
        const unsub=db.collection('findPlayers').where('status','==','active').where('timestamp','>',cutoff).orderBy('timestamp','desc')
            .onSnapshot(snap=>{setPlayers(snap.docs.map(d=>({id:d.id,...d.data()})));setLoading(false);},err=>{console.warn('Players:',err);setLoading(false);});
        return()=>unsub();
    },[]);

    // Unread count
    useEffect(()=>{
        if(!fbOk)return;
        const unsub=db.collection('conversations').where('participants','array-contains',DEVICE_ID)
            .onSnapshot(snap=>{let c=0;snap.docs.forEach(d=>{const data=d.data();const rt=data[`readBy_${DEVICE_ID}`]||0;if(data.lastMessageBy!==DEVICE_ID&&data.lastTimestamp>rt)c++;});setUnreadCount(c);},()=>{});
        return()=>unsub();
    },[]);

    const filteredPlayers=useMemo(()=>{
        let list=[...players];
        if(tab==='nearby'){if(userLat){list=list.filter(p=>p.lat&&haversine(userLat,userLng,p.lat,p.lng)<=25);}else{const mc=(localStorage.getItem('pickleFindCity')||'').toLowerCase().trim();if(mc)list=list.filter(p=>{const pc=(p.city||'').toLowerCase(),pt=(p.courtName||'').toLowerCase();return pc.includes(mc)||mc.includes(pc)||pt.includes(mc);});}}
        else if(tab==='now')list=list.filter(p=>p.availability==='Now'||p.availability==='Today');
        if(search.trim()){const q=search.toLowerCase();list=list.filter(p=>(p.name||'').toLowerCase().includes(q)||(p.courtName||'').toLowerCase().includes(q)||(p.city||'').toLowerCase().includes(q)||(p.message||'').toLowerCase().includes(q)||(p.skill||'').toLowerCase().includes(q));}
        if(filterSkill)list=list.filter(p=>p.skill===filterSkill);if(filterPlayType)list=list.filter(p=>p.playTypes?.includes(filterPlayType));if(filterGender)list=list.filter(p=>p.gender===filterGender);if(filterAvail)list=list.filter(p=>p.availability===filterAvail);
        list.sort((a,b)=>{if(a.deviceId===DEVICE_ID&&b.deviceId!==DEVICE_ID)return -1;if(b.deviceId===DEVICE_ID&&a.deviceId!==DEVICE_ID)return 1;if(tab==='nearby'&&userLat&&a.lat&&b.lat)return haversine(userLat,userLng,a.lat,a.lng)-haversine(userLat,userLng,b.lat,b.lng);return b.timestamp-a.timestamp;});
        return list;
    },[players,tab,search,filterSkill,filterPlayType,filterGender,filterAvail,userLat,userLng]);

    const handleChatRequest=(player)=>{const n=localStorage.getItem('pickleFindName');if(!n||!n.trim())setNamePromptFor(player);else setChatPlayer(player);};
    const handleNameSet=()=>{setNamePromptFor(null);if(namePromptFor)setChatPlayer(namePromptFor);};
    const handlePosted=()=>{setShowPost(false);setEditPlayer(null);};
    const handleEdit=(p)=>{setEditPlayer(p);setShowPost(true);};
    const handleRemove=async(id)=>{if(!confirm('Remove your post?'))return;try{await db.collection('findPlayers').doc(id).update({status:'removed'});}catch(e){alert('Failed: '+e.message);}};
    const clearFilters=()=>{setFilterSkill('');setFilterPlayType('');setFilterGender('');setFilterAvail('');};
    const myPosts=players.filter(p=>p.deviceId===DEVICE_ID);
    const nearbyNoLoc=tab==='nearby'&&!userLat&&!(localStorage.getItem('pickleFindCity')||'').trim();

    return(
        <div style={{minHeight:'100vh',background:'#f1f5f9',display:'flex',flexDirection:'column'}}>
            <div className="nav">
                <a href="index.html" style={{display:'flex',alignItems:'center',textDecoration:'none',marginRight:4}}><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
                <div className="fd" style={{fontSize:24,fontWeight:800,flex:1}}><span style={{color:'white'}}>FIND</span><span style={{color:'#34d399'}}> PLAYER</span></div>
                <button onClick={()=>setShowInbox(true)} style={{background:'none',border:'none',cursor:'pointer',position:'relative',padding:4}}>
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    {unreadCount>0&&<div className="badge">{unreadCount}</div>}
                </button>
                <div style={{width:8,height:8,borderRadius:'50%',background:'#10b981',animation:'pulse 2s infinite',flexShrink:0}}/>
                <span style={{fontSize:12,color:'#6ee7b7',fontWeight:600}}>{players.length}</span>
            </div>
            <div className="pg">
                <div style={{background:'linear-gradient(135deg,#0f172a 0%,#1e3a2f 55%,#052e16 100%)',borderRadius:16,padding:'20px',marginBottom:16,position:'relative',overflow:'hidden'}}>
                    <div style={{position:'absolute',top:-30,right:-30,width:120,height:120,background:'rgba(5,150,105,.15)',borderRadius:'50%'}}/>
                    <div style={{position:'relative',zIndex:1}}>
                        <div className="fd" style={{fontSize:22,fontWeight:800,color:'white',marginBottom:6}}>🏓 READY TO PLAY?</div>
                        <div style={{fontSize:14,color:'#94a3b8',lineHeight:1.5,marginBottom:14}}>Post your availability and connect with players near you. All messages are private 1-on-1.</div>
                        <button className="btn-g" onClick={()=>{setEditPlayer(null);setShowPost(true);}} style={{padding:'12px 24px',fontSize:15,boxShadow:'0 4px 20px rgba(5,150,105,.4)'}}>{myPosts.length>0?'✏️ Update Availability':'⚡ Post Availability'}</button>
                    </div>
                </div>
                <div className="tab-bar">
                    <button className={`tab-btn ${tab==='all'?'active':''}`} onClick={()=>setTab('all')}>🏓 All</button>
                    <button className={`tab-btn ${tab==='now'?'active':''}`} onClick={()=>setTab('now')}>⚡ Now</button>
                    <button className={`tab-btn ${tab==='nearby'?'active':''}`} onClick={()=>setTab('nearby')}>📍 Nearby</button>
                </div>
                {tab==='nearby'&&locStatus==='denied'&&!userLat&&<div className="info-banner"><span style={{fontSize:20,flexShrink:0}}>📍</span><div style={{flex:1,fontSize:13,color:'#92400e',lineHeight:1.5}}><strong>Location blocked.</strong> Enable location in browser settings, or post with your city.</div><button onClick={()=>window.location.reload()} style={{background:'#f59e0b',color:'white',border:'none',borderRadius:8,padding:'7px 12px',fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:700,cursor:'pointer',flexShrink:0}}>Reload ↺</button></div>}
                {nearbyNoLoc&&locStatus!=='denied'&&<div className="info-banner"><span style={{fontSize:20,flexShrink:0}}>📍</span><div style={{flex:1,fontSize:13,color:'#92400e',lineHeight:1.5}}><strong>No location set.</strong> Post with a city/area to match nearby, or enable GPS.</div><button className="btn-g" onClick={()=>{setEditPlayer(null);setShowPost(true);}} style={{padding:'7px 14px',fontSize:12,flexShrink:0}}>Post →</button></div>}
                {tab==='nearby'&&userLat&&<div style={{fontSize:12,color:'#059669',marginBottom:10,display:'flex',alignItems:'center',gap:5}}><div className="status-dot online" style={{width:6,height:6}}/> Within 25 miles</div>}
                {tab==='nearby'&&!userLat&&(localStorage.getItem('pickleFindCity')||'').trim()&&<div style={{fontSize:12,color:'#d97706',marginBottom:10}}>📍 Matching by area: "{localStorage.getItem('pickleFindCity')}"</div>}

                <div className="search-wrap"><span className="search-icon">🔍</span><input className="search-inp" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search by name, court, city, or skill…"/></div>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
                    <button onClick={()=>setShowFilters(!showFilters)} style={{display:'flex',alignItems:'center',gap:6,padding:'8px 14px',borderRadius:20,border:activeFilterCount>0?'2px solid #059669':'2px solid #e2e8f0',background:activeFilterCount>0?'#ecfdf5':'white',fontFamily:'Outfit,sans-serif',fontSize:13,fontWeight:600,cursor:'pointer',color:activeFilterCount>0?'#059669':'#475569'}}>🎛️ Filters {activeFilterCount>0&&<span style={{background:'#059669',color:'white',borderRadius:'50%',width:18,height:18,display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700}}>{activeFilterCount}</span>}</button>
                    {activeFilterCount>0&&<button onClick={clearFilters} style={{fontSize:12,color:'#ef4444',background:'none',border:'none',fontFamily:'Outfit,sans-serif',fontWeight:600,cursor:'pointer'}}>Clear all</button>}
                    <div style={{flex:1}}/><span style={{fontSize:13,color:'#64748b',fontWeight:500}}>{filteredPlayers.length} player{filteredPlayers.length!==1?'s':''}</span>
                </div>
                {showFilters&&<div className="card fade-in" style={{marginBottom:14}}><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                    <div><div className="form-label">Skill Level</div><select className="form-select" value={filterSkill} onChange={e=>setFilterSkill(e.target.value)} style={{fontSize:13}}><option value="">Any</option>{SKILL_LEVELS.map(s=><option key={s} value={s}>{s} ({SKILL_LABELS[s]})</option>)}</select></div>
                    <div><div className="form-label">Play Type</div><select className="form-select" value={filterPlayType} onChange={e=>setFilterPlayType(e.target.value)} style={{fontSize:13}}><option value="">Any</option>{PLAY_TYPES.map(t=><option key={t} value={t}>{t}</option>)}</select></div>
                    <div><div className="form-label">Gender</div><select className="form-select" value={filterGender} onChange={e=>setFilterGender(e.target.value)} style={{fontSize:13}}><option value="">Any</option>{GENDERS.map(g=><option key={g} value={g}>{g}</option>)}</select></div>
                    <div><div className="form-label">Availability</div><select className="form-select" value={filterAvail} onChange={e=>setFilterAvail(e.target.value)} style={{fontSize:13}}><option value="">Any</option>{AVAILABILITY.map(a=><option key={a} value={a}>{a}</option>)}</select></div>
                </div></div>}

                {loading?<>{[1,2,3].map(i=><SkeletonCard key={i}/>)}</>
                :filteredPlayers.length===0?<div className="empty-state"><div style={{fontSize:48,marginBottom:12}}>🏓</div><div style={{fontSize:18,fontWeight:700,color:'#374151',marginBottom:6}}>{search||activeFilterCount>0?'No players match':tab==='now'?'No one available now':tab==='nearby'?'No nearby players':'No players yet'}</div><div style={{fontSize:14,marginBottom:20,color:'#64748b'}}>{search||activeFilterCount>0?'Try adjusting filters':'Be the first to post!'}</div>{!search&&activeFilterCount===0&&<button className="btn-g" onClick={()=>{setEditPlayer(null);setShowPost(true);}}>⚡ Post Availability</button>}{(search||activeFilterCount>0)&&<button className="btn-out" onClick={()=>{setSearch('');clearFilters();}}>Clear Filters</button>}</div>
                :filteredPlayers.map(p=><PlayerCard key={p.id} player={p} userLat={userLat} userLng={userLng} onChat={handleChatRequest} onEdit={handleEdit} onRemove={handleRemove}/>)}

                <div style={{display:'flex',gap:10,marginTop:8}}>
                    <a href="index.html" style={{flex:1,display:'flex',alignItems:'center',gap:10,background:'white',borderRadius:14,padding:'14px 16px',textDecoration:'none',boxShadow:'0 2px 10px rgba(0,0,0,.06)'}}><span style={{fontSize:22}}>🏟️</span><div><div style={{fontFamily:'Barlow Condensed,sans-serif',fontSize:15,fontWeight:800,color:'#0f172a'}}>FIND COURTS</div><div style={{fontSize:11,color:'#64748b'}}>See who's playing</div></div></a>
                    <a href="tournament.html" style={{flex:1,display:'flex',alignItems:'center',gap:10,background:'linear-gradient(135deg,#4c1d95,#7c3aed)',borderRadius:14,padding:'14px 16px',textDecoration:'none'}}><span style={{fontSize:22}}>🏆</span><div><div style={{fontFamily:'Barlow Condensed,sans-serif',fontSize:15,fontWeight:800,color:'white'}}>TOURNAMENTS</div><div style={{fontSize:11,color:'#e9d5ff'}}>Brackets & scoring</div></div></a>
                </div>
            </div>
            <div style={{marginTop:'auto'}}><div style={{textAlign:'center',padding:'16px 16px 24px',fontSize:12,color:'#94a3b8',borderTop:'1px solid #e2e8f0',background:'white'}}>© 2025 PickleConnect</div></div>
            <button className="fab" onClick={()=>{setEditPlayer(null);setShowPost(true);}} title="Post Availability">+</button>
            {showPost&&<PostPlayerModal onClose={()=>{setShowPost(false);setEditPlayer(null);}} onPosted={handlePosted} editData={editPlayer} userLat={userLat} userLng={userLng} locStatus={locStatus}/>}
            {namePromptFor&&<NamePrompt onDone={handleNameSet} onCancel={()=>setNamePromptFor(null)}/>}
            {chatPlayer&&<ChatModal player={chatPlayer} onClose={()=>setChatPlayer(null)}/>}
            {showInbox&&<InboxModal onClose={()=>setShowInbox(false)} onOpenChat={handleChatRequest} players={players}/>}
        </div>
    );
}
ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
