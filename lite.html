<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PickleConnect Lite – Tournament Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        html{scroll-behavior:smooth;}
        body{font-family:'Outfit',sans-serif;background:#f1f5f9;font-size:16px;-webkit-text-size-adjust:100%;}
        .fd{font-family:'Barlow Condensed',sans-serif;}
        .hero-bg{background:linear-gradient(135deg,#0f172a 0%,#1e3a2f 50%,#052e16 100%);}
        .card-lift{transition:transform .2s,box-shadow .2s;}
        .card-lift:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.2);}

        /* Inputs */
        .inp{width:100%;background:#f1f5f9;border:2px solid transparent;border-radius:10px;padding:11px 14px;font-size:15px;font-family:'Outfit',sans-serif;transition:border-color .15s;outline:none;}
        .inp:focus{border-color:#059669;background:white;}
        .score-inp{width:58px;text-align:center;border:2px solid #e2e8f0;border-radius:8px;padding:9px 4px;font-size:17px;font-weight:700;font-family:'Outfit',sans-serif;outline:none;transition:border-color .15s;}
        .score-inp:focus{border-color:#059669;}
        .score-inp:disabled{background:#f1f5f9;color:#94a3b8;cursor:not-allowed;}

        /* Buttons */
        .btn-g{background:#059669;color:white;border-radius:10px;padding:12px 22px;font-weight:600;font-size:15px;border:none;cursor:pointer;transition:background .15s;font-family:'Outfit',sans-serif;}
        .btn-g:hover{background:#047857;}
        .btn-g:disabled{background:#a7f3d0;cursor:not-allowed;}
        .btn-out{background:transparent;color:#059669;border:2px solid #059669;border-radius:10px;padding:10px 20px;font-weight:600;font-size:15px;cursor:pointer;transition:all .15s;font-family:'Outfit',sans-serif;}
        .btn-out:hover{background:#059669;color:white;}
        .btn-dark{background:#0f172a;color:white;border-radius:10px;padding:12px 22px;font-weight:600;font-size:15px;cursor:pointer;font-family:'Outfit',sans-serif;border:none;}
        .btn-dark:hover{background:#1e293b;}
        .btn-red{background:#ef4444;color:white;border-radius:8px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;font-family:'Outfit',sans-serif;border:none;}
        .btn-red:hover{background:#dc2626;}
        .btn-sm{padding:8px 14px!important;font-size:14px!important;}

        /* Pill toggle */
        .pill{border:none;border-radius:8px;padding:10px 18px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;}
        .pill-on{background:#059669;color:white;}
        .pill-off{background:#f1f5f9;color:#64748b;}
        .pill-off:hover{background:#e2e8f0;}

        /* Section label */
        .slbl{font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:8px;}

        /* Round card */
        .round-card{background:white;border-radius:14px;border:2px solid #e2e8f0;margin-bottom:18px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05);}
        .round-hd{background:linear-gradient(90deg,#0f172a,#1e3a2f);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;}

        /* Match row */
        .match-row{display:grid;align-items:center;padding:14px 16px;gap:10px;border-bottom:1px solid #f1f5f9;grid-template-columns:auto 1fr auto 1fr;}
        .match-row:last-of-type{border-bottom:none;}
        .match-row:nth-child(even){background:#fafafa;}

        /* Player name — wraps, never truncates */
        .pname{font-family:'Outfit',sans-serif;font-size:15px;font-weight:500;word-break:break-word;line-height:1.4;color:#1e293b;}
        .pname.win{font-weight:700;color:#059669;}

        /* Bye row */
        .bye-row{background:#fffbeb;padding:12px 18px;font-family:'Outfit',sans-serif;font-size:14px;color:#92400e;border-top:1px dashed #fcd34d;display:flex;align-items:center;gap:8px;}

        /* Nav */
        .nav{background:#0f172a;padding:13px 18px;display:flex;align-items:center;gap:12px;}
        .nav-back{background:none;border:none;color:#94a3b8;cursor:pointer;font-size:22px;padding:2px 8px;line-height:1;flex-shrink:0;}

        /* Page container */
        .pg{padding:16px;max-width:740px;width:100%;margin:0 auto;}

        /* Card */
        .card{background:white;border-radius:14px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.06);}

        /* Score block */
        .score-block{display:flex;align-items:center;gap:6px;justify-content:center;flex-shrink:0;}

        @keyframes spin{to{transform:rotate(360deg)}}

        /* Mobile */
        @media(max-width:540px){
            .match-row{grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;}
            .score-block{grid-column:1/-1;justify-content:center;padding:4px 0;}
            .pname:last-child{text-align:left;}
            .score-inp{width:66px;padding:11px 4px;font-size:18px;}
            .landing-cards{grid-template-columns:1fr!important;}
        }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;

// ── Firebase ──────────────────────────────────────────────────────────
const FB = {
    apiKey:"AIzaSyDaFUszTD0-Ro292GOBSlS5vkZSdJM0NF4",
    authDomain:"pickleball-app-1bba7.firebaseapp.com",
    projectId:"pickleball-app-1bba7",
    storageBucket:"pickleball-app-1bba7.firebasestorage.app",

};
let db=null,auth=null,fbOk=false;
const oErr=console.error;
console.error=(...a)=>{const s=a.join(' ');if(s.includes('permission-denied')||s.includes('insufficient permissions')||s.includes('Firestore'))return;oErr(...a);};
try{firebase.initializeApp(FB);db=firebase.firestore();auth=firebase.auth();fbOk=true;}catch(e){}

// ── Storage ───────────────────────────────────────────────────────────
const storage={
    async save(d){
        if(fbOk&&db)try{await db.collection('tournaments').doc(d.id).set(d);return;}catch(e){}
        localStorage.setItem(`tournament:${d.id}`,JSON.stringify(d));
    },
    async get(id){
        if(fbOk&&db)try{const doc=await db.collection('tournaments').doc(id).get();if(doc.exists)return doc.data();}catch(e){}
        const d=localStorage.getItem(`tournament:${id}`);return d?JSON.parse(d):null;
    },
    async getAll(uid){
        if(fbOk&&db)try{
            const pub=(await db.collection('tournaments').where('isPublic','==',true).get()).docs.map(d=>d.data());
            if(uid){const priv=(await db.collection('tournaments').where('isPublic','==',false).where('participants','array-contains',uid).get()).docs.map(d=>d.data());return[...pub,...priv];}
            return pub;
        }catch(e){}
        const out=[];
        for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k?.startsWith('tournament:'))continue;try{const d=JSON.parse(localStorage.getItem(k));if(d.isPublic||(uid&&d.participants?.includes(uid)))out.push(d);}catch(e){}}
        return out;
    },
    listen(id,cb){
        if(fbOk&&db)return db.collection('tournaments').doc(id).onSnapshot(doc=>{if(doc.exists)cb(doc.data());});
        const t=setInterval(async()=>{const d=await storage.get(id);if(d)cb(d);},2000);
        return()=>clearInterval(t);
    },
    del(id){if(fbOk&&db)try{db.collection('tournaments').doc(id).delete();}catch(e){}localStorage.removeItem(`tournament:${id}`);},
    async saveFeedback(d){
        if(fbOk&&db)try{await db.collection('feedback').add(d);return;}catch(e){}
        try{const a=JSON.parse(localStorage.getItem('pendingFeedback')||'[]');a.push(d);localStorage.setItem('pendingFeedback',JSON.stringify(a));}catch(e){}
    }
};

// ── Algorithms ────────────────────────────────────────────────────────
function genSingles(players,rounds,courts){
    const list=[...players];
    if(list.length%2!==0)list.push('BYE');
    const actual=Math.min(rounds,list.length-1),half=list.length/2,all=[];
    for(let r=0;r<actual;r++){
        const matches=[],byes=[];
        for(let i=0;i<half;i++){const p1=list[i],p2=list[list.length-1-i];if(p1==='BYE')byes.push(p2);else if(p2==='BYE')byes.push(p1);else matches.push({id:`r${r}-m${i}`,court:(i%courts)+1,team1:[p1],team2:[p2]});}
        if(byes.length)matches.byePlayers=byes;
        all.push(matches);list.splice(1,0,list.pop());
    }
    return all;
}

function genRotating(players,rounds,courts){
    const stats={};players.forEach(p=>{stats[p]={games:0,partners:{},opponents:{},lastPartner:null};});
    const all=[];
    for(let round=0;round<rounds;round++){
        const sorted=[...players].sort((a,b)=>stats[a].games-stats[b].games);
        const playN=Math.floor(Math.min(courts*4,sorted.length)/4)*4;
        let playing=sorted.slice(0,playN).sort(()=>Math.random()-.5);
        const byes=sorted.slice(playN);
        const matches=[];let cn=0;
        while(playing.length>=4&&cn<courts){
            let best=Infinity,bl=[];
            for(let a=0;a<playing.length;a++)for(let b=a+1;b<playing.length;b++)for(let c=b+1;c<playing.length;c++)for(let d=c+1;d<playing.length;d++){
                const[p1,p2,p3,p4]=[playing[a],playing[b],playing[c],playing[d]];
                let sc=(stats[p1].partners[p2]||0)*10+(stats[p3].partners[p4]||0)*10;
                if(stats[p1].lastPartner===p2||stats[p2].lastPartner===p1)sc+=100;
                if(stats[p3].lastPartner===p4||stats[p4].lastPartner===p3)sc+=100;
                sc+=(stats[p1].opponents[p3]||0)*2+(stats[p1].opponents[p4]||0)*2+(stats[p2].opponents[p3]||0)*2+(stats[p2].opponents[p4]||0)*2;
                if(sc<best){best=sc;bl=[{team1:[p1,p2],team2:[p3,p4]}];}else if(sc===best)bl.push({team1:[p1,p2],team2:[p3,p4]});
            }
            const pick=bl[Math.floor(Math.random()*bl.length)];if(!pick)break;
            matches.push({id:`r${round}-m${cn}`,court:cn+1,team1:pick.team1,team2:pick.team2});
            const all4=[...pick.team1,...pick.team2];all4.forEach(p=>stats[p].games++);
            stats[pick.team1[0]].partners[pick.team1[1]]=(stats[pick.team1[0]].partners[pick.team1[1]]||0)+1;stats[pick.team1[1]].partners[pick.team1[0]]=(stats[pick.team1[1]].partners[pick.team1[0]]||0)+1;
            stats[pick.team2[0]].partners[pick.team2[1]]=(stats[pick.team2[0]].partners[pick.team2[1]]||0)+1;stats[pick.team2[1]].partners[pick.team2[0]]=(stats[pick.team2[1]].partners[pick.team2[0]]||0)+1;
            stats[pick.team1[0]].lastPartner=pick.team1[1];stats[pick.team1[1]].lastPartner=pick.team1[0];
            stats[pick.team2[0]].lastPartner=pick.team2[1];stats[pick.team2[1]].lastPartner=pick.team2[0];
            pick.team1.forEach(p1=>pick.team2.forEach(p2=>{stats[p1].opponents[p2]=(stats[p1].opponents[p2]||0)+1;stats[p2].opponents[p1]=(stats[p2].opponents[p1]||0)+1;}));
            playing=playing.filter(p=>!all4.includes(p));cn++;
        }
        if(byes.length)matches.byePlayers=byes;
        all.push(matches);
    }
    return all;
}

function genFixed(partnerships,rounds,courts){
    const teams=partnerships.map(p=>p.players),tg={};teams.forEach((_,i)=>tg[i]=0);
    const all=[];
    for(let r=0;r<rounds;r++){
        const sorted=teams.map((t,i)=>({t,i})).sort((a,b)=>tg[a.i]-tg[b.i]);
        const playN=Math.floor(Math.min(courts*2,sorted.length)/2)*2;
        const playing=sorted.slice(0,playN),byes=sorted.slice(playN).flatMap(x=>x.t);
        const matches=[];let c=0;
        for(let i=0;i<playing.length-1;i+=2){if(c>=courts)break;matches.push({id:`r${r}-m${c}`,court:c+1,team1:playing[i].t,team2:playing[i+1].t});tg[playing[i].i]++;tg[playing[i+1].i]++;c++;}
        if(byes.length)matches.byePlayers=byes;
        all.push(matches);
    }
    return all;
}

function calcLB(players,schedule,scores){
    const stats={};players.filter(p=>p.trim()).forEach(p=>{stats[p]={wins:0,losses:0,pf:0,pa:0};});
    schedule.forEach(round=>round.forEach(match=>{
        const s=scores[match.id];if(!s||s.team1===undefined||s.team2===undefined)return;
        const s1=parseInt(s.team1)||0,s2=parseInt(s.team2)||0;
        if(s1>s2){match.team1.forEach(p=>{if(stats[p]){stats[p].wins++;stats[p].pf+=s1;stats[p].pa+=s2;}});match.team2.forEach(p=>{if(stats[p]){stats[p].losses++;stats[p].pf+=s2;stats[p].pa+=s1;}});}
        else if(s2>s1){match.team2.forEach(p=>{if(stats[p]){stats[p].wins++;stats[p].pf+=s2;stats[p].pa+=s1;}});match.team1.forEach(p=>{if(stats[p]){stats[p].losses++;stats[p].pf+=s1;stats[p].pa+=s2;}});}
    }));
    return Object.entries(stats).map(([name,s])=>({name,...s,diff:s.pf-s.pa})).sort((a,b)=>b.wins-a.wins||b.diff-a.diff);
}

// ── PDF Export — opens new tab (works on mobile) ──────────────────────
function doPrint(name,schedule,scores,players,withScores){
    const date=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
    let html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${name||'Scorecard'}</title>
    <style>body{font-family:Arial,sans-serif;padding:24px;max-width:820px;margin:0 auto;color:#1e293b;font-size:14px;}
    h1{font-size:26px;font-weight:900;margin:0 0 4px;}
    .meta{font-size:13px;color:#64748b;margin-bottom:22px;}
    .rnd{font-size:13px;font-weight:800;color:#059669;text-transform:uppercase;letter-spacing:1px;margin:20px 0 8px;border-bottom:2px solid #059669;padding-bottom:4px;}
    table{width:100%;border-collapse:collapse;margin-bottom:4px;}
    th{background:#f1f5f9;padding:9px 10px;text-align:left;font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;border:1px solid #e2e8f0;}
    td{padding:11px 10px;border:1px solid #e2e8f0;vertical-align:middle;}
    tr:nth-child(even) td{background:#fafafa;}
    .ct{background:#f0fdf4;color:#059669;font-weight:700;font-size:12px;padding:3px 9px;border-radius:6px;}
    .sc{text-align:center;font-weight:700;font-size:20px;color:#059669;}
    .scb{text-align:center;font-size:14px;color:#cbd5e1;min-width:50px;}
    .w{font-weight:700;color:#059669;}
    .bye{background:#fffbeb;padding:9px 12px;font-size:13px;color:#92400e;margin-top:5px;border-radius:6px;}
    .pls{margin-top:20px;background:#f0fdf4;border-radius:8px;padding:13px;}
    .ft{margin-top:24px;font-size:11px;color:#94a3b8;text-align:center;border-top:1px solid #e2e8f0;padding-top:12px;}
    @media print{@page{margin:.45in;size:A4;}body{padding:0;}}</style></head><body>
    <h1>${name||'Tournament Scorecard'}</h1>
    <div class="meta">Generated ${date} · ${players.filter(p=>p.trim()).length} players · ${schedule.length} rounds · PickleConnect Lite</div>`;

    schedule.forEach((round,ri)=>{
        html+=`<div class="rnd">Round ${ri+1}</div>
        <table><thead><tr><th>Court</th><th>Team 1</th><th>Score</th><th></th><th>Score</th><th>Team 2</th></tr></thead><tbody>`;
        round.forEach(m=>{
            const sc=scores[m.id];
            const sv1=withScores&&sc?.team1!==undefined?sc.team1:null;
            const sv2=withScores&&sc?.team2!==undefined?sc.team2:null;
            const w1=sv1!==null&&sv2!==null&&parseInt(sv1)>parseInt(sv2);
            const w2=sv1!==null&&sv2!==null&&parseInt(sv2)>parseInt(sv1);
            const t1=m.team1.join(' & '),t2=m.team2.join(' & ');
            html+=`<tr><td><span class="ct">Court ${m.court}</span></td>
                <td class="${w1?'w':''}">${w1?'🏆 ':''}${t1}</td>
                <td class="${sv1!==null?'sc':'scb'}">${sv1!==null?sv1:'___'}</td>
                <td style="text-align:center;color:#94a3b8;font-weight:700;">vs</td>
                <td class="${sv2!==null?'sc':'scb'}">${sv2!==null?sv2:'___'}</td>
                <td class="${w2?'w':''}">${t2}${w2?' 🏆':''}</td></tr>`;
        });
        html+=`</tbody></table>`;
        if(round.byePlayers?.length)html+=`<div class="bye">⏸ Sitting out: ${round.byePlayers.join(', ')}</div>`;
    });

    const vp=players.filter(p=>p.trim());
    if(vp.length)html+=`<div class="pls"><strong>Players (${vp.length}):</strong> ${vp.join(' · ')}</div>`;
    html+=`<div class="ft">PickleConnect Lite · Pickleball Tournament Generator</div></body></html>`;

    const w=window.open('','_blank');
    if(w){w.document.write(html);w.document.close();setTimeout(()=>w.print(),500);}
    else alert('Allow popups to export. Or try on a desktop browser.');
}

// ── Shared Helpers ────────────────────────────────────────────────────
function Pill({val,cur,set,label}){return <button className={`pill ${cur===val?'pill-on':'pill-off'}`} onClick={()=>set(val)}>{label}</button>;}
function SL({children}){return <span className="slbl">{children}</span>;}

// ── Tournament Setup ──────────────────────────────────────────────────
function TournamentSetup({onGenerate}){
    const[name,setName]=useState('');
    const[format,setFormat]=useState('doubles');
    const[mode,setMode]=useState('rotating');
    const[np,setNp]=useState(8);
    const[players,setPlayers]=useState(Array.from({length:8},(_,i)=>`Player ${i+1}`));
    const[courts,setCourts]=useState(2);
    const[rounds,setRounds]=useState(3);
    const[partnerships,setPartnerships]=useState([]);
    const[customs,setCustoms]=useState([{team1:['',''],team2:['','']}]);

    useEffect(()=>setPlayers(prev=>Array.from({length:np},(_,i)=>prev[i]||`Player ${i+1}`)),[np]);

    const valid=players.filter(p=>p.trim());

    const autoPair=()=>{
        const pairs=[];for(let i=0;i<valid.length-1;i+=2)pairs.push({players:[valid[i],valid[i+1]]});
        setPartnerships(pairs);
    };

    const updCust=(mi,team,pi,v)=>setCustoms(prev=>{const n=prev.map((m,i)=>i===mi?{...m,[team]:[...m[team]]}:m);n[mi][team][pi]=v;return n;});

    const generate=()=>{
        if(format==='singles'&&valid.length<2){alert('Need at least 2 players');return;}
        if(format==='doubles'&&valid.length<4){alert('Need at least 4 players for doubles');return;}
        if(format==='doubles'&&mode==='fixed'&&partnerships.length<2){alert('Set up partnerships first');return;}
        if(format==='doubles'&&mode==='custom'&&customs.every(m=>m.team1.every(p=>!p.trim())&&m.team2.every(p=>!p.trim()))){alert('Add players to at least one custom match');return;}
        let schedule;
        if(format==='singles') schedule=genSingles(valid,rounds,courts);
        else if(mode==='rotating') schedule=genRotating(valid,rounds,courts);
        else if(mode==='fixed') schedule=genFixed(partnerships,rounds,courts);
        else{
            const ml=customs.filter(m=>m.team1.some(p=>p.trim())||m.team2.some(p=>p.trim()))
                .map((m,i)=>({id:`r0-m${i}`,court:(i%courts)+1,team1:m.team1.filter(p=>p.trim()),team2:m.team2.filter(p=>p.trim())}));
            schedule=[ml];
        }
        onGenerate({name:name||`Tournament ${new Date().toLocaleDateString()}`,players:valid,schedule,courts,rounds,format,mode});
    };

    const PSel=({value,onChange,placeholder})=>(
        <select className="inp" value={value} onChange={e=>onChange(e.target.value)} style={{fontSize:14,padding:'9px 12px'}}>
            <option value="">{placeholder}</option>
            {valid.map(p=><option key={p} value={p}>{p}</option>)}
        </select>
    );

    return(
        <div style={{display:'flex',flexDirection:'column',gap:20}}>
            <div><SL>Tournament Name</SL><input className="inp" value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Sunday Doubles Bash"/></div>

            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:16}}>
                <div>
                    <SL>Format</SL>
                    <div style={{display:'flex',gap:8}}>
                        <Pill val="singles" cur={format} set={v=>{setFormat(v);setMode('rotating');}} label="Singles"/>
                        <Pill val="doubles" cur={format} set={setFormat} label="Doubles"/>
                    </div>
                </div>
                {format==='doubles'&&(
                    <div>
                        <SL>Partner Mode</SL>
                        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                            <Pill val="rotating" cur={mode} set={setMode} label="Rotating"/>
                            <Pill val="fixed" cur={mode} set={setMode} label="Fixed"/>
                            <Pill val="custom" cur={mode} set={setMode} label="Custom"/>
                        </div>
                    </div>
                )}
            </div>

            {mode!=='custom'&&(

// ── App Root ──────────────────────────────────────────────────────────
function App(){
    const[view,setView]=useState('landing');
    const[user,setUser]=useState(null);
    const[authReady,setAuthReady]=useState(false);
    const[showFB,setShowFB]=useState(false);

    useEffect(()=>{
        if(!fbOk||!auth){setAuthReady(true);return;}
        const u=auth.onAuthStateChanged(async u=>{
            if(u&&!u.isAnonymous){
                let p={uid:u.uid,email:u.email,name:u.displayName||u.email.split('@')[0]};
                try{const doc=await db.collection('users').doc(u.uid).get();if(doc.exists)p=doc.data();else await db.collection('users').doc(u.uid).set(p);}catch(e){}
                setUser(p);
            }else setUser(null);
            setAuthReady(true);
        });
        return()=>u();
    },[]);

    const logout=async()=>{if(auth)await auth.signOut();setUser(null);setView('landing');};

    if(!authReady) return(
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',background:'#f1f5f9'}}>
            <div style={{textAlign:'center'}}>
                <div style={{width:44,height:44,border:'4px solid #e2e8f0',borderTop:'4px solid #059669',borderRadius:'50%',animation:'spin .8s linear infinite',margin:'0 auto 12px'}}/>
                <div style={{fontFamily:'Outfit,sans-serif',color:'#64748b',fontSize:16}}>Loading…</div>
            </div>
        </div>
    );

    return(
        <>
            {showFB&&<FeedbackModal onClose={()=>setShowFB(false)} user={user}/>}
            {view==='landing'&&<LandingView onSimple={()=>setView('simple')} onAdvanced={()=>user?setView('app'):setView('login')} user={user} onFeedback={()=>setShowFB(true)}/>}
            {view==='simple'&&<SimpleView onBack={()=>setView('landing')} onLogin={()=>setView('login')} onFeedback={()=>setShowFB(true)}/>}
            {view==='login'&&<LoginView onBack={()=>setView('landing')} onSuccess={()=>setView('app')}/>}
            {view==='app'&&<FullApp user={user} onLogout={logout} onBack={()=>setView('landing')} onFeedback={()=>setShowFB(true)}/>}
        </>
    );
}

// ── Login View ────────────────────────────────────────────────────────
function LoginView({onBack,onSuccess}){
    const[email,setEmail]=useState('');
    const[pw,setPw]=useState('');
    const[pwc,setPwc]=useState('');
    const[isSignup,setIsSignup]=useState(false);
    const[err,setErr]=useState('');
    const[msg,setMsg]=useState('');
    const[busy,setBusy]=useState(false);

    const submit=async e=>{
        e.preventDefault();setErr('');setMsg('');setBusy(true);
        if(!fbOk){setErr('Firebase not configured');setBusy(false);return;}
        if(isSignup&&pw!==pwc){setErr('Passwords do not match');setBusy(false);return;}
        if(isSignup&&pw.length<6){setErr('Password must be 6+ characters');setBusy(false);return;}
        try{
            if(isSignup){const c=await auth.createUserWithEmailAndPassword(email,pw);try{await c.user.sendEmailVerification();}catch(e){}setMsg('Account created! Redirecting…');setTimeout(onSuccess,1500);}
            else{await auth.signInWithEmailAndPassword(email,pw);onSuccess();}
        }catch(e){const m={'auth/email-already-in-use':'Email already registered.','auth/invalid-email':'Invalid email.','auth/wrong-password':'Incorrect password.','auth/user-not-found':'No account with this email.'};setErr(m[e.code]||e.message);}
        setBusy(false);
    };

    const reset=async()=>{
        if(!email){setErr('Enter your email first');return;}
        try{await auth.sendPasswordResetEmail(email);setMsg('Reset email sent!');}catch(e){setErr(e.message);}
    };

    return(
        <div style={{minHeight:'100vh',background:'#f1f5f9',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:20}}>
            <div style={{width:'100%',maxWidth:420}}>
                <button onClick={onBack} style={{background:'none',border:'none',color:'#64748b',cursor:'pointer',fontFamily:'Outfit,sans-serif',fontSize:16,marginBottom:24,display:'flex',alignItems:'center',gap:6}}>← Back to Home</button>
                <div className="card">
                    <div className="fd" style={{fontSize:32,fontWeight:800,color:'#0f172a',marginBottom:4}}>{isSignup?'CREATE ACCOUNT':'WELCOME BACK'}</div>
                    <div style={{fontFamily:'Outfit,sans-serif',fontSize:15,color:'#64748b',marginBottom:24}}>{isSignup?'Get access to all tournament features':'Log in to your tournament dashboard'}</div>
                    <form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:16}}>
                        <div><SL>Email</SL><input className="inp" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com" required/></div>
                        <div><SL>Password</SL><input className="inp" type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="••••••••" required minLength={6}/></div>
                        {isSignup&&<div><SL>Confirm Password</SL><input className="inp" type="password" value={pwc} onChange={e=>setPwc(e.target.value)} placeholder="••••••••" required minLength={6}/></div>}
                        {err&&<div style={{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:8,padding:'11px 14px',fontSize:15,color:'#dc2626'}}>{err}</div>}
                        {msg&&<div style={{background:'#f0fdf4',border:'1px solid #a7f3d0',borderRadius:8,padding:'11px 14px',fontSize:15,color:'#059669'}}>{msg}</div>}
                        <button className="btn-g" type="submit" disabled={busy} style={{width:'100%',padding:'14px',marginTop:4}}>{busy?'Please wait…':isSignup?'Create Account':'Log In'}</button>
                    </form>
                    <div style={{marginTop:18,textAlign:'center',display:'flex',flexDirection:'column',gap:10}}>
                        <button onClick={()=>{setIsSignup(!isSignup);setErr('');setMsg('');}} style={{background:'none',border:'none',color:'#059669',fontFamily:'Outfit,sans-serif',fontSize:15,cursor:'pointer',fontWeight:600}}>
                            {isSignup?'Already have an account? Log in':"Don't have an account? Sign up"}
                        </button>
                        {!isSignup&&<button onClick={reset} style={{background:'none',border:'none',color:'#94a3b8',fontFamily:'Outfit,sans-serif',fontSize:14,cursor:'pointer'}}>Forgot password?</button>}
                    </div>
                </div>
            </div>
        </div>
    );
}

// ── Simple (Guest) View ───────────────────────────────────────────────
function SimpleView({onBack,onLogin,onFeedback}){
    const[tab,setTab]=useState('create');
    const[setup,setSetup]=useState(null);
    const[scores,setScores]=useState({});
    const[findId,setFindId]=useState('');
    const[found,setFound]=useState(null);
    const[findErr,setFindErr]=useState('');
    const[finding,setFinding]=useState(false);

    const handleGenerate=d=>{setSetup(d);setScores({});};
    const updScore=(id,team,val)=>setScores(p=>({...p,[id]:{...(p[id]||{}),[team]:parseInt(val)||0}}));

    const findTournament=async()=>{
        const id=findId.trim();if(!id)return;
        setFinding(true);setFindErr('');setFound(null);
        const data=await storage.get(id);
        if(!data)setFindErr('Tournament not found. Check the ID and try again.');
        else if(!data.isPublic)setFindErr('This tournament is private. Only the owner can access it.');
        else{
            const map={};
            (data.scheduleFlat||[]).forEach(m=>{if(!map[m.roundIndex])map[m.roundIndex]=[];map[m.roundIndex].push({id:m.id,court:m.court,team1:typeof m.team1==='string'?m.team1.split(', ').filter(Boolean):[m.team1],team2:typeof m.team2==='string'?m.team2.split(', ').filter(Boolean):[m.team2]});});
            setFound({...data,schedule:data.schedule||Object.keys(map).sort((a,b)=>a-b).map(k=>map[k])});
        }
        setFinding(false);
    };

    return(
        <div style={{minHeight:'100vh',background:'#f1f5f9',display:'flex',flexDirection:'column'}}>
            <div className="nav">
                <button className="nav-back" onClick={()=>setup?setSetup(null):onBack()}>←</button>
                <div className="fd" style={{fontSize:22,fontWeight:800,color:'white',flex:1}}>QUICK GENERATION</div>
                <button onClick={onFeedback} style={{background:'rgba(255,255,255,.1)',color:'#94a3b8',border:'none',borderRadius:8,padding:'8px 13px',fontFamily:'Outfit,sans-serif',fontSize:14,cursor:'pointer',marginRight:6}}>💬</button>
                <button onClick={onLogin} style={{background:'#059669',color:'white',border:'none',borderRadius:8,padding:'9px 16px',fontFamily:'Outfit,sans-serif',fontSize:14,fontWeight:600,cursor:'pointer'}}>Login</button>
            </div>

            <div style={{background:'#fffbeb',borderBottom:'1px solid #fcd34d',padding:'11px 18px',display:'flex',gap:10,alignItems:'flex-start'}}>
                <span style={{fontSize:17,flexShrink:0}}>⚡</span>
                <span style={{fontFamily:'Outfit,sans-serif',fontSize:14,color:'#92400e',lineHeight:1.5}}>
                    <strong>Guest Mode:</strong> Tournaments are not saved to the cloud. Export your scorecard before leaving.
                </span>
            </div>

            <div style={{background:'white',borderBottom:'1px solid #e2e8f0',padding:'0 18px',display:'flex'}}>
                {[['create','Create Tournament'],['find','Find by ID']].map(([k,l])=>(
                    <button key={k} onClick={()=>setTab(k)} style={{background:'none',border:'none',borderBottom:`3px solid ${tab===k?'#059669':'transparent'}`,padding:'15px 18px',fontFamily:'Outfit,sans-serif',fontSize:15,fontWeight:600,color:tab===k?'#059669':'#64748b',cursor:'pointer',transition:'all .15s'}}>{l}</button>
                ))}
            </div>

            <div style={{flex:1,padding:16,maxWidth:740,width:'100%',margin:'0 auto'}}>
                {tab==='create'&&(
                    !setup?(
                        <div className="card"><TournamentSetup onGenerate={handleGenerate}/></div>
                    ):(
                        <>
                            <div style={{background:'white',borderRadius:14,padding:'15px 18px',marginBottom:14,display:'flex',justifyContent:'space-between',alignItems:'center',boxShadow:'0 1px 6px rgba(0,0,0,.05)'}}>
                                <div>
                                    <div className="fd" style={{fontSize:22,fontWeight:800,color:'#0f172a'}}>{setup.name}</div>
                                    <div style={{fontFamily:'Outfit,sans-serif',fontSize:14,color:'#64748b',marginTop:2}}>{setup.players.length} players · {setup.schedule.length} rounds</div>
                                </div>
                                <button className="btn-out btn-sm" onClick={()=>{setSetup(null);setScores({});}}>New</button>
                            </div>
                            <ScheduleView schedule={setup.schedule} scores={scores} onScoreChange={updScore} canEdit={true} tournamentName={setup.name} players={setup.players} isGuest={true} onExportPDF={()=>doPrint(setup.name,setup.schedule,scores,setup.players,false)} finalized={false}/>
                        </>
                    )
                )}

                {tab==='find'&&(
                    <div className="card">
                        <div className="fd" style={{fontSize:22,fontWeight:800,color:'#0f172a',marginBottom:6}}>FIND A TOURNAMENT</div>
                        <div style={{fontFamily:'Outfit,sans-serif',fontSize:15,color:'#64748b',marginBottom:18,lineHeight:1.6}}>Enter a tournament ID shared by the organizer to view any public tournament.</div>
                        <div style={{display:'flex',gap:8,marginBottom:18}}>
                            <input className="inp" value={findId} onChange={e=>setFindId(e.target.value)} placeholder="e.g. tournament-1739746800" onKeyDown={e=>e.key==='Enter'&&findTournament()} style={{flex:1}}/>
                            <button className="btn-g" onClick={findTournament} disabled={finding}>{finding?'Searching…':'Find →'}</button>
                        </div>
                        {findErr&&<div style={{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:10,padding:'13px 16px',fontSize:15,color:'#dc2626',marginBottom:14}}>{findErr}</div>}
                        {found&&(
                            <>
                                <div style={{background:'#f0fdf4',border:'1px solid #a7f3d0',borderRadius:12,padding:'14px 18px',marginBottom:16}}>
                                    <div className="fd" style={{fontSize:20,fontWeight:800,color:'#0f172a'}}>{found.name}</div>
                                    <div style={{fontFamily:'Outfit,sans-serif',fontSize:14,color:'#64748b',marginTop:4}}>🌍 Public · {found.players?.length||0} players · {found.schedule?.length||0} rounds{found.scoresFinalized&&' · 🔒 Finalized'}</div>
                                </div>
                                <ScheduleView schedule={found.schedule||[]} scores={found.scores||{}} onScoreChange={()=>{}} canEdit={false} tournamentName={found.name} players={found.players||[]} isGuest={true} onExportPDF={()=>doPrint(found.name,found.schedule||[],found.scores||{},found.players||[],true)} finalized={true}/>
                            </>
                        )}
                    </div>
                )}
            </div>
        </div>
    );
}

// ── Full App (Authenticated) ──────────────────────────────────────────
function FullApp({user,onLogout,onBack,onFeedback}){
    const[view,setView]=useState('dashboard');
    const[setup,setSetup]=useState(null);
    const[scores,setScores]=useState({});
    const[tid,setTid]=useState(null);
    const[createdBy,setCreatedBy]=useState(null);
    const[isPublic,setIsPublic]=useState(false);
    const[finalized,setFinalized]=useState(false);
    const[saveStatus,setSaveStatus]=useState('');
    const[myT,setMyT]=useState([]);
    const[loadId,setLoadId]=useState('');
    const saving=useRef(false);
    const isRemote=useRef(false);
    const didInit=useRef(false);

    // Refs so save() always sees fresh state
    const rSetup=useRef(null),rScores=useRef({}),rTid=useRef(null);
    const rCreatedBy=useRef(null),rPublic=useRef(false),rFinalized=useRef(false);
    useEffect(()=>{rSetup.current=setup;},[setup]);
    useEffect(()=>{rScores.current=scores;},[scores]);
    useEffect(()=>{rTid.current=tid;},[tid]);
    useEffect(()=>{rCreatedBy.current=createdBy;},[createdBy]);
    useEffect(()=>{rPublic.current=isPublic;},[isPublic]);
    useEffect(()=>{rFinalized.current=finalized;},[finalized]);

    useEffect(()=>{loadAll();},[user]);

    const loadAll=async()=>{
        if(!user)return;
        try{const list=await storage.getAll(user.uid);setMyT(list.sort((a,b)=>b.createdAt-a.createdAt));}catch(e){}
    };

    // Auto-save on score change (debounced)
    useEffect(()=>{
        if(!tid||Object.keys(scores).length===0)return;
        if(isRemote.current){isRemote.current=false;return;}
        const t=setTimeout(()=>doSave(),1500);return()=>clearTimeout(t);
    },[scores]);

    // Auto-save on visibility toggle
    useEffect(()=>{
        if(!tid||!didInit.current)return;
        const t=setTimeout(()=>doSave(),600);return()=>clearTimeout(t);
    },[isPublic]);

    // Real-time listener
    useEffect(()=>{
        if(!tid)return;
        const u=storage.listen(tid,data=>{if(data?.scores){isRemote.current=true;setScores(data.scores);}});
        return()=>{if(typeof u==='function')u();};
    },[tid]);

    const doSave=async(overrides={})=>{
        const id=overrides.tid??rTid.current;
        const s=overrides.setup??rSetup.current;
        const sc=overrides.scores??rScores.current;
        const pub=overrides.isPublic??rPublic.current;
        const fin=overrides.finalized??rFinalized.current;
        const cb=overrides.createdBy??rCreatedBy.current;
        if(!id||!s)return;
        if(saving.current)return;
        saving.current=true;
        const uid=user?.uid||'guest';
        const flat=[];
        (s.schedule||[]).forEach((round,ri)=>round.forEach((m)=>{flat.push({roundIndex:ri,id:m.id,court:m.court,team1:Array.isArray(m.team1)?m.team1.join(', '):m.team1,team2:Array.isArray(m.team2)?m.team2.join(', '):m.team2});}));
        const data={id,name:s.name,players:s.players,courts:s.courts,numRounds:s.rounds,matchFormat:s.format,scheduleFlat:flat,scores:sc,scoresFinalized:fin,isPublic:pub,participants:[uid,...(s.players||[]).map(p=>`player-${p}`)],createdBy:cb||uid,createdAt:Date.now()};
        try{setSaveStatus('Saving…');await storage.save(data);setSaveStatus('✓ Saved');setTimeout(()=>setSaveStatus(''),2500);}catch(e){setSaveStatus('✗ Save failed');}
        saving.current=false;
    };

    const handleGenerate=d=>{
        const newTid=`tournament-${Date.now()}`;
        const uid=user?.uid||'guest';
        setSetup(d);setScores({});setTid(newTid);setCreatedBy(uid);setIsPublic(false);setFinalized(false);
        didInit.current=false;
        setView('tournament');
        // Save immediately with explicit values (avoids stale closure issue)
        setTimeout(()=>{
            didInit.current=true;
            doSave({tid:newTid,setup:d,scores:{},isPublic:false,finalized:false,createdBy:uid});
        },150);
    };

    const loadTournament=async id=>{
        if(!id.trim())return;
        const data=await storage.get(id.trim());
        if(!data){alert('Tournament not found');return;}
        const map={};
        (data.scheduleFlat||[]).forEach(m=>{if(!map[m.roundIndex])map[m.roundIndex]=[];map[m.roundIndex].push({id:m.id,court:m.court,team1:typeof m.team1==='string'?m.team1.split(', ').filter(Boolean):[m.team1],team2:typeof m.team2==='string'?m.team2.split(', ').filter(Boolean):[m.team2]});});
        const schedule=data.schedule||Object.keys(map).sort((a,b)=>a-b).map(k=>map[k]);
        const s={name:data.name,players:data.players||[],schedule,courts:data.courts,rounds:data.numRounds,format:data.matchFormat,mode:'rotating'};
        setSetup(s);setScores(data.scores||{});setTid(data.id);setCreatedBy(data.createdBy||null);setIsPublic(data.isPublic||false);setFinalized(data.scoresFinalized||false);
        didInit.current=false;setView('tournament');setTimeout(()=>{didInit.current=true;},500);
    };

    const delTournament=async id=>{
        if(!confirm('Delete this tournament?'))return;
        storage.del(id);loadAll();
        if(tid===id){setView('dashboard');setSetup(null);setTid(null);}
    };

    const isOwner=tid&&createdBy===user?.uid;

    const share=()=>{
        if(!tid)return;
        const el=document.createElement('div');
        el.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;';
        el.innerHTML=`<div style="background:white;border-radius:16px;padding:28px;max-width:440px;width:100%;font-family:Outfit,sans-serif;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                <div style="font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;color:#0f172a;">📤 SHARE TOURNAMENT</div>
                <button id="__cls" style="background:none;border:none;font-size:28px;cursor:pointer;color:#94a3b8;line-height:1;">×</button>
            </div>
            <div style="background:#f1f5f9;border-radius:12px;padding:14px;margin-bottom:14px;">
                <div style="font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;">Tournament ID</div>
                <div style="display:flex;gap:10px;">
                    <input id="__tid" value="${tid}" readonly style="flex:1;background:white;border:2px solid #e2e8f0;border-radius:8px;padding:10px 12px;font-size:14px;font-family:monospace;outline:none;" onclick="this.select()"/>
                    <button id="__cp" style="background:#059669;color:white;border:none;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;font-size:15px;font-family:Outfit,sans-serif;">Copy</button>
                </div>
            </div>
            <div style="background:#eff6ff;border-left:4px solid #3b82f6;border-radius:8px;padding:12px 14px;font-size:14px;color:#1e40af;line-height:1.5;">
                Share this ID. Others can paste it in Quick Generation → Find by ID to view your public tournament.
            </div>
        </div>`;
        el.onclick=e=>{if(e.target===el)el.remove();};
        document.body.appendChild(el);
        el.querySelector('#__cls').onclick=()=>el.remove();
        el.querySelector('#__cp').onclick=()=>{navigator.clipboard.writeText(tid).then(()=>{const b=el.querySelector('#__cp');b.textContent='✓ Copied!';setTimeout(()=>b.textContent='Copy',1500);});};
    };

    const doFinalize=()=>{
        if(finalized){alert('Already finalized');return;}
        if(confirm('Finalize scores? This makes them read-only.')){
            setFinalized(true);
            setTimeout(()=>doSave({finalized:true}),100);
        }
    };

    // Nav (defined inside FullApp so it can call setView)
    const Nav=({showBack})=>(
        <div className="nav">
            <button className="nav-back" onClick={()=>showBack?setView('dashboard'):onBack()}>←</button>
            <div className="fd" style={{fontSize:22,fontWeight:800,flex:1,cursor:'pointer'}} onClick={()=>setView('dashboard')}>
                <span style={{color:'white'}}>PICKLE</span><span style={{color:'#34d399'}}>CONNECT</span>
            </div>
            <button onClick={onFeedback} style={{background:'rgba(255,255,255,.1)',color:'#94a3b8',border:'none',borderRadius:8,padding:'8px 13px',fontFamily:'Outfit,sans-serif',fontSize:14,cursor:'pointer',marginRight:6}}>💬</button>
            <button onClick={onLogout} style={{background:'rgba(255,255,255,.1)',color:'white',border:'none',borderRadius:8,padding:'9px 14px',fontFamily:'Outfit,sans-serif',fontSize:13,cursor:'pointer'}}>Logout</button>
        </div>
    );

    // Dashboard
    if(view==='dashboard')return(
        <div style={{minHeight:'100vh',background:'#f1f5f9',display:'flex',flexDirection:'column'}}>
            <Nav showBack={false}/>
            <div className="pg">
                <div style={{background:'linear-gradient(135deg,#0f172a,#1e3a2f)',borderRadius:16,padding:'22px 24px',marginBottom:16,display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:12}}>
                    <div>
                        <div className="fd" style={{fontSize:28,fontWeight:800,color:'white'}}>DASHBOARD</div>
                        <div style={{fontFamily:'Outfit,sans-serif',fontSize:15,color:'#6ee7b7',marginTop:2}}>Welcome back, {user?.name||'Player'}!</div>
                    </div>
                    <button className="btn-g" onClick={()=>setView('create')}>+ New Tournament</button>
                </div>

                <div className="card" style={{marginBottom:14}}>
                    <div style={{fontFamily:'Outfit,sans-serif',fontSize:15,fontWeight:700,color:'#374151',marginBottom:10}}>📋 Load Tournament by ID</div>
                    <div style={{display:'flex',gap:8}}>
                        <input className="inp" value={loadId} onChange={e=>setLoadId(e.target.value)} placeholder="Paste tournament ID…" onKeyDown={e=>e.key==='Enter'&&loadTournament(loadId)} style={{flex:1}}/>
                        <button className="btn-g" onClick={()=>loadTournament(loadId)} style={{whiteSpace:'nowrap'}}>Load</button>
                    </div>
                </div>

                <div className="card">
                    <div className="fd" style={{fontSize:22,fontWeight:800,color:'#0f172a',marginBottom:14}}>MY TOURNAMENTS</div>
                    {myT.length===0?(
                        <div style={{textAlign:'center',padding:'40px 0',color:'#94a3b8',fontFamily:'Outfit,sans-serif',fontSize:16}}>No tournaments yet.<br/>Create your first one!</div>
                    ):(
                        <div style={{display:'flex',flexDirection:'column',gap:10}}>
                            {myT.map(t=>(
                                <div key={t.id} style={{border:'1px solid #e2e8f0',borderRadius:12,padding:'14px 16px',display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
                                    <div style={{flex:1,minWidth:0}}>
                                        <div style={{fontFamily:'Outfit,sans-serif',fontWeight:600,fontSize:15,color:'#0f172a'}}>{t.name}</div>
                                        <div style={{fontFamily:'Outfit,sans-serif',fontSize:13,color:'#94a3b8',marginTop:3}}>{t.isPublic?'🌍 Public':'🔒 Private'} · {t.players?.length||0} players · {t.scoresFinalized?'🔒 Finalized':'In progress'}</div>
                                    </div>
                                    <button onClick={()=>loadTournament(t.id)} style={{background:'#f1f5f9',border:'none',borderRadius:8,padding:'9px 16px',fontFamily:'Outfit,sans-serif',fontSize:14,fontWeight:600,color:'#374151',cursor:'pointer'}}>Open</button>
                                    {t.createdBy===user?.uid&&<button className="btn-red" onClick={()=>delTournament(t.id)}>Delete</button>}
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            </div>
        </div>
    );

    // Create
    if(view==='create')return(
        <div style={{minHeight:'100vh',background:'#f1f5f9',display:'flex',flexDirection:'column'}}>
            <Nav showBack={true}/>
            <div className="pg">
                <div className="card">
                    <div className="fd" style={{fontSize:26,fontWeight:800,color:'#0f172a',marginBottom:18}}>NEW TOURNAMENT</div>
                    <TournamentSetup onGenerate={handleGenerate}/>
                </div>
            </div>
        </div>
    );

    // Tournament
    if(view==='tournament'&&setup)return(
        <div style={{minHeight:'100vh',background:'#f1f5f9',display:'flex',flexDirection:'column'}}>
            <Nav showBack={true}/>
            <div className="pg">
                <div className="card" style={{marginBottom:14}}>
                    <div style={{display:'flex',flexWrap:'wrap',alignItems:'flex-start',gap:12}}>
                        <div style={{flex:1,minWidth:0}}>
                            <div className="fd" style={{fontSize:24,fontWeight:800,color:'#0f172a',wordBreak:'break-word'}}>{setup.name}</div>
                            <div style={{fontFamily:'Outfit,sans-serif',fontSize:14,color:'#64748b',marginTop:3}}>
                                {setup.players.length} players · {setup.schedule.length} rounds · {isPublic?'🌍 Public':'🔒 Private'}{finalized?' · 🔒 Finalized':''}
                            </div>
                        </div>
                        <div style={{display:'flex',flexWrap:'wrap',gap:8,alignItems:'center'}}>
                            {saveStatus&&<span style={{fontFamily:'Outfit,sans-serif',fontSize:13,color:saveStatus.includes('✓')?'#059669':saveStatus.includes('✗')?'#dc2626':'#64748b'}}>{saveStatus}</span>}
                            {isOwner&&!finalized&&(
                                <div style={{display:'flex',border:'2px solid #e2e8f0',borderRadius:10,overflow:'hidden'}}>
                                    <button onClick={()=>setIsPublic(false)} style={{padding:'9px 14px',background:!isPublic?'#0f172a':'white',color:!isPublic?'white':'#94a3b8',border:'none',fontFamily:'Outfit,sans-serif',fontSize:13,fontWeight:700,cursor:'pointer'}}>🔒 Private</button>
                                    <button onClick={()=>setIsPublic(true)} style={{padding:'9px 14px',background:isPublic?'#059669':'white',color:isPublic?'white':'#94a3b8',border:'none',fontFamily:'Outfit,sans-serif',fontSize:13,fontWeight:700,cursor:'pointer'}}>🌍 Public</button>
                                </div>
                            )}
                            {tid&&<button onClick={share} style={{background:'#3b82f6',color:'white',border:'none',borderRadius:8,padding:'10px 14px',fontFamily:'Outfit,sans-serif',fontSize:13,fontWeight:600,cursor:'pointer'}}>📤 Share</button>}
                            {isOwner&&<button onClick={doFinalize} disabled={finalized} style={{background:finalized?'#f1f5f9':'#7c3aed',color:finalized?'#94a3b8':'white',border:'none',borderRadius:8,padding:'10px 14px',fontFamily:'Outfit,sans-serif',fontSize:13,fontWeight:600,cursor:finalized?'not-allowed':'pointer'}}>{finalized?'🔒 Finalized':'✓ Finalize'}</button>}
                        </div>
                    </div>
                </div>

                <ScheduleView
                    schedule={setup.schedule} scores={scores}
                    onScoreChange={(id,team,val)=>setScores(p=>({...p,[id]:{...(p[id]||{}),[team]:parseInt(val)||0}}))}
                    canEdit={isOwner} tournamentName={setup.name} players={setup.players}
                    isGuest={false} onExportPDF={()=>doPrint(setup.name,setup.schedule,scores,setup.players,true)} finalized={finalized}/>
            </div>
        </div>
    );

    return null;
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
