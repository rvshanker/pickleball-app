const firebaseConfig = {

    authDomain: "pickleball-app-1bba7.firebaseapp.com",
    projectId: "pickleball-app-1bba7",
    storageBucket: "pickleball-app-1bba7.firebasestorage.app",
    messagingSenderId: "645604154338",
    appId: "1:645604154338:web:b92f87c2cd11d950b737bb"
};

let db = null, auth = null, fbReady = false;
const origErr = console.error;
console.error = (...a) => {
    const s = a.join(' ');
    if (s.includes('permission-denied') || s.includes('insufficient permissions') || s.includes('Firestore')) return;
    origErr(...a);
};
try {
    firebase.initializeApp(firebaseConfig);

// ── Storage ───────────────────────────────────────────────────────────
const storage = {
    async save(data) {
        if (fbReady && db) {
            try { await db.collection('tournaments').doc(data.id).set(data); return; } catch(e) {}
        }
        localStorage.setItem(`tournament:${data.id}`, JSON.stringify(data));
    },
    async get(id) {
        if (fbReady && db) {
            try {
                const doc = await db.collection('tournaments').doc(id).get();
                if (doc.exists) return doc.data();
            } catch(e) {}
        }
        const d = localStorage.getItem(`tournament:${id}`);
        return d ? JSON.parse(d) : null;
    },
    async getAll(uid) {
        if (fbReady && db) {
            try {
                const pub = await db.collection('tournaments').where('isPublic','==',true).get();
                const list = pub.docs.map(d => d.data());
                if (uid) {
                    const priv = await db.collection('tournaments').where('isPublic','==',false).where('participants','array-contains',uid).get();
                    return [...list, ...priv.docs.map(d => d.data())];
                }
                return list;
            } catch(e) {}
        }
        const list = [];
        for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k.startsWith('tournament:')) {
                const d = JSON.parse(localStorage.getItem(k));
                if (d.isPublic || (uid && d.participants?.includes(uid))) list.push(d);
            }
        }
        return list;
    },
    listen(id, cb) {
        if (fbReady && db) {
            return db.collection('tournaments').doc(id).onSnapshot(doc => {
                if (doc.exists) cb(doc.data());
            });
        }
        const t = setInterval(async () => { const d = await storage.get(id); if (d) cb(d); }, 2000);
        return () => clearInterval(t);
    },
    del(id) {
        if (fbReady && db) { try { db.collection('tournaments').doc(id).delete(); } catch(e) {} }
        localStorage.removeItem(`tournament:${id}`);
    }
};

// ── Tournament Algorithms (exact from main app) ───────────────────────
function generateSinglesSchedule(players, numRounds, courts) {
    const allRounds = [];
    const list = [...players];
    if (list.length % 2 !== 0) list.push('BYE');
    const maxR = list.length - 1;
    const actual = Math.min(numRounds, maxR);
    const half = list.length / 2;
    for (let r = 0; r < actual; r++) {
        const matches = [];
        for (let i = 0; i < half; i++) {
            const p1 = list[i], p2 = list[list.length - 1 - i];
            if (p1 !== 'BYE' && p2 !== 'BYE') {
                matches.push({ id: `r${r}-m${i}`, court: (i % courts) + 1, team1: [p1], team2: [p2] });
            }
        }
        allRounds.push(matches);
        list.splice(1, 0, list.pop());
    }
    return allRounds;
}

function generateRotatingSchedule(players, numRounds, courts) {
    const allRounds = [];
    const stats = {};
    players.forEach(p => { stats[p] = { games: 0, partners: {}, opponents: {}, lastPartner: null }; });
    for (let round = 0; round < numRounds; round++) {
        const sorted = [...players].sort((a, b) => stats[a].games - stats[b].games);
        const playCount = Math.min(courts * 4, sorted.length);
        let playing = sorted.slice(0, playCount).sort(() => Math.random() - 0.5);
        const roundMatches = [];
        let courtNum = 0;
        while (playing.length >= 4 && courtNum < courts) {
            let best = Infinity, bestList = [];
            for (let a = 0; a < playing.length; a++)
            for (let b = a+1; b < playing.length; b++)
            for (let c = b+1; c < playing.length; c++)
            for (let d = c+1; d < playing.length; d++) {
                const [p1,p2,p3,p4] = [playing[a],playing[b],playing[c],playing[d]];
                let score = 0;
                score += (stats[p1].partners[p2]||0)*10 + (stats[p3].partners[p4]||0)*10;
                if (stats[p1].lastPartner===p2||stats[p2].lastPartner===p1) score+=100;
                if (stats[p3].lastPartner===p4||stats[p4].lastPartner===p3) score+=100;
                score += (stats[p1].opponents[p3]||0)*2+(stats[p1].opponents[p4]||0)*2;
                score += (stats[p2].opponents[p3]||0)*2+(stats[p2].opponents[p4]||0)*2;
                if (score < best) { best = score; bestList = [{team1:[p1,p2],team2:[p3,p4]}]; }
                else if (score === best) bestList.push({team1:[p1,p2],team2:[p3,p4]});
            }
            const pick = bestList[Math.floor(Math.random()*bestList.length)];
            if (!pick) break;
            roundMatches.push({ id:`r${round}-m${courtNum}`, court:courtNum+1, team1:pick.team1, team2:pick.team2 });
            const all = [...pick.team1,...pick.team2];
            all.forEach(p => stats[p].games++);
            stats[pick.team1[0]].partners[pick.team1[1]] = (stats[pick.team1[0]].partners[pick.team1[1]]||0)+1;
            stats[pick.team1[1]].partners[pick.team1[0]] = (stats[pick.team1[1]].partners[pick.team1[0]]||0)+1;
            stats[pick.team2[0]].partners[pick.team2[1]] = (stats[pick.team2[0]].partners[pick.team2[1]]||0)+1;
            stats[pick.team2[1]].partners[pick.team2[0]] = (stats[pick.team2[1]].partners[pick.team2[0]]||0)+1;
            stats[pick.team1[0]].lastPartner=pick.team1[1]; stats[pick.team1[1]].lastPartner=pick.team1[0];
            stats[pick.team2[0]].lastPartner=pick.team2[1]; stats[pick.team2[1]].lastPartner=pick.team2[0];
            pick.team1.forEach(p1 => pick.team2.forEach(p2 => {
                stats[p1].opponents[p2]=(stats[p1].opponents[p2]||0)+1;
                stats[p2].opponents[p1]=(stats[p2].opponents[p1]||0)+1;
            }));
            playing = playing.filter(p => !all.includes(p));
            courtNum++;
        }
        allRounds.push(roundMatches);
    }
    return allRounds;
}

function generateFixedSchedule(partnerships, numRounds, courts) {
    const allRounds = [];
    const teams = partnerships.map(p => p.players);
    const tGames = {};
    teams.forEach((_,i) => tGames[i]=0);
    for (let round = 0; round < numRounds; round++) {
        const sorted = teams.map((t,i)=>({t,i})).sort((a,b)=>tGames[a.i]-tGames[b.i]);
        const playing = sorted.slice(0, Math.min(courts*2, sorted.length));
        const matches = [];
        let c = 0;
        for (let i = 0; i < playing.length-1; i+=2) {
            if (c >= courts) break;
            matches.push({ id:`r${round}-m${c}`, court:c+1, team1:playing[i].t, team2:playing[i+1].t });
            tGames[playing[i].i]++; tGames[playing[i+1].i]++; c++;
        }
        allRounds.push(matches);
    }
    return allRounds;
}

function calcLeaderboard(players, schedule, scores) {
    const stats = {};
    players.filter(p=>p.trim()).forEach(p => { stats[p]={wins:0,losses:0,pf:0,pa:0}; });
    schedule.forEach(round => round.forEach(match => {
        const s = scores[match.id];
        if (!s || (s.team1===undefined && s.team2===undefined)) return;
        const s1 = parseInt(s.team1)||0, s2 = parseInt(s.team2)||0;
        const all1 = match.team1, all2 = match.team2;
        if (s1 > s2) {
            all1.forEach(p=>{ if(stats[p]){stats[p].wins++;stats[p].pf+=s1;stats[p].pa+=s2;} });
            all2.forEach(p=>{ if(stats[p]){stats[p].losses++;stats[p].pf+=s2;stats[p].pa+=s1;} });
        } else if (s2 > s1) {
            all2.forEach(p=>{ if(stats[p]){stats[p].wins++;stats[p].pf+=s2;stats[p].pa+=s1;} });
            all1.forEach(p=>{ if(stats[p]){stats[p].losses++;stats[p].pf+=s1;stats[p].pa+=s2;} });
        }
    }));
    return Object.entries(stats).map(([name,s])=>({name,...s,diff:s.pf-s.pa}))
        .sort((a,b)=>b.wins-a.wins||b.diff-a.diff);
}

// ── PDF Print ─────────────────────────────────────────────────────────
function doPrint(tournamentName, schedule, scores, players, withScores) {
    const area = document.getElementById('print-area');
    const date = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});

    let html = `
    <div style="font-family:'Outfit',sans-serif;max-width:750px;margin:0 auto;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;border-bottom:3px solid #059669;padding-bottom:12px;">
            <div>
                <div style="font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;color:#0f172a;">${tournamentName || 'Tournament Scorecard'}</div>
                <div style="font-size:13px;color:#64748b;margin-top:2px;">Generated ${date} · PickleConnect</div>
            </div>
            <div style="text-align:right;font-size:13px;color:#64748b;">
                <div><strong>${players.filter(p=>p.trim()).length}</strong> Players</div>
                <div><strong>${schedule.length}</strong> Rounds</div>
                <div><strong>${schedule.reduce((a,r)=>a+r.length,0)}</strong> Matches</div>
            </div>
        </div>`;

    schedule.forEach((round, ri) => {
        html += `<div style="margin-bottom:18px;">
            <div style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:0.5px;color:#059669;margin-bottom:8px;text-transform:uppercase;">Round ${ri+1}</div>
            <table style="width:100%;border-collapse:collapse;">
                <thead>
                    <tr style="background:#f1f5f9;">
                        <th style="padding:7px 10px;text-align:left;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.5px;border:1px solid #e2e8f0;">Court</th>
                        <th style="padding:7px 10px;text-align:center;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.5px;border:1px solid #e2e8f0;">Team 1</th>
                        <th style="padding:7px 10px;text-align:center;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.5px;border:1px solid #e2e8f0;">Score</th>
                        <th style="padding:7px 10px;text-align:center;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.5px;border:1px solid #e2e8f0;">Team 2</th>
                        <th style="padding:7px 10px;text-align:center;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.5px;border:1px solid #e2e8f0;">Score</th>
                    </tr>
                </thead>
                <tbody>`;
        round.forEach((match, mi) => {
            const sc = scores[match.id];
            const s1 = withScores && sc?.team1 !== undefined ? sc.team1 : '___';
            const s2 = withScores && sc?.team2 !== undefined ? sc.team2 : '___';
            const winner = sc && sc.team1 !== undefined && sc.team2 !== undefined
                ? (parseInt(sc.team1) > parseInt(sc.team2) ? match.team1.join(' & ') : parseInt(sc.team2) > parseInt(sc.team1) ? match.team2.join(' & ') : null)
                : null;
            html += `<tr style="border:1px solid #e2e8f0;${mi%2===1?'background:#fafafa;':''}">
                <td style="padding:8px 10px;font-size:13px;font-weight:600;color:#059669;border:1px solid #e2e8f0;">Court ${match.court}</td>
                <td style="padding:8px 10px;font-size:13px;border:1px solid #e2e8f0;text-align:center;font-weight:${winner===match.team1.join(' & ')?'700':'400'};color:${winner===match.team1.join(' & ')?'#059669':'#0f172a'};">${match.team1.join(' & ')} ${winner===match.team1.join(' & ')?'🏆':''}</td>
                <td style="padding:8px 10px;font-size:15px;font-weight:700;border:1px solid #e2e8f0;text-align:center;color:#059669;">${s1}</td>
                <td style="padding:8px 10px;font-size:13px;border:1px solid #e2e8f0;text-align:center;font-weight:${winner===match.team2.join(' & ')?'700':'400'};color:${winner===match.team2.join(' & ')?'#059669':'#0f172a'};">${match.team2.join(' & ')} ${winner===match.team2.join(' & ')?'🏆':''}</td>
                <td style="padding:8px 10px;font-size:15px;font-weight:700;border:1px solid #e2e8f0;text-align:center;color:#059669;">${s2}</td>

    html += `<div style="margin-top:20px;font-size:11px;color:#94a3b8;text-align:center;">PickleConnect · Pickleball Tournament Generator</div></div>`;

    window.print();

// ── Main App ──────────────────────────────────────────────────────────
function App() {
    const [view, setView] = useState('landing'); // landing | simple | login | app
    const [user, setUser] = useState(null);
    const [authReady, setAuthReady] = useState(false);

    useEffect(() => {
        if (!fbReady || !auth) { setAuthReady(true); return; }
        const unsub = auth.onAuthStateChanged(async u => {
            if (u && !u.isAnonymous) {
                let profile = { uid: u.uid, email: u.email, name: u.displayName || u.email.split('@')[0] };
                try {
                    const doc = await db.collection('users').doc(u.uid).get();
                    if (doc.exists) profile = doc.data();
                    else { await db.collection('users').doc(u.uid).set(profile); }
                } catch(e) {}
                setUser(profile);
            } else {
                setUser(null);
            }
            setAuthReady(true);
        });
        return () => unsub();
    }, []);

    const logout = async () => {
        if (auth) { await auth.signOut(); }
        setUser(null);
        setView('landing');
    };

    if (!authReady) return (
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',background:'#f8fafc'}}>
            <div style={{textAlign:'center'}}>
                <div style={{width:40,height:40,border:'4px solid #e2e8f0',borderTop:'4px solid #059669',borderRadius:'50%',animation:'spin 0.8s linear infinite',margin:'0 auto 12px'}}/>
                <div style={{fontFamily:'Outfit,sans-serif',color:'#64748b',fontSize:14}}>Loading…</div>
            </div>
            <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
        </div>
    );

    if (view === 'landing') return <LandingView onSimple={() => setView('simple')} onAdvanced={() => user ? setView('app') : setView('login')} user={user} />;
    if (view === 'simple') return <SimpleView onBack={() => setView('landing')} onLogin={() => setView('login')} />;
    if (view === 'login') return <LoginView onBack={() => setView('landing')} onSuccess={() => setView('app')} />;
    if (view === 'app') return <FullApp user={user} onLogout={logout} onBack={() => setView('landing')} />;
    return null;
}

// ── Landing ───────────────────────────────────────────────────────────
function LandingView({ onSimple, onAdvanced, user }) {
    return (
        <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
            {/* Hero */}
            <div className="hero-bg" style={{padding:'40px 20px 56px',textAlign:'center'}}>
                <div style={{display:'inline-flex',alignItems:'center',gap:10,marginBottom:24,background:'rgba(5,150,105,0.2)',padding:'6px 16px',borderRadius:99}}>
                    <span style={{fontSize:16}}>🏓</span>
                    <span style={{fontFamily:'Outfit,sans-serif',color:'#6ee7b7',fontSize:13,fontWeight:600,letterSpacing:1}}>PICKLEBALL TOURNAMENT GENERATOR</span>
                </div>
                <h1 className="font-display" style={{fontSize:'clamp(42px,8vw,72px)',fontWeight:800,color:'white',lineHeight:1,marginBottom:12,letterSpacing:'-1px'}}>
                    PICKLE<span style={{color:'#34d399'}}>CONNECT</span> <span style={{fontWeight:400,opacity:.6}}>LITE</span>
                </h1>
                <p style={{fontFamily:'Outfit,sans-serif',color:'#94a3b8',fontSize:16,maxWidth:440,margin:'0 auto 36px'}}>
                    Generate round-robin brackets in seconds. No setup, no waiting.
                </p>

                {/* Choice cards */}
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(280px,1fr))',gap:16,maxWidth:640,margin:'0 auto'}}>
                    {/* Simple */}

// ── Login View ────────────────────────────────────────────────────────
function LoginView({ onBack, onSuccess }) {
    const [email, setEmail] = useState('');
    const [pw, setPw] = useState('');
    const [pwc, setPwc] = useState('');
    const [isSignup, setIsSignup] = useState(false);
    const [err, setErr] = useState('');
    const [msg, setMsg] = useState('');
    const [busy, setBusy] = useState(false);

    const submit = async (e) => {
        e.preventDefault(); setErr(''); setMsg(''); setBusy(true);
        if (!fbReady) { setErr('Firebase not configured'); setBusy(false); return; }
        if (isSignup && pw !== pwc) { setErr('Passwords do not match'); setBusy(false); return; }
        if (isSignup && pw.length < 6) { setErr('Password must be 6+ characters'); setBusy(false); return; }
        try {
            if (isSignup) {
                const cred = await auth.createUserWithEmailAndPassword(email, pw);
                try { await cred.user.sendEmailVerification(); } catch(e) {}
                setMsg('Account created! Redirecting…');
                setTimeout(onSuccess, 1500);
            } else {
                await auth.signInWithEmailAndPassword(email, pw);
                onSuccess();
            }
        } catch(e) {
            const map = { 'auth/email-already-in-use':'Email already registered.', 'auth/invalid-email':'Invalid email.', 'auth/wrong-password':'Incorrect password.', 'auth/user-not-found':'No account found with this email.' };
            setErr(map[e.code] || e.message);
        }
        setBusy(false);
    };

    const reset = async () => {
        if (!email) { setErr('Enter your email first'); return; }
        try { await auth.sendPasswordResetEmail(email); setMsg('Reset email sent! Check your inbox.'); } catch(e) { setErr(e.message); }
    };

    return (
        <div style={{minHeight:'100vh',background:'#f8fafc',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:20}}>
            <div style={{width:'100%',maxWidth:400}}>
                <button onClick={onBack} style={{background:'none',border:'none',color:'#64748b',cursor:'pointer',fontFamily:'Outfit,sans-serif',fontSize:14,marginBottom:24,display:'flex',alignItems:'center',gap:6}}>
                    ← Back
                </button>
                <div style={{background:'white',borderRadius:16,padding:'32px 28px',boxShadow:'0 4px 24px rgba(0,0,0,0.08)'}}>
                    <div className="font-display" style={{fontSize:28,fontWeight:800,color:'#0f172a',marginBottom:4}}>
                        {isSignup ? 'CREATE ACCOUNT' : 'WELCOME BACK'}
                    </div>
                    <div style={{fontFamily:'Outfit,sans-serif',fontSize:13,color:'#64748b',marginBottom:24}}>
                        {isSignup ? 'Get access to all tournament features' : 'Log in to your tournament dashboard'}
                    </div>

                    <form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:14}}>
                        <div>
                            <label style={{fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:600,color:'#374151',textTransform:'uppercase',letterSpacing:.5,display:'block',marginBottom:5}}>Email</label>
                            <input className="inp" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com" required />
                        </div>
                        <div>
                            <label style={{fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:600,color:'#374151',textTransform:'uppercase',letterSpacing:.5,display:'block',marginBottom:5}}>Password</label>
                            <input className="inp" type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="••••••••" required minLength={6} />
                        </div>
                        {isSignup && (
                            <div>
                                <label style={{fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:600,color:'#374151',textTransform:'uppercase',letterSpacing:.5,display:'block',marginBottom:5}}>Confirm Password</label>
                                <input className="inp" type="password" value={pwc} onChange={e=>setPwc(e.target.value)} placeholder="••••••••" required minLength={6} />
                            </div>
                        )}
                        {err && <div style={{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:8,padding:'10px 12px',fontSize:13,color:'#dc2626',fontFamily:'Outfit,sans-serif'}}>{err}</div>}
                        {msg && <div style={{background:'#f0fdf4',border:'1px solid #a7f3d0',borderRadius:8,padding:'10px 12px',fontSize:13,color:'#059669',fontFamily:'Outfit,sans-serif'}}>{msg}</div>}
                        <button className="btn-primary" type="submit" disabled={busy} style={{width:'100%',padding:'12px',marginTop:4}}>
                            {busy ? 'Please wait…' : isSignup ? 'Create Account' : 'Log In'}
                        </button>
                    </form>

                    <div style={{marginTop:16,textAlign:'center',display:'flex',flexDirection:'column',gap:10}}>
                        <button onClick={()=>{setIsSignup(!isSignup);setErr('');setMsg('');}} style={{background:'none',border:'none',color:'#059669',fontFamily:'Outfit,sans-serif',fontSize:13,cursor:'pointer',fontWeight:600}}>
                            {isSignup ? 'Already have an account? Log in' : "Don't have an account? Sign up"}
                        </button>
                        {!isSignup && (
                            <button onClick={reset} style={{background:'none',border:'none',color:'#94a3b8',fontFamily:'Outfit,sans-serif',fontSize:12,cursor:'pointer'}}>
                                Forgot password?
                            </button>
                        )}
                    </div>
                </div>
            </div>
        </div>
    );
}

// ── Shared: Tournament Setup Form ─────────────────────────────────────
function TournamentSetup({ onGenerate }) {
    const [name, setName] = useState('');
    const [format, setFormat] = useState('doubles'); // singles | doubles
    const [mode, setMode] = useState('rotating'); // rotating | fixed (doubles only)
    const [numPlayers, setNumPlayers] = useState(8);
    const [players, setPlayers] = useState(Array.from({length:8},(_,i)=>`Player ${i+1}`));
    const [courts, setCourts] = useState(2);
    const [rounds, setRounds] = useState(3);
    const [partnerships, setPartnerships] = useState([]);

    useEffect(() => {
        setPlayers(prev => Array.from({length:numPlayers},(_,i)=>prev[i]||`Player ${i+1}`));
    }, [numPlayers]);

    const updatePlayer = (i, v) => setPlayers(p => { const n=[...p]; n[i]=v; return n; });

    const setupPartnerships = () => {
        const valid = players.filter(p=>p.trim());
        const pairs = [];
        for (let i = 0; i < valid.length-1; i+=2) {
            pairs.push({ players: [valid[i], valid[i+1]] });
        }
        setPartnerships(pairs);
    };

    const generate = () => {
        const valid = players.filter(p=>p.trim());
        if (format==='singles' && valid.length < 2) { alert('Need at least 2 players'); return; }
        if (format==='doubles' && valid.length < 4) { alert('Need at least 4 players for doubles'); return; }
        if (format==='doubles' && mode==='fixed' && partnerships.length < 2) { alert('Set up partnerships first'); return; }

        let schedule;
        if (format === 'singles') {
            schedule = generateSinglesSchedule(valid, rounds, courts);
        } else if (mode === 'rotating') {
            schedule = generateRotatingSchedule(valid, rounds, courts);
        } else {
            schedule = generateFixedSchedule(partnerships, rounds, courts);
        }
        onGenerate({ name: name || `Tournament ${new Date().toLocaleDateString()}`, players: valid, schedule, courts, rounds, format, mode });
    };

    const Pill = ({val, cur, set, label}) => (
        <button onClick={()=>set(val)} style={{
            background: cur===val ? '#059669' : '#f1f5f9',
            color: cur===val ? 'white' : '#64748b',
            border:'none',borderRadius:8,padding:'8px 16px',
            fontFamily:'Outfit,sans-serif',fontSize:13,fontWeight:600,cursor:'pointer',transition:'all .15s'
        }}>{label}</button>
    );

    return (
        <div style={{display:'flex',flexDirection:'column',gap:20}}>
            {/* Name */}
            <div>
                <label style={{fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:700,color:'#374151',textTransform:'uppercase',letterSpacing:.5,display:'block',marginBottom:6}}>Tournament Name</label>
                <input className="inp" value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Sunday Doubles Bash" />
            </div>

            {/* Format & Mode */}
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                <div>
                    <label style={{fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:700,color:'#374151',textTransform:'uppercase',letterSpacing:.5,display:'block',marginBottom:6}}>Format</label>
                    <div style={{display:'flex',gap:6}}>
                        <Pill val="singles" cur={format} set={setFormat} label="Singles" />
                        <Pill val="doubles" cur={format} set={setFormat} label="Doubles" />
                    </div>
                </div>
                {format==='doubles' && (
                    <div>
                        <label style={{fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:700,color:'#374151',textTransform:'uppercase',letterSpacing:.5,display:'block',marginBottom:6}}>Partner Mode</label>
                        <div style={{display:'flex',gap:6}}>
                            <Pill val="rotating" cur={mode} set={setMode} label="Rotating" />
                            <Pill val="fixed" cur={mode} set={setMode} label="Fixed" />
                        </div>
                    </div>
                )}
            </div>

            {/* Numbers */}
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
                <div>
                    <label style={{fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:700,color:'#374151',textTransform:'uppercase',letterSpacing:.5,display:'block',marginBottom:6}}>Players</label>
                    <input className="inp" type="number" min={format==='singles'?2:4} max={32} value={numPlayers} onChange={e=>setNumPlayers(parseInt(e.target.value)||4)} />
                </div>
                <div>
                    <label style={{fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:700,color:'#374151',textTransform:'uppercase',letterSpacing:.5,display:'block',marginBottom:6}}>Courts</label>
                    <input className="inp" type="number" min={1} max={10} value={courts} onChange={e=>setCourts(parseInt(e.target.value)||1)} />
                </div>
                <div>
                    <label style={{fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:700,color:'#374151',textTransform:'uppercase',letterSpacing:.5,display:'block',marginBottom:6}}>Rounds</label>
                    <input className="inp" type="number" min={1} max={20} value={rounds} onChange={e=>setRounds(parseInt(e.target.value)||1)} />
                </div>
            </div>

            {/* Player names */}
            <div>
                <label style={{fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:700,color:'#374151',textTransform:'uppercase',letterSpacing:.5,display:'block',marginBottom:8}}>Player Names</label>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:8}}>
                    {players.map((p,i) => (
                        <input key={i} className="inp" value={p} onChange={e=>updatePlayer(i,e.target.value)} placeholder={`Player ${i+1}`} />
                    ))}
                </div>
            </div>

            {/* Fixed partnerships setup */}
            {format==='doubles' && mode==='fixed' && (
                <div style={{background:'#f0fdf4',borderRadius:10,padding:14,border:'1px solid #a7f3d0'}}>
                    <div style={{fontFamily:'Outfit,sans-serif',fontSize:13,color:'#065f46',marginBottom:10,fontWeight:600}}>
                        Fixed Partnerships {partnerships.length > 0 ? `(${partnerships.length} pairs set)` : ''}
                    </div>
                    <button className="btn-ghost" onClick={setupPartnerships} style={{fontSize:13,padding:'7px 14px'}}>
                        Auto-pair from player list
                    </button>
                    {partnerships.map((pair,i) => (
                        <div key={i} style={{fontFamily:'Outfit,sans-serif',fontSize:13,color:'#374151',marginTop:6}}>
                            Pair {i+1}: <strong>{pair.players.join(' & ')}</strong>
                        </div>
                    ))}
                </div>
            )}

            <button className="btn-primary" onClick={generate} style={{width:'100%',padding:'13px',fontSize:15}}>
                🎾 Generate Tournament
            </button>
        </div>
    );
}

                    <div style={{display:'flex',flexDirection:'column',gap:6}}>
                        {round.map(match => {
                            const sc = scores[match.id] || {};
                            const s1 = sc.team1 !== undefined ? parseInt(sc.team1) : null;
                            const s2 = sc.team2 !== undefined ? parseInt(sc.team2) : null;
                            const w1 = s1!==null && s2!==null && s1>s2;
                            const w2 = s1!==null && s2!==null && s2>s1;
                            return (
                                <div key={match.id} style={{background:'white',borderRadius:10,padding:'10px 14px',border:'1px solid #e2e8f0',display:'flex',alignItems:'center',gap:8}}>
                                    <span style={{fontFamily:'Outfit,sans-serif',fontSize:11,fontWeight:700,color:'#059669',minWidth:54,background:'#f0fdf4',borderRadius:6,padding:'2px 6px',textAlign:'center'}}>
                                        Court {match.court}
                                    </span>
                                    <span style={{fontFamily:'Outfit,sans-serif',fontSize:13,flex:1,fontWeight:w1?700:400,color:w1?'#059669':'#374151',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                                        {w1 && '🏆 '}{match.team1.join(' & ')}
                                    </span>
                                    <div style={{display:'flex',alignItems:'center',gap:4,flexShrink:0}}>
                                        <input className="score-inp" type="number" min={0}
                                            value={sc.team1 !== undefined ? sc.team1 : ''}
                                            onChange={e=>canEdit && onScoreChange(match.id,'team1',e.target.value)}
                                            placeholder="0" disabled={!canEdit || finalized} />
                                        <span style={{fontFamily:'Outfit,sans-serif',fontSize:12,color:'#94a3b8',fontWeight:700}}>:</span>
                                        <input className="score-inp" type="number" min={0}
                                            value={sc.team2 !== undefined ? sc.team2 : ''}
                                            onChange={e=>canEdit && onScoreChange(match.id,'team2',e.target.value)}
                                            placeholder="0" disabled={!canEdit || finalized} />
                                    </div>
                                    <span style={{fontFamily:'Outfit,sans-serif',fontSize:13,flex:1,fontWeight:w2?700:400,color:w2?'#059669':'#374151',textAlign:'right',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                                        {match.team2.join(' & ')}{w2 && ' 🏆'}
                                    </span>
                                </div>
                            );
                        })}
                    </div>
                </div>
            ))}
        </div>
    );
}

function SimpleView({ onBack, onLogin }) {
    const [tab, setTab] = useState('create'); // create | find

    const [scores, setScores] = useState({});
    const [findId, setFindId] = useState('');
    const [found, setFound] = useState(null);
    const [findErr, setFindErr] = useState('');
    const [finding, setFinding] = useState(false);

    const handleGenerate = (data) => {
        setSetup(data);
        setScores({});
        setTab('create');
    };

    const updateScore = (matchId, team, val) => {
        setScores(prev => ({...prev, [matchId]: {...(prev[matchId]||{}), [team]: parseInt(val)||0 }}));
    };

    const doExport = () => {
        if (!setup) return;
        doPrint(setup.name, setup.schedule, scores, setup.players, false); // blank for guests
    };

    const findTournament = async () => {
        const id = findId.trim();
        if (!id) return;
        setFinding(true); setFindErr(''); setFound(null);
        const data = await storage.get(id);
        if (!data) { setFindErr('Tournament not found. Check the ID and try again.'); }
        else if (!data.isPublic) { setFindErr('This tournament is private. Only the owner can access it.'); }
        else {
            // Rebuild schedule from flat
            let schedule = data.schedule || [];
            if (data.scheduleFlat && !schedule.length) {
                const map = {};
                data.scheduleFlat.forEach(m => {
                    if (!map[m.roundIndex]) map[m.roundIndex] = [];
                    map[m.roundIndex].push({
                        id: m.id, court: m.court,
                        team1: typeof m.team1==='string' ? m.team1.split(', ').filter(Boolean) : [m.team1],
                        team2: typeof m.team2==='string' ? m.team2.split(', ').filter(Boolean) : [m.team2]
                    });
                });
                schedule = Object.keys(map).sort((a,b)=>a-b).map(k=>map[k]);
            }
            setFound({...data, schedule});
        }
        setFinding(false);
    };

    const Header = () => (
        <div style={{background:'#0f172a',padding:'12px 16px',display:'flex',alignItems:'center',gap:12,marginBottom:0}}>

                Login for Full Features
            </button>
        </div>
    );

    return (
        <div style={{minHeight:'100vh',background:'#f8fafc',display:'flex',flexDirection:'column'}}>
            <Header />

            {/* Guest notice */}
            <div style={{background:'#fffbeb',borderBottom:'1px solid #fcd34d',padding:'8px 16px',display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontSize:14}}>⚡</span>
                <span style={{fontFamily:'Outfit,sans-serif',fontSize:12,color:'#92400e'}}>
                    <strong>Guest Mode:</strong> Tournaments are not saved. Export your scorecard before leaving.
                </span>
            </div>

            {/* Tabs */}
            <div style={{background:'white',borderBottom:'1px solid #e2e8f0',padding:'0 16px',display:'flex',gap:0}}>
                {[['create','🎾 Create Tournament'],['find','🔍 Find by ID']].map(([k,l]) => (

                        background:'none',border:'none',borderBottom:`2px solid ${tab===k?'#059669':'transparent'}`,
                        padding:'12px 16px',fontFamily:'Outfit,sans-serif',fontSize:13,fontWeight:600,
                        color:tab===k?'#059669':'#64748b',cursor:'pointer',transition:'all .15s'
                    }}>{l}</button>
                ))}
            </div>

            <div style={{flex:1,padding:16,maxWidth:720,width:'100%',margin:'0 auto'}}>

                {tab === 'create' && (
                    <>
                        {!setup ? (
                            <div style={{background:'white',borderRadius:12,padding:20,boxShadow:'0 1px 8px rgba(0,0,0,0.06)'}}>
                                <TournamentSetup onGenerate={handleGenerate} />
                            </div>
                        ) : (
                            <div>
                                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
                                    <div>
                                        <div className="font-display" style={{fontSize:20,fontWeight:800,color:'#0f172a'}}>{setup.name}</div>
                                        <div style={{fontFamily:'Outfit,sans-serif',fontSize:12,color:'#64748b'}}>{setup.players.length} players · {setup.schedule.length} rounds</div>
                                    </div>
                                    <button className="btn-ghost" onClick={()=>{setSetup(null);setScores({});}} style={{fontSize:12,padding:'6px 12px'}}>New</button>
                                </div>
                                <ScheduleView
                                    schedule={setup.schedule}
                                    scores={scores}
                                    onScoreChange={updateScore}
                                    canEdit={true}
                                    tournamentName={setup.name}
                                    players={setup.players}
                                    isGuest={true}
                                    onExportPDF={doExport}
                                    finalized={false}
                                />
                            </div>
                        )}
                    </>
                )}

                {/* Find Tab */}
                {tab === 'find' && (
                    <div style={{background:'white',borderRadius:12,padding:20,boxShadow:'0 1px 8px rgba(0,0,0,0.06)'}}>
                        <div className="font-display" style={{fontSize:18,fontWeight:800,color:'#0f172a',marginBottom:4}}>FIND A TOURNAMENT</div>
                        <div style={{fontFamily:'Outfit,sans-serif',fontSize:13,color:'#64748b',marginBottom:16}}>
                            Enter a tournament ID shared by the organizer to view a public tournament.
                        </div>
                        <div style={{display:'flex',gap:8,marginBottom:16}}>
                            <input className="inp" value={findId} onChange={e=>setFindId(e.target.value)}
                                placeholder="e.g. tournament-1739746800"
                                onKeyDown={e=>e.key==='Enter'&&findTournament()}
                                style={{flex:1}} />
                            <button className="btn-primary" onClick={findTournament} disabled={finding} style={{whiteSpace:'nowrap'}}>
                                {finding ? 'Searching…' : 'Find →'}
                            </button>
                        </div>
                        {findErr && <div style={{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:8,padding:'10px 12px',fontSize:13,color:'#dc2626',fontFamily:'Outfit,sans-serif',marginBottom:12}}>{findErr}</div>}
                        {found && (
                            <div>
                                <div style={{background:'#f0fdf4',border:'1px solid #a7f3d0',borderRadius:10,padding:'12px 14px',marginBottom:14}}>
                                    <div className="font-display" style={{fontSize:17,fontWeight:800,color:'#0f172a'}}>{found.name}</div>
                                    <div style={{fontFamily:'Outfit,sans-serif',fontSize:12,color:'#64748b',marginTop:2}}>
                                        🌍 Public · {found.players?.length||0} players · {found.schedule?.length||0} rounds
                                        {found.scoresFinalized && ' · 🔒 Finalized'}
                                    </div>
                                </div>
                                <ScheduleView
                                    schedule={found.schedule||[]}
                                    scores={found.scores||{}}
                                    onScoreChange={()=>{}}
                                    canEdit={false}
                                    tournamentName={found.name}
                                    players={found.players||[]}
                                    isGuest={true}
                                    onExportPDF={()=>doPrint(found.name,found.schedule||[],found.scores||{},found.players||[],true)}
                                    finalized={true}
                                />
                            </div>
                        )}
                    </div>
                )}
            </div>
        </div>
    );
}

// ── Full App (Authenticated) ──────────────────────────────────────────
function FullApp({ user, onLogout, onBack }) {
    const [view, setView] = useState('dashboard'); // dashboard | create | tournament
    const [setup, setSetup] = useState(null);
    const [scores, setScores] = useState({});
    const [tournamentId, setTournamentId] = useState(null);
    const [createdBy, setCreatedBy] = useState(null);
    const [isPublic, setIsPublic] = useState(false);
    const [finalized, setFinalized] = useState(false);
    const [saveStatus, setSaveStatus] = useState('');
    const [myTournaments, setMyTournaments] = useState([]);
    const [loadId, setLoadId] = useState('');
    const isSaving = useRef(false);
    const isRemote = useRef(false);
    const didInit = useRef(false);

    useEffect(() => { loadAll(); }, [user]);

    const loadAll = async () => {
        if (!user) return;
        try {
            const list = await storage.getAll(user.uid);
            setMyTournaments(list.sort((a,b)=>b.createdAt-a.createdAt));
        } catch(e) {}
    };

    // Auto-save on score change
    useEffect(() => {
        if (!tournamentId || Object.keys(scores).length===0) return;
        if (isRemote.current) { isRemote.current=false; return; }
        const t = setTimeout(save, 1500);
        return () => clearTimeout(t);
    }, [scores]);

    // Auto-save on isPublic/name change (skip initial)
    useEffect(() => {
        if (!tournamentId || !didInit.current) return;
        const t = setTimeout(save, 600);
        return () => clearTimeout(t);
    }, [isPublic]);

    // Real-time listener
    useEffect(() => {
        if (!tournamentId) return;
        const unsub = storage.listen(tournamentId, data => {
            if (data?.scores) { isRemote.current=true; setScores(data.scores); }
        });
        return () => { if (typeof unsub==='function') unsub(); };
    }, [tournamentId]);

    const save = async (finalizedVal=null) => {
        if (!tournamentId || !setup) return;
        if (isSaving.current) return;
        isSaving.current = true;
        const uid = user?.uid || 'guest';

        const flat = [];
        (setup.schedule||[]).forEach((round,ri) => round.forEach((match,mi) => {
            flat.push({ roundIndex:ri, matchIndex:mi, id:match.id, court:match.court,
                team1: Array.isArray(match.team1)?match.team1.join(', '):match.team1,
                team2: Array.isArray(match.team2)?match.team2.join(', '):match.team2 });
        }));

        const data = {
            id: tournamentId,
            name: setup.name,
            players: setup.players,
            courts: setup.courts,
            numRounds: setup.rounds,
            matchFormat: setup.format,
            scheduleFlat: flat,
            scores,
            scoresFinalized: finalizedVal!==null ? finalizedVal : finalized,
            isPublic,
            participants: [uid, ...setup.players.map(p=>`player-${p}`)],
            createdBy: createdBy || uid,
            createdAt: Date.now()
        };
        try {
            setSaveStatus('Saving…');
            await storage.save(data);
            setSaveStatus('✓ Saved');
            setTimeout(()=>setSaveStatus(''),2000);
        } catch(e) {
            setSaveStatus('✗ Save failed');
        }
        isSaving.current = false;
    };

    const handleGenerate = (data) => {
        const tid = `tournament-${Date.now()}`;
        const uid = user?.uid || 'guest';
        setSetup(data);
        setScores({});
        setTournamentId(tid);
        setCreatedBy(uid);
        setIsPublic(false);
        setFinalized(false);
        didInit.current = false;
        setView('tournament');
        setTimeout(()=>{ didInit.current=true; }, 400);
        setTimeout(save, 500);
    };

    const loadTournament = async (id) => {
        const data = await storage.get(id.trim());
        if (!data) { alert('Tournament not found'); return; }
        const map = {};
        (data.scheduleFlat||[]).forEach(m => {
            if (!map[m.roundIndex]) map[m.roundIndex]=[];
            map[m.roundIndex].push({ id:m.id, court:m.court,
                team1: typeof m.team1==='string'?m.team1.split(', ').filter(Boolean):[m.team1],
                team2: typeof m.team2==='string'?m.team2.split(', ').filter(Boolean):[m.team2] });
        });
        const schedule = Object.keys(map).sort((a,b)=>a-b).map(k=>map[k]);
        setSetup({ name:data.name, players:data.players||[], schedule, courts:data.courts, rounds:data.numRounds, format:data.matchFormat, mode:'rotating' });
        setScores(data.scores||{});
        setTournamentId(data.id);
        setCreatedBy(data.createdBy||null);
        setIsPublic(data.isPublic||false);
        setFinalized(data.scoresFinalized||false);
        didInit.current = false;
        setView('tournament');
        setTimeout(()=>{ didInit.current=true; }, 500);
    };

    const isOwner = tournamentId && (createdBy === user?.uid);

    const share = () => {
        if (!tournamentId) return;
        const modal = document.createElement('div');
        modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;';
        modal.innerHTML=`<div style="background:white;border-radius:16px;padding:28px;max-width:440px;width:100%;font-family:Outfit,sans-serif;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <div style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;color:#0f172a;">📤 Share Tournament</div>
                <button onclick="this.closest('[style]').remove()" style="background:none;border:none;font-size:22px;cursor:pointer;color:#94a3b8;">×</button>
            </div>
            <div style="background:#f1f5f9;border-radius:10px;padding:12px;margin-bottom:12px;">
                <div style="font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">Tournament ID</div>
                <div style="display:flex;gap:8px;">
                    <input id="_tid" value="${tournamentId}" readonly style="flex:1;background:white;border:2px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:13px;font-family:monospace;outline:none;" onclick="this.select()"/>
                    <button onclick="navigator.clipboard.writeText('${tournamentId}').then(()=>{this.textContent='✓';setTimeout(()=>this.textContent='Copy',1000)})" style="background:#059669;color:white;border:none;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer;font-family:Outfit,sans-serif;">Copy</button>
                </div>
            </div>
            <div style="background:#eff6ff;border-left:3px solid #3b82f6;border-radius:6px;padding:10px 12px;font-size:12px;color:#1e40af;">
                Share this ID. Others can paste it in Quick Play → Find by ID to view your tournament.
            </div>
        </div>`;
        modal.onclick=e=>{if(e.target===modal)modal.remove();};
        document.body.appendChild(modal);
    };

    const doFinalize = () => {
        if (finalized) { alert('Already finalized'); return; }
        if (confirm('Finalize scores? This will make them read-only.')) {
            setFinalized(true);
            setTimeout(()=>save(true),100);
        }
    };

    const deleteTournament = async (id) => {
        if (!confirm('Delete this tournament?')) return;
        storage.del(id);
        loadAll();
        if (tournamentId===id) { setView('dashboard'); setSetup(null); setTournamentId(null); }
    };

    // ── Navbar ──
    const Nav = () => (
        <div style={{background:'#0f172a',padding:'12px 16px',display:'flex',alignItems:'center',gap:12}}>
            <button onClick={()=>setView('dashboard')} style={{background:'none',border:'none',color:'#94a3b8',cursor:'pointer',fontSize:18,padding:'2px 6px'}}>←</button>
            <div className="font-display" style={{fontSize:20,fontWeight:800,color:'white',flex:1}}>
                PICKLE<span style={{color:'#34d399'}}>CONNECT</span>
            </div>
            <span style={{fontFamily:'Outfit,sans-serif',fontSize:13,color:'#6ee7b7',marginRight:4}}>{user?.name||user?.email}</span>
            <button onClick={onLogout} style={{background:'rgba(255,255,255,.1)',color:'white',border:'none',borderRadius:8,padding:'6px 14px',fontFamily:'Outfit,sans-serif',fontSize:12,cursor:'pointer'}}>
                Logout
            </button>
        </div>
    );

    // ── Dashboard ──
    if (view === 'dashboard') return (
        <div style={{minHeight:'100vh',background:'#f8fafc',display:'flex',flexDirection:'column'}}>
            <Nav />
            <div style={{padding:16,maxWidth:720,width:'100%',margin:'0 auto'}}>
                {/* Welcome + actions */}
                <div style={{background:'linear-gradient(135deg,#0f172a,#1e3a2f)',borderRadius:14,padding:'20px 22px',marginBottom:16,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <div>
                        <div className="font-display" style={{fontSize:24,fontWeight:800,color:'white'}}>DASHBOARD</div>
                        <div style={{fontFamily:'Outfit,sans-serif',fontSize:13,color:'#6ee7b7',marginTop:2}}>Welcome back, {user?.name||'Player'}!</div>
                    </div>
                    <button className="btn-primary" onClick={()=>setView('create')} style={{padding:'10px 18px'}}>+ New Tournament</button>
                </div>

                {/* Load by ID */}
                <div style={{background:'white',borderRadius:12,padding:16,marginBottom:16,boxShadow:'0 1px 6px rgba(0,0,0,.05)'}}>
                    <div style={{fontFamily:'Outfit,sans-serif',fontSize:13,fontWeight:700,color:'#374151',marginBottom:8}}>📋 Load Tournament by ID</div>
                    <div style={{display:'flex',gap:8}}>
                        <input className="inp" value={loadId} onChange={e=>setLoadId(e.target.value)} placeholder="Paste tournament ID…" onKeyDown={e=>e.key==='Enter'&&loadTournament(loadId)} style={{flex:1}} />
                        <button className="btn-primary" onClick={()=>loadTournament(loadId)}>Load</button>
                    </div>
                </div>

                {/* My tournaments */}
                <div style={{background:'white',borderRadius:12,padding:16,boxShadow:'0 1px 6px rgba(0,0,0,.05)'}}>
                    <div className="font-display" style={{fontSize:18,fontWeight:800,color:'#0f172a',marginBottom:12}}>MY TOURNAMENTS</div>
                    {myTournaments.length === 0 ? (
                        <div style={{textAlign:'center',padding:'32px 0',color:'#94a3b8',fontFamily:'Outfit,sans-serif',fontSize:14}}>
                            No tournaments yet. Create your first one!
                        </div>
                    ) : (
                        <div style={{display:'flex',flexDirection:'column',gap:8}}>
                            {myTournaments.map(t => (
                                <div key={t.id} style={{border:'1px solid #e2e8f0',borderRadius:10,padding:'12px 14px',display:'flex',alignItems:'center',gap:10}}>
                                    <div style={{flex:1,minWidth:0}}>
                                        <div style={{fontFamily:'Outfit,sans-serif',fontWeight:600,fontSize:14,color:'#0f172a',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.name}</div>
                                        <div style={{fontFamily:'Outfit,sans-serif',fontSize:12,color:'#94a3b8',marginTop:2}}>
                                            {t.isPublic?'🌍 Public':'🔒 Private'} · {t.players?.length||0} players · {t.scoresFinalized?'🔒 Finalized':'In progress'}
                                        </div>
                                    </div>
                                    <button onClick={()=>loadTournament(t.id)} style={{background:'#f1f5f9',border:'none',borderRadius:8,padding:'7px 14px',fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:600,color:'#374151',cursor:'pointer'}}>Open</button>
                                    {t.createdBy===user?.uid && (
                                        <button className="btn-red" onClick={()=>deleteTournament(t.id)}>Delete</button>
                                    )}
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            </div>
        </div>
    );

    // ── Create ──
    if (view === 'create') return (
        <div style={{minHeight:'100vh',background:'#f8fafc',display:'flex',flexDirection:'column'}}>
            <Nav />
            <div style={{padding:16,maxWidth:720,width:'100%',margin:'0 auto'}}>
                <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}>
                    <button onClick={()=>setView('dashboard')} style={{background:'none',border:'none',color:'#64748b',cursor:'pointer',fontFamily:'Outfit,sans-serif',fontSize:14}}>← Dashboard</button>
                </div>
                <div style={{background:'white',borderRadius:12,padding:20,boxShadow:'0 1px 8px rgba(0,0,0,.06)'}}>
                    <div className="font-display" style={{fontSize:22,fontWeight:800,color:'#0f172a',marginBottom:16}}>NEW TOURNAMENT</div>
                    <TournamentSetup onGenerate={handleGenerate} />
                </div>
            </div>
        </div>
    );

    // ── Tournament view ──
    if (view === 'tournament' && setup) return (
        <div style={{minHeight:'100vh',background:'#f8fafc',display:'flex',flexDirection:'column'}}>
            <Nav />
            <div style={{padding:16,maxWidth:720,width:'100%',margin:'0 auto'}}>
                {/* Tournament header */}
                <div style={{background:'white',borderRadius:12,padding:'14px 16px',marginBottom:12,boxShadow:'0 1px 6px rgba(0,0,0,.05)'}}>
                    <div style={{display:'flex',flexWrap:'wrap',alignItems:'center',gap:8}}>
                        <div style={{flex:1,minWidth:0}}>
                            <div className="font-display" style={{fontSize:20,fontWeight:800,color:'#0f172a',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{setup.name}</div>
                            <div style={{fontFamily:'Outfit,sans-serif',fontSize:12,color:'#64748b',marginTop:1}}>
                                {setup.players.length} players · {setup.schedule.length} rounds · {isPublic?'🌍 Public':'🔒 Private'}
                                {finalized && ' · 🔒 Finalized'}
                            </div>
                        </div>

                        {/* Action buttons */}
                        <div style={{display:'flex',flexWrap:'wrap',gap:6,alignItems:'center'}}>
                            {saveStatus && <span style={{fontFamily:'Outfit,sans-serif',fontSize:12,color:saveStatus.includes('✓')?'#059669':saveStatus.includes('✗')?'#dc2626':'#64748b'}}>{saveStatus}</span>}

                            {isOwner && !finalized && (
                                <div style={{display:'flex',gap:0,border:'1px solid #e2e8f0',borderRadius:8,overflow:'hidden'}}>
                                    <button onClick={()=>setIsPublic(false)} style={{padding:'6px 12px',background:!isPublic?'#0f172a':'white',color:!isPublic?'white':'#94a3b8',border:'none',fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:600,cursor:'pointer'}}>🔒 Private</button>
                                    <button onClick={()=>setIsPublic(true)} style={{padding:'6px 12px',background:isPublic?'#059669':'white',color:isPublic?'white':'#94a3b8',border:'none',fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:600,cursor:'pointer'}}>🌍 Public</button>
                                </div>
                            )}

                            {tournamentId && (
                                <button onClick={share} style={{background:'#3b82f6',color:'white',border:'none',borderRadius:8,padding:'7px 12px',fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:600,cursor:'pointer'}}>📤 Share</button>
                            )}

                            {isOwner && (
                                <button onClick={doFinalize} disabled={finalized} style={{background:finalized?'#f1f5f9':'#7c3aed',color:finalized?'#94a3b8':'white',border:'none',borderRadius:8,padding:'7px 12px',fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:600,cursor:finalized?'not-allowed':'pointer'}}>
                                    {finalized?'🔒 Finalized':'✓ Finalize'}
                                </button>
                            )}

                            <button onClick={()=>setView('dashboard')} style={{background:'#f1f5f9',border:'none',borderRadius:8,padding:'7px 12px',fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:600,color:'#64748b',cursor:'pointer'}}>← Back</button>
                        </div>
                    </div>
                </div>

                <ScheduleView
                    schedule={setup.schedule}
                    scores={scores}
                    onScoreChange={(id,team,val)=>setScores(prev=>({...prev,[id]:{...(prev[id]||{}),[team]:parseInt(val)||0}}))}
                    canEdit={isOwner}
                    tournamentName={setup.name}
                    players={setup.players}
                    isGuest={false}
                    onExportPDF={()=>doPrint(setup.name,setup.schedule,scores,setup.players,true)}
                    finalized={finalized}
                />
            </div>
        </div>
    );

    return null;
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
