                                                </div>
                                                <div className="space-y-3">
                                                    {round.map((match) => {
                                                        const matchScore = scores[match.id];
                                                        const hasScore = matchScore && matchScore.team1 !== undefined && matchScore.team2 !== undefined;
                                                        const winner = hasScore ? (matchScore.team1 > matchScore.team2 ? match.team1.join(', ') : matchScore.team2 > matchScore.team1 ? match.team2.join(', ') : null) : null;
                                                        
                                                        return (
                                                            <div key={match.id} className="bg-white rounded-lg p-3 md:p-4">
                                                                <div className="flex flex-col md:flex-row md:items-center md:justify-between mb-3 gap-2">
                                                                    <span className="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs md:text-sm font-medium w-fit">
                                                                        Court {match.court}
                                                                    </span>
                                                                    {winner && (
                                                                        <span className="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs md:text-sm font-medium w-fit truncate">
                                                                            ✓ Winner: {winner}
                                                                        </span>
                                                                    )}
                                                                </div>
                                                                
                                                                {/* Mobile Layout */}
                                                                <div className="md:hidden space-y-3">
                                                                    <div className="flex items-center justify-between">
                                                                        <span className={`font-medium text-sm flex-1 truncate ${winner === match.team1.join(', ') ? 'text-green-600 font-bold' : ''}`}>
                                                                            {winner === match.team1.join(', ') && '🏆 '}
                                                                            {match.team1.join(', ')}
                                                                        </span>
                                                                        <input 
                                                                            type="number"
                                                                            min="0"
                                                                            value={scores[match.id]?.team1 || ''}
                                                                            onChange={(e) => updateScore(match.id, 'team1', e.target.value)}
                                                                            placeholder="0"
                                                                            disabled={scoresFinalized}
                                                                            className={`w-14 px-2 py-2 border-2 rounded-lg text-center font-bold focus:outline-none ml-2 ${
                                                                                scoresFinalized 
                                                                                    ? 'bg-gray-100 border-gray-300 cursor-not-allowed' 
                                                                                    : 'border-gray-300 focus:border-green-500'
                                                                            }`}
                                                                        />
                                                                    </div>
                                                                    <div className="text-center text-gray-400 text-xs">VS</div>
                                                                    <div className="flex items-center justify-between">
                                                                        <span className={`font-medium text-sm flex-1 truncate ${winner === match.team2.join(', ') ? 'text-green-600 font-bold' : ''}`}>
                                                                            {winner === match.team2.join(', ') && '🏆 '}
                                                                            {match.team2.join(', ')}
                                                                        </span>
                                                                        <input 
                                                                            type="number"
                                                                            min="0"
                                                                            value={scores[match.id]?.team2 || ''}
                                                                            onChange={(e) => updateScore(match.id, 'team2', e.target.value)}
                                                                            placeholder="0"
                                                                            disabled={scoresFinalized}
                                                                            className={`w-14 px-2 py-2 border-2 rounded-lg text-center font-bold focus:outline-none ml-2 ${
                                                                                scoresFinalized 
                                                                                    ? 'bg-gray-100 border-gray-300 cursor-not-allowed' 
                                                                                    : 'border-gray-300 focus:border-green-500'
                                                                            }`}
                                                                        />
                                                                    </div>
                                                                </div>
                                                                
                                                                {/* Desktop Layout */}
                                                                <div className="hidden md:grid md:grid-cols-3 gap-4 items-center">
                                                                    <div className="text-right">
                                                                        <span className={`font-medium text-lg ${winner === match.team1.join(', ') ? 'text-green-600 font-bold' : ''}`}>
                                                                            {match.team1.join(', ')}
                                                                            {winner === match.team1.join(', ') && ' 🏆'}
                                                                        </span>
                                                                    </div>
                                                                    <div className="flex items-center justify-center space-x-3">
                                                                        <input 
                                                                            type="number"
                                                                            min="0"
                                                                            value={scores[match.id]?.team1 || ''}
                                                                            onChange={(e) => updateScore(match.id, 'team1', e.target.value)}
                                                                            placeholder="0"
                                                                            disabled={scoresFinalized}
                                                                            className={`w-16 px-3 py-2 border-2 rounded-lg text-center font-bold text-lg focus:outline-none ${
                                                                                scoresFinalized 
                                                                                    ? 'bg-gray-100 border-gray-300 cursor-not-allowed' 
                                                                                    : 'border-gray-300 focus:border-green-500'
                                                                            }`}
                                                                        />
                                                                        <span className="text-gray-400 font-bold">-</span>
                                                                        <input 
                                                                            type="number"
                                                                            min="0"
                                                                            value={scores[match.id]?.team2 || ''}
                                                                            onChange={(e) => updateScore(match.id, 'team2', e.target.value)}
                                                                            placeholder="0"
                                                                            disabled={scoresFinalized}
                                                                            className={`w-16 px-3 py-2 border-2 rounded-lg text-center font-bold text-lg focus:outline-none ${
                                                                                scoresFinalized 
                                                                                    ? 'bg-gray-100 border-gray-300 cursor-not-allowed' 
                                                                                    : 'border-gray-300 focus:border-green-500'
                                                                            }`}
                                                                        />
                                                                    </div>
                                                                    <div className="text-left">
                                                                        <span className={`font-medium text-lg ${winner === match.team2.join(', ') ? 'text-green-600 font-bold' : ''}`}>
                                                                            {winner === match.team2.join(', ') && '🏆 '}
                                                                            {match.team2.join(', ')}
                                                                        </span>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
