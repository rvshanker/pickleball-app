*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#0D1B2A;color:#F0F4F8;font-family:'DM Sans',-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;padding:56px 20px 28px}

.ic svg{width:30px;height:30px;stroke:#2ECC71}

.card p{color:#7A9BB5;font-size:14.5px;margin-top:3px;line-height:1.35}
.go{margin-left:auto;color:#7A9BB5;font-size:24px}
