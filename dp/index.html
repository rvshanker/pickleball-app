    <!-- Dynamically generate Apple Touch Icon + Web Manifest using canvas -->
    <script>
    (function() {
      var c = document.createElement('canvas');
      c.width = c.height = 192;
      var ctx = c.getContext('2d');
      // Background rounded square
      var r = 38;
      ctx.beginPath();
      ctx.moveTo(r, 0); ctx.lineTo(192-r, 0);
      ctx.quadraticCurveTo(192, 0, 192, r);
      ctx.lineTo(192, 192-r);
      ctx.quadraticCurveTo(192, 192, 192-r, 192);
      ctx.lineTo(r, 192);
      ctx.quadraticCurveTo(0, 192, 0, 192-r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      var grad = ctx.createLinearGradient(0,0,192,192);
      grad.addColorStop(0, '#059669');
      grad.addColorStop(1, '#065f46');
      ctx.fillStyle = grad;
      ctx.fill();
      // Pickleball court lines (white)
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 5;
      ctx.lineJoin = 'round';
      // Outer court rectangle
      ctx.strokeRect(30, 40, 132, 112);
      // Net (center line)
      ctx.beginPath(); ctx.moveTo(30, 96); ctx.lineTo(162, 96); ctx.stroke();
      // Kitchen lines (non-volley zone)
      ctx.beginPath(); ctx.moveTo(30, 65); ctx.lineTo(162, 65); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(30, 127); ctx.lineTo(162, 127); ctx.stroke();
      // Center line
      ctx.beginPath(); ctx.moveTo(96, 40); ctx.lineTo(96, 65); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(96, 127); ctx.lineTo(96, 152); ctx.stroke();
      // Ball (circle)
      ctx.beginPath();
      ctx.arc(96, 96, 14, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fill();
      ctx.strokeStyle = 'white';
      ctx.lineWidth = 3;
      ctx.stroke();
      var dataUrl = c.toDataURL('image/png');
      // Apple touch icon
      var link = document.createElement('link');
      link.rel = 'apple-touch-icon';
      link.href = dataUrl;
      document.head.appendChild(link);
      // Web manifest (Android)
      var manifest = {
        name: 'PickleCourt Connect',
        short_name: 'PickleCourt',
        start_url: window.location.href,
        display: 'standalone',
        background_color: '#0f172a',
        theme_color: '#059669',
        icons: [{ src: dataUrl, sizes: '192x192', type: 'image/png', purpose: 'any maskable' }]
      };
      var blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
      var mlink = document.createElement('link');
      mlink.rel = 'manifest';
      mlink.href = URL.createObjectURL(blob);
      document.head.appendChild(mlink);
    })();
    </script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── Firebase ──────────────────────────────────────────────────────────
const FB = {
    apiKey: "AIzaSyDaFUszTD0-Ro292GOBSlS5vkZSdJM0NF4",
    authDomain: "pickleball-app-1bba7.firebaseapp.com",
    projectId: "pickleball-app-1bba7",
    storageBucket: "pickleball-app-1bba7.firebasestorage.app",
    messagingSenderId: "645604154338",
    appId: "1:645604154338:web:b92f87c2cd11d950b737bb"
};
const COURT = { id: 'dardenne-prairie', name: 'Dardenne Prairie Athletic Complex', location: '2080 Hanley Rd, O\'Fallon, MO', lat: 38.7542, lon: -90.7089 };

let db = null, fbOk = false;
try {
    if (!firebase.apps.length) firebase.initializeApp(FB);
    db = firebase.firestore();
    fbOk = true;
} catch(e) { console.error('Firebase:', e); }

// ── Helpers ───────────────────────────────────────────────────────────
const wIcon = (temp, wind) => wind > 20 ? '🌬️' : temp < 32 ? '🥶' : temp < 50 ? '🧥' : temp > 88 ? '☀️' : '⛅';

const RATINGS = [
    { key: 'under3', label: '<3.0',    cls: 'rating-u3'    },
    { key: '3to35',  label: '3.0–3.5', cls: 'rating-3'     },
    { key: '35to4',  label: '3.5–4.0', cls: 'rating-35'    },
    { key: 'over4',  label: '4.0+',    cls: 'rating-4'     },
    { key: '5plus',  label: '5.0+',    cls: 'rating-5plus' },
];
const ratingInfo = key => RATINGS.find(r => r.key === key);

// Funny messages for 5.0+ players
const FUNNY_5PLUS = [
    "Woah there, Federer! 🎾 Maybe try the ATP tour instead?",
    "5.0+?! The courts are shaking in fear 😱 You sure you're at the right place?",
    "Legend detected 🏆 Our courts are calling their lawyer.",
    "Okay hotshot 😤 Don't come crying when everyone refuses to play you!",
    "5.0+ entered the chat... everyone else has left the chat 😂",
    "Are you sure you're not a pro? Our nets just filed a restraining order 🚨",
];

const FUNNY_COMMENTS = [
    "Ready to dink you into oblivion 😈",
    "Here to body-bag anyone who lobs 🎯",
    "Warning: I WILL poach your shot 🕵️",
    "Brace yourselves, the spin king has arrived 👑",
    "Just here for the vibes… and to destroy you 🫶",
    "Came to play. Staying to dominate. 😤",
    "I've been watching YouTube tutorials all week — fear me 📹",
    "Don't let the smile fool you. I'm ruthless 😊⚡",
    "Here to take names and win games 📋🏆",
    "My therapist said this was better than revenge 🧘",
];
const randFunnyComment = () => FUNNY_COMMENTS[Math.floor(Math.random() * FUNNY_COMMENTS.length)];

const DURATION_OPTIONS = [
    { label: '1 hr',    value: 60,  funny: null },
    { label: '2 hr',    value: 120, funny: null },
    { label: '3 hr',    value: 180, funny: null },
    { label: '4 hr',    value: 240, funny: '💧 4 hours?! Stay hydrated — bring a cooler, not just a bottle!' },
    { label: 'All Day', value: 480, funny: '🌮 All day?! Order food, tell your family you love them, and say goodbye to your legs!' },
];

function buildTimeOptions() {
    const opts = [];
    const now = new Date();

    // Today: next full hour up to midnight
    const todayStart = new Date(now);
    todayStart.setMinutes(0, 0, 0);
    todayStart.setHours(todayStart.getHours() + 1);
    const todayEnd = new Date(now); todayEnd.setHours(23, 0, 0, 0);
    const cur = new Date(todayStart);
    while (cur <= todayEnd) {
        opts.push({ label: cur.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }), value: cur.getTime() });
        cur.setHours(cur.getHours() + 1);
    }

    // Tomorrow: 6 AM to 10 PM
    const tomorrow = new Date(now);
    tomorrow.setDate(tomorrow.getDate() + 1);
    tomorrow.setHours(6, 0, 0, 0);
    const tomorrowEnd = new Date(tomorrow); tomorrowEnd.setHours(22, 0, 0, 0);
    const tmr = new Date(tomorrow);
    while (tmr <= tomorrowEnd) {
        opts.push({
            label: 'Tomorrow ' + tmr.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }),
            value: tmr.getTime()
        });
        tmr.setHours(tmr.getHours() + 1);
    }

    return opts;
}

function groupByHour(players) {
    const groups = {};
    players.forEach(c => {
        const ts = c.arrivalTime || c.timestamp;
        const d = new Date(ts); d.setMinutes(0,0,0);
        const key = d.getTime();
        if (!groups[key]) groups[key] = { ts: key, players: [] };
        groups[key].players.push(c);
    });
    return Object.values(groups).sort((a,b) => a.ts - b.ts);
}

function headcount(players) {
    return players.reduce((sum, p) => sum + 1 + (p.guests || 0), 0);
}

// ── Countdown timer display for a playing player ──────────────────────
function PlayTimer({ checkInTime, durationMins }) {
    const [remaining, setRemaining] = useState(0);
    useEffect(() => {
        const calc = () => {
            const end = checkInTime + durationMins * 60000;
            setRemaining(Math.max(0, end - Date.now()));
        };
        calc();
        const t = setInterval(calc, 10000);
        return () => clearInterval(t);
    }, [checkInTime, durationMins]);
    if (remaining <= 0) return <span style={{fontSize:11,color:'#ef4444',fontWeight:700}}>⏰ Time's up!</span>;
    const mins = Math.ceil(remaining / 60000);
    const hrs = Math.floor(mins / 60);
    const m = mins % 60;
    const pct = Math.max(0, (remaining / (durationMins * 60000)) * 100);
    return (
        <div style={{minWidth:80}}>
            <span style={{fontSize:11,color:'#059669',fontWeight:700}}>
                ⏱ {hrs > 0 ? `${hrs}h ` : ''}{m}m left
            </span>
            <div className="timer-track">
                <div className="timer-fill" style={{width:`${pct}%`}}/>
            </div>
        </div>
    );
}

// ── PlayerRow ─────────────────────────────────────────────────────────
function PlayerRow({ p, isNow }) {
    const ri = ratingInfo(p.rating);
    const nowMs = Date.now();
    // Treat as "now" if status is 'now' OR if 'later' but arrival time has passed
    const effectivelyNow = isNow || p.status === 'now' || (p.status === 'later' && p.arrivalTime && nowMs >= p.arrivalTime);
    const arrLabel = p.status === 'later' && p.arrivalTime && !effectivelyNow
        ? new Date(p.arrivalTime).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}) : null;
    const guests = p.guests || 0;
    return (
        <div className="player-item">
            <div className="player-avatar">{(p.userName||'?')[0].toUpperCase()}</div>
            <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:700,fontSize:14,color:'#0f172a',display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                    {p.userName}
                    {guests > 0 && <span style={{fontSize:11,fontWeight:700,color:'#7c3aed',background:'#ede9fe',borderRadius:10,padding:'1px 6px'}}>+{guests} guest{guests>1?'s':''}</span>}
                    {ri && <span className={`rating-badge ${ri.cls}`}>{ri.label}</span>}
                </div>
                <div style={{fontSize:12,color:'#64748b',display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                    <span>{effectivelyNow ? '🎾 Playing' : arrLabel ? `⏰ Arriving ${arrLabel}` : '👀 Watching'}</span>
                    {effectivelyNow && p.duration && (
                        <PlayTimer checkInTime={p.timestamp} durationMins={p.duration}/>
                    )}
                </div>
                {p.comment && (
                    <div style={{fontSize:12,color:'#059669',fontStyle:'italic',marginTop:3,background:'#f0fdf4',borderRadius:7,padding:'3px 8px',display:'inline-block',maxWidth:'100%',wordBreak:'break-word'}}>
                        💬 {p.comment}
                    </div>
                )}
            </div>
            <div style={{fontSize:10,color:'#cbd5e1',flexShrink:0}}>
                {new Date(p.timestamp).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
            </div>
        </div>
    );
}

// ── Main App ──────────────────────────────────────────────────────────
function CourtStatus() {
    const [courtData,    setCourtData]    = useState(null);
    const [checkIns,     setCheckIns]     = useState([]);
    const [userName,     setUserName]     = useState('');
    const [userRating,   setUserRating]   = useState('');
    const [showForm,     setShowForm]     = useState(false);
    const [step,         setStep]         = useState('form'); // kept for compat but unused now
    const [arrivalTime,  setArrivalTime]  = useState('');
    const [showLaterTime,setShowLaterTime]= useState(false);
    const [duration,     setDuration]     = useState(120);   // default 2 hours
    const [weather,      setWeather]      = useState(null);
    const [forecast,     setForecast]     = useState([]);
    const [wxUpdated,    setWxUpdated]    = useState(null);
    const [tab,          setTab]          = useState('now');
    const [showTotalEdit,setShowTotalEdit]= useState(false);
    const [newTotal,     setNewTotal]     = useState('');
    const [guestCount,   setGuestCount]   = useState(0);
    const [funnyMsg,     setFunnyMsg]     = useState('');
    const [durationFunny,setDurationFunny]= useState('');
    const [guestFunny,   setGuestFunny]   = useState('');
    const [comment,      setComment]      = useState('');
    const [commentFocused, setCommentFocused] = useState(false);
    const [flashMsg,     setFlashMsg]     = useState('');
    const [flashInput,   setFlashInput]   = useState('');

    // Ticker: re-render every minute so auto-promote updates the UI without user interaction
    const [tick, setTick] = useState(0);
    useEffect(() => {
        const t = setInterval(() => setTick(n => n + 1), 60000);
        return () => clearInterval(t);
    }, []);

    // Device identity (no login needed)
    const [deviceId] = useState(() => {
        let id = localStorage.getItem('pickleDeviceId');
        if (!id) { id = 'dev_' + Math.random().toString(36).slice(2,11); localStorage.setItem('pickleDeviceId', id); }
        return id;
    });

    useEffect(() => {
        const n = localStorage.getItem('pickleCourtUserName');
        const r = localStorage.getItem('pickleCourtRating');
        if (n) setUserName(n);
        if (r) setUserRating(r);
    }, []);

    // Handle 5.0+ funny message
    const handleRatingChange = (val) => {
        setUserRating(val);
        if (val === '5plus') {
            const msg = FUNNY_5PLUS[Math.floor(Math.random() * FUNNY_5PLUS.length)];
            setFunnyMsg(msg);
        } else {
            setFunnyMsg('');
        }
    };

    const handleDurationChange = (val) => {
        setDuration(val);
        const opt = DURATION_OPTIONS.find(d => d.value === val);
        setDurationFunny(opt?.funny || '');
    };

    const handleGuestChange = (delta) => {
        const next = Math.max(0, Math.min(20, guestCount + delta));
        setGuestCount(next);
        if (next > 4) {
            const msgs = [
                `${next} guests?! Having a party? 🎉 Better bring extra balls!`,
                `Wow, ${next} guests! The courts are nervous 😅 Pack extra pickleballs!`,
                `${next} people?! This is a TAKEOVER 🏟️ Reserve the whole park!`,
                `Party of ${next+1}! 🥳 Someone better bring snacks for the whole crew!`,
            ];
            setGuestFunny(msgs[Math.floor(Math.random() * msgs.length)]);
        } else {
            setGuestFunny('');
        }
    };

    // Court status listener
    useEffect(() => {
        if (!fbOk || !db) return;
        return db.collection('court-status').doc(COURT.id).onSnapshot(doc => {
            if (doc.exists) {
                const data = doc.data();
                setCourtData(data);
                // Load flash message — clear if older than 4 hours
                if (data.flashMsg && data.flashMsgTime) {
                    const age = Date.now() - data.flashMsgTime;
                    if (age < 4 * 3600000) {
                        setFlashMsg(data.flashMsg);
                    } else {
                        setFlashMsg('');
                    }
                } else {
                    setFlashMsg('');
                }
            }
            else db.collection('court-status').doc(COURT.id).set({
                courtId: COURT.id, crowdLevel: 'low', lightsOn: false, openCourts: 4, totalCourts: 4,
                lastUpdate: firebase.firestore.FieldValue.serverTimestamp()
            });
        });
    }, []);

    const saveFlashMsg = async () => {
        if (!fbOk || !db) return;
        const msg = flashInput.trim();
        await db.collection('court-status').doc(COURT.id).update({
            flashMsg: msg,
            flashMsgTime: msg ? Date.now() : null,
            lastUpdate: firebase.firestore.FieldValue.serverTimestamp()
        });
        setFlashInput('');
    };

    const clearFlashMsg = async () => {
        if (!fbOk || !db) return;
        await db.collection('court-status').doc(COURT.id).update({
            flashMsg: '',
            flashMsgTime: null,
            lastUpdate: firebase.firestore.FieldValue.serverTimestamp()
        });
    };

    // Check-ins listener — READ ONLY. No writes inside snapshot to avoid infinite loop.
    const checkInsRef = useRef([]);
    useEffect(() => {
        if (!fbOk || !db) return;
        const unsub = db.collection('check-ins')
            .where('courtId', '==', COURT.id)
            .onSnapshot(snap => {
                const now = Date.now();
                const cutoff = now - 24 * 3600000;
                const list = snap.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .filter(c => c.timestamp > cutoff)
                    .sort((a,b) => (a.arrivalTime||a.timestamp) - (b.arrivalTime||b.timestamp));
                checkInsRef.current = list;
                setCheckIns(list);
            }, err => console.warn('Snapshot:', err.message));
        return () => unsub();
    }, []);

    // Separate interval for auto-checkout & auto-promote — runs every 60s, never inside snapshot
    useEffect(() => {
        if (!fbOk || !db) return;
        const tick = async () => {
            const now = Date.now();
            const list = checkInsRef.current;
            for (const c of list) {
                // Auto-checkout expired duration
                if (c.status === 'now' && c.duration) {
                    if (now > c.timestamp + c.duration * 60000) {
                        await db.collection('check-ins').doc(c.id).delete().catch(() => {});
                    }
                }
                // Auto-promote 'later' → 'now' when arrival time passes
                if (c.status === 'later' && c.arrivalTime && now >= c.arrivalTime) {
                    await db.collection('check-ins').doc(c.id).update({ status: 'now', timestamp: now }).catch(() => {});
                }
            }
        };
        tick(); // run once immediately
        const t = setInterval(tick, 60000); // then every minute
        return () => clearInterval(t);
    }, []);

    // Weather: NWS with Open-Meteo fallback, refresh hourly
    useEffect(() => { fetchWeather(); const t = setInterval(fetchWeather, 3600000); return () => clearInterval(t); }, []);

    const fetchWeather = async () => {
        try {
            const pointRes = await fetch(`https://api.weather.gov/points/38.7542,-90.7089`, { headers: { 'User-Agent': 'PickleCourtConnect/1.0' } });
            const pointData = await pointRes.json();
            const { forecastHourly } = pointData.properties;
            const fxRes = await fetch(forecastHourly, { headers: { 'User-Agent': 'PickleCourtConnect/1.0' } });
            const fxData = await fxRes.json();
            const periods = fxData.properties.periods;
            const cur = periods[0];
            const windGust = cur.windGust ? parseInt(cur.windGust) : null;
            setWeather({ temp: cur.temperature, wind: parseInt(cur.windSpeed), gust: windGust, desc: cur.shortForecast });
            setWxUpdated(new Date());
            setForecast(periods.slice(0, 12).map(p => ({
                dt: new Date(p.startTime),
                temp: p.temperature,
                wind: parseInt(p.windSpeed),
                gust: p.windGust ? parseInt(p.windGust) : null,
                desc: p.shortForecast
            })));
        } catch(e) {
            try {
                const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=38.7542&longitude=-90.7089&current=temperature_2m,wind_speed_10m,wind_gusts_10m&hourly=temperature_2m,wind_speed_10m,wind_gusts_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&forecast_days=1`);
                const d = await r.json();
                setWeather({ temp: Math.round(d.current.temperature_2m), wind: Math.round(d.current.wind_speed_10m), gust: d.current.wind_gusts_10m ? Math.round(d.current.wind_gusts_10m) : null });
                setWxUpdated(new Date());
                const now = new Date();
                setForecast(d.hourly.time.map((t,i) => ({ 
                    dt: new Date(t), 
                    temp: Math.round(d.hourly.temperature_2m[i]), 
                    wind: Math.round(d.hourly.wind_speed_10m[i]),
                    gust: d.hourly.wind_gusts_10m[i] ? Math.round(d.hourly.wind_gusts_10m[i]) : null
                })).filter(h => h.dt >= now && h.dt.getDate() === now.getDate()));
            } catch(e2) { console.error('Weather failed:', e2); }
        }
    };

    const updateCourt = async (field, value) => {
        if (!fbOk || !db) return;
        try { await db.collection('court-status').doc(COURT.id).update({ [field]: value, lastUpdate: firebase.firestore.FieldValue.serverTimestamp() }); }
        catch(e) { console.error('Update:', e); }
    };

    const handleTotalSave = async () => {
        const n = parseInt(newTotal);
        if (!n || n < 1 || n > 20) { alert('Enter a number 1–20'); return; }
        const open = Math.min(courtData.openCourts, n);
        await db.collection('court-status').doc(COURT.id).update({ totalCourts: n, openCourts: open, lastUpdate: firebase.firestore.FieldValue.serverTimestamp() });
        setShowTotalEdit(false); setNewTotal('');
    };

    const deleteMyCheckIns = async () => {
        const cutoff = Date.now() - 24 * 3600000;
        const snap = await db.collection('check-ins').where('courtId', '==', COURT.id).get();
        const mine = snap.docs.filter(d => { const x = d.data(); return x.deviceId === deviceId && x.timestamp > cutoff; });
        await Promise.all(mine.map(d => d.ref.delete()));
    };

    const startCheckIn = (status) => {
        if (!userName.trim()) { alert('Please enter your name first'); return; }
        if (status === 'later') { setShowLaterTime(true); }
        else submitCheckIn(status, null);
    };

    const submitCheckIn = async (status, atTime) => {
        if (!fbOk || !db) { alert('Database not available'); return; }
        try {
            await deleteMyCheckIns();
            await db.collection('check-ins').add({
                courtId: COURT.id, userName, deviceId,
                rating: userRating || null,
                status,
                guests: guestCount,
                duration: duration,
                comment: comment.trim() || '',
                arrivalTime: atTime || Date.now(),
                timestamp: Date.now(),
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            localStorage.setItem('pickleCourtUserName', userName);
            localStorage.setItem('pickleCourtRating', userRating);
            setShowForm(false); setStep('form'); setArrivalTime(''); setShowLaterTime(false); setGuestCount(0); setFunnyMsg(''); setDurationFunny(''); setGuestFunny(''); setComment('');
        } catch(e) { console.error('Check-in:', e); alert('Check-in failed. Try again.'); }
    };

    const handleCheckOut = async () => {
        if (!fbOk || !db) return;
        try { await deleteMyCheckIns(); } catch(e) { console.error('Checkout:', e); }
    };

    if (!courtData) return (
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh'}}>
            <div style={{textAlign:'center'}}>
                <div style={{width:42,height:42,border:'4px solid #e2e8f0',borderTop:'4px solid #059669',borderRadius:'50%',animation:'spin .8s linear infinite',margin:'0 auto 10px'}}/>
                <div style={{color:'#64748b',fontSize:14}}>Loading…</div>
            </div>
        </div>
    );

    const myCheckIn    = checkIns.find(c => c.deviceId === deviceId);
    const nowMs = Date.now();
    // Client-side auto-promote: treat 'later' players whose arrivalTime has passed as 'now'
    const nowPlayers   = checkIns.filter(c => c.status === 'now' || (c.status === 'later' && c.arrivalTime && nowMs >= c.arrivalTime));
    const laterPlayers = checkIns.filter(c => c.status === 'later' && (!c.arrivalTime || nowMs < c.arrivalTime));
    const watchers     = checkIns.filter(c => c.status === 'watching');
    const nowTotal     = headcount(nowPlayers);
    const laterTotal   = headcount(laterPlayers);
    const schedule     = groupByHour(laterPlayers);
    const timeOpts     = buildTimeOptions();
    const openOpts     = Array.from({ length: courtData.totalCourts + 1 }, (_,i) => i);

    const crowdColor = courtData.crowdLevel === 'low' ? 'green' : courtData.crowdLevel === 'medium' ? 'yellow' : 'red';
    const crowdEmoji = courtData.crowdLevel === 'low' ? '🟢' : courtData.crowdLevel === 'medium' ? '🟡' : '🔴';
    const crowdNum   = courtData.crowdLevel === 'low' ? '0–12' : courtData.crowdLevel === 'medium' ? '12–24' : '24+';

    const condMap = { closed:{e:'🚫',l:'Closed',c:'red'}, wet:{e:'💧',l:'Wet',c:'yellow'}, hot:{e:'🥵',l:'Hot',c:'yellow'}, windy:{e:'🌬️',l:'Windy',c:'yellow'} };

    return (
        <div style={{minHeight:'100vh',background:'#f1f5f9',display:'flex',flexDirection:'column'}}>

            {/* ── HEADER ── */}
            <div className="hero-bg" style={{padding:'15px 17px 13px'}}>
                <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:10}}>
                    <div>
                        <div className="fd" style={{fontSize:25,fontWeight:800,color:'white',letterSpacing:.3}}>PICKLECOURT CONNECT</div>
                        <div style={{fontSize:12,color:'#6ee7b7',marginTop:2,display:'flex',alignItems:'center',gap:6}}>
                            <span className="live-dot"/> Live · 📍 {COURT.location}
                        </div>
                    </div>
                    {weather && (
                        <div style={{textAlign:'right',flexShrink:0,marginLeft:8}}>
                            <div style={{display:'inline-flex',alignItems:'center',gap:5,background:'rgba(255,255,255,.18)',border:'1.5px solid rgba(255,255,255,.45)',borderRadius:20,padding:'6px 13px',fontSize:13,fontWeight:700,color:'white',boxShadow:'0 2px 8px rgba(0,0,0,.2)'}}>
                                {wIcon(weather.temp,weather.wind)} {weather.temp}°F · 💨{weather.wind}mph{weather.gust ? ` · 💨Gusts ${weather.gust}mph` : ''}
                            </div>
                            {wxUpdated && <div style={{fontSize:10,color:'#64748b',marginTop:3,textAlign:'right'}}>Updated {wxUpdated.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</div>}
                        </div>
                    )}
                </div>

                {/* Hourly weather timeline — highlighted with white border */}
                {forecast.length > 0 && (
                    <div style={{background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.2)',borderRadius:10,overflow:'hidden',marginBottom:10}}>
                        <div className="weather-strip">
                            {forecast.map((h, i) => (
                                <div key={i} className={`weather-hour${i===0?' now':''}`}>
                                    <div className="wh-time">{i===0?'Now':h.dt.toLocaleTimeString([],{hour:'numeric'})}</div>
                                    <div className="wh-icon">{wIcon(h.temp,h.wind)}</div>
                                    <div className="wh-temp">{h.temp}°</div>
                                    <div className="wh-wind">💨{h.wind}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {/* Last update timestamp */}
                {courtData.lastUpdate && (
                    <div style={{fontSize:10,color:'#6ee7b7',marginBottom:10,textAlign:'center'}}>
                        Court status last updated: {new Date(courtData.lastUpdate.seconds * 1000).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
                    </div>
                )}

                {/* Flash message banner */}
                {flashMsg && (
                    <div className="flash-banner" style={{borderRadius:10,marginBottom:10}}>
                        <span style={{fontSize:18}}>📣</span>
                        <div className="flash-banner-text">{flashMsg}</div>
                        <button className="flash-banner-close" onClick={clearFlashMsg}>×</button>
                    </div>
                )}

                {/* Status pills */}
                <div className="status-bar">
                    <div className={`status-pill ${nowTotal>0?'green':''}`}>
                        <span style={{fontSize:13}}>🎾</span>
                        <div><div className="pill-label">Playing</div><div className="pill-val">{nowTotal}</div></div>
                    </div>
                    <div className={`status-pill ${laterTotal>0?'green':''}`}>
                        <span style={{fontSize:13}}>⏰</span>
                        <div><div className="pill-label">Coming</div><div className="pill-val">{laterTotal}</div></div>
                    </div>
                    {courtData.condition && courtData.condition !== 'open' && condMap[courtData.condition] && (
                        <div className={`status-pill ${condMap[courtData.condition].c}`}>
                            <span style={{fontSize:13}}>{condMap[courtData.condition].e}</span>
                            <div><div className="pill-label">Court</div><div className="pill-val">{condMap[courtData.condition].l}</div></div>
                        </div>
                    )}
                    <div className={`status-pill ${crowdColor}`}>
                        <span style={{fontSize:13}}>{crowdEmoji}</span>
                        <div><div className="pill-label">Crowd</div><div className="pill-val">{crowdNum}</div></div>
                    </div>
                    <div className={`status-pill ${courtData.lightsOn?'dark':'yellow'}`}>
                        <span style={{fontSize:13,color:courtData.lightsOn?'#fbbf24':''}}>{courtData.lightsOn?'💡':'🌙'}</span>
                        <div><div className="pill-label" style={{color:courtData.lightsOn?'#94a3b8':''}}>Lights</div><div className="pill-val" style={{color:courtData.lightsOn?'white':''}}>{courtData.lightsOn?'ON':'OFF'}</div></div>
                    </div>
                    <div className={`status-pill ${courtData.openCourts>0?'green':'red'}`}>
                        <span style={{fontSize:13}}>🏟️</span>
                        <div><div className="pill-label">Open</div><div className="pill-val">{courtData.openCourts}/{courtData.totalCourts}</div></div>
                    </div>
                    {courtData.restroom && courtData.restroom !== 'open' && (
                        <div className={`status-pill red`}>
                            <span style={{fontSize:13}}>🚫</span>
                            <div><div className="pill-label">Restroom</div><div className="pill-val">Closed</div></div>
                        </div>
                    )}
                    {courtData.parking && courtData.parking === 'full' && (
                        <div className={`status-pill yellow`}>
                            <span style={{fontSize:13}}>🚗</span>
                            <div><div className="pill-label">Parking</div><div className="pill-val">Full</div></div>
                        </div>
                    )}
                </div>
            </div>

            {/* ── BODY ── */}
            <div style={{flex:1}}>
                <div className="pg">
                    {/* Tabs */}
                    <div className="tab-bar">
                        <button className={`tab-btn${tab==='now'?' active':''}`} onClick={()=>setTab('now')}>🎾 Now ({nowTotal})</button>
                        <button className={`tab-btn${tab==='schedule'?' active':''}`} onClick={()=>setTab('schedule')}>📅 Schedule ({laterTotal})</button>
                        <button className={`tab-btn${tab==='controls'?' active':''}`} onClick={()=>setTab('controls')}>⚙️ Controls</button>
                    </div>

                    {/* ── TAB: NOW ── */}
                    {tab==='now' && <>
                        <div className="card">
                            <div className="fd" style={{fontSize:19,fontWeight:800,color:'#0f172a',marginBottom:12}}>👥 WHO'S HERE?</div>

                            {myCheckIn ? (
                                <div style={{background:'linear-gradient(135deg,#f0fdf4,#dcfce7)',border:'2px solid #10b981',borderRadius:12,padding:'12px 15px'}}>
                                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10}}>
                                        <div>
                                            <div style={{fontSize:13,fontWeight:700,color:'#059669',marginBottom:3}}>
                                                ✅ Checked in as <strong>{myCheckIn.userName}</strong>
                                                {ratingInfo(myCheckIn.rating) && <span className={`rating-badge ${ratingInfo(myCheckIn.rating).cls}`} style={{marginLeft:6}}>{ratingInfo(myCheckIn.rating).label}</span>}
                                            </div>
                                            <div style={{fontSize:12,color:'#047857',display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                                                {(myCheckIn.status==='now' || (myCheckIn.status==='later' && myCheckIn.arrivalTime && Date.now() >= myCheckIn.arrivalTime))
                                                    ? '🎾 Playing'
                                                    : `⏰ Arriving ${new Date(myCheckIn.arrivalTime).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}`}
                                                {myCheckIn.status==='now' && myCheckIn.duration && (
                                                    <PlayTimer checkInTime={myCheckIn.timestamp} durationMins={myCheckIn.duration}/>
                                                )}
                                            </div>
                                        </div>
                                        <button className="btn-red" onClick={handleCheckOut}>Check Out</button>
                                    </div>
                                </div>
                            ) : !showForm ? (
                                <button className="btn-g" onClick={()=>{setShowForm(true);setComment('');}} style={{width:'100%',padding:13}}>📍 Check In</button>
                            ) : (
                                // Single unified form — no step switching
                                <div style={{background:'#f8fafc',borderRadius:11,padding:13}}>
                                    <input className="field" value={userName} onChange={e=>setUserName(e.target.value)} placeholder="Your name 👋" style={{marginBottom:9}}/>

                                    {/* Rating with funny message for 5.0+ */}
                                    <select className="field" value={userRating} onChange={e=>handleRatingChange(e.target.value)} style={{marginBottom: funnyMsg ? 6 : 10}}>
                                        <option value="">Skill rating (optional)</option>
                                        {RATINGS.map(r=><option key={r.key} value={r.key}>{r.label}</option>)}
                                    </select>
                                    {funnyMsg && (
                                        <div className="funny-msg" style={{background:'linear-gradient(135deg,#fef3c7,#fde68a)',border:'2px solid #fbbf24',borderRadius:10,padding:'10px 12px',marginBottom:10,fontSize:13,fontWeight:600,color:'#92400e',lineHeight:1.5}}>
                                            {funnyMsg}
                                        </div>
                                    )}

                                    {/* Guests */}
                                    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom: guestFunny ? 6 : 12,background:'white',border:'2px solid #e2e8f0',borderRadius:9,padding:'8px 13px'}}>
                                        <span style={{fontSize:13,fontWeight:600,color:'#64748b',flex:1}}>Guests (+ you)</span>
                                        <button type="button" onClick={()=>handleGuestChange(-1)} style={{width:28,height:28,borderRadius:'50%',border:'1px solid #e2e8f0',background:'#f8fafc',cursor:'pointer',fontWeight:700,fontSize:16,color:'#64748b',lineHeight:1}}>−</button>
                                        <span style={{fontSize:16,fontWeight:800,color:'#0f172a',minWidth:20,textAlign:'center'}}>{guestCount}</span>
                                        <button type="button" onClick={()=>handleGuestChange(1)} style={{width:28,height:28,borderRadius:'50%',border:'1px solid #10b981',background:'#f0fdf4',cursor:'pointer',fontWeight:700,fontSize:16,color:'#059669',lineHeight:1}}>+</button>
                                    </div>
                                    {guestFunny && (
                                        <div className="funny-msg" style={{background:'linear-gradient(135deg,#ede9fe,#ddd6fe)',border:'2px solid #a78bfa',borderRadius:10,padding:'9px 12px',marginBottom:12,fontSize:12,fontWeight:600,color:'#5b21b6',lineHeight:1.5}}>
                                            {guestFunny}
                                        </div>
                                    )}

                                    {/* Trash talk / comment field */}
                                    <div style={{position:'relative',marginBottom:13}}>
                                        <textarea
                                            className="field"
                                            rows={2}
                                            value={comment}
                                            placeholder={randFunnyComment()}
                                            onChange={e => setComment(e.target.value)}
                                            style={{resize:'none',lineHeight:1.5,fontSize:14}}
                                        />
                                        <div style={{fontSize:10,color:'#94a3b8',marginTop:3,textAlign:'right'}}>💬 Trash talk or message (optional)</div>
                                    </div>

                                    {/* Duration picker — always shown */}
                                    <div style={{marginBottom: durationFunny ? 6 : 13}}>
                                            <div style={{fontSize:11,fontWeight:700,color:'#64748b',marginBottom:7,textTransform:'uppercase',letterSpacing:'.4px'}}>How long will you play?</div>
                                            <div style={{display:'flex',gap:6}}>
                                                {DURATION_OPTIONS.map(d=>(
                                                    <button key={d.value} type="button" className={`dur-btn${duration===d.value?' active':''}`} onClick={()=>handleDurationChange(d.value)}>{d.label}</button>
                                                ))}
                                            </div>
                                        </div>
                                        {durationFunny && (
                                            <div className="funny-msg" style={{background:'linear-gradient(135deg,#fff7ed,#ffedd5)',border:'2px solid #fb923c',borderRadius:10,padding:'9px 12px',marginBottom:13,fontSize:12,fontWeight:600,color:'#9a3412',lineHeight:1.5}}>
                                                {durationFunny}
                                            </div>
                                        )}

                                    {/* Arrival time — shown inline when Coming Later active */}
                                    {showLaterTime && (
                                        <div style={{marginBottom:10}}>
                                            <div style={{fontSize:11,fontWeight:700,color:'#64748b',marginBottom:7,textTransform:'uppercase',letterSpacing:'.4px'}}>What time will you arrive?</div>
                                            <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
                                                <select className="field" value={arrivalTime} onChange={e=>setArrivalTime(e.target.value)} style={{flex:'0 0 auto',width:'auto',minWidth:140}}>
                                                    <option value="">Pick time…</option>
                                                    {timeOpts.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
                                                </select>
                                                {arrivalTime && (() => {
                                                    const hr = new Date(parseInt(arrivalTime)).getHours();
                                                    const fx = forecast.find(h => h.dt.getHours() === hr);
                                                    const isWindy = fx && (fx.wind >= 12 || (fx.gust && fx.gust >= 12));
                                                    const isAfter7 = hr >= 19;
                                                    
                                                    // Don't show weather badge for 7+ PM times
                                                    return (fx && !isAfter7) ? (
                                                        <div style={{display:'inline-flex',alignItems:'center',gap:6,background:'rgba(59,130,246,.1)',border:'2px solid rgba(59,130,246,.3)',borderRadius:20,padding:'6px 13px',fontSize:13,fontWeight:700,color:'#1e40af',whiteSpace:'nowrap'}}>
                                                            {wIcon(fx.temp,fx.wind)} {fx.temp}°F · 💨{fx.wind}mph{fx.gust ? ` · 💨Gusts ${fx.gust}mph` : ''}
                                                        </div>
                                                    ) : null;
                                                })()}
                                            </div>
                                            {arrivalTime && (() => {
                                                const hr = new Date(parseInt(arrivalTime)).getHours();
                                                const fx = forecast.find(h => h.dt.getHours() === hr);
                                                const isWindy = fx && (fx.wind >= 12 || (fx.gust && fx.gust >= 12));
                                                const isAfter7 = hr >= 19;
                                                
                                                // Show wind warning if windy
                                                if (isWindy) {
                                                    return (
                                                        <div style={{background:'linear-gradient(135deg,#fef3c7,#fde68a)',border:'2px solid #f59e0b',borderRadius:9,padding:'8px 11px',marginTop:8,fontSize:12,fontWeight:600,color:'#92400e',lineHeight:1.5}}>
                                                            🌬️ It's windy! Your lob might land on the next court 😅
                                                        </div>
                                                    );
                                                }
                                                // Show after 7 PM message only if NOT windy
                                                else if (isAfter7) {
                                                    return (
                                                        <div style={{background:'linear-gradient(135deg,#1e1b4b,#312e81)',border:'2px solid #6366f1',borderRadius:9,padding:'8px 11px',marginTop:8,fontSize:12,fontWeight:600,color:'#c7d2fe',lineHeight:1.5}}>
                                                            🌙 After 7 PM? Come with extra lights — and maybe a headlamp! 😂
                                                        </div>
                                                    );
                                                }
                                                return null;
                                            })()}
                                        </div>
                                    )}

                                    {/* Action buttons */}
                                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:8}}>
                                        {!showLaterTime ? (
                                            <>
                                                <button className="btn-g" onClick={()=>startCheckIn('now')} style={{padding:11}}>🎾 Coming Now</button>
                                                <button onClick={()=>{setShowLaterTime(true);setArrivalTime('');}} style={{padding:9,borderRadius:10,border:'2px solid #059669',background:'transparent',color:'#059669',fontFamily:'Outfit,sans-serif',fontWeight:600,fontSize:14,cursor:'pointer',transition:'all .15s'}}>
                                                    ⏰ Coming Later
                                                </button>
                                            </>
                                        ) : (
                                            <>
                                                <button onClick={()=>{setShowLaterTime(false);setArrivalTime('');}} style={{padding:9,borderRadius:10,border:'2px solid #059669',background:'#059669',color:'white',fontFamily:'Outfit,sans-serif',fontWeight:600,fontSize:14,cursor:'pointer',transition:'all .15s'}}>
                                                    🎾 Coming Now ←
                                                </button>
                                                <button className="btn-g" disabled={!arrivalTime} onClick={()=>submitCheckIn('later',parseInt(arrivalTime))} style={{padding:11,opacity:arrivalTime?1:.45}}>
                                                    ✓ Confirm
                                                </button>
                                            </>
                                        )}
                                    </div>

                                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                                        <button className="btn-out" onClick={()=>startCheckIn('watching')} style={{padding:9,fontSize:13}}>👀 Watching</button>
                                        <button onClick={()=>{setShowForm(false);setShowLaterTime(false);setArrivalTime('');setFunnyMsg('');setDurationFunny('');setGuestFunny('');setComment('');}} style={{background:'none',border:'1px solid #e2e8f0',borderRadius:8,padding:9,cursor:'pointer',fontFamily:'Outfit,sans-serif',fontSize:13,color:'#94a3b8'}}>Cancel</button>
                                    </div>
                                </div>
                            )}
                        </div>

                        {nowPlayers.length > 0 && (
                            <div className="card">
                                <div className="fd" style={{fontSize:16,fontWeight:800,color:'#0f172a',marginBottom:11}}>🎾 PLAYING NOW · {nowTotal}</div>
                                {nowPlayers.map(p=><PlayerRow key={p.id} p={p} isNow={true}/>)}
                            </div>
                        )}
                        {nowPlayers.length===0 && <div style={{textAlign:'center',padding:'28px 0',color:'#94a3b8',fontSize:13}}>No one checked in yet — be the first! 🥒</div>}
                    </>}

                    {/* ── TAB: SCHEDULE ── */}
                    {tab==='schedule' && <>
                        {schedule.length===0 && laterPlayers.length===0 && (
                            <div style={{textAlign:'center',padding:'32px 0',color:'#94a3b8',fontSize:13}}>No scheduled arrivals yet.<br/>Players who tap "Coming Later" will appear here by time slot.</div>
                        )}
                        {schedule.map(group => {
                            const t = new Date(group.ts);
                            const total = headcount(group.players);
                            const fx = forecast.find(h => h.dt.getHours() === t.getHours());
                            return (
                                <div key={group.ts} className={`hour-block ${group.players.length>0?'has-players':''}`}>
                                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:9,flexWrap:'wrap',gap:6}}>
                                        <div style={{display:'flex',alignItems:'center',gap:10}}>
                                            <div style={{fontWeight:800,fontSize:16,color:'#0f172a'}}>{t.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</div>
                                            {fx && <div style={{fontSize:11,color:'#64748b',fontWeight:600}}>{wIcon(fx.temp,fx.wind)} {fx.temp}°F · 💨{fx.wind}mph</div>}
                                        </div>
                                        <div style={{fontSize:11,fontWeight:700,color:'#059669',background:'#f0fdf4',border:'1px solid #10b981',borderRadius:20,padding:'2px 9px'}}>
                                            {total} player{total!==1?'s':''}
                                        </div>
                                    </div>
                                    {group.players.map(p=><PlayerRow key={p.id} p={p}/>)}
                                </div>
                            );
                        })}
                        {watchers.length > 0 && (
                            <div className="card" style={{marginTop:8}}>
                                <div className="fd" style={{fontSize:15,fontWeight:800,color:'#0f172a',marginBottom:10}}>👀 WATCHING · {watchers.length}</div>
                                {watchers.map(p=><PlayerRow key={p.id} p={p}/>)}
                            </div>
                        )}
                    </>}

                    {/* ── TAB: CONTROLS ── */}
                    {tab==='controls' && (
                        <div className="card">
                            <div className="fd" style={{fontSize:18,fontWeight:800,color:'#0f172a',marginBottom:15}}>⚙️ UPDATE COURT STATUS</div>

                            {/* Flash Message */}
                            <div style={{marginBottom:18,background:'linear-gradient(135deg,#faf5ff,#ede9fe)',border:'2px solid #a78bfa',borderRadius:12,padding:'13px 15px'}}>
                                <div style={{fontSize:11,fontWeight:700,color:'#7c3aed',marginBottom:8,textTransform:'uppercase',letterSpacing:'.5px'}}>📣 Flash Update</div>
                                <div style={{fontSize:12,color:'#6d28d9',marginBottom:10}}>Shows on home page for 4 hours. Use for urgent updates like court closures, events, etc.</div>
                                {flashMsg ? (
                                    <div>
                                        <div style={{background:'white',border:'1px solid #c4b5fd',borderRadius:8,padding:'9px 12px',fontSize:13,fontWeight:600,color:'#4c1d95',marginBottom:10,lineHeight:1.4}}>
                                            📣 {flashMsg}
                                        </div>
                                        <div style={{display:'flex',gap:8}}>
                                            <input className="field" value={flashInput} onChange={e=>setFlashInput(e.target.value)} placeholder="Update message…" style={{flex:1,fontSize:13,padding:'8px 11px'}}/>
                                            <button className="btn-g" onClick={saveFlashMsg} style={{padding:'8px 14px',fontSize:13}}>Update</button>
                                            <button onClick={clearFlashMsg} style={{padding:'8px 12px',borderRadius:9,border:'2px solid #e2e8f0',background:'white',color:'#94a3b8',fontWeight:600,fontSize:12,cursor:'pointer',fontFamily:'Outfit,sans-serif'}}>Clear</button>
                                        </div>
                                    </div>
                                ) : (
                                    <div style={{display:'flex',gap:8}}>
                                        <input className="field" value={flashInput} onChange={e=>setFlashInput(e.target.value)} placeholder="Type a flash update… e.g. Court 3 is closed today" style={{flex:1,fontSize:13,padding:'8px 11px'}}
                                            onKeyDown={e=>{ if(e.key==='Enter' && flashInput.trim()) saveFlashMsg(); }}
                                        />
                                        <button className="btn-g" onClick={saveFlashMsg} disabled={!flashInput.trim()} style={{padding:'8px 14px',fontSize:13,opacity:flashInput.trim()?1:.45}}>Post</button>
                                    </div>
                                )}
                            </div>

                            <div style={{marginBottom:13}}>
                                <div style={{fontSize:11,fontWeight:700,color:'#64748b',marginBottom:7,textTransform:'uppercase',letterSpacing:'.5px'}}>Crowd Level (people)</div>
                                <div className="toggle-group">
                                    <button className={`toggle-btn${courtData.crowdLevel==='low'?' active':''}`} onClick={()=>updateCourt('crowdLevel','low')}>🟢 0–12</button>
                                    <button className={`toggle-btn${courtData.crowdLevel==='medium'?' active':''}`} onClick={()=>updateCourt('crowdLevel','medium')}>🟡 12–24</button>
                                    <button className={`toggle-btn${courtData.crowdLevel==='high'?' active':''}`} onClick={()=>updateCourt('crowdLevel','high')}>🔴 24+</button>
                                </div>
                            </div>

                            <div style={{marginBottom:13}}>
                                <div style={{fontSize:11,fontWeight:700,color:'#64748b',marginBottom:7,textTransform:'uppercase',letterSpacing:'.5px'}}>Lights</div>
                                <div className="toggle-group">
                                    <button className={`toggle-btn${courtData.lightsOn?' active':''}`} onClick={()=>updateCourt('lightsOn',true)}>💡 ON</button>
                                    <button className={`toggle-btn${!courtData.lightsOn?' active':''}`} onClick={()=>updateCourt('lightsOn',false)}>🌙 OFF</button>
                                </div>
                            </div>

                            <div style={{marginBottom:13}}>
                                <div style={{fontSize:11,fontWeight:700,color:'#64748b',marginBottom:7,textTransform:'uppercase',letterSpacing:'.5px'}}>Open Courts</div>
                                <div className="toggle-group">
                                    {openOpts.map(n=>(
                                        <button key={n} className={`toggle-btn${courtData.openCourts===n?' active':''}`} onClick={()=>updateCourt('openCourts',n)}>{n}</button>
                                    ))}
                                </div>
                            </div>

                            <div style={{marginBottom:18}}>
                                <div style={{fontSize:11,fontWeight:700,color:'#64748b',marginBottom:7,textTransform:'uppercase',letterSpacing:'.5px',display:'flex',alignItems:'center',gap:8}}>
                                    Total Courts
                                    <span style={{fontSize:11,color:'#059669',background:'#f0fdf4',border:'1px solid #10b981',borderRadius:6,padding:'1px 7px',cursor:'pointer',textTransform:'none',letterSpacing:0}} onClick={()=>{setShowTotalEdit(!showTotalEdit);setNewTotal(String(courtData.totalCourts));}}>✏️ Edit</span>
                                </div>
                                {showTotalEdit ? (
                                    <div style={{display:'flex',gap:8,alignItems:'center'}}>
                                        <input type="number" min="1" max="20" className="field" value={newTotal} onChange={e=>setNewTotal(e.target.value)} style={{width:100}}/>
                                        <button className="btn-g" onClick={handleTotalSave} style={{padding:'9px 16px'}}>Save</button>
                                        <button onClick={()=>setShowTotalEdit(false)} style={{background:'none',border:'none',color:'#94a3b8',cursor:'pointer',fontFamily:'Outfit,sans-serif',fontSize:13}}>Cancel</button>
                                    </div>
                                ) : (
                                    <div style={{fontSize:20,fontWeight:800,color:'#0f172a'}}>{courtData.totalCourts} courts</div>
                                )}
                            </div>

                            <div style={{marginBottom:13}}>
                                <div style={{fontSize:11,fontWeight:700,color:'#64748b',marginBottom:7,textTransform:'uppercase',letterSpacing:'.5px'}}>Court Condition</div>
                                <div className="toggle-group">
                                    <button className={`toggle-btn${(courtData.condition||'open')==='open'?' active':''}`} onClick={()=>updateCourt('condition','open')}>✅ Open</button>
                                    <button className={`toggle-btn${courtData.condition==='closed'?' active':''}`} onClick={()=>updateCourt('condition','closed')} style={{color:courtData.condition==='closed'?'white':'#ef4444'}}>🚫 Closed</button>
                                    <button className={`toggle-btn${courtData.condition==='wet'?' active':''}`} onClick={()=>updateCourt('condition','wet')} style={{color:courtData.condition==='wet'?'white':'#3b82f6'}}>💧 Wet</button>
                                    <button className={`toggle-btn${courtData.condition==='hot'?' active':''}`} onClick={()=>updateCourt('condition','hot')} style={{color:courtData.condition==='hot'?'white':'#f97316'}}>🥵 Hot</button>
                                    <button className={`toggle-btn${courtData.condition==='windy'?' active':''}`} onClick={()=>updateCourt('condition','windy')} style={{color:courtData.condition==='windy'?'white':'#64748b'}}>🌬️ Windy</button>
                                </div>
                            </div>
                            
                            <div style={{marginBottom:13}}>
                                <div style={{fontSize:11,fontWeight:700,color:'#64748b',marginBottom:7,textTransform:'uppercase',letterSpacing:'.5px'}}>Restroom</div>
                                <div className="toggle-group">
                                    <button className={`toggle-btn${(courtData.restroom||'open')==='open'?' active':''}`} onClick={()=>updateCourt('restroom','open')}>🚻 Open</button>
                                    <button className={`toggle-btn${courtData.restroom==='closed'?' active':''}`} onClick={()=>updateCourt('restroom','closed')} style={{color:courtData.restroom==='closed'?'white':'#ef4444'}}>🚫 Closed</button>
                                </div>
                            </div>
                            
                            <div>
                                <div style={{fontSize:11,fontWeight:700,color:'#64748b',marginBottom:7,textTransform:'uppercase',letterSpacing:'.5px'}}>Parking</div>
                                <div className="toggle-group">
                                    <button className={`toggle-btn${(courtData.parking||'available')==='available'?' active':''}`} onClick={()=>updateCourt('parking','available')}>🅿️ Available</button>
                                    <button className={`toggle-btn${courtData.parking==='full'?' active':''}`} onClick={()=>updateCourt('parking','full')} style={{color:courtData.parking==='full'?'white':'#f97316'}}>🚗 Full</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>

                {/* ── FOOTER ── */}
                <div className="footer">
                    <div style={{marginBottom:10}}>
                        <a href="https://pickleconnect.live/" target="_blank" rel="noopener noreferrer" style={{display:'inline-flex',alignItems:'center',gap:8,background:'linear-gradient(135deg,#059669,#10b981)',color:'white',padding:'10px 20px',borderRadius:10,fontWeight:700,fontSize:13,textDecoration:'none',boxShadow:'0 4px 12px rgba(5,150,105,.3)'}}>
                            🏆 Generate a Tournament → pickleconnect.live
                        </a>
                    </div>
                    <div>© 2025 PickleConnect. All rights reserved. · Live Court Status</div>
                </div>
            </div>
        </div>
    );
}

ReactDOM.render(<CourtStatus />, document.getElementById('root'));
</script>
</body>
</html>
