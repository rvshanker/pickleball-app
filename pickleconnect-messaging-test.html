        .user-pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);border-radius:20px;padding:4px 12px 4px 4px;cursor:pointer;border:1.5px solid rgba(255,255,255,.25);backdrop-filter:blur(4px);position:relative;}

        .upd{position:absolute;top:calc(100% + 6px);right:0;background:white;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);min-width:160px;overflow:hidden;z-index:300;animation:fadeIn .15s ease;}
        .upd-item{display:flex;align-items:center;gap:8px;padding:11px 14px;font-size:13px;font-weight:600;color:#334155;cursor:pointer;font-family:'Outfit',sans-serif;border:none;background:none;width:100%;text-align:left;}

        .fp{background:rgba(255,255,255,.12);backdrop-filter:blur(8px);border-radius:12px;padding:14px;margin-bottom:14px;}

        .fp-pill.s{background:#ecfdf5;color:#059669;border-color:#059669;}

// ── Helpers ───────────────────────────────────────────────────────────
function haversine(a,b,c,d){const R=3958.8,dL=(c-a)*Math.PI/180,dN=(d-b)*Math.PI/180,x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dN/2)**2;return R*2*Math.asin(Math.sqrt(x));}

// ── AUTH SCREEN ────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════
function AuthScreen(){
    const[mode,setMode]=useState('signin');
    const[email,setEmail]=useState('');const[pass,setPass]=useState('');const[confirm,setConfirm]=useState('');
    const[ld,setLd]=useState(false);const[err,setErr]=useState(null);
    const isFile=window.location.protocol==='file:';

    const googleAuth=async()=>{
        if(isFile){setErr('Open via a local web server (e.g. npx serve . or python -m http.server), not as a file:// URL.');return;}
        setLd(true);setErr(null);
        const prov=new firebase.auth.GoogleAuthProvider();
        try{await auth.signInWithPopup(prov);}
        catch(e){if(e.code!=='auth/popup-closed-by-user')setErr(e.message);}
        setLd(false);
    };

    const emailAuth=async()=>{
        if(!email.trim()||!pass){setErr('Enter email and password.');return;}
        if(mode==='signup'&&pass!==confirm){setErr('Passwords do not match.');return;}
        if(mode==='signup'&&pass.length<6){setErr('Password must be at least 6 characters.');return;}
        setLd(true);setErr(null);
        try{
            if(mode==='signup')await auth.createUserWithEmailAndPassword(email.trim(),pass);
            else await auth.signInWithEmailAndPassword(email.trim(),pass);
        }catch(e){
            const msg={'auth/email-already-in-use':'An account with this email already exists. Sign in instead.','auth/user-not-found':'No account found.','auth/wrong-password':'Incorrect password.','auth/invalid-email':'Invalid email.','auth/too-many-requests':'Too many attempts. Try later.'}[e.code]||e.message;
            setErr(msg);
        }
        setLd(false);
    };

    const forgotPw=async()=>{
        if(!email.trim()){setErr('Enter your email above first.');return;}
        try{await auth.sendPasswordResetEmail(email.trim());setErr(null);alert('Password reset email sent!');}
        catch(e){setErr(e.message);}
    };

    return(
        <div className="hero-bg">
            <div className="nav"><div className="nav-logo">🏓 PICKLECONNECT</div></div>
            <div className="auth-screen">
                <div style={{fontSize:52,marginBottom:10}}>🏓</div>
                <div className="fd" style={{fontSize:34,fontWeight:800,color:'white',marginBottom:6}}>FIND PLAYERS</div>
                <div style={{fontSize:14,color:'rgba(255,255,255,.65)',marginBottom:24,maxWidth:340,lineHeight:1.5}}>Connect with pickleball players near you. Sign in to send messages and post availability.</div>

                <div style={{display:'flex',background:'rgba(255,255,255,.12)',borderRadius:10,padding:3,marginBottom:20,width:'100%',maxWidth:340}}>
                    {[['signin','Sign In'],['signup','Sign Up']].map(([k,l])=>
                        <button key={k} onClick={()=>{setMode(k);setErr(null);}} style={{flex:1,padding:'9px',border:'none',borderRadius:8,fontFamily:'Outfit',fontSize:13,fontWeight:700,cursor:'pointer',background:mode===k?'white':'transparent',color:mode===k?'#059669':'rgba(255,255,255,.75)',boxShadow:mode===k?'0 1px 4px rgba(0,0,0,.12)':'none'}}>{l}</button>
                    )}
                </div>

                {err&&<div style={{background:'rgba(239,68,68,.15)',border:'1px solid rgba(239,68,68,.3)',borderRadius:10,padding:'10px 14px',marginBottom:14,maxWidth:340,width:'100%',fontSize:12,color:'#fecaca',lineHeight:1.5,textAlign:'left'}}>⚠️ {err}</div>}

                <div style={{width:'100%',maxWidth:340,display:'flex',flexDirection:'column',gap:8}}>
                    <input value={email} onChange={e=>setEmail(e.target.value)} type="email" placeholder="Email address" style={{padding:'11px 14px',borderRadius:10,border:'2px solid rgba(255,255,255,.2)',background:'rgba(255,255,255,.12)',color:'white',fontFamily:'Outfit',fontSize:14,outline:'none',width:'100%'}} onKeyDown={e=>e.key==='Enter'&&emailAuth()}/>
                    <input value={pass} onChange={e=>setPass(e.target.value)} type="password" placeholder="Password" style={{padding:'11px 14px',borderRadius:10,border:'2px solid rgba(255,255,255,.2)',background:'rgba(255,255,255,.12)',color:'white',fontFamily:'Outfit',fontSize:14,outline:'none',width:'100%'}} onKeyDown={e=>e.key==='Enter'&&emailAuth()}/>
                    {mode==='signup'&&<input value={confirm} onChange={e=>setConfirm(e.target.value)} type="password" placeholder="Confirm password" style={{padding:'11px 14px',borderRadius:10,border:'2px solid rgba(255,255,255,.2)',background:'rgba(255,255,255,.12)',color:'white',fontFamily:'Outfit',fontSize:14,outline:'none',width:'100%'}} onKeyDown={e=>e.key==='Enter'&&emailAuth()}/>}
                    <button onClick={emailAuth} disabled={ld} style={{padding:'12px',borderRadius:10,border:'none',background:'linear-gradient(135deg,#059669,#10b981)',color:'white',fontFamily:'Outfit',fontSize:14,fontWeight:700,cursor:'pointer',opacity:ld?.6:1}}>{ld?'Please wait…':mode==='signup'?'✅ Create Account':'→ Sign In'}</button>
                    {mode==='signin'&&<button onClick={forgotPw} style={{background:'none',border:'none',color:'rgba(255,255,255,.45)',fontSize:11,cursor:'pointer',fontFamily:'Outfit',textAlign:'right',padding:'2px 0'}}>Forgot password?</button>}
                </div>

                <div style={{display:'flex',alignItems:'center',gap:10,width:'100%',maxWidth:340,margin:'16px 0'}}>
                    <div style={{flex:1,height:1,background:'rgba(255,255,255,.15)'}}/><span style={{fontSize:11,color:'rgba(255,255,255,.4)',fontWeight:600}}>OR</span><div style={{flex:1,height:1,background:'rgba(255,255,255,.15)'}}/>
                </div>

                <button className="google-btn" onClick={googleAuth} disabled={ld} style={{width:'100%',maxWidth:340,justifyContent:'center'}}>
                    <GoogleIcon/> Continue with Google
                </button>
                <div style={{fontSize:11,color:'rgba(255,255,255,.35)',marginTop:16}}>Free · Takes 30 seconds</div>
            </div>
        </div>
    );
}

// ── PROFILE SETUP ─────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════
function ProfileSetup({user,profile,onSave,onClose}){
    const[name,setName]=useState(profile?.name||user?.displayName||'');
    const[skill,setSkill]=useState(profile?.skill||'');const[city,setCity]=useState(profile?.city||'');
    const[age,setAge]=useState(profile?.age||'');const[gender,setGender]=useState(profile?.gender||'');
    const[duprId,setDupr]=useState(profile?.duprId||'');const[saving,setSaving]=useState(false);
    const save=async()=>{if(!name.trim()){alert('Enter your name.');return;}if(!skill){alert('Select skill level.');return;}setSaving(true);
        const data={name:name.trim(),skill,city:city.trim()||null,age:age||null,gender:gender||null,duprId:duprId.trim()||null,photoURL:user.photoURL||null,email:user.email||null,uid:user.uid,updatedAt:Date.now()};
        try{await db.collection('profiles').doc(user.uid).set(data,{merge:true});onSave(data);}catch(e){alert('Failed: '+e.message);}setSaving(false);};
    return(<div className="mo" onClick={e=>{if(e.target===e.currentTarget&&onClose)onClose();}}>
        <div className="ms"><div className="mh"/>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}><div className="fd" style={{fontSize:20,fontWeight:800,color:'#0f172a'}}>{profile?'✏️ EDIT PROFILE':'👋 SET UP PROFILE'}</div>{onClose&&<button onClick={onClose} style={{background:'#f1f5f9',border:'none',borderRadius:8,width:30,height:30,fontSize:14,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>}</div>
            {!profile&&<div style={{fontSize:13,color:'#64748b',marginBottom:16}}>Set up once — used everywhere in PickleConnect.</div>}
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16,padding:12,background:'#f8fafc',borderRadius:12}}>{user.photoURL?<img src={user.photoURL} style={{width:40,height:40,borderRadius:'50%'}} referrerPolicy="no-referrer"/>:<div className="av-sm" style={{width:40,height:40,fontSize:16}}>{(name||'?')[0].toUpperCase()}</div>}<div><div style={{fontSize:13,fontWeight:600}}>{user.email}</div><div style={{fontSize:11,color:'#94a3b8'}}>Signed in account</div></div></div>
            <div className="fg"><div className="fl">Display Name *</div><input className="fi" value={name} onChange={e=>setName(e.target.value)} placeholder="Your name" maxLength={40}/></div>
            <div className="fg"><div className="fl">Skill Level *</div><div className="og">{SKILLS.map(s=><button key={s} className={`ob ${skill===s?'s':''}`} onClick={()=>setSkill(s)} style={{fontSize:11}}>{s} <span style={{fontSize:9,opacity:.5}}>{SKILL_L[s]}</span></button>)}</div></div>
            <div className="fg"><div className="fl">City / Area</div><input className="fi" value={city} onChange={e=>setCity(e.target.value)} placeholder="e.g. Dardenne Prairie, MO" maxLength={80}/></div>
            <div style={{display:'flex',gap:10}}>
                <div className="fg" style={{flex:1}}><div className="fl">Age</div><select className="fi" value={age} onChange={e=>setAge(e.target.value)}><option value="">—</option>{['18-25','26-35','36-45','46-55','56-65','65+'].map(a=><option key={a}>{a}</option>)}</select></div>
                <div className="fg" style={{flex:1}}><div className="fl">Gender</div><select className="fi" value={gender} onChange={e=>setGender(e.target.value)}><option value="">—</option>{['Male','Female','Non-binary'].map(g=><option key={g}>{g}</option>)}</select></div>
            </div>
            <div className="fg"><div className="fl">DUPR ID (optional)</div><input className="fi" value={duprId} onChange={e=>setDupr(e.target.value)} placeholder="e.g. JJM7KM" maxLength={20}/></div>
            <button className="btn-g" onClick={save} disabled={saving} style={{width:'100%',padding:'13px',fontSize:15,opacity:saving?.6:1}}>{saving?'Saving…':'✅ Save Profile'}</button>
        </div></div>);
}

// ── POST FORM ─────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════
function PostForm({profile,onClose,onPosted,editData,uLat,uLng}){
    const[purpose,setPurpose]=useState(editData?.purpose||'play');
    const[playTypes,setPT]=useState(editData?.playTypes||[]);
    const[availability,setAv]=useState(editData?.availability||'Flexible');
    const[availDate,setAD]=useState(editData?.availDate||'');const[availTime,setAT]=useState(editData?.availTime||'');
    const[courtName,setCourt]=useState(editData?.courtName||'');const[message,setMsg]=useState(editData?.message||'');
    const[partnerGender,setPG]=useState(editData?.partnerGender||'');
    const[saving,setSaving]=useState(false);
    const togglePT=t=>setPT(p=>p.includes(t)?p.filter(x=>x!==t):[...p,t]);
    const save=async()=>{if(playTypes.length===0){alert('Select play type.');return;}setSaving(true);
        const data={uid:profile.uid,name:profile.name,skill:profile.skill,city:profile.city||null,age:profile.age||null,gender:profile.gender||null,duprId:profile.duprId||null,photoURL:profile.photoURL||null,purpose,playTypes,availability,availDate:availDate||null,availTime:availTime||null,courtName:courtName.trim()||null,message:message.trim()||null,partnerGender:purpose==='partner'?(partnerGender||null):null,lat:uLat||null,lng:uLng||null,timestamp:Date.now(),status:'active'};
        try{if(editData?.id){await db.collection('findPlayers').doc(editData.id).update(data);}else{await db.collection('findPlayers').add(data);}onPosted();}catch(e){alert('Failed: '+e.message);}setSaving(false);};
    const today=new Date().toISOString().split('T')[0];
    return(<div className="mo" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
        <div className="ms"><div className="mh"/>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}><div className="fd" style={{fontSize:20,fontWeight:800,color:'#0f172a'}}>{editData?'✏️ EDIT POST':'📢 POST AVAILABILITY'}</div><button onClick={onClose} style={{background:'#f1f5f9',border:'none',borderRadius:8,width:30,height:30,fontSize:14,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button></div>
            <div style={{fontSize:13,color:'#64748b',marginBottom:14}}>Let others know you're available.</div>
            <div style={{display:'flex',alignItems:'center',gap:10,padding:10,background:'#f8fafc',borderRadius:10,marginBottom:14}}>{profile.photoURL?<img src={profile.photoURL} style={{width:32,height:32,borderRadius:'50%'}} referrerPolicy="no-referrer"/>:<div className="av-sm" style={{width:32,height:32,fontSize:13}}>{profile.name[0]}</div>}<div><div style={{fontSize:13,fontWeight:700}}>{profile.name}</div><div style={{fontSize:11,color:'#64748b'}}>{profile.skill} · {profile.city||'No city'}</div></div></div>
            <div className="fg"><div className="fl">What are you looking for? *</div><div className="og">{PURPOSES.map(p=><button key={p.id} className={`ob ${purpose===p.id?'s':''}`} onClick={()=>setPurpose(p.id)} style={{fontSize:12}}>{p.emoji} {p.label}</button>)}</div></div>
            {purpose==='partner'&&<div className="fg"><div className="fl">Partner Gender Preference</div><div className="og"><button className={`ob ${partnerGender===''?'s':''}`} onClick={()=>setPG('')} style={{fontSize:12}}>🏓 Any</button>{['Male','Female','Non-binary'].map(g=><button key={g} className={`ob ${partnerGender===g?'s':''}`} onClick={()=>setPG(partnerGender===g?'':g)} style={{fontSize:12}}>{g==='Male'?'👨':g==='Female'?'👩':'🧑'} {g}</button>)}</div></div>}
            <div className="fg"><div className="fl">Play Type *</div><div className="og">{PTYPES.map(t=><button key={t} className={`ob ${playTypes.includes(t)?'s':''}`} onClick={()=>togglePT(t)} style={{fontSize:12}}>{PT_E[t]} {t}</button>)}</div></div>
            <div className="fg"><div className="fl">When</div><div className="og" style={{marginBottom:6}}>{AVAIL.map(a=><button key={a} className={`ob ${availability===a?'s':''}`} onClick={()=>setAv(a)} style={{fontSize:12}}>{AV_ICO[a]} {a}</button>)}</div>{(availability==='This Week'||availability==='Today')&&<div style={{display:'flex',gap:8,marginTop:6}}><input type="date" className="fi" value={availDate} onChange={e=>setAD(e.target.value)} min={today} style={{flex:1,fontSize:13}}/><input type="time" className="fi" value={availTime} onChange={e=>setAT(e.target.value)} style={{flex:1,fontSize:13}}/></div>}</div>
            <div className="fg"><div className="fl">Court (optional)</div><input className="fi" value={courtName} onChange={e=>setCourt(e.target.value)} placeholder="e.g. Heritage Park Courts" maxLength={100}/></div>
            <div className="fg"><div className="fl">Message</div><textarea className="fi" value={message} onChange={e=>setMsg(e.target.value)} placeholder={purpose==='partner'?'Looking for 3.5+ doubles partner for Saturday tournament…':'Available for games, message me!'} maxLength={300} rows={2}/></div>
            <button className="btn-g" onClick={save} disabled={saving} style={{width:'100%',padding:'12px',fontSize:15,opacity:saving?.6:1}}>{saving?'Saving…':'📢 Post'}</button>
        </div></div>);
}

// ── CHAT MODAL ────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════
function ChatModal({player,myUid,myName,onClose}){
    const[msgs,setMsgs]=useState([]);const[inp,setInp]=useState('');const[sending,setSending]=useState(false);const[err,setErr]=useState(null);
    const endRef=useRef(null);const c=cid(myUid,player.uid);
    useEffect(()=>{if(!fbOk)return;const u=db.collection('chatMessages').where('convoId','==',c).orderBy('timestamp','asc').onSnapshot(s=>{setMsgs(s.docs.map(d=>({id:d.id,...d.data()})));setTimeout(()=>endRef.current?.scrollIntoView({behavior:'smooth'}),100);},e=>{console.error('Chat listener:',e);setErr(e.message);});return()=>u();},[c]);
    useEffect(()=>{if(!fbOk||msgs.length===0)return;db.collection('conversations').doc(c).update({[`readBy_${myUid}`]:Date.now()}).catch(()=>{});},[c,msgs.length]);
    const send=async()=>{if(!inp.trim()||sending)return;setSending(true);const now=Date.now(),txt=inp.trim();
        try{
            const ref=db.collection('conversations').doc(c);
            const convoData={participants:[myUid,player.uid].sort(),participantNames:{[myUid]:myName,[player.uid]:player.name},lastMessage:txt,lastMessageBy:myUid,lastTimestamp:now,[`readBy_${myUid}`]:now};
            try{await ref.set({...convoData,createdAt:now});}catch(createErr){await ref.update({lastMessage:txt,lastMessageBy:myUid,lastTimestamp:now,[`participantNames.${myUid}`]:myName,[`readBy_${myUid}`]:now});}
            await db.collection('chatMessages').add({convoId:c,text:txt,senderUid:myUid,senderName:myName,timestamp:now});
            setInp('');
        }catch(e){alert('Send failed: '+e.message);}setSending(false);};
    return(<div className="mo" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
        <div className="ms" style={{display:'flex',flexDirection:'column',height:'80vh',padding:0}}>
            <div style={{padding:'12px 16px',borderBottom:'1px solid #e2e8f0',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
                <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer'}}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" strokeWidth="2.5"><path d="M15 18l-6-6 6-6"/></svg></button>
                {player.photoURL?<img src={player.photoURL} style={{width:32,height:32,borderRadius:'50%'}} referrerPolicy="no-referrer"/>:<div className="av-sm" style={{width:32,height:32,fontSize:13}}>{(player.name||'?')[0].toUpperCase()}</div>}
                <div style={{flex:1}}><div style={{fontWeight:700,fontSize:14}}>{player.name}</div><div style={{fontSize:11,color:'#64748b'}}>{player.skill||'PickleConnect Player'}</div></div>
                <div className="sb" style={{padding:'3px 7px',fontSize:10}}>🔒 Private</div>
            </div>
            {err&&<div style={{padding:'8px 16px',background:'#fef2f2',fontSize:12,color:'#dc2626'}}>⚠️ {err} — Check Firestore indexes.</div>}
            <div style={{flex:1,overflowY:'auto',padding:'12px 16px',display:'flex',flexDirection:'column',gap:3}}>
                {msgs.length===0&&!err&&<div style={{textAlign:'center',padding:'30px',color:'#94a3b8'}}><div style={{fontSize:28,marginBottom:6}}>💬</div><div style={{fontSize:13}}>Say hi to {player.name}!</div></div>}
                {msgs.map(m=><div key={m.id} style={{display:'flex',flexDirection:'column',alignItems:m.senderUid===myUid?'flex-end':'flex-start'}}><div className={`cb ${m.senderUid===myUid?'me':'them'}`}>{m.text}<div className="ct">{timeAgo(m.timestamp)}</div></div></div>)}
                <div ref={endRef}/>
            </div>
            <div style={{padding:'10px 16px',borderTop:'1px solid #e2e8f0',display:'flex',gap:8,alignItems:'flex-end',flexShrink:0,background:'white'}}>
                <textarea value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}} placeholder="Message…" rows={1} style={{flex:1,padding:'9px 12px',border:'2px solid #e2e8f0',borderRadius:10,fontFamily:'Outfit,sans-serif',fontSize:14,resize:'none',outline:'none',maxHeight:70}}/>
                <button className="btn-g" onClick={send} disabled={sending||!inp.trim()} style={{padding:'9px 16px',fontSize:13,opacity:(sending||!inp.trim())?.5:1}}>Send</button>
            </div>
        </div></div>);
}

// ── INBOX ─────────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════
function Inbox({onClose,onOpen,myUid,players}){
    const[cs,setCs]=useState([]);const[ld,setLd]=useState(true);
    useEffect(()=>{if(!fbOk){setLd(false);return;}const u=db.collection('conversations').where('participants','array-contains',myUid).orderBy('lastTimestamp','desc').onSnapshot(s=>{setCs(s.docs.map(d=>({id:d.id,...d.data()})));setLd(false);},()=>setLd(false));return()=>u();},[]);
    const info=c=>{const ouid=c.participants.find(p=>p!==myUid);const nm=c.participantNames?.[ouid]||'Player';const rt=c[`readBy_${myUid}`]||0;return{ouid,nm,ur:c.lastMessageBy!==myUid&&c.lastTimestamp>rt};};
    const go=c=>{const{ouid,nm}=info(c);const mp=players.find(p=>p.uid===ouid);onOpen(mp||{uid:ouid,name:nm,skill:'',photoURL:null});onClose();};
    return(<div className="mo" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
        <div className="ms" style={{minHeight:'40vh'}}><div className="mh"/>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}><div className="fd" style={{fontSize:20,fontWeight:800}}>💬 MESSAGES</div><button onClick={onClose} style={{background:'#f1f5f9',border:'none',borderRadius:8,width:30,height:30,fontSize:14,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button></div>
            <div className="sb" style={{marginBottom:14}}>🔒 All chats are private 1-on-1</div>
            {ld?<div style={{textAlign:'center',padding:30,color:'#94a3b8'}}>Loading…</div>
            :cs.length===0?<div style={{textAlign:'center',padding:30,color:'#94a3b8'}}><div style={{fontSize:36,marginBottom:8}}>💬</div><div style={{fontWeight:700,color:'#374151'}}>No messages yet</div><div style={{fontSize:12,color:'#94a3b8',marginTop:4}}>Find a player and tap 💬 Send Message</div></div>
            :cs.map(c=>{const{nm,ur}=info(c);return(<div key={c.id} className={`ix ${ur?'ur':''}`} onClick={()=>go(c)}><div className="av-sm">{nm[0].toUpperCase()}</div><div style={{flex:1,minWidth:0}}><div style={{display:'flex',alignItems:'center',gap:6}}><span style={{fontWeight:ur?800:600,fontSize:14}}>{nm}</span>{ur&&<div style={{width:7,height:7,borderRadius:'50%',background:'#059669'}}/>}</div><div style={{fontSize:12,color:ur?'#334155':'#94a3b8',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{c.lastMessageBy===myUid?'You: ':''}{c.lastMessage}</div></div><div style={{fontSize:10,color:'#94a3b8'}}>{timeAgo(c.lastTimestamp)}</div></div>);})}
        </div></div>);
}

// ── SEND MESSAGE BUTTON (auth-aware, used on every surface) ───────────
// ═══════════════════════════════════════════════════════════════════════
// Pass: player obj, currentUser (null if guest), onChat fn, onNeedLogin fn
function MsgBtn({player, currentUser, onChat, onNeedLogin, style={}, ghost=false}){
    if(!player||!player.uid)return null;
    if(currentUser&&player.uid===currentUser.uid)return null; // hide on own card

    const handleClick=e=>{
        e.stopPropagation();
        if(!currentUser){
            onNeedLogin(player); // show login prompt with player context
        } else {
            onChat(player);
        }
    };

    return(
        <button className={`msg-btn ${ghost?'msg-btn-ghost':'msg-btn-primary'}`} onClick={handleClick} style={style}>
            💬 {currentUser?'Send Message':'Message (Sign In)'}
        </button>
    );
}

// ── MAIN APP ──────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════
function App(){
    const[user,setUser]=useState(undefined);
    const[profile,setProfile]=useState(undefined);
    const[posts,setPosts]=useState([]);
    const[loading,setLoading]=useState(true);
    const[uLat,setULat]=useState(null);const[uLng,setULng]=useState(null);
    const[showPost,setShowPost]=useState(false);const[editP,setEditP]=useState(null);
    const[chatP,setChatP]=useState(null);const[showInbox,setShowInbox]=useState(false);
    const[showProfile,setShowProfile]=useState(false);const[unread,setUnread]=useState(0);
    const[search,setSearch]=useState('');const[tab,setTab]=useState('players');
    const[expanded,setExpanded]=useState(null);
    const[showF,setShowF]=useState(false);const[fSkill,setFS]=useState('');const[fType,setFT]=useState('');const[fGender,setFG]=useState('');const[fPurpose,setFP]=useState('');
    const[loginPromptPlayer,setLoginPromptPlayer]=useState(null); // null = not showing
    const[showFab,setShowFab]=useState(false);
    const[showAuth,setShowAuth]=useState(false);

    // Auth listener
    useEffect(()=>{
        if(!auth)return;
        const u=auth.onAuthStateChanged(u=>{
            setUser(u||null);
            if(!u)setProfile(null);
            setShowAuth(false); // clear "show auth" if they signed in
        });
        return()=>u();
    },[]);

    // Profile listener
    useEffect(()=>{
        if(user===undefined||user===null)return;
        setProfile(undefined);
        if(!fbOk)return;
        const u=db.collection('profiles').doc(user.uid).onSnapshot(d=>{
            if(d.exists)setProfile({uid:user.uid,...d.data()});
            else setProfile(null);
        },()=>setProfile(null));
        return()=>u();
    },[user]);

    // Geolocation
    useEffect(()=>{if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{setULat(p.coords.latitude);setULng(p.coords.longitude);},()=>{},{enableHighAccuracy:false,timeout:8000,maximumAge:300000});},[]);

    // Posts listener (works for both guests and logged-in users)
    useEffect(()=>{
        if(!fbOk){setLoading(false);return;}
        const c=Date.now()-7*24*60*60*1000;
        const u=db.collection('findPlayers').where('status','==','active').where('timestamp','>',c).orderBy('timestamp','desc').onSnapshot(s=>{setPosts(s.docs.map(d=>({id:d.id,...d.data()})));setLoading(false);},()=>setLoading(false));
        return()=>u();
    },[]);

    // Unread count (only when logged in)
    useEffect(()=>{
        if(!fbOk||!user)return;
        const u=db.collection('conversations').where('participants','array-contains',user.uid).onSnapshot(s=>{let c=0;s.docs.forEach(d=>{const x=d.data();if(x.lastMessageBy!==user.uid&&x.lastTimestamp>(x[`readBy_${user.uid}`]||0))c++;});setUnread(c);},()=>{});
        return()=>u();
    },[user]);

    const fCount=[fSkill,fType,fGender,fPurpose].filter(Boolean).length;
    const clearF=()=>{setFS('');setFT('');setFG('');setFP('');};

    const grouped=useMemo(()=>{
        let fp=[...posts];
        if(tab==='nearby'&&uLat)fp=fp.filter(p=>p.lat&&haversine(uLat,uLng,p.lat,p.lng)<=25);
        if(search.trim()){const q=search.toLowerCase();fp=fp.filter(p=>[p.name,p.courtName,p.city,p.message,p.skill].some(v=>(v||'').toLowerCase().includes(q)));}
        if(fSkill)fp=fp.filter(p=>p.skill===fSkill);
        if(fType)fp=fp.filter(p=>p.playTypes?.includes(fType));
        if(fGender)fp=fp.filter(p=>p.gender===fGender);
        if(fPurpose)fp=fp.filter(p=>p.purpose===fPurpose);
        const map={};
        fp.forEach(p=>{
            if(!map[p.uid])map[p.uid]={uid:p.uid,name:p.name,skill:p.skill,city:p.city,age:p.age,gender:p.gender,duprId:p.duprId,photoURL:p.photoURL,lat:p.lat,lng:p.lng,posts:[]};
            map[p.uid].posts.push(p);
            if(p.timestamp>(map[p.uid]._ts||0)){map[p.uid]._ts=p.timestamp;map[p.uid].name=p.name;map[p.uid].skill=p.skill;map[p.uid].city=p.city;map[p.uid].photoURL=p.photoURL;map[p.uid].duprId=p.duprId;}
        });
        let arr=Object.values(map);
        arr.sort((a,b)=>{if(user&&a.uid===user.uid&&b.uid!==user.uid)return -1;if(user&&b.uid===user.uid&&a.uid!==user.uid)return 1;if(tab==='nearby'&&uLat&&a.lat&&b.lat)return haversine(uLat,uLng,a.lat,a.lng)-haversine(uLat,uLng,b.lat,b.lng);return(b._ts||0)-(a._ts||0);});
        return arr;
    },[posts,tab,search,fSkill,fType,fGender,fPurpose,uLat,uLng,user]);

    const signOut=async()=>{if(confirm('Sign out?'))await auth.signOut();};

    // ── Auth required action handler ──
    const handleNeedLogin=(player)=>{
        setLoginPromptPlayer(player);
    };
    const handleLoginPromptConfirm=()=>{
        setLoginPromptPlayer(null);
        setShowAuth(true);
    };

    // ── FAB action handlers ──
    const handleFabAvailable=()=>{
        setShowFab(false);
        if(!user||!profile){handleNeedLogin(null);return;}
        setEditP(null);setShowPost(true);
    };
    const handleFabGame=()=>{
        setShowFab(false);
        // For now, navigate to findgame.html — or show placeholder
        if(!user||!profile){handleNeedLogin(null);return;}
        alert('🎮 Start a Game — links to findgame.html in production');
    };
    const handleFabQueue=()=>{
        setShowFab(false);
        if(!user||!profile){handleNeedLogin(null);return;}
        alert('🏟 Join a Court Queue — links to court.html in production');
    };

    // Loading state
    if(user===undefined||profile===undefined){
        return(<div className="hero-bg"><div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',color:'white',flexDirection:'column',gap:12}}><div style={{fontSize:40}}>🏓</div><div style={{fontSize:14,opacity:.6}}>Loading PickleConnect…</div></div></div>);
    }

    // Show auth screen (full page, or triggered by login prompt)
    if(showAuth||(!user&&user===null&&showAuth)){
        return <AuthScreen/>;
    }

    // Profile setup (only after login)
    if(user&&profile===null){
        return(<div className="hero-bg" style={{background:'#f1f5f9'}}>
            <div className="nav" style={{background:'#0f172a'}}><div className="nav-logo" style={{color:'white'}}>🏓 PICKLECONNECT</div></div>
            <ProfileSetup user={user} profile={null} onSave={p=>setProfile({uid:user.uid,...p})}/>
        </div>);
    }

    // ── Guest Banner ──
    const GuestBanner=()=>(
        !user&&<div style={{background:'rgba(255,255,255,.1)',backdropFilter:'blur(4px)',margin:'0 16px 12px',borderRadius:12,padding:'10px 14px',display:'flex',alignItems:'center',gap:10,border:'1px solid rgba(255,255,255,.15)'}}>
            <div style={{fontSize:20}}>👋</div>
            <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:700,color:'white'}}>Browsing as guest</div>
                <div style={{fontSize:11,color:'rgba(255,255,255,.6)'}}>Sign in to message players & post availability</div>
            </div>
            <button onClick={()=>setShowAuth(true)} style={{background:'white',color:'#059669',border:'none',borderRadius:8,padding:'7px 14px',fontFamily:'Outfit',fontSize:12,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>Sign In →</button>
        </div>
    );

    return(
        <div className="hero-bg" style={{paddingBottom:80}}>
            {/* Dev banner */}
            <div className="dev-banner">
                <span className="dev-tag">LOCAL TEST</span>
                <span>PickleConnect · Messaging + Auth Gate · Open via <strong>http://</strong> not file://</span>
                <a href="https://console.firebase.google.com/project/pickleball-app-1bba7/firestore" target="_blank" rel="noreferrer">Firestore Console →</a>
            </div>

            {/* Nav */}
            <div className="nav">
                <div className="nav-logo" style={{flex:1}}>🏓 PICKLECONNECT</div>
                {user&&<button onClick={()=>setShowInbox(true)} style={{background:'none',border:'none',cursor:'pointer',position:'relative',padding:4}}>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" strokeWidth="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                    {unread>0&&<div className="badge">{unread}</div>}
                </button>}
                {user&&profile
                    ?<ProfilePill user={user} profile={profile} onEdit={()=>setShowProfile(true)} onSignOut={signOut}/>
                    :<button onClick={()=>setShowAuth(true)} style={{background:'rgba(255,255,255,.15)',border:'1.5px solid rgba(255,255,255,.3)',borderRadius:20,padding:'5px 14px',color:'white',fontFamily:'Outfit',fontSize:12,fontWeight:700,cursor:'pointer'}}>Sign In</button>
                }
            </div>

            <div className="content">
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
                    <div className="page-title">Find Players</div>
                    {user&&profile&&<button className="post-btn" onClick={()=>{setEditP(null);setShowPost(true);}}>📢 Post</button>}
                </div>

                <GuestBanner/>

                {/* Search */}
                <div style={{display:'flex',gap:10,marginBottom:12,alignItems:'center'}}>
                    <div style={{position:'relative',flex:1}}>
                        <svg style={{position:'absolute',left:14,top:'50%',transform:'translateY(-50%)'}} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                        <input className="search-input" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search name, court, city…"/>
                    </div>
                    <button className={`filter-btn ${showF||fCount?'active':''}`} onClick={()=>setShowF(!showF)}>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
                        Filter{fCount>0&&` (${fCount})`}
                    </button>
                </div>

                {showF&&<div className="fp">
                    <div><div className="fp-label">Skill Level</div><div className="fp-pills"><button className={`fp-pill ${!fSkill?'s':''}`} onClick={()=>setFS('')}>All</button>{SKILLS.map(s=><button key={s} className={`fp-pill ${fSkill===s?'s':''}`} onClick={()=>setFS(fSkill===s?'':s)}>{s}</button>)}</div></div>
                    <div><div className="fp-label">Play Type</div><div className="fp-pills"><button className={`fp-pill ${!fType?'s':''}`} onClick={()=>setFT('')}>All</button>{PTYPES.map(t=><button key={t} className={`fp-pill ${fType===t?'s':''}`} onClick={()=>setFT(fType===t?'':t)}>{PT_E[t]} {t}</button>)}</div></div>
                    <div><div className="fp-label">Looking For</div><div className="fp-pills"><button className={`fp-pill ${!fPurpose?'s':''}`} onClick={()=>setFP('')}>All</button>{PURPOSES.map(p=><button key={p.id} className={`fp-pill ${fPurpose===p.id?'s':''}`} onClick={()=>setFP(fPurpose===p.id?'':p.id)}>{p.emoji} {p.label}</button>)}</div></div>
                    <div><div className="fp-label">Gender</div><div className="fp-pills" style={{marginBottom:0}}><button className={`fp-pill ${!fGender?'s':''}`} onClick={()=>setFG('')}>All</button>{['Male','Female','Non-binary'].map(g=><button key={g} className={`fp-pill ${fGender===g?'s':''}`} onClick={()=>setFG(fGender===g?'':g)}>{g}</button>)}</div></div>
                    {fCount>0&&<div style={{marginTop:10,textAlign:'right'}}><button onClick={clearF} style={{background:'none',border:'none',color:'#fca5a5',fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'Outfit'}}>✕ Clear all</button></div>}
                </div>}

                {/* Tabs */}
                <div style={{display:'flex',gap:0,marginBottom:12,background:'rgba(255,255,255,.1)',borderRadius:10,padding:3}}>
                    {[['players','🏓 All'],['now','⚡ Now'],['nearby','📍 Nearby']].map(([k,l])=>
                        <button key={k} onClick={()=>setTab(k)} style={{flex:1,padding:'8px',border:'none',borderRadius:8,fontFamily:'Outfit',fontSize:12,fontWeight:600,cursor:'pointer',background:tab===k?'white':'transparent',color:tab===k?'#059669':'rgba(255,255,255,.7)',boxShadow:tab===k?'0 1px 4px rgba(0,0,0,.1)':'none'}}>{l}</button>
                    )}
                </div>

                <div style={{fontSize:12,color:'rgba(255,255,255,.5)',marginBottom:10,paddingLeft:2}}>{grouped.length} player{grouped.length!==1?'s':''}</div>

                {/* Player list */}
                {loading?[1,2,3].map(i=><Skel key={i}/>)
                :grouped.length===0
                    ?<div style={{textAlign:'center',padding:'40px 16px'}}>
                        <div style={{fontSize:40,marginBottom:8}}>🏓</div>
                        <div style={{fontSize:16,fontWeight:700,color:'white',marginBottom:4}}>No players found</div>
                        <div style={{fontSize:13,color:'rgba(255,255,255,.6)',marginBottom:16}}>{search||fCount?'Try different filters':'Be the first to post!'}</div>
                        {(search||fCount>0)?<button onClick={()=>{setSearch('');clearF();}} style={{background:'rgba(255,255,255,.15)',border:'none',borderRadius:10,padding:'8px 20px',color:'white',fontWeight:600,fontSize:13,cursor:'pointer',fontFamily:'Outfit'}}>Clear Filters</button>
                        :user&&profile&&<button className="btn-g" onClick={()=>{setEditP(null);setShowPost(true);}}>📢 Post Availability</button>}
                    </div>
                :grouped.map(g=>
                    <PlayerCard
                        key={g.uid}
                        g={g}
                        currentUser={user}
                        uLat={uLat} uLng={uLng}
                        onChat={setChatP}
                        onNeedLogin={handleNeedLogin}
                        onEdit={p=>{setEditP(p);setShowPost(true);}}
                        onRemove={async id=>{if(confirm('Remove this post?'))try{await db.collection('findPlayers').doc(id).update({status:'removed'});}catch(e){alert(e.message);}}}
                        expanded={expanded===g.uid}
                        onToggle={()=>setExpanded(expanded===g.uid?null:g.uid)}
                    />
                )}

                {/* Bottom page nav links */}
                <div style={{display:'flex',gap:8,marginTop:16}}>
                    <a href="index.html" style={{flex:1,display:'flex',alignItems:'center',gap:10,background:'linear-gradient(135deg,#1e40af,#3b82f6)',borderRadius:12,padding:'14px 16px',textDecoration:'none'}}>
                        <span style={{fontSize:22}}>🏟️</span>
                        <div><div className="fd" style={{fontSize:14,fontWeight:800,color:'white'}}>COURTS</div><div style={{fontSize:10,color:'rgba(255,255,255,.7)'}}>Find courts</div></div>
                    </a>
                    <a href="tournament.html" style={{flex:1,display:'flex',alignItems:'center',gap:10,background:'linear-gradient(135deg,#7c3aed,#a78bfa)',borderRadius:12,padding:'14px 16px',textDecoration:'none'}}>
                        <span style={{fontSize:22}}>🏆</span>
                        <div><div className="fd" style={{fontSize:14,fontWeight:800,color:'white'}}>TOURNAMENTS</div><div style={{fontSize:10,color:'rgba(255,255,255,.7)'}}>Brackets</div></div>
                    </a>
                </div>
            </div>

            {/* ── Bottom Nav ── */}
            <div className="bottom-nav">
                <button className="bn-item" onClick={()=>window.location='index.html'}>
                    <div className="bn-icon">🏟</div>
                    <div className="bn-label">Courts</div>
                </button>
                <button className="bn-item" onClick={()=>window.location='findgame.html'}>
                    <div className="bn-icon">🎮</div>
                    <div className="bn-label">Games</div>
                </button>
                <div className="bn-gap"/>
                <button className="bn-item active">
                    <div className="bn-icon">👥</div>
                    <div className="bn-label">Players</div>
                </button>
                <button className="bn-item" onClick={()=>user?setShowProfile(true):setShowAuth(true)}>
                    <div className="bn-icon">{user?'👤':'🔑'}</div>
                    <div className="bn-label">{user?'Profile':'Sign In'}</div>
                </button>
            </div>

            {/* ── FAB ── */}
            <div className="fab-wrap">
                <button className={`fab-main ${showFab?'open':''}`} onClick={()=>setShowFab(!showFab)}>
                    {showFab?'✕ Close':'🏓 I WANT TO PLAY'}
                </button>
            </div>

            {/* ── FAB Sheet ── */}
            {showFab&&<FabSheet
                onClose={()=>setShowFab(false)}
                currentUser={user}
                onWantToPlay={handleFabGame}
                onAvailable={handleFabAvailable}
                onQueue={handleFabQueue}
            />}

            {/* ── Auth Login Prompt (guest tapped Message) ── */}
            {loginPromptPlayer!==null&&<LoginPrompt
                targetPlayer={loginPromptPlayer}
                onClose={()=>setLoginPromptPlayer(null)}
                onLogin={handleLoginPromptConfirm}
            />}

            {/* ── Show Auth Screen (full page overlay) ── */}
            {showAuth&&(
                <div style={{position:'fixed',inset:0,zIndex:400,animation:'fadeIn .2s'}}>
                    <AuthScreen/>
                    <button onClick={()=>setShowAuth(false)} style={{position:'fixed',top:16,right:16,background:'rgba(255,255,255,.2)',border:'none',borderRadius:50,width:36,height:36,color:'white',fontSize:18,cursor:'pointer',zIndex:401,display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
                </div>
            )}

            {/* ── Modals ── */}
            {showPost&&user&&profile&&<PostForm profile={profile} onClose={()=>{setShowPost(false);setEditP(null);}} onPosted={()=>{setShowPost(false);setEditP(null);}} editData={editP} uLat={uLat} uLng={uLng}/>}
            {chatP&&user&&profile&&<ChatModal player={chatP} myUid={user.uid} myName={profile.name} onClose={()=>setChatP(null)}/>}
            {showInbox&&user&&<Inbox onClose={()=>setShowInbox(false)} onOpen={setChatP} myUid={user.uid} players={posts}/>}
            {showProfile&&user&&profile&&<ProfileSetup user={user} profile={profile} onSave={p=>{setProfile({uid:user.uid,...p});setShowProfile(false);}} onClose={()=>setShowProfile(false)}/>}
        </div>
    );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
