        .sb{display:flex;align-items:center;gap:5px;padding:6px 10px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;font-size:11px;color:#059669;font-weight:600;}

        @keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}

<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef,useMemo,useCallback}=React;

const FB={apiKey:"AIzaSyDaFUszTD0-Ro292GOBSlS5vkZSdJM0NF4",authDomain:"pickleball-app-1bba7.firebaseapp.com",projectId:"pickleball-app-1bba7",storageBucket:"pickleball-app-1bba7.firebasestorage.app",messagingSenderId:"645604154338",appId:"1:645604154338:web:b92f87c2cd11d950b737bb"};
let db=null,auth=null,fbOk=false;
try{if(!firebase.apps.length)firebase.initializeApp(FB);db=firebase.firestore();auth=firebase.auth();fbOk=true;}catch(e){console.error('FB:',e);}

// Strip undefined values so Firestore never rejects the write
function sanitize(obj){const r={};for(const k in obj){const v=obj[k];if(v!==undefined)r[k]=v;}return r;}

function haversine(a,b,c,d){const R=3958.8,dL=(c-a)*Math.PI/180,dN=(d-b)*Math.PI/180,x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dN/2)**2;return R*2*Math.asin(Math.sqrt(x));}
function timeAgo(t){if(!t)return '';const d=Date.now()-t,m=Math.floor(d/60000);if(m<1)return 'now';if(m<60)return m+'m';const h=Math.floor(m/60);if(h<24)return h+'h';return Math.floor(h/24)+'d';}
function fmtTime(ts){if(!ts)return '';const[h,m]=ts.split(':').map(Number);return `${h%12||12}:${m.toString().padStart(2,'0')}${h>=12?'PM':'AM'}`;}
function cid(a,b){return[a,b].sort().join('__');}

// Auto-cleanup posts older than 7 days
async function cleanOldPosts(uid){
    if(!fbOk||!uid)return;
    const cutoff=Date.now()-7*24*60*60*1000;
    try{
        const snap=await db.collection('findPlayers').where('uid','==',uid).where('timestamp','<',cutoff).get();
        const batch=db.batch();
        snap.docs.forEach(d=>batch.update(d.ref,{status:'expired'}));
        if(!snap.empty)await batch.commit();
    }catch(e){}
}

const SKILLS=['2.0-2.5','2.5-3.0','3.0-3.5','3.5-4.0','4.0-4.5','4.5-5.0','5.0+'];
const SKILL_L={'2.0-2.5':'Beginner','2.5-3.0':'Novice','3.0-3.5':'Intermediate','3.5-4.0':'Advanced','4.0-4.5':'Competitive','4.5-5.0':'Expert','5.0+':'Pro'};
const PTYPES=['Casual','Competitive','Tournament','Drilling','League'];
const PT_E={'Casual':'🎾','Competitive':'🔥','Tournament':'🏆','Drilling':'🎯','League':'🏅'};
const AVAIL=['Now','Today','This Week','Custom Schedule'];
const PURPOSES=[{id:'play',label:'Looking to Play',emoji:'🏓'},{id:'partner',label:'Need a Partner',emoji:'🤝'},{id:'drill',label:'Drilling Session',emoji:'🎯'},{id:'group',label:'Group / Open Play',emoji:'👥'}];
const PU_TAG={'play':'t-green','partner':'t-blue','drill':'t-purple','group':'t-amber'};
const AV_CLS={'Now':'avail-now','Today':'avail-later','This Week':'avail-later','Custom Schedule':'avail-flex'};
const AV_ICO={'Now':'⚡','Today':'📅','This Week':'🗓️','Custom Schedule':'📆'};
const DAYS_SHORT=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYS_FULL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const GENDERS=['Male','Female','Non-binary','Any'];

// ── Auth Screen ─────────────────────────────────────────────────────
function AuthScreen(){
    const[mode,setMode]=useState('signin');
    const[email,setEmail]=useState('');const[pass,setPass]=useState('');const[confirm,setConfirm]=useState('');
    const[ld,setLd]=useState(false);const[err,setErr]=useState(null);
    const isFile=window.location.protocol==='file:';

    const googleAuth=async()=>{
        if(isFile){setErr('Open from a web server (http/https), not a local file.');return;}
        setLd(true);setErr(null);
        const prov=new firebase.auth.GoogleAuthProvider();
        try{await auth.signInWithRedirect(prov);}
        catch(e){setErr(e.message);setLd(false);}
    };
    const emailAuth=async()=>{
        if(!email.trim()||!pass){setErr('Enter email and password.');return;}
        if(mode==='signup'&&pass!==confirm){setErr('Passwords do not match.');return;}
        if(mode==='signup'&&pass.length<6){setErr('Password must be at least 6 characters.');return;}
        setLd(true);setErr(null);
        try{
            if(mode==='signup')await auth.createUserWithEmailAndPassword(email.trim(),pass);
            else await auth.signInWithEmailAndPassword(email.trim(),pass);
        }catch(e){
            const msg={'auth/email-already-in-use':'Account already exists. Sign in instead.','auth/user-not-found':'No account found.','auth/wrong-password':'Incorrect password.','auth/invalid-email':'Invalid email.','auth/too-many-requests':'Too many attempts. Try again later.'}[e.code]||e.message;
            setErr(msg);
        }
        setLd(false);
    };
    return(<div className="hero-bg">
        <div style={{padding:'14px 18px',display:'flex',alignItems:'center',gap:12}}>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:800,color:'white'}}>🏓 PICKLECONNECT</div>
        </div>
        <div className="auth-screen">
            <div style={{fontSize:52,marginBottom:10}}>🏓</div>
            <div className="fd" style={{fontSize:32,fontWeight:800,color:'white',marginBottom:6}}>FIND PLAYERS</div>
            <div style={{fontSize:14,color:'rgba(255,255,255,.65)',marginBottom:24,maxWidth:320,lineHeight:1.5}}>Connect with pickleball players near you. Post availability and chat privately.</div>
            <div style={{display:'flex',background:'rgba(255,255,255,.12)',borderRadius:10,padding:3,marginBottom:20,width:'100%',maxWidth:320}}>
                {[['signin','Sign In'],['signup','Sign Up']].map(([k,l])=><button key={k} onClick={()=>{setMode(k);setErr(null);}} style={{flex:1,padding:'8px',border:'none',borderRadius:8,fontFamily:'Outfit',fontSize:13,fontWeight:700,cursor:'pointer',background:mode===k?'white':'transparent',color:mode===k?'#059669':'rgba(255,255,255,.75)',boxShadow:mode===k?'0 1px 4px rgba(0,0,0,.12)':'none'}}>{l}</button>)}
            </div>
            {err&&<div style={{background:'rgba(239,68,68,.15)',border:'1px solid rgba(239,68,68,.3)',borderRadius:10,padding:'10px 14px',marginBottom:14,maxWidth:320,width:'100%',fontSize:12,color:'#fecaca',lineHeight:1.5,textAlign:'left'}}>⚠️ {err}</div>}
            <div style={{width:'100%',maxWidth:320,display:'flex',flexDirection:'column',gap:8}}>
                <input value={email} onChange={e=>setEmail(e.target.value)} type="email" placeholder="Email address" style={{padding:'11px 14px',borderRadius:10,border:'2px solid rgba(255,255,255,.2)',background:'rgba(255,255,255,.12)',color:'white',fontFamily:'Outfit',fontSize:14,outline:'none',width:'100%'}} onKeyDown={e=>e.key==='Enter'&&emailAuth()}/>
                <input value={pass} onChange={e=>setPass(e.target.value)} type="password" placeholder="Password" style={{padding:'11px 14px',borderRadius:10,border:'2px solid rgba(255,255,255,.2)',background:'rgba(255,255,255,.12)',color:'white',fontFamily:'Outfit',fontSize:14,outline:'none',width:'100%'}} onKeyDown={e=>e.key==='Enter'&&emailAuth()}/>
                {mode==='signup'&&<input value={confirm} onChange={e=>setConfirm(e.target.value)} type="password" placeholder="Confirm password" style={{padding:'11px 14px',borderRadius:10,border:'2px solid rgba(255,255,255,.2)',background:'rgba(255,255,255,.12)',color:'white',fontFamily:'Outfit',fontSize:14,outline:'none',width:'100%'}} onKeyDown={e=>e.key==='Enter'&&emailAuth()}/>}
                <button onClick={emailAuth} disabled={ld} style={{padding:'12px',borderRadius:10,border:'none',background:'linear-gradient(135deg,#059669,#10b981)',color:'white',fontFamily:'Outfit',fontSize:14,fontWeight:700,cursor:'pointer',opacity:ld?.6:1}}>{ld?'Please wait…':mode==='signup'?'✅ Create Account':'→ Sign In'}</button>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:10,width:'100%',maxWidth:320,margin:'16px 0'}}>
                <div style={{flex:1,height:1,background:'rgba(255,255,255,.15)'}}/><span style={{fontSize:11,color:'rgba(255,255,255,.4)',fontWeight:600}}>OR</span><div style={{flex:1,height:1,background:'rgba(255,255,255,.15)'}}/>

// ── Week Schedule Picker component ───────────────────────────────────
function WeekSchedulePicker({schedule,onChange}){
    // schedule = [{day:0-6, startTime:'09:00', endTime:'11:00'}, ...]
    const toggle=day=>{
        const exists=schedule.find(s=>s.day===day);
        if(exists)onChange(schedule.filter(s=>s.day!==day));
        else onChange([...schedule,{day,startTime:'08:00',endTime:'11:00'}]);
    };
    const setTime=(day,field,val)=>{
        onChange(schedule.map(s=>s.day===day?{...s,[field]:val}:s));
    };
    return(<div>
        <div className="week-picker">
            {DAYS_SHORT.map((d,i)=>{
                const sel=schedule.find(s=>s.day===i);
                return(<div key={i} className="wp-day">
                    <div className="wp-day-label">{d}</div>
                    <button className={`wp-day-btn${sel?' sel':''}`} onClick={()=>toggle(i)}>{d[0]}</button>
                </div>);
            })}
        </div>
        {schedule.sort((a,b)=>a.day-b.day).map(s=>(
            <div key={s.day} style={{background:'#f0fdf4',borderRadius:10,padding:'8px 12px',marginBottom:6}}>
                <div style={{fontSize:12,fontWeight:700,color:'#059669',marginBottom:6}}>{DAYS_FULL[s.day]}</div>
                <div className="wp-time-row">
                    <div>
                        <div style={{fontSize:10,fontWeight:700,color:'#94a3b8',textTransform:'uppercase',marginBottom:3}}>From</div>
                        <input type="time" className="fi" style={{fontSize:13,padding:'7px 10px'}} value={s.startTime} onChange={e=>setTime(s.day,'startTime',e.target.value)}/>
                    </div>
                    <div>
                        <div style={{fontSize:10,fontWeight:700,color:'#94a3b8',textTransform:'uppercase',marginBottom:3}}>To</div>
                        <input type="time" className="fi" style={{fontSize:13,padding:'7px 10px'}} value={s.endTime} onChange={e=>setTime(s.day,'endTime',e.target.value)}/>
                    </div>
                </div>
            </div>
        ))}
    </div>);
}

// ── Player Picker ────────────────────────────────────────────────────
function PlayerPicker({myUid,onSelect,selected,subtitle}){
    const[players,setPlayers]=useState([]);const[ld,setLd]=useState(true);const[search,setSearch]=useState('');
    useEffect(()=>{
        if(!fbOk){setLd(false);return;}
        // Single-field query — no composite index needed
        db.collection('findPlayers').where('status','==','active').limit(100).get()
            .then(snap=>{
                const byUid={};
                snap.docs.forEach(d=>{const p=d.data();if(p.uid!==myUid&&!byUid[p.uid])byUid[p.uid]=p;});
                setPlayers(Object.values(byUid));setLd(false);
            }).catch(e=>{console.error('PlayerPicker query failed:',e);setLd(false);});
    },[]);
    const filtered=search.trim()
        ?players.filter(p=>[p.name,p.city,p.skill,p.gender].some(v=>(v||'').toLowerCase().includes(search.toLowerCase())))
        :players;
    const toggle=p=>{
        const sel=selected.some(s=>s.uid===p.uid);
        onSelect(sel?selected.filter(s=>s.uid!==p.uid):[...selected,{uid:p.uid,name:p.name,photoURL:p.photoURL||null,skill:p.skill||''}]);
    };
    return(<div>
        {subtitle&&<div style={{fontSize:11,color:'#64748b',marginBottom:8}}>{subtitle}</div>}
        <div style={{position:'relative',marginBottom:8}}>
            <svg style={{position:'absolute',left:9,top:'50%',transform:'translateY(-50%)',pointerEvents:'none'}} width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input style={{width:'100%',padding:'8px 10px 8px 30px',border:'1.5px solid #e2e8f0',borderRadius:9,fontFamily:'Outfit',fontSize:13,outline:'none',color:'#0f172a'}} value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search players..."/>
        </div>
        {selected.length>0&&<div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:8}}>
            {selected.map(s=><div key={s.uid} style={{display:'inline-flex',alignItems:'center',gap:4,background:'#ecfdf5',border:'1px solid #a7f3d0',borderRadius:20,padding:'3px 10px 3px 6px',fontSize:11,fontWeight:600,color:'#059669'}}>
                <div style={{width:18,height:18,borderRadius:'50%',background:'#059669',color:'white',display:'flex',alignItems:'center',justifyContent:'center',fontSize:9,fontWeight:800,flexShrink:0}}>{(s.name||'?')[0].toUpperCase()}</div>
                {s.name.split(' ')[0]}
                <button onClick={()=>onSelect(selected.filter(x=>x.uid!==s.uid))} style={{background:'none',border:'none',cursor:'pointer',color:'#059669',fontSize:14,lineHeight:1,padding:0,marginLeft:1}}>&times;</button>
            </div>)}
        </div>}
        <div style={{maxHeight:190,overflowY:'auto',border:'1px solid #e2e8f0',borderRadius:10,overflow:'hidden'}}>
            {ld?<div style={{padding:14,textAlign:'center',fontSize:12,color:'#94a3b8'}}>Loading...</div>
            :filtered.length===0?<div style={{padding:14,textAlign:'center',fontSize:12,color:'#94a3b8'}}>No players found</div>
            :filtered.slice(0,30).map(p=>{const isSel=selected.some(s=>s.uid===p.uid);return(<div key={p.uid} onClick={()=>toggle(p)} style={{display:'flex',alignItems:'center',gap:9,padding:'9px 12px',cursor:'pointer',background:isSel?'#f0fdf4':'white',borderBottom:'1px solid #f8fafc',transition:'background .1s'}}>
                <div className="av-sm" style={{width:30,height:30,fontSize:11,flexShrink:0}}>{(p.name||'?')[0].toUpperCase()}</div>
                <div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:600,color:'#0f172a',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.name}</div><div style={{fontSize:11,color:'#64748b'}}>{p.skill||''}{p.city?' \u00b7 '+p.city:''}{p.gender?' \u00b7 '+p.gender:''}</div></div>
                {isSel&&<span style={{color:'#059669',fontSize:16,flexShrink:0}}>{'\u2713'}</span>}

// ── Group Manager ─────────────────────────────────────────────────────
function GroupManager({myUid,selectedGroupId,onSelectGroup}){
    const[groups,setGroups]=useState([]);const[ld,setLd]=useState(true);
    const[showCreate,setShowCreate]=useState(false);const[newName,setNN]=useState('');
    const[newMembers,setNM]=useState([]);const[saving,setSaving]=useState(false);

    const load=useCallback(()=>{
        if(!fbOk){setLd(false);return;}
        db.collection('playerGroups').where('ownerUid','==',myUid).orderBy('createdAt','desc').get()
            .then(snap=>{setGroups(snap.docs.map(d=>({id:d.id,...d.data()})));setLd(false);})
            .catch(()=>setLd(false));
    },[myUid]);
    useEffect(()=>load(),[]);

    const create=async()=>{
        if(!newName.trim()){alert('Enter a group name.');return;}
        if(newMembers.length===0){alert('Select at least one player.');return;}
        setSaving(true);
        try{
            await db.collection('playerGroups').add({ownerUid:myUid,name:newName.trim(),members:newMembers,createdAt:Date.now()});
            setNN('');setNM([]);setShowCreate(false);load();
        }catch(e){alert('Failed: '+e.message);}
        setSaving(false);
    };
    const del=async id=>{
        if(!confirm('Delete this group?'))return;
        try{await db.collection('playerGroups').doc(id).delete();load();}catch(e){alert(e.message);}
    };

    if(showCreate)return(<div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
            <div style={{fontSize:13,fontWeight:800,color:'#0f172a'}}>New Group</div>
            <button onClick={()=>setShowCreate(false)} style={{background:'#f1f5f9',border:'none',borderRadius:7,padding:'4px 10px',fontSize:12,cursor:'pointer',color:'#64748b'}}>Cancel</button>
        </div>
        <input className="fi" style={{marginBottom:10,fontSize:13}} value={newName} onChange={e=>setNN(e.target.value)} placeholder="Group name (e.g. Tuesday Crew)" maxLength={50}/>
        <PlayerPicker myUid={myUid} selected={newMembers} onSelect={setNM} subtitle="Select players to add to this group."/>
        <button className="btn-g" onClick={create} disabled={saving} style={{width:'100%',padding:'10px',fontSize:13,marginTop:10,opacity:saving?.6:1}}>{saving?'Saving...':'Create Group'}</button>
    </div>);

    return(<div>
        {ld?<div style={{fontSize:12,color:'#94a3b8',padding:'6px 0'}}>Loading groups...</div>
        :groups.length===0?<div style={{fontSize:12,color:'#94a3b8',marginBottom:8}}>No groups yet.</div>
        :groups.map(g=>(<div key={g.id} onClick={()=>onSelectGroup(selectedGroupId===g.id?null:g)} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 12px',borderRadius:10,border:'2px solid '+(selectedGroupId===g.id?'#059669':'#e2e8f0'),background:selectedGroupId===g.id?'#ecfdf5':'white',cursor:'pointer',marginBottom:6,transition:'all .15s'}}>
            <span style={{fontSize:18}}>&#127991;</span>
            <div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:700,color:'#0f172a'}}>{g.name}</div><div style={{fontSize:11,color:'#64748b'}}>{g.members?.length||0} members</div></div>
            {selectedGroupId===g.id&&<span style={{color:'#059669',fontSize:15}}>{'\u2713'}</span>}
            <button onClick={e=>{e.stopPropagation();del(g.id);}} style={{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:6,padding:'3px 8px',fontSize:11,color:'#dc2626',cursor:'pointer',fontFamily:'Outfit',fontWeight:600}}>Delete</button>
        </div>))}
        <button onClick={()=>setShowCreate(true)} style={{width:'100%',padding:'9px',border:'2px dashed #e2e8f0',borderRadius:10,background:'white',fontSize:13,fontWeight:600,color:'#059669',cursor:'pointer',fontFamily:'Outfit',marginTop:4}}>+ Create New Group</button>
    </div>);
}

// ── Post Form ────────────────────────────────────────────────────────
function PostForm({profile,onClose,onPosted,editData,uLat,uLng}){
    const[purpose,setPurpose]=useState(editData?.purpose||'play');
    const[playTypes,setPT]=useState(editData?.playTypes||[]);
    const[availability,setAv]=useState(editData?.availability||'Flexible');
    const[availDate,setAD]=useState(editData?.availDate||'');
    const[availTime,setAT]=useState(editData?.availTime||'');
    const[weekSchedule,setWS]=useState(editData?.weekSchedule||[]);
    const[courtName,setCourt]=useState(editData?.courtName||'');
    const[message,setMsg]=useState(editData?.message||'');
    const[partnerGender,setPG]=useState(editData?.partnerGender||'');
    // shareMode: 'public' | 'connections' | 'players' | 'group'
    const[shareMode,setShare]=useState(editData?.shareMode||'public');
    const[sharePlayers,setSP]=useState([]);  // for 'players' mode
    const[shareGroup,setSG]=useState(null);  // for 'group' mode
    const[saving,setSaving]=useState(false);
    const togglePT=t=>setPT(p=>p.includes(t)?p.filter(x=>x!==t):[...p,t]);
    const today=new Date().toISOString().split('T')[0];

    const SHARE_MODES=[
        {id:'public',icon:'&#127757;',label:'Everyone'},
        {id:'connections',icon:'&#128101;',label:'Connections'},
        {id:'players',icon:'&#128100;',label:'Select Players'},
        {id:'group',icon:'&#127991;',label:'My Groups'},
    ];
    const shareModeDesc={
        public:'Visible to all PickleConnect players.',
        connections:"Only shown to people you've chatted with before.",
        players:sharePlayers.length>0?`Only shown to ${sharePlayers.length} selected player${sharePlayers.length!==1?'s':''}.`:'Choose specific players below.',
        group:shareGroup?`Members of "${shareGroup.name}" only.`:'Select or create a group below.',
    };

    const save=async()=>{
        if(playTypes.length===0){alert('Select at least one play type.');return;}
        if(availability==='Custom Schedule'&&weekSchedule.length===0){alert('Select at least one day for your schedule.');return;}
        if(shareMode==='players'&&sharePlayers.length===0){alert('Select at least one player to share with.');return;}
        if(shareMode==='group'&&!shareGroup){alert('Select a group to share with.');return;}
        setSaving(true);

        const sharePlayerIds=
            shareMode==='players'?sharePlayers.map(p=>p.uid):
            shareMode==='group'?(shareGroup.members||[]).map(m=>m.uid):[];

        const data={
            uid:profile.uid,name:profile.name,skill:profile.skill,city:profile.city||null,
            age:profile.age||null,gender:profile.gender||null,duprId:profile.duprId||null,
            photoURL:profile.photoURL||null,purpose,playTypes,availability,
            availDate:availability==='Today'||availability==='This Week'?availDate||null:null,
            availTime:availability==='Today'&&availTime?availTime:null,
            weekSchedule:availability==='Custom Schedule'?weekSchedule:[],
            courtName:courtName.trim()||null,message:message.trim()||null,
            partnerGender:purpose==='partner'?(partnerGender||null):null,
            shareMode,sharePlayerIds,
            shareGroupName:shareMode==='group'?(shareGroup?.name||null):null,
            lat:uLat||null,lng:uLng||null,timestamp:Date.now(),status:'active'
        };
        try{
            if(editData?.id){await db.collection('findPlayers').doc(editData.id).update(sanitize(data));}
            else{await db.collection('findPlayers').add(sanitize(data));}
            onPosted();
        }catch(e){alert('Failed: '+e.message);}
        setSaving(false);

    return(<div className="mo" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>

            </div>
            <div style={{fontSize:13,color:'#64748b',marginBottom:14}}>Let others know you're available. You can post multiple times.</div>

            <div style={{display:'flex',alignItems:'center',gap:10,padding:10,background:'#f8fafc',borderRadius:10,marginBottom:14}}>

                <div><div style={{fontSize:13,fontWeight:700}}>{profile.name}</div><div style={{fontSize:11,color:'#64748b'}}>{profile.skill}{profile.gender?' \u00b7 '+profile.gender:''}{profile.city?' \u00b7 '+profile.city:''}</div></div>

                {shareMode==='players'&&<div style={{background:'#f8fafc',borderRadius:10,padding:12}}>
                    <PlayerPicker myUid={profile.uid} selected={sharePlayers} onSelect={setSP} subtitle="Only selected players will see this post."/>

        </div>
    </div>);
}

// ── Chat Modal ───────────────────────────────────────────────────────
function ChatModal({player,myUid,myName,onClose}){
    const[msgs,setMsgs]=useState([]);const[inp,setInp]=useState('');const[sending,setSending]=useState(false);
    const endRef=useRef(null);const c=cid(myUid,player.uid);
    useEffect(()=>{if(!fbOk)return;const u=db.collection('chatMessages').where('convoId','==',c).orderBy('timestamp','asc').onSnapshot(s=>{setMsgs(s.docs.map(d=>({id:d.id,...d.data()})));setTimeout(()=>endRef.current?.scrollIntoView({behavior:'smooth'}),100);},e=>console.error(e));return()=>u();},[c]);
    const send=async()=>{if(!inp.trim()||sending)return;setSending(true);const now=Date.now(),txt=inp.trim();
        try{
            const ref=db.collection('conversations').doc(c);
            const convoData={participants:[myUid,player.uid].sort(),participantNames:{[myUid]:myName,[player.uid]:player.name},lastMessage:txt,lastMessageBy:myUid,lastTimestamp:now,[`readBy_${myUid}`]:now};
            try{await ref.set({...convoData,createdAt:now});}catch(createErr){await ref.update({lastMessage:txt,lastMessageBy:myUid,lastTimestamp:now,[`readBy_${myUid}`]:now});}
            await db.collection('chatMessages').add({convoId:c,text:txt,senderUid:myUid,senderName:myName,timestamp:now});
            setInp('');
            if(window.__pcnPlaySound)window.__pcnPlaySound('message');
        }catch(e){alert('Send failed: '+e.message);}setSending(false);};
    return(<div className="mo" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
        <div className="ms" style={{display:'flex',flexDirection:'column',height:'80vh',padding:0}}>
            <div style={{padding:'12px 16px',borderBottom:'1px solid #e2e8f0',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
                <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer'}}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" strokeWidth="2.5"><path d="M15 18l-6-6 6-6"/></svg></button>
                <div className="av-sm">{(player.name||'?')[0].toUpperCase()}</div>
                <div style={{flex:1}}><div style={{fontWeight:700,fontSize:14}}>{player.name}</div><div style={{fontSize:11,color:'#64748b'}}>{player.skill}</div></div>
                <div className="sb" style={{padding:'3px 7px',fontSize:10}}>🔒 Private</div>
            </div>
            <div style={{flex:1,overflowY:'auto',padding:'12px 16px',display:'flex',flexDirection:'column',gap:3}}>
                {msgs.length===0&&<div style={{textAlign:'center',padding:'30px',color:'#94a3b8'}}><div style={{fontSize:28,marginBottom:6}}>💬</div><div style={{fontSize:13}}>Say hi to {player.name}!</div></div>}
                {msgs.map(m=><div key={m.id} style={{display:'flex',flexDirection:'column',alignItems:m.senderUid===myUid?'flex-end':'flex-start'}}><div className={`cb ${m.senderUid===myUid?'me':'them'}`}>{m.text}<div className="ct">{timeAgo(m.timestamp)}</div></div></div>)}
                <div ref={endRef}/>
            </div>
            <div style={{padding:'10px 16px',borderTop:'1px solid #e2e8f0',display:'flex',gap:8,alignItems:'flex-end',flexShrink:0,background:'white'}}>
                <textarea value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}} placeholder="Message…" rows={1} style={{flex:1,padding:'9px 12px',border:'2px solid #e2e8f0',borderRadius:10,fontFamily:'Outfit,sans-serif',fontSize:14,resize:'none',outline:'none',maxHeight:70}}/>
                <button className="btn-g" onClick={send} disabled={sending||!inp.trim()} style={{padding:'9px 14px',fontSize:13,opacity:(sending||!inp.trim())?.5:1}}>Send</button>
            </div>
        </div></div>);

// ── Main App ─────────────────────────────────────────────────────────
function App(){
    const[user,setUser]=useState(undefined);const[profile,setProfile]=useState(undefined);
    const[posts,setPosts]=useState([]);const[loading,setLoading]=useState(true);
    const[uLat,setULat]=useState(null);const[uLng,setULng]=useState(null);
    const[showPost,setShowPost]=useState(false);const[editP,setEditP]=useState(null);
    const[chatP,setChatP]=useState(null);const[showInbox,setShowInbox]=useState(false);
    const[showProfile,setShowProfile]=useState(false);
    const[search,setSearch]=useState('');const[tab,setTab]=useState('all');const[expanded,setExpanded]=useState(null);
    const[showF,setShowF]=useState(false);
    const[fSkill,setFS]=useState('');const[fType,setFT]=useState('');const[fGender,setFG]=useState('');
    const[fPurpose,setFP]=useState('');const[fDist,setFD]=useState('');
    const clearF=()=>{setFS('');setFT('');setFG('');setFP('');setFD('');};
    const fCount=[fSkill,fType,fGender,fPurpose,fDist].filter(Boolean).length;

    useEffect(()=>{window.__pcnOpenProfile=()=>setShowProfile(true);window.__pcnOpenInbox=()=>setShowInbox(true);if(new URLSearchParams(window.location.search).get('inbox')==='1'){setTimeout(()=>setShowInbox(true),250);}return()=>{delete window.__pcnOpenProfile;delete window.__pcnOpenInbox;};},[]);

    useEffect(()=>{if(!auth)return;auth.getRedirectResult().catch(()=>{});const u=auth.onAuthStateChanged(u=>{setUser(u||null);if(!u)setProfile(null);});return()=>u();},[]);
    useEffect(()=>{if(user===undefined||user===null)return;setProfile(undefined);if(!fbOk)return;const u=db.collection('profiles').doc(user.uid).onSnapshot(d=>{if(d.exists)setProfile({uid:user.uid,...d.data()});else setProfile(null);},()=>setProfile(null));return()=>u();},[user]);
    useEffect(()=>{if(user?.uid){cleanOldPosts(user.uid);};},[user]);
    useEffect(()=>{if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{setULat(p.coords.latitude);setULng(p.coords.longitude);},()=>{},{enableHighAccuracy:false,timeout:8000,maximumAge:300000});},[]);
    useEffect(()=>{if(!fbOk){setLoading(false);return;}const u=db.collection('findPlayers').where('status','==','active').orderBy('timestamp','desc').onSnapshot(s=>{setPosts(s.docs.map(d=>({id:d.id,...d.data()})));setLoading(false);},()=>setLoading(false));return()=>u();},[]);

    const grouped=useMemo(()=>{
        let fp=[...posts];
        // Apply share mode filter (connections only visible to those who have chatted)
        if(user){fp=fp.filter(p=>{if(!p.shareMode||p.shareMode==='public')return true;if(p.uid===user.uid)return true;if(p.shareMode==='connections')return false;if(p.shareMode==='players'||p.shareMode==='group')return(p.sharePlayerIds||[]).includes(user.uid);return true;});}
        if(tab==='nearby'&&uLat)fp=fp.filter(p=>p.lat&&haversine(uLat,uLng,p.lat,p.lng)<=25);
        else if(tab==='now')fp=fp.filter(p=>p.availability==='Now'||p.availability==='Today');
        else if(tab==='partner')fp=fp.filter(p=>p.purpose==='partner');
        if(search.trim()){const q=search.toLowerCase();fp=fp.filter(p=>[p.name,p.courtName,p.city,p.message,p.skill,p.gender].some(v=>(v||'').toLowerCase().includes(q)));}
        if(fSkill)fp=fp.filter(p=>p.skill===fSkill);
        if(fType)fp=fp.filter(p=>p.playTypes?.includes(fType));
        if(fGender)fp=fp.filter(p=>p.gender===fGender||(fGender==='Female'&&p.partnerGender==='Female'));
        if(fPurpose)fp=fp.filter(p=>p.purpose===fPurpose);
        if(fDist&&uLat)fp=fp.filter(p=>p.lat&&haversine(uLat,uLng,p.lat,p.lng)<=parseInt(fDist));

        const map={};
        fp.forEach(p=>{
            if(!map[p.uid])map[p.uid]={uid:p.uid,name:p.name,skill:p.skill,city:p.city,age:p.age,gender:p.gender,duprId:p.duprId,photoURL:p.photoURL,lat:p.lat,lng:p.lng,posts:[]};
            map[p.uid].posts.push(p);
            if(p.timestamp>(map[p.uid]._ts||0)){map[p.uid]._ts=p.timestamp;Object.assign(map[p.uid],{name:p.name,skill:p.skill,city:p.city,photoURL:p.photoURL,duprId:p.duprId});}
        });
        let arr=Object.values(map);
        arr.sort((a,b)=>{if(user&&a.uid===user.uid)return -1;if(user&&b.uid===user.uid)return 1;if(tab==='nearby'&&uLat&&a.lat&&b.lat)return haversine(uLat,uLng,a.lat,a.lng)-haversine(uLat,uLng,b.lat,b.lng);return(b._ts||0)-(a._ts||0);});
        return arr;
    },[posts,tab,search,fSkill,fType,fGender,fPurpose,fDist,uLat,uLng,user]);

    const signOut=async()=>{if(confirm('Sign out?'))await auth.signOut();};
    if(user===undefined||profile===undefined)return(<div className="hero-bg"><div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',color:'white'}}>Loading…</div></div>);
    if(!user)return <AuthScreen/>;
    if(profile===null)return(<div className="hero-bg"><ProfileSetup user={user} profile={null} onSave={p=>setProfile({uid:user.uid,...p})}/></div>);

    return(
        <div className="hero-bg">
            <div className="content">
                {/* Header row */}
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
                    <div className="page-title">Find Players</div>
                    <button className="post-btn" onClick={()=>{setEditP(null);setShowPost(true);}}>📢 Post</button>
                </div>

                {/* Search + Filter */}
                <div style={{display:'flex',gap:8,marginBottom:10,alignItems:'center'}}>
                    <div style={{position:'relative',flex:1}}>
                        <svg style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)'}} width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                        <input className="search-input" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search name, court, city…"/>
                    </div>
                    <button className={`filter-btn ${(showF||fCount)?'active':''}`} onClick={()=>setShowF(!showF)}>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
                        Filter{fCount>0&&` (${fCount})`}
                    </button>
                </div>

                {/* Filters panel */}
                {showF&&<div className="fp" style={{animation:'fadeIn .2s'}}>
                    <div><div className="fp-label">Skill Level</div><div className="fp-pills"><button className={`fp-pill ${!fSkill?'s':''}`} onClick={()=>setFS('')}>All</button>{SKILLS.map(s=><button key={s} className={`fp-pill ${fSkill===s?'s':''}`} onClick={()=>setFS(fSkill===s?'':s)}>{s}</button>)}</div></div>
                    <div><div className="fp-label">Gender</div><div className="fp-pills"><button className={`fp-pill ${!fGender?'s':''}`} onClick={()=>setFG('')}>Any</button>{['Male','Female','Non-binary'].map(g=><button key={g} className={`fp-pill ${fGender===g?'s':''}`} onClick={()=>setFG(fGender===g?'':g)}>{g}</button>)}</div></div>
                    <div><div className="fp-label">Looking For</div><div className="fp-pills"><button className={`fp-pill ${!fPurpose?'s':''}`} onClick={()=>setFP('')}>All</button>{PURPOSES.map(p=><button key={p.id} className={`fp-pill ${fPurpose===p.id?'s':''}`} onClick={()=>setFP(fPurpose===p.id?'':p.id)}>{p.emoji} {p.label}</button>)}</div></div>
                    <div><div className="fp-label">Play Type</div><div className="fp-pills"><button className={`fp-pill ${!fType?'s':''}`} onClick={()=>setFT('')}>All</button>{PTYPES.map(t=><button key={t} className={`fp-pill ${fType===t?'s':''}`} onClick={()=>setFT(fType===t?'':t)}>{PT_E[t]} {t}</button>)}</div></div>
                    {uLat&&<div><div className="fp-label">Distance</div><div className="fp-pills"><button className={`fp-pill ${!fDist?'s':''}`} onClick={()=>setFD('')}>Any</button>{['5','10','25','50'].map(d=><button key={d} className={`fp-pill ${fDist===d?'s':''}`} onClick={()=>setFD(fDist===d?'':d)}>Within {d} mi</button>)}</div></div>}
                    {fCount>0&&<div style={{marginTop:8,textAlign:'right'}}><button onClick={clearF} style={{background:'none',border:'none',color:'#fca5a5',fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'Outfit'}}>✕ Clear all</button></div>}
                </div>}

                {/* Tabs */}
                <div style={{display:'flex',gap:0,marginBottom:12,background:'rgba(255,255,255,.1)',borderRadius:10,padding:3}}>
                    {[['all','🏓 All'],['now','⚡ Now'],['partner','🤝 Partner'],['nearby','📍 Nearby']].map(([k,l])=><button key={k} onClick={()=>setTab(k)} style={{flex:1,padding:'7px 2px',border:'none',borderRadius:8,fontFamily:'Outfit',fontSize:11,fontWeight:600,cursor:'pointer',background:tab===k?'white':'transparent',color:tab===k?'#059669':'rgba(255,255,255,.7)',boxShadow:tab===k?'0 1px 4px rgba(0,0,0,.1)':'none'}}>{l}</button>)}
                </div>

                <div style={{fontSize:12,color:'rgba(255,255,255,.5)',marginBottom:10,paddingLeft:2}}>{grouped.length} player{grouped.length!==1?'s':''}</div>

                {loading?[1,2,3].map(i=><Skel key={i}/>)
                :grouped.length===0?(<div style={{textAlign:'center',padding:'40px 16px'}}>
                    <div style={{fontSize:40,marginBottom:8}}>🏓</div>
                    <div style={{fontSize:16,fontWeight:700,color:'white',marginBottom:4}}>No players found</div>
                    <div style={{fontSize:13,color:'rgba(255,255,255,.6)',marginBottom:14}}>{search||fCount?'Try different filters':'Be the first!'}</div>
                    {(search||fCount>0)?<button onClick={()=>{setSearch('');clearF();}} style={{background:'rgba(255,255,255,.15)',border:'none',borderRadius:10,padding:'8px 18px',color:'white',fontWeight:600,fontSize:13,cursor:'pointer',fontFamily:'Outfit'}}>Clear</button>:<button className="btn-g" onClick={()=>setShowPost(true)}>📢 Post</button>}
                </div>)
                :grouped.map(g=><PlayerCard key={g.uid} g={g} myUid={user.uid} uLat={uLat} uLng={uLng} onChat={setChatP} onEdit={p=>{setEditP(p);setShowPost(true);}} onRemove={async id=>{if(confirm('Remove this post?'))try{await db.collection('findPlayers').doc(id).update({status:'removed'});}catch(e){alert(e.message);}}} expanded={expanded===g.uid} onToggle={()=>setExpanded(expanded===g.uid?null:g.uid)}/>)}
            </div>

            <button className="fab" onClick={()=>{setEditP(null);setShowPost(true);}}>+</button>
            {showPost&&<PostForm profile={profile} onClose={()=>{setShowPost(false);setEditP(null);}} onPosted={()=>{setShowPost(false);setEditP(null);}} editData={editP} uLat={uLat} uLng={uLng}/>}
            {chatP&&<ChatModal player={chatP} myUid={user.uid} myName={profile.name} onClose={()=>setChatP(null)}/>}
            {showInbox&&<Inbox onClose={()=>setShowInbox(false)} onOpen={setChatP} myUid={user.uid} players={posts}/>}
            {showProfile&&<ProfileSetup user={user} profile={profile} onSave={p=>{setProfile({uid:user.uid,...p});setShowProfile(false);}} onClose={()=>setShowProfile(false)}/>}
        </div>
    );
}
ReactDOM.render(<App/>,document.getElementById('root'));
</script>
<script src="nav.js"></script>
</body>
</html>
