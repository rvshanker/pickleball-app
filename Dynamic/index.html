<meta name="theme-color" content="#0D1B2A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --green:#2ECC71;--green-dark:#27AE60;--green-dim:rgba(46,204,113,0.12);
  --navy:#0D1B2A;--navy2:#142232;--card:#1A2B3C;--card2:#1F3347;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --text:#F0F4F8;--muted:#7A9BB5;--muted2:rgba(122,155,181,0.5);
  --accent:#F7C948;--blue:#5B9BF7;--red:#F75B5B;
  --nav-h:62px;
}
html,body,#root{height:100%;overflow:hidden;}
body{padding-top:0!important;padding-bottom:0!important;}
body{font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--text);font-size:15px;-webkit-text-size-adjust:100%;}

/* Layout shell — sits between nav bars injected by nav.js */
.app-shell{display:flex;flex-direction:column;position:fixed;top:54px;left:0;right:0;bottom:62px;max-width:480px;margin:0 auto;background:var(--navy);}
.screen-body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:16px;}
.screen-body::-webkit-scrollbar{display:none;}
.top-bar{display:none!important;}
.bottom-nav{display:none!important;}

/* Buttons */
.btn{padding:11px 20px;border-radius:12px;border:none;font-family:'DM Sans',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:7px;justify-content:center;}
.btn-primary{background:linear-gradient(135deg,#2ECC71,#27AE60);color:white;box-shadow:0 4px 14px rgba(46,204,113,0.35);}
.btn-primary:hover{opacity:.9;}
.btn-ghost{background:transparent;color:var(--green);border:1.5px solid rgba(46,204,113,0.35);}
.btn-ghost:hover{background:var(--green-dim);}
.btn-danger{background:rgba(247,91,91,0.12);color:var(--red);border:1px solid rgba(247,91,91,0.2);}
.btn-sm{padding:7px 14px;font-size:0.78rem;border-radius:10px;}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:0.9rem;cursor:pointer;position:relative;flex-shrink:0;transition:background .15s;}
.icon-btn:hover{background:var(--card2);}
.badge-dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;border-radius:8px;background:#ef4444;color:white;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px;border:1.5px solid var(--navy);}

/* Modal overlay — z-index above nav.js (9900) */
.modal-overlay{position:fixed;inset:0;background:rgba(5,10,18,0.82);backdrop-filter:blur(8px);z-index:9950;display:flex;align-items:flex-end;justify-content:center;}
.modal-sheet{background:var(--navy2);border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:20px 20px 90px;animation:slideUp .28s ease;}
.modal-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 18px;}
.modal-title{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;margin-bottom:4px;}

/* Forms */
.fi{width:100%;padding:11px 14px;background:var(--card2);border:1px solid var(--border2);border-radius:12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.9rem;outline:none;transition:border-color .15s;}
.fi:focus{border-color:rgba(46,204,113,0.5);}
.fi::placeholder{color:var(--muted2);}
select.fi{-webkit-appearance:none;cursor:pointer;}
textarea.fi{resize:vertical;min-height:60px;}
.fl{display:block;font-size:0.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;}
.fg{margin-bottom:14px;}
.og{display:flex;gap:6px;flex-wrap:wrap;}
.ob{padding:6px 13px;border-radius:10px;border:1px solid var(--border2);background:transparent;font-family:'DM Sans',sans-serif;font-size:0.78rem;font-weight:600;cursor:pointer;color:var(--muted);transition:all .15s;}
.ob.s{border-color:rgba(46,204,113,0.4);background:var(--green-dim);color:var(--green);}

/* Tags */
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;font-size:0.65rem;font-weight:600;white-space:nowrap;}
.t-green{background:rgba(46,204,113,0.12);color:var(--green);}
.t-amber{background:rgba(247,201,72,0.12);color:var(--accent);}
.t-blue{background:rgba(91,155,247,0.12);color:var(--blue);}
.t-muted{background:rgba(122,155,181,0.12);color:var(--muted);}
.t-red{background:rgba(247,91,91,0.12);color:var(--red);}

/* Cards */
.court-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .15s;}
.court-card:hover{border-color:var(--border2);}
.court-icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#3a7d44,#2ECC71);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}
.court-info{flex:1;min-width:0;}
.court-info h4{font-size:0.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.court-info p{font-size:0.68rem;color:var(--muted);margin-top:3px;}
.court-badge{font-size:0.62rem;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.badge-open{background:rgba(46,204,113,0.15);color:var(--green);}
.badge-busy{background:rgba(247,201,72,0.15);color:var(--accent);}
.badge-full{background:rgba(247,91,91,0.15);color:var(--red);}

/* Player card */
.player-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color .15s;}
.player-card.expanded{border-color:rgba(46,204,113,0.3);}
.pc-row{display:flex;align-items:center;gap:12px;}
.pc-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#1F3347,#2ECC71);display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;color:white;flex-shrink:0;overflow:hidden;}
.pc-info{flex:1;min-width:0;}
.pc-name{font-weight:700;font-size:0.9rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.pc-sub{font-size:0.7rem;color:var(--muted);margin-top:2px;}
.pc-skill{background:var(--green-dim);border:1px solid rgba(46,204,113,0.2);color:var(--green);font-size:0.65rem;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.pc-expand{border-top:1px solid var(--border);margin-top:12px;padding-top:12px;}

/* Filter pills */
.fp-label{font-size:0.65rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
.fp-pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
.fp-pill{padding:5px 11px;border-radius:8px;border:1.5px solid var(--border2);background:transparent;font-family:'DM Sans',sans-serif;font-size:0.72rem;font-weight:600;cursor:pointer;color:var(--muted);}
.fp-pill.s{background:var(--green-dim);color:var(--green);border-color:rgba(46,204,113,0.4);}

/* Tab pills */
.tab-pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:16px;padding-bottom:2px;}
.tab-pills::-webkit-scrollbar{display:none;}
.pill{padding:6px 14px;border-radius:20px;font-size:0.72rem;font-weight:600;white-space:nowrap;border:1px solid var(--border);color:var(--muted);background:var(--card);cursor:pointer;flex-shrink:0;transition:all .15s;}
.pill.active{background:var(--green-dim);border-color:rgba(46,204,113,0.35);color:var(--green);}

/* Stats */
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:20px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 8px;text-align:center;cursor:pointer;}
.stat-num{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:700;color:var(--text);}
.stat-num.hi{color:var(--green);}
.stat-lbl{font-size:0.6rem;color:var(--muted);margin-top:2px;font-weight:600;}

/* Section title */
.section-title{font-size:0.68rem;font-weight:700;letter-spacing:0.11em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}

/* Auth */
.auth-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding:32px 24px;text-align:center;}
.auth-logo{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;color:var(--green);margin-bottom:4px;}
.google-btn{background:white;color:#333;border:none;border-radius:12px;padding:13px 24px;font-weight:700;font-size:0.95rem;cursor:pointer;font-family:'DM Sans',sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;width:100%;max-width:320px;justify-content:center;}

/* Profile */
.profile-hero{background:linear-gradient(135deg,var(--navy2),var(--card));border-radius:20px;padding:20px;margin-bottom:16px;text-align:center;}
.profile-avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#1F3347,#2ECC71);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;color:white;margin:0 auto 12px;overflow:hidden;border:3px solid rgba(46,204,113,0.3);}
.profile-avatar img{width:100%;height:100%;object-fit:cover;}
.profile-name{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:800;}
.settings-row{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:border-color .15s;}
.settings-row:hover{border-color:var(--border2);}
.settings-row-left{display:flex;align-items:center;gap:12px;}

/* Login prompt */
.login-prompt-card{background:var(--card2);border:1px solid var(--border2);border-radius:20px;padding:24px;text-align:center;}

/* Map */
.map-box{border-radius:16px;overflow:hidden;height:140px;margin-bottom:16px;position:relative;background:#0f1f14;border:1px solid var(--border);}
.map-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(46,204,113,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(46,204,113,0.05) 1px,transparent 1px);background-size:28px 28px;}
.map-pin{position:absolute;font-size:1.3rem;}
.map-label{position:absolute;bottom:10px;right:12px;font-size:0.62rem;color:var(--green);font-weight:700;}

/* Chat */
.chat-bubble{max-width:78%;padding:9px 13px;border-radius:14px;font-size:0.85rem;line-height:1.5;margin-bottom:5px;word-wrap:break-word;}
.bubble-them{background:var(--card2);color:var(--text);border-bottom-left-radius:4px;}
.bubble-me{background:linear-gradient(135deg,#2ECC71,#27AE60);color:white;border-bottom-right-radius:4px;}
.bubble-time{font-size:0.6rem;opacity:.55;margin-top:2px;}

/* FAB */
.fab-wrap{position:fixed;bottom:62px;left:50%;transform:translateX(-50%);z-index:200;height:44px;display:flex;align-items:center;justify-content:center;pointer-events:none;width:200px;}
.fab{pointer-events:all;background:linear-gradient(135deg,#2ECC71,#27AE60);color:#fff;font-family:'Syne',sans-serif;font-size:0.68rem;font-weight:800;letter-spacing:0.06em;padding:0 18px;height:42px;border-radius:24px;display:flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 4px 16px rgba(46,204,113,0.5);cursor:pointer;border:2px solid rgba(255,255,255,0.2);transition:transform .15s;}
.fab.open{background:linear-gradient(135deg,#142232,#1A2B3C);}
.fab-overlay{position:fixed;inset:0;background:rgba(5,10,15,0.88);backdrop-filter:blur(10px);z-index:9940;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:calc(62px + 60px);animation:fadeIn .2s ease;}
.fab-sheet{width:100%;max-width:480px;padding:0 20px 8px;}
.fab-sheet-title{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;text-align:center;margin-bottom:4px;}
.fab-sheet-sub{text-align:center;font-size:0.8rem;color:var(--muted);margin-bottom:22px;}
.fab-option{background:var(--card);border:1px solid var(--border2);border-radius:18px;padding:16px 18px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;}
.fab-option::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px;}
.opt1::before{background:var(--green);}.opt2::before{background:var(--accent);}.opt3::before{background:var(--blue);}
.opt-num{font-family:'Syne',sans-serif;font-size:1.7rem;font-weight:800;width:34px;text-align:center;flex-shrink:0;}
.opt1 .opt-num{color:var(--green);}.opt2 .opt-num{color:var(--accent);}.opt3 .opt-num{color:var(--blue);}
.opt-text h3{font-family:'Syne',sans-serif;font-size:0.95rem;font-weight:700;}
.opt-text p{font-size:0.72rem;color:var(--muted);margin-top:2px;}
.fab-cancel{text-align:center;margin-top:10px;color:var(--muted);font-size:0.8rem;font-weight:600;cursor:pointer;padding:8px;}

/* Misc */
.empty-state{text-align:center;padding:48px 20px;}
.empty-icon{font-size:2.5rem;margin-bottom:10px;}
.empty-title{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;margin-bottom:6px;}
.empty-sub{font-size:0.8rem;color:var(--muted);margin-bottom:18px;}
.divider{height:1px;background:var(--border);margin:16px 0;}
.px{padding:0 18px;}
.logo{font-family:'Syne',sans-serif;font-size:1rem;font-weight:800;color:var(--green);letter-spacing:-0.02em;}
.logo span{color:var(--text);}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .2s ease;}
</style>

const {useState,useEffect,useRef,useMemo} = React;

/* Firebase */
const FB={apiKey:"AIzaSyDaFUszTD0-Ro292GOBSlS5vkZSdJM0NF4",authDomain:"pickleball-app-1bba7.firebaseapp.com",projectId:"pickleball-app-1bba7",storageBucket:"pickleball-app-1bba7.firebasestorage.app",messagingSenderId:"645604154338",appId:"1:645604154338:web:b92f87c2cd11d950b737bb"};

try{if(!firebase.apps.length)firebase.initializeApp(FB);db=firebase.firestore();auth=firebase.auth();fbOk=true;}
catch(e){console.error('Firebase:',e);}

/* Helpers */
const haversine=(a,b,c,d)=>{const R=3958.8,dL=(c-a)*Math.PI/180,dN=(d-b)*Math.PI/180,x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dN/2)**2;return R*2*Math.asin(Math.sqrt(x));};

const GoogleSVG=()=><svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>;

  const[mode,setMode]=useState('signin');

      const msgs={'auth/email-already-in-use':'Email already registered. Sign in instead.','auth/user-not-found':'No account with that email.','auth/wrong-password':'Wrong password.','auth/invalid-credential':'Email or password incorrect.','auth/too-many-requests':'Too many attempts. Wait a moment.'};

  };
  return(
    <div className="auth-wrap">
      {onBack&&<button onClick={onBack} style={{position:'absolute',top:16,left:16,background:'rgba(255,255,255,0.08)',border:'1px solid rgba(255,255,255,0.12)',borderRadius:10,padding:'6px 12px',color:'var(--muted)',cursor:'pointer',fontSize:'0.82rem',fontWeight:600}}>← Back</button>}
      <div style={{fontSize:'3rem',marginBottom:10}}>🏓</div>
      <div className="auth-logo">PickleConnect</div>
      <div style={{fontSize:'0.85rem',color:'var(--muted)',marginBottom:24,maxWidth:300,lineHeight:1.6}}>{mode==='signup'?'Create a free account to message, post & join games.':'Welcome back!'}</div>
      <div style={{display:'flex',background:'rgba(255,255,255,0.06)',borderRadius:12,padding:3,marginBottom:20,width:'100%',maxWidth:320}}>

      </div>
      <button className="google-btn" onClick={googleAuth} disabled={ld}><GoogleSVG/>Continue with Google</button>
      <div style={{fontSize:'0.7rem',color:'var(--muted2)',marginTop:16}}>Free · No spam</div>
    </div>

/* ── ProfileSetup ── */
function ProfileSetup({user,profile,onSave,onClose}){
  const[name,setName]=useState(profile?.name||user?.displayName||'');
  const[skill,setSkill]=useState(profile?.skill||'');
  const[city,setCity]=useState(profile?.city||'');
  const[age,setAge]=useState(profile?.age||'');
  const[gender,setGender]=useState(profile?.gender||'');
  const[saving,setSaving]=useState(false);
  const save=async()=>{
    if(!name.trim()){alert('Enter your name.');return;}
    if(!skill){alert('Select skill level.');return;}
    setSaving(true);
    const data={name:name.trim(),skill,city:city.trim()||null,age:age||null,gender:gender||null,photoURL:user.photoURL||null,email:user.email||null,uid:user.uid,updatedAt:Date.now()};
    try{await db.collection('profiles').doc(user.uid).set(data,{merge:true});onSave(data);}
    catch(e){alert('Failed: '+e.message);}
    setSaving(false);
  };
  return(
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget&&onClose)onClose();}}>
      <div className="modal-sheet">
        <div className="modal-handle"/>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
          <div className="modal-title">{profile?'Edit Profile':'Set Up Profile'}</div>
          {onClose&&<button onClick={onClose} className="icon-btn" style={{position:'static'}}>✕</button>}
        </div>
        <div className="fg"><div className="fl">Display Name *</div><input className="fi" value={name} onChange={e=>setName(e.target.value)} placeholder="Your name" maxLength={40}/></div>
        <div className="fg"><div className="fl">Skill Level *</div><div className="og">{SKILLS.map(s=><button key={s} className={`ob ${skill===s?'s':''}`} onClick={()=>setSkill(s)} style={{fontSize:'0.72rem'}}>{s}</button>)}</div></div>
        <div className="fg"><div className="fl">City / Area</div><input className="fi" value={city} onChange={e=>setCity(e.target.value)} placeholder="e.g. St. Louis, MO" maxLength={80}/></div>
        <div style={{display:'flex',gap:10}}>
          <div className="fg" style={{flex:1}}><div className="fl">Age</div><select className="fi" value={age} onChange={e=>setAge(e.target.value)}><option value="">—</option>{['18-25','26-35','36-45','46-55','56-65','65+'].map(a=><option key={a}>{a}</option>)}</select></div>
          <div className="fg" style={{flex:1}}><div className="fl">Gender</div><select className="fi" value={gender} onChange={e=>setGender(e.target.value)}><option value="">—</option>{['Male','Female','Non-binary','Prefer not to say'].map(g=><option key={g}>{g}</option>)}</select></div>
        </div>
        <button className="btn btn-primary" onClick={save} disabled={saving} style={{width:'100%',marginTop:4,opacity:saving?.6:1}}>{saving?'Saving…':'Save Profile'}</button>
      </div>
    </div>
  );
}

/* ── ChatModal ── */
function ChatModal({player,myUid,myName,onClose}){
  const[msgs,setMsgs]=useState([]);const[inp,setInp]=useState('');const[sending,setSending]=useState(false);
  const endRef=useRef(null);const c=cid(myUid,player.uid);
  useEffect(()=>{if(!fbOk)return;const u=db.collection('chatMessages').where('convoId','==',c).orderBy('timestamp','asc').onSnapshot(s=>{setMsgs(s.docs.map(d=>({id:d.id,...d.data()})));setTimeout(()=>endRef.current?.scrollIntoView({behavior:'smooth'}),80);},e=>console.error(e));return()=>u();},[c]);
  useEffect(()=>{if(fbOk&&msgs.length)db.collection('conversations').doc(c).update({[`readBy_${myUid}`]:Date.now()}).catch(()=>{});},[msgs.length]);
  const send=async()=>{
    if(!inp.trim()||sending)return;setSending(true);const now=Date.now(),txt=inp.trim();
    try{
      const ref=db.collection('conversations').doc(c);
      const cd={participants:[myUid,player.uid].sort(),participantNames:{[myUid]:myName,[player.uid]:player.name},lastMessage:txt,lastMessageBy:myUid,lastTimestamp:now,[`readBy_${myUid}`]:now};
      try{await ref.set({...cd,createdAt:now});}catch{await ref.update({lastMessage:txt,lastMessageBy:myUid,lastTimestamp:now,[`readBy_${myUid}`]:now});}
      await db.collection('chatMessages').add({convoId:c,text:txt,senderUid:myUid,senderName:myName,timestamp:now});
      setInp('');
    }catch(e){alert('Send failed: '+e.message);}setSending(false);
  };
  return(
    <div className="modal-overlay" style={{alignItems:'stretch',paddingTop:40}}>
      <div style={{background:'var(--navy2)',borderRadius:'24px 24px 0 0',width:'100%',maxWidth:480,margin:'0 auto',display:'flex',flexDirection:'column',flex:1,animation:'slideUp .28s ease',overflow:'hidden'}}>
        <div style={{padding:'14px 16px 12px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
          <button onClick={onClose} className="icon-btn" style={{position:'static'}}>←</button>
          <div className="pc-avatar" style={{width:34,height:34,fontSize:'0.85rem'}}>{player.photoURL?<img src={player.photoURL} referrerPolicy="no-referrer"/>:player.name?.[0]||'?'}</div>
          <div style={{flex:1}}><div style={{fontWeight:700,fontSize:'0.9rem'}}>{player.name}</div><div style={{fontSize:'0.68rem',color:'var(--muted)'}}>{player.skill||'Player'}</div></div>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'12px 16px',display:'flex',flexDirection:'column',gap:2}}>
          {msgs.length===0&&<div style={{textAlign:'center',padding:'40px 20px',color:'var(--muted)'}}>💬 Say hi to {player.name}!</div>}
          {msgs.map(m=>(<div key={m.id} style={{display:'flex',flexDirection:'column',alignItems:m.senderUid===myUid?'flex-end':'flex-start'}}><div className={`chat-bubble ${m.senderUid===myUid?'bubble-me':'bubble-them'}`}>{m.text}<div className="bubble-time">{timeAgo(m.timestamp)}</div></div></div>))}
          <div ref={endRef}/>
        </div>
        <div style={{padding:'10px 14px',borderTop:'1px solid var(--border)',display:'flex',gap:8,alignItems:'flex-end',flexShrink:0,background:'var(--navy2)'}}>
          <textarea value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}} placeholder="Message…" rows={1} className="fi" style={{flex:1,resize:'none',maxHeight:80}}/>
          <button className="btn btn-primary btn-sm" onClick={send} disabled={sending||!inp.trim()} style={{opacity:(sending||!inp.trim())?.4:1,flexShrink:0}}>Send</button>
        </div>
      </div>
    </div>
  );
}

/* ── Inbox ── */

  const info=cv=>{const ouid=cv.participants.find(p=>p!==myUid);const nm=cv.participantNames?.[ouid]||'Player';const rt=cv[`readBy_${myUid}`]||0;return{ouid,nm,ur:cv.lastMessageBy!==myUid&&cv.lastTimestamp>rt};};

  const crowdBadge=c=>{const l=c.crowdLevel;return l==='high'?'badge-full':l==='medium'?'badge-busy':'badge-open';};

      </div>

      {nearbyCourts.length===0&&<div style={{color:'var(--muted)',fontSize:'0.82rem',marginBottom:16}}>No courts found.</div>}

            <div className="court-info"><h4>{g.name}</h4><p>{g.skill}{g.city?` · ${g.city}`:''}</p></div>

/* ── GamesTab ── */
function GamesTab({user,profile,games,onNeedLogin}){
  const[tab,setTab]=useState('upcoming');
  const[showForm,setShowForm]=useState(false);
  const[editGame,setEditGame]=useState(null);
  const[expanded,setExpanded]=useState(null);
  const today=new Date().toISOString().split('T')[0];

  const filtered=useMemo(()=>{
    let g=[...games];
    if(tab==='mine')g=g.filter(x=>x.organizerUid===user?.uid||(x.players||[]).some(p=>p.uid===user?.uid));
    else g=g.filter(x=>!x.date||x.date>=today);
    return g.sort((a,b)=>(a.date||'')+(a.time||'')>(b.date||'')+(b.time||'')?1:-1);
  },[games,tab,user,today]);

  const su=g=>(g.players||[]).reduce((s,p)=>s+1+(p.guests||0),0);

  const joinGame=async(game)=>{
    if(!user||!profile){onNeedLogin(null);return;}
    if(su(game)>=(game.spots||4)){alert('Game is full!');return;}
    if((game.players||[]).some(p=>p.uid===user.uid)){alert('Already joined.');return;}
    try{await db.collection('games').doc(game.id).update({players:[...(game.players||[]),{uid:user.uid,name:profile.name,photoURL:profile.photoURL||null,guests:0,joinedAt:Date.now()}]});}
    catch(e){alert(e.message);}
  };
  const leaveGame=async(game)=>{
    if(!confirm('Leave this game?'))return;
    try{await db.collection('games').doc(game.id).update({players:(game.players||[]).filter(p=>p.uid!==user.uid)});}
    catch(e){alert(e.message);}
  };
  const cancelGame=async(id)=>{
    if(!confirm('Cancel and delete this game?'))return;
    try{await db.collection('games').doc(id).delete();}
    catch(e){alert(e.message);}
  };

  return(
    <div className="px fade-in">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',paddingTop:4,marginBottom:12}}>
        <div className="section-title" style={{marginBottom:0}}>Games</div>
        <button className="btn btn-primary btn-sm" onClick={()=>{if(!user){onNeedLogin(null);return;}setEditGame(null);setShowForm(true);}}>🎮 Create</button>
      </div>
      <div className="tab-pills">{[['upcoming','Upcoming'],['mine','My Games']].map(([k,l])=><div key={k} className={`pill ${tab===k?'active':''}`} onClick={()=>setTab(k)}>{l}</div>)}</div>
      {filtered.length===0&&<div className="empty-state"><div className="empty-icon">🎮</div><div className="empty-title">No games yet</div><div className="empty-sub">Create one!</div></div>}
      {filtered.map(g=>{
        const used=su(g),total=g.spots||4,full=used>=total;
        const amIn=(g.players||[]).some(p=>p.uid===user?.uid);
        const isMine=g.organizerUid===user?.uid;
        const isExp=expanded===g.id;
        // build slot array
        const slots=[];
        (g.players||[]).forEach(p=>{slots.push({...p,isPlayer:true});for(let i=0;i<(p.guests||0);i++)slots.push({...p,isGuest:true});});
        for(let i=slots.length;i<total;i++)slots.push(null);
        const wd=g.date?new Date(g.date+'T12:00:00').toLocaleDateString('en',{weekday:'short'}):'?';
        const dd=g.date?parseInt(g.date.split('-')[2]):'?';
        return(
          <div key={g.id} style={{background:'var(--card)',border:`1px solid ${isExp?'rgba(46,204,113,0.3)':'var(--border)'}`,borderRadius:16,marginBottom:10,overflow:'hidden'}}>
            {/* Collapsed header */}
            <div style={{padding:'12px 14px',cursor:'pointer',display:'flex',alignItems:'flex-start',gap:10}} onClick={()=>setExpanded(isExp?null:g.id)}>
              <div style={{background:'var(--navy)',border:'1px solid var(--border2)',borderRadius:10,padding:'4px 8px',textAlign:'center',minWidth:42,flexShrink:0}}>
                <div style={{fontSize:'0.55rem',fontWeight:700,color:'var(--muted)',textTransform:'uppercase'}}>{wd}</div>
                <div style={{fontSize:'1.1rem',fontWeight:800,lineHeight:1}}>{dd}</div>
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:700,fontSize:'0.88rem',marginBottom:3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{g.title||`Game @ ${g.court}`}</div>
                <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                  {g.time&&<span className="tag t-green">⏰ {fmtTime(g.time)}</span>}
                  {full?<span className="tag t-amber">Full</span>:<span className="tag t-green">{total-used}/{total} open</span>}
                  {amIn&&<span className="tag t-green" style={{background:'rgba(46,204,113,0.2)'}}>✓ In</span>}
                </div>
              </div>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" strokeWidth="2.5" style={{flexShrink:0,marginTop:4,transition:'transform .2s',transform:isExp?'rotate(180deg)':'none'}}><path d="M6 9l6 6 6-6"/></svg>
            </div>
            {/* Expanded */}
            {isExp&&<div style={{borderTop:'1px solid var(--border)',padding:'10px 14px 12px'}}>
              <div style={{fontSize:'0.72rem',color:'var(--muted)',marginBottom:8,display:'flex',gap:8,flexWrap:'wrap'}}>
                {g.court&&<span>📍 {g.court}</span>}
                {g.skill&&g.skill!=='Any'&&<span>🎯 {g.skill}</span>}
                <span>by {isMine?'you':g.organizerName||'organizer'}</span>
              </div>
              {/* Roster grid */}
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,marginBottom:10}}>
                {slots.map((p,i)=>p?(
                  <div key={i} style={{background:'var(--navy)',border:`1px solid ${p.uid===user?.uid?'var(--green)':'var(--border)'}`,borderRadius:10,padding:'7px 10px',display:'flex',alignItems:'center',gap:7}}>
                    <div style={{width:26,height:26,borderRadius:'50%',background:'var(--green-dim)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'0.75rem',fontWeight:700,color:'var(--green)',flexShrink:0,overflow:'hidden'}}>
                      {p.photoURL&&!p.isGuest?<img src={p.photoURL} referrerPolicy="no-referrer" style={{width:'100%',height:'100%',objectFit:'cover',borderRadius:'50%'}}/>:p.isGuest?'👤':p.name?.[0]||'?'}
                    </div>
                    <div style={{minWidth:0}}>
                      <div style={{fontSize:'0.72rem',fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.isGuest?`${p.name}'s guest`:p.name}{p.uid===user?.uid&&!p.isGuest?' ✅':''}</div>
                      {!p.isGuest&&p.skill&&<div style={{fontSize:'0.6rem',color:'var(--muted)'}}>{p.skill}</div>}
                    </div>
                  </div>
                ):(
                  <div key={i} style={{background:'rgba(255,255,255,.03)',border:'1px dashed var(--border)',borderRadius:10,padding:'7px 10px',display:'flex',alignItems:'center',gap:7,cursor:full?'default':'pointer',opacity:.6}} onClick={full?null:()=>joinGame(g)}>
                    <div style={{width:26,height:26,borderRadius:'50%',background:'var(--border)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>+</div>
                    <div style={{fontSize:'0.72rem',color:'var(--muted)'}}>{full?'Full':'Tap to join'}</div>
                  </div>
                ))}
              </div>
              {g.note&&<div style={{fontSize:'0.75rem',color:'var(--muted)',marginBottom:10,fontStyle:'italic'}}>💬 {g.note}</div>}
              {/* Action buttons */}
              <div style={{display:'flex',gap:7,flexWrap:'wrap'}}>
                {!amIn&&!full&&<button className="btn btn-primary btn-sm" onClick={()=>joinGame(g)}>🏓 Join</button>}
                {amIn&&!isMine&&<button className="btn btn-ghost btn-sm" onClick={()=>leaveGame(g)} style={{color:'var(--red)',borderColor:'rgba(247,91,91,0.35)'}}>Leave</button>}
                {isMine&&<button className="btn btn-ghost btn-sm" onClick={e=>{e.stopPropagation();setEditGame(g);setShowForm(true);}}>✏️ Edit</button>}
                {isMine&&<button className="btn btn-ghost btn-sm" onClick={e=>{e.stopPropagation();cancelGame(g.id);}} style={{color:'var(--red)',borderColor:'rgba(247,91,91,0.35)'}}>🗑 Delete</button>}
                {amIn&&<span className="tag t-green" style={{marginLeft:'auto',alignSelf:'center'}}>✓ You're in</span>}
              </div>
            </div>}
          </div>
        );
      })}
      {showForm&&user&&profile&&<GameForm user={user} profile={profile} editData={editGame} onClose={()=>{setShowForm(false);setEditGame(null);}} onSaved={()=>{setShowForm(false);setEditGame(null);}}/>}
    </div>
  );
}

/* ── GameForm ── */
function GameForm({user,profile,onClose,onSaved,editData}){
  const today=new Date().toISOString().split('T')[0];
  const[title,setTitle]=useState(editData?.title||'');
  const[date,setDate]=useState(editData?.date||today);
  const[time,setTime]=useState(editData?.time||'16:00');
  const[timeEnd,setTimeEnd]=useState(editData?.timeEnd||'18:00');
  const[court,setCourt]=useState(editData?.court||'');
  const[skill,setSkill]=useState(editData?.skill||'Any');
  const[spots,setSpots]=useState(editData?.spots||4);
  const[note,setNote]=useState(editData?.note||'');
  const[saving,setSaving]=useState(false);
  const save=async()=>{
    if(!court.trim()){alert('Enter court name.');return;}
    setSaving(true);
    const data={title:title.trim()||`Game @ ${court.trim()}`,date,time,timeEnd,court:court.trim(),skill,spots:Number(spots),note:note.trim(),organizerUid:user.uid,organizerName:profile.name,organizerPhoto:profile.photoURL||null,status:'active'};
    if(!editData?.id)data.players=[{uid:user.uid,name:profile.name,photoURL:profile.photoURL||null,skill:profile.skill||'Any',guests:0,joinedAt:Date.now()}];
    if(!editData?.id)data.createdAt=Date.now();
    try{
      if(editData?.id)await db.collection('games').doc(editData.id).update(data);
      else await db.collection('games').add(data);
      onSaved();
    }catch(e){alert('Failed: '+e.message);}
    setSaving(false);
  };
  return(
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal-sheet">
        <div className="modal-handle"/>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
          <div className="modal-title">🎮 {editData?'Edit Game':'Create Game'}</div>
          <button onClick={onClose} className="icon-btn" style={{position:'static'}}>✕</button>
        </div>
        <div className="fg"><div className="fl">Game Title (optional)</div><input className="fi" value={title} onChange={e=>setTitle(e.target.value)} placeholder={`Game @ ${court||'Court Name'}`} maxLength={60}/></div>
        <div style={{display:'flex',gap:10}}>
          <div className="fg" style={{flex:1}}><div className="fl">Date *</div><input type="date" className="fi" value={date} min={today} onChange={e=>setDate(e.target.value)}/></div>
        </div>
        <div style={{display:'flex',gap:10}}>
          <div className="fg" style={{flex:1}}><div className="fl">Start</div><input type="time" className="fi" value={time} onChange={e=>setTime(e.target.value)}/></div>
          <div className="fg" style={{flex:1}}><div className="fl">End</div><input type="time" className="fi" value={timeEnd} onChange={e=>setTimeEnd(e.target.value)}/></div>
        </div>
        <div className="fg"><div className="fl">Court *</div><input className="fi" value={court} onChange={e=>setCourt(e.target.value)} placeholder="e.g. Willmore Park" maxLength={80}/></div>
        <div style={{display:'flex',gap:10}}>
          <div className="fg" style={{flex:1}}><div className="fl">Skill Level</div><select className="fi" value={skill} onChange={e=>setSkill(e.target.value)}><option>Any</option>{SKILLS.map(s=><option key={s}>{s}</option>)}</select></div>
          <div className="fg" style={{flex:1}}><div className="fl">Spots</div><select className="fi" value={spots} onChange={e=>setSpots(e.target.value)}>{[2,4,6,8,10,12].map(n=><option key={n} value={n}>{n} players</option>)}</select></div>
        </div>
        <div className="fg"><div className="fl">Note</div><textarea className="fi" value={note} onChange={e=>setNote(e.target.value)} placeholder="Any notes for players…" maxLength={200} rows={2}/></div>
        <button className="btn btn-primary" onClick={save} disabled={saving} style={{width:'100%',opacity:saving?.6:1}}>{saving?'Saving…':editData?'Save Changes':'Create Game'}</button>
      </div>
    </div>
  );
}

/* ── PlayersTab ── */
function PlayersTab({user,posts,players,onChat,onNeedLogin}){
  const[search,setSearch]=useState('');
  const[tab,setTab]=useState('all');
  const[expanded,setExpanded]=useState(null);
  const[showPost,setShowPost]=useState(false);
  const[editPost,setEditPost]=useState(null);
  const[showF,setShowF]=useState(false);
  const[fSkill,setFS]=useState('');const[fType,setFT]=useState('');const[fGender,setFG]=useState('');const[fPurpose,setFP]=useState('');
  const fCount=[fSkill,fType,fGender,fPurpose].filter(Boolean).length;
  const clearF=()=>{setFS('');setFT('');setFG('');setFP('');};

  const grouped=useMemo(()=>{
    let fp=[...posts];
    if(tab==='now')fp=fp.filter(p=>p.availability==='Now'||p.availability==='Today');
    if(search.trim()){const q=search.toLowerCase();fp=fp.filter(p=>[p.name,p.city,p.skill,p.message].some(v=>(v||'').toLowerCase().includes(q)));}
    if(fSkill)fp=fp.filter(p=>p.skill===fSkill);
    if(fType)fp=fp.filter(p=>p.playTypes?.includes(fType));
    if(fGender)fp=fp.filter(p=>p.gender===fGender);
    if(fPurpose)fp=fp.filter(p=>p.purpose===fPurpose);
    const map={};
    fp.forEach(p=>{
      if(!map[p.uid])map[p.uid]={uid:p.uid,name:p.name,skill:p.skill,city:p.city,age:p.age,gender:p.gender,photoURL:p.photoURL,posts:[]};
      map[p.uid].posts.push(p);
      if(p.timestamp>(map[p.uid]._ts||0)){map[p.uid]._ts=p.timestamp;Object.assign(map[p.uid],{name:p.name,skill:p.skill,city:p.city,photoURL:p.photoURL});}
    });
    return Object.values(map).sort((a,b)=>(b._ts||0)-(a._ts||0));
  },[posts,tab,search,fSkill,fType,fGender,fPurpose]);

  const removePost=async(id)=>{
    if(!confirm('Remove this post?'))return;
    try{await db.collection('findPlayers').doc(id).update({status:'removed'});}
    catch(e){alert(e.message);}
  };

  return(
    <div className="px fade-in">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',paddingTop:4,marginBottom:12}}>
        <div className="section-title" style={{marginBottom:0}}>Find Players</div>
        <button className="btn btn-primary btn-sm" onClick={()=>{if(!user){onNeedLogin(null);return;}setEditPost(null);setShowPost(true);}}>📢 Post</button>
      </div>

      {/* Search + Filter row */}
      <div style={{display:'flex',gap:8,marginBottom:12,alignItems:'center'}}>
        <div style={{position:'relative',flex:1}}><span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',pointerEvents:'none'}}>🔍</span><input className="fi" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search players…" style={{paddingLeft:36}}/></div>
        <button onClick={()=>setShowF(!showF)} style={{padding:'10px 14px',border:`1.5px solid ${showF||fCount?'var(--green)':'var(--border2)'}`,borderRadius:12,background:showF||fCount?'var(--green-dim)':'transparent',color:showF||fCount?'var(--green)':'var(--muted)',fontFamily:'DM Sans',fontSize:'0.78rem',fontWeight:700,cursor:'pointer',whiteSpace:'nowrap',flexShrink:0}}>
          ⚙ Filter{fCount>0?` (${fCount})`:''}
        </button>
      </div>

      {/* Filter panel */}
      {showF&&<div style={{background:'var(--card)',border:'1px solid var(--border2)',borderRadius:14,padding:'12px 14px',marginBottom:12,animation:'fadeIn .15s'}}>
        <div style={{marginBottom:10}}>
          <div className="fp-label">Skill Level</div>
          <div className="fp-pills"><button className={`fp-pill ${!fSkill?'s':''}`} onClick={()=>setFS('')}>All</button>{SKILLS.map(s=><button key={s} className={`fp-pill ${fSkill===s?'s':''}`} onClick={()=>setFS(fSkill===s?'':s)}>{s}</button>)}</div>
        </div>
        <div style={{marginBottom:10}}>
          <div className="fp-label">Play Type</div>
          <div className="fp-pills"><button className={`fp-pill ${!fType?'s':''}`} onClick={()=>setFT('')}>All</button>{PTYPES.map(t=><button key={t} className={`fp-pill ${fType===t?'s':''}`} onClick={()=>setFT(fType===t?'':t)}>{PT_E[t]} {t}</button>)}</div>
        </div>
        <div style={{marginBottom:10}}>
          <div className="fp-label">Looking For</div>
          <div className="fp-pills"><button className={`fp-pill ${!fPurpose?'s':''}`} onClick={()=>setFP('')}>All</button>{PURPOSES.map(p=><button key={p.id} className={`fp-pill ${fPurpose===p.id?'s':''}`} onClick={()=>setFP(fPurpose===p.id?'':p.id)}>{p.e} {p.l}</button>)}</div>
        </div>
        <div>
          <div className="fp-label">Gender</div>
          <div className="fp-pills"><button className={`fp-pill ${!fGender?'s':''}`} onClick={()=>setFG('')}>All</button>{['Male','Female','Non-binary'].map(g=><button key={g} className={`fp-pill ${fGender===g?'s':''}`} onClick={()=>setFG(fGender===g?'':g)}>{g}</button>)}</div>
        </div>
        {fCount>0&&<button onClick={clearF} style={{marginTop:8,background:'none',border:'none',color:'var(--red)',fontSize:'0.75rem',fontWeight:600,cursor:'pointer'}}>✕ Clear all filters</button>}
      </div>}

      <div className="tab-pills">{[['all','🏓 All'],['now','⚡ Available Now']].map(([k,l])=><div key={k} className={`pill ${tab===k?'active':''}`} onClick={()=>setTab(k)}>{l}</div>)}</div>
      <div style={{fontSize:'0.7rem',color:'var(--muted)',marginBottom:10}}>{grouped.length} player{grouped.length!==1?'s':''}</div>

      {grouped.length===0&&<div className="empty-state"><div className="empty-icon">👥</div><div className="empty-title">No players found</div><div className="empty-sub">{search||fCount?'Try different filters':'Be the first to post!'}</div></div>}
      {grouped.map(g=>(
        <div key={g.uid} className={`player-card ${expanded===g.uid?'expanded':''}`} onClick={()=>setExpanded(expanded===g.uid?null:g.uid)}>
          <div className="pc-row">
            <div className="pc-avatar">{g.photoURL?<img src={g.photoURL} referrerPolicy="no-referrer" style={{width:'100%',height:'100%',objectFit:'cover',borderRadius:'50%'}}/>:g.name?.[0]||'?'}</div>
            <div className="pc-info">
              <div className="pc-name">{g.name}{user&&g.uid===user.uid&&<span style={{fontSize:'0.6rem',fontWeight:700,background:'var(--green-dim)',color:'var(--green)',padding:'2px 6px',borderRadius:4}}>YOU</span>}</div>
              <div className="pc-sub">{g.city||'No location'}{g.age?` · ${g.age}`:''}{g.gender?` · ${g.gender}`:''}</div>
            </div>
            <div className="pc-skill">{g.skill||'NR'}</div>
          </div>
          {expanded===g.uid&&(
            <div className="pc-expand" onClick={e=>e.stopPropagation()}>
              {g.posts.map(p=>{
                const pu=PURPOSES.find(x=>x.id===p.purpose);
                const isMyPost=user&&p.uid===user.uid;
                return(
                  <div key={p.id} style={{background:'var(--navy2)',border:'1px solid var(--border)',borderRadius:12,padding:'10px 12px',marginBottom:8}}>
                    <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:6,flexWrap:'wrap'}}>
                      <span className="tag t-green">{pu?.e} {pu?.l||'Play'}</span>
                      {p.playTypes?.map(t=><span key={t} className="tag t-muted">{PT_E[t]||''} {t}</span>)}
                      <span className="tag t-amber">{p.availability}</span>
                      {isMyPost&&<div style={{marginLeft:'auto',display:'flex',gap:5}}>
                        <button onClick={()=>{setEditPost(p);setShowPost(true);}} style={{padding:'3px 9px',fontSize:'0.68rem',fontWeight:700,border:'1px solid var(--border2)',borderRadius:6,background:'transparent',color:'var(--green)',cursor:'pointer'}}>✏️ Edit</button>
                        <button onClick={()=>removePost(p.id)} style={{padding:'3px 9px',fontSize:'0.68rem',fontWeight:700,border:'1px solid rgba(247,91,91,0.3)',borderRadius:6,background:'transparent',color:'var(--red)',cursor:'pointer'}}>🗑</button>
                      </div>}
                    </div>
                    {p.courtName&&<div style={{fontSize:'0.72rem',color:'var(--muted)',marginBottom:4}}>📍 {p.courtName}</div>}
                    {p.message&&<div style={{fontSize:'0.78rem',color:'var(--text)',fontStyle:'italic',marginBottom:4}}>"{p.message}"</div>}
                    <div style={{fontSize:'0.65rem',color:'var(--muted2)'}}>{timeAgo(p.timestamp)} ago</div>
                  </div>
                );
              })}
              {user?.uid!==g.uid&&<MsgBtn player={g} user={user} onChat={onChat} onNeedLogin={onNeedLogin}/>}
              {user?.uid===g.uid&&<button className="btn btn-ghost btn-sm" onClick={()=>{setEditPost(null);setShowPost(true);}} style={{marginTop:4}}>+ New Post</button>}
            </div>
          )}
        </div>
      ))}
      {showPost&&user&&<PostForm user={user} editData={editPost} onClose={()=>{setShowPost(false);setEditPost(null);}} onPosted={()=>{setShowPost(false);setEditPost(null);}}/>}
    </div>
  );
}

/* ── PostForm ── */
function PostForm({user,onClose,onPosted,editData}){
  const[purpose,setPurpose]=useState(editData?.purpose||'play');
  const[playTypes,setPT]=useState(editData?.playTypes||[]);
  const[avail,setAv]=useState(editData?.availability||'Flexible');
  const[courtName,setCourt]=useState(editData?.courtName||'');
  const[message,setMsg]=useState(editData?.message||'');
  const[saving,setSaving]=useState(false);
  const[profile,setProfile]=useState(null);
  useEffect(()=>{if(fbOk&&user)db.collection('profiles').doc(user.uid).get().then(d=>{if(d.exists)setProfile({uid:user.uid,...d.data()});});},[user]);
  const togglePT=t=>setPT(p=>p.includes(t)?p.filter(x=>x!==t):[...p,t]);
  const save=async()=>{
    if(!profile){alert('Profile not loaded.');return;}
    if(playTypes.length===0){alert('Select at least one play type.');return;}
    setSaving(true);
    // Build data and strip ALL undefined values — Firestore rejects them
    const _raw={uid:user.uid,name:profile.name||null,skill:profile.skill||null,city:profile.city||null,age:profile.age||null,gender:profile.gender||null,photoURL:profile.photoURL||null,purpose,playTypes,availability:avail,courtName:courtName.trim()||null,message:message.trim()||null,timestamp:Date.now(),status:'active'};
    const data=Object.fromEntries(Object.entries(_raw).filter(([,v])=>v!==undefined));
    try{
      if(editData?.id)await db.collection('findPlayers').doc(editData.id).update(data);
      else await db.collection('findPlayers').add(data);
      onPosted();
    }catch(e){alert('Failed: '+e.message);}
    setSaving(false);
  };
  return(
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal-sheet">
        <div className="modal-handle"/>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
          <div className="modal-title">📢 {editData?'Edit Post':'Post Availability'}</div>
          <button onClick={onClose} className="icon-btn" style={{position:'static'}}>✕</button>
        </div>
        <div className="fg"><div className="fl">Looking for *</div><div className="og">{PURPOSES.map(p=><button key={p.id} className={`ob ${purpose===p.id?'s':''}`} onClick={()=>setPurpose(p.id)} style={{fontSize:'0.78rem'}}>{p.e} {p.l}</button>)}</div></div>
        <div className="fg"><div className="fl">Play Type *</div><div className="og">{PTYPES.map(t=><button key={t} className={`ob ${playTypes.includes(t)?'s':''}`} onClick={()=>togglePT(t)} style={{fontSize:'0.78rem'}}>{PT_E[t]} {t}</button>)}</div></div>
        <div className="fg"><div className="fl">When</div><div className="og">{AVAIL.map(a=><button key={a} className={`ob ${avail===a?'s':''}`} onClick={()=>setAv(a)} style={{fontSize:'0.78rem'}}>{a}</button>)}</div></div>
        <div className="fg"><div className="fl">Court (optional)</div><input className="fi" value={courtName} onChange={e=>setCourt(e.target.value)} placeholder="e.g. Willmore Park" maxLength={80}/></div>
        <div className="fg"><div className="fl">Message</div><textarea className="fi" value={message} onChange={e=>setMsg(e.target.value)} placeholder="Available for games, message me!" maxLength={200} rows={2}/></div>
        <button className="btn btn-primary" onClick={save} disabled={saving} style={{width:'100%',opacity:saving?.6:1}}>{saving?'Saving…':editData?'Save Changes':'📢 Post'}</button>
      </div>
    </div>
  );
}

/* ── ProfileTab ── */
function ProfileTab({user,profile,onEditProfile,onSignOut,onGoAuth,unread,onInbox}){

    <div className="px fade-in" style={{paddingTop:40}}>
      <div className="login-prompt-card" style={{textAlign:'center'}}>

      </div>
      <div className="settings-row" onClick={onInbox}>
        <div className="settings-row-left"><div style={{fontSize:'1.1rem'}}>💬</div><div><div style={{fontSize:'0.88rem',fontWeight:600}}>Messages</div><div style={{fontSize:'0.7rem',color:'var(--muted)'}}>Your private conversations</div></div></div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>{unread>0&&<div style={{background:'var(--red)',color:'white',borderRadius:10,padding:'2px 7px',fontSize:'0.72rem',fontWeight:700}}>{unread}</div>}<span style={{color:'var(--muted)'}}>›</span></div>
      </div>
      <div className="settings-row" onClick={onEditProfile}>
        <div className="settings-row-left"><div style={{fontSize:'1.1rem'}}>✏️</div><div><div style={{fontSize:'0.88rem',fontWeight:600}}>Edit Profile</div><div style={{fontSize:'0.7rem',color:'var(--muted)'}}>Name, skill, location</div></div></div>
        <span style={{color:'var(--muted)'}}>›</span>
      </div>
      <div className="settings-row" onClick={onSignOut} style={{borderColor:'rgba(247,91,91,0.15)'}}>
        <div className="settings-row-left"><div style={{fontSize:'1.1rem'}}>↩</div><div><div style={{fontSize:'0.88rem',fontWeight:600,color:'var(--red)'}}>Sign Out</div></div></div>
      </div>
    </div>
  );
}

/* ── FabSheet ── */
function FabSheet({onClose,onStartGame,onAvailable,onQueue}){
  return(
    <div className="fab-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="fab-sheet">
        <div className="fab-sheet-title">How do you want to play?</div>
        <div className="fab-sheet-sub">Pick your vibe for today</div>
        <div className="fab-option opt1" onClick={onStartGame}><div className="opt-num">1</div><div className="opt-text"><h3>Start a Game</h3><p>Create a game & invite others</p></div><div style={{marginLeft:'auto',color:'var(--muted)'}}>›</div></div>
        <div className="fab-option opt2" onClick={onAvailable}><div className="opt-num">2</div><div className="opt-text"><h3>I'm Available</h3><p>Post so players can find you</p></div><div style={{marginLeft:'auto',color:'var(--muted)'}}>›</div></div>
        <div className="fab-option opt3" onClick={onQueue}><div className="opt-num">3</div><div className="opt-text"><h3>Join Court Queue</h3><p>Get in line at a nearby court</p></div><div style={{marginLeft:'auto',color:'var(--muted)'}}>›</div></div>
        <div className="fab-cancel" onClick={onClose}>✕  Cancel</div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════
   ROOT APP
════════════════════════════════════════ */
function App(){
  const[user,setUser]=useState(undefined);
  const[profile,setProfile]=useState(undefined);
  const[tab,setTab]=useState(()=>new URLSearchParams(window.location.search).get('tab')||'home');
  const switchTab=t=>{setTab(t);if(window.__pcnOnTabChange)window.__pcnOnTabChange(t);};

  // Expose hooks for nav.js
  useEffect(()=>{window.__pcnSetTab=switchTab;},[]);
  useEffect(()=>{window.__pcnOpenAuth=()=>setShowAuth(true);return()=>{delete window.__pcnOpenAuth;};},[]);
  useEffect(()=>{window.__pcnOpenProfile=()=>setShowProfile(true);return()=>{delete window.__pcnOpenProfile;};},[]);

  const[courts,setCourts]=useState([]);
  const[games,setGames]=useState([]);
  const[posts,setPosts]=useState([]);
  const[uLat,setULat]=useState(null);const[uLng,setULng]=useState(null);
  const[unread,setUnread]=useState(0);
  const[chatP,setChatP]=useState(null);
  const[showInbox,setShowInbox]=useState(false);
  const[showProfile,setShowProfile]=useState(false);
  const[showFab,setShowFab]=useState(false);
  const[showAuth,setShowAuth]=useState(false);
  const[loginPromptPlayer,setLoginPromptPlayer]=useState(undefined);

  const unsubs=useRef([]);
  const addUnsub=fn=>{unsubs.current.push(fn);return fn;};
  const clearUnsubs=()=>{unsubs.current.forEach(fn=>{try{fn();}catch(e){}});unsubs.current=[];};

  // ── AUTH STATE — automatically dismisses auth screen when user signs in
  useEffect(()=>{
    if(!auth)return;
    return auth.onAuthStateChanged(u=>{
      setUser(u||null);
      if(u){
        // User just signed in — close auth screen
        setShowAuth(false);
      }else{
        clearUnsubs();
        setProfile(null);
      }
    });
  },[]);

  useEffect(()=>{
    if(!user)return;
    if(!fbOk){setProfile(null);return;}
    const u=db.collection('profiles').doc(user.uid).onSnapshot(d=>{setProfile(d.exists?{uid:user.uid,...d.data()}:null);},()=>setProfile(null));
    addUnsub(u);return()=>u();
  },[user?.uid]);

  useEffect(()=>{navigator.geolocation?.getCurrentPosition(p=>{setULat(p.coords.latitude);setULng(p.coords.longitude);},()=>{},{timeout:8000});},[]);

  useEffect(()=>{
    if(!fbOk)return;
    const u=db.collection('courts').orderBy('createdAt','desc').onSnapshot(s=>{setCourts(s.docs.map(d=>({id:d.id,...d.data()})));},e=>{if(e.code!=='permission-denied')console.error(e);});
    return()=>u();
  },[]);

  useEffect(()=>{
    if(!fbOk||!user)return;
    const u=db.collection('games').where('status','==','active').onSnapshot(s=>{setGames(s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||b.timestamp||0)-(a.createdAt||a.timestamp||0)));},e=>{if(e.code!=='permission-denied')console.error(e);});
    addUnsub(u);return()=>u();
  },[user?.uid]);

  useEffect(()=>{
    if(!fbOk)return;
    const u=db.collection('findPlayers').where('status','==','active').onSnapshot(s=>{setPosts(s.docs.map(d=>({id:d.id,...d.data()})));},e=>{if(e.code!=='permission-denied')console.error(e);});
    return()=>u();
  },[]);

  useEffect(()=>{
    if(!fbOk||!user)return;
    const u=db.collection('conversations').where('participants','array-contains',user.uid).onSnapshot(s=>{let c=0;s.docs.forEach(d=>{const x=d.data();if(x.lastMessageBy!==user.uid&&x.lastTimestamp>(x[`readBy_${user.uid}`]||0))c++;});setUnread(c);},e=>{if(e.code!=='permission-denied')console.error(e);setUnread(0);});
    addUnsub(u);return()=>u();
  },[user?.uid]);

  const allPlayers=useMemo(()=>{const map={};posts.forEach(p=>{if(!map[p.uid])map[p.uid]={uid:p.uid,name:p.name,skill:p.skill,photoURL:p.photoURL};});return Object.values(map);},[posts]);

  const handleNeedLogin=player=>setLoginPromptPlayer(player===undefined?null:player);
  const handleGoAuth=()=>{setLoginPromptPlayer(undefined);setShowAuth(true);};
  const handleSignOut=async()=>{if(window.confirm('Sign out?')){clearUnsubs();await auth.signOut();switchTab('home');}};
  const handleFabStartGame=()=>{setShowFab(false);if(!user){handleNeedLogin(null);return;}switchTab('games');};
  const handleFabAvailable=()=>{setShowFab(false);if(!user){handleNeedLogin(null);return;}switchTab('players');};
  const handleFabQueue=()=>{setShowFab(false);if(!user){handleNeedLogin(null);return;}switchTab('courts');};

  // ── Loading
  if(user===undefined)return(
    <div className="app-shell" style={{alignItems:'center',justifyContent:'center'}}>
      <div style={{fontSize:'2.5rem',marginBottom:10}}>🏓</div>
      <div style={{fontSize:'0.82rem',color:'var(--muted)'}}>Loading…</div>
    </div>
  );

  // ── Auth screen (full page, inside app-shell so nav.js bars still show)
  if(showAuth)return(
    <div className="app-shell" style={{overflowY:'auto'}}>
      <AuthScreen onBack={()=>setShowAuth(false)}/>
    </div>
  );

  // ── New user profile setup
  if(user&&profile===null)return(
    <div className="app-shell">
      <ProfileSetup user={user} profile={null} onSave={p=>setProfile({uid:user.uid,...p})}/>
    </div>
  );

  return(
    <div className="app-shell">
      <div className="screen-body">
        {tab==='home'&&<HomeTab user={user} profile={profile} courts={courts} players={allPlayers} games={games} uLat={uLat} uLng={uLng} onChat={setChatP} onNeedLogin={handleNeedLogin} onSetTab={switchTab}/>}
        {tab==='courts'&&<CourtsTab courts={courts} uLat={uLat} uLng={uLng}/>}
        {tab==='games'&&<GamesTab user={user} profile={profile} games={games} onNeedLogin={handleNeedLogin}/>}
        {tab==='players'&&<PlayersTab user={user} posts={posts} players={allPlayers} onChat={setChatP} onNeedLogin={handleNeedLogin}/>}
        {tab==='profile'&&<ProfileTab user={user} profile={profile} unread={unread} onEditProfile={()=>setShowProfile(true)} onSignOut={handleSignOut} onGoAuth={handleGoAuth} onInbox={()=>setShowInbox(true)}/>}
      </div>

      {/* FAB */}
      <div className="fab-wrap">
        <div className={`fab ${showFab?'open':''}`} onClick={()=>setShowFab(!showFab)}>
          {showFab?'✕ Close':'🏓 I WANT TO PLAY'}
        </div>
      </div>

      {showFab&&<FabSheet onClose={()=>setShowFab(false)} onStartGame={handleFabStartGame} onAvailable={handleFabAvailable} onQueue={handleFabQueue}/>}
      {loginPromptPlayer!==undefined&&<LoginPrompt player={loginPromptPlayer} onClose={()=>setLoginPromptPlayer(undefined)} onGoAuth={handleGoAuth}/>}
      {chatP&&user&&profile&&<ChatModal player={chatP} myUid={user.uid} myName={profile.name} onClose={()=>setChatP(null)}/>}
      {showInbox&&user&&<Inbox onClose={()=>setShowInbox(false)} onOpen={p=>{setChatP(p);setShowInbox(false);}} myUid={user.uid} allPlayers={allPlayers}/>}
      {showProfile&&user&&<ProfileSetup user={user} profile={profile} onSave={p=>{setProfile({uid:user.uid,...p});setShowProfile(false);}} onClose={()=>setShowProfile(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script src="nav.js"></script>
</body>
</html>
