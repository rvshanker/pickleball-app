<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PickleConnect</title>
<meta name="theme-color" content="#0D1B2A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">  

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>

<style>
  :root {
    --bg-navy: #0D1B2A;
    --bg-card: #1B263B;
    --pcn-green: #2ECC71;
    --text-main: #F0F4F8;
    --text-muted: #7A9BB5;
    --border-color: rgba(255, 255, 255, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg-navy);
    color: var(--text-main);
    font-family: 'DM Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  #root { min-height: 100vh; display: flex; flex-direction: column; }
  .app-container { flex: 1; padding: 16px; max-width: 600px; margin: 0 auto; width: 100%; }
  .loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; gap: 16px; }
  .spinner { width: 40px; height: 40px; border: 4px solid var(--border-color); border-top-color: var(--pcn-green); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .pcn-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .fab-wrap { position: fixed; bottom: 80px; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; z-index: 900; }
  .fab { pointer-events: auto; background: linear-gradient(135deg, var(--pcn-green), #27AE60); color: white; font-weight: 800; padding: 14px 24px; border-radius: 30px; box-shadow: 0 6px 20px rgba(46,204,113,0.4); cursor: pointer; transition: transform 0.2s; font-size: 0.9rem; letter-spacing: 0.02em; }
  .fab:active { transform: scale(0.96); }
</style>
</head>
<body data-fixed-layout>

<div id="root">
  <div class="loading-screen">
    <div class="spinner"></div>
    <p style="color: #7A9BB5; font-size: 0.9rem; font-weight: 500;">Loading PickleConnect...</p>
  </div>
</div>

<script type="text/babel">
  const { useState, useEffect, useRef, useMemo } = React;

  const isNative = !!(window.Capacitor?.isNativePlatform?.());

  const FB = {
    apiKey: isNative ? "AIzaSyDjgdzr2gQlWMYnOYeLV56HBk5mdOXEDj8" : "AIzaSyDaFUszTD0-Ro292GOBSlS5vkZSdJM0NF4",
    authDomain: "pickleball-app-1bba7.firebaseapp.com",
    projectId: "pickleball-app-1bba7",
    storageBucket: "pickleball-app-1bba7.firebasestorage.app",
    messagingSenderId: "645604154338",
    appId: "1:645604154338:web:b92f87c2cd11d950b737bb"
  };

  let db = null;
  let auth = null;
  let fbOk = false;

  try {
    if (!firebase.apps.length) firebase.initializeApp(FB);
    db = firebase.firestore();
    auth = firebase.auth();
    fbOk = true;
  } catch (e) {
    console.error('Firebase Setup Error:', e);
  }

  /* Utility Helpers */
  const haversine = (a, b, c, d) => {
    const R = 3958.8, dL = (c - a) * Math.PI / 180, dN = (d - b) * Math.PI / 180;
    const x = Math.sin(dL / 2) ** 2 + Math.cos(a * Math.PI / 180) * Math.cos(c * Math.PI / 180) * Math.sin(dN / 2) ** 2;
    return R * 2 * Math.asin(Math.sqrt(x));
  };

  const timeAgo = t => {
    if (!t) return '';
    const d = Date.now() - t, m = Math.floor(d / 60000);
    if (m < 1) return 'now'; if (m < 60) return m + 'm';
    const h = Math.floor(m / 60); if (h < 24) return h + 'h';
    return Math.floor(h / 24) + 'd';
  };

  function App() {
    const [tab, setTab] = useState('home');
    const [user, setUser] = useState(null);
    const [profile, setProfile] = useState(null);
    const [loading, setLoading] = useState(true);
    const [showFab, setShowFab] = useState(false);
    
    // Core Layout View Controls
    const [showProfile, setShowProfile] = useState(false);
    const [showInbox, setShowInbox] = useState(false);
    const [showNotifSettingsApp, setShowNotifSettingsApp] = useState(false);
    const [chatP, setChatP] = useState(null);
    const [loginPromptPlayer, setLoginPromptPlayer] = useState(undefined);
    const [allPlayers, setAllPlayers] = useState([]);
    const [uLat, setULat] = useState(null);
    const [uLng, setULng] = useState(null);

    useEffect(() => {
      if (!fbOk) return;
      return auth.onAuthStateChanged(async (usr) => {
        setUser(usr);
        if (usr) {
          try {
            const pDoc = await db.collection('profiles').doc(usr.uid).get();
            if (pDoc.exists) {
              setProfile({ uid: usr.uid, ...pDoc.data() });
            } else {
              setShowProfile(true);
            }
          } catch(err) {
            console.error("Profile sync failure:", err);
          }
        } else {
          setProfile(null);
        }
        setLoading(false);
      });
    }, []);

    useEffect(() => {
      window.__pcnSetTab = (tabId) => {
        setTab(tabId);
        if (window.__pcnOnTabChange) window.__pcnOnTabChange(tabId);
      };
      
      window.__pcnOpenProfile = () => setShowProfile(true);
      window.__pcnOpenNotifSettings = () => setShowNotifSettingsApp(true);
      window.__pcnOpenInbox = () => setShowInbox(true);

      const initialHash = window.location.hash || '';
      if (initialHash.includes('tab=')) {
        const targetTab = initialHash.split('tab=')[1];
        if (targetTab) setTab(targetTab);
      }
    }, []);

    if (loading) {
      return (
        <div className="loading-screen">
          <div className="spinner"></div>
          <p style={{color: '#7A9BB5', fontSize: '0.9rem'}}>Loading Player Context...</p>
        </div>
      );
    }

    return (
      <div className="app-container">
        <header style={{marginBottom: '20px'}}>
          <h1 style={{fontFamily: 'Syne, sans-serif', fontSize: '1.6rem', fontWeight: 800}}>
            Welcome {profile?.name || user?.email || 'Player'}
          </h1>
          <p style={{color: 'var(--text-muted)', fontSize: '0.85rem'}}>
            Skill Level: <span style={{color: 'var(--pcn-green)', fontWeight: 700}}>{profile?.skill || 'Unrated'}</span>
          </p>
        </header>

        <main>
          {tab === 'home' && (
            <div className="pcn-card">
              <h3 style={{marginBottom: '8px'}}>🏓 Live Matches & Open Courts</h3>
              <p style={{fontSize: '0.9rem', color: 'var(--text-muted)'}}>Explore near real-time open matching groups active in your area.</p>
            </div>
          )}

          {tab === 'courts' && (
            <div className="pcn-card">
              <h3 style={{marginBottom: '8px'}}>🏟 Court Facilities</h3>
              <p style={{fontSize: '0.9rem', color: 'var(--text-muted)'}}>Checking local maps for active pickleball layout parameters.</p>
            </div>
          )}

          {tab === 'games' && (
            <div className="pcn-card">
              <h3 style={{marginBottom: '8px'}}>🎮 Scheduled Activities</h3>
              <p style={{fontSize: '0.9rem', color: 'var(--text-muted)'}}>Leagues, tournaments, and custom match queues.</p>
            </div>
          )}

          {tab === 'players' && (
            <div className="pcn-card">
              <h3 style={{marginBottom: '8px'}}>👥 Connected Community</h3>
              <p style={{fontSize: '0.9rem', color: 'var(--text-muted)'}}>Connect with local players sorted by geographical proximity.</p>
            </div>
          )}
        </main>

        {tab === 'home' && (
          <div className="fab-wrap">
            <div className="fab" onClick={() => setShowFab(!showFab)}>
              {showFab ? '✕ Close Layout' : '🏓 I WANT TO PLAY'}
            </div>
          </div>
        )}

        {/* View Layout Toggles linked to custom module components */}
        {showProfile && (
          <div style={{position:'fixed', inset:0, background:'rgba(13,27,42,0.98)', padding:'30px', zIndex:10000, overflowY:'auto'}}>
            <h2 style={{fontFamily:'Syne', marginBottom:'15px'}}>Setup Profile</h2>
            <button style={{background:'var(--pcn-green)', border:'none', color:'white', padding:'10px 20px', borderRadius:'8px', fontWeight:700}} onClick={() => setShowProfile(false)}>Close Wizard</button>
          </div>
        )}

        {showInbox && (
          <div style={{position:'fixed', inset:0, background:'rgba(13,27,42,0.98)', padding:'30px', zIndex:10000, overflowY:'auto'}}>
            <h2 style={{fontFamily:'Syne', marginBottom:'15px'}}>Messages Inbox</h2>
            <button style={{background:'var(--pcn-green)', border:'none', color:'white', padding:'10px 20px', borderRadius:'8px', fontWeight:700}} onClick={() => setShowInbox(false)}>Back to App</button>
          </div>
        )}

        {showNotifSettingsApp && (
          <div style={{position:'fixed', inset:0, background:'rgba(13,27,42,0.98)', padding:'30px', zIndex:10000, overflowY:'auto'}}>
            <h2 style={{fontFamily:'Syne', marginBottom:'15px'}}>Notification Settings</h2>
            <button style={{background:'var(--pcn-green)', border:'none', color:'white', padding:'10px 20px', borderRadius:'8px', fontWeight:700}} onClick={() => setShowNotifSettingsApp(false)}>Close</button>
          </div>
        )}
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>

<script src="nav.js"></script>

</body>
</html>
