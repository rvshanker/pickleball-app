<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India Price Compare - Client Side</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .card { background-color: #1e293b; border: 1px solid #334155; transition: transform 0.2s; }
        .card:hover { transform: translateY(-2px); border-color: #475569; }
        .amazon-border { border-left: 4px solid #ff9900; }
        .flipkart-border { border-left: 4px solid #2874f0; }
        .loader { border-top-color: #3b82f6; animation: spinner 0.6s linear infinite; }
        @keyframes spinner { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-8 font-sans">

    <div class="max-w-3xl mx-auto">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-white mb-2">PriceTrack <span class="text-blue-500">India</span></h1>
            <p class="text-slate-400 text-sm">Real-time comparison for iPhone 16 variants</p>
        </header>
        
        <!-- Search Controls -->
        <div class="flex flex-col sm:flex-row gap-3 mb-8">
            <input id="searchInput" type="text" value="iphone 16" 
                   class="flex-1 p-4 rounded-xl bg-slate-800 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 text-white font-medium">
            <button onclick="runSearch()" 
                    class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-xl font-bold transition-all shadow-lg active:scale-95">
                Compare Prices
            </button>
        </div>

        <!-- Status & Loader -->
        <div id="statusArea" class="flex items-center justify-center gap-3 mb-6 hidden">
            <div class="loader w-5 h-5 border-2 border-slate-700 rounded-full"></div>
            <span id="statusText" class="text-sm text-slate-400">Fetching live data...</span>
        </div>

        <!-- Results Container -->
        <div id="results" class="space-y-4">
            <!-- Dynamic cards will appear here -->
        </div>
    </div>

    <script>
        async function runSearch() {
            const query = document.getElementById('searchInput').value;
            const resultsDiv = document.getElementById('results');
            const statusArea = document.getElementById('statusArea');
            const statusText = document.getElementById('statusText');
            
            // Your Node.js Proxy Endpoint
            const PROXY_URL = "https://pickleconnect.live/fetch-price?url="; 

            resultsDiv.innerHTML = "";
            statusArea.classList.remove('hidden');

            const engines = [
                { 
                    name: 'Amazon', 
                    url: `https://www.amazon.in/s?k=`, 
                    container: '.s-result-item[data-component-type="s-search-result"]',
                    title: 'h2 span',
                    price: '.a-price-whole',
                    style: 'amazon-border'
                },
                { 
                    name: 'Flipkart', 
                    url: `https://www.flipkart.com/search?q=`, 
                    container: 'div[data-id]',
                    title: '.KzDlHZ, ._396cs4, ._4rR01T', // Multiple selectors for different Flipkart layouts
                    price: '.Nx9bqj, ._30jeq3',
                    style: 'flipkart-border'
                }
            ];

            for (const engine of engines) {
                statusText.innerText = `Searching ${engine.name}...`;
                
                try {
                    const target = engine.url + encodeURIComponent(query);
                    const response = await fetch(PROXY_URL + encodeURIComponent(target));
                    
                    if (!response.ok) throw new Error("Proxy error");
                    
                    const html = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, "text/html");
                    const items = doc.querySelectorAll(engine.container);

                    let foundCount = 0;

                    items.forEach(item => {
                        const titleText = item.querySelector(engine.title)?.innerText || "";
                        const rawPrice = item.querySelector(engine.price)?.innerText || "";
                        
                        // Clean price (removes ₹, commas, and decimals)
                        const cleanPrice = rawPrice.replace(/[^\d]/g, '');

                        // Smart Filter: Ensure query matches and it's not a dummy result
                        if (titleText.toLowerCase().includes(query.toLowerCase()) && cleanPrice.length > 3) {
                            
                            // Detect Storage Variant
                            let storage = "Standard";
                            const storageMatch = titleText.match(/(128|256|512)\s*GB/i);
                            if (storageMatch) storage = storageMatch[0].toUpperCase();

                            renderCard(engine, titleText, cleanPrice, storage);
                            foundCount++;
                        }
                    });

                    if (foundCount === 0) console.warn(`No specific items found for ${engine.name}`);

                } catch (err) {
                    console.error(`${engine.name} fail:`, err);
                }
            }
            
            statusArea.classList.add('hidden');
        }

        function renderCard(engine, title, price, storage) {
            const resultsDiv = document.getElementById('results');
            
            // Format price with Indian numbering system
            const formattedPrice = new Intl.NumberFormat('en-IN').format(price);

            const html = `
                <div class="card ${engine.style} p-5 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-[10px] font-black tracking-widest text-slate-500 uppercase">${engine.name}</span>
                            <span class="bg-blue-500/10 text-blue-400 text-[10px] px-2 py-0.5 rounded-full font-bold">${storage}</span>
                        </div>
                        <h3 class="text-md font-semibold text-slate-100 leading-snug">${title}</h3>
                    </div>
                    <div class="flex flex-row md:flex-col items-center md:items-end justify-between w-full md:w-auto border-t md:border-0 border-slate-700 pt-3 md:pt-0">
                        <div class="text-2xl font-black text-green-400">₹${formattedPrice}</div>
                        <button class="text-xs font-bold text-blue-400 hover:text-blue-300 underline underline-offset-4 mt-1">View Deal</button>
                    </div>
                </div>
            `;
            resultsDiv.insertAdjacentHTML('beforeend', html);
        }
    </script>
</body>
</html>
