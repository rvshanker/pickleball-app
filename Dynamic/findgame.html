        .waitlist-item:last-child{border-bottom:none;}
        .gc-actions{padding:0 16px 14px;display:flex;gap:8px;align-items:center;}
        .join-btn{flex:1;padding:11px;border-radius:10px;border:none;background:linear-gradient(135deg,#059669,#10b981);color:white;font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(5,150,105,.3);transition:all .2s;}
        .join-btn:hover{box-shadow:0 4px 14px rgba(5,150,105,.4);}
        .leave-btn{padding:11px 16px;border-radius:10px;border:2px solid #fca5a5;background:transparent;color:#dc2626;font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}

<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef,useMemo,useCallback}=React;

const FB={apiKey:"AIzaSyDaFUszTD0-Ro292GOBSlS5vkZSdJM0NF4",authDomain:"pickleball-app-1bba7.firebaseapp.com",projectId:"pickleball-app-1bba7",storageBucket:"pickleball-app-1bba7.firebasestorage.app",messagingSenderId:"645604154338",appId:"1:645604154338:web:b92f87c2cd11d950b737bb"};
let db=null,auth=null;
try{if(!firebase.apps.length)firebase.initializeApp(FB);db=firebase.firestore();auth=firebase.auth();}catch(e){console.error('FB:',e);}

const SKILLS=['Any','2.0-2.5','2.5-3.0','3.0-3.5','3.5-4.0','4.0-4.5','4.5-5.0','5.0+'];
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAY_SHORT=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function fmtTime(ts){
    if(!ts)return '';
    const[h,m]=ts.split(':').map(Number);
    return `${h%12||12}:${m.toString().padStart(2,'0')}${h>=12?'pm':'am'}`;
}
function fmtTimeRange(start,end){
    if(!start)return '';
    if(!end)return fmtTime(start);
    // If both end in same am/pm, omit am/pm on start
    const[sh,sm]=start.split(':').map(Number);
    const[eh,em]=end.split(':').map(Number);
    const startSuffix=sh>=12?'pm':'am';
    const endSuffix=eh>=12?'pm':'am';
    const startStr=`${sh%12||12}:${sm.toString().padStart(2,'0')}`;
    const endStr=`${eh%12||12}:${em.toString().padStart(2,'0')}${endSuffix}`;
    return startSuffix===endSuffix?`${startStr}–${endStr}`:`${startStr}${startSuffix}–${endStr}`;
}
function timeAgo(t){if(!t)return '';const d=Date.now()-t,m=Math.floor(d/60000);if(m<1)return 'just now';if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago';}
function getDateParts(ds){
    if(!ds)return{dayStr:'?',numStr:'?',rel:'future'};
    const d=new Date(ds+'T12:00:00');
    const today=new Date();today.setHours(0,0,0,0);
    const target=new Date(d.getFullYear(),d.getMonth(),d.getDate());
    const diff=Math.round((target-today)/86400000);
    return{dayStr:DAY_SHORT[d.getDay()],numStr:d.getDate(),rel:diff===0?'today':diff<=2?'soon':'future'};
}
// Expired = end time has passed (or start if no end)
function isExpired(g){
    const timeToCheck=g.timeEnd||g.time;
    if(!g.date||!timeToCheck)return false;
    return new Date(g.date+'T'+timeToCheck)<new Date();
}

// ── Avatar ──────────────────────────────────────────────────────────────
function Avatar({photoURL,name,size=36}){
    const letter=(name||'?')[0].toUpperCase();
    return(<div style={{width:size,height:size,borderRadius:'50%',background:'linear-gradient(135deg,#d1fae5,#a7f3d0)',display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',flexShrink:0,border:'2px solid rgba(255,255,255,.5)'}}>
        {photoURL?<img src={photoURL} alt={name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
        :<span style={{fontSize:size*.44,fontWeight:700,color:'#059669'}}>{letter}</span>}
    </div>);
}

function Toast({msg}){return msg?<div className="toast">{msg}</div>:null;}

// ── User Pill ───────────────────────────────────────────────────────────
function UserPill({user,profile,onSignOut}){
    const[open,setOpen]=useState(false);
    const ref=useRef();
    useEffect(()=>{const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};document.addEventListener('mousedown',h);return()=>document.removeEventListener('mousedown',h);},[]);
    return(<div className="user-pill" ref={ref} onClick={()=>setOpen(!open)}>
        <Avatar photoURL={user.photoURL} name={profile?.name||user.email} size={28}/>
        <span>{(profile?.name||user.email||'').split(' ')[0]}</span>
        {open&&<div className="upd"><button className="upd-item danger" onClick={onSignOut}>🚪 Sign Out</button></div>}
    </div>);
}

// ── Auth Screen — email/password only ───────────────────────────────────
function AuthScreen(){
    const[mode,setMode]=useState('signin');
    const[email,setEmail]=useState('');
    const[pass,setPass]=useState('');
    const[confirm,setConfirm]=useState('');
    const[ld,setLd]=useState(false);
    const[err,setErr]=useState(null);

    const emailAuth=async()=>{
        if(!email.trim()||!pass){setErr('Enter email and password.');return;}
        if(mode==='signup'&&pass!==confirm){setErr('Passwords do not match.');return;}
        if(mode==='signup'&&pass.length<6){setErr('Password must be at least 6 characters.');return;}
        setLd(true);setErr(null);
        try{
            if(mode==='signup')await auth.createUserWithEmailAndPassword(email.trim(),pass);
            else await auth.signInWithEmailAndPassword(email.trim(),pass);
        }catch(e){
            const msg={'auth/email-already-in-use':'Account exists — sign in instead.','auth/user-not-found':'No account found.','auth/wrong-password':'Incorrect password.','auth/invalid-email':'Invalid email.','auth/too-many-requests':'Too many attempts. Try later.','auth/invalid-credential':'Invalid email or password.'}[e.code]||e.message;
            setErr(msg);
        }
        setLd(false);
    };

    return(<div className="hero-bg">
        <div className="nav">
            <a href="index.html" style={{textDecoration:'none'}}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.6)" strokeWidth="2.5"><path d="M15 18l-6-6 6-6"/></svg></a>
            <div className="nav-logo">🏓 PICKLECONNECT</div>
        </div>
        <div className="auth-screen">
            <div style={{fontSize:56,marginBottom:12}}>🎮</div>
            <div className="fd" style={{fontSize:34,fontWeight:800,color:'white',marginBottom:6}}>FIND A GAME</div>
            <div style={{fontSize:14,color:'rgba(255,255,255,.65)',marginBottom:24,maxWidth:320,lineHeight:1.5}}>Organize doubles games, fill 4 spots, and get notified when you're set to play.</div>
            <div style={{display:'flex',background:'rgba(255,255,255,.12)',borderRadius:10,padding:3,marginBottom:20,width:'100%',maxWidth:340}}>
                {[['signin','Sign In'],['signup','Sign Up']].map(([k,l])=><button key={k} onClick={()=>{setMode(k);setErr(null);}} style={{flex:1,padding:'9px',border:'none',borderRadius:8,fontFamily:'Outfit',fontSize:13,fontWeight:700,cursor:'pointer',background:mode===k?'white':'transparent',color:mode===k?'#059669':'rgba(255,255,255,.75)'}}>{l}</button>)}
            </div>
            {err&&<div style={{background:'rgba(239,68,68,.15)',border:'1px solid rgba(239,68,68,.3)',borderRadius:10,padding:'10px 14px',marginBottom:14,maxWidth:340,width:'100%',fontSize:12,color:'#fecaca',textAlign:'left'}}>⚠️ {err}</div>}
            <div style={{width:'100%',maxWidth:340,display:'flex',flexDirection:'column',gap:8}}>
                <input value={email} onChange={e=>setEmail(e.target.value)} type="email" placeholder="Email address" style={{padding:'11px 14px',borderRadius:10,border:'2px solid rgba(255,255,255,.2)',background:'rgba(255,255,255,.12)',color:'white',fontFamily:'Outfit',fontSize:14,outline:'none',width:'100%'}} onKeyDown={e=>e.key==='Enter'&&emailAuth()}/>
                <input value={pass} onChange={e=>setPass(e.target.value)} type="password" placeholder="Password" style={{padding:'11px 14px',borderRadius:10,border:'2px solid rgba(255,255,255,.2)',background:'rgba(255,255,255,.12)',color:'white',fontFamily:'Outfit',fontSize:14,outline:'none',width:'100%'}} onKeyDown={e=>e.key==='Enter'&&emailAuth()}/>
                {mode==='signup'&&<input value={confirm} onChange={e=>setConfirm(e.target.value)} type="password" placeholder="Confirm password" style={{padding:'11px 14px',borderRadius:10,border:'2px solid rgba(255,255,255,.2)',background:'rgba(255,255,255,.12)',color:'white',fontFamily:'Outfit',fontSize:14,outline:'none',width:'100%'}} onKeyDown={e=>e.key==='Enter'&&emailAuth()}/>}
                <button onClick={emailAuth} disabled={ld} style={{padding:'12px',borderRadius:10,border:'none',background:'linear-gradient(135deg,#059669,#10b981)',color:'white',fontFamily:'Outfit',fontSize:14,fontWeight:700,cursor:'pointer',opacity:ld?.6:1}}>
                    {ld?'Please wait…':mode==='signup'?'✅ Create Account':'→ Sign In'}
                </button>
                {mode==='signin'&&<button onClick={async()=>{if(!email.trim()){setErr('Enter your email first.');return;}try{await auth.sendPasswordResetEmail(email.trim());alert('Reset email sent!');}catch(e){setErr(e.message);}}} style={{background:'none',border:'none',color:'rgba(255,255,255,.45)',fontSize:11,cursor:'pointer',fontFamily:'Outfit',textAlign:'right',padding:'2px 0'}}>Forgot password?</button>}
            </div>
            <div style={{fontSize:11,color:'rgba(255,255,255,.35)',marginTop:20}}>Free · Takes 30 seconds</div>
        </div>
    </div>);
}

// ── Slot ─────────────────────────────────────────────────────────────────
function Slot({player,isMine,onJoin,isFull}){
    if(player){
        return(<div className={`slot ${isMine?'mine':'filled'}`} style={{animation:'popIn .3s ease'}}>
            <Avatar photoURL={player.photoURL} name={player.name} size={36}/>
            <div style={{minWidth:0}}>
                <div className="slot-name" style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{player.name}{isMine?' (you)':''}</div>
                <div className="slot-skill">{player.skill&&player.skill!=='Any'?player.skill:'Any level'}</div>
            </div>
            {isMine&&<div style={{marginLeft:'auto',fontSize:15,flexShrink:0}}>✅</div>}
        </div>);
    }
    return(<div className="slot empty" onClick={isFull?null:onJoin} style={{cursor:isFull?'default':'pointer',opacity:isFull?.4:1}}>
        <div className="slot-empty-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="2.5"><path d="M12 5v14M5 12h14"/></svg></div>
        <div className="slot-empty-text">{isFull?'Game full':'Tap to join'}</div>
    </div>);
}

// ── Game Form ─────────────────────────────────────────────────────────────
function GameForm({user,profile,onClose,onSaved,editData}){
    const today=new Date().toISOString().split('T')[0];
    const[title,setTitle]=useState(editData?.title||'');
    const[date,setDate]=useState(editData?.date||today);
    const[timeStart,setTimeStart]=useState(editData?.time||'16:00');
    const[timeEnd,setTimeEnd]=useState(editData?.timeEnd||'18:00');
    const[court,setCourt]=useState(editData?.court||'');
    const[skill,setSkill]=useState(editData?.skill||'Any');
    const[note,setNote]=useState(editData?.note||'');
    const[recurring,setRecurring]=useState(editData?.recurring||false);
    const[recurDay,setRecurDay]=useState(editData?.recurDay!==undefined?editData.recurDay:new Date().getDay());
    const[saving,setSaving]=useState(false);
    const[err,setErr]=useState(null);

    const save=async()=>{
        if(!court.trim()){setErr('Enter a court or location.');return;}
        if(!date){setErr('Pick a date.');return;}
        if(!timeStart){setErr('Pick a start time.');return;}
        setSaving(true);setErr(null);
        const courtTrim=court.trim();
        const data={
            title:title.trim()||`Doubles @ ${courtTrim}`,
            date,
            time:timeStart,
            timeEnd:timeEnd||null,
            court:courtTrim,
            skill,
            note:note.trim(),
            recurring,
            recurDay:recurring?parseInt(recurDay):null,
            organizerUid:user.uid,
            organizerName:profile?.name||user.email,
            organizerPhoto:user.photoURL||null,
            players:[{uid:user.uid,name:profile?.name||user.email,photoURL:user.photoURL||null,skill:profile?.skill||'Any',joinedAt:Date.now()}],
            waitlist:[],
            status:'active',
            createdAt:editData?.createdAt||Date.now(),
            updatedAt:Date.now(),
        };
        try{
            if(editData?.id){
                await db.collection('games').doc(editData.id).update({
                    title:data.title,date:data.date,time:data.time,timeEnd:data.timeEnd,
                    court:data.court,skill:data.skill,note:data.note,
                    recurring:data.recurring,recurDay:data.recurDay,
                    updatedAt:data.updatedAt,
                });
            } else {
                await db.collection('games').add(data);
            }
            onSaved();
        }catch(e){setErr(e.message);setSaving(false);}
    };

    return(<div className="mo" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
        <div className="ms">
            <div className="mh"/>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
                <div className="fd" style={{fontSize:20,fontWeight:800,color:'#0f172a'}}>{editData?'✏️ EDIT GAME':'🎮 CREATE GAME'}</div>
                <button onClick={onClose} style={{background:'#f1f5f9',border:'none',borderRadius:8,width:30,height:30,fontSize:14,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
            </div>

            {err&&<div style={{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:10,padding:'10px 14px',marginBottom:14,fontSize:12,color:'#dc2626'}}>⚠️ {err}</div>}

            <div className="fg">
                <label className="fl">Court / Location *</label>
                <input className="fi" value={court} onChange={e=>setCourt(e.target.value)} placeholder="e.g. Centennial Park Court 3"/>
            </div>

            <div className="fg">
                <label className="fl">Date *</label>
                <input className="fi" type="date" value={date} min={today} onChange={e=>setDate(e.target.value)}/>
            </div>

            <div className="time-row fg">
                <div>
                    <label className="fl">Start Time *</label>
                    <input className="fi" type="time" value={timeStart} onChange={e=>{setTimeStart(e.target.value);
                        // Auto-advance end time by 2h when start changes
                        if(e.target.value){const[h,m]=e.target.value.split(':').map(Number);const eh=(h+2)%24;setTimeEnd(`${eh.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`);}}
                    }/>
                </div>
                <div>
                    <label className="fl">End Time</label>
                    <input className="fi" type="time" value={timeEnd} onChange={e=>setTimeEnd(e.target.value)}/>
                </div>
            </div>

            <div className="fg">
                <label className="fl">Skill Level</label>
                <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                    {SKILLS.map(s=><button key={s} className={`ob ${skill===s?'s':''}`} onClick={()=>setSkill(s)}>{s}</button>)}
                </div>
                <div className="skill-note">Players outside this range can still join — it's a guideline.</div>
            </div>

            <div className="fg">
                <label className="fl">Game Title (optional)</label>
                <input className="fi" value={title} onChange={e=>setTitle(e.target.value)} placeholder={`Doubles @ ${court||'court name'}`}/>
            </div>

            <div className="fg">
                <label className="fl">Recurring?</label>
                <div style={{display:'flex',gap:8,marginBottom:8}}>
                    <button className={`ob ${!recurring?'s':''}`} onClick={()=>setRecurring(false)}>One-off</button>
                    <button className={`ob ${recurring?'s':''}`} onClick={()=>setRecurring(true)}>🔁 Weekly</button>
                </div>
                {recurring&&<div>
                    <label className="fl" style={{marginBottom:5}}>Repeats every</label>
                    <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                        {DAYS.map((d,i)=><button key={i} className={`ob ${recurDay==i?'s':''}`} onClick={()=>setRecurDay(i)}>{DAY_SHORT[i]}</button>)}
                    </div>
                </div>}
            </div>

            <div className="fg">
                <label className="fl">Note (optional)</label>
                <textarea className="fi" value={note} onChange={e=>setNote(e.target.value)} placeholder="e.g. Bring a can of balls, wear non-marking shoes…" rows={2} style={{resize:'vertical',minHeight:50}}/>
            </div>

            <div style={{background:'#f0fdf4',borderRadius:10,padding:'10px 14px',marginBottom:16,fontSize:12,color:'#059669',display:'flex',gap:8}}>
                <span>ℹ️</span>
                <span>You'll be added as player 1. All 4 players get notified when the game is full.</span>
            </div>

            <button onClick={save} disabled={saving} className="btn-g" style={{width:'100%',padding:'13px',fontSize:15}}>
                {saving?'Saving…':editData?'Save Changes':'🎮 Create Game'}
            </button>
        </div>
    </div>);
}

// ── Game Card ─────────────────────────────────────────────────────────────
function GameCard({game,myUid,myProfile,onJoin,onLeave,onWaitlist,onEdit,onCancel,showToast}){
    const[expanded,setExpanded]=useState(false);
    const players=game.players||[];
    const waitlist=game.waitlist||[];
    const isFull=players.length>=4;
    const isMine=game.organizerUid===myUid;
    const amIn=players.some(p=>p.uid===myUid);
    const amWaiting=waitlist.some(p=>p.uid===myUid);
    const expired=isExpired(game);
    const{dayStr,numStr,rel}=getDateParts(game.date);
    const timeLabel=fmtTimeRange(game.time,game.timeEnd);
    const cardClass=`gc ${game.recurring?'recurring':isFull?'full':'open'}`;

    return(<div className={cardClass} style={{opacity:expired?.55:1}}>
        {/* Header */}
        <div className="gc-head" onClick={()=>setExpanded(!expanded)}>
            <div className={`gc-date-block ${rel}`}>
                <div className="gc-day">{rel==='today'?'TODAY':dayStr}</div>
                <div className="gc-num">{numStr}</div>
            </div>
            <div className="gc-info">
                <div className="gc-title">
                    {game.recurring&&<span className="rec-dot"/>}
                    {game.title||`Doubles @ ${game.court}`}
                </div>
                <div className="gc-sub">
                    <span>📍 {game.court}</span>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:6,marginTop:6,flexWrap:'wrap'}}>
                    {timeLabel&&<span className="time-chip">⏰ {timeLabel}</span>}
                    {isFull?<span className="gc-badge full-badge">🎉 Full</span>:<span className="gc-badge open-badge">{4-players.length} spot{4-players.length!==1?'s':''} open</span>}
                    {game.recurring&&<span className="gc-badge rec-badge">🔁 Weekly</span>}
                    {game.skill&&game.skill!=='Any'&&<span className="gc-badge" style={{background:'#f0f9ff',color:'#0369a1'}}>🎯 {game.skill}</span>}
                </div>
            </div>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="2.5" style={{transform:expanded?'rotate(180deg)':'none',transition:'transform .2s',flexShrink:0,marginTop:4}}><path d="M6 9l6 6 6-6"/></svg>
        </div>

        {/* Roster — always visible */}
        <div className="roster">
            {[0,1,2,3].map(i=>{
                const p=players[i];
                return<Slot key={i} player={p} isMine={p?.uid===myUid} onJoin={()=>onJoin(game)} isFull={isFull&&!p}/>;
            })}
        </div>

        {/* Full banner */}
        {isFull&&<div className="full-banner">
            <span style={{fontSize:22}}>🎉</span>
            <div>
                <div className="full-banner-text">Game is full — you're all set!</div>
                <div className="full-banner-sub">All 4 players have been notified.</div>
            </div>
        </div>}

        {/* Waitlist */}
        {waitlist.length>0&&<div className="waitlist">
            <div style={{fontSize:10,fontWeight:700,color:'#94a3b8',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:6}}>⏳ Waitlist ({waitlist.length})</div>
            {waitlist.map((p,i)=><div key={i} className="waitlist-item">
                <Avatar photoURL={p.photoURL} name={p.name} size={28}/>
                <div style={{fontSize:12,fontWeight:600,color:'#475569'}}>{p.name}</div>
                {p.uid===myUid&&<div style={{marginLeft:'auto',fontSize:10,color:'#d97706',fontWeight:700}}>You're #{i+1}</div>}
            </div>)}
        </div>}

        {/* Expanded details */}
        {expanded&&<div style={{padding:'0 16px 14px',borderTop:'1px solid #f1f5f9',animation:'fadeIn .2s'}}>
            {game.note&&<div style={{fontSize:13,color:'#475569',marginBottom:8,lineHeight:1.5}}>💬 {game.note}</div>}
            {game.recurring&&<div style={{fontSize:12,color:'#7c3aed',fontWeight:600,marginBottom:6}}>🔁 Repeats every {DAYS[game.recurDay]} · {timeLabel}</div>}
            <div style={{fontSize:11,color:'#94a3b8'}}>Posted {timeAgo(game.createdAt)} by {game.organizerName}</div>
        </div>}

        {/* Organizer row */}
        <div className="organizer-row">
            <Avatar photoURL={game.organizerPhoto} name={game.organizerName} size={20}/>
            <span>by {isMine?'you':game.organizerName}</span>
            {expired&&<span style={{color:'#f59e0b',fontWeight:700,fontSize:11,marginLeft:4}}>· ended</span>}
            {isMine&&!expired&&<>
                <button onClick={()=>onEdit(game)} style={{marginLeft:8,background:'#f0fdf4',border:'none',fontSize:11,color:'#059669',fontWeight:700,cursor:'pointer',fontFamily:'Outfit',padding:'2px 8px',borderRadius:6}}>Edit</button>
                <button className="cancel-btn" onClick={()=>onCancel(game.id)}>Cancel</button>
            </>}
        </div>

        {/* Actions */}
        {!expired&&<div className="gc-actions">
            {amIn?(
                isMine
                    ?<div style={{flex:1,fontSize:12,color:'#059669',fontWeight:600,display:'flex',alignItems:'center',gap:6}}>✅ You're in as organizer</div>
                    :<button className="leave-btn" onClick={()=>onLeave(game)}>Leave game</button>
            ):isFull?(
                amWaiting
                    ?<div style={{flex:1,fontSize:12,color:'#d97706',fontWeight:600}}>⏳ On waitlist</div>
                    :<button className="waitlist-btn" onClick={()=>onWaitlist(game)}>+ Join Waitlist</button>
            ):(
                <button className="join-btn" onClick={()=>onJoin(game)}>🏓 I'm In!</button>
            )}
        </div>}
    </div>);
}

// ── Skeleton ──────────────────────────────────────────────────────────────
function Skel(){return(<div className="gc" style={{border:'none',padding:16}}>
    <div style={{display:'flex',gap:12,marginBottom:16}}>
        <div className="skeleton" style={{width:52,height:52,borderRadius:12,flexShrink:0}}/>
        <div style={{flex:1}}><div className="skeleton" style={{height:16,marginBottom:8,borderRadius:6}}/><div className="skeleton" style={{height:12,width:'70%',borderRadius:6}}/></div>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
        {[0,1,2,3].map(i=><div key={i} className="skeleton" style={{height:56,borderRadius:12}}/>)}
    </div>
</div>);}

// ── Main App ──────────────────────────────────────────────────────────────
function App(){
    const[user,setUser]=useState(undefined);
    const[profile,setProfile]=useState(undefined);
    const[games,setGames]=useState([]);
    const[loading,setLoading]=useState(true);
    const[tab,setTab]=useState('upcoming');
    const[showForm,setShowForm]=useState(false);
    const[editGame,setEditGame]=useState(null);
    const[toast,setToast]=useState(null);
    const toastRef=useRef();

    const showToast=useCallback((msg)=>{
        setToast(msg);
        clearTimeout(toastRef.current);
        toastRef.current=setTimeout(()=>setToast(null),3200);
    },[]);

    // Auth listener
    useEffect(()=>{
        if(!auth)return;
        return auth.onAuthStateChanged(async u=>{
            setUser(u||null);
            if(u){
                try{
                    const snap=await db.collection('profiles').doc(u.uid).get();
                    setProfile(snap.exists?snap.data():null);
                }catch(e){setProfile(null);}
            }else{setProfile(null);}
        });
    },[]);

    // Load games — simple query on status only, sort client-side (avoids composite index requirement)
    useEffect(()=>{
        if(!db||!user)return;
        setLoading(true);
        const unsub=db.collection('games')
            .where('status','==','active')
            .onSnapshot(snap=>{
                const data=snap.docs.map(d=>({id:d.id,...d.data()}));
                setGames(data);
                setLoading(false);
            },err=>{
                console.error('Games query error:',err);
                setLoading(false);
            });
        return unsub;
    },[user]);

    const signOut=async()=>{if(confirm('Sign out?'))await auth.signOut();};

    const joinGame=async(game)=>{
        const players=game.players||[];
        if(players.length>=4){showToast('Game is already full!');return;}
        if(players.some(p=>p.uid===user.uid)){showToast("You're already in!");return;}
        const me={uid:user.uid,name:profile?.name||user.email,photoURL:user.photoURL||null,skill:profile?.skill||'Any',joinedAt:Date.now()};
        const newPlayers=[...players,me];
        const update={players:newPlayers,updatedAt:Date.now()};
        if(newPlayers.length===4){update.fullAt=Date.now();}
        await db.collection('games').doc(game.id).update(update);
        showToast(newPlayers.length===4?'🎉 Game is full! All players notified.':'✅ You joined the game!');
    };

    const leaveGame=async(game)=>{
        if(!confirm('Leave this game?'))return;
        const players=(game.players||[]).filter(p=>p.uid!==user.uid);
        const waitlist=game.waitlist||[];
        let newPlayers=players,newWaitlist=waitlist;
        if(waitlist.length>0){
            newPlayers=[...players,waitlist[0]];
            newWaitlist=waitlist.slice(1);
            showToast(`${waitlist[0].name} moved from waitlist!`);
        }else{showToast('You left the game.');}
        await db.collection('games').doc(game.id).update({players:newPlayers,waitlist:newWaitlist,updatedAt:Date.now()});
    };

    const joinWaitlist=async(game)=>{
        const waitlist=game.waitlist||[];
        if(waitlist.some(p=>p.uid===user.uid)){showToast("You're already on the waitlist.");return;}
        const me={uid:user.uid,name:profile?.name||user.email,photoURL:user.photoURL||null,addedAt:Date.now()};
        await db.collection('games').doc(game.id).update({waitlist:[...waitlist,me],updatedAt:Date.now()});
        showToast("⏳ On waitlist — you'll be notified if a spot opens!");
    };

    const cancelGame=async(id)=>{
        if(!confirm('Cancel this game? This cannot be undone.'))return;
        await db.collection('games').doc(id).update({status:'cancelled',updatedAt:Date.now()});
        showToast('Game cancelled.');
    };

    // Client-side sort & filter — no composite index needed
    const filtered=useMemo(()=>{
        return games
            .filter(g=>{
                const exp=isExpired(g);
                if(tab==='upcoming')return !exp;
                if(tab==='mine')return g.organizerUid===user?.uid||(g.players||[]).some(p=>p.uid===user?.uid);
                if(tab==='open')return !exp&&(g.players||[]).length<4;
                if(tab==='recurring')return g.recurring&&!exp;
                return true;
            })
            .sort((a,b)=>{
                // Sort by date then start time
                if(a.date!==b.date)return (a.date||'').localeCompare(b.date||'');
                return (a.time||'').localeCompare(b.time||'');
            });
    },[games,tab,user]);

    const openCount=games.filter(g=>!isExpired(g)&&(g.players||[]).length<4).length;

    if(user===undefined||profile===undefined)return(
        <div className="hero-bg"><div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',color:'white',fontSize:16}}>Loading…</div></div>
    );
    if(!user)return <AuthScreen/>;

    return(<div className="hero-bg">
        <div className="nav">
            <a href="index.html" style={{textDecoration:'none'}}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.6)" strokeWidth="2.5"><path d="M15 18l-6-6 6-6"/></svg></a>
            <div className="nav-logo" style={{flex:1}}>🏓 PICKLECONNECT</div>
            <UserPill user={user} profile={profile} onSignOut={signOut}/>
        </div>

        <div className="content">
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
                <div>
                    <div className="page-title">Find a Game</div>
                    <div style={{fontSize:12,color:'rgba(255,255,255,.6)',marginTop:2}}>Fill 4 spots · Play doubles</div>
                </div>
                <button className="post-btn" onClick={()=>{setEditGame(null);setShowForm(true);}}>🎮 Create Game</button>
            </div>

            <div className="tab-bar">
                {[['upcoming','📅 Upcoming'],['open','🟢 Open'],['recurring','🔁 Weekly'],['mine','👤 Mine']].map(([k,l])=>(
                    <button key={k} className={`tab-btn ${tab===k?'active':'inactive'}`} onClick={()=>setTab(k)}>{l}</button>
                ))}
            </div>

            <div style={{fontSize:12,color:'rgba(255,255,255,.5)',marginBottom:12,paddingLeft:2}}>
                {filtered.length} game{filtered.length!==1?'s':''}
                {tab==='upcoming'&&openCount>0&&<span style={{color:'#6ee7b7',fontWeight:600,marginLeft:6}}>· {openCount} need players</span>}
            </div>

            {loading
                ?[1,2,3].map(i=><Skel key={i}/>)
                :filtered.length===0
                    ?<div className="empty-state">
                        <div style={{fontSize:44,marginBottom:12}}>🏓</div>
                        <div style={{fontSize:18,fontWeight:700,color:'white',marginBottom:6}}>{tab==='mine'?'No games yet':'No games found'}</div>
                        <div style={{fontSize:13,color:'rgba(255,255,255,.6)',marginBottom:20,lineHeight:1.5}}>{tab==='mine'?'Create a game and fill 4 spots to play doubles.':'Be the first to post a doubles game!'}</div>
                        <button className="btn-g" onClick={()=>{setEditGame(null);setShowForm(true);}}>🎮 Create a Game</button>
                    </div>
                    :filtered.map(g=><GameCard
                        key={g.id} game={g} myUid={user.uid} myProfile={profile}
                        onJoin={joinGame} onLeave={leaveGame} onWaitlist={joinWaitlist}
                        onEdit={g=>{setEditGame(g);setShowForm(true);}}
                        onCancel={cancelGame} showToast={showToast}
                    />)
            }

            <div style={{display:'flex',gap:8,marginTop:16}}>
                <a href="findplayer.html" style={{flex:1,display:'flex',alignItems:'center',gap:10,background:'linear-gradient(135deg,#0f766e,#14b8a6)',borderRadius:12,padding:'14px 16px',textDecoration:'none',boxShadow:'0 4px 12px rgba(15,118,110,.3)'}}>
                    <span style={{fontSize:22}}>👤</span>
                    <div><div className="fd" style={{fontSize:14,fontWeight:800,color:'white'}}>FIND PLAYERS</div><div style={{fontSize:10,color:'rgba(255,255,255,.7)'}}>Browse who's available</div></div>
                </a>
                <a href="index.html" style={{flex:1,display:'flex',alignItems:'center',gap:10,background:'linear-gradient(135deg,#1e40af,#3b82f6)',borderRadius:12,padding:'14px 16px',textDecoration:'none',boxShadow:'0 4px 12px rgba(30,64,175,.3)'}}>
                    <span style={{fontSize:22}}>🏟️</span>
                    <div><div className="fd" style={{fontSize:14,fontWeight:800,color:'white'}}>COURTS</div><div style={{fontSize:10,color:'rgba(255,255,255,.7)'}}>Find & book courts</div></div>
                </a>
            </div>
        </div>

        <button className="fab" onClick={()=>{setEditGame(null);setShowForm(true);}} title="Create Game">+</button>

        {showForm&&<GameForm
            user={user} profile={profile} editData={editGame}
            onClose={()=>{setShowForm(false);setEditGame(null);}}
            onSaved={()=>{setShowForm(false);setEditGame(null);showToast(editGame?'Game updated!':'🎮 Game created!');}}
        />}

        <Toast msg={toast}/>
    </div>);
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
