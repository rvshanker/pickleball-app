<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Tournament</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #00E87A;
    --green-dark: #00b85f;
    --dark: #0D0F14;
    --card: #161920;
    --card2: #1E2230;
    --border: rgba(255,255,255,0.07);
    --text: #F0F2F8;
    --muted: #6B7280;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--dark);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background-image: 
      radial-gradient(ellipse 60% 40% at 80% 0%, rgba(0,232,122,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 40% 50% at 10% 100%, rgba(0,100,255,0.05) 0%, transparent 60%);
  }

  .container {
    width: 100%;
    max-width: 620px;
    animation: fadeUp 0.6s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .header {
    margin-bottom: 32px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(0,232,122,0.1);
    border: 1px solid rgba(0,232,122,0.25);
    color: var(--green);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 100px;
    margin-bottom: 14px;
  }

  .badge::before { content: '🏆'; font-size: 12px; }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 58px;
    color: var(--text);
    line-height: 0.95;
    letter-spacing: 0.02em;
  }

  h1 span { color: var(--green); }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-top: 10px;
    font-weight: 400;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,232,122,0.3), transparent);
  }

  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  /* Tournament Name */
  .name-input-wrap {
    position: relative;
  }

  .name-input-wrap input {
    width: 100%;
    background: var(--card2);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .name-input-wrap input::placeholder { color: var(--muted); }

  .name-input-wrap input:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(0,232,122,0.12);
  }

  /* Two column grid */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  /* Toggle group */
  .toggle-group {
    display: flex;
    gap: 8px;
    background: var(--card2);
    padding: 6px;
    border-radius: 12px;
  }

  .toggle-btn {
    flex: 1;
    padding: 10px 0;
    border: none;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--muted);
    background: transparent;
  }

  .toggle-btn.active {
    background: var(--green);
    color: #000;
    box-shadow: 0 4px 16px rgba(0,232,122,0.3);
  }

  /* Partner mode - 3 buttons */
  .toggle-group.three .toggle-btn { font-size: 13px; }

  /* Stats row */
  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }

  .stat-box {
    background: var(--card2);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    position: relative;
  }

  .stat-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .stat-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .stat-btn {
    width: 28px; height: 28px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    line-height: 1;
  }

  .stat-btn:hover { border-color: var(--green); color: var(--green); }

  .stat-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    color: var(--text);
    line-height: 1;
  }

  /* Player grid */
  .player-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }

  .player-input {
    position: relative;
  }

  .player-input .num {
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    font-weight: 700;
    color: var(--green);
    opacity: 0.7;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 0.05em;
  }

  .player-input input {
    width: 100%;
    background: var(--card2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 12px 12px 30px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }

  .player-input input::placeholder { color: #444; }

  .player-input input:focus {
    border-color: var(--green);
  }

  /* Quick guide */
  .guide-bar {
    background: linear-gradient(135deg, rgba(0,232,122,0.06), rgba(0,100,255,0.06));
    border: 1px solid rgba(0,232,122,0.15);
    border-radius: 14px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    cursor: pointer;
  }

  .guide-bar-left {
    display: flex; align-items: center; gap: 10px;
    font-size: 14px; font-weight: 600; color: var(--text);
  }

  .guide-icon {
    width: 32px; height: 32px;
    background: rgba(0,232,122,0.15);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }

  .guide-plus {
    color: var(--green);
    font-size: 20px;
    font-weight: 300;
  }

  /* Actions */
  .actions { display: flex; gap: 12px; margin-top: 24px; }

  .btn-secondary {
    flex: 1;
    padding: 16px;
    background: var(--card2);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-secondary:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

  .btn-primary {
    flex: 2;
    padding: 16px;
    background: var(--green);
    border: none;
    border-radius: 14px;
    color: #000;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 8px 24px rgba(0,232,122,0.25);
    letter-spacing: 0.01em;
  }

  .btn-primary:hover {
    background: #00ff88;
    transform: translateY(-1px);
    box-shadow: 0 12px 32px rgba(0,232,122,0.35);
  }

  .btn-primary::after { content: '→'; font-size: 18px; }

  .clear-link {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 10px;
    transition: color 0.2s;
  }

  .clear-link:hover { color: var(--text); }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="badge">Tournament Setup</div>
    <h1>NEW <span>TOURNA<br>MENT</span></h1>
    <p class="subtitle">Configure your brackets and get ready to play</p>
  </div>

  <!-- Quick Start Guide -->
  <div class="guide-bar">
    <div class="guide-bar-left">
      <div class="guide-icon">📖</div>
      Quick Start Guide
    </div>
    <div class="guide-plus">+</div>
  </div>

  <!-- Main Card -->
  <div class="card">
    <!-- Tournament Name -->
    <div class="section-label">Tournament Name</div>
    <div class="name-input-wrap" style="margin-bottom:28px">
      <input type="text" placeholder="e.g. Sunday Doubles Bash">
    </div>

    <!-- Format & Partner Mode -->
    <div class="two-col" style="margin-bottom:28px">
      <div>
        <div class="section-label">Format</div>
        <div class="toggle-group">
          <button class="toggle-btn">Singles</button>
          <button class="toggle-btn active">Doubles</button>
        </div>
      </div>
      <div>
        <div class="section-label">Partner Mode</div>
        <div class="toggle-group three">
          <button class="toggle-btn active">Rotating</button>
          <button class="toggle-btn">Fixed</button>
          <button class="toggle-btn">Custom</button>
        </div>
      </div>
    </div>

    <!-- Players / Courts / Rounds -->
    <div class="section-label">Match Settings</div>
    <div class="stats-row" style="margin-bottom:28px">
      <div class="stat-box">
        <div class="stat-label">Players</div>
        <div class="stat-controls">
          <button class="stat-btn">−</button>
          <div class="stat-value">8</div>
          <button class="stat-btn">+</button>
        </div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Courts</div>
        <div class="stat-controls">
          <button class="stat-btn">−</button>
          <div class="stat-value">2</div>
          <button class="stat-btn">+</button>
        </div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Rounds</div>
        <div class="stat-controls">
          <button class="stat-btn">−</button>
          <div class="stat-value">3</div>
          <button class="stat-btn">+</button>
        </div>
      </div>
    </div>

    <!-- Player Names -->
    <div class="section-label">Player Names</div>
    <div class="player-grid">
      <div class="player-input"><span class="num">01</span><input type="text" placeholder="Player 1"></div>
      <div class="player-input"><span class="num">02</span><input type="text" placeholder="Player 2"></div>
      <div class="player-input"><span class="num">03</span><input type="text" placeholder="Player 3"></div>
      <div class="player-input"><span class="num">04</span><input type="text" placeholder="Player 4"></div>
      <div class="player-input"><span class="num">05</span><input type="text" placeholder="Player 5"></div>
      <div class="player-input"><span class="num">06</span><input type="text" placeholder="Player 6"></div>
      <div class="player-input"><span class="num">07</span><input type="text" placeholder="Player 7"></div>
      <div class="player-input"><span class="num">08</span><input type="text" placeholder="Player 8"></div>
    </div>

    <div class="clear-link">↺ Clear All Names</div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn-secondary">Cancel</button>
    <button class="btn-primary">Generate Tournament</button>
  </div>
</div>

</body>
</html>
