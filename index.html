<script type="text/babel">
const {useState,useEffect,useRef} = React;

// ── Firebase ──────────────────────────────────────────────────────────
const FB = {
    apiKey:"AIzaSyDaFUszTD0-Ro292GOBSlS5vkZSdJM0NF4",
    authDomain:"pickleball-app-1bba7.firebaseapp.com",
    projectId:"pickleball-app-1bba7",
    storageBucket:"pickleball-app-1bba7.firebasestorage.app",
    messagingSenderId:"645604154338",
    appId:"1:645604154338:web:b92f87c2cd11d950b737bb"
};
let db=null,auth=null,fbOk=false;
const oErr=console.error;
console.error=(...a)=>{const s=a.join(' ');if(s.includes('permission-denied')||s.includes('insufficient permissions')||s.includes('Firestore'))return;oErr(...a);};
try{firebase.initializeApp(FB);db=firebase.firestore();auth=firebase.auth();fbOk=true;}catch(e){}

// ── Storage ───────────────────────────────────────────────────────────
const storage={
    async save(d){
        if(fbOk&&db)try{await db.collection('tournaments').doc(d.id).set(d);return;}catch(e){}
        localStorage.setItem(`tournament:${d.id}`,JSON.stringify(d));
    },
    async get(id){
        if(fbOk&&db)try{const doc=await db.collection('tournaments').doc(id).get();if(doc.exists)return doc.data();}catch(e){}
        const d=localStorage.getItem(`tournament:${id}`);return d?JSON.parse(d):null;
    },
    async getAll(uid){
        if(fbOk&&db)try{
            const pub=(await db.collection('tournaments').where('isPublic','==',true).get()).docs.map(d=>d.data());
            if(uid){const priv=(await db.collection('tournaments').where('isPublic','==',false).where('participants','array-contains',uid).get()).docs.map(d=>d.data());return[...pub,...priv];}
            return pub;
        }catch(e){}
        const out=[];
        for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k?.startsWith('tournament:'))continue;try{const d=JSON.parse(localStorage.getItem(k));if(d.isPublic||(uid&&d.participants?.includes(uid)))out.push(d);}catch(e){}}
        return out;
    },
    listen(id,cb){
        if(fbOk&&db)return db.collection('tournaments').doc(id).onSnapshot(doc=>{if(doc.exists)cb(doc.data());});
        const t=setInterval(async()=>{const d=await storage.get(id);if(d)cb(d);},2000);
        return()=>clearInterval(t);
    },
    del(id){if(fbOk&&db)try{db.collection('tournaments').doc(id).delete();}catch(e){}localStorage.removeItem(`tournament:${id}`);},
    async saveFeedback(d){
        if(fbOk&&db)try{await db.collection('feedback').add(d);return;}catch(e){}
        try{const a=JSON.parse(localStorage.getItem('pendingFeedback')||'[]');a.push(d);localStorage.setItem('pendingFeedback',JSON.stringify(a));}catch(e){}
    }
};

// ── Algorithms ────────────────────────────────────────────────────────
function genSingles(players,rounds,courts){
    const list=[...players];
    if(list.length%2!==0)list.push('BYE');
    const actual=Math.min(rounds,list.length-1),half=list.length/2,all=[];
    for(let r=0;r<actual;r++){
        const matches=[],byes=[];
        for(let i=0;i<half;i++){const p1=list[i],p2=list[list.length-1-i];if(p1==='BYE')byes.push(p2);else if(p2==='BYE')byes.push(p1);else matches.push({id:`r${r}-m${i}`,court:(i%courts)+1,team1:[p1],team2:[p2]});}
        if(byes.length)matches.byePlayers=byes;
        all.push(matches);list.splice(1,0,list.pop());
    }
    return all;
}

function genRotating(players,rounds,courts){
    const stats={};
    players.forEach(p=>{stats[p]={games:0,sitOuts:0,partners:{},opponents:{},lastPartner:null};});
    const all=[];

    for(let round=0;round<rounds;round++){
        // Prioritise players who have sat out most AND played least
        const sorted=[...players].sort((a,b)=>{
            const sitDiff=stats[b].sitOuts-stats[a].sitOuts; // more sit-outs → play first
            if(sitDiff!==0)return sitDiff;
            return stats[a].games-stats[b].games; // fewer games → play first
        });

        const playN=Math.floor(Math.min(courts*4,sorted.length)/4)*4;
        const playing=sorted.slice(0,playN);
        const byes=sorted.slice(playN);
        byes.forEach(p=>stats[p].sitOuts++);

        const matches=[];
        let remaining=[...playing];
        let courtNum=0;

        while(remaining.length>=4&&courtNum<courts){
            let bestScore=Infinity,bestMatch=null,bestUsed=null;

            // Try every combination of 4 players and all 3 possible team pairings
            for(let a=0;a<remaining.length;a++)
            for(let b=a+1;b<remaining.length;b++)
            for(let c=b+1;c<remaining.length;c++)
            for(let d=c+1;d<remaining.length;d++){
                const[p1,p2,p3,p4]=[remaining[a],remaining[b],remaining[c],remaining[d]];
                const pairings=[
                    {team1:[p1,p2],team2:[p3,p4]},
                    {team1:[p1,p3],team2:[p2,p4]},
                    {team1:[p1,p4],team2:[p2,p3]},
                ];
                for(const pair of pairings){
                    const[t1a,t1b]=pair.team1,[t2a,t2b]=pair.team2;
                    // Very strong penalty for any repeat partnership
                    let sc=(stats[t1a].partners[t1b]||0)*2000
                          +(stats[t2a].partners[t2b]||0)*2000;
                    // Extra penalty if they were partners LAST round
                    if(stats[t1a].lastPartner===t1b||stats[t1b].lastPartner===t1a)sc+=5000;
                    if(stats[t2a].lastPartner===t2b||stats[t2b].lastPartner===t2a)sc+=5000;
                    // Mild penalty for repeat opponents
                    sc+=(stats[t1a].opponents[t2a]||0)*10+(stats[t1a].opponents[t2b]||0)*10
                       +(stats[t1b].opponents[t2a]||0)*10+(stats[t1b].opponents[t2b]||0)*10;
                    if(sc<bestScore){bestScore=sc;bestMatch={id:`r${round}-m${courtNum}`,court:courtNum+1,team1:pair.team1,team2:pair.team2};bestUsed=[t1a,t1b,t2a,t2b];}
                }
            }

            if(!bestMatch)break;
            matches.push(bestMatch);
            const[t1a,t1b,t2a,t2b]=[bestMatch.team1[0],bestMatch.team1[1],bestMatch.team2[0],bestMatch.team2[1]];

            // Update stats
            [t1a,t1b,t2a,t2b].forEach(p=>stats[p].games++);
            stats[t1a].partners[t1b]=(stats[t1a].partners[t1b]||0)+1;
            stats[t1b].partners[t1a]=(stats[t1b].partners[t1a]||0)+1;
            stats[t2a].partners[t2b]=(stats[t2a].partners[t2b]||0)+1;
            stats[t2b].partners[t2a]=(stats[t2b].partners[t2a]||0)+1;
            stats[t1a].lastPartner=t1b;stats[t1b].lastPartner=t1a;
            stats[t2a].lastPartner=t2b;stats[t2b].lastPartner=t2a;
            [t1a,t1b].forEach(x=>[t2a,t2b].forEach(y=>{
                stats[x].opponents[y]=(stats[x].opponents[y]||0)+1;
                stats[y].opponents[x]=(stats[y].opponents[x]||0)+1;
            }));
            remaining=remaining.filter(p=>!bestUsed.includes(p));
            courtNum++;
        }

        if(byes.length)matches.byePlayers=byes;
        all.push(matches);
    }
    return all;
}

function genFixed(partnerships,rounds,courts){
    const teams=partnerships.map(p=>p.players),tg={};teams.forEach((_,i)=>tg[i]=0);
    const all=[];
    for(let r=0;r<rounds;r++){
        const sorted=teams.map((t,i)=>({t,i})).sort((a,b)=>tg[a.i]-tg[b.i]);
        const playN=Math.floor(Math.min(courts*2,sorted.length)/2)*2;
        const playing=sorted.slice(0,playN),byes=sorted.slice(playN).flatMap(x=>x.t);
        const matches=[];let c=0;
        for(let i=0;i<playing.length-1;i+=2){if(c>=courts)break;matches.push({id:`r${r}-m${c}`,court:c+1,team1:playing[i].t,team2:playing[i+1].t});tg[playing[i].i]++;tg[playing[i+1].i]++;c++;}
        if(byes.length)matches.byePlayers=byes;
        all.push(matches);
    }
    return all;
}

function calcLB(players,schedule,scores){
    const stats={};players.filter(p=>p.trim()).forEach(p=>{stats[p]={wins:0,losses:0,pf:0,pa:0};});
    schedule.forEach(round=>round.forEach(match=>{
        const s=scores[match.id];if(!s||s.team1===undefined||s.team2===undefined)return;
        const s1=parseInt(s.team1)||0,s2=parseInt(s.team2)||0;
        if(s1>s2){match.team1.forEach(p=>{if(stats[p]){stats[p].wins++;stats[p].pf+=s1;stats[p].pa+=s2;}});match.team2.forEach(p=>{if(stats[p]){stats[p].losses++;stats[p].pf+=s2;stats[p].pa+=s1;}});}
        else if(s2>s1){match.team2.forEach(p=>{if(stats[p]){stats[p].wins++;stats[p].pf+=s2;stats[p].pa+=s1;}});match.team1.forEach(p=>{if(stats[p]){stats[p].losses++;stats[p].pf+=s1;stats[p].pa+=s2;}});}
    }));
    return Object.entries(stats).map(([name,s])=>({name,...s,diff:s.pf-s.pa})).sort((a,b)=>b.wins-a.wins||b.diff-a.diff);
}

// Stepper: +/- control for numbers
function Stepper({val,min,max,onChange}){
    const dec=()=>onChange(Math.max(min,val-1));
    const inc=()=>onChange(Math.min(max,val+1));
    return(
        <div className="stepper">
            <button className="stepper-btn" onClick={dec} type="button">−</button>
            <input className="stepper-val" type="number" value={val} min={min} max={max}
                onChange={e=>{const v=parseInt(e.target.value)||min;onChange(Math.max(min,Math.min(max,v)));}}
                onBlur={e=>{if(!e.target.value||parseInt(e.target.value)<min)onChange(min);}}/>
            <button className="stepper-btn" onClick={inc} type="button">+</button>
        </div>
    );
}

                                            onChange={e=>{const n=[...players];n[i]=e.target.value;setPlayers(n);}}
                                            placeholder={`Player ${i+1}`} style={{fontSize:14}}/>
                                    </div>
                                ))}
                            </div>
                            <button className="btn-clear" onClick={()=>setPlayers(Array.from({length:np},()=>''))}>↻ Clear All Names</button>
                        </div>
                    )}

                    {step.id==='partnerconfig'&&mode==='fixed'&&(
                        <div>
                            <div style={{fontFamily:'Outfit,sans-serif',fontSize:14,color:'#94a3b8',marginBottom:12}}>Pair up your players. You need at least 2 pairs.</div>
                            <button className="btn-out btn-sm" onClick={autoPair} style={{marginBottom:10}}>Auto-pair from player list</button>
                            {partnerships.length>0&&<div style={{marginTop:10,display:'flex',flexDirection:'column',gap:5}}>{partnerships.map((p,i)=><div key={i} style={{fontSize:14,color:'#e2e8f0'}}>🤝 <strong>Pair {i+1}:</strong> {p.players.join(' & ')}</div>)}</div>}
                            {partnerships.length===0&&<div style={{color:'#64748b',fontSize:13,marginTop:8}}>No pairs yet — click Auto-pair or set them up manually</div>}
                        </div>
                    )}

                    {step.id==='partnerconfig'&&mode==='custom'&&(
                        <div>
                            <div style={{fontFamily:'Outfit,sans-serif',fontSize:14,color:'#94a3b8',marginBottom:12}}>Define each match manually. Select players for each team.</div>
                            {customs.map((match,mi)=>(
                                <div key={mi} style={{background:'rgba(255,255,255,.05)',borderRadius:10,padding:12,marginBottom:10,border:'1px solid rgba(255,255,255,.1)'}}>
                                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
                                        <span style={{fontWeight:600,fontSize:14,color:'white'}}>Match {mi+1}</span>
                                        {customs.length>1&&<button onClick={()=>setCustoms(p=>p.filter((_,j)=>j!==mi))} style={{background:'none',border:'none',color:'#94a3b8',cursor:'pointer',fontSize:22,lineHeight:1}}>×</button>}
                                    </div>
                                    <div style={{display:'grid',gridTemplateColumns:'1fr auto 1fr',gap:10,alignItems:'center'}}>
                                        <div style={{display:'flex',flexDirection:'column',gap:6}}>
                                            <PSel value={match.team1[0]} onChange={v=>updCust(mi,'team1',0,v)} placeholder="Player 1"/>
                                            <PSel value={match.team1[1]} onChange={v=>updCust(mi,'team1',1,v)} placeholder="Player 2"/>
                                        </div>
                                        <div style={{textAlign:'center',fontWeight:800,color:'#94a3b8',fontSize:15}}>vs</div>
                                        <div style={{display:'flex',flexDirection:'column',gap:6}}>
                                            <PSel value={match.team2[0]} onChange={v=>updCust(mi,'team2',0,v)} placeholder="Player 3"/>
                                            <PSel value={match.team2[1]} onChange={v=>updCust(mi,'team2',1,v)} placeholder="Player 4"/>
                                        </div>
                                    </div>
                                </div>
                            ))}
                            <button className="btn-out btn-sm" onClick={()=>setCustoms(p=>[...p,{team1:['',''],team2:['','']}])}>+ Add Match</button>
                        </div>
                    )}

                    {step.id==='review'&&(
                        <div>
                            <div style={{fontFamily:'Outfit,sans-serif',fontSize:14,color:'#94a3b8',marginBottom:14}}>Review your tournament settings before generating</div>
                            <div style={{display:'flex',flexDirection:'column',gap:8}}>
                                {[
                                    ['🏆 Name',name||`Tournament ${new Date().toLocaleDateString()}`],
                                    ['🏅 Format',format==='singles'?'Singles (1v1)':'Doubles (2v2)'],
                                    ...(format==='doubles'?[['👥 Partner Mode',mode==='rotating'?'🔄 Rotating':mode==='fixed'?'🔒 Fixed':'✏️ Custom']]:[]),
                                    ['👤 Players',`${filledCount} / ${np} entered`],
                                    ['🏟️ Courts',`${courts}`],
                                    ...(mode!=='custom'?[['🔢 Rounds',`${rounds}`]]:[]),
                                    ...(format==='doubles'&&mode==='fixed'?[['🤝 Pairs',`${partnerships.length} pair${partnerships.length!==1?'s':''} set`]]:[]),
                                ].map(([k,v])=>(
                                    <div key={k} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 14px',background:'rgba(255,255,255,.06)',borderRadius:9}}>
                                        <span style={{fontFamily:'Outfit,sans-serif',fontSize:14,color:'#94a3b8'}}>{k}</span>
                                        <span style={{fontFamily:'Outfit,sans-serif',fontSize:14,fontWeight:700,color:'white'}}>{v}</span>
                                    </div>
                                ))}
                            </div>
                            {filledCount>0&&(
                                <div style={{marginTop:12,padding:'10px 14px',background:'rgba(52,211,153,.08)',borderRadius:9,border:'1px solid rgba(52,211,153,.2)'}}>
                                    <div style={{fontFamily:'Outfit,sans-serif',fontSize:13,color:'#6ee7b7',fontWeight:600,marginBottom:5}}>Players</div>
                                    <div style={{fontFamily:'Outfit,sans-serif',fontSize:13,color:'#94a3b8'}}>{valid.join(' · ')}</div>
                                </div>
                            )}
                        </div>
                    )}
                </div>

                {/* Nav buttons */}
                <div style={{display:'flex',gap:10}}>
                    {guidedStep>0&&<button className="btn-dark" onClick={goPrev} style={{flex:1,padding:'13px'}}>← Back</button>}
                    {!isLast&&(
                        <button className="btn-g" onClick={goNext} disabled={!canNext()} style={{flex:2,padding:'13px',fontSize:16}}>
                            Next →
                        </button>
                    )}
                    {isLast&&(
                        <button className="btn-generate" onClick={generate} style={{flex:2}}>
                            <span style={{fontSize:22}}>🚀</span> Generate Tournament
                        </button>
                    )}
                </div>
            </div>
        );
    }

    // ── Standard form ──
    return(
        <div style={{display:'flex',flexDirection:'column',gap:0}}>

            {/* Mode switcher */}
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
                <div style={{fontFamily:'Outfit,sans-serif',fontSize:13,color:'#6ee7b7',fontWeight:600}}>📋 Standard Form</div>
                <button onClick={()=>setFormMode(null)} style={{background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.15)',color:'#94a3b8',borderRadius:8,padding:'6px 12px',fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:600,cursor:'pointer'}}>Change Mode</button>
            </div>

            {/* ── Quick Start Guide ── */}
            <div className="setup-panel panel-guide" style={{marginBottom:14,padding:0}}>
                <button onClick={()=>setShowGuide(!showGuide)} style={{width:'100%',background:'none',border:'none',padding:'14px 18px',display:'flex',alignItems:'center',justifyContent:'space-between',cursor:'pointer',fontFamily:'Outfit,sans-serif'}}>
                    <div style={{display:'flex',alignItems:'center',gap:10}}>
                        <span style={{fontSize:20}}>📖</span>
                        <span style={{fontWeight:700,fontSize:15,color:'#6ee7b7'}}>Quick Start Guide</span>
                    </div>
                    <span style={{color:'#34d399',fontSize:20,fontWeight:800,lineHeight:1}}>{showGuide?'−':'+'}</span>
                </button>
                {showGuide&&(
                    <div style={{padding:'0 18px 18px',fontFamily:'Outfit,sans-serif',fontSize:14,color:'#94a3b8',lineHeight:1.7}}>
                        <strong style={{color:'#6ee7b7'}}>🎯 Steps to Generate Your Tournament:</strong>
                        <ol style={{paddingLeft:20,margin:'10px 0 14px',display:'flex',flexDirection:'column',gap:6}}>
                            <li><strong>Name your tournament</strong> (optional)</li>
                            <li><strong>Choose format</strong> — Singles (1v1) or Doubles (2v2)</li>
                            <li><strong>Set players, courts & rounds</strong> using the +/− controls</li>
                            <li><strong>Enter player names</strong></li>
                            <li><strong>Tap "Generate Tournament"</strong> — brackets appear instantly!</li>
                        </ol>

                        <div style={{height:1,background:'rgba(52,211,153,.15)',marginBottom:14}}/>
                        <strong style={{color:'#6ee7b7'}}>👥 Partner Modes (Doubles only):</strong>
                        <div style={{display:'flex',flexDirection:'column',gap:10,marginTop:10}}>
                            <div style={{padding:'10px 12px',background:'rgba(52,211,153,.07)',border:'1px solid rgba(52,211,153,.2)',borderRadius:8}}>
                                <div style={{color:'#34d399',fontWeight:700,marginBottom:3}}>🔄 Rotating Partners</div>
                                <div style={{color:'#94a3b8',fontSize:13}}>Players are automatically shuffled into different teams each round. Great for social play — everyone gets to partner with everyone. Just enter player names; the algorithm handles the rest and avoids repeat pairings.</div>
                            </div>
                            <div style={{padding:'10px 12px',background:'rgba(52,211,153,.07)',border:'1px solid rgba(52,211,153,.2)',borderRadius:8}}>
                                <div style={{color:'#34d399',fontWeight:700,marginBottom:3}}>🔒 Fixed Partners</div>
                                <div style={{color:'#94a3b8',fontSize:13}}>Each player stays with the same partner for the entire tournament. Enter all player names first, then use "Auto-pair" to pair them in order (Player 1 & 2, Player 3 & 4…) or set your own pairs manually. You need at least 2 pairs (4 players) to generate.</div>
                            </div>
                            <div style={{padding:'10px 12px',background:'rgba(52,211,153,.07)',border:'1px solid rgba(52,211,153,.2)',borderRadius:8}}>
                                <div style={{color:'#34d399',fontWeight:700,marginBottom:3}}>✏️ Custom Matches</div>
                                <div style={{color:'#94a3b8',fontSize:13}}>You control every match. Enter player names first, then manually pick which players face each other in each match. Add as many matches as you need. Perfect for pre-planned or special-event brackets.</div>
                            </div>
                        </div>

                        <div style={{marginTop:12,padding:'9px 12px',background:'rgba(52,211,153,.08)',border:'1px solid rgba(52,211,153,.2)',borderRadius:8,fontSize:13}}>
                            💡 <strong>Pro tip:</strong> Change player count to auto-adjust the name list!
                        </div>
                    </div>
                )}
            </div>

            {/* ── Tournament Name ── */}
            <div className="setup-panel panel-name" style={{marginBottom:14}}>
                <div className="panel-hdr">
                    <span className="panel-hdr-icon">🏆</span>
                    <span className="panel-title" style={{color:'#6ee7b7'}}>Tournament Name</span>
                </div>
                <input className="inp inp-dark" value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Sunday Doubles Bash"
                    style={{fontSize:16,fontWeight:500}}/>
            </div>

            {/* ── Format & Partner Mode ── */}
            <div className="setup-panel panel-format" style={{marginBottom:14}}>
                <div style={{display:'flex',alignItems:'center',gap:9,marginBottom:13}}>
                    <span className="panel-hdr-icon">🏅</span>
                    <span className="panel-title" style={{color:'#6ee7b7'}}>Format</span>
                </div>
                <div style={{display:'flex',gap:8,marginBottom: format==='doubles'?16:0}}>
                    <Pill val="singles" cur={format} set={v=>{setFormat(v);setMode('rotating');}} label="🧍 Singles"/>
                    <Pill val="doubles" cur={format} set={setFormat} label="👥 Doubles"/>
                </div>
                {format==='doubles'&&(
                    <div>
                        <div style={{height:1,background:'rgba(255,255,255,.1)',marginBottom:14}}/>
                        <div style={{display:'flex',alignItems:'center',gap:9,marginBottom:11}}>
                            <span className="panel-hdr-icon">👥</span>
                            <span className="panel-title" style={{color:'#6ee7b7'}}>Partner Mode</span>
                        </div>
                        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                            <Pill val="rotating" cur={mode} set={setMode} label="🔄 Rotating"/>
                            <Pill val="fixed" cur={mode} set={setMode} label="🔒 Fixed"/>
                            <Pill val="custom" cur={mode} set={setMode} label="✏️ Custom"/>
                        </div>
                    </div>
                )}
            </div>

            {/* ── Tournament Settings (steppers) ── */}
            {mode!=='custom'&&(
                <div className="setup-panel panel-settings" style={{marginBottom:14}}>
                    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(130px,1fr))',gap:14}}>
                        <div>
                            <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:7}}>
                                <span style={{fontSize:13}}>👤</span>
                                <span className="slbl" style={{marginBottom:0,color:'#94a3b8',fontSize:11}}>Players</span>
                            </div>
                            <Stepper val={np} min={format==='singles'?2:4} max={32} onChange={setNp}/>
                        </div>
                        <div>
                            <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:7}}>
                                <span style={{fontSize:13}}>🏟️</span>
                                <span className="slbl" style={{marginBottom:0,color:'#94a3b8',fontSize:11}}>Courts</span>
                            </div>
                            <Stepper val={courts} min={1} max={10} onChange={setCourts}/>
                        </div>
                        <div>
                            <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:7}}>
                                <span style={{fontSize:13}}>🔢</span>
                                <span className="slbl" style={{marginBottom:0,color:'#94a3b8',fontSize:11}}>Rounds</span>
                            </div>
                            <Stepper val={rounds} min={1} max={20} onChange={setRounds}/>
                        </div>
                    </div>
                </div>
            )}
            {mode==='custom'&&(
                <div className="setup-panel panel-settings" style={{marginBottom:14}}>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
                        <div>
                            <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:7}}>
                                <span style={{fontSize:13}}>👤</span>
                                <span className="slbl" style={{marginBottom:0,color:'#94a3b8',fontSize:11}}>Players</span>
                            </div>
                            <Stepper val={np} min={4} max={32} onChange={setNp}/>
                        </div>
                        <div>
                            <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:7}}>
                                <span style={{fontSize:13}}>🏟️</span>
                                <span className="slbl" style={{marginBottom:0,color:'#94a3b8',fontSize:11}}>Courts</span>
                            </div>
                            <Stepper val={courts} min={1} max={10} onChange={setCourts}/>
                        </div>
                    </div>
                </div>
            )}

            {/* ── Player Names ── */}
            <div className="setup-panel panel-players" style={{marginBottom:14}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:13}}>
                    <div className="panel-hdr" style={{marginBottom:0}}>
                        <span className="panel-hdr-icon">✏️</span>
                        <span className="panel-title" style={{color:'#6ee7b7'}}>Player Names</span>
                    </div>
                    <span className="player-badge">{filledCount} / {np} entered</span>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(170px,1fr))',gap:9}} className="player-names-grid">
                    {players.map((p,i)=>(
                        <div key={i} className="player-inp-wrap">
                            <span className="player-inp-num">{numFmt(i+1)}</span>
                            <input className="inp player-inp player-name-input" value={p}
                                onChange={e=>{const n=[...players];n[i]=e.target.value;setPlayers(n);}}
                                placeholder={`Player ${i+1}`} style={{fontSize:14}}/>
                        </div>
                    ))}
                </div>
                <button className="btn-clear" onClick={()=>setPlayers(Array.from({length:np},()=>''))}>↻ Clear All Names</button>
            </div>

            {/* ── Fixed Partnerships ── */}
            {format==='doubles'&&mode==='fixed'&&(
                <div style={{background:'rgba(240,253,244,.08)',borderRadius:12,padding:16,border:'2px solid rgba(167,243,208,.4)',marginBottom:14}}>
                    <div style={{fontWeight:700,fontSize:15,color:'#6ee7b7',marginBottom:10}}>🤝 Fixed Partnerships {partnerships.length>0?`· ${partnerships.length} pairs set`:''}</div>
                    <div style={{fontFamily:'Outfit,sans-serif',fontSize:13,color:'#94a3b8',marginBottom:10}}>Enter player names above first, then pair them up here.</div>
                    <button className="btn-out btn-sm" onClick={autoPair}>Auto-pair from player list</button>
                    {partnerships.length>0&&<div style={{marginTop:10,display:'flex',flexDirection:'column',gap:5}}>{partnerships.map((p,i)=><div key={i} style={{fontSize:14,color:'#e2e8f0'}}>🤝 <strong>Pair {i+1}:</strong> {p.players.join(' & ')}</div>)}</div>}
                </div>
            )}

            {/* ── Custom Matches ── */}
            {format==='doubles'&&mode==='custom'&&(
                <div style={{background:'rgba(248,250,252,.06)',borderRadius:12,padding:16,border:'2px solid rgba(226,232,240,.2)',marginBottom:14}}>
                    <div style={{fontWeight:700,fontSize:15,color:'#6ee7b7',marginBottom:6}}>✏️ Custom Matches</div>
                    <div style={{fontFamily:'Outfit,sans-serif',fontSize:13,color:'#94a3b8',marginBottom:14}}>Enter player names above first, then assign them to matches below.</div>
                    {customs.map((match,mi)=>(
                        <div key={mi} style={{background:'rgba(255,255,255,.05)',borderRadius:10,padding:14,marginBottom:10,border:'1px solid rgba(255,255,255,.1)'}}>
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
                                <span style={{fontWeight:600,fontSize:15,color:'white'}}>Match {mi+1}</span>
                                {customs.length>1&&<button onClick={()=>setCustoms(p=>p.filter((_,j)=>j!==mi))} style={{background:'none',border:'none',color:'#94a3b8',cursor:'pointer',fontSize:22,lineHeight:1}}>×</button>}
                            </div>
                            <div style={{display:'grid',gridTemplateColumns:'1fr auto 1fr',gap:10,alignItems:'center'}}>
                                <div style={{display:'flex',flexDirection:'column',gap:6}}>
                                    <PSel value={match.team1[0]} onChange={v=>updCust(mi,'team1',0,v)} placeholder="Player 1"/>
                                    <PSel value={match.team1[1]} onChange={v=>updCust(mi,'team1',1,v)} placeholder="Player 2"/>
                                </div>
                                <div style={{textAlign:'center',fontWeight:800,color:'#94a3b8',fontSize:15}}>vs</div>
                                <div style={{display:'flex',flexDirection:'column',gap:6}}>
                                    <PSel value={match.team2[0]} onChange={v=>updCust(mi,'team2',0,v)} placeholder="Player 3"/>
                                    <PSel value={match.team2[1]} onChange={v=>updCust(mi,'team2',1,v)} placeholder="Player 4"/>
                                </div>
                            </div>
                        </div>
                    ))}
                    <button className="btn-out btn-sm" onClick={()=>setCustoms(p=>[...p,{team1:['',''],team2:['','']}])}>+ Add Match</button>
                </div>
            )}

            {/* ── Generate Button ── */}
            <button className="btn-generate" onClick={generate}>
                <span style={{fontSize:22}}>🚀</span> Generate Tournament
            </button>
        </div>
    );
}

// ── Schedule View ─────────────────────────────────────────────────────
function ScheduleView({schedule,scores,onScoreChange,canEdit,tournamentName,players,isGuest,onExportPDF,finalized}){
    const[showLB,setShowLB]=useState(false);
    const lb=calcLB(players,schedule,scores);
    return(
        <div>
            <div style={{display:'flex',flexWrap:'wrap',gap:10,marginBottom:18,alignItems:'center'}}>
                <button onClick={()=>setShowLB(!showLB)} style={{background:showLB?'#0f172a':'white',color:showLB?'white':'#0f172a',border:`2px solid ${showLB?'#0f172a':'#0f172a'}`,borderRadius:9,padding:'11px 18px',fontFamily:'Outfit,sans-serif',fontSize:15,fontWeight:600,cursor:'pointer',transition:'all .15s',flex:'1 1 auto',minWidth:160}}>
                    {showLB?'✕ Hide Leaderboard':'🏆 Show Leaderboard'}
                </button>
                <button className="btn-out btn-sm" onClick={onExportPDF} style={{padding:'11px 18px',fontSize:14,flex:'1 1 auto',minWidth:160,whiteSpace:'nowrap'}}>
                    📄 {isGuest?'Export PDF (Blank)':'Export PDF'}
                </button>
            </div>

            {showLB&&(
                <div style={{background:'linear-gradient(135deg,#fefce8,#fff7ed)',border:'2px solid #fbbf24',borderRadius:14,padding:18,marginBottom:20}}>
                    <div className="fd" style={{fontSize:22,fontWeight:800,color:'#0f172a',marginBottom:12}}>🏆 LEADERBOARD</div>
                    <div style={{display:'flex',flexDirection:'column',gap:8}}>
                        {lb.map((p,i)=>(
                            <div key={p.name} style={{background:'white',borderRadius:10,padding:'12px 16px',display:'flex',alignItems:'center',gap:12,border:`2px solid ${i===0?'#fbbf24':'#e2e8f0'}`}}>
                                <span style={{fontSize:20,minWidth:32}}>{i===0?'🥇':i===1?'🥈':i===2?'🥉':`#${i+1}`}</span>
                                <span style={{fontFamily:'Outfit,sans-serif',fontWeight:600,flex:1,fontSize:16,color:'#0f172a'}}>{p.name}</span>
                                <span style={{fontFamily:'Outfit,sans-serif',fontSize:14,color:'#64748b'}}>{p.wins}W–{p.losses}L</span>
                                <span style={{fontFamily:'Outfit,sans-serif',fontSize:15,fontWeight:700,color:p.diff>=0?'#059669':'#dc2626',minWidth:42,textAlign:'right'}}>{p.diff>0?'+':''}{p.diff}</span>
                            </div>
                        ))}
                    </div>
                </div>
            )}

            {schedule.map((round,ri)=>(
                <div key={ri} className="round-card">
                    <div className="round-hd">
                        <div className="fd" style={{fontSize:19,fontWeight:800,color:'white',letterSpacing:.5}}>ROUND {ri+1}</div>
                        <div style={{fontFamily:'Outfit,sans-serif',fontSize:14,color:'#6ee7b7'}}>{round.length} match{round.length!==1?'es':''}</div>
                    </div>

                    {round.map(match=>{
                        const sc=scores[match.id]||{};
                        const s1=sc.team1!==undefined?parseInt(sc.team1):null;
                        const s2=sc.team2!==undefined?parseInt(sc.team2):null;
                        const w1=s1!==null&&s2!==null&&s1>s2,w2=s1!==null&&s2!==null&&s2>s1;
                        const t1=match.team1.join(' & '),t2=match.team2.join(' & ');
                        return(
                            <div key={match.id} className="match-row">
                                {/* Desktop layout (via grid) */}
                                <span className="court-badge" style={{fontFamily:'Outfit,sans-serif',fontSize:13,fontWeight:700,color:'#059669',background:'#f0fdf4',borderRadius:7,padding:'5px 9px',whiteSpace:'nowrap'}}>
                                    Court {match.court}
                                </span>
                                <span className={`pname pname-desktop${w1?' win':''}`}>{w1&&'🏆 '}{t1}</span>
                                <div className="score-block">
                                    <input className="score-inp" type="number" min={0}
                                        value={sc.team1!==undefined?sc.team1:''}
                                        onChange={e=>canEdit&&onScoreChange(match.id,'team1',e.target.value)}
                                        placeholder="0" disabled={!canEdit||finalized}/>
                                    <span style={{color:'#94a3b8',fontWeight:800,fontSize:18}}>:</span>
                                    <input className="score-inp" type="number" min={0}
                                        value={sc.team2!==undefined?sc.team2:''}
                                        onChange={e=>canEdit&&onScoreChange(match.id,'team2',e.target.value)}
                                        placeholder="0" disabled={!canEdit||finalized}/>
                                </div>
                                <span className={`pname pname-desktop${w2?' win':''}`} style={{textAlign:'right'}}>{t2}{w2&&' 🏆'}</span>

                                {/* Mobile layout — team name + score on same line */}
                                <div className="match-row-inner" style={{}}>
                                    <div className="mobile-team-row">
                                        <span className={`pname${w1?' win':''}`} style={{flex:1}}>{w1&&'🏆 '}{t1}</span>
                                        {canEdit&&!finalized?(
                                            <input className="score-inp" type="number" min={0}
                                                value={sc.team1!==undefined?sc.team1:''}
                                                onChange={e=>onScoreChange(match.id,'team1',e.target.value)}
                                                placeholder="—"/>
                                        ):(
                                            <span className={`mobile-score${w1?' win':s1===null?' pending':''}`}>
                                                {s1!==null?s1:'—'}
                                            </span>
                                        )}
                                    </div>
                                    <div className="mobile-divider">vs</div>
                                    <div className="mobile-team-row">
                                        <span className={`pname${w2?' win':''}`} style={{flex:1}}>{w2&&'🏆 '}{t2}</span>
                                        {canEdit&&!finalized?(
                                            <input className="score-inp" type="number" min={0}
                                                value={sc.team2!==undefined?sc.team2:''}
                                                onChange={e=>onScoreChange(match.id,'team2',e.target.value)}
                                                placeholder="—"/>
                                        ):(
                                            <span className={`mobile-score${w2?' win':s2===null?' pending':''}`}>
                                                {s2!==null?s2:'—'}
                                            </span>
                                        )}
                                    </div>
                                </div>
                            </div>
                        );
                    })}

                    {round.byePlayers?.length>0&&(
                        <div className="bye-row">
                            <span style={{fontSize:16}}>⏸</span>
                            <span><strong>Sitting out this round:</strong> {round.byePlayers.join(', ')}</span>
                        </div>
                    )}
                </div>
            ))}
        </div>
    );
}

// ── Feedback Modal ────────────────────────────────────────────────────
function FeedbackModal({onClose,user}){
    const[type,setType]=useState('bug');
    const[email,setEmail]=useState(user?.email||'');
    const[msg,setMsg]=useState('');
    const[status,setStatus]=useState('');
    const[busy,setBusy]=useState(false);

    const submit=async()=>{
        if(!msg.trim()){alert('Please enter a message');return;}
        setBusy(true);
        await storage.saveFeedback({email:email||'Anonymous',type,message:msg,userId:user?.uid||'guest',timestamp:Date.now(),createdAt:new Date().toISOString()});
        setStatus('✓ Thanks for your feedback!');setMsg('');setBusy(false);
        setTimeout(()=>{setStatus('');onClose();},2000);
    };

    return(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:9999,padding:16}}>
            <div style={{background:'white',borderRadius:16,padding:28,maxWidth:460,width:'100%',boxShadow:'0 20px 60px rgba(0,0,0,.2)'}}>

                </div>
                <div style={{display:'flex',flexDirection:'column',gap:16}}>
                    <div><SL>Your Email (optional)</SL><input className="inp" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="your@email.com"/></div>
                    <div>
                        <SL>Type</SL>
                        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                            {[['bug','🐛 Bug'],['feature','💡 Feature'],['improvement','✨ Improvement'],['other','💬 Other']].map(([v,l])=>(
                                <Pill key={v} val={v} cur={type} set={setType} label={l}/>
                            ))}

                    <div><SL>Message</SL><textarea className="inp" rows={5} value={msg} onChange={e=>setMsg(e.target.value)} placeholder="Tell us what's on your mind…" style={{resize:'vertical'}}/></div>

                </div>
            </div>
        </div>
    );
}

// ── App Root ──────────────────────────────────────────────────────────
function App(){
    const[view,setView]=useState('landing');
    const[user,setUser]=useState(null);
    const[authReady,setAuthReady]=useState(false);
    const[showFB,setShowFB]=useState(false);

    useEffect(()=>{
        if(!fbOk||!auth){setAuthReady(true);return;}
        const u=auth.onAuthStateChanged(async u=>{
            if(u&&!u.isAnonymous){
                let p={uid:u.uid,email:u.email,name:u.displayName||u.email.split('@')[0]};
                try{const doc=await db.collection('users').doc(u.uid).get();if(doc.exists)p=doc.data();else await db.collection('users').doc(u.uid).set(p);}catch(e){}
                setUser(p);
            }else setUser(null);
            setAuthReady(true);
        });
        return()=>u();
    },[]);

    const logout=async()=>{if(auth)await auth.signOut();setUser(null);setView('landing');};

    if(!authReady) return(
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',background:'#f1f5f9'}}>
            <div style={{textAlign:'center'}}>
                <div style={{width:44,height:44,border:'4px solid #e2e8f0',borderTop:'4px solid #059669',borderRadius:'50%',animation:'spin .8s linear infinite',margin:'0 auto 12px'}}/>
                <div style={{fontFamily:'Outfit,sans-serif',color:'#64748b',fontSize:16}}>Loading…</div>
            </div>
        </div>
    );

    return(
        <>
            {showFB&&<FeedbackModal onClose={()=>setShowFB(false)} user={user}/>}
            {view==='landing'&&<LandingView onSimple={()=>setView('simple')} onAdvanced={()=>user?setView('app'):setView('login')} user={user} onFeedback={()=>setShowFB(true)}/>}
            {view==='simple'&&<SimpleView onBack={()=>setView('landing')} onLogin={()=>setView('login')} onFeedback={()=>setShowFB(true)}/>}
            {view==='login'&&<LoginView onBack={()=>setView('landing')} onSuccess={()=>setView('app')}/>}
            {view==='app'&&<FullApp user={user} onLogout={logout} onBack={()=>setView('landing')} onFeedback={()=>setShowFB(true)}/>}
        </>
    );
}

// ── Login View ────────────────────────────────────────────────────────
function LoginView({onBack,onSuccess}){
    const[email,setEmail]=useState('');
    const[pw,setPw]=useState('');
    const[pwc,setPwc]=useState('');
    const[isSignup,setIsSignup]=useState(false);
    const[err,setErr]=useState('');
    const[msg,setMsg]=useState('');
    const[busy,setBusy]=useState(false);

    const submit=async e=>{
        e.preventDefault();setErr('');setMsg('');setBusy(true);
        if(!fbOk){setErr('Firebase not configured');setBusy(false);return;}
        if(isSignup&&pw!==pwc){setErr('Passwords do not match');setBusy(false);return;}
        if(isSignup&&pw.length<6){setErr('Password must be 6+ characters');setBusy(false);return;}
        try{
            if(isSignup){const c=await auth.createUserWithEmailAndPassword(email,pw);try{await c.user.sendEmailVerification();}catch(e){}setMsg('Account created! Redirecting…');setTimeout(onSuccess,1500);}
            else{await auth.signInWithEmailAndPassword(email,pw);onSuccess();}
        }catch(e){const m={'auth/email-already-in-use':'Email already registered.','auth/invalid-email':'Invalid email.','auth/wrong-password':'Incorrect password.','auth/user-not-found':'No account with this email.','auth/invalid-credential':'Incorrect email or password.'};setErr(m[e.code]||e.message);}
        setBusy(false);
    };

    const reset=async()=>{
        if(!email){setErr('Enter your email first');return;}
        try{await auth.sendPasswordResetEmail(email);setMsg('Reset email sent!');}catch(e){setErr(e.message);}
    };

    return(
        <div style={{minHeight:'100vh',background:'#f1f5f9',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:20}}>
            <div style={{width:'100%',maxWidth:420}}>
                <button onClick={onBack} style={{background:'none',border:'none',color:'#64748b',cursor:'pointer',fontFamily:'Outfit,sans-serif',fontSize:16,marginBottom:24,display:'flex',alignItems:'center',gap:6}}>← Back to Home</button>
                <div className="card">
                    <div className="fd" style={{fontSize:32,fontWeight:800,color:'#0f172a',marginBottom:4}}>{isSignup?'CREATE ACCOUNT':'WELCOME BACK'}</div>
                    <div style={{fontFamily:'Outfit,sans-serif',fontSize:15,color:'#64748b',marginBottom:24}}>{isSignup?'Get access to all tournament features':'Log in to your tournament dashboard'}</div>
                    <form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:16}}>
                        <div><SL>Email</SL><input className="inp" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com" required/></div>
                        <div><SL>Password</SL><input className="inp" type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="••••••••" required minLength={6}/></div>
                        {isSignup&&<div><SL>Confirm Password</SL><input className="inp" type="password" value={pwc} onChange={e=>setPwc(e.target.value)} placeholder="••••••••" required minLength={6}/></div>}
                        {err&&<div style={{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:8,padding:'11px 14px',fontSize:15,color:'#dc2626'}}>{err}</div>}
                        {msg&&<div style={{background:'#f0fdf4',border:'1px solid #a7f3d0',borderRadius:8,padding:'11px 14px',fontSize:15,color:'#059669'}}>{msg}</div>}
                        <button className="btn-g" type="submit" disabled={busy} style={{width:'100%',padding:'14px',marginTop:4}}>{busy?'Please wait…':isSignup?'Create Account':'Log In'}</button>
                    </form>
                    <div style={{marginTop:18,textAlign:'center',display:'flex',flexDirection:'column',gap:10}}>
                        <button onClick={()=>{setIsSignup(!isSignup);setErr('');setMsg('');}} style={{background:'none',border:'none',color:'#059669',fontFamily:'Outfit,sans-serif',fontSize:15,cursor:'pointer',fontWeight:600}}>
                            {isSignup?'Already have an account? Log in':"Don't have an account? Sign up"}
                        </button>
                        {!isSignup&&<button onClick={reset} style={{background:'none',border:'none',color:'#94a3b8',fontFamily:'Outfit,sans-serif',fontSize:14,cursor:'pointer'}}>Forgot password?</button>}
                    </div>
                </div>
            </div>
        </div>
    );
}

    const findTournament=async()=>{
        const id=findId.trim();if(!id)return;
        setFinding(true);setFindErr('');setFound(null);

                <span style={{fontFamily:'Outfit,sans-serif',fontSize:14,color:'#92400e',lineHeight:1.5}}>
                    <strong>Guest Mode:</strong> Tournaments are not saved to the cloud. Export your scorecard before leaving.
                </span>
            </div>

            <div style={{background:'white',borderBottom:'1px solid #e2e8f0',padding:'0 18px',display:'flex'}}>
                {[['create','Create Tournament'],['find','Search Tournament']].map(([k,l])=>(

                ))}

                    !setup?(
                        <div className="card"><TournamentSetup onGenerate={handleGenerate}/></div>
                    ):(
                        <>
                            <div style={{background:'white',borderRadius:14,padding:'15px 18px',marginBottom:14,display:'flex',justifyContent:'space-between',alignItems:'center',boxShadow:'0 1px 6px rgba(0,0,0,.05)'}}>
                                <div>
                                    <div className="fd" style={{fontSize:22,fontWeight:800,color:'#0f172a'}}>{setup.name}</div>
                                    <div style={{fontFamily:'Outfit,sans-serif',fontSize:14,color:'#64748b',marginTop:2}}>{setup.players.length} players · {setup.schedule.length} rounds</div>
                                </div>
                                <button className="btn-out btn-sm" onClick={()=>{setSetup(null);setScores({});}}>New</button>

                        </>
                    )
                )}

                {tab==='find'&&(
                    <div className="card">
                        <div className="fd" style={{fontSize:22,fontWeight:800,color:'#0f172a',marginBottom:6}}>FIND A TOURNAMENT</div>

                        <div style={{display:'flex',gap:8,marginBottom:18}}>
                            <input className="inp" value={findId} onChange={e=>setFindId(e.target.value)} placeholder="e.g. tournament-1739746800" onKeyDown={e=>e.key==='Enter'&&findTournament()} style={{flex:1}}/>
                            <button className="btn-g" onClick={findTournament} disabled={finding}>{finding?'Searching…':'Find →'}</button>
                        </div>
                        {findErr&&<div style={{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:10,padding:'13px 16px',fontSize:15,color:'#dc2626',marginBottom:14}}>{findErr}</div>}

                            <>
                                <div style={{background:'#f0fdf4',border:'1px solid #a7f3d0',borderRadius:12,padding:'14px 18px',marginBottom:16}}>

function FullApp({user,onLogout,onBack,onFeedback}){
    const[view,setView]=useState('dashboard');

    const[scores,setScores]=useState({});

    const[createdBy,setCreatedBy]=useState(null);
    const[isPublic,setIsPublic]=useState(false);
    const[finalized,setFinalized]=useState(false);
    const[saveStatus,setSaveStatus]=useState('');
    const[myT,setMyT]=useState([]);
    const[loadId,setLoadId]=useState('');
    const saving=useRef(false);
    const isRemote=useRef(false);
    const didInit=useRef(false);

    // Refs so save() always sees fresh state
    const rSetup=useRef(null),rScores=useRef({}),rTid=useRef(null);
    const rCreatedBy=useRef(null),rPublic=useRef(false),rFinalized=useRef(false);
    useEffect(()=>{rSetup.current=setup;},[setup]);
    useEffect(()=>{rScores.current=scores;},[scores]);
    useEffect(()=>{rTid.current=tid;},[tid]);
    useEffect(()=>{rCreatedBy.current=createdBy;},[createdBy]);
    useEffect(()=>{rPublic.current=isPublic;},[isPublic]);
    useEffect(()=>{rFinalized.current=finalized;},[finalized]);

    useEffect(()=>{loadAll();},[user]);

    const loadAll=async()=>{
        if(!user)return;
        try{const list=await storage.getAll(user.uid);setMyT(list.sort((a,b)=>b.createdAt-a.createdAt));}catch(e){}
    };

    // Auto-save on score change (debounced)
    useEffect(()=>{
        if(!tid||Object.keys(scores).length===0)return;
        if(isRemote.current){isRemote.current=false;return;}
        const t=setTimeout(()=>doSave(),1500);return()=>clearTimeout(t);
    },[scores]);

    // Auto-save on visibility toggle
    useEffect(()=>{
        if(!tid||!didInit.current)return;
        const t=setTimeout(()=>doSave(),600);return()=>clearTimeout(t);
    },[isPublic]);

    // Real-time listener
    useEffect(()=>{
        if(!tid)return;
        const u=storage.listen(tid,data=>{if(data?.scores){isRemote.current=true;setScores(data.scores);}});
        return()=>{if(typeof u==='function')u();};
    },[tid]);

    const doSave=async(overrides={})=>{
        const id=overrides.tid??rTid.current;
        const s=overrides.setup??rSetup.current;
        const sc=overrides.scores??rScores.current;
        const pub=overrides.isPublic??rPublic.current;
        const fin=overrides.finalized??rFinalized.current;
        const cb=overrides.createdBy??rCreatedBy.current;
        if(!id||!s)return;
        if(saving.current)return;
        saving.current=true;
        const uid=user?.uid||'guest';
        const flat=[];
        (s.schedule||[]).forEach((round,ri)=>round.forEach((m)=>{flat.push({roundIndex:ri,id:m.id,court:m.court,team1:Array.isArray(m.team1)?m.team1.join(', '):m.team1,team2:Array.isArray(m.team2)?m.team2.join(', '):m.team2});}));
        const data={id,name:s.name,players:s.players,courts:s.courts,numRounds:s.rounds,matchFormat:s.format,scheduleFlat:flat,scores:sc,scoresFinalized:fin,isPublic:pub,participants:[uid,...(s.players||[]).map(p=>`player-${p}`)],createdBy:cb||uid,createdAt:Date.now()};
        try{setSaveStatus('Saving…');await storage.save(data);setSaveStatus('✓ Saved');setTimeout(()=>setSaveStatus(''),2500);}catch(e){setSaveStatus('✗ Save failed');}
        saving.current=false;
    };

    const handleGenerate=d=>{
        const newTid=`tournament-${Date.now()}`;
        const uid=user?.uid||'guest';
        setSetup(d);setScores({});setTid(newTid);setCreatedBy(uid);setIsPublic(false);setFinalized(false);
        didInit.current=false;
        setView('tournament');
        // Save immediately with explicit values (avoids stale closure issue)
        setTimeout(()=>{
            didInit.current=true;
            doSave({tid:newTid,setup:d,scores:{},isPublic:false,finalized:false,createdBy:uid});
        },150);
    };

    const loadTournament=async id=>{
        if(!id.trim())return;
        const data=await storage.get(id.trim());
        if(!data){alert('Tournament not found');return;}
        const map={};
        (data.scheduleFlat||[]).forEach(m=>{if(!map[m.roundIndex])map[m.roundIndex]=[];map[m.roundIndex].push({id:m.id,court:m.court,team1:typeof m.team1==='string'?m.team1.split(', ').filter(Boolean):[m.team1],team2:typeof m.team2==='string'?m.team2.split(', ').filter(Boolean):[m.team2]});});
        const schedule=data.schedule||Object.keys(map).sort((a,b)=>a-b).map(k=>map[k]);
        const s={name:data.name,players:data.players||[],schedule,courts:data.courts,rounds:data.numRounds,format:data.matchFormat,mode:'rotating'};
        setSetup(s);setScores(data.scores||{});setTid(data.id);setCreatedBy(data.createdBy||null);setIsPublic(data.isPublic||false);setFinalized(data.scoresFinalized||false);
        didInit.current=false;setView('tournament');setTimeout(()=>{didInit.current=true;},500);
    };

    const delTournament=async id=>{
        if(!confirm('Delete this tournament?'))return;
        storage.del(id);loadAll();
        if(tid===id){setView('dashboard');setSetup(null);setTid(null);}
    };

    const isOwner=tid&&createdBy===user?.uid;

    const share=()=>{
        if(!tid)return;
        const el=document.createElement('div');
        el.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;';
        el.innerHTML=`<div style="background:white;border-radius:16px;padding:28px;max-width:440px;width:100%;font-family:Outfit,sans-serif;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                <div style="font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;color:#0f172a;">📤 SHARE TOURNAMENT</div>
                <button id="__cls" style="background:none;border:none;font-size:28px;cursor:pointer;color:#94a3b8;line-height:1;">×</button>
            </div>
            <div style="background:#f1f5f9;border-radius:12px;padding:14px;margin-bottom:14px;">
                <div style="font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;">Tournament ID</div>
                <div style="display:flex;gap:10px;">
                    <input id="__tid" value="${tid}" readonly style="flex:1;background:white;border:2px solid #e2e8f0;border-radius:8px;padding:10px 12px;font-size:14px;font-family:monospace;outline:none;" onclick="this.select()"/>
                    <button id="__cp" style="background:#059669;color:white;border:none;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;font-size:15px;font-family:Outfit,sans-serif;">Copy</button>
                </div>
            </div>
            <div style="background:#eff6ff;border-left:4px solid #3b82f6;border-radius:8px;padding:12px 14px;font-size:14px;color:#1e40af;line-height:1.5;">
                Share this ID. Others can paste it in Quick Generation → Search Tournament to view your public tournament.
            </div>
        </div>`;
        el.onclick=e=>{if(e.target===el)el.remove();};
        document.body.appendChild(el);
        el.querySelector('#__cls').onclick=()=>el.remove();
        el.querySelector('#__cp').onclick=()=>{navigator.clipboard.writeText(tid).then(()=>{const b=el.querySelector('#__cp');b.textContent='✓ Copied!';setTimeout(()=>b.textContent='Copy',1500);});};
    };

    const doFinalize=()=>{
        if(finalized){alert('Already finalized');return;}
        if(confirm('Finalize scores? This makes them read-only.')){
            setFinalized(true);
            setTimeout(()=>doSave({finalized:true}),100);
        }
    };

    // Nav (defined inside FullApp so it can call setView)
    const[showUserMenu,setShowUserMenu]=useState(false);
    const userMenuRef=useRef(null);
    
    useEffect(()=>{
        const handleClick=(e)=>{if(userMenuRef.current&&!userMenuRef.current.contains(e.target))setShowUserMenu(false);};
        if(showUserMenu)document.addEventListener('click',handleClick);
        return()=>document.removeEventListener('click',handleClick);
    },[showUserMenu]);
    
    const Nav=({showBack})=>(
        <div className="nav">
            <button className="nav-back" onClick={()=>showBack?setView('dashboard'):onBack()}>←</button>
            <div className="fd" style={{fontSize:22,fontWeight:800,flex:1,cursor:'pointer'}} onClick={()=>setView('dashboard')}>
                <span style={{color:'white'}}>PICKLE</span><span style={{color:'#34d399'}}>CONNECT</span>
            </div>
            {user&&(
                <div ref={userMenuRef} style={{position:'relative'}}>
                    <div onClick={()=>setShowUserMenu(!showUserMenu)} style={{display:'flex',alignItems:'center',gap:8,marginRight:4,background:'rgba(255,255,255,.07)',borderRadius:9,padding:'5px 10px 5px 8px',border:'1px solid rgba(255,255,255,.1)',cursor:'pointer'}}>
                        <div style={{width:28,height:28,borderRadius:'50%',background:'#059669',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:800,color:'white',fontFamily:'Outfit,sans-serif',flexShrink:0}}>
                            {(user.name||user.email||'?')[0].toUpperCase()}
                        </div>
                        <div className="user-name-email" style={{display:'flex',flexDirection:'column',lineHeight:1.2}}>
                            <span style={{fontFamily:'Outfit,sans-serif',fontSize:13,fontWeight:700,color:'white',maxWidth:100,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{user.name||user.email?.split('@')[0]||'Player'}</span>
                            {user.email&&<span style={{fontFamily:'Outfit,sans-serif',fontSize:10,color:'#6ee7b7',maxWidth:100,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{user.email}</span>}
                        </div>
                    </div>
                    {showUserMenu&&(
                        <div onClick={()=>{setShowUserMenu(false);onLogout();}} style={{position:'absolute',top:'100%',right:0,marginTop:8,background:'white',borderRadius:10,boxShadow:'0 8px 24px rgba(0,0,0,.15)',border:'1px solid #e2e8f0',padding:'8px 0',minWidth:140,zIndex:1000}}>
                            <button style={{width:'100%',background:'none',border:'none',padding:'10px 16px',fontFamily:'Outfit,sans-serif',fontSize:14,fontWeight:600,color:'#dc2626',cursor:'pointer',textAlign:'left',display:'flex',alignItems:'center',gap:8}}>
                                <span style={{fontSize:16}}>🚪</span> Logout
                            </button>
                        </div>
                    )}
                </div>
            )}
            <button onClick={onFeedback} style={{background:'rgba(255,255,255,.1)',color:'#94a3b8',border:'none',borderRadius:8,padding:'8px 13px',fontFamily:'Outfit,sans-serif',fontSize:14,cursor:'pointer',marginRight:6}}>💬</button>
            <button className="logout-btn-desktop" onClick={onLogout} style={{background:'rgba(255,255,255,.1)',color:'white',border:'none',borderRadius:8,padding:'9px 14px',fontFamily:'Outfit,sans-serif',fontSize:13,cursor:'pointer'}}>Logout</button>
        </div>
    );

    // Dashboard
    if(view==='dashboard')return(
        <div style={{minHeight:'100vh',background:'#f1f5f9',display:'flex',flexDirection:'column'}}>
            <Nav showBack={false}/>
            <div className="pg">
                <div style={{background:'linear-gradient(135deg,#0f172a,#1e3a2f)',borderRadius:16,padding:'22px 24px',marginBottom:16,display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:12}}>
                    <div>
                        <div className="fd" style={{fontSize:28,fontWeight:800,color:'white'}}>DASHBOARD</div>
                        <div style={{fontFamily:'Outfit,sans-serif',fontSize:15,color:'#6ee7b7',marginTop:2}}>Welcome back, {user?.name||'Player'}!</div>
                    </div>
                    <button className="btn-g" onClick={()=>setView('create')}>+ New Tournament</button>
                </div>

                <div className="card" style={{marginBottom:14}}>
                    <div style={{fontFamily:'Outfit,sans-serif',fontSize:15,fontWeight:700,color:'#374151',marginBottom:10}}>🔍 View Tournament by ID</div>
                    <div style={{display:'flex',gap:8}}>
                        <input className="inp" value={loadId} onChange={e=>setLoadId(e.target.value)} placeholder="Paste tournament ID…" onKeyDown={e=>e.key==='Enter'&&loadTournament(loadId)} style={{flex:1}}/>
                        <button className="btn-g" onClick={()=>loadTournament(loadId)} style={{whiteSpace:'nowrap'}}>View</button>
                    </div>
                </div>

                <div className="card">
                    <div className="fd" style={{fontSize:22,fontWeight:800,color:'#0f172a',marginBottom:14}}>MY TOURNAMENTS</div>
                    {myT.length===0?(
                        <div style={{textAlign:'center',padding:'40px 0',color:'#94a3b8',fontFamily:'Outfit,sans-serif',fontSize:16}}>No tournaments yet.<br/>Create your first one!</div>
                    ):(
                        <div style={{display:'flex',flexDirection:'column',gap:10}}>
                            {myT.map(t=>(
                                <div key={t.id} style={{border:'1px solid #e2e8f0',borderRadius:12,padding:'14px 16px',display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
                                    <div style={{flex:1,minWidth:0}}>
                                        <div style={{fontFamily:'Outfit,sans-serif',fontWeight:600,fontSize:15,color:'#0f172a'}}>{t.name}</div>
                                        <div style={{fontFamily:'Outfit,sans-serif',fontSize:13,color:'#94a3b8',marginTop:3}}>{t.isPublic?'🌍 Public':'🔒 Private'} · {t.players?.length||0} players · {t.scoresFinalized?'🔒 Finalized':'In progress'}</div>
                                    </div>
                                    <button onClick={()=>loadTournament(t.id)} style={{background:'#f1f5f9',border:'none',borderRadius:8,padding:'9px 16px',fontFamily:'Outfit,sans-serif',fontSize:14,fontWeight:600,color:'#374151',cursor:'pointer'}}>Open</button>
                                    {t.createdBy===user?.uid&&<button className="btn-red" onClick={()=>delTournament(t.id)}>Delete</button>}
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            </div>
        </div>
    );

    // Create
    if(view==='create')return(
        <div style={{minHeight:'100vh',background:'#f1f5f9',display:'flex',flexDirection:'column'}}>
            <Nav showBack={true}/>
            <div className="pg">
                {/* Header banner */}
                <div style={{background:'linear-gradient(135deg,#0f172a 0%,#1e3a2f 55%,#052e16 100%)',borderRadius:16,padding:'20px 24px',marginBottom:16,display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
                    <div>
                        <div className="fd" style={{fontSize:30,fontWeight:800,color:'white',letterSpacing:.3}}>NEW TOURNAMENT</div>
                        <div style={{fontFamily:'Outfit,sans-serif',fontSize:14,color:'#6ee7b7',marginTop:3}}>Set up your bracket in seconds</div>
                    </div>
                    <div style={{display:'flex',gap:10,alignItems:'center'}}>
                        <div style={{background:'rgba(5,150,105,.15)',border:'1px solid rgba(52,211,153,.25)',borderRadius:10,padding:'7px 13px',fontFamily:'Outfit,sans-serif',fontSize:12,color:'#6ee7b7',textAlign:'center'}}>
                            <div style={{fontWeight:700,fontSize:18,fontFamily:'Barlow Condensed,sans-serif',color:'white'}}>🏆</div>
                            <div>Round Robin</div>
                        </div>
                        <div style={{background:'rgba(5,150,105,.15)',border:'1px solid rgba(52,211,153,.25)',borderRadius:10,padding:'7px 13px',fontFamily:'Outfit,sans-serif',fontSize:12,color:'#6ee7b7',textAlign:'center'}}>
                            <div style={{fontWeight:700,fontSize:18,fontFamily:'Barlow Condensed,sans-serif',color:'white'}}>📊</div>
                            <div>Live Scores</div>
                        </div>
                        <div style={{background:'rgba(5,150,105,.15)',border:'1px solid rgba(52,211,153,.25)',borderRadius:10,padding:'7px 13px',fontFamily:'Outfit,sans-serif',fontSize:12,color:'#6ee7b7',textAlign:'center'}}>
                            <div style={{fontWeight:700,fontSize:18,fontFamily:'Barlow Condensed,sans-serif',color:'white'}}>📄</div>
                            <div>PDF Export</div>
                        </div>
                    </div>
                </div>
                <div className="card">
                    <TournamentSetup onGenerate={handleGenerate}/>
                </div>
            </div>
        </div>
    );

    // Tournament
    if(view==='tournament'&&setup)return(
        <div style={{minHeight:'100vh',background:'#f1f5f9',display:'flex',flexDirection:'column'}}>
            <Nav showBack={true}/>
            <div className="pg">
                <div className="card" style={{marginBottom:14}}>
                    <div style={{display:'flex',flexWrap:'wrap',alignItems:'flex-start',gap:12}}>
                        <div style={{flex:1,minWidth:0}}>
                            <div className="fd" style={{fontSize:24,fontWeight:800,color:'#0f172a',wordBreak:'break-word'}}>{setup.name}</div>
                            <div style={{fontFamily:'Outfit,sans-serif',fontSize:14,color:'#64748b',marginTop:3}}>
                                {setup.players.length} players · {setup.schedule.length} rounds · {isPublic?'🌍 Public':'🔒 Private'}{finalized?' · 🔒 Finalized':''}
                            </div>
                        </div>
                        <div style={{display:'flex',flexWrap:'wrap',gap:8,alignItems:'center'}}>
                            {saveStatus&&<span style={{fontFamily:'Outfit,sans-serif',fontSize:13,color:saveStatus.includes('✓')?'#059669':saveStatus.includes('✗')?'#dc2626':'#64748b'}}>{saveStatus}</span>}
                            {isOwner&&!finalized&&(
                                <div style={{display:'flex',border:'2px solid #e2e8f0',borderRadius:10,overflow:'hidden'}}>
                                    <button onClick={()=>setIsPublic(false)} style={{padding:'9px 14px',background:!isPublic?'#0f172a':'white',color:!isPublic?'white':'#94a3b8',border:'none',fontFamily:'Outfit,sans-serif',fontSize:13,fontWeight:700,cursor:'pointer'}}>🔒 Private</button>
                                    <button onClick={()=>setIsPublic(true)} style={{padding:'9px 14px',background:isPublic?'#059669':'white',color:isPublic?'white':'#94a3b8',border:'none',fontFamily:'Outfit,sans-serif',fontSize:13,fontWeight:700,cursor:'pointer'}}>🌍 Public</button>
                                </div>
                            )}
                            {tid&&<button onClick={share} style={{background:'#3b82f6',color:'white',border:'none',borderRadius:8,padding:'10px 14px',fontFamily:'Outfit,sans-serif',fontSize:13,fontWeight:600,cursor:'pointer'}}>📤 Share</button>}
                            {isOwner&&<button onClick={doFinalize} disabled={finalized} style={{background:finalized?'#f1f5f9':'#7c3aed',color:finalized?'#94a3b8':'white',border:'none',borderRadius:8,padding:'10px 14px',fontFamily:'Outfit,sans-serif',fontSize:13,fontWeight:600,cursor:finalized?'not-allowed':'pointer'}}>{finalized?'🔒 Finalized':'✓ Finalize'}</button>}
                        </div>
                    </div>
                </div>

                <ScheduleView
                    schedule={setup.schedule} scores={scores}
                    onScoreChange={(id,team,val)=>setScores(p=>({...p,[id]:{...(p[id]||{}),[team]:parseInt(val)||0}}))}
                    canEdit={isOwner} tournamentName={setup.name} players={setup.players}
                    isGuest={false} onExportPDF={()=>doPrint(setup.name,setup.schedule,scores,setup.players,true)} finalized={finalized}/>
            </div>
        </div>
    );

    return null;
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
