<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PickleConnect – Find a Player</title>
    <meta name="description" content="Find pickleball players near you. Sign in, set your profile, and connect instantly.">
    <meta name="theme-color" content="#059669">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-8VE2FTD711"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-8VE2FTD711');</script>
    <meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23059669'/><circle cx='50' cy='50' r='6' fill='white'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Outfit',sans-serif;background:#f0fdf4;font-size:16px;-webkit-text-size-adjust:100%;}
        .fd{font-family:'Barlow Condensed',sans-serif;}
        .hero-bg{background:linear-gradient(135deg,#064e3b 0%,#059669 50%,#34d399 100%);min-height:100vh;}
        .nav{padding:14px 18px;display:flex;align-items:center;gap:12px;}
        .nav-logo{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;color:white;letter-spacing:1px;}
        .content{padding:0 16px 100px;max-width:740px;margin:0 auto;}
        .page-title{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;color:white;}
        .pc{background:white;border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:all .2s;cursor:pointer;border-left:4px solid transparent;}
        .pc:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);border-left-color:#10b981;}
        .pc.expanded{border-left-color:#059669;}
        .pc-main{padding:14px 16px;display:flex;align-items:center;gap:14px;}
        .pc-avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#d1fae5,#a7f3d0);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;border:2px solid #e2e8f0;}
        .pc-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
        .pc-avatar-letter{font-size:20px;font-weight:700;color:#059669;}
        .pc-info{flex:1;min-width:0;}
        .pc-name{font-weight:700;font-size:15px;color:#0f172a;display:flex;align-items:center;gap:6px;}
        .pc-loc{font-size:12px;color:#64748b;margin-top:2px;}
        .pc-meta{font-size:11px;color:#94a3b8;margin-top:1px;}
        .pc-rating{min-width:60px;text-align:center;}
        .pc-rating-val{font-size:13px;font-weight:800;color:#064e3b;background:#ecfdf5;border-radius:8px;padding:6px 8px;border:1px solid #d1fae5;}
        .pc-rating-label{font-size:9px;color:#94a3b8;margin-top:3px;font-weight:600;text-transform:uppercase;}
        .pc-expand{padding:0 16px 14px;border-top:1px solid #f1f5f9;animation:fadeIn .2s ease;}
        .posts-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px;}
        .posts-table th{text-align:left;font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;padding:6px 8px;border-bottom:2px solid #f1f5f9;}
        .posts-table td{padding:8px;border-bottom:1px solid #f8fafc;color:#334155;}
        .tag{display:inline-flex;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600;}
        .t-green{background:#ecfdf5;color:#059669;}
        .t-purple{background:#f5f3ff;color:#7c3aed;}
        .t-blue{background:#eff6ff;color:#2563eb;}
        .t-amber{background:#fffbeb;color:#d97706;}
        .auth-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;padding:20px;text-align:center;}
        .google-btn{background:white;color:#333;border:none;border-radius:12px;padding:14px 28px;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.15);display:flex;align-items:center;gap:12px;}
        .btn-g{background:linear-gradient(135deg,#059669,#10b981);color:white;border-radius:10px;padding:10px 20px;font-weight:700;font-size:14px;border:none;cursor:pointer;font-family:'Outfit',sans-serif;}
        .post-btn{background:white;color:#064e3b;border:none;border-radius:12px;padding:10px 20px;font-weight:700;font-size:14px;cursor:pointer;}
        .mo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:200;backdrop-filter:blur(4px);}
        .ms{background:white;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:740px;max-height:90vh;overflow-y:auto;animation:slideUp .3s ease;}
        .mh{width:40px;height:4px;background:#cbd5e1;border-radius:2px;margin:0 auto 16px;}
        .fg{margin-bottom:14px;}
        .fl{display:block;font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;margin-bottom:5px;}
        .fi{width:100%;padding:10px 12px;border:2px solid #e2e8f0;border-radius:10px;font-family:'Outfit',sans-serif;font-size:14px;outline:none;}
        .og{display:flex;gap:6px;flex-wrap:wrap;}
        .ob{padding:7px 14px;border-radius:8px;border:2px solid #e2e8f0;background:white;font-size:12px;font-weight:600;cursor:pointer;}
        .ob.s{border-color:#059669;background:#ecfdf5;color:#059669;}
        .cb{max-width:80%;padding:10px 14px;border-radius:14px;font-size:14px;margin-bottom:6px;}
        .cb.me{background:#059669;color:white;align-self:flex-end;border-bottom-right-radius:4px;}
        .cb.them{background:#f1f5f9;color:#1e293b;align-self:flex-start;border-bottom-left-radius:4px;}
        .user-pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);border-radius:20px;padding:4px 12px;cursor:pointer;border:none;}
        @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

const FB = {
    apiKey: "AIzaSyDaFUszTD0-Ro292GOBSlS5vkZSdJM0NF4",
    authDomain: "pickleball-app-1bba7.firebaseapp.com",
    projectId: "pickleball-app-1bba7",
    storageBucket: "pickleball-app-1bba7.firebasestorage.app",
    messagingSenderId: "645604154338",
    appId: "1:645604154338:web:b92f87c2cd11d950b737bb"
};

if (!firebase.apps.length) firebase.initializeApp(FB);
const db = firebase.firestore();
const auth = firebase.auth();

const SKILLS = ['2.0-2.5', '2.5-3.0', '3.0-3.5', '3.5-4.0', '4.0-4.5', '4.5-5.0', '5.0+'];
const PURPOSES = [
    { id: 'play', label: 'Looking to Play', emoji: '🏓' },
    { id: 'partner', label: 'Need a Partner', emoji: '🤝' },
    { id: 'drill', label: 'Drilling Session', emoji: '🎯' },
    { id: 'group', label: 'Group Play', emoji: '👥' }
];
const PU_TAG = { 'play': 't-green', 'partner': 't-blue', 'drill': 't-purple', 'group': 't-amber' };

function AuthScreen() {
    const [ld, setLd] = useState(false);
    const [err, setErr] = useState(null);

    const googleAuth = async () => {
        setLd(true); setErr(null);
        const prov = new firebase.auth.GoogleAuthProvider();
        try { 
            // FIXED: Using Popup to avoid redirect issues on custom domains
            await auth.signInWithPopup(prov); 
        } catch (e) { 
            setErr(e.message); 
            setLd(false); 
        }
    };

    return (
        <div className="hero-bg">
            <div className="auth-screen">
                <div style={{ fontSize: 56, marginBottom: 12 }}>🏓</div>
                <div className="fd" style={{ fontSize: 34, fontWeight: 800, color: 'white', marginBottom: 24 }}>FIND PLAYERS</div>
                {err && <div style={{ color: '#fecaca', marginBottom: 12 }}>{err}</div>}
                <button className="google-btn" onClick={googleAuth} disabled={ld}>
                    <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    {ld ? 'Signing in...' : 'Continue with Google'}
                </button>
            </div>
        </div>
    );
}

function ProfileSetup({ user, onSave }) {
    const [name, setName] = useState(user.displayName || '');
    const [skill, setSkill] = useState('');
    const [city, setCity] = useState('');
    const save = async () => {
        if (!name || !skill) return;
        const data = { name, skill, city, photoURL: user.photoURL, uid: user.uid, updatedAt: Date.now() };
        await db.collection('profiles').doc(user.uid).set(data);
        onSave(data);
    };
    return (
        <div className="mo">
            <div className="ms">
                <div className="mh" />
                <div className="fd" style={{ fontSize: 22, fontWeight: 800, marginBottom: 16 }}>SET UP PROFILE</div>
                <div className="fg"><div className="fl">Name</div><input className="fi" value={name} onChange={e => setName(e.target.value)} /></div>
                <div className="fg"><div className="fl">Skill Level</div><div className="og">{SKILLS.map(s => <button key={s} className={`ob ${skill === s ? 's' : ''}`} onClick={() => setSkill(s)}>{s}</button>)}</div></div>
                <div className="fg"><div className="fl">City</div><input className="fi" value={city} onChange={e => setCity(e.target.value)} /></div>
                <button className="btn-g" style={{ width: '100%' }} onClick={save}>Save Profile</button>
            </div>
        </div>
    );
}

function PostForm({ profile, onClose }) {
    const [purpose, setPurpose] = useState('play');
    const [msg, setMsg] = useState('');
    const save = async () => {
        await db.collection('findPlayers').add({ 
            ...profile, 
            purpose, 
            message: msg, 
            timestamp: Date.now(), 
            status: 'active',
            playTypes: ['Casual'],
            availability: 'Today'
        });
        onClose();
    };
    return (
        <div className="mo" onClick={e => e.target === e.currentTarget && onClose()}>
            <div className="ms"><div className="mh" />
                <div className="fd" style={{ fontSize: 20, fontWeight: 800, marginBottom: 16 }}>POST AVAILABILITY</div>
                <div className="fg"><div className="fl">Purpose</div><div className="og">{PURPOSES.map(p => <button key={p.id} className={`ob ${purpose === p.id ? 's' : ''}`} onClick={() => setPurpose(p.id)}>{p.label}</button>)}</div></div>
                <div className="fg"><div className="fl">Message</div><textarea className="fi" value={msg} onChange={e => setMsg(e.target.value)} /></div>
                <button className="btn-g" style={{ width: '100%' }} onClick={save}>Post Now</button>
            </div>
        </div>
    );
}

function ChatModal({ player, myUid, onClose }) {
    const [msgs, setMsgs] = useState([]);
    const [inp, setInp] = useState('');
    const convoId = [myUid, player.uid].sort().join('_');

    useEffect(() => {
        return db.collection('chatMessages').where('convoId', '==', convoId).orderBy('timestamp', 'asc').onSnapshot(s => setMsgs(s.docs.map(d => d.data())));
    }, []);

    const send = async () => {
        if (!inp.trim()) return;
        await db.collection('chatMessages').add({ convoId, text: inp, senderUid: myUid, timestamp: Date.now() });
        setInp('');
    };

    return (
        <div className="mo">
            <div className="ms" style={{ height: '80vh', display: 'flex', flexDirection: 'column' }}>
                <div style={{ padding: 16, borderBottom: '1px solid #eee', display: 'flex', justifyContent: 'space-between' }}>
                    <div style={{ fontWeight: 800 }}>Chat with {player.name}</div>
                    <button onClick={onClose} style={{border:'none', background:'none'}}>✕</button>
                </div>
                <div style={{ flex: 1, overflowY: 'auto', padding: 16, display: 'flex', flexDirection: 'column' }}>
                    {msgs.map((m, i) => <div key={i} className={`cb ${m.senderUid === myUid ? 'me' : 'them'}`}>{m.text}</div>)}
                </div>
                <div style={{ padding: 16, borderTop: '1px solid #eee', display: 'flex', gap: 8 }}>
                    <input className="fi" value={inp} onChange={e => setInp(e.target.value)} />
                    <button className="btn-g" onClick={send}>Send</button>
                </div>
            </div>
        </div>
    );
}

function App() {
    const [user, setUser] = useState(undefined);
    const [profile, setProfile] = useState(undefined);
    const [posts, setPosts] = useState([]);
    const [showPost, setShowPost] = useState(false);
    const [chatP, setChatP] = useState(null);
    const [expanded, setExpanded] = useState(null);

    useEffect(() => {
        auth.onAuthStateChanged(u => setUser(u || null));
        db.collection('findPlayers').where('status', '==', 'active').onSnapshot(s => setPosts(s.docs.map(d => ({ id: d.id, ...d.data() }))));
    }, []);

    useEffect(() => {
        if (user) db.collection('profiles').doc(user.uid).onSnapshot(d => setProfile(d.exists ? d.data() : null));
    }, [user]);

    const grouped = useMemo(() => {
        const m = {};
        posts.forEach(p => {
            if (!m[p.uid]) m[p.uid] = { ...p, posts: [] };
            m[p.uid].posts.push(p);
        });
        return Object.values(m);
    }, [posts]);

    if (user === undefined) return null;
    if (!user) return <AuthScreen />;
    if (profile === null) return <ProfileSetup user={user} onSave={setProfile} />;

    return (
        <div className="hero-bg">
            <div className="nav">
                <div className="nav-logo" style={{ flex: 1 }}>🏓 PICKLECONNECT</div>
                <button className="user-pill" onClick={() => auth.signOut()}>Logout</button>
            </div>
            <div className="content">
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
                    <div className="page-title">Find Players</div>
                    <button className="post-btn" onClick={() => setShowPost(true)}>+ Post</button>
                </div>
                {grouped.map(g => (
                    <div key={g.uid} className={`pc ${expanded === g.uid ? 'expanded' : ''}`} onClick={() => setExpanded(expanded === g.uid ? null : g.uid)}>
                        <div className="pc-main">
                            <div className="pc-avatar">{g.photoURL ? <img src={g.photoURL} /> : <div className="pc-avatar-letter">{g.name[0]}</div>}</div>
                            <div className="pc-info">
                                <div className="pc-name">{g.name}</div>
                                <div className="pc-loc">{g.city}</div>
                                <div className="pc-meta">{g.posts.length} Availability Post(s)</div>
                            </div>
                            <div className="pc-rating"><div className="pc-rating-val">{g.skill}</div><div className="pc-rating-label">Skill</div></div>
                        </div>
                        {expanded === g.uid && (
                            <div className="pc-expand" onClick={e => e.stopPropagation()}>
                                <table className="posts-table">
                                    <thead><tr><th>Purpose</th><th>Message</th></tr></thead>
                                    <tbody>{g.posts.map(p => <tr key={p.id}>
                                        <td><span className={`tag ${PU_TAG[p.purpose]}`}>{p.purpose}</span></td>
                                        <td>{p.message}</td>
                                    </tr>)}</tbody>
                                </table>
                                {g.uid !== user.uid && <button className="btn-g" style={{ marginTop: 10, width: '100%' }} onClick={() => setChatP(g)}>💬 Message {g.name}</button>}
                            </div>
                        )}
                    </div>
                ))}
            </div>
            {showPost && <PostForm profile={profile} onClose={() => setShowPost(false)} />}
            {chatP && <ChatModal player={chatP} myUid={user.uid} onClose={() => setChatP(null)} />}
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
