<script type="text/babel">

const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAY_SHORT=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

function fmtTime(ts){if(!ts)return '';const[h,m]=ts.split(':').map(Number);return `${h%12||12}:${m.toString().padStart(2,'0')}${h>=12?'pm':'am'}`;}
function fmtTimeRange(s,e){
    if(!s)return '';
    if(!e)return fmtTime(s);
    const[sh,sm]=s.split(':').map(Number);const[eh,em]=e.split(':').map(Number);
    const ss=sh>=12?'pm':'am',es=eh>=12?'pm':'am';
    const sv=`${sh%12||12}:${sm.toString().padStart(2,'0')}`;
    const ev=`${eh%12||12}:${em.toString().padStart(2,'0')}${es}`;
    return ss===es?`${sv}–${ev}`:`${sv}${ss}–${ev}`;
}
function timeAgo(t){if(!t)return '';const d=Date.now()-t,m=Math.floor(d/60000);if(m<1)return 'just now';if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago';}
function getDateParts(ds){
    if(!ds)return{dayStr:'?',numStr:'?',rel:'future'};
    const d=new Date(ds+'T12:00:00');
    const today=new Date();today.setHours(0,0,0,0);
    const diff=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-today)/86400000);
    return{dayStr:DAY_SHORT[d.getDay()],numStr:d.getDate(),rel:diff===0?'today':diff<=2?'soon':'future'};
}
function isExpired(g){const t=g.timeEnd||g.time;if(!g.date||!t)return false;return new Date(g.date+'T'+t)<new Date();}
function slotsUsed(players){return(players||[]).reduce((s,p)=>s+1+(p.guests||0),0);}
function ymd(date){return`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;}

function Avatar({photoURL,name,size=36}){

}
function Toast({msg}){return msg?<div className="toast">{msg}</div>:null;}

// ── UserPill ──────────────────────────────────────────────────────────────
function UserPill({user,profile,onSignOut}){
    const[open,setOpen]=useState(false);const ref=useRef();

        {open&&<div className="upd"><button className="upd-item danger" onClick={onSignOut}>🚪 Sign Out</button></div>}

}

function AuthScreen(){
    const[mode,setMode]=useState('signin');
    const[email,setEmail]=useState('');const[pass,setPass]=useState('');const[confirm,setConfirm]=useState('');
    const[ld,setLd]=useState(false);const[err,setErr]=useState(null);
    const emailAuth=async()=>{
        if(!email.trim()||!pass){setErr('Enter email and password.');return;}
        if(mode==='signup'&&pass!==confirm){setErr('Passwords do not match.');return;}
        if(mode==='signup'&&pass.length<6){setErr('Password must be at least 6 characters.');return;}
        setLd(true);setErr(null);
        try{
            if(mode==='signup')await auth.createUserWithEmailAndPassword(email.trim(),pass);
            else await auth.signInWithEmailAndPassword(email.trim(),pass);
        }catch(e){
            const msg={'auth/email-already-in-use':'Account exists — sign in instead.','auth/user-not-found':'No account found.','auth/wrong-password':'Incorrect password.','auth/invalid-email':'Invalid email.','auth/too-many-requests':'Too many attempts.','auth/invalid-credential':'Invalid email or password.'}[e.code]||e.message;
            setErr(msg);
        }
        setLd(false);
    };
    return(<div className="hero-bg">
        <div className="nav"><a href="index.html" style={{textDecoration:'none'}}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.6)" strokeWidth="2.5"><path d="M15 18l-6-6 6-6"/></svg></a><div className="nav-logo">🏓 PICKLECONNECT</div></div>
        <div className="auth-screen">
            <div style={{fontSize:56,marginBottom:12}}>🎮</div>
            <div className="fd" style={{fontSize:34,fontWeight:800,color:'white',marginBottom:6}}>FIND A GAME</div>
            <div style={{fontSize:14,color:'rgba(255,255,255,.65)',marginBottom:24,maxWidth:320,lineHeight:1.5}}>Organize games, fill spots fast, get notified when you're ready to play.</div>
            <div style={{display:'flex',background:'rgba(255,255,255,.12)',borderRadius:10,padding:3,marginBottom:20,width:'100%',maxWidth:340}}>
                {[['signin','Sign In'],['signup','Sign Up']].map(([k,l])=><button key={k} onClick={()=>{setMode(k);setErr(null);}} style={{flex:1,padding:'9px',border:'none',borderRadius:8,fontFamily:'Outfit',fontSize:13,fontWeight:700,cursor:'pointer',background:mode===k?'white':'transparent',color:mode===k?'#059669':'rgba(255,255,255,.75)'}}>{l}</button>)}
            </div>
            {err&&<div style={{background:'rgba(239,68,68,.15)',border:'1px solid rgba(239,68,68,.3)',borderRadius:10,padding:'10px 14px',marginBottom:14,maxWidth:340,width:'100%',fontSize:12,color:'#fecaca',textAlign:'left'}}>⚠️ {err}</div>}
            <div style={{width:'100%',maxWidth:340,display:'flex',flexDirection:'column',gap:8}}>
                <input value={email} onChange={e=>setEmail(e.target.value)} type="email" placeholder="Email address" style={{padding:'11px 14px',borderRadius:10,border:'2px solid rgba(255,255,255,.2)',background:'rgba(255,255,255,.12)',color:'white',fontFamily:'Outfit',fontSize:14,outline:'none',width:'100%'}} onKeyDown={e=>e.key==='Enter'&&emailAuth()}/>
                <input value={pass} onChange={e=>setPass(e.target.value)} type="password" placeholder="Password" style={{padding:'11px 14px',borderRadius:10,border:'2px solid rgba(255,255,255,.2)',background:'rgba(255,255,255,.12)',color:'white',fontFamily:'Outfit',fontSize:14,outline:'none',width:'100%'}} onKeyDown={e=>e.key==='Enter'&&emailAuth()}/>
                {mode==='signup'&&<input value={confirm} onChange={e=>setConfirm(e.target.value)} type="password" placeholder="Confirm password" style={{padding:'11px 14px',borderRadius:10,border:'2px solid rgba(255,255,255,.2)',background:'rgba(255,255,255,.12)',color:'white',fontFamily:'Outfit',fontSize:14,outline:'none',width:'100%'}} onKeyDown={e=>e.key==='Enter'&&emailAuth()}/>}
                <button onClick={emailAuth} disabled={ld} style={{padding:'12px',borderRadius:10,border:'none',background:'linear-gradient(135deg,#059669,#10b981)',color:'white',fontFamily:'Outfit',fontSize:14,fontWeight:700,cursor:'pointer',opacity:ld?.6:1}}>{ld?'Please wait…':mode==='signup'?'✅ Create Account':'→ Sign In'}</button>
                {mode==='signin'&&<button onClick={async()=>{if(!email.trim()){setErr('Enter your email first.');return;}try{await auth.sendPasswordResetEmail(email.trim());alert('Reset email sent!');}catch(e){setErr(e.message);}}} style={{background:'none',border:'none',color:'rgba(255,255,255,.45)',fontSize:11,cursor:'pointer',fontFamily:'Outfit',textAlign:'right',padding:'2px 0'}}>Forgot password?</button>}
            </div>
            <div style={{fontSize:11,color:'rgba(255,255,255,.35)',marginTop:20}}>Free · Takes 30 seconds</div>
        </div>
    </div>);
}

// ── Join Modal (with guest selector) ─────────────────────────────────────
function JoinModal({game,myProfile,user,onConfirm,onClose}){
    const used=slotsUsed(game.players||[]);
    const total=game.spots||4;
    const spotsLeft=total-used;
    const maxGuests=Math.min(spotsLeft-1,5);
    const[guests,setGuests]=useState(0);
    const willFill=1+guests>=spotsLeft;
    return(<div className="mo" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
        <div className="ms">
            <div className="mh"/>
            <div style={{fontSize:18,fontWeight:800,color:'#0f172a',marginBottom:4}}>🏓 Join Game</div>
            <div style={{fontSize:13,color:'#64748b',marginBottom:20}}>{game.title||`Doubles @ ${game.court}`} · {fmtTimeRange(game.time,game.timeEnd)}</div>
            <div style={{background:'#f0fdf4',borderRadius:12,padding:'14px',marginBottom:20}}>
                <div style={{fontSize:12,fontWeight:700,color:'#065f46',marginBottom:10}}>ARE YOU BRINGING GUESTS?</div>
                <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:8}}>
                    {[0,1,2,3,4,5].filter(n=>n<=maxGuests).map(n=>(
                        <button key={n} className={`guest-pill ${guests===n?'s':''}`} onClick={()=>setGuests(n)}>
                            {n===0?'Just me':`+${n} guest${n>1?'s':''}`}
                        </button>
                    ))}
                </div>
                {guests>0&&<div style={{fontSize:11,color:'#059669',fontWeight:600}}>You'll take up {1+guests} of {spotsLeft} remaining spot{spotsLeft!==1?'s':''}.</div>}
                {willFill&&<div style={{fontSize:11,color:'#d97706',fontWeight:600,marginTop:4}}>🎉 This will fill the game!</div>}
            </div>
            <button onClick={()=>onConfirm(guests)} className="btn-g" style={{width:'100%',padding:'13px',fontSize:15}}>
                Confirm — I'm In{guests>0?` (+${guests} guest${guests>1?'s':''})`:''} 
            </button>
        </div>
    </div>);
}

// ── Slot component ────────────────────────────────────────────────────────
function Slot({player,isMine,onJoin,isFull,isGuest}){
    if(player){
        return(<div className={`slot ${isGuest?'guest-slot':isMine?'mine':'filled'}`} style={{animation:'popIn .25s ease'}}>
            {isGuest
                ?<div style={{width:32,height:32,borderRadius:'50%',background:'#fde68a',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:16}}>👤</div>
                :<Avatar photoURL={player.photoURL} name={player.name} size={32}/>
            }
            <div style={{minWidth:0}}>
                <div className="slot-name">{isGuest?`${player.name}'s guest`:player.name}{isMine&&!isGuest?' ✅':''}</div>
                {!isGuest&&<div className="slot-skill">{player.skill&&player.skill!=='Any'?player.skill:'Any level'}</div>}
            </div>
        </div>);
    }
    return(<div className="slot empty" onClick={isFull?null:onJoin} style={{cursor:isFull?'default':'pointer',opacity:isFull?.4:1}}>
        <div className="slot-empty-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="2.5"><path d="M12 5v14M5 12h14"/></svg></div>
        <div className="slot-empty-text">{isFull?'Full':'Tap to join'}</div>
    </div>);
}

// ── Game Form ─────────────────────────────────────────────────────────────
function GameForm({user,profile,onClose,onSaved,editData}){
    const today=new Date().toISOString().split('T')[0];
    const[title,setTitle]=useState(editData?.title||'');
    const[date,setDate]=useState(editData?.date||today);
    const[timeStart,setTimeStart]=useState(editData?.time||'16:00');
    const[timeEnd,setTimeEnd]=useState(editData?.timeEnd||'18:00');
    const[court,setCourt]=useState(editData?.court||'');
    const[skill,setSkill]=useState(editData?.skill||'Any');
    const[note,setNote]=useState(editData?.note||'');
    const[spots,setSpots]=useState(editData?.spots||4);
    const[recurring,setRecurring]=useState(editData?.recurring||false);
    const[recurDay,setRecurDay]=useState(editData?.recurDay!==undefined?editData.recurDay:new Date().getDay());
    const[saving,setSaving]=useState(false);
    const[err,setErr]=useState(null);

    const adjSpots=delta=>{const v=spots+delta;if(v>=2&&v<=20)setSpots(v);};

    const save=async()=>{
        if(!court.trim()){setErr('Enter a court or location.');return;}
        if(!date){setErr('Pick a date.');return;}
        if(!timeStart){setErr('Pick a start time.');return;}
        setSaving(true);setErr(null);
        const ct=court.trim();
        const data={
            title:title.trim()||`Game @ ${ct}`,
            date,time:timeStart,timeEnd:timeEnd||null,
            court:ct,skill,note:note.trim(),spots,
            recurring,recurDay:recurring?parseInt(recurDay):null,
            organizerUid:user.uid,organizerName:profile?.name||user.email,organizerPhoto:user.photoURL||null,
            players:[{uid:user.uid,name:profile?.name||user.email,photoURL:user.photoURL||null,skill:profile?.skill||'Any',guests:0,joinedAt:Date.now()}],
            waitlist:[],status:'active',
            createdAt:editData?.createdAt||Date.now(),updatedAt:Date.now(),
        };
        try{
            if(editData?.id){
                await db.collection('games').doc(editData.id).update({
                    title:data.title,date:data.date,time:data.time,timeEnd:data.timeEnd,
                    court:data.court,skill:data.skill,note:data.note,spots:data.spots,
                    recurring:data.recurring,recurDay:data.recurDay,updatedAt:data.updatedAt,
                });
            }else{
                await db.collection('games').add(data);
            }
            onSaved();
        }catch(e){setErr(e.message);setSaving(false);}
    };

    return(<div className="mo" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
        <div className="ms">
            <div className="mh"/>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
                <div className="fd" style={{fontSize:20,fontWeight:800,color:'#0f172a'}}>{editData?'✏️ EDIT GAME':'🎮 CREATE GAME'}</div>
                <button onClick={onClose} style={{background:'#f1f5f9',border:'none',borderRadius:8,width:30,height:30,fontSize:14,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
            </div>
            {err&&<div style={{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:10,padding:'10px 14px',marginBottom:14,fontSize:12,color:'#dc2626'}}>⚠️ {err}</div>}

            <div className="fg">
                <label className="fl">Court / Location *</label>
                <input className="fi" value={court} onChange={e=>setCourt(e.target.value)} placeholder="e.g. Centennial Park Court 3"/>
            </div>

            <div className="fg">
                <label className="fl">Date *</label>
                <input className="fi" type="date" value={date} min={today} onChange={e=>setDate(e.target.value)}/>
            </div>

            <div className="time-row fg">
                <div>
                    <label className="fl">Start Time *</label>
                    <input className="fi" type="time" value={timeStart} onChange={e=>{
                        setTimeStart(e.target.value);
                        if(e.target.value){const[h,m]=e.target.value.split(':').map(Number);const eh=(h+2)%24;setTimeEnd(`${String(eh).padStart(2,'0')}:${String(m).padStart(2,'0')}`);}
                    }}/>
                </div>
                <div>
                    <label className="fl">End Time</label>
                    <input className="fi" type="time" value={timeEnd} onChange={e=>setTimeEnd(e.target.value)}/>
                </div>
            </div>

            <div className="fg">
                <label className="fl">Spots Needed (total players)</label>
                <div style={{display:'flex',alignItems:'center',gap:14}}>
                    <div className="stepper">
                        <button className="stepper-btn" onClick={()=>adjSpots(-1)}>−</button>
                        <div className="stepper-val">{spots}</div>
                        <button className="stepper-btn" onClick={()=>adjSpots(1)}>+</button>
                    </div>
                    <div style={{fontSize:12,color:'#64748b'}}>
                        {spots===4?'Standard doubles':spots===2?'Singles / rally':spots<=6?'Small group':`Group of ${spots}`}
                        <div style={{fontSize:10,color:'#94a3b8',marginTop:1}}>2 – 20 players</div>
                    </div>
                </div>
            </div>

            <div className="fg">
                <label className="fl">Skill Level</label>
                <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                    {SKILLS.map(s=><button key={s} className={`ob ${skill===s?'s':''}`} onClick={()=>setSkill(s)}>{s}</button>)}
                </div>
                <div className="skill-note">Players outside this range can still join — it's a guideline.</div>
            </div>

            <div className="fg">
                <label className="fl">Game Title (optional)</label>
                <input className="fi" value={title} onChange={e=>setTitle(e.target.value)} placeholder={`Game @ ${court||'court name'}`}/>
            </div>

            <div className="fg">
                <label className="fl">Recurring?</label>
                <div style={{display:'flex',gap:8,marginBottom:8}}>
                    <button className={`ob ${!recurring?'s':''}`} onClick={()=>setRecurring(false)}>One-off</button>
                    <button className={`ob ${recurring?'s':''}`} onClick={()=>setRecurring(true)}>🔁 Weekly</button>
                </div>
                {recurring&&<div>
                    <label className="fl" style={{marginBottom:5}}>Repeats every</label>
                    <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                        {DAYS.map((d,i)=><button key={i} className={`ob ${recurDay==i?'s':''}`} onClick={()=>setRecurDay(i)}>{DAY_SHORT[i]}</button>)}
                    </div>
                </div>}
            </div>

            <div className="fg">
                <label className="fl">Note (optional)</label>
                <textarea className="fi" value={note} onChange={e=>setNote(e.target.value)} placeholder="e.g. Bring a can of balls, wear non-marking shoes…" rows={2} style={{resize:'vertical',minHeight:50}}/>
            </div>

            <div style={{background:'#f0fdf4',borderRadius:10,padding:'10px 14px',marginBottom:16,fontSize:12,color:'#059669',display:'flex',gap:8}}>
                <span>ℹ️</span><span>You'll be added as player 1. All players get notified when the game is full.</span>
            </div>

            <button onClick={save} disabled={saving} className="btn-g" style={{width:'100%',padding:'13px',fontSize:15}}>
                {saving?'Saving…':editData?'Save Changes':'🎮 Create Game'}
            </button>
        </div>
    </div>);
}

// ── Game Card ─────────────────────────────────────────────────────────────
function GameCard({game,myUid,onJoin,onLeave,onWaitlist,onEdit,onCancel,highlight}){
    const[expanded,setExpanded]=useState(!!highlight);
    const players=game.players||[];
    const waitlist=game.waitlist||[];
    const spots=game.spots||4;
    const used=slotsUsed(players);
    const isFull=used>=spots;
    const isMine=game.organizerUid===myUid;
    const amIn=players.some(p=>p.uid===myUid);
    const amWaiting=waitlist.some(p=>p.uid===myUid);
    const expired=isExpired(game);
    const{dayStr,numStr,rel}=getDateParts(game.date);
    const timeLabel=fmtTimeRange(game.time,game.timeEnd);

    // Build expanded slot list including guests
    const slotItems=[];
    players.forEach(p=>{slotItems.push({...p,isPlayer:true});for(let i=0;i<(p.guests||0);i++)slotItems.push({...p,isGuest:true});});
    for(let i=slotItems.length;i<spots;i++)slotItems.push(null);

    const cols=spots<=4?2:spots<=6?3:4;
    const cardClass=`gc ${game.recurring?'recurring':isFull?'full':'open'}${expired?' dimmed':''}`;

    return(<div className={cardClass}>
        <div className="gc-head" onClick={()=>setExpanded(!expanded)}>
            <div className={`gc-date-block ${rel}`}>
                <div className="gc-day">{rel==='today'?'TODAY':dayStr}</div>
                <div className="gc-num">{numStr}</div>
            </div>
            <div className="gc-info" style={{minWidth:0}}>
                <div className="gc-title">{game.recurring&&<span className="rec-dot"/>}{game.title||`Game @ ${game.court}`}</div>
                <div className="gc-sub">📍 {game.court}</div>
                <div style={{display:'flex',alignItems:'center',gap:5,marginTop:5,flexWrap:'wrap'}}>
                    {timeLabel&&<span className="time-chip">⏰ {timeLabel}</span>}
                    {isFull
                        ?<span className="gc-badge full-badge">🎉 Full ({used}/{spots})</span>
                        :<span className="gc-badge open-badge">{spots-used} of {spots} open</span>}
                    {game.recurring&&<span className="gc-badge rec-badge">🔁 {DAY_SHORT[game.recurDay]}s</span>}
                    {game.skill&&game.skill!=='Any'&&<span className="gc-badge" style={{background:'#f0f9ff',color:'#0369a1'}}>🎯 {game.skill}</span>}
                </div>
            </div>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="2.5" style={{transform:expanded?'rotate(180deg)':'none',transition:'transform .2s',flexShrink:0,marginTop:6}}><path d="M6 9l6 6 6-6"/></svg>
        </div>

        {/* Roster */}
        <div className="roster" style={{gridTemplateColumns:`repeat(${cols},1fr)`}}>
            {slotItems.map((p,i)=>(
                <Slot key={i} player={p} isMine={p?.uid===myUid&&!p?.isGuest} isGuest={p?.isGuest} onJoin={()=>onJoin(game)} isFull={isFull&&!p}/>
            ))}
        </div>

        {isFull&&<div className="full-banner">
            <span style={{fontSize:20}}>🎉</span>
            <div><div style={{fontSize:13,fontWeight:700,color:'#92400e'}}>Game is full — you're set!</div><div style={{fontSize:11,color:'#b45309',marginTop:1}}>All {spots} players notified.</div></div>
        </div>}

        {waitlist.length>0&&<div className="waitlist">
            <div style={{fontSize:10,fontWeight:700,color:'#94a3b8',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:5}}>⏳ Waitlist ({waitlist.length})</div>
            {waitlist.map((p,i)=><div key={i} className="waitlist-item">
                <Avatar photoURL={p.photoURL} name={p.name} size={24}/>
                <div style={{fontSize:12,fontWeight:600,color:'#475569'}}>{p.name}</div>
                {p.uid===myUid&&<div style={{marginLeft:'auto',fontSize:10,color:'#d97706',fontWeight:700}}>You're #{i+1}</div>}
            </div>)}
        </div>}

        {expanded&&<div style={{padding:'0 14px 12px',borderTop:'1px solid #f1f5f9',animation:'fadeIn .2s',marginTop:4}}>
            {game.note&&<div style={{fontSize:13,color:'#475569',marginBottom:8,lineHeight:1.5}}>💬 {game.note}</div>}
            {game.recurring&&<div style={{fontSize:12,color:'#7c3aed',fontWeight:600,marginBottom:6}}>🔁 Every {DAYS[game.recurDay]} · {timeLabel}</div>}
            <div style={{fontSize:11,color:'#94a3b8'}}>Posted {timeAgo(game.createdAt)} by {game.organizerName}</div>
        </div>}

        <div className="organizer-row">
            <Avatar photoURL={game.organizerPhoto} name={game.organizerName} size={18}/>
            <span>by {isMine?'you':game.organizerName}</span>
            {expired&&<span style={{color:'#f59e0b',fontWeight:700,marginLeft:3}}>· ended</span>}
            {isMine&&!expired&&<>
                <button onClick={()=>onEdit(game)} style={{marginLeft:6,background:'#f0fdf4',border:'none',fontSize:11,color:'#059669',fontWeight:700,cursor:'pointer',fontFamily:'Outfit',padding:'2px 8px',borderRadius:6}}>Edit</button>
                <button className="cancel-btn" onClick={()=>onCancel(game.id)}>Cancel</button>
            </>}
        </div>

        {!expired&&<div className="gc-actions">
            {amIn?(
                isMine
                    ?<div style={{flex:1,fontSize:12,color:'#059669',fontWeight:600}}>✅ You're in as organizer</div>
                    :<button className="leave-btn" onClick={()=>onLeave(game)}>Leave game</button>
            ):isFull?(
                amWaiting
                    ?<div style={{flex:1,fontSize:12,color:'#d97706',fontWeight:600}}>⏳ On waitlist</div>
                    :<button className="waitlist-btn" onClick={()=>onWaitlist(game)}>+ Join Waitlist</button>
            ):(
                <button className="join-btn" onClick={()=>onJoin(game)}>🏓 I'm In!</button>
            )}
        </div>}
    </div>);
}

// ── Calendar View ─────────────────────────────────────────────────────────
function CalendarView({games,myUid,onJoin,onLeave,onWaitlist,onEdit,onCancel,showToast}){
    const now=new Date();
    const[year,setYear]=useState(now.getFullYear());
    const[month,setMonth]=useState(now.getMonth());
    const[selected,setSelected]=useState(ymd(now));

    const prevMonth=()=>{if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);};
    const nextMonth=()=>{if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);};

    // Build calendar days
    const firstDay=new Date(year,month,1).getDay();
    const daysInMonth=new Date(year,month+1,0).getDate();
    const daysInPrev=new Date(year,month,0).getDate();
    const cells=[];
    // prev month
    for(let i=firstDay-1;i>=0;i--)cells.push({d:daysInPrev-i,m:month-1<0?11:month-1,y:month-1<0?year-1:year,other:true});
    // this month
    for(let d=1;d<=daysInMonth;d++)cells.push({d,m:month,y:year,other:false});
    // next month padding to complete 6 rows
    const remaining=42-cells.length;
    for(let d=1;d<=remaining;d++)cells.push({d,m:month+1>11?0:month+1,y:month+1>11?year+1:year,other:true});

    // Map games by date
    const gamesByDate=useMemo(()=>{
        const map={};
        games.forEach(g=>{
            if(!g.date)return;
            if(!map[g.date])map[g.date]=[];
            map[g.date].push(g);
        });
        return map;
    },[games]);

    const todayStr=ymd(now);
    const selectedGames=(gamesByDate[selected]||[]).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    const selDate=selected?new Date(selected+'T12:00:00'):null;
    const selLabel=selDate?selDate.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}):'';

    return(<div>
        {/* Calendar widget */}
        <div className="cal-wrap">
            <div className="cal-header">
                <button className="cal-nav" onClick={prevMonth}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5"><path d="M15 18l-6-6 6-6"/></svg></button>
                <div className="cal-month">{MONTHS[month]} {year}</div>
                <button className="cal-nav" onClick={nextMonth}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5"><path d="M9 18l6-6-6-6"/></svg></button>
            </div>
            <div className="cal-grid">
                {DAY_SHORT.map(d=><div key={d} className="cal-dow">{d}</div>)}
                {cells.map((cell,i)=>{
                    const ds=`${cell.y}-${String(cell.m+1).padStart(2,'0')}-${String(cell.d).padStart(2,'0')}`;
                    const dayGames=gamesByDate[ds]||[];
                    const isToday=ds===todayStr;
                    const isSel=ds===selected;
                    return(<div key={i} className={`cal-day${cell.other?' other-month':''}${isToday?' today-cell':''}${isSel?' selected':''}`} onClick={()=>setSelected(ds)}>
                        <div className="cal-dn">{cell.d}</div>
                        {dayGames.length>0&&<div className="cal-dots">
                            {dayGames.slice(0,3).map((g,j)=>{
                                const used=slotsUsed(g.players||[]);
                                const full=used>=(g.spots||4);
                                const cls=g.recurring?'dot-rec':full?'dot-full':'dot-open';
                                return<div key={j} className={`cal-dot ${cls}`}/>;
                            })}
                        </div>}
                    </div>);
                })}
            </div>
            {/* Legend */}
            <div style={{display:'flex',gap:12,marginTop:10,justifyContent:'center'}}>
                {[['dot-open','Open spots'],['dot-full','Full'],['dot-rec','Weekly']].map(([c,l])=>(
                    <div key={c} style={{display:'flex',alignItems:'center',gap:4,fontSize:10,color:'rgba(255,255,255,.6)',fontWeight:600}}>
                        <div className={`cal-dot ${c}`}/>
                        {l}
                    </div>
                ))}
            </div>
        </div>

        {/* Selected day games */}
        {selected&&<div className="day-panel">
            <div className="day-panel-header">
                <div className="day-panel-title">{selLabel}</div>
                <div style={{fontSize:12,color:'#64748b',fontWeight:600}}>{selectedGames.length} game{selectedGames.length!==1?'s':''}</div>
            </div>
            {selectedGames.length===0
                ?<div style={{padding:'24px 16px',textAlign:'center',fontSize:13,color:'#94a3b8'}}>No games on this day</div>
                :selectedGames.map(g=>{
                    const used=slotsUsed(g.players||[]);
                    const spots=g.spots||4;
                    return(<div key={g.id} className="day-game-row">
                        <div>
                            <div className="day-time">⏰ {fmtTimeRange(g.time,g.timeEnd)}</div>
                            <div className="day-court">{g.title||`Game @ ${g.court}`}</div>
                            <div className="day-slots">📍 {g.court} · {used}/{spots} players{used<spots?` · ${spots-used} spots open`:' · Full'}</div>
                        </div>
                        {used<spots&&!isExpired(g)&&!(g.players||[]).some(p=>p.uid===myUid)&&
                            <button onClick={()=>onJoin(g)} style={{marginLeft:'auto',padding:'7px 14px',border:'none',borderRadius:9,background:'linear-gradient(135deg,#059669,#10b981)',color:'white',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'Outfit',flexShrink:0}}>Join</button>
                        }
                        {(g.players||[]).some(p=>p.uid===myUid)&&
                            <div style={{marginLeft:'auto',fontSize:11,color:'#059669',fontWeight:700,flexShrink:0}}>✅ In</div>
                        }
                    </div>);
                })
            }
        </div>}
    </div>);
}

function Skel(){return(<div className="gc" style={{border:'none',padding:16}}>
    <div style={{display:'flex',gap:12,marginBottom:14}}><div className="skeleton" style={{width:52,height:52,borderRadius:12,flexShrink:0}}/><div style={{flex:1}}><div className="skeleton" style={{height:15,marginBottom:8,borderRadius:6}}/><div className="skeleton" style={{height:11,width:'60%',borderRadius:6}}/></div></div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:7}}>{[0,1,2,3].map(i=><div key={i} className="skeleton" style={{height:52,borderRadius:11}}/>)}</div>
</div>);}

// ── Main App ──────────────────────────────────────────────────────────────
function App(){
    const[user,setUser]=useState(undefined);
    const[profile,setProfile]=useState(undefined);
    const[games,setGames]=useState([]);
    const[loading,setLoading]=useState(true);
    const[tab,setTab]=useState('upcoming');
    const[showForm,setShowForm]=useState(false);
    const[editGame,setEditGame]=useState(null);
    const[joinTarget,setJoinTarget]=useState(null);
    const[toast,setToast]=useState(null);
    const[calHighlight,setCalHighlight]=useState(null);
    const toastRef=useRef();

    const showToast=useCallback((msg)=>{setToast(msg);clearTimeout(toastRef.current);toastRef.current=setTimeout(()=>setToast(null),3200);},[]);

    useEffect(()=>{
        if(!auth)return;
        return auth.onAuthStateChanged(async u=>{
            setUser(u||null);
            if(u){try{const s=await db.collection('profiles').doc(u.uid).get();setProfile(s.exists?s.data():null);}catch(e){setProfile(null);}}
            else setProfile(null);
        });
    },[]);

    useEffect(()=>{
        if(!db||!user)return;
        setLoading(true);
        const unsub=db.collection('games').where('status','==','active').onSnapshot(snap=>{
            setGames(snap.docs.map(d=>({id:d.id,...d.data()})));
            setLoading(false);
        },e=>{console.error(e);setLoading(false);});
        return unsub;
    },[user]);

    const signOut=async()=>{if(confirm('Sign out?'))await auth.signOut();};

    const confirmJoin=async(game,guests)=>{
        setJoinTarget(null);
        const players=game.players||[];
        if(players.some(p=>p.uid===user.uid)){showToast("You're already in!");return;}
        const spots=game.spots||4;
        const used=slotsUsed(players);
        if(used+1+guests>spots){showToast('Not enough spots for you + guests.');return;}
        const me={uid:user.uid,name:profile?.name||user.email,photoURL:user.photoURL||null,skill:profile?.skill||'Any',guests,joinedAt:Date.now()};
        const newPlayers=[...players,me];
        const newUsed=slotsUsed(newPlayers);
        const update={players:newPlayers,updatedAt:Date.now()};
        if(newUsed>=spots)update.fullAt=Date.now();
        await db.collection('games').doc(game.id).update(update);
        showToast(newUsed>=spots?'🎉 Game is full! All players notified.':guests>0?`✅ You're in (+${guests} guest${guests>1?'s':''})`:'✅ You joined the game!');
    };

    const leaveGame=async(game)=>{
        if(!confirm('Leave this game?'))return;
        const players=(game.players||[]).filter(p=>p.uid!==user.uid);
        const waitlist=game.waitlist||[];
        let newPlayers=players,newWaitlist=waitlist;
        if(waitlist.length>0){newPlayers=[...players,{...waitlist[0],guests:0}];newWaitlist=waitlist.slice(1);showToast(`${waitlist[0].name} moved from waitlist!`);}
        else showToast('You left the game.');
        await db.collection('games').doc(game.id).update({players:newPlayers,waitlist:newWaitlist,updatedAt:Date.now()});
    };

    const joinWaitlist=async(game)=>{
        const waitlist=game.waitlist||[];
        if(waitlist.some(p=>p.uid===user.uid)){showToast("Already on waitlist.");return;}
        const me={uid:user.uid,name:profile?.name||user.email,photoURL:user.photoURL||null,addedAt:Date.now()};
        await db.collection('games').doc(game.id).update({waitlist:[...waitlist,me],updatedAt:Date.now()});
        showToast("⏳ On waitlist — you'll be notified if a spot opens!");
    };

    const cancelGame=async(id)=>{
        if(!confirm('Cancel this game?'))return;
        await db.collection('games').doc(id).update({status:'cancelled',updatedAt:Date.now()});
        showToast('Game cancelled.');
    };

    const sorted=useMemo(()=>games.sort((a,b)=>{if(a.date!==b.date)return(a.date||'').localeCompare(b.date||'');return(a.time||'').localeCompare(b.time||'');}),[games]);

    const filtered=useMemo(()=>{
        return sorted.filter(g=>{
            const exp=isExpired(g);
            const used=slotsUsed(g.players||[]);
            const spots=g.spots||4;
            if(tab==='upcoming')return !exp;  // ALL future, including full ones
            if(tab==='open')return !exp&&used<spots;  // Only games still needing players
            if(tab==='recurring')return g.recurring&&!exp;
            if(tab==='mine')return g.organizerUid===user?.uid||(g.players||[]).some(p=>p.uid===user?.uid);
            return true;
        });
    },[sorted,tab,user]);

    const openCount=sorted.filter(g=>!isExpired(g)&&slotsUsed(g.players||[])<(g.spots||4)).length;
    const upcomingCount=sorted.filter(g=>!isExpired(g)).length;

    if(user===undefined||profile===undefined)return(<div className="hero-bg"><div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',color:'white',fontSize:16}}>Loading…</div></div>);
    if(!user)return <AuthScreen/>;

    return(<div className="hero-bg">
        <div className="nav">
            <a href="index.html" style={{textDecoration:'none'}}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.6)" strokeWidth="2.5"><path d="M15 18l-6-6 6-6"/></svg></a>
            <div className="nav-logo" style={{flex:1}}>🏓 PICKLECONNECT</div>
            <UserPill user={user} profile={profile} onSignOut={signOut}/>
        </div>

        <div className="content">
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
                <div>
                    <div className="page-title">Find a Game</div>
                    <div style={{fontSize:12,color:'rgba(255,255,255,.6)',marginTop:2}}>Fill spots · Play together</div>
                </div>
                <button className="post-btn" onClick={()=>{setEditGame(null);setShowForm(true);}}>🎮 Create Game</button>
            </div>

            {/* 5-tab bar */}
            <div className="tab-bar">
                {[
                    ['upcoming',`📅 All (${upcomingCount})`],
                    ['open',`🟢 Open (${openCount})`],
                    ['recurring','🔁 Weekly'],
                    ['mine','👤 Mine'],
                    ['calendar','📆 Calendar'],
                ].map(([k,l])=>(
                    <button key={k} className={`tab-btn ${tab===k?'active':'inactive'}`} onClick={()=>setTab(k)}>{l}</button>
                ))}
            </div>

            {/* Tab descriptions */}
            {tab==='upcoming'&&<div style={{fontSize:11,color:'rgba(255,255,255,.5)',marginBottom:10,paddingLeft:2}}>All upcoming games — including full ones</div>}
            {tab==='open'&&<div style={{fontSize:11,color:'rgba(255,255,255,.5)',marginBottom:10,paddingLeft:2}}>Games still looking for players</div>}

            {tab==='calendar'
                ?<CalendarView games={sorted} myUid={user.uid} onJoin={g=>setJoinTarget(g)} onLeave={leaveGame} onWaitlist={joinWaitlist} onEdit={g=>{setEditGame(g);setShowForm(true);}} onCancel={cancelGame} showToast={showToast}/>
                :<div>
                    {!loading&&tab!=='calendar'&&<div style={{fontSize:12,color:'rgba(255,255,255,.45)',marginBottom:10,paddingLeft:2}}>{filtered.length} game{filtered.length!==1?'s':''}</div>}
                    {loading?[1,2,3].map(i=><Skel key={i}/>)
                    :filtered.length===0
                        ?<div className="empty-state">
                            <div style={{fontSize:44,marginBottom:12}}>🏓</div>
                            <div style={{fontSize:18,fontWeight:700,color:'white',marginBottom:6}}>{tab==='mine'?'No games yet':'No games found'}</div>
                            <div style={{fontSize:13,color:'rgba(255,255,255,.6)',marginBottom:20,lineHeight:1.5}}>{tab==='mine'?'Create a game and fill spots to play.':tab==='open'?'All games are currently full!':'Be the first to post a game!'}</div>
                            <button className="btn-g" onClick={()=>{setEditGame(null);setShowForm(true);}}>🎮 Create a Game</button>
                        </div>
                        :filtered.map(g=><GameCard key={g.id} game={g} myUid={user.uid}
                            onJoin={g=>setJoinTarget(g)} onLeave={leaveGame} onWaitlist={joinWaitlist}
                            onEdit={g=>{setEditGame(g);setShowForm(true);}} onCancel={cancelGame}
                            highlight={calHighlight===g.id}
                        />)
                    }
                </div>
            }

            <div style={{display:'flex',gap:8,marginTop:16}}>
                <a href="findplayer.html" style={{flex:1,display:'flex',alignItems:'center',gap:10,background:'linear-gradient(135deg,#0f766e,#14b8a6)',borderRadius:12,padding:'14px 16px',textDecoration:'none',boxShadow:'0 4px 12px rgba(15,118,110,.3)'}}>
                    <span style={{fontSize:22}}>👤</span>
                    <div><div className="fd" style={{fontSize:14,fontWeight:800,color:'white'}}>FIND PLAYERS</div><div style={{fontSize:10,color:'rgba(255,255,255,.7)'}}>Browse who's available</div></div>
                </a>
                <a href="index.html" style={{flex:1,display:'flex',alignItems:'center',gap:10,background:'linear-gradient(135deg,#1e40af,#3b82f6)',borderRadius:12,padding:'14px 16px',textDecoration:'none',boxShadow:'0 4px 12px rgba(30,64,175,.3)'}}>
                    <span style={{fontSize:22}}>🏟️</span>
                    <div><div className="fd" style={{fontSize:14,fontWeight:800,color:'white'}}>COURTS</div><div style={{fontSize:10,color:'rgba(255,255,255,.7)'}}>Find & book courts</div></div>
                </a>
            </div>
        </div>

        <button className="fab" onClick={()=>{setEditGame(null);setShowForm(true);}}>+</button>

        {showForm&&<GameForm user={user} profile={profile} editData={editGame}
            onClose={()=>{setShowForm(false);setEditGame(null);}}
            onSaved={()=>{setShowForm(false);setEditGame(null);showToast(editGame?'Game updated!':'🎮 Game created!');}}
        />}

        {joinTarget&&<JoinModal game={joinTarget} user={user} myProfile={profile}
            onConfirm={(guests)=>confirmJoin(joinTarget,guests)}
            onClose={()=>setJoinTarget(null)}
        />}

        <Toast msg={toast}/>
    </div>);
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
<script src="nav.js"></script>
</body>
</html>
