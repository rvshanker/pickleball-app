        // Initialize Firebase
        let db = null;
        let auth = null;
        let isFirebaseConfigured = false;

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            auth = firebase.auth();
            isFirebaseConfigured = true;
            console.log("✅ Firebase initialized successfully!");
            console.log("🔥 Real-time database is active");
        } catch (error) {
            console.log("Firebase initialization failed - using localStorage fallback:", error);
            isFirebaseConfigured = false;
        }

        // Storage helper with Firebase and localStorage fallback
        const storage = {
            async saveTournament(tournamentData) {
                if (isFirebaseConfigured && db) {
                    try {
                        await db.collection('tournaments').doc(tournamentData.id).set(tournamentData);
                        return true;
                    } catch (error) {
                        console.error("Firebase save failed:", error);
                    }
                }
                // Fallback to localStorage
                localStorage.setItem(`tournament:${tournamentData.id}`, JSON.stringify(tournamentData));
                return true;
            },
            
            async getTournament(id) {
                if (isFirebaseConfigured && db) {
                    try {
                        const doc = await db.collection('tournaments').doc(id).get();
                        if (doc.exists) {
                            return doc.data();
                        }
                    } catch (error) {
                        console.error("Firebase get failed:", error);
                    }
                }
                // Fallback to localStorage
                const data = localStorage.getItem(`tournament:${id}`);
                return data ? JSON.parse(data) : null;
            },
            
            async getAllTournaments(userId = null) {
                if (isFirebaseConfigured && db) {
                    try {
                        let query = db.collection('tournaments');
                        
                        // Get public tournaments OR private tournaments where user is a participant
                        const publicSnapshot = await query.where('isPublic', '==', true).get();
                        const publicTournaments = publicSnapshot.docs.map(doc => doc.data());
                        
                        if (userId) {
                            const privateSnapshot = await query
                                .where('isPublic', '==', false)
                                .where('participants', 'array-contains', userId)
                                .get();
                            const privateTournaments = privateSnapshot.docs.map(doc => doc.data());
                            return [...publicTournaments, ...privateTournaments];
                        }
                        
                        return publicTournaments;
                    } catch (error) {
                        console.error("Firebase getAllTournaments failed:", error);
                    }
                }
                
                // Fallback to localStorage
                const tournaments = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key.startsWith('tournament:')) {
                        const data = JSON.parse(localStorage.getItem(key));
                        // Filter based on public/private and user access
                        if (data.isPublic || (userId && data.participants?.includes(userId))) {
                            tournaments.push(data);
                        }
                    }
                }
                return tournaments;
            },
            
            async deleteTournament(id) {
                if (isFirebaseConfigured && db) {
                    try {
                        await db.collection('tournaments').doc(id).delete();
                        return true;
                    } catch (error) {
                        console.error("Firebase delete failed:", error);
                    }
                }
                // Fallback to localStorage
                localStorage.removeItem(`tournament:${id}`);
                return true;
            },
            
            async listenToTournament(id, callback) {
                if (isFirebaseConfigured && db) {
                    return db.collection('tournaments').doc(id).onSnapshot(doc => {
                        if (doc.exists) {
                            callback(doc.data());
                        }
                    });
                }
                // For localStorage, we'll poll
                const interval = setInterval(async () => {
                    const data = await storage.getTournament(id);
                    if (data) callback(data);
                }, 2000);
                return () => clearInterval(interval);
            }
        };

        function LoginModal({ setShowLogin }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isSignup, setIsSignup] = useState(false);
            const [error, setError] = useState('');

            const handleAuth = async (e) => {
                e.preventDefault();
                setError('');
                
                if (!isFirebaseConfigured) {
                    setError('Please configure Firebase first (see instructions below)');
                    return;
                }

                try {
                    if (isSignup) {
                        await auth.createUserWithEmailAndPassword(email, password);
                    } else {
                        await auth.signInWithEmailAndPassword(email, password);
                    }
                    setShowLogin(false);
                } catch (error) {
                    setError(error.message);
                }
            };

            return (

        // Simplified CourtsView, GamesView, ProfileView (keeping original implementations)
        function CourtsView({ setCurrentView }) {
            const mapRef = useRef(null);

            useEffect(() => {
                if (mapRef.current && !mapInstanceRef.current) {

                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap contributors'
                    }).addTo(map);
                    SAMPLE_COURTS.forEach(court => {
                        const marker = L.marker([court.lat, court.lng]).addTo(map);
                        marker.bindPopup(`<strong>${court.name}</strong><br/>${court.courts} courts`);
                        marker.on('click', () => setSelectedCourt(court));
                    });
                    mapInstanceRef.current = map;
                }
            }, []);

            const filteredCourts = SAMPLE_COURTS.filter(court =>
                court.name.toLowerCase().includes(searchTerm.toLowerCase())
            );

            return (
                <div className="bg-white rounded-xl shadow-lg p-6">
                    <h2 className="text-3xl font-bold text-gray-800 mb-4">Find Courts 📍</h2>
                    <input
                        type="text"
                        placeholder="Search courts..."
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                        className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none mb-6"
                    />
                    <div className="rounded-lg overflow-hidden shadow-lg mb-6" style={{ height: '400px' }}>
                        <div ref={mapRef} style={{ height: '100%', width: '100%' }}></div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {filteredCourts.map(court => (
                            <div key={court.id} className="bg-gray-50 border-2 border-gray-200 rounded-lg p-4">
                                <h4 className="font-bold text-lg mb-2">{court.name}</h4>
                                <p className="text-sm text-gray-600 mb-2">{court.address}</p>
                                <span className="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm font-medium">
                                    {court.courts} courts
                                </span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function GamesView({ games }) {
            return (
                <div className="bg-white rounded-xl shadow-lg p-6">
                    <h2 className="text-3xl font-bold text-gray-800 mb-6">Games & Events 🎮</h2>
                    <p className="text-gray-600">Game scheduling coming soon! For now, use Round Robin to create tournaments.</p>
                </div>
            );
        }

        function ProfileView({ currentUser, setCurrentUser }) {
            const [isEditing, setIsEditing] = useState(false);
            const [editForm, setEditForm] = useState(currentUser || {});

            const handleSave = () => {
                setCurrentUser(editForm);
                setIsEditing(false);
            };

            if (!currentUser) {
                return (
                    <div className="bg-white rounded-xl shadow-lg p-8 text-center">
                        <h2 className="text-2xl font-bold text-gray-800 mb-4">Please login to view your profile</h2>
                    </div>
                );
            }

            return (
                <div className="max-w-3xl mx-auto">
                    <div className="bg-white rounded-xl shadow-lg p-8">
                        <div className="flex items-center space-x-6 mb-8">
                            <div className="text-6xl bg-green-100 w-24 h-24 rounded-full flex items-center justify-center">
                                {currentUser.avatar}
                            </div>
                            <div className="flex-1">
                                <h2 className="text-3xl font-bold text-gray-800 mb-2">{currentUser.name}</h2>
                                <p className="text-gray-600">{currentUser.email}</p>
                                <p className="text-gray-600">{currentUser.skillLevel}</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ENHANCED Round Robin View with Firebase, Private/Public, and Winner Highlighting
        function RoundRobinView({ currentUser }) {
            const [players, setPlayers] = useState(['']);
            const [courts, setCourts] = useState(1);
            const [numRounds, setNumRounds] = useState(1);
            const [schedule, setSchedule] = useState([]);
            const [scores, setScores] = useState({});
            const [tournamentId, setTournamentId] = useState(null);
            const [savedTournaments, setSavedTournaments] = useState([]);
            const [showLeaderboard, setShowLeaderboard] = useState(false);
            const [saveStatus, setSaveStatus] = useState('');
            const [isPublic, setIsPublic] = useState(false);
            const [tournamentName, setTournamentName] = useState('');

            useEffect(() => {
                loadTournaments();
            }, [currentUser]);

            useEffect(() => {
                if (tournamentId && schedule.length > 0) {
                    saveTournament();
                }
            }, [scores, schedule, tournamentId]);

            // Real-time listener for current tournament
            useEffect(() => {
                if (tournamentId && isFirebaseConfigured) {
                    const unsubscribe = storage.listenToTournament(tournamentId, (data) => {
                        if (data && data.scores) {
                            setScores(data.scores);
                        }
                    });
                    return unsubscribe;
                }
            }, [tournamentId]);

            const loadTournaments = async () => {
                try {
                    const tournaments = await storage.getAllTournaments(currentUser?.uid);
                    console.log('Loaded tournaments:', tournaments);
                    setSavedTournaments(tournaments.sort((a, b) => b.createdAt - a.createdAt));
                } catch (error) {
                    console.error('Error loading tournaments:', error);
                }
            };

            const saveTournament = async () => {
                if (!tournamentId || !currentUser) return;
                
                // Convert schedule to completely flat structure for Firestore
                const firestoreSchedule = [];
                schedule.forEach((round, roundIndex) => {
                    round.forEach((match, matchIndex) => {
                        firestoreSchedule.push({
                            roundIndex: roundIndex,
                            matchIndex: matchIndex,
                            id: match.id,
                            court: match.court,
                            team1: match.team1[0], // Convert array to string
                            team2: match.team2[0]  // Convert array to string
                        });
                    });
                });
                
                const tournamentData = {
                    id: tournamentId,
                    name: tournamentName || `Tournament ${new Date().toLocaleDateString()}`,
                    players: players.filter(p => p.trim() !== ''),
                    courts,
                    numRounds,
                    scheduleFlat: firestoreSchedule, // Use flat structure
                    scores: scores || {},
                    isPublic,
                    participants: [currentUser.uid, ...players.filter(p => p.trim() !== '').map(p => `player-${p}`)],
                    createdBy: currentUser.uid,
                    createdAt: Date.now()
                };

                try {
                    setSaveStatus('Saving...');
                    console.log('Saving tournament:', tournamentData);
                    await storage.saveTournament(tournamentData);
                    setSaveStatus('✓ Saved');
                    setTimeout(() => setSaveStatus(''), 2000);
                    await loadTournaments();
                } catch (error) {
                    console.error('Failed to save tournament:', error);
                    console.error('Error details:', error.message);
                    setSaveStatus('✗ Save failed: ' + error.message);
                    setTimeout(() => setSaveStatus(''), 3000);
                }
            };

            const loadTournament = async (id) => {
                try {
                    const data = await storage.getTournament(id);
                    if (data) {
                        console.log('Loading tournament:', data);
                        
                        // Rebuild nested schedule structure from flat data
                        let appSchedule = [];
                        
                        // Check if we have the new flat format or old nested format
                        if (data.scheduleFlat) {
                            // New flat format - rebuild the nested structure
                            const roundsMap = {};
                            data.scheduleFlat.forEach(match => {
                                if (!roundsMap[match.roundIndex]) {
                                    roundsMap[match.roundIndex] = [];
                                }
                                roundsMap[match.roundIndex].push({
                                    id: match.id,
                                    court: match.court,
                                    team1: [match.team1], // Convert string back to array
                                    team2: [match.team2]  // Convert string back to array
                                });
                            });
                            
                            // Convert map to array
                            appSchedule = Object.keys(roundsMap)
                                .sort((a, b) => parseInt(a) - parseInt(b))
                                .map(key => roundsMap[key]);
                        } else if (data.schedule) {
                            // Old format - convert if needed
                            appSchedule = data.schedule.map(round =>
                                round.map(match => ({
                                    id: match.id,
                                    court: match.court,
                                    team1: Array.isArray(match.team1) ? match.team1 : [match.team1],
                                    team2: Array.isArray(match.team2) ? match.team2 : [match.team2]
                                }))
                            );
                        }
                        
                        setTournamentName(data.name || '');
                        setPlayers(data.players);
                        setCourts(data.courts);
                        setNumRounds(data.numRounds);
                        setSchedule(appSchedule);
                        setScores(data.scores || {});
                        setIsPublic(data.isPublic || false);
                        setTournamentId(data.id);
                        setShowLeaderboard(true);
                    }
                } catch (error) {
                    console.error('Tournament not found:', error);
                    alert('Error loading tournament: ' + error.message);
                }
            };

            const deleteTournament = async (id) => {
                if (!confirm('Are you sure you want to delete this tournament?')) return;
                
                try {
                    await storage.deleteTournament(id);
                    await loadTournaments();
                    if (tournamentId === id) {
                        resetTournament();
                    }
                } catch (error) {
                    console.error('Failed to delete tournament:', error);
                }
            };

            const resetTournament = () => {
                setTournamentName('');
                setPlayers(['']);
                setCourts(1);
                setNumRounds(1);
                setSchedule([]);
                setScores({});
                setTournamentId(null);
                setShowLeaderboard(false);
                setIsPublic(false);
            };

            const addPlayer = () => setPlayers([...players, '']);
            const updatePlayer = (index, value) => {
                const newPlayers = [...players];
                newPlayers[index] = value;
                setPlayers(newPlayers);
            };
            const removePlayer = (index) => setPlayers(players.filter((_, i) => i !== index));

            const generateSchedule = () => {
                const validPlayers = players.filter(p => p.trim() !== '');
                if (validPlayers.length < 2) {
                    alert('Need at least 2 players for round robin');
                    return;
                }

                const allRounds = [];
                const playerList = [...validPlayers];
                
                if (playerList.length % 2 !== 0) {
                    playerList.push('BYE');
                }

                const maxPossibleRounds = playerList.length - 1;
                const actualRounds = Math.min(numRounds, maxPossibleRounds);
                const half = playerList.length / 2;

                for (let round = 0; round < actualRounds; round++) {
                    const roundMatches = [];
                    for (let i = 0; i < half; i++) {
                        const player1 = playerList[i];
                        const player2 = playerList[playerList.length - 1 - i];
                        
                        if (player1 !== 'BYE' && player2 !== 'BYE') {
                            const matchId = `r${round}-m${i}`;
                            roundMatches.push({
                                id: matchId,
                                court: (i % courts) + 1,
                                team1: [player1],
                                team2: [player2]
                            });
                        }
                    }
                    allRounds.push(roundMatches);
                    playerList.splice(1, 0, playerList.pop());
                }

                setSchedule(allRounds);
                setScores({});
                const newTournamentId = `tournament-${Date.now()}`;
                setTournamentId(newTournamentId);
                setShowLeaderboard(false);
            };

            const updateScore = (matchId, team, score) => {
                setScores(prev => ({
                    ...prev,
                    [matchId]: {
                        ...prev[matchId],
                        [team]: parseInt(score) || 0
                    }
                }));
            };

            const calculateLeaderboard = () => {
                const validPlayers = players.filter(p => p.trim() !== '');
                const playerStats = {};

                validPlayers.forEach(player => {
                    playerStats[player] = {
                        name: player,
                        wins: 0,
                        losses: 0,
                        pointsFor: 0,
                        pointsAgainst: 0,
                        matchesPlayed: 0
                    };
                });

                schedule.forEach(round => {
                    round.forEach(match => {
                        const matchScore = scores[match.id];
                        if (matchScore && matchScore.team1 !== undefined && matchScore.team2 !== undefined) {
                            const team1Player = match.team1[0];
                            const team2Player = match.team2[0];
                            const team1Score = matchScore.team1;
                            const team2Score = matchScore.team2;

                            playerStats[team1Player].matchesPlayed++;
                            playerStats[team2Player].matchesPlayed++;
                            playerStats[team1Player].pointsFor += team1Score;
                            playerStats[team1Player].pointsAgainst += team2Score;
                            playerStats[team2Player].pointsFor += team2Score;
                            playerStats[team2Player].pointsAgainst += team1Score;

                            if (team1Score > team2Score) {
                                playerStats[team1Player].wins++;
                                playerStats[team2Player].losses++;
                            } else if (team2Score > team1Score) {
                                playerStats[team2Player].wins++;
                                playerStats[team1Player].losses++;
                            }
                        }
                    });
                });

                return Object.values(playerStats).sort((a, b) => {
                    if (b.wins !== a.wins) return b.wins - a.wins;
                    return (b.pointsFor - b.pointsAgainst) - (a.pointsFor - a.pointsAgainst);
                });
            };

            const getRoundWinner = (roundMatches) => {
                const roundScores = {};
                roundMatches.forEach(match => {
                    const matchScore = scores[match.id];
                    if (matchScore) {
                        const p1 = match.team1[0];
                        const p2 = match.team2[0];
                        roundScores[p1] = (roundScores[p1] || 0) + (matchScore.team1 || 0);
                        roundScores[p2] = (roundScores[p2] || 0) + (matchScore.team2 || 0);
                    }
                });
                
                let maxScore = -1;
                let winner = null;
                Object.entries(roundScores).forEach(([player, score]) => {
                    if (score > maxScore) {
                        maxScore = score;
                        winner = player;
                    }
                });
                return winner;
            };

            const leaderboard = schedule.length > 0 ? calculateLeaderboard() : [];

            if (!currentUser) {
                return (
                    <div className="bg-white rounded-xl shadow-lg p-8 text-center">
                        <h2 className="text-2xl font-bold text-gray-800 mb-4">Please login to create tournaments</h2>
                        <p className="text-gray-600">Login to create and manage your pickleball tournaments!</p>
                    </div>
                );
            }

            return (
                <div className="max-w-6xl mx-auto">
                    <div className="bg-white rounded-xl shadow-lg p-8">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-3xl font-bold text-gray-800">Round Robin Tournament 🔄</h2>
                            <div className="flex items-center space-x-4">
                                {saveStatus && (
                                    <span className={`px-4 py-2 rounded-lg font-medium ${
                                        saveStatus.includes('✓') ? 'bg-green-100 text-green-700' : 
                                        saveStatus.includes('✗') ? 'bg-red-100 text-red-700' : 
                                        'bg-blue-100 text-blue-700'
                                    }`}>
                                        {saveStatus}
                                    </span>
                                )}
                                {schedule.length > 0 && (
                                    <button 
                                        onClick={resetTournament}
                                        className="bg-gray-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-gray-700 transition-all"
                                    >
                                        New Tournament
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* Saved Tournaments */}
                        {savedTournaments.length > 0 && schedule.length === 0 && (
                            <div className="mb-8">
                                <h3 className="text-xl font-bold text-gray-800 mb-4">Your Tournaments</h3>
                                <div className="space-y-3">
                                    {savedTournaments.map(tournament => (
                                        <div key={tournament.id} className="bg-gray-50 border-2 border-gray-200 rounded-lg p-4 flex items-center justify-between">
                                            <div>
                                                <div className="flex items-center space-x-2">
                                                    <p className="font-medium text-gray-800">{tournament.name}</p>
                                                    {tournament.isPublic ? (
                                                        <span className="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs font-medium">🌍 Public</span>
                                                    ) : (
                                                        <span className="bg-purple-100 text-purple-700 px-2 py-1 rounded text-xs font-medium">🔒 Private</span>
                                                    )}
                                                </div>
                                                <p className="text-sm text-gray-600">
                                                    {tournament.players.length} players, {tournament.numRounds} rounds
                                                </p>
                                                <p className="text-xs text-gray-500">
                                                    {new Date(tournament.createdAt).toLocaleDateString()}
                                                </p>
                                            </div>
                                            <div className="flex space-x-2">
                                                <button 
                                                    onClick={() => loadTournament(tournament.id)}
                                                    className="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition-all"
                                                >
                                                    Load
                                                </button>
                                                <button 
                                                    onClick={() => deleteTournament(tournament.id)}
                                                    className="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition-all"
                                                >
                                                    Delete
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {schedule.length === 0 && (
                            <>
                                <div className="mb-6">
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Tournament Name</label>
                                    <input
                                        type="text"
                                        value={tournamentName}
                                        onChange={(e) => setTournamentName(e.target.value)}
                                        placeholder="e.g., Weekend Championship"
                                        className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none"
                                    />
                                </div>

                                <div className="mb-6">
                                    <label className="flex items-center space-x-3 cursor-pointer">
                                        <input
                                            type="checkbox"
                                            checked={isPublic}
                                            onChange={(e) => setIsPublic(e.target.checked)}
                                            className="w-5 h-5 text-green-600"
                                        />
                                        <div>
                                            <span className="font-medium text-gray-800">
                                                {isPublic ? '🌍 Public Tournament' : '🔒 Private Tournament'}
                                            </span>
                                            <p className="text-sm text-gray-600">
                                                {isPublic 
                                                    ? 'Anyone can view scores and leaderboard' 
                                                    : 'Only participants can see this tournament'}
                                            </p>
                                        </div>
                                    </label>
                                </div>

                                <div className="mb-8">
                                    <h3 className="text-xl font-bold text-gray-800 mb-4">Add Players</h3>
                                    <div className="space-y-3 mb-4">
                                        {players.map((player, index) => (
                                            <div key={index} className="flex space-x-3">
                                                <input 
                                                    type="text"
                                                    value={player}
                                                    onChange={(e) => updatePlayer(index, e.target.value)}
                                                    placeholder={`Player ${index + 1} name`}
                                                    className="flex-1 px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none"
                                                />
                                                {players.length > 1 && (
                                                    <button 
                                                        onClick={() => removePlayer(index)}
                                                        className="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-all"
                                                    >
                                                        Remove
                                                    </button>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                    <button 
                                        onClick={addPlayer}
                                        className="bg-blue-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700 transition-all"
                                    >
                                        + Add Player
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">Number of Courts</label>
                                        <select 
                                            value={courts}
                                            onChange={(e) => setCourts(parseInt(e.target.value))}
                                            className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none"
                                        >
                                            {[1, 2, 3, 4, 5, 6].map(n => (
                                                <option key={n} value={n}>{n} Court{n > 1 ? 's' : ''}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">Number of Rounds</label>
                                        <input 
                                            type="number"
                                            min="1"
                                            value={numRounds}
                                            onChange={(e) => setNumRounds(parseInt(e.target.value) || 1)}
                                            className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none"
                                        />
                                    </div>
                                </div>

                                <button 
                                    onClick={generateSchedule}
                                    className="w-full bg-green-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-green-700 transition-all shadow-lg"
                                >
                                    Generate Tournament Schedule
                                </button>
                            </>
                        )}

                        {schedule.length > 0 && (
                            <>
                                <div className="mb-6 bg-gray-50 p-4 rounded-lg">
                                    <div className="flex items-center justify-between">
                                        <div>
                                            <h3 className="text-xl font-bold text-gray-800">{tournamentName || 'Tournament'}</h3>
                                            <p className="text-gray-600">
                                                {isPublic ? '🌍 Public Tournament' : '🔒 Private Tournament'}
                                            </p>
                                        </div>
                                        <button 
                                            onClick={() => setShowLeaderboard(!showLeaderboard)}
                                            className="bg-purple-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-purple-700 transition-all shadow-lg"
                                        >
                                            {showLeaderboard ? 'Hide Leaderboard' : 'Show Leaderboard'}
                                        </button>
                                    </div>
                                </div>

                                {showLeaderboard && (
                                    <div className="mb-8 bg-gradient-to-r from-yellow-50 to-orange-50 border-2 border-yellow-300 rounded-xl p-6">
                                        <h3 className="text-2xl font-bold text-gray-800 mb-4 flex items-center">
                                            🏆 Overall Leaderboard
                                        </h3>
                                        <div className="space-y-2">
                                            {leaderboard.map((player, index) => (
                                                <div 
                                                    key={player.name} 
                                                    className={`bg-white rounded-lg p-4 flex items-center justify-between ${
                                                        index === 0 ? 'border-4 border-yellow-400 shadow-lg' : 'border-2 border-gray-200'
                                                    }`}
                                                >
                                                    <div className="flex items-center space-x-4">
                                                        <span className={`text-2xl font-bold ${
                                                            index === 0 ? 'text-yellow-500' :
                                                            index === 1 ? 'text-gray-400' :
                                                            index === 2 ? 'text-orange-600' :
                                                            'text-gray-600'
                                                        }`}>
                                                            {index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `#${index + 1}`}
                                                        </span>
                                                        <span className={`font-bold ${index === 0 ? 'text-xl' : 'text-lg'}`}>
                                                            {player.name}
                                                        </span>
                                                    </div>
                                                    <div className="flex items-center space-x-6 text-sm">
                                                        <div className="text-center">
                                                            <div className="text-gray-500">Record</div>
                                                            <div className="font-bold text-gray-800">{player.wins}-{player.losses}</div>
                                                        </div>
                                                        <div className="text-center">
                                                            <div className="text-gray-500">Points</div>
                                                            <div className="font-bold text-green-600">{player.pointsFor}</div>
                                                        </div>
                                                        <div className="text-center">
                                                            <div className="text-gray-500">Differential</div>
                                                            <div className={`font-bold ${
                                                                (player.pointsFor - player.pointsAgainst) > 0 ? 'text-green-600' : 'text-red-600'
                                                            }`}>
                                                                {player.pointsFor - player.pointsAgainst > 0 ? '+' : ''}
                                                                {player.pointsFor - player.pointsAgainst}
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="space-y-6">
                                    <h3 className="text-2xl font-bold text-gray-800">Rounds & Scores</h3>
                                    {schedule.map((round, roundIndex) => {
                                        const roundWinner = getRoundWinner(round);
                                        return (
                                            <div key={roundIndex} className="bg-green-50 border-2 border-green-200 rounded-lg p-6">
                                                <div className="flex items-center justify-between mb-4">
                                                    <h4 className="text-xl font-bold text-gray-800">Round {roundIndex + 1}</h4>
                                                    {roundWinner && (
                                                        <span className="bg-yellow-400 text-gray-800 px-4 py-2 rounded-full font-bold flex items-center space-x-2">
                                                            <span>🏆</span>
                                                            <span>Round Winner: {roundWinner}</span>
                                                        </span>
                                                    )}
                                                </div>
                                                <div className="space-y-3">
                                                    {round.map((match) => {
                                                        const matchScore = scores[match.id];
                                                        const hasScore = matchScore && matchScore.team1 !== undefined && matchScore.team2 !== undefined;
                                                        const winner = hasScore ? (matchScore.team1 > matchScore.team2 ? match.team1[0] : matchScore.team2 > matchScore.team1 ? match.team2[0] : null) : null;
                                                        
                                                        return (
                                                            <div key={match.id} className="bg-white rounded-lg p-4">
                                                                <div className="flex items-center justify-between mb-3">
                                                                    <span className="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm font-medium">
                                                                        Court {match.court}
                                                                    </span>
                                                                    {winner && (
                                                                        <span className="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm font-medium">
                                                                            ✓ Winner: {winner}
                                                                        </span>
                                                                    )}
                                                                </div>
                                                                <div className="grid grid-cols-3 gap-4 items-center">
                                                                    <div className="text-right">
                                                                        <span className={`font-medium text-lg ${winner === match.team1[0] ? 'text-green-600 font-bold' : ''}`}>
                                                                            {match.team1.join(', ')}
                                                                            {winner === match.team1[0] && ' 🏆'}
                                                                        </span>
                                                                    </div>
                                                                    <div className="flex items-center justify-center space-x-3">
                                                                        <input 
                                                                            type="number"
                                                                            min="0"
                                                                            value={scores[match.id]?.team1 || ''}
                                                                            onChange={(e) => updateScore(match.id, 'team1', e.target.value)}
                                                                            placeholder="0"
                                                                            className="w-16 px-3 py-2 border-2 border-gray-300 rounded-lg text-center font-bold text-lg focus:border-green-500 focus:outline-none"
                                                                        />
                                                                        <span className="text-gray-400 font-bold">-</span>
                                                                        <input 
                                                                            type="number"
                                                                            min="0"
                                                                            value={scores[match.id]?.team2 || ''}
                                                                            onChange={(e) => updateScore(match.id, 'team2', e.target.value)}
                                                                            placeholder="0"
                                                                            className="w-16 px-3 py-2 border-2 border-gray-300 rounded-lg text-center font-bold text-lg focus:border-green-500 focus:outline-none"
                                                                        />
                                                                    </div>
                                                                    <div className="text-left">
                                                                        <span className={`font-medium text-lg ${winner === match.team2[0] ? 'text-green-600 font-bold' : ''}`}>
                                                                            {winner === match.team2[0] && '🏆 '}
                                                                            {match.team2.join(', ')}
                                                                        </span>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
