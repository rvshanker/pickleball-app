<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pickle-Balancer PRO - Smart Engine</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 p-6">
<div class="max-w-6xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100">

    <div class="bg-slate-900 p-8 text-white">
        <h1 class="text-3xl font-black italic tracking-tight">
            PICKLE-BALANCER <span class="text-green-400">SMART</span>
        </h1>
        <p class="text-slate-400 text-sm mt-1">
            True Swish-Style Intelligent Scheduling Engine
        </p>
    </div>

    <div class="p-8">

        <!-- INPUTS -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div>
                <label class="text-xs font-black text-gray-400 uppercase">Total Players</label>
                <input type="number" id="players" value="17"
                    class="w-full bg-gray-100 rounded-2xl p-4 font-bold">
            </div>
            <div>
                <label class="text-xs font-black text-gray-400 uppercase">Courts</label>
                <input type="number" id="courts" value="3"
                    class="w-full bg-gray-100 rounded-2xl p-4 font-bold">
            </div>
            <div>
                <label class="text-xs font-black text-gray-400 uppercase">Rounds</label>
                <input type="number" id="rounds" value="10"
                    class="w-full bg-gray-100 rounded-2xl p-4 font-bold">
            </div>
        </div>

        <button onclick="generate()"
            class="w-full bg-green-500 hover:bg-green-600 text-white font-black py-5 rounded-2xl shadow-lg uppercase tracking-widest">
            Generate Smart Schedule
        </button>

        <!-- BALANCE STATS -->
        <div id="statsContainer" class="hidden mt-12">
            <h2 class="text-sm font-black text-gray-400 uppercase mb-4">
                Balance Verification
            </h2>
            <div id="statsList" class="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-8 gap-3"></div>
        </div>

        <!-- ROUNDS OUTPUT -->
        <div id="output" class="mt-12 space-y-12"></div>

    </div>
</div>

<script>
function generate() {

    const P = parseInt(document.getElementById('players').value);
    const C = parseInt(document.getElementById('courts').value);
    const R = parseInt(document.getElementById('rounds').value);

    if (P < 4) {
        alert("Minimum 4 players required.");
        return;
    }

    const players = [];
    const stats = {};

    for (let i = 1; i <= P; i++) {
        const id = `P${i}`;
        players.push(id);
        stats[id] = {
            games: 0,
            partners: {},
            opponents: {}
        };
    }

    let html = "";
    let statsHtml = "";

    for (let round = 1; round <= R; round++) {

        // Sort by least games played
        players.sort((a,b) => stats[a].games - stats[b].games);

        const playingCount = Math.min(C * 4, players.length);
        let playing = players.slice(0, playingCount);
        const sitting = players.slice(playingCount);

        let matches = [];

        while (playing.length >= 4) {

            let bestScore = Infinity;
            let bestMatch = null;

            for (let a = 0; a < playing.length; a++) {
                for (let b = a+1; b < playing.length; b++) {
                    for (let c = b+1; c < playing.length; c++) {
                        for (let d = c+1; d < playing.length; d++) {

                            const p1 = playing[a];
                            const p2 = playing[b];
                            const p3 = playing[c];
                            const p4 = playing[d];

                            const score =
                                (stats[p1].partners[p2] || 0) +
                                (stats[p3].partners[p4] || 0) +
                                (stats[p1].opponents[p3] || 0) +
                                (stats[p1].opponents[p4] || 0) +
                                (stats[p2].opponents[p3] || 0) +
                                (stats[p2].opponents[p4] || 0);

                            if (score < bestScore) {
                                bestScore = score;
                                bestMatch = { team1:[p1,p2], team2:[p3,p4] };
                            }
                        }
                    }
                }
            }

            if (!bestMatch) break;

            matches.push(bestMatch);

            playing = playing.filter(p =>
                !bestMatch.team1.includes(p) &&
                !bestMatch.team2.includes(p)
            );
        }

        // Update stats
        matches.forEach(m => {

            const all = [...m.team1, ...m.team2];
            all.forEach(p => stats[p].games++);

            // partners
            stats[m.team1[0]].partners[m.team1[1]] =
                (stats[m.team1[0]].partners[m.team1[1]] || 0) + 1;
            stats[m.team1[1]].partners[m.team1[0]] =
                (stats[m.team1[1]].partners[m.team1[0]] || 0) + 1;

            stats[m.team2[0]].partners[m.team2[1]] =
                (stats[m.team2[0]].partners[m.team2[1]] || 0) + 1;
            stats[m.team2[1]].partners[m.team2[0]] =
                (stats[m.team2[1]].partners[m.team2[0]] || 0) + 1;

            // opponents
            m.team1.forEach(p1 => {
                m.team2.forEach(p2 => {
                    stats[p1].opponents[p2] =
                        (stats[p1].opponents[p2] || 0) + 1;
                    stats[p2].opponents[p1] =
                        (stats[p2].opponents[p1] || 0) + 1;
                });
            });

        });

        // Render round
        html += `
        <div class="border-l-4 border-green-500 pl-6">
            <div class="flex justify-between mb-4">
                <h3 class="text-xl font-black uppercase">Round ${round}</h3>
                <div class="flex flex-wrap gap-2">
                    ${sitting.map(p =>
                        `<span class="bg-red-50 text-red-500 text-xs px-2 py-1 rounded">Bye: ${p}</span>`
                    ).join('')}
                </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                ${matches.map((m,i)=>`
                    <div class="bg-gray-50 p-4 rounded-2xl border text-center">
                        <div class="text-xs text-gray-400 mb-2">Court ${i+1}</div>
                        <div class="text-blue-600 font-bold">${m.team1[0]} & ${m.team1[1]}</div>
                        <div class="text-xs text-gray-400 my-1">VS</div>
                        <div class="text-red-600 font-bold">${m.team2[0]} & ${m.team2[1]}</div>
                    </div>
                `).join('')}
            </div>
        </div>`;
    }

    // Render stats
    for (let p in stats) {
        statsHtml += `
        <div class="bg-white border p-3 rounded-2xl text-center shadow-sm">
            <div class="text-xs text-gray-400">${p}</div>
            <div class="text-xl font-bold text-green-600">${stats[p].games}</div>
        </div>`;
    }

    document.getElementById('statsContainer').classList.remove('hidden');
    document.getElementById('statsList').innerHTML = statsHtml;
    document.getElementById('output').innerHTML = html;
}
</script>

</body>
</html>
