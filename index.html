<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PickleConnect - Smart Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* UI refinement: remove number input spinners for the clean look */
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
            -webkit-appearance: none; margin: 0;
        }
        input[type=number] { -moz-appearance: textfield; }
        
        .player-chip { transition: all 0.2s; }
        .player-chip:hover { transform: scale(1.05); }
    </style>
</head>
<body class="bg-gray-50 p-6">

<div class="max-w-6xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100">

    <div class="bg-slate-900 p-8 text-white">
        <h1 class="text-3xl font-black italic tracking-tight uppercase">
            PickleConnect <span class="text-green-400">Smart Engine</span>
        </h1>
        <p class="text-slate-400 text-sm mt-1 uppercase tracking-widest font-bold">
            Balanced Round-Robin Generator
        </p>
    </div>

    <div class="p-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-10">
            <div class="space-y-3">
                <label class="text-xs font-black text-gray-400 uppercase tracking-widest">Add Players</label>
                <div class="flex gap-2">
                    <input type="text" id="playerNameInput" placeholder="Enter name..." 
                        class="flex-1 bg-gray-100 rounded-2xl p-4 font-bold outline-none focus:ring-2 focus:ring-green-400 transition-all">
                    <button onclick="addPlayer()" class="bg-slate-800 text-white px-6 rounded-2xl font-black">+</button>
                </div>
                <div id="playerChips" class="flex flex-wrap gap-2 mt-4">
                    </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label class="text-xs font-black text-gray-400 uppercase">Courts</label>
                    <input type="number" id="courts" value="3" class="w-full bg-gray-100 rounded-2xl p-4 font-bold outline-none">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-black text-gray-400 uppercase">Rounds</label>
                    <input type="number" id="rounds" value="10" class="w-full bg-gray-100 rounded-2xl p-4 font-bold outline-none">
                </div>
                <div class="col-span-2 space-y-2">
                    <label class="text-xs font-black text-gray-400 uppercase">Match Format</label>
                    <select id="matchType" class="w-full bg-gray-100 rounded-2xl p-4 font-bold outline-none appearance-none">
                        <option value="doubles">Doubles (2v2)</option>
                        <option value="singles">Singles (1v1)</option>
                    </select>
                </div>
            </div>
        </div>

        <button onclick="generateMatches()" 
            class="w-full bg-green-500 hover:bg-green-600 text-white font-black py-5 rounded-2xl transition-all shadow-lg shadow-green-100 uppercase tracking-widest">
            Generate Balanced Schedule
        </button>

        <div id="statsSection" class="hidden mt-12 pt-8 border-t border-gray-100">
            <h2 class="text-[10px] font-black text-gray-400 uppercase mb-4 text-center tracking-[0.2em]">Total Games Scheduled</h2>
            <div id="statsList" class="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-8 gap-3"></div>
        </div>

        <div id="output" class="mt-12 space-y-10"></div>
    </div>
</div>

<script>
let playerList = ["John", "Mike", "Sarah", "Emma", "David", "Chris", "Anna", "Tom", "Ben", "Lisa", "Jake", "Katy", "Ryan", "Mia", "Leo"];

function updateChips() {
    const container = document.getElementById('playerChips');
    container.innerHTML = playerList.map((name, index) => `
        <span class="player-chip bg-blue-50 text-blue-600 px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2">
            ${name}
            <button onclick="removePlayer(${index})" class="text-blue-300 hover:text-red-500">×</button>
        </span>
    `).join('');
}

function addPlayer() {
    const input = document.getElementById('playerNameInput');
    if (input.value.trim()) {
        playerList.push(input.value.trim());
        input.value = '';
        updateChips();
    }
}

function removePlayer(index) {
    playerList.splice(index, 1);
    updateChips();
}

function generateMatches() {
    if (playerList.length < 2) return alert("Add at least 2 players");

    const C = parseInt(document.getElementById("courts").value);
    const R = parseInt(document.getElementById("rounds").value);
    const type = document.getElementById("matchType").value;
    const perMatch = (type === "doubles") ? 4 : 2;

    let stats = {};
    playerList.forEach(p => stats[p] = 0);

    let html = "";
    let queue = [...playerList]; // Queue-based logic from Gemini.html logic requirements

    for (let round = 1; round <= R; round++) {
        const capacity = C * perMatch;
        const playing = queue.slice(0, capacity);
        const bench = queue.slice(capacity);

        let roundHtml = `
            <div class="animate-in fade-in slide-in-from-bottom-4 duration-500">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-2xl font-black italic uppercase italic">Round ${round}</h3>
                    <div class="flex flex-wrap gap-2">
                        ${bench.map(p => `<span class="bg-red-50 text-red-500 text-[10px] font-black px-2 py-1 rounded uppercase">Bench: ${p}</span>`).join('')}
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        `;

        // Match assignment logic
        for (let i = 0; i < playing.length; i += perMatch) {
            if (i + (perMatch - 1) < playing.length) {
                const team1 = (type === "doubles") ? [playing[i], playing[i+1]] : [playing[i]];
                const team2 = (type === "doubles") ? [playing[i+2], playing[i+3]] : [playing[i+1]];
                
                [...team1, ...team2].forEach(p => stats[p]++);

                roundHtml += `
                    <div class="bg-gray-50 p-5 rounded-3xl border border-gray-100 flex flex-col items-center">
                        <span class="text-[9px] font-black text-gray-300 uppercase mb-3">Court ${Math.floor(i/perMatch) + 1}</span>
                        <div class="flex flex-col items-center gap-1">
                            <div class="text-blue-600 font-bold text-lg">${team1.join(' & ')}</div>
                            <div class="text-[10px] font-black text-gray-300 my-1 italic">VS</div>
                            <div class="text-red-600 font-bold text-lg">${team2.join(' & ')}</div>
                        </div>
                        <div class="mt-4 flex gap-2">
                            <div class="w-10 h-8 bg-white border border-gray-200 rounded-lg"></div>
                            <div class="w-10 h-8 bg-white border border-gray-200 rounded-lg"></div>
                        </div>
                    </div>
                `;
            }
        }

        roundHtml += `</div></div>`;
        html += roundHtml;

        // ROTATION: Move the people who just played to the back of the line
        queue = [...bench, ...playing];
    }

    // Render Stats verification
    let statsHtml = "";
    for (let p in stats) {
        statsHtml += `
            <div class="bg-white border border-gray-100 p-3 rounded-2xl text-center shadow-sm">
                <div class="text-[10px] font-black text-gray-400 mb-1">${p}</div>
                <div class="text-xl font-black text-green-600">${stats[p]}</div>
            </div>`;
    }

    document.getElementById("statsSection").classList.remove('hidden');
    document.getElementById("statsList").innerHTML = statsHtml;
    document.getElementById("output").innerHTML = html;
}

// Initialize chips
updateChips();
</script>

</body>
</html>
