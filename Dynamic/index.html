      {showForm&&user&&profile&&<CreateGameForm profile={profile} editGame={editGame} uLat={uLat} uLng={uLng} onClose={()=>{setShowForm(false);setEditGame(null);}} onCreated={()=>{setShowForm(false);setEditGame(null);}}/>}
      {showInviteFor&&user&&profile&&<InviteStep game={showInviteFor} profile={profile} uLat={uLat} uLng={uLng} onInvitesSent={()=>{setShowInviteFor(null);showToast('Invites sent!');}} onSkip={()=>setShowInviteFor(null)}/>}
      {toast&&<div className="g-toast">{toast}</div>}
    </div>
  );
}

/* ── CreateGameForm ── */
function CreateGameForm({profile,onClose,onCreated,uLat,uLng,editGame}){
  const[title,setTitle]=useState(editGame?.title||'');
  const[date,setDate]=useState(editGame?.date||'');
  const[time,setTime]=useState(editGame?.time||'');
  const[timeEnd,setTimeEnd]=useState(editGame?.timeEnd||'');
  const[court,setCourt]=useState(editGame?.court||'');
  const[playType,setPT]=useState(editGame?.playType||'Casual');
  const[skillMin,setSkMin]=useState(editGame?.skillMin||'Any');
  const[skillMax,setSkMax]=useState(editGame?.skillMax||'Any');
  const[totalSlots,setSlots]=useState(editGame?.totalSlots||4);
  const[notes,setNotes]=useState(editGame?.notes||'');
  const[isPrivate,setPrivate]=useState(editGame?.isPrivate||false);
  const[radiusMi,setRadius]=useState(editGame?.radiusMi||'25');
  const[saving,setSaving]=useState(false);
  const[showInvite,setShowInvite]=useState(false);
  const[createdGame,setCreatedGame]=useState(null);
  const today=new Date().toISOString().split('T')[0];

  const save=async()=>{
    if(!date){alert('Select a date.');return;}
    if(!time){alert('Set a start time.');return;}
    if(!court.trim()){alert('Enter court name.');return;}
    setSaving(true);
    const data={organizerUid:profile.uid,organizerName:profile.name,organizerSkill:profile.skill||'',
      organizerPhoto:profile.photoURL||null,title:title.trim()||`${playType} Game`,
      date,time,timeEnd:timeEnd||null,court:court.trim(),playType,skillMin,skillMax,
      totalSlots,notes:notes.trim()||null,isPrivate,radiusMi:parseInt(radiusMi)||25,
      lat:uLat||null,lng:uLng||null,status:'active',timestamp:Date.now()};
    try{
      if(editGame?.id){
        await db.collection('games').doc(editGame.id).update(data);
        onCreated();
      }else{
        data.players=[{uid:profile.uid,name:profile.name,skill:profile.skill||'',photoURL:profile.photoURL||null,status:'accepted',isOrganizer:true}];
        data.createdAt=Date.now();
        const r=await db.collection('games').add(data);
        setCreatedGame({...data,id:r.id});
        setShowInvite(true);
      }
    }catch(e){alert('Failed: '+e.message);}
    setSaving(false);
  };

  if(showInvite&&createdGame){
    return(<InviteStep game={createdGame} profile={profile} uLat={uLat} uLng={uLng} onInvitesSent={()=>{setShowInvite(false);onCreated();}} onSkip={()=>{setShowInvite(false);onCreated();}}/>);
  }

  return(
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal-sheet">
        <div className="modal-handle"/>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
          <div className="modal-title">🎮 {editGame?'Edit Game':'Create Game'}</div>
          <button onClick={onClose} className="icon-btn" style={{position:'static'}}>✕</button>
        </div>

        <div className="fg"><div className="fl">Game Title (optional)</div>
          <input className="fi" value={title} onChange={e=>setTitle(e.target.value)} placeholder="e.g. Saturday Morning Casual" maxLength={60}/>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          <div className="fg"><div className="fl">Date *</div><input type="date" className="fi" value={date} onChange={e=>setDate(e.target.value)} min={today} style={{fontSize:'0.85rem'}}/></div>
          <div className="fg"><div className="fl">Start Time *</div><input type="time" className="fi" value={time} onChange={e=>setTime(e.target.value)} style={{fontSize:'0.85rem'}}/></div>
        </div>
        <div className="fg"><div className="fl">End Time (optional)</div><input type="time" className="fi" value={timeEnd} onChange={e=>setTimeEnd(e.target.value)} style={{fontSize:'0.85rem'}}/></div>

        <div className="fg"><div className="fl">Court / Location *</div>
          <input className="fi" value={court} onChange={e=>setCourt(e.target.value)} placeholder="e.g. Heritage Park Courts, Court 3" maxLength={120}/>
        </div>

        <div className="fg"><div className="fl">Play Type</div>
          <div className="og">{GAME_PTYPES.map(t=><button key={t} className={`ob ${playType===t?'s':''}`} onClick={()=>setPT(t)} style={{fontSize:'0.75rem'}}>{GAME_PT_E[t]} {t}</button>)}</div>
        </div>

        <div className="fg"><div className="fl">Skill Level Range</div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <select className="fi" value={skillMin} onChange={e=>setSkMin(e.target.value)} style={{fontSize:'0.85rem'}}>
              {GAME_SKILLS.map(s=><option key={s}>{s}</option>)}
            </select>
            <span style={{color:'var(--muted)',fontWeight:700}}>–</span>
            <select className="fi" value={skillMax} onChange={e=>setSkMax(e.target.value)} style={{fontSize:'0.85rem'}}>
              {GAME_SKILLS.map(s=><option key={s}>{s}</option>)}
            </select>
          </div>
        </div>

        <div className="fg"><div className="fl">Total Players Needed</div>
          <div className="stepper">
            <button className="stepper-btn" onClick={()=>setSlots(Math.max(2,totalSlots-1))}>−</button>
            <div className="stepper-val">{totalSlots}</div>
            <button className="stepper-btn" onClick={()=>setSlots(Math.min(12,totalSlots+1))}>+</button>
          </div>
          <div style={{fontSize:'0.65rem',color:'var(--muted)',marginTop:4}}>Includes yourself · {totalSlots-1} more needed</div>
        </div>

        <div className="fg"><div className="fl">Invite Radius</div>
          <div className="og">{['10','25','50','Any'].map(r=><button key={r} className={`ob ${radiusMi===r?'s':''}`} onClick={()=>setRadius(r)} style={{fontSize:'0.75rem'}}>{r==='Any'?'Any distance':`${r} mi`}</button>)}</div>
        </div>

        <div className="fg"><div className="fl">Notes (optional)</div>
          <textarea className="fi" value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Any details, rules, or requirements…" maxLength={300} rows={2}/>
        </div>

        <div className="fg"><div className="fl">Visibility</div>
          <div className="og">
            <button className={`ob ${!isPrivate?'s':''}`} onClick={()=>setPrivate(false)} style={{fontSize:'0.75rem'}}>🌍 Public — Anyone can join</button>
            <button className={`ob ${isPrivate?'s':''}`} onClick={()=>setPrivate(true)} style={{fontSize:'0.75rem'}}>🔒 Private — Invite Only</button>
          </div>
          <div style={{fontSize:'0.68rem',color:'var(--muted)',marginTop:5}}>{isPrivate?'Only invited players can see and join.':'Visible to everyone. Anyone can join.'}</div>
        </div>

        <button className="btn btn-primary" onClick={save} disabled={saving} style={{width:'100%',opacity:saving?.6:1}}>
          {saving?'Saving…':editGame?'✅ Save Changes':'✅ Create Game & Invite Players →'}
        </button>
      </div>
    </div>
  );
}

/* ── WeekSchedulePicker ── */
function WeekSchedulePicker({schedule,onChange}){
  const toggle=day=>{
    const e=schedule.find(s=>s.day===day);
    if(e)onChange(schedule.filter(s=>s.day!==day));
    else onChange([...schedule,{day,startTime:'08:00',endTime:'11:00'}]);
  };
  const setTime=(day,field,val)=>onChange(schedule.map(s=>s.day===day?{...s,[field]:val}:s));
  return(<div>
    <div className="week-picker">
      {DAYS_SHORT.map((d,i)=>{
        const sel=schedule.find(s=>s.day===i);
        return(<div key={i} className="wp-day">
          <div className="wp-day-label">{d}</div>
          <button className={`wp-day-btn${sel?' sel':''}`} onClick={()=>toggle(i)}>{d[0]}</button>
        </div>);
      })}
    </div>
    {[...schedule].sort((a,b)=>a.day-b.day).map(s=>(
      <div key={s.day} style={{background:'var(--navy)',border:'1px solid var(--border)',borderRadius:10,padding:'8px 12px',marginBottom:6}}>
        <div style={{fontSize:'0.72rem',fontWeight:700,color:'var(--green)',marginBottom:6}}>{DAYS_FULL[s.day]}</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}}>
          <div><div style={{fontSize:'0.6rem',fontWeight:700,color:'var(--muted)',textTransform:'uppercase',marginBottom:3}}>From</div><input type="time" className="fi" style={{fontSize:'0.8rem',padding:'7px 10px'}} value={s.startTime} onChange={e=>setTime(s.day,'startTime',e.target.value)}/></div>
          <div><div style={{fontSize:'0.6rem',fontWeight:700,color:'var(--muted)',textTransform:'uppercase',marginBottom:3}}>To</div><input type="time" className="fi" style={{fontSize:'0.8rem',padding:'7px 10px'}} value={s.endTime} onChange={e=>setTime(s.day,'endTime',e.target.value)}/></div>
        </div>
      </div>
    ))}
  </div>);
}

/* ── PlayerPicker ── */
function PlayerPicker({myUid,onSelect,selected,subtitle}){
  const[players,setPlayers]=useState([]);const[ld,setLd]=useState(true);const[srch,setSrch]=useState('');
  useEffect(()=>{
    if(!fbOk){setLd(false);return;}
    db.collection('profiles').get()
      .then(snap=>{setPlayers(snap.docs.filter(d=>d.id!==myUid).map(d=>({uid:d.id,...d.data()})).filter(p=>p.name));setLd(false);})
      .catch(()=>setLd(false));
  },[]);
  const filtered=srch.trim()?players.filter(p=>[p.name,p.city,p.skill].some(v=>(v||'').toLowerCase().includes(srch.toLowerCase()))):players;
  const toggle=p=>{
    const sel=selected.some(s=>s.uid===p.uid);
    onSelect(sel?selected.filter(s=>s.uid!==p.uid):[...selected,{uid:p.uid,name:p.name,photoURL:p.photoURL||null,skill:p.skill||''}]);
  };
  return(<div>
    {subtitle&&<div style={{fontSize:'0.7rem',color:'var(--muted)',marginBottom:6}}>{subtitle}</div>}
    <div style={{position:'relative',marginBottom:8}}><span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',fontSize:'0.8rem'}}>🔍</span><input className="fi" style={{paddingLeft:32,fontSize:'0.82rem'}} value={srch} onChange={e=>setSrch(e.target.value)} placeholder="Search players…"/></div>
    {selected.length>0&&<div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:8}}>{selected.map(s=><div key={s.uid} style={{display:'inline-flex',alignItems:'center',gap:4,background:'var(--green-dim)',border:'1px solid rgba(46,204,113,0.3)',borderRadius:20,padding:'3px 8px 3px 5px',fontSize:'0.68rem',fontWeight:600,color:'var(--green)'}}><div style={{width:16,height:16,borderRadius:'50%',background:'var(--green)',color:'white',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'0.5rem',fontWeight:800}}>{(s.name||'?')[0].toUpperCase()}</div>{s.name.split(' ')[0]}<button onClick={()=>onSelect(selected.filter(x=>x.uid!==s.uid))} style={{background:'none',border:'none',cursor:'pointer',color:'var(--green)',fontSize:'0.9rem',lineHeight:1,padding:0}}>×</button></div>)}</div>}
    <div className="pp-list">
      {ld?<div style={{padding:12,textAlign:'center',fontSize:'0.72rem',color:'var(--muted)'}}>Loading...</div>
      :filtered.length===0?<div style={{padding:12,textAlign:'center',fontSize:'0.72rem',color:'var(--muted)'}}>No players found</div>
      :filtered.slice(0,40).map(p=>{const isSel=selected.some(s=>s.uid===p.uid);return(
        <div key={p.uid} className={`pp-row${isSel?' sel':''}`} onClick={()=>toggle(p)}>
          <div className="pc-avatar" style={{width:28,height:28,fontSize:'0.72rem',flexShrink:0}}>{(p.name||'?')[0].toUpperCase()}</div>
          <div style={{flex:1,minWidth:0}}><div style={{fontSize:'0.78rem',fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.name}</div><div style={{fontSize:'0.65rem',color:'var(--muted)'}}>{p.skill||''}{p.city?' · '+p.city:''}</div></div>
          {isSel&&<span style={{color:'var(--green)',fontSize:'0.9rem',flexShrink:0}}>✓</span>}
        </div>
      );})}
    </div>
  </div>);
}

/* ── GroupManager ── */
function GroupManager({myUid,selectedGroupId,onSelectGroup}){
  const[groups,setGroups]=useState([]);const[ld,setLd]=useState(true);
  const[showCreate,setShowCreate]=useState(false);const[newName,setNN]=useState('');
  const[newMembers,setNM]=useState([]);const[saving,setSaving]=useState(false);
  const load=()=>{
    if(!fbOk){setLd(false);return;}
    db.collection('playerGroups').where('ownerUid','==',myUid).get()
      .then(snap=>{setGroups(snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)));setLd(false);})
      .catch(()=>setLd(false));
  };
  useEffect(()=>load(),[]);
  const create=async()=>{
    if(!newName.trim()){alert('Enter a group name.');return;}
    if(newMembers.length===0){alert('Select at least one player.');return;}
    setSaving(true);
    try{await db.collection('playerGroups').add({ownerUid:myUid,name:newName.trim(),members:newMembers,createdAt:Date.now()});setNN('');setNM([]);setShowCreate(false);load();}
    catch(e){alert('Failed: '+e.message);}setSaving(false);
  };
  const del=async id=>{if(!confirm('Delete this group?'))return;try{await db.collection('playerGroups').doc(id).delete();load();}catch(e){alert(e.message);}};
  if(showCreate)return(<div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
      <div style={{fontSize:'0.82rem',fontWeight:800}}>New Group</div>
      <button onClick={()=>setShowCreate(false)} className="btn btn-ghost btn-sm">Cancel</button>
    </div>
    <input className="fi" style={{marginBottom:10,fontSize:'0.82rem'}} value={newName} onChange={e=>setNN(e.target.value)} placeholder="e.g. Tuesday Crew" maxLength={50}/>
    <PlayerPicker myUid={myUid} selected={newMembers} onSelect={setNM} subtitle="Select players to add."/>
    <button className="btn btn-primary" onClick={create} disabled={saving} style={{width:'100%',marginTop:10,opacity:saving?.6:1}}>{saving?'Saving…':'Create Group'}</button>
  </div>);
  return(<div>
    {ld?<div style={{fontSize:'0.72rem',color:'var(--muted)',padding:'6px 0'}}>Loading…</div>
    :groups.length===0?<div style={{fontSize:'0.72rem',color:'var(--muted)',marginBottom:8}}>No groups yet.</div>
    :groups.map(g=>(<div key={g.id} onClick={()=>onSelectGroup(selectedGroupId===g.id?null:g)} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 12px',borderRadius:10,border:'1.5px solid '+(selectedGroupId===g.id?'rgba(46,204,113,0.5)':'var(--border2)'),background:selectedGroupId===g.id?'var(--green-dim)':'var(--card2)',cursor:'pointer',marginBottom:6,transition:'all .15s'}}>
      <span>🏷️</span>
      <div style={{flex:1,minWidth:0}}><div style={{fontSize:'0.82rem',fontWeight:700}}>{g.name}</div><div style={{fontSize:'0.65rem',color:'var(--muted)'}}>{g.members?.length||0} members</div></div>
      {selectedGroupId===g.id&&<span style={{color:'var(--green)'}}>✓</span>}
      <button onClick={e=>{e.stopPropagation();del(g.id);}} style={{background:'rgba(247,91,91,0.1)',border:'1px solid rgba(247,91,91,0.2)',borderRadius:6,padding:'3px 8px',fontSize:'0.65rem',color:'var(--red)',cursor:'pointer',fontFamily:'DM Sans',fontWeight:600}}>Delete</button>
    </div>))}
    <button onClick={()=>setShowCreate(true)} style={{width:'100%',padding:'9px',border:'1.5px dashed var(--border2)',borderRadius:10,background:'transparent',fontSize:'0.78rem',fontWeight:600,color:'var(--green)',cursor:'pointer',fontFamily:'DM Sans',marginTop:4}}>+ Create New Group</button>
  </div>);
}

/* ── CalendarView (Players) ── */
function CalendarView({posts,user,onChat,onNeedLogin,uLat,uLng}){
  const todayRef=new Date();todayRef.setHours(0,0,0,0);
  const[viewYear,setVY]=useState(todayRef.getFullYear());
  const[viewMonth,setVM]=useState(todayRef.getMonth());
  const[selected,setSelected]=useState(null);

  // Block navigating to past months
  const isPrevDisabled=(viewYear===todayRef.getFullYear()&&viewMonth===todayRef.getMonth());
  const prevMonth=()=>{if(isPrevDisabled)return;if(viewMonth===0){setVM(11);setVY(y=>y-1);}else setVM(m=>m-1);};
  const nextMonth=()=>{if(viewMonth===11){setVM(0);setVY(y=>y+1);}else setVM(m=>m+1);};

  // Filter: visible + within 50mi if location known
  const visiblePosts=useMemo(()=>posts.filter(p=>{
    if(!p.shareMode||p.shareMode==='public'){}
    else if(!user)return false;
    else if(p.uid===user.uid){}
    else if(p.shareMode==='players'||p.shareMode==='group'){if(!(p.sharePlayerIds||[]).includes(user.uid))return false;}
    else return false;
    // 50mi radius filter when location available
    if(uLat&&p.lat&&haversine(uLat,uLng,p.lat,p.lng)>50)return false;
    return true;
  }),[posts,user,uLat,uLng]);

  const calDays=useMemo(()=>{
    const first=new Date(viewYear,viewMonth,1);
    const startDow=first.getDay();
    const daysInMonth=new Date(viewYear,viewMonth+1,0).getDate();
    // Only generate as many rows as needed (never more than 6, but trim the last row if all outside month)
    const totalCells=startDow+daysInMonth;
    const rows=Math.ceil(totalCells/7);
    const days=[];
    for(let i=0;i<rows*7;i++){
      const d=new Date(viewYear,viewMonth,1-startDow+i);
      days.push(d);
    }
    return days;
  },[viewYear,viewMonth]);

  const dayPostsMap=useMemo(()=>{
    const map={};
    calDays.forEach(d=>{
      const key=d.toISOString().split('T')[0];
      map[key]=visiblePosts.filter(p=>isPostAvailableOn(p,d));
    });
    return map;
  },[calDays,visiblePosts]);

  const selectedDayData=useMemo(()=>{
    if(!selected)return null;
    const key=selected.toISOString().split('T')[0];
    const dayPosts=dayPostsMap[key]||[];
    const playerMap={};
    dayPosts.forEach(p=>{
      if(!playerMap[p.uid])playerMap[p.uid]={uid:p.uid,name:p.name,skill:p.skill,photoURL:p.photoURL,city:p.city,posts:[]};
      playerMap[p.uid].posts.push(p);
    });
    const players=Object.values(playerMap);
    const hours=[];
    for(let h=6;h<=22;h++){
      const hMin=h*60,hMax=(h+1)*60;
      const inSlot=players.filter(pl=>pl.posts.some(p=>{
        const{start,end}=getPostHours(p,selected);
        return timeToMins(start)<hMax&&timeToMins(end)>hMin;
      }));
      if(inSlot.length>0)hours.push({h,label:`${h%12||12}${h<12?'am':'pm'}`,players:inSlot});
    }
    return{players,hours,date:selected};
  },[selected,dayPostsMap]);

  const todayStr=todayRef.toISOString().split('T')[0];

  return(<div>
    {/* Location info banner */}
    {!uLat&&<div style={{background:'rgba(245,158,11,.1)',border:'1px solid rgba(245,158,11,.25)',borderRadius:10,padding:'8px 12px',marginBottom:10,fontSize:'0.72rem',color:'var(--accent)',display:'flex',alignItems:'center',gap:7}}>
      <span>📍</span><span>Enable location to see only players within 50 miles. Currently showing all public availability.</span>
    </div>}
    {uLat&&<div style={{background:'var(--green-dim)',border:'1px solid rgba(46,204,113,.2)',borderRadius:10,padding:'7px 12px',marginBottom:10,fontSize:'0.72rem',color:'var(--green)',display:'flex',alignItems:'center',gap:7}}>
      <span>📍</span><span>Showing players within <strong>50 miles</strong> of you.</span>
    </div>}

    {/* Month nav */}
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10,padding:'0 2px'}}>
      <button onClick={prevMonth} disabled={isPrevDisabled} style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:9,width:32,height:32,display:'flex',alignItems:'center',justifyContent:'center',cursor:isPrevDisabled?'default':'pointer',color:isPrevDisabled?'var(--muted)':'var(--text)',fontSize:'1rem',opacity:isPrevDisabled?.4:1}}>‹</button>
      <div style={{fontFamily:'Syne',fontWeight:800,fontSize:'0.95rem'}}>{MONTHS[viewMonth]} {viewYear}</div>
      <button onClick={nextMonth} style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:9,width:32,height:32,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',color:'var(--text)',fontSize:'1rem'}}>›</button>
    </div>

    {/* Day headers */}
    <div className="cal-grid" style={{marginBottom:4}}>
      {DAYS_SHORT.map(d=><div key={d} className="cal-head">{d}</div>)}
    </div>

    {/* Calendar grid */}
    <div className="cal-grid" style={{marginBottom:14}}>
      {calDays.map((d,i)=>{
        const key=d.toISOString().split('T')[0];
        const dayPosts=dayPostsMap[key]||[];
        const isThisMonth=d.getMonth()===viewMonth;
        const isPast=d<todayRef&&key!==todayStr;
        const isToday=key===todayStr;
        const isSel=selected&&key===selected.toISOString().split('T')[0];
        const dotCount=Math.min(dayPosts.length,3);
        return(
          <div key={i} className={`cal-day${!isThisMonth?' other-month':''}${isToday?' today':''}${isSel?' selected':''}${dayPosts.length>0&&!isSel&&!isPast?' has-players':''}`}
            onClick={()=>{if(!isThisMonth||isPast)return;setSelected(isSel?null:new Date(d));}}
            style={{cursor:(!isThisMonth||isPast)?'default':'pointer',opacity:isPast?.3:1}}>
            <div className="cal-day-num" style={isSel?{color:'white'}:{color:isThisMonth&&!isPast?'var(--text)':'var(--muted)'}}>{d.getDate()}</div>
            {isThisMonth&&!isPast&&<div className="cal-dot-row">
              {Array.from({length:dotCount}).map((_,j)=><div key={j} className={`cal-dot${j===2&&dayPosts.length>3?' more':''}`}/>)}
            </div>}
          </div>
        );
      })}
    </div>

    {/* Selected day detail */}
    {selectedDayData&&(
      <div style={{animation:'fadeIn .15s'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
          <div style={{fontFamily:'Syne',fontWeight:800,fontSize:'0.88rem'}}>
            {selectedDayData.date.toLocaleDateString('en',{weekday:'short',month:'short',day:'numeric'})}
          </div>
          <div style={{fontSize:'0.7rem',color:'var(--muted)'}}>{selectedDayData.players.length} player{selectedDayData.players.length!==1?'s':''} available</div>
        </div>

        {selectedDayData.players.length===0&&(
          <div style={{textAlign:'center',padding:'24px 16px',color:'var(--muted)',fontSize:'0.82rem'}}>No players posted availability for this day.</div>
        )}

        {selectedDayData.hours.length>0&&(
          <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:14,padding:'10px 14px',marginBottom:10}}>
            <div style={{fontSize:'0.62rem',fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:8}}>By Time Slot</div>
            {selectedDayData.hours.map(slot=>(
              <div key={slot.h} className="hour-slot">
                <div className="hour-label">{slot.label}</div>
                <div className="hour-players">
                  {slot.players.map(pl=>(
                    <div key={pl.uid} className="hour-player-chip" onClick={()=>user?onChat(pl):onNeedLogin(pl)}>
                      <div className="pc-avatar" style={{width:26,height:26,fontSize:'0.7rem',flexShrink:0}}>{pl.photoURL?<img src={pl.photoURL} referrerPolicy="no-referrer" style={{width:'100%',height:'100%',objectFit:'cover',borderRadius:'50%'}}/>:(pl.name||'?')[0]}</div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:'0.75rem',fontWeight:700,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{pl.name}{user&&pl.uid===user.uid&&<span style={{fontSize:'0.55rem',marginLeft:4,color:'var(--green)',fontWeight:700}}>YOU</span>}</div>
                        <div style={{fontSize:'0.6rem',color:'var(--muted)'}}>{pl.skill||''}</div>
                      </div>
                      {user&&pl.uid!==user.uid&&<span style={{fontSize:'0.65rem',color:'var(--green)',fontWeight:700,flexShrink:0}}>💬</span>}
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        )}

        {selectedDayData.hours.length===0&&selectedDayData.players.length>0&&(
          <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:14,padding:'10px 14px'}}>
            <div style={{fontSize:'0.62rem',fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:8}}>Available Players</div>
            {selectedDayData.players.map(pl=>(
              <div key={pl.uid} className="hour-player-chip" style={{marginBottom:6,width:'100%'}} onClick={()=>user?onChat(pl):onNeedLogin(pl)}>
                <div className="pc-avatar" style={{width:28,height:28,fontSize:'0.72rem',flexShrink:0}}>{pl.photoURL?<img src={pl.photoURL} referrerPolicy="no-referrer" style={{width:'100%',height:'100%',objectFit:'cover',borderRadius:'50%'}}/>:(pl.name||'?')[0]}</div>
                <div style={{flex:1}}><div style={{fontSize:'0.78rem',fontWeight:700}}>{pl.name}</div><div style={{fontSize:'0.62rem',color:'var(--muted)'}}>{pl.skill||''}{pl.city?' · '+pl.city:''}</div></div>
                {user&&pl.uid!==user.uid&&<span style={{fontSize:'0.65rem',color:'var(--green)',fontWeight:700}}>💬</span>}
              </div>
            ))}
          </div>
        )}
      </div>
    )}
  </div>);
}

/* ── PlayersTab ── */
function PlayersTab({user,posts,players,onChat,onNeedLogin,uLat,uLng}){
  const[search,setSearch]=useState('');
  const[tab,setTab]=useState('all');
  const[expanded,setExpanded]=useState(null);
  const[showPost,setShowPost]=useState(false);
  const[editPost,setEditPost]=useState(null);
  const[showF,setShowF]=useState(false);
  const[fSkill,setFS]=useState('');const[fType,setFT]=useState('');const[fGender,setFG]=useState('');const[fPurpose,setFP]=useState('');const[fDist,setFD]=useState('');
  const fCount=[fSkill,fType,fGender,fPurpose,fDist].filter(Boolean).length;
  const clearF=()=>{setFS('');setFT('');setFG('');setFP('');setFD('');};

  const grouped=useMemo(()=>{
    let fp=[...posts];
    fp=fp.filter(p=>{
      if(!p.shareMode||p.shareMode==='public')return true;
      if(!user)return false;
      if(p.uid===user.uid)return true;
      if(p.shareMode==='connections')return false;
      if(p.shareMode==='players'||p.shareMode==='group')return(p.sharePlayerIds||[]).includes(user.uid);
      return false;
    });
    if(tab==='now')fp=fp.filter(p=>p.availability==='Now'||p.availability==='Today');
    if(tab==='nearby'&&uLat)fp=fp.filter(p=>p.lat&&haversine(uLat,uLng,p.lat,p.lng)<=25);
    if(search.trim()){const q=search.toLowerCase();fp=fp.filter(p=>[p.name,p.city,p.skill,p.message,p.courtName].some(v=>(v||'').toLowerCase().includes(q)));}
    if(fSkill)fp=fp.filter(p=>p.skill===fSkill);
    if(fType)fp=fp.filter(p=>p.playTypes?.includes(fType));
    if(fGender)fp=fp.filter(p=>p.gender===fGender);
    if(fPurpose)fp=fp.filter(p=>p.purpose===fPurpose);
    if(fDist&&uLat)fp=fp.filter(p=>p.lat&&haversine(uLat,uLng,p.lat,p.lng)<=parseInt(fDist));
    const map={};
    fp.forEach(p=>{
      if(!map[p.uid])map[p.uid]={uid:p.uid,name:p.name,skill:p.skill,city:p.city,age:p.age,gender:p.gender,duprId:p.duprId,photoURL:p.photoURL,lat:p.lat,lng:p.lng,posts:[]};
      map[p.uid].posts.push(p);
      if(p.timestamp>(map[p.uid]._ts||0)){map[p.uid]._ts=p.timestamp;Object.assign(map[p.uid],{name:p.name,skill:p.skill,city:p.city,photoURL:p.photoURL,duprId:p.duprId});}
    });
    let arr=Object.values(map);
    arr.sort((a,b)=>{
      if(user&&a.uid===user.uid)return -1;if(user&&b.uid===user.uid)return 1;
      if(tab==='nearby'&&uLat&&a.lat&&b.lat)return haversine(uLat,uLng,a.lat,a.lng)-haversine(uLat,uLng,b.lat,b.lng);
      return(b._ts||0)-(a._ts||0);
    });
    return arr;
  },[posts,tab,search,fSkill,fType,fGender,fPurpose,fDist,user,uLat,uLng]);

  const removePost=async(id)=>{
    if(!confirm('Remove this post?'))return;
    try{await db.collection('findPlayers').doc(id).update({status:'removed'});}
    catch(e){alert(e.message);}
  };

  const fmtPostTime=p=>{
    if(p.startTime&&p.endTime){const fmt=t=>{const[h,m]=t.split(':').map(Number);return`${h%12||12}:${String(m).padStart(2,'0')}${h>=12?'pm':'am'}`};return`${fmt(p.startTime)}–${fmt(p.endTime)}`;}
    return null;
  };

  // Returns a compact readable label: for Today/This Week show actual date; for Custom Schedule show "Weekly"
  const fmtAvailLabel=p=>{
    if(p.availability==='Custom Schedule')return'📅 Weekly';
    if(p.availDate){
      const d=new Date(p.availDate+'T12:00:00');
      const today=new Date();today.setHours(0,0,0,0);
      const diff=Math.round((d-today)/86400000);
      if(diff===0)return`📅 Today · ${d.toLocaleDateString('en',{month:'short',day:'numeric'})}`;
      if(diff===1)return`📅 Tomorrow · ${d.toLocaleDateString('en',{month:'short',day:'numeric'})}`;
      return`📅 ${d.toLocaleDateString('en',{weekday:'short',month:'short',day:'numeric'})}`;
    }
    return`📅 ${p.availability}`;
  };

  return(
    <div className="px fade-in">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',paddingTop:4,marginBottom:12}}>
        <div className="section-title" style={{marginBottom:0}}>Find Players</div>
        <button className="btn btn-primary btn-sm" onClick={()=>{if(!user){onNeedLogin(null);return;}setEditPost(null);setShowPost(true);}}>📢 Post</button>
      </div>

      {/* Tabs */}
      <div className="tab-pills">
        {[['all','🏓 All'],['now','⚡ Now'],['calendar','📅 Calendar'],['nearby','📍 Nearby']].map(([k,l])=>(
          <div key={k} className={`pill ${tab===k?'active':''}`} onClick={()=>setTab(k)}>{l}</div>
        ))}
      </div>

      {/* Calendar tab */}
      {tab==='calendar'&&<CalendarView posts={posts} user={user} onChat={onChat} onNeedLogin={onNeedLogin} uLat={uLat} uLng={uLng}/>}

      {/* List tabs */}
      {tab!=='calendar'&&<>
        {/* Search + Filter */}
        <div style={{display:'flex',gap:8,marginBottom:10,alignItems:'center'}}>
          <div style={{position:'relative',flex:1}}><span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',pointerEvents:'none'}}>🔍</span><input className="fi" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search players…" style={{paddingLeft:36}}/></div>
          <button onClick={()=>setShowF(!showF)} style={{padding:'10px 14px',border:`1.5px solid ${showF||fCount?'var(--green)':'var(--border2)'}`,borderRadius:12,background:showF||fCount?'var(--green-dim)':'transparent',color:showF||fCount?'var(--green)':'var(--muted)',fontFamily:'DM Sans',fontSize:'0.78rem',fontWeight:700,cursor:'pointer',whiteSpace:'nowrap',flexShrink:0}}>
            ⚙ Filter{fCount>0?` (${fCount})`:''}
          </button>
        </div>

        {showF&&<div style={{background:'var(--card)',border:'1px solid var(--border2)',borderRadius:14,padding:'12px 14px',marginBottom:12,animation:'fadeIn .15s'}}>
          <div style={{marginBottom:10}}><div className="fp-label">Skill Level</div><div className="fp-pills"><button className={`fp-pill ${!fSkill?'s':''}`} onClick={()=>setFS('')}>All</button>{SKILLS.map(s=><button key={s} className={`fp-pill ${fSkill===s?'s':''}`} onClick={()=>setFS(fSkill===s?'':s)}>{s}</button>)}</div></div>
          <div style={{marginBottom:10}}><div className="fp-label">Play Type</div><div className="fp-pills"><button className={`fp-pill ${!fType?'s':''}`} onClick={()=>setFT('')}>All</button>{PTYPES.map(t=><button key={t} className={`fp-pill ${fType===t?'s':''}`} onClick={()=>setFT(fType===t?'':t)}>{PT_E[t]} {t}</button>)}</div></div>
          <div style={{marginBottom:10}}><div className="fp-label">Looking For</div><div className="fp-pills"><button className={`fp-pill ${!fPurpose?'s':''}`} onClick={()=>setFP('')}>All</button>{PURPOSES.map(p=><button key={p.id} className={`fp-pill ${fPurpose===p.id?'s':''}`} onClick={()=>setFP(fPurpose===p.id?'':p.id)}>{p.e} {p.l}</button>)}</div></div>
          <div style={{marginBottom:uLat?10:0}}><div className="fp-label">Gender</div><div className="fp-pills"><button className={`fp-pill ${!fGender?'s':''}`} onClick={()=>setFG('')}>Any</button>{['Male','Female','Non-binary'].map(g=><button key={g} className={`fp-pill ${fGender===g?'s':''}`} onClick={()=>setFG(fGender===g?'':g)}>{g}</button>)}</div></div>
          {uLat&&<div><div className="fp-label">Distance</div><div className="fp-pills"><button className={`fp-pill ${!fDist?'s':''}`} onClick={()=>setFD('')}>Any</button>{['5','10','25','50'].map(d=><button key={d} className={`fp-pill ${fDist===d?'s':''}`} onClick={()=>setFD(fDist===d?'':d)}>Within {d} mi</button>)}</div></div>}
          {fCount>0&&<button onClick={clearF} style={{marginTop:8,background:'none',border:'none',color:'var(--red)',fontSize:'0.72rem',fontWeight:600,cursor:'pointer'}}>✕ Clear all</button>}
        </div>}

        <div style={{fontSize:'0.7rem',color:'var(--muted)',marginBottom:10}}>{grouped.length} player{grouped.length!==1?'s':''}</div>
        {grouped.length===0&&<div className="empty-state"><div className="empty-icon">👥</div><div className="empty-title">No players found</div><div className="empty-sub">{search||fCount?'Try different filters':'Be the first to post!'}</div></div>}
        {grouped.map(g=>{
          const mine=user&&g.uid===user.uid;
          const dist=uLat&&g.lat?haversine(uLat,uLng,g.lat,g.lng):null;
          const latestPost=g.posts[0];
          const pu=latestPost?PURPOSES.find(p=>p.id===latestPost.purpose):null;
          const isExp=expanded===g.uid;
          return(
            <div key={g.uid} className={`player-card ${isExp?'expanded':''}`} onClick={()=>setExpanded(isExp?null:g.uid)} style={mine?{borderColor:'rgba(46,204,113,0.3)'}:{}}>
              <div className="pc-row">
                <div className="pc-avatar">{g.photoURL?<img src={g.photoURL} referrerPolicy="no-referrer" style={{width:'100%',height:'100%',objectFit:'cover',borderRadius:'50%'}}/>:g.name?.[0]||'?'}</div>
                <div className="pc-info">
                  <div className="pc-name">
                    {g.name}
                    {mine&&<span style={{fontSize:'0.6rem',fontWeight:700,background:'var(--green-dim)',color:'var(--green)',padding:'2px 5px',borderRadius:4}}>YOU</span>}
                    {g.posts.length>1&&<span style={{fontSize:'0.6rem',fontWeight:700,background:'var(--green)',color:'white',padding:'2px 6px',borderRadius:8}}>{g.posts.length}</span>}
                  </div>
                  <div className="pc-sub">{g.city||'No location'}{dist!=null?` · ${dist<1?dist.toFixed(1):Math.round(dist)} mi`:''}{g.age?` · ${g.age}`:''}{g.gender?` · ${g.gender}`:''}</div>
                  {latestPost&&!isExp&&<div style={{display:'flex',gap:4,flexWrap:'wrap',marginTop:3}}>
                    {pu&&<span className="tag t-green">{pu.e} {pu.l}</span>}
                    <span className="tag t-blue">{fmtAvailLabel(latestPost)}</span>
                    {fmtPostTime(latestPost)&&<span className="tag t-muted">🕐 {fmtPostTime(latestPost)}</span>}
                  </div>}
                </div>
                <div className="pc-skill">{g.skill||'NR'}</div>
              </div>
              {isExp&&(
                <div className="pc-expand" onClick={e=>e.stopPropagation()}>
                  <div style={{display:'flex',gap:14,padding:'6px 0 10px',borderBottom:'1px solid var(--border)',marginBottom:10,flexWrap:'wrap'}}>
                    {g.age&&<div style={{fontSize:'0.7rem'}}><span style={{color:'var(--muted)',fontWeight:700,textTransform:'uppercase',fontSize:'0.6rem'}}>Age </span><span style={{fontWeight:600}}>{g.age}</span></div>}
                    {g.gender&&<div style={{fontSize:'0.7rem'}}><span style={{color:'var(--muted)',fontWeight:700,textTransform:'uppercase',fontSize:'0.6rem'}}>Gender </span><span style={{fontWeight:600}}>{g.gender}</span></div>}
                    {g.city&&<div style={{fontSize:'0.7rem'}}><span style={{color:'var(--muted)',fontWeight:700,textTransform:'uppercase',fontSize:'0.6rem'}}>City </span><span style={{fontWeight:600}}>{g.city}</span></div>}
                    {g.duprId&&<a href={`https://mydupr.com/dashboard/players/${g.duprId}`} target="_blank" style={{fontSize:'0.7rem',color:'var(--green)',fontWeight:700,textDecoration:'none'}}>DUPR: {g.duprId}</a>}
                  </div>
                  {g.posts.length>1&&<div style={{fontSize:'0.62rem',fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:6}}>{g.posts.length} Active Posts</div>}
                  {g.posts.map(p=>{
                    const pu2=PURPOSES.find(x=>x.id===p.purpose);
                    const isMyPost=user&&p.uid===user.uid;
                    return(
                      <div key={p.id} style={{background:'var(--navy2)',border:'1px solid var(--border)',borderRadius:12,padding:'10px 12px',marginBottom:8}}>
                        <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:6,flexWrap:'wrap'}}>
                          <span className="tag t-green">{pu2?.e} {pu2?.l||'Play'}</span>
                          {p.playTypes?.map(t=><span key={t} className="tag t-muted">{PT_E[t]||''} {t}</span>)}
                          <span className="tag t-blue">{fmtAvailLabel(p)}</span>
                          {fmtPostTime(p)&&<span className="tag t-muted">🕐 {fmtPostTime(p)}</span>}
                          {p.shareMode&&p.shareMode!=='public'&&<span className="tag t-blue">🔒 {p.shareMode==='connections'?'Connections':p.shareMode==='group'?'Group':'Private'}</span>}
                          {isMyPost&&<div style={{marginLeft:'auto',display:'flex',gap:5}}>
                            <button onClick={()=>{setEditPost(p);setShowPost(true);}} style={{padding:'3px 9px',fontSize:'0.65rem',fontWeight:700,border:'1px solid var(--border2)',borderRadius:6,background:'transparent',color:'var(--green)',cursor:'pointer'}}>✏️ Edit</button>
                            <button onClick={()=>removePost(p.id)} style={{padding:'3px 9px',fontSize:'0.65rem',fontWeight:700,border:'1px solid rgba(247,91,91,0.3)',borderRadius:6,background:'transparent',color:'var(--red)',cursor:'pointer'}}>🗑</button>
                          </div>}
                        </div>
                        {/* Custom Schedule day grid */}
                        {p.availability==='Custom Schedule'&&p.weekSchedule?.length>0&&(
                          <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:3,marginBottom:8}}>
                            {DAYS_SHORT.map((d,i)=>{
                              const s=p.weekSchedule.find(x=>x.day===i);
                              return(<div key={i} style={{textAlign:'center'}}>
                                <div style={{fontSize:'0.5rem',fontWeight:700,color:'var(--muted)',textTransform:'uppercase',marginBottom:2}}>{d}</div>
                                <div style={{borderRadius:5,padding:'3px 1px',fontSize:'0.55rem',fontWeight:700,background:s?'var(--green-dim)':'transparent',border:`1px solid ${s?'rgba(46,204,113,0.3)':'var(--border)'}`,color:s?'var(--green)':'var(--muted2)'}}>{s?'✓':'–'}</div>
                                {s&&<div style={{fontSize:'0.45rem',color:'var(--muted)',marginTop:1,lineHeight:1.2}}>{fmtTime(s.startTime)}</div>}
                              </div>);
                            })}
                          </div>
                        )}
                        {p.courtName&&<div style={{fontSize:'0.72rem',color:'var(--muted)',marginBottom:4}}>📍 {p.courtName}</div>}
                        {p.message&&<div style={{fontSize:'0.78rem',fontStyle:'italic',marginBottom:4}}>"{p.message}"</div>}
                        <div style={{fontSize:'0.62rem',color:'var(--muted2)'}}>{timeAgo(p.timestamp)} ago</div>
                      </div>
                    );
                  })}
                  <div style={{display:'flex',gap:8,paddingTop:4,flexWrap:'wrap'}}>
                    {!mine&&<MsgBtn player={g} user={user} onChat={onChat} onNeedLogin={onNeedLogin}/>}
                    {mine&&<button className="btn btn-ghost btn-sm" onClick={()=>{setEditPost(null);setShowPost(true);}}>+ New Post</button>}
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </>}

      {showPost&&user&&<PostForm user={user} editData={editPost} onClose={()=>{setShowPost(false);setEditPost(null);}} onPosted={()=>{setShowPost(false);setEditPost(null);}} uLat={uLat} uLng={uLng}/>}
    </div>
  );
}

/* ── PostForm ── */
function PostForm({user,onClose,onPosted,editData,uLat,uLng}){
  const[purpose,setPurpose]=useState(editData?.purpose||'play');
  const[playTypes,setPT]=useState(editData?.playTypes||[]);
  const[avail,setAv]=useState(editData?.availability||'Today');
  const[availDate,setAD]=useState(editData?.availDate||new Date().toISOString().split('T')[0]);
  const[startTime,setStart]=useState(editData?.startTime||'08:00');
  const[endTime,setEnd]=useState(editData?.endTime||'10:00');
  const[weekSchedule,setWS]=useState(editData?.weekSchedule||[]);
  // Custom Schedule end date — defaults to 1 month from today
  const defaultEndDate=(()=>{const d=new Date();d.setMonth(d.getMonth()+1);return d.toISOString().split('T')[0];})();
  const[scheduleEndDate,setSED]=useState(editData?.scheduleEndDate||defaultEndDate);
  const[courtName,setCourt]=useState(editData?.courtName||'');
  const[message,setMsg]=useState(editData?.message||'');
  const[partnerGender,setPG]=useState(editData?.partnerGender||'');
  const[shareMode,setShare]=useState(editData?.shareMode||'public');
  const[sharePlayers,setSP]=useState([]);
  const[shareGroup,setSG]=useState(null);
  const[saving,setSaving]=useState(false);
  const[profile,setProfile]=useState(null);
  const today=new Date().toISOString().split('T')[0];

  useEffect(()=>{if(fbOk&&user)db.collection('profiles').doc(user.uid).get().then(d=>{if(d.exists)setProfile({uid:user.uid,...d.data()});});},[user]);
  const togglePT=t=>setPT(p=>p.includes(t)?p.filter(x=>x!==t):[...p,t]);

  const shareModeDesc={
    public:'Visible to all PickleConnect players.',
    connections:"Only shown to people you've chatted with before.",
    players:sharePlayers.length>0?`Shown to ${sharePlayers.length} selected player${sharePlayers.length!==1?'s':''}.`:'Choose specific players below.',
    group:shareGroup?`Members of "${shareGroup.name}" only.`:'Select or create a group below.',
  };

  const save=async()=>{
    if(!profile){alert('Profile not loaded.');return;}
    if(playTypes.length===0){alert('Select at least one play type.');return;}
    if(avail==='Custom Schedule'&&weekSchedule.length===0){alert('Select at least one day for your schedule.');return;}
    if(shareMode==='players'&&sharePlayers.length===0){alert('Select at least one player to share with.');return;}
    if(shareMode==='group'&&!shareGroup){alert('Select a group to share with.');return;}
    setSaving(true);
    const sharePlayerIds=
      shareMode==='players'?sharePlayers.map(p=>p.uid).filter(Boolean):
      shareMode==='group'?(shareGroup.members||[]).map(m=>m.uid||m).filter(Boolean):[];
    const _raw={
      uid:user.uid,name:profile.name||null,skill:profile.skill||null,
      city:profile.city||null,age:profile.age||null,gender:profile.gender||null,
      duprId:profile.duprId||null,photoURL:profile.photoURL||null,
      purpose,playTypes,availability:avail,
      availDate:avail!=='Custom Schedule'?(availDate||null):null,
      startTime:avail!=='Custom Schedule'?(startTime||null):null,
      endTime:avail!=='Custom Schedule'?(endTime||null):null,
      weekSchedule:avail==='Custom Schedule'?weekSchedule:[],
      scheduleStartDate:avail==='Custom Schedule'?today:null,
      scheduleEndDate:avail==='Custom Schedule'?(scheduleEndDate||defaultEndDate):null,
      courtName:courtName.trim()||null,message:message.trim()||null,
      partnerGender:purpose==='partner'?(partnerGender||null):null,
      shareMode,sharePlayerIds,
      shareGroupName:shareMode==='group'?(shareGroup?.name||null):null,
      lat:uLat||null,lng:uLng||null,
      timestamp:Date.now(),status:'active'
    };
    const data=Object.fromEntries(Object.entries(_raw).filter(([,v])=>v!==undefined));
    try{
      if(editData?.id)await db.collection('findPlayers').doc(editData.id).update(data);
      else await db.collection('findPlayers').add(data);
      onPosted();
    }catch(e){alert('Failed: '+e.message);}
    setSaving(false);
  };

  return(
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal-sheet">
        <div className="modal-handle"/>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
          <div className="modal-title">📢 {editData?'Edit Post':'Post Availability'}</div>
          <button onClick={onClose} className="icon-btn" style={{position:'static'}}>✕</button>
        </div>
        <div style={{fontSize:'0.75rem',color:'var(--muted)',marginBottom:12}}>Let others know when you're available to play.</div>

        {profile&&<div style={{display:'flex',alignItems:'center',gap:10,padding:10,background:'var(--navy)',border:'1px solid var(--border)',borderRadius:10,marginBottom:14}}>
          <div className="pc-avatar" style={{width:32,height:32,fontSize:'0.82rem'}}>{profile.photoURL?<img src={profile.photoURL} referrerPolicy="no-referrer" style={{width:'100%',height:'100%',objectFit:'cover',borderRadius:'50%'}}/>:(profile.name||'?')[0]}</div>
          <div><div style={{fontSize:'0.82rem',fontWeight:700}}>{profile.name}</div><div style={{fontSize:'0.68rem',color:'var(--muted)'}}>{profile.skill}{profile.gender?' · '+profile.gender:''}{profile.city?' · '+profile.city:''}</div></div>
        </div>}

        <div className="fg"><div className="fl">Looking for *</div>
          <div className="og">{PURPOSES.map(p=><button key={p.id} className={`ob ${purpose===p.id?'s':''}`} onClick={()=>setPurpose(p.id)} style={{fontSize:'0.78rem'}}>{p.e} {p.l}</button>)}</div>
        </div>

        {purpose==='partner'&&<div className="fg"><div className="fl">Partner Gender Preference</div>
          <div className="og">
            <button className={`ob ${partnerGender===''?'s':''}`} onClick={()=>setPG('')} style={{fontSize:'0.78rem'}}>Any</button>
            {['Male','Female','Non-binary'].map(g=><button key={g} className={`ob ${partnerGender===g?'s':''}`} onClick={()=>setPG(partnerGender===g?'':g)} style={{fontSize:'0.78rem'}}>{g}</button>)}
          </div>
        </div>}

        <div className="fg"><div className="fl">Play Type *</div>
          <div className="og">{PTYPES.map(t=><button key={t} className={`ob ${playTypes.includes(t)?'s':''}`} onClick={()=>togglePT(t)} style={{fontSize:'0.78rem'}}>{PT_E[t]} {t}</button>)}</div>
        </div>

        {/* When */}
        <div className="fg"><div className="fl">When</div>
          <div className="og" style={{marginBottom:10}}>
            {['Today','This Week','Custom Schedule'].map(a=>(
              <button key={a} className={`ob ${avail===a?'s':''}`} onClick={()=>setAv(a)} style={{fontSize:'0.78rem'}}>
                {a==='Today'?'📅':a==='This Week'?'🗓️':'📆'} {a}
              </button>
            ))}
          </div>
          {(avail==='Today'||avail==='This Week')&&<>
            <div className="fg" style={{marginBottom:8}}>
              <div className="fl">Date</div>
              <input type="date" className="fi" value={availDate} onChange={e=>setAD(e.target.value)} min={today} style={{fontSize:'0.85rem'}}/>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
              <div><div className="fl">From</div><input type="time" className="fi" value={startTime} onChange={e=>setStart(e.target.value)} style={{fontSize:'0.85rem'}}/></div>
              <div><div className="fl">To</div><input type="time" className="fi" value={endTime} onChange={e=>setEnd(e.target.value)} style={{fontSize:'0.85rem'}}/></div>
            </div>
          </>}
          {avail==='Custom Schedule'&&<div style={{marginTop:8}}>
            <div style={{fontSize:'0.72rem',color:'var(--muted)',marginBottom:8}}>🔁 Repeats weekly. Tap days you're available and set times per day.</div>
            <WeekSchedulePicker schedule={weekSchedule} onChange={setWS}/>
            <div className="fg" style={{marginTop:8,marginBottom:0}}>
              <div className="fl">Repeat Until</div>
              <input type="date" className="fi" value={scheduleEndDate} min={today} onChange={e=>setSED(e.target.value)} style={{fontSize:'0.85rem'}}/>
              <div style={{fontSize:'0.65rem',color:'var(--muted)',marginTop:4}}>Schedule will show on the calendar until this date. Default is 1 month.</div>
            </div>
          </div>}
        </div>

        <div className="fg"><div className="fl">Court (optional)</div>
          <input className="fi" value={courtName} onChange={e=>setCourt(e.target.value)} placeholder="e.g. Heritage Park Courts" maxLength={100}/>
        </div>

        <div className="fg"><div className="fl">Message</div>
          <textarea className="fi" value={message} onChange={e=>setMsg(e.target.value)} placeholder={purpose==='partner'?'Looking for 3.5+ doubles partner…':'Available for games, message me!'} maxLength={300} rows={2}/>
        </div>

        {/* Share Availability To */}
        <div className="fg"><div className="fl">Share Availability To</div>
          <div className="share-grid">
            {SHARE_MODES.map(m=>(
              <button key={m.id} onClick={()=>setShare(m.id)} className={`share-opt ${shareMode===m.id?'s':''}`}>
                {m.icon} {m.label}
              </button>
            ))}
          </div>
          <div style={{fontSize:'0.68rem',color:'var(--muted)',marginBottom:shareMode==='players'||shareMode==='group'?10:0}}>{shareModeDesc[shareMode]}</div>
          {shareMode==='players'&&<div style={{background:'var(--navy)',border:'1px solid var(--border)',borderRadius:10,padding:12}}>
            <PlayerPicker myUid={user.uid} selected={sharePlayers} onSelect={setSP} subtitle="Only selected players will see this post."/>
          </div>}
          {shareMode==='group'&&<div style={{background:'var(--navy)',border:'1px solid var(--border)',borderRadius:10,padding:12}}>
            <GroupManager myUid={user.uid} selectedGroupId={shareGroup?.id||null} onSelectGroup={g=>setSG(g)}/>
          </div>}
        </div>

        <button className="btn btn-primary" onClick={save} disabled={saving} style={{width:'100%',opacity:saving?.6:1}}>{saving?'Saving…':editData?'Save Changes':'📢 Post Availability'}</button>
      </div>
    </div>
  );
}

/* ── ProfileTab ── */
function ProfileTab({user,profile,onEditProfile,onSignOut,onGoAuth,unread,onInbox,onDeleteAccount}){
  const[showDelete,setShowDelete]=useState(false);
  const[delInput,setDelInput]=useState('');
  const[deleting,setDeleting]=useState(false);
  // Expose trigger for nav.js dropdown
  useEffect(()=>{window.__pcnTriggerDelete=()=>setShowDelete(true);return()=>{delete window.__pcnTriggerDelete;};},[]);
  const handleDelete=async()=>{
    if(delInput.trim().toLowerCase()!=='delete')return;
    setDeleting(true);
    try{await onDeleteAccount();}catch(e){alert('Failed: '+e.message);setDeleting(false);}
  };
  if(!user)return(
    <div className="px fade-in" style={{paddingTop:40}}>
      <div className="login-prompt-card" style={{textAlign:'center'}}>
        <div style={{fontSize:'3rem',marginBottom:12}}>🏓</div>
        <div className="modal-title" style={{marginBottom:8}}>Join PickleConnect</div>
        <div style={{fontSize:'0.82rem',color:'var(--muted)',marginBottom:20,lineHeight:1.5}}>Sign in to message players, post availability, and join games.</div>
        <button className="btn btn-primary" onClick={onGoAuth} style={{width:'100%'}}>Sign In / Create Account</button>
      </div>
    </div>
  );
  return(
    <div className="px fade-in">
      <div className="profile-hero">
        <div className="profile-avatar">{profile?.photoURL||user.photoURL?<img src={profile?.photoURL||user.photoURL} referrerPolicy="no-referrer" style={{width:'100%',height:'100%',objectFit:'cover',borderRadius:'50%'}}/>:(profile?.name||user.displayName||'?')[0]}</div>
        <div className="profile-name">{profile?.name||user.displayName||'Player'}</div>
        <div style={{fontSize:'0.78rem',color:'var(--muted)',marginTop:3}}>{profile?.skill&&`${profile.skill} · `}{profile?.city||user.email}</div>
        <button className="btn btn-ghost btn-sm" onClick={onEditProfile} style={{marginTop:12}}>✏️ Edit Profile</button>
      </div>
      <div className="settings-row" onClick={onInbox}>
        <div className="settings-row-left"><div style={{fontSize:'1.1rem'}}>💬</div><div><div style={{fontSize:'0.88rem',fontWeight:600}}>Messages</div><div style={{fontSize:'0.7rem',color:'var(--muted)'}}>Your private conversations</div></div></div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>{unread>0&&<div style={{background:'var(--red)',color:'white',borderRadius:10,padding:'2px 7px',fontSize:'0.72rem',fontWeight:700}}>{unread}</div>}<span style={{color:'var(--muted)'}}>›</span></div>
      </div>
      <div className="settings-row" onClick={onEditProfile}>
        <div className="settings-row-left"><div style={{fontSize:'1.1rem'}}>✏️</div><div><div style={{fontSize:'0.88rem',fontWeight:600}}>Edit Profile</div><div style={{fontSize:'0.7rem',color:'var(--muted)'}}>Name, skill, location</div></div></div>
        <span style={{color:'var(--muted)'}}>›</span>
      </div>
      <div className="settings-row" onClick={onSignOut} style={{borderColor:'rgba(247,91,91,0.15)'}}>
        <div className="settings-row-left"><div style={{fontSize:'1.1rem'}}>↩</div><div><div style={{fontSize:'0.88rem',fontWeight:600,color:'var(--red)'}}>Sign Out</div></div></div>
      </div>
      <div style={{fontSize:'0.65rem',fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.06em',marginTop:24,marginBottom:8,paddingLeft:2}}>Legal</div>
      <div className="settings-row" onClick={()=>window.open('https://pickleconnect.live/privacy','_blank')}>
        <div className="settings-row-left"><div style={{fontSize:'1.1rem'}}>🔒</div><div><div style={{fontSize:'0.88rem',fontWeight:600}}>Privacy Policy</div></div></div>
        <span style={{color:'var(--muted)'}}>›</span>
      </div>
      <div className="settings-row" onClick={()=>setShowDelete(true)} style={{borderColor:'rgba(247,91,91,0.15)'}}>
        <div className="settings-row-left"><div style={{fontSize:'1.1rem'}}>🗑</div><div><div style={{fontSize:'0.88rem',fontWeight:600,color:'var(--red)'}}>Delete Account</div><div style={{fontSize:'0.7rem',color:'var(--muted)'}}>Permanently removes all your data</div></div></div>
        <span style={{color:'var(--red)'}}>›</span>
      </div>
      {showDelete&&(
        <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget){setShowDelete(false);setDelInput('');}}}>
          <div className="modal-sheet">
            <div className="modal-handle"/>
            <div style={{textAlign:'center',marginBottom:16}}>
              <div style={{fontSize:'2.5rem',marginBottom:8}}>⚠️</div>
              <div className="modal-title" style={{color:'var(--red)'}}>Delete Account</div>
            </div>
            <div style={{background:'rgba(247,91,91,0.08)',border:'1px solid rgba(247,91,91,0.2)',borderRadius:12,padding:'12px 14px',marginBottom:16,fontSize:'0.82rem',color:'var(--text)',lineHeight:1.6}}>
              This will permanently delete:<br/>
              <strong>• Your profile</strong><br/>
              <strong>• All your availability posts</strong><br/>
              <strong>• All your games</strong><br/>
              <strong>• Your login credentials</strong><br/><br/>
              <span style={{color:'var(--red)',fontWeight:700}}>This cannot be undone.</span>
            </div>
            <div className="fg">
              <div className="fl">Type DELETE to confirm</div>
              <input className="fi" value={delInput} onChange={e=>setDelInput(e.target.value)} placeholder="DELETE" autoCapitalize="none" autoCorrect="off" spellCheck={false}/>
            </div>
            <div style={{display:'flex',gap:8,marginTop:8}}>
              <button className="btn btn-ghost" style={{flex:1}} onClick={()=>{setShowDelete(false);setDelInput('');}}>Cancel</button>
              <button onClick={handleDelete} disabled={deleting||delInput.trim().toLowerCase()!=='delete'} style={{flex:1,padding:'11px',borderRadius:12,border:'none',background:delInput.trim().toLowerCase()==='delete'?'var(--red)':'rgba(247,91,91,0.2)',color:'white',fontFamily:'DM Sans',fontSize:'0.88rem',fontWeight:700,cursor:delInput.trim().toLowerCase()==='delete'?'pointer':'default',opacity:deleting?.6:1}}>
                {deleting?'Deleting…':'Delete My Account'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── FabSheet ── */
function FabSheet({onClose,onStartGame,onAvailable,onQueue}){
  return(
    <div className="fab-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="fab-sheet">
        <div className="fab-sheet-title">How do you want to play?</div>
        <div className="fab-sheet-sub">Pick your vibe for today</div>
        <div className="fab-option opt1" onClick={onStartGame}><div className="opt-num">1</div><div className="opt-text"><h3>Start a Game</h3><p>Create a game & invite others</p></div><div style={{marginLeft:'auto',color:'var(--muted)'}}>›</div></div>
        <div className="fab-option opt2" onClick={onAvailable}><div className="opt-num">2</div><div className="opt-text"><h3>I'm Available</h3><p>Post so players can find you</p></div><div style={{marginLeft:'auto',color:'var(--muted)'}}>›</div></div>
        <div className="fab-option opt3" onClick={onQueue}><div className="opt-num">3</div><div className="opt-text"><h3>Join Court Queue</h3><p>Get in line at a nearby court</p></div><div style={{marginLeft:'auto',color:'var(--muted)'}}>›</div></div>
        <div className="fab-cancel" onClick={onClose}>✕  Cancel</div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════
   ROOT APP
════════════════════════════════════════ */
function App(){
  const[user,setUser]=useState(undefined);
  const[profile,setProfile]=useState(undefined);
  const[tab,setTab]=useState(()=>new URLSearchParams(window.location.search).get('tab')||'home');
  const[courtId,setCourtId]=useState(null);
  const switchTab=t=>{setTab(t);setCourtId(null);setShowFab(false);if(window.__pcnOnTabChange)window.__pcnOnTabChange(t);};

  // Expose hooks for nav.js
  const openCourt=c=>{setCourtId(c.id);setTab('court-detail');if(window.__pcnOnTabChange)window.__pcnOnTabChange('courts');};
  useEffect(()=>{window.__pcnSetTab=switchTab;
    // Handle #tab=xxx from nav.js on standalone pages (e.g. back from notifications.html)
    const hash=window.location.hash;
    if(hash.startsWith('#tab=')){const t=hash.slice(5);if(t)switchTab(t);window.history.replaceState(null,'',window.location.pathname+window.location.search);}
  },[]);
  useEffect(()=>{window.__pcnOpenAuth=()=>setShowAuth(true);return()=>{delete window.__pcnOpenAuth;};},[]);
  useEffect(()=>{window.__pcnOpenProfile=()=>setShowProfile(true);return()=>{delete window.__pcnOpenProfile;};},[]);
  useEffect(()=>{window.__pcnOpenInbox=()=>setShowInbox(true);if(new URLSearchParams(window.location.search).get('inbox')==='1'){setTimeout(()=>setShowInbox(true),250);}return()=>{delete window.__pcnOpenInbox;};},[]);
  useEffect(()=>{window.__pcnOpenDeleteAccount=()=>{switchTab('profile');setTimeout(()=>{if(typeof window.__pcnTriggerDelete==='function')window.__pcnTriggerDelete();},350);};return()=>{delete window.__pcnOpenDeleteAccount;};},[]);

  const[courts,setCourts]=useState([]);
  const[games,setGames]=useState([]);
  const[posts,setPosts]=useState([]);
  const[uLat,setULat]=useState(null);const[uLng,setULng]=useState(null);
  const[unread,setUnread]=useState(0);
  const[chatP,setChatP]=useState(null);
  const[showInbox,setShowInbox]=useState(false);
  const[showProfile,setShowProfile]=useState(false);
  const[showFab,setShowFab]=useState(false);
  const[showAuth,setShowAuth]=useState(false);
  const[loginPromptPlayer,setLoginPromptPlayer]=useState(undefined);

  const unsubs=useRef([]);
  const addUnsub=fn=>{unsubs.current.push(fn);return fn;};
  const clearUnsubs=()=>{unsubs.current.forEach(fn=>{try{fn();}catch(e){}});unsubs.current=[];};

  // ── AUTH STATE — automatically dismisses auth screen when user signs in
  useEffect(()=>{
    if(!auth)return;
    return auth.onAuthStateChanged(u=>{
      setUser(u||null);
      if(u){
        // User just signed in — close auth screen
        setShowAuth(false);
        // Initialize push notifications for this user
        window.PickleNotif?.init(u.uid);
      }else{
        clearUnsubs();
        setProfile(null);
      }
    });
  },[]);

  useEffect(()=>{
    if(!user)return;
    if(!fbOk){setProfile(null);return;}
    const u=db.collection('profiles').doc(user.uid).onSnapshot(d=>{setProfile(d.exists?{uid:user.uid,...d.data()}:null);},()=>setProfile(null));
    addUnsub(u);return()=>u();
  },[user?.uid]);

  useEffect(()=>{navigator.geolocation?.getCurrentPosition(p=>{setULat(p.coords.latitude);setULng(p.coords.longitude);},()=>{},{timeout:8000});},[]);

  useEffect(()=>{
    if(!fbOk)return;
    const u=db.collection('courts').orderBy('createdAt','desc').onSnapshot(s=>{setCourts(s.docs.map(d=>({id:d.id,...d.data()})));},e=>{if(e.code!=='permission-denied')console.error(e);});
    return()=>u();
  },[]);

  useEffect(()=>{
    if(!fbOk||!user)return;
    const u=db.collection('games').where('status','==','active').onSnapshot(s=>{setGames(s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||b.timestamp||0)-(a.createdAt||a.timestamp||0)));},e=>{if(e.code!=='permission-denied')console.error(e);});
    addUnsub(u);return()=>u();
  },[user?.uid]);

  useEffect(()=>{
    if(!fbOk)return;
    const u=db.collection('findPlayers').where('status','==','active').onSnapshot(s=>{setPosts(s.docs.map(d=>({id:d.id,...d.data()})));},e=>{if(e.code!=='permission-denied')console.error(e);});
    return()=>u();
  },[]);

  // Fetch ALL registered profiles for Available Players & Inbox lookup
  const[allProfiles,setAllProfiles]=useState([]);
  useEffect(()=>{
    if(!fbOk)return;
    const u=db.collection('profiles').onSnapshot(s=>{setAllProfiles(s.docs.map(d=>({uid:d.id,...d.data()})));},e=>{if(e.code!=='permission-denied')console.error(e);});
    return()=>u();
  },[]);

  useEffect(()=>{
    if(!fbOk||!user)return;
    const u=db.collection('conversations').where('participants','array-contains',user.uid).onSnapshot(s=>{let c=0;s.docs.forEach(d=>{const x=d.data();if(x.lastMessageBy!==user.uid&&x.lastTimestamp>(x[`readBy_${user.uid}`]||0))c++;});setUnread(c);},e=>{if(e.code!=='permission-denied')console.error(e);setUnread(0);});
    addUnsub(u);return()=>u();
  },[user?.uid]);

  // All registered users sorted by nearest (for Available Players display)
  const allPlayers=useMemo(()=>{
    let arr=allProfiles.filter(p=>p.uid!==user?.uid&&p.name);
    if(uLat){
      arr=arr.map(p=>{const d=p.lat?haversine(uLat,uLng,p.lat,p.lng):999;return{...p,_dist:d};});
      arr.sort((a,b)=>a._dist-b._dist);
    }
    return arr;
  },[allProfiles,user?.uid,uLat,uLng]);

  const handleNeedLogin=player=>setLoginPromptPlayer(player===undefined?null:player);
  const handleGoAuth=()=>{setLoginPromptPlayer(undefined);setShowAuth(true);};
  const handleSignOut=async()=>{if(window.confirm('Sign out?')){clearUnsubs();await auth.signOut();switchTab('home');}};
  const handleDeleteAccount=async()=>{
    if(!auth?.currentUser)return;
    const uid=auth.currentUser.uid;
    if(fbOk){
      try{await db.collection('profiles').doc(uid).delete();}catch(e){}
      try{const s=await db.collection('findPlayers').where('uid','==',uid).get();await Promise.all(s.docs.map(d=>d.ref.delete()));}catch(e){}
      try{const s=await db.collection('games').where('organizerUid','==',uid).get();await Promise.all(s.docs.map(d=>d.ref.delete()));}catch(e){}
      try{
        const s=await db.collection('games').get();
        await Promise.all(s.docs.map(async d=>{
          const pl=(d.data().players||[]).filter(p=>p.uid!==uid);
          if(pl.length!==(d.data().players||[]).length)await d.ref.update({players:pl});
        }));
      }catch(e){}
    }
    await auth.currentUser.delete();
    clearUnsubs();
    switchTab('home');
  };
  const handleFabStartGame=()=>{setShowFab(false);if(!user){handleNeedLogin(null);return;}switchTab('games');};
  const handleFabAvailable=()=>{setShowFab(false);if(!user){handleNeedLogin(null);return;}switchTab('players');};
  const handleFabQueue=()=>{setShowFab(false);if(!user){handleNeedLogin(null);return;}switchTab('courts');};

  // ── Loading
  if(user===undefined)return(
    <div className="app-shell" style={{alignItems:'center',justifyContent:'center'}}>
      <div style={{fontSize:'2.5rem',marginBottom:10}}>🏓</div>
      <div style={{fontSize:'0.82rem',color:'var(--muted)'}}>Loading…</div>
    </div>
  );

  // ── Auth screen (full page, inside app-shell so nav.js bars still show)
  if(showAuth)return(
    <div className="app-shell" style={{overflowY:'auto'}}>
      <AuthScreen onBack={()=>setShowAuth(false)}/>
    </div>
  );

  // ── New user profile setup
  if(user&&profile===null)return(
    <div className="app-shell">
      <ProfileSetup user={user} profile={null} onSave={p=>setProfile({uid:user.uid,...p})} uLat={uLat} uLng={uLng}/>
    </div>
  );

  return(
    <div className="app-shell">
      <div className="screen-body">
        {tab==='home'&&<HomeTab user={user} profile={profile} courts={courts} players={allPlayers} games={games} uLat={uLat} uLng={uLng} onChat={setChatP} onNeedLogin={handleNeedLogin} onSetTab={switchTab} onOpenCourt={openCourt}/>}
        {tab==='courts'&&<CourtsTab courts={courts} uLat={uLat} uLng={uLng} onOpenCourt={openCourt}/>}
        {tab==='court-detail'&&<CourtDetailPage courtId={courtId} onBack={()=>switchTab('courts')}/>}
        {tab==='games'&&<GamesTab user={user} profile={profile} games={games} onNeedLogin={handleNeedLogin} uLat={uLat} uLng={uLng}/>}
        {tab==='players'&&<PlayersTab user={user} posts={posts} players={allPlayers} onChat={setChatP} onNeedLogin={handleNeedLogin} uLat={uLat} uLng={uLng}/>}
        {tab==='profile'&&<ProfileTab user={user} profile={profile} unread={unread} onEditProfile={()=>setShowProfile(true)} onSignOut={handleSignOut} onGoAuth={handleGoAuth} onInbox={()=>setShowInbox(true)} onDeleteAccount={handleDeleteAccount}/>}
      </div>

      {/* FAB — only on home */}
      {tab==='home'&&<div className="fab-wrap">
        <div className={`fab ${showFab?'open':''}`} onClick={()=>setShowFab(!showFab)}>
          {showFab?'✕ Close':'🏓 I WANT TO PLAY'}
        </div>
      </div>}

      {showFab&&<FabSheet onClose={()=>setShowFab(false)} onStartGame={handleFabStartGame} onAvailable={handleFabAvailable} onQueue={handleFabQueue}/>}
      {loginPromptPlayer!==undefined&&<LoginPrompt player={loginPromptPlayer} onClose={()=>setLoginPromptPlayer(undefined)} onGoAuth={handleGoAuth}/>}
      {chatP&&user&&profile&&<ChatModal player={chatP} myUid={user.uid} myName={profile.name} onClose={()=>setChatP(null)}/>}
      {showInbox&&user&&<Inbox onClose={()=>setShowInbox(false)} onOpen={p=>{setChatP(p);setShowInbox(false);}} myUid={user.uid} allPlayers={allPlayers}/>}
      {showProfile&&user&&<ProfileSetup user={user} profile={profile} onSave={p=>{setProfile({uid:user.uid,...p});setShowProfile(false);}} onClose={()=>setShowProfile(false)} uLat={uLat} uLng={uLng}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script src="nav.js"></script>
<script src="fcm.js"></script>
</body>
</html>
