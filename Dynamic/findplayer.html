<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef,useMemo}=React;

const FB={apiKey:"AIzaSyDaFUszTD0-Ro292GOBSlS5vkZSdJM0NF4",authDomain:"pickleball-app-1bba7.firebaseapp.com",projectId:"pickleball-app-1bba7",storageBucket:"pickleball-app-1bba7.firebasestorage.app",messagingSenderId:"645604154338",appId:"1:645604154338:web:b92f87c2cd11d950b737bb"};
let db=null,auth=null,fbOk=false;
try{if(!firebase.apps.length)firebase.initializeApp(FB);db=firebase.firestore();auth=firebase.auth();fbOk=true;}catch(e){console.error('FB:',e);}

function haversine(a,b,c,d){const R=3958.8,dL=(c-a)*Math.PI/180,dN=(d-b)*Math.PI/180,x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dN/2)**2;return R*2*Math.asin(Math.sqrt(x));}
function timeAgo(t){if(!t)return '';const d=Date.now()-t,m=Math.floor(d/60000);if(m<1)return 'now';if(m<60)return m+'m';const h=Math.floor(m/60);if(h<24)return h+'h';return Math.floor(h/24)+'d';}
function fmtTime(ds,ts){if(!ds)return '';const d=new Date(ds+(ts?'T'+ts:''));const now=new Date();const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());const target=new Date(d.getFullYear(),d.getMonth(),d.getDate());const diff=Math.round((target-today)/86400000);let l=diff===0?'Today':diff===1?'Tomorrow':d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});if(ts){const[h,m]=ts.split(':').map(Number);l+=` ${h%12||12}:${m.toString().padStart(2,'0')}${h>=12?'PM':'AM'}`;}return l;}
function cid(a,b){return[a,b].sort().join('__');}

const SKILLS=['2.0-2.5','2.5-3.0','3.0-3.5','3.5-4.0','4.0-4.5','4.5-5.0','5.0+'];
const SKILL_L={'2.0-2.5':'Beginner','2.5-3.0':'Novice','3.0-3.5':'Intermediate','3.5-4.0':'Advanced','4.0-4.5':'Competitive','4.5-5.0':'Expert','5.0+':'Pro'};
const PTYPES=['Casual','Competitive','Tournament','Drilling','League'];
const PT_E={'Casual':'🎾','Competitive':'🔥','Tournament':'🏆','Drilling':'🎯','League':'🏅'};
const AVAIL=['Now','Today','This Week','Flexible'];
const PURPOSES=[{id:'play',label:'Looking to Play',emoji:'🏓'},{id:'partner',label:'Need a Partner',emoji:'🤝'},{id:'drill',label:'Drilling Session',emoji:'🎯'},{id:'group',label:'Group / Open Play',emoji:'👥'}];
const PU_TAG={'play':'t-green','partner':'t-blue','drill':'t-purple','group':'t-amber'};
const AV_CLS={'Now':'avail-now','Today':'avail-later','This Week':'avail-later','Flexible':'avail-flex'};
const AV_ICO={'Now':'⚡','Today':'📅','This Week':'🗓️','Flexible':'🤷'};

// ── Auth Screen ───────────────────────────────────────────────────────
function AuthScreen(){
    const[mode,setMode]=useState('signin'); // 'signin' | 'signup'
    const[email,setEmail]=useState('');const[pass,setPass]=useState('');const[confirm,setConfirm]=useState('');
    const[ld,setLd]=useState(false);const[err,setErr]=useState(null);
    const isFile=window.location.protocol==='file:';

    const googleAuth=async()=>{
        if(isFile){setErr('Open this page from a web server (http/https), not as a local file.');return;}
        setLd(true);setErr(null);
        const prov=new firebase.auth.GoogleAuthProvider();
        try{await auth.signInWithRedirect(prov);}
        catch(e){setErr(e.message);setLd(false);}
    };

    const facebookAuth=async()=>{
        if(isFile){setErr('Open this page from a web server (http/https), not as a local file.');return;}
        setLd(true);setErr(null);
        const prov=new firebase.auth.FacebookAuthProvider();
        prov.addScope('email');
        prov.addScope('public_profile');
        try{await auth.signInWithRedirect(prov);}
        catch(e){setErr(e.message);setLd(false);}
    };

    const emailAuth=async()=>{
        if(!email.trim()||!pass){setErr('Enter email and password.');return;}
        if(mode==='signup'&&pass!==confirm){setErr('Passwords do not match.');return;}
        if(mode==='signup'&&pass.length<6){setErr('Password must be at least 6 characters.');return;}
        setLd(true);setErr(null);
        try{
            if(mode==='signup')await auth.createUserWithEmailAndPassword(email.trim(),pass);
            else await auth.signInWithEmailAndPassword(email.trim(),pass);
        }catch(e){
            const msg={
                'auth/email-already-in-use':'An account with this email already exists. Sign in instead.',
                'auth/user-not-found':'No account found with this email.',
                'auth/wrong-password':'Incorrect password.',
                'auth/invalid-email':'Invalid email address.',
                'auth/too-many-requests':'Too many attempts. Try again later.',
            }[e.code]||e.message;
            setErr(msg);
        }
        setLd(false);
    };

    const forgotPw=async()=>{
        if(!email.trim()){setErr('Enter your email above first.');return;}
        try{await auth.sendPasswordResetEmail(email.trim());setErr(null);alert('Password reset email sent!');}
        catch(e){setErr(e.message);}
    };

    return(<div className="hero-bg">
        <div className="nav"><a href="index.html" style={{textDecoration:'none'}}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.6)" strokeWidth="2.5"><path d="M15 18l-6-6 6-6"/></svg></a><div className="nav-logo">🏓 PICKLECONNECT</div></div>
        <div className="auth-screen">
            <div style={{fontSize:56,marginBottom:12}}>🏓</div>
            <div className="fd" style={{fontSize:34,fontWeight:800,color:'white',marginBottom:6}}>FIND PLAYERS</div>
            <div style={{fontSize:14,color:'rgba(255,255,255,.65)',marginBottom:24,maxWidth:340,lineHeight:1.5}}>Connect with pickleball players near you. Post availability and chat privately.</div>

            {/* Tab toggle */}
            <div style={{display:'flex',background:'rgba(255,255,255,.12)',borderRadius:10,padding:3,marginBottom:20,width:'100%',maxWidth:340}}>
                {[['signin','Sign In'],['signup','Sign Up']].map(([k,l])=><button key={k} onClick={()=>{setMode(k);setErr(null);}} style={{flex:1,padding:'9px',border:'none',borderRadius:8,fontFamily:'Outfit',fontSize:13,fontWeight:700,cursor:'pointer',background:mode===k?'white':'transparent',color:mode===k?'#059669':'rgba(255,255,255,.75)',boxShadow:mode===k?'0 1px 4px rgba(0,0,0,.12)':'none'}}>{l}</button>)}
            </div>

            {/* Error */}
            {err&&<div style={{background:'rgba(239,68,68,.15)',border:'1px solid rgba(239,68,68,.3)',borderRadius:10,padding:'10px 14px',marginBottom:14,maxWidth:340,width:'100%',fontSize:12,color:'#fecaca',lineHeight:1.5,textAlign:'left'}}>⚠️ {err}</div>}

            {/* Email form */}
            <div style={{width:'100%',maxWidth:340,display:'flex',flexDirection:'column',gap:8}}>
                <input value={email} onChange={e=>setEmail(e.target.value)} type="email" placeholder="Email address" style={{padding:'11px 14px',borderRadius:10,border:'2px solid rgba(255,255,255,.2)',background:'rgba(255,255,255,.12)',color:'white',fontFamily:'Outfit',fontSize:14,outline:'none',width:'100%'}} onKeyDown={e=>e.key==='Enter'&&emailAuth()}/>
                <input value={pass} onChange={e=>setPass(e.target.value)} type="password" placeholder="Password" style={{padding:'11px 14px',borderRadius:10,border:'2px solid rgba(255,255,255,.2)',background:'rgba(255,255,255,.12)',color:'white',fontFamily:'Outfit',fontSize:14,outline:'none',width:'100%'}} onKeyDown={e=>e.key==='Enter'&&emailAuth()}/>
                {mode==='signup'&&<input value={confirm} onChange={e=>setConfirm(e.target.value)} type="password" placeholder="Confirm password" style={{padding:'11px 14px',borderRadius:10,border:'2px solid rgba(255,255,255,.2)',background:'rgba(255,255,255,.12)',color:'white',fontFamily:'Outfit',fontSize:14,outline:'none',width:'100%'}} onKeyDown={e=>e.key==='Enter'&&emailAuth()}/>}

// ── Chat ──────────────────────────────────────────────────────────────
function ChatModal({player,myUid,myName,onClose}){
    const[msgs,setMsgs]=useState([]);const[inp,setInp]=useState('');const[sending,setSending]=useState(false);const[err,setErr]=useState(null);
    const endRef=useRef(null);const c=cid(myUid,player.uid);
    useEffect(()=>{if(!fbOk)return;const u=db.collection('chatMessages').where('convoId','==',c).orderBy('timestamp','asc').onSnapshot(s=>{setMsgs(s.docs.map(d=>({id:d.id,...d.data()})));setTimeout(()=>endRef.current?.scrollIntoView({behavior:'smooth'}),100);},e=>{console.error('Chat listener:',e);setErr(e.message);});return()=>u();},[c]);
    useEffect(()=>{if(!fbOk||msgs.length===0)return;db.collection('conversations').doc(c).update({[`readBy_${myUid}`]:Date.now()}).catch(()=>{});},[c,msgs.length]);

    // Fixed send: try create first, catch duplicate → update
    const send=async()=>{if(!inp.trim()||sending)return;setSending(true);const now=Date.now(),txt=inp.trim();
        try{
            const ref=db.collection('conversations').doc(c);
            const convoData={participants:[myUid,player.uid].sort(),participantNames:{[myUid]:myName,[player.uid]:player.name},lastMessage:txt,lastMessageBy:myUid,lastTimestamp:now,[`readBy_${myUid}`]:now};
            // Try create. If convo exists, this fails with already-exists → then update.
            try{await ref.set({...convoData,createdAt:now});}
            catch(createErr){
                // Doc already exists, just update
                await ref.update({lastMessage:txt,lastMessageBy:myUid,lastTimestamp:now,[`participantNames.${myUid}`]:myName,[`readBy_${myUid}`]:now});
            }
            await db.collection('chatMessages').add({convoId:c,text:txt,senderUid:myUid,senderName:myName,timestamp:now});
            setInp('');
        }catch(e){alert('Send failed: '+e.message);}setSending(false);};

    return(<div className="mo" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
        <div className="ms" style={{display:'flex',flexDirection:'column',height:'80vh',padding:0}}>
            <div style={{padding:'12px 16px',borderBottom:'1px solid #e2e8f0',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
                <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer'}}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" strokeWidth="2.5"><path d="M15 18l-6-6 6-6"/></svg></button>
                {player.photoURL?<img src={player.photoURL} style={{width:32,height:32,borderRadius:'50%'}} referrerPolicy="no-referrer"/>:<div className="av-sm" style={{width:32,height:32,fontSize:13}}>{(player.name||'?')[0].toUpperCase()}</div>}
                <div style={{flex:1}}><div style={{fontWeight:700,fontSize:14}}>{player.name}</div><div style={{fontSize:11,color:'#64748b'}}>{player.skill}</div></div>
                <div className="sb" style={{padding:'3px 7px',fontSize:10}}>🔒 Private</div>
            </div>
            {err&&<div style={{padding:'8px 16px',background:'#fef2f2',fontSize:12,color:'#dc2626'}}>⚠️ {err}</div>}
            <div style={{flex:1,overflowY:'auto',padding:'12px 16px',display:'flex',flexDirection:'column',gap:3}}>
                {msgs.length===0&&!err&&<div style={{textAlign:'center',padding:'30px',color:'#94a3b8'}}><div style={{fontSize:28,marginBottom:6}}>💬</div><div style={{fontSize:13}}>Say hi to {player.name}!</div></div>}
                {msgs.map(m=><div key={m.id} style={{display:'flex',flexDirection:'column',alignItems:m.senderUid===myUid?'flex-end':'flex-start'}}><div className={`cb ${m.senderUid===myUid?'me':'them'}`}>{m.text}<div className="ct">{timeAgo(m.timestamp)}</div></div></div>)}
                <div ref={endRef}/>
            </div>
            <div style={{padding:'10px 16px',borderTop:'1px solid #e2e8f0',display:'flex',gap:8,alignItems:'flex-end',flexShrink:0,background:'white'}}>
                <textarea value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}} placeholder="Message…" rows={1} style={{flex:1,padding:'9px 12px',border:'2px solid #e2e8f0',borderRadius:10,fontFamily:'Outfit,sans-serif',fontSize:14,resize:'none',outline:'none',maxHeight:70}}/>
                <button className="btn-g" onClick={send} disabled={sending||!inp.trim()} style={{padding:'9px 16px',fontSize:13,opacity:(sending||!inp.trim())?.5:1}}>Send</button>
            </div>
        </div></div>);
}

// ── Inbox ─────────────────────────────────────────────────────────────
function Inbox({onClose,onOpen,myUid,players}){
    const[cs,setCs]=useState([]);const[ld,setLd]=useState(true);
    useEffect(()=>{if(!fbOk){setLd(false);return;}const u=db.collection('conversations').where('participants','array-contains',myUid).orderBy('lastTimestamp','desc').onSnapshot(s=>{setCs(s.docs.map(d=>({id:d.id,...d.data()})));setLd(false);},()=>setLd(false));return()=>u();},[]);
    const info=c=>{const ouid=c.participants.find(p=>p!==myUid);const nm=c.participantNames?.[ouid]||'Player';const rt=c[`readBy_${myUid}`]||0;return{ouid,nm,ur:c.lastMessageBy!==myUid&&c.lastTimestamp>rt};};
    const go=c=>{const{ouid,nm}=info(c);const mp=players.find(p=>p.uid===ouid);onOpen(mp||{uid:ouid,name:nm,skill:'',photoURL:null});onClose();};
    return(<div className="mo" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
        <div className="ms" style={{minHeight:'40vh'}}><div className="mh"/>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}><div className="fd" style={{fontSize:20,fontWeight:800}}>💬 MESSAGES</div><button onClick={onClose} style={{background:'#f1f5f9',border:'none',borderRadius:8,width:30,height:30,fontSize:14,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button></div>
            <div className="sb" style={{marginBottom:14}}>🔒 All chats are private 1-on-1</div>
            {ld?<div style={{textAlign:'center',padding:30,color:'#94a3b8'}}>Loading…</div>
            :cs.length===0?<div style={{textAlign:'center',padding:30,color:'#94a3b8'}}><div style={{fontSize:36,marginBottom:8}}>💬</div><div style={{fontWeight:700,color:'#374151'}}>No messages yet</div></div>
            :cs.map(c=>{const{nm,ur}=info(c);return(<div key={c.id} className={`ix ${ur?'ur':''}`} onClick={()=>go(c)}><div className="av-sm">{nm[0].toUpperCase()}</div><div style={{flex:1,minWidth:0}}><div style={{display:'flex',alignItems:'center',gap:6}}><span style={{fontWeight:ur?800:600,fontSize:14}}>{nm}</span>{ur&&<div style={{width:7,height:7,borderRadius:'50%',background:'#059669'}}/>}</div><div style={{fontSize:12,color:ur?'#334155':'#94a3b8',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{c.lastMessageBy===myUid?'You: ':''}{c.lastMessage}</div></div><div style={{fontSize:10,color:'#94a3b8'}}>{timeAgo(c.lastTimestamp)}</div></div>);})}
        </div></div>);
}

                                    return(<tr key={p.id}>
                                        <td><span className={`tag ${PU_TAG[p.purpose]||'t-green'}`}>{pu?.emoji} {pu?.label||'Play'}</span>{p.purpose==='partner'&&p.partnerGender&&<div style={{fontSize:9,color:'#64748b',marginTop:2}}>Seeking: {p.partnerGender}</div>}</td>
                                        <td><div style={{display:'flex',gap:3,flexWrap:'wrap'}}>{p.playTypes?.map(t=><span key={t} className="tag t-purple" style={{fontSize:9}}>{PT_E[t]} {t}</span>)}</div></td>
                                        <td><span className={`avail-pill ${AV_CLS[p.availability]||'avail-flex'}`}>{AV_ICO[p.availability]} {p.availability}</span>{p.availDate&&<div style={{fontSize:10,color:'#64748b',marginTop:2}}>{fmtTime(p.availDate,p.availTime)}</div>}</td>
                                        <td style={{fontSize:11,color:'#64748b'}}>{p.courtName||'—'}</td>
                                        <td style={{fontSize:11,maxWidth:160}}>{p.message?<span style={{color:'#334155'}}>"{p.message}"</span>:<span style={{color:'#cbd5e1'}}>—</span>}</td>
                                        {mine&&<td><div style={{display:'flex',gap:4}}><button className="btn-out" onClick={()=>onEdit(p)} style={{padding:'3px 8px',fontSize:10,borderWidth:1}}>Edit</button><button onClick={()=>onRemove(p.id)} style={{padding:'3px 8px',fontSize:10,border:'1px solid #fca5a5',background:'#fef2f2',color:'#dc2626',borderRadius:6,fontWeight:600,fontFamily:'Outfit',cursor:'pointer'}}>✕</button></div></td>}
                                    </tr>);
                                })}</tbody>
                            </table>
                        </div>

                        {/* Actions */}
                        <div style={{display:'flex',gap:8,paddingTop:8,borderTop:'1px solid #f1f5f9',alignItems:'center',flexWrap:'wrap'}}>
                            {!mine&&<button className="btn-g" onClick={()=>onChat(g)} style={{padding:'8px 18px',fontSize:13}}>💬 Send Message</button>}
                            {mine&&<button className="btn-g" onClick={()=>onEdit(null)} style={{padding:'8px 18px',fontSize:13}}>+ New Post</button>}
                            {g.duprId&&<a href={duprLink} target="_blank" style={{fontSize:12,color:'#059669',fontWeight:600,textDecoration:'none',display:'inline-flex',alignItems:'center',gap:4,padding:'8px 12px',border:'1.5px solid #a7f3d0',borderRadius:10,background:'#f0fdf4',whiteSpace:'nowrap'}}>
                                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                                DUPR: {g.duprId}
                            </a>}
                        </div>
                        <div style={{fontSize:10,color:'#94a3b8',marginTop:6}}>Latest post {timeAgo(g.posts[0]?.timestamp)} ago</div>
                    </div>
                </div>
            )}
        </div>
    );
}

function Skel(){return(<div style={{background:'white',borderRadius:14,padding:14,marginBottom:10}}><div style={{display:'flex',gap:14,alignItems:'center'}}><div className="skeleton" style={{width:46,height:46,borderRadius:'50%'}}/><div style={{flex:1}}><div className="skeleton" style={{height:16,width:'50%',marginBottom:6}}/><div className="skeleton" style={{height:12,width:'70%'}}/></div><div className="skeleton" style={{width:60,height:36,borderRadius:8}}/></div></div>);}

// ── Profile Pill Dropdown ─────────────────────────────────────────────
function ProfilePill({user,profile,onEdit,onSignOut}){
    const[open,setOpen]=useState(false);
    const ref=useRef(null);
    useEffect(()=>{
        const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
        document.addEventListener('mousedown',h);return()=>document.removeEventListener('mousedown',h);
    },[]);
    return(
        <div ref={ref} style={{position:'relative'}}>
            <button className="user-pill" onClick={()=>setOpen(o=>!o)}>
                {user.photoURL?<img src={user.photoURL} referrerPolicy="no-referrer"/>:<div style={{width:28,height:28,borderRadius:'50%',background:'rgba(255,255,255,.25)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,color:'white'}}>{profile.name[0]}</div>}
                <span>{profile.name.split(' ')[0]}</span>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" strokeWidth="3" style={{marginLeft:2}}><path d="M6 9l6 6 6-6"/></svg>
            </button>
            {open&&<div className="upd" onClick={()=>setOpen(false)}>
                <div style={{padding:'10px 14px 8px',borderBottom:'1px solid #f1f5f9'}}>
                    <div style={{fontSize:13,fontWeight:700,color:'#0f172a'}}>{profile.name}</div>
                    <div style={{fontSize:11,color:'#94a3b8'}}>{profile.skill}{profile.city?` · ${profile.city}`:''}</div>
                </div>
                <button className="upd-item" onClick={onEdit}>✏️ Edit Profile</button>
                <button className="upd-item danger" onClick={onSignOut}>↩ Sign Out</button>
            </div>}
        </div>
    );
}

// ── Main App ──────────────────────────────────────────────────────────
function App(){
    const[user,setUser]=useState(undefined);const[profile,setProfile]=useState(undefined);
    const[posts,setPosts]=useState([]);const[loading,setLoading]=useState(true);
    const[uLat,setULat]=useState(null);const[uLng,setULng]=useState(null);
    const[showPost,setShowPost]=useState(false);const[editP,setEditP]=useState(null);
    const[chatP,setChatP]=useState(null);const[showInbox,setShowInbox]=useState(false);
    const[showProfile,setShowProfile]=useState(false);const[unread,setUnread]=useState(0);
    const[search,setSearch]=useState('');const[tab,setTab]=useState('all');const[expanded,setExpanded]=useState(null);
    const[showF,setShowF]=useState(false);const[fSkill,setFS]=useState('');const[fType,setFT]=useState('');const[fGender,setFG]=useState('');const[fPurpose,setFP]=useState('');

    useEffect(()=>{
        if(!auth)return;
        // Handle Google redirect return
        auth.getRedirectResult().catch(()=>{});
        const u=auth.onAuthStateChanged(u=>{setUser(u||null);if(!u)setProfile(null);});
        return()=>u();
    },[]);
    useEffect(()=>{if(user===undefined||user===null)return;setProfile(undefined);if(!fbOk)return;const u=db.collection('profiles').doc(user.uid).onSnapshot(d=>{if(d.exists)setProfile({uid:user.uid,...d.data()});else setProfile(null);},()=>setProfile(null));return()=>u();},[user]);
    useEffect(()=>{if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{setULat(p.coords.latitude);setULng(p.coords.longitude);},()=>{},{enableHighAccuracy:false,timeout:8000,maximumAge:300000});},[]);
    useEffect(()=>{if(!fbOk){setLoading(false);return;}const c=Date.now()-7*24*60*60*1000;const u=db.collection('findPlayers').where('status','==','active').where('timestamp','>',c).orderBy('timestamp','desc').onSnapshot(s=>{setPosts(s.docs.map(d=>({id:d.id,...d.data()})));setLoading(false);},()=>setLoading(false));return()=>u();},[]);
    useEffect(()=>{if(!fbOk||!user)return;const u=db.collection('conversations').where('participants','array-contains',user.uid).onSnapshot(s=>{let c=0;s.docs.forEach(d=>{const x=d.data();if(x.lastMessageBy!==user.uid&&x.lastTimestamp>(x[`readBy_${user.uid}`]||0))c++;});setUnread(c);},()=>{});return()=>u();},[user]);

    const fCount=[fSkill,fType,fGender,fPurpose].filter(Boolean).length;
    const clearF=()=>{setFS('');setFT('');setFG('');setFP('');};

    // Filter individual posts, then group by uid
    const grouped=useMemo(()=>{
        let fp=[...posts];
        if(tab==='nearby'&&uLat)fp=fp.filter(p=>p.lat&&haversine(uLat,uLng,p.lat,p.lng)<=25);
        else if(tab==='now')fp=fp.filter(p=>p.availability==='Now'||p.availability==='Today');
        if(search.trim()){const q=search.toLowerCase();fp=fp.filter(p=>[p.name,p.courtName,p.city,p.message,p.skill].some(v=>(v||'').toLowerCase().includes(q)));}
        if(fSkill)fp=fp.filter(p=>p.skill===fSkill);
        if(fType)fp=fp.filter(p=>p.playTypes?.includes(fType));
        if(fGender)fp=fp.filter(p=>p.gender===fGender);
        if(fPurpose)fp=fp.filter(p=>p.purpose===fPurpose);

        // Group by uid
        const map={};
        fp.forEach(p=>{
            if(!map[p.uid])map[p.uid]={uid:p.uid,name:p.name,skill:p.skill,city:p.city,age:p.age,gender:p.gender,duprId:p.duprId,photoURL:p.photoURL,lat:p.lat,lng:p.lng,posts:[]};
            map[p.uid].posts.push(p);
            // Keep latest info
            if(p.timestamp>(map[p.uid]._ts||0)){map[p.uid]._ts=p.timestamp;map[p.uid].name=p.name;map[p.uid].skill=p.skill;map[p.uid].city=p.city;map[p.uid].photoURL=p.photoURL;map[p.uid].duprId=p.duprId;}
        });
        let arr=Object.values(map);
        arr.sort((a,b)=>{if(user&&a.uid===user.uid&&b.uid!==user.uid)return -1;if(user&&b.uid===user.uid&&a.uid!==user.uid)return 1;if(tab==='nearby'&&uLat&&a.lat&&b.lat)return haversine(uLat,uLng,a.lat,a.lng)-haversine(uLat,uLng,b.lat,b.lng);return(b._ts||0)-(a._ts||0);});
        return arr;
    },[posts,tab,search,fSkill,fType,fGender,fPurpose,uLat,uLng,user]);

    const signOut=async()=>{if(confirm('Sign out?'))await auth.signOut();};
    if(user===undefined||profile===undefined)return(<div className="hero-bg"><div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',color:'white'}}>Loading…</div></div>);
    if(!user)return <AuthScreen/>;
    if(profile===null)return(<div className="hero-bg" style={{background:'#f1f5f9'}}><div className="nav" style={{background:'#0f172a'}}><a href="index.html" style={{textDecoration:'none'}}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="2.5"><path d="M15 18l-6-6 6-6"/></svg></a><div className="nav-logo" style={{color:'white'}}>🏓 PICKLECONNECT</div></div><ProfileSetup user={user} profile={null} onSave={p=>setProfile({uid:user.uid,...p})}/></div>);

    return(
        <div className="hero-bg">
            <div className="nav">
                <a href="index.html" style={{textDecoration:'none'}}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.6)" strokeWidth="2.5"><path d="M15 18l-6-6 6-6"/></svg></a>
                <div className="nav-logo" style={{flex:1}}>🏓 PICKLECONNECT</div>
                <button onClick={()=>setShowInbox(true)} style={{background:'none',border:'none',cursor:'pointer',position:'relative',padding:4}}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" strokeWidth="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>{unread>0&&<div className="badge">{unread}</div>}</button>
                <ProfilePill user={user} profile={profile} onEdit={()=>setShowProfile(true)} onSignOut={signOut}/>
            </div>
            <div className="content">
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}><div className="page-title">Find Players</div><button className="post-btn" onClick={()=>{setEditP(null);setShowPost(true);}}>📢 Post Availability</button></div>

                <div style={{display:'flex',gap:10,marginBottom:12,alignItems:'center'}}>
                    <div style={{position:'relative',flex:1}}><svg style={{position:'absolute',left:14,top:'50%',transform:'translateY(-50%)'}} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><input className="search-input" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search name, court, city…"/></div>
                    <button className={`filter-btn ${showF||fCount?'active':''}`} onClick={()=>setShowF(!showF)}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>Filter{fCount>0&&` (${fCount})`}</button>
                </div>

                {showF&&<div className="fp fade-in" style={{animation:'fadeIn .2s'}}>
                    <div><div className="fp-label">Skill Level</div><div className="fp-pills"><button className={`fp-pill ${!fSkill?'s':''}`} onClick={()=>setFS('')}>All</button>{SKILLS.map(s=><button key={s} className={`fp-pill ${fSkill===s?'s':''}`} onClick={()=>setFS(fSkill===s?'':s)}>{s}</button>)}</div></div>
                    <div><div className="fp-label">Play Type</div><div className="fp-pills"><button className={`fp-pill ${!fType?'s':''}`} onClick={()=>setFT('')}>All</button>{PTYPES.map(t=><button key={t} className={`fp-pill ${fType===t?'s':''}`} onClick={()=>setFT(fType===t?'':t)}>{PT_E[t]} {t}</button>)}</div></div>
                    <div><div className="fp-label">Looking For</div><div className="fp-pills"><button className={`fp-pill ${!fPurpose?'s':''}`} onClick={()=>setFP('')}>All</button>{PURPOSES.map(p=><button key={p.id} className={`fp-pill ${fPurpose===p.id?'s':''}`} onClick={()=>setFP(fPurpose===p.id?'':p.id)}>{p.emoji} {p.label}</button>)}</div></div>
                    <div><div className="fp-label">Gender</div><div className="fp-pills" style={{marginBottom:0}}><button className={`fp-pill ${!fGender?'s':''}`} onClick={()=>setFG('')}>All</button>{['Male','Female','Non-binary'].map(g=><button key={g} className={`fp-pill ${fGender===g?'s':''}`} onClick={()=>setFG(fGender===g?'':g)}>{g}</button>)}</div></div>
                    {fCount>0&&<div style={{marginTop:10,textAlign:'right'}}><button onClick={clearF} style={{background:'none',border:'none',color:'#fca5a5',fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'Outfit'}}>✕ Clear all</button></div>}
                </div>}

                <div style={{display:'flex',gap:0,marginBottom:14,background:'rgba(255,255,255,.1)',borderRadius:10,padding:3}}>{[['all','🏓 All'],['now','⚡ Available Now'],['nearby','📍 Nearby']].map(([k,l])=><button key={k} onClick={()=>setTab(k)} style={{flex:1,padding:'8px',border:'none',borderRadius:8,fontFamily:'Outfit',fontSize:12,fontWeight:600,cursor:'pointer',background:tab===k?'white':'transparent',color:tab===k?'#059669':'rgba(255,255,255,.7)',boxShadow:tab===k?'0 1px 4px rgba(0,0,0,.1)':'none'}}>{l}</button>)}</div>

                <div style={{fontSize:12,color:'rgba(255,255,255,.5)',marginBottom:10,paddingLeft:4}}>{grouped.length} player{grouped.length!==1?'s':''} · {posts.filter(p=>p.status==='active').length} total posts</div>

                {loading?[1,2,3].map(i=><Skel key={i}/>)
                :grouped.length===0?<div style={{textAlign:'center',padding:'40px 16px'}}><div style={{fontSize:40,marginBottom:8}}>🏓</div><div style={{fontSize:16,fontWeight:700,color:'white',marginBottom:4}}>No players found</div><div style={{fontSize:13,color:'rgba(255,255,255,.6)',marginBottom:16}}>{search||fCount?'Try different filters':'Be the first!'}</div>{(search||fCount>0)?<button onClick={()=>{setSearch('');clearF();}} style={{background:'rgba(255,255,255,.15)',border:'none',borderRadius:10,padding:'8px 20px',color:'white',fontWeight:600,fontSize:13,cursor:'pointer',fontFamily:'Outfit'}}>Clear</button>:<button className="btn-g" onClick={()=>{setEditP(null);setShowPost(true);}}>📢 Post</button>}</div>
                :grouped.map(g=><PlayerCard key={g.uid} g={g} myUid={user.uid} uLat={uLat} uLng={uLng} onChat={setChatP} onEdit={p=>{setEditP(p);setShowPost(true);}} onRemove={async id=>{if(confirm('Remove?'))try{await db.collection('findPlayers').doc(id).update({status:'removed'});}catch(e){alert(e.message);}}} expanded={expanded===g.uid} onToggle={()=>setExpanded(expanded===g.uid?null:g.uid)}/>)}

                {/* Bottom links — distinct colors */}
                <div style={{display:'flex',gap:8,marginTop:16}}>
                    <a href="findgame.html" style={{flex:1,display:'flex',alignItems:'center',gap:10,background:'linear-gradient(135deg,#0f766e,#14b8a6)',borderRadius:12,padding:'14px 16px',textDecoration:'none',boxShadow:'0 4px 12px rgba(15,118,110,.3)'}}><span style={{fontSize:22}}>🎮</span><div><div className="fd" style={{fontSize:14,fontWeight:800,color:'white'}}>FIND A GAME</div><div style={{fontSize:10,color:'rgba(255,255,255,.7)'}}>Fill 4 spots · Play now</div></div></a>
                    <a href="index.html" style={{flex:1,display:'flex',alignItems:'center',gap:10,background:'linear-gradient(135deg,#1e40af,#3b82f6)',borderRadius:12,padding:'14px 16px',textDecoration:'none',boxShadow:'0 4px 12px rgba(30,64,175,.3)'}}><span style={{fontSize:22}}>🏟️</span><div><div className="fd" style={{fontSize:14,fontWeight:800,color:'white'}}>COURTS</div><div style={{fontSize:10,color:'rgba(255,255,255,.7)'}}>Find courts</div></div></a>
                </div>
                <div style={{textAlign:'center',marginTop:20,height:8}}></div>
            </div>
            <button className="fab" onClick={()=>{setEditP(null);setShowPost(true);}} title="Post Availability">+</button>
            {showPost&&<PostForm profile={profile} onClose={()=>{setShowPost(false);setEditP(null);}} onPosted={()=>{setShowPost(false);setEditP(null);}} editData={editP} uLat={uLat} uLng={uLng}/>}
            {chatP&&<ChatModal player={chatP} myUid={user.uid} myName={profile.name} onClose={()=>setChatP(null)}/>}
            {showInbox&&<Inbox onClose={()=>setShowInbox(false)} onOpen={setChatP} myUid={user.uid} players={posts}/>}
            {showProfile&&<ProfileSetup user={user} profile={profile} onSave={p=>{setProfile({uid:user.uid,...p});setShowProfile(false);}} onClose={()=>setShowProfile(false)}/>}
        </div>
    );
}
ReactDOM.render(<App/>,document.getElementById('root'));
</script>
    <script src="nav.js"></script>
<script src="nav.js"></script>
</body>
</html>
