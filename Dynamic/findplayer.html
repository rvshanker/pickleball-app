<!--
  ENCRYPTION NOTE: For future end-to-end encryption of chat messages,
  implement the Signal Protocol (or libsodium box/secretbox):
  1. Each user generates an X25519 keypair on sign-up, stores public key in their profile
  2. On first message, derive a shared secret via ECDH (sender private + receiver public)
  3. Encrypt message text client-side with XChaCha20-Poly1305 before writing to Firestore
  4. Store ciphertext + nonce in chatMessages.text field; decrypt client-side on read
  5. Firestore only ever stores encrypted blobs — server/admin cannot read messages

function haversine(a,b,c,d){const R=3958.8,dL=(c-a)*Math.PI/180,dN=(d-b)*Math.PI/180,x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dN/2)**2;return R*2*Math.asin(Math.sqrt(x));}

function AuthScreen(){

// ── Main App ──────────────────────────────────────────────────────────
function App(){
    const[user,setUser]=useState(undefined);
    const[profile,setProfile]=useState(null);
    const[players,setPlayers]=useState([]);const[loading,setLoading]=useState(true);
    const[uLat,setULat]=useState(null);const[uLng,setULng]=useState(null);
    const[showPost,setShowPost]=useState(false);const[editP,setEditP]=useState(null);
    const[chatP,setChatP]=useState(null);const[showInbox,setShowInbox]=useState(false);
    const[showProfile,setShowProfile]=useState(false);
    const[unread,setUnread]=useState(0);
    const[search,setSearch]=useState('');const[tab,setTab]=useState('all');
    const[expanded,setExpanded]=useState(null);
    // Filters
    const[showF,setShowF]=useState(false);
    const[fSkill,setFS]=useState('');const[fType,setFT]=useState('');const[fGender,setFG]=useState('');const[fPurpose,setFP]=useState('');

    useEffect(()=>{if(!auth)return;const u=auth.onAuthStateChanged(u=>{setUser(u||null);});auth.getRedirectResult().catch(()=>{});return()=>u();},[]);
    useEffect(()=>{if(!user||!fbOk)return;const u=db.collection('profiles').doc(user.uid).onSnapshot(d=>{if(d.exists)setProfile({uid:user.uid,...d.data()});else setProfile(null);},()=>setProfile(null));return()=>u();},[user]);
    useEffect(()=>{if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{setULat(p.coords.latitude);setULng(p.coords.longitude);},()=>{},{enableHighAccuracy:false,timeout:8000,maximumAge:300000});},[]);
    useEffect(()=>{if(!fbOk){setLoading(false);return;}const c=Date.now()-7*24*60*60*1000;const u=db.collection('findPlayers').where('status','==','active').where('timestamp','>',c).orderBy('timestamp','desc').onSnapshot(s=>{setPlayers(s.docs.map(d=>({id:d.id,...d.data()})));setLoading(false);},()=>setLoading(false));return()=>u();},[]);
    useEffect(()=>{if(!fbOk||!user)return;const u=db.collection('conversations').where('participants','array-contains',user.uid).onSnapshot(s=>{let c=0;s.docs.forEach(d=>{const x=d.data();if(x.lastMessageBy!==user.uid&&x.lastTimestamp>(x[`readBy_${user.uid}`]||0))c++;});setUnread(c);},()=>{});return()=>u();},[user]);

    const fCount=[fSkill,fType,fGender,fPurpose].filter(Boolean).length;
    const clearFilters=()=>{setFS('');setFT('');setFG('');setFP('');};

    const filtered=useMemo(()=>{
        let l=[...players];
        if(tab==='nearby'&&uLat)l=l.filter(p=>p.lat&&haversine(uLat,uLng,p.lat,p.lng)<=25);
        else if(tab==='now')l=l.filter(p=>p.availability==='Now'||p.availability==='Today');
        if(search.trim()){const q=search.toLowerCase();l=l.filter(p=>[p.name,p.courtName,p.city,p.message,p.skill].some(v=>(v||'').toLowerCase().includes(q)));}
        if(fSkill)l=l.filter(p=>p.skill===fSkill);
        if(fType)l=l.filter(p=>p.playTypes?.includes(fType));
        if(fGender)l=l.filter(p=>p.gender===fGender);
        if(fPurpose)l=l.filter(p=>p.purpose===fPurpose);
        l.sort((a,b)=>{if(user&&a.uid===user.uid&&b.uid!==user.uid)return -1;if(user&&b.uid===user.uid&&a.uid!==user.uid)return 1;if(tab==='nearby'&&uLat&&a.lat&&b.lat)return haversine(uLat,uLng,a.lat,a.lng)-haversine(uLat,uLng,b.lat,b.lng);return b.timestamp-a.timestamp;});
        return l;
    },[players,tab,search,fSkill,fType,fGender,fPurpose,uLat,uLng,user]);

    const signOut=async()=>{if(confirm('Sign out?'))await auth.signOut();};

    if(user===undefined)return(<div className="hero-bg"><div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',color:'white',fontSize:18}}>Loading…</div></div>);
    if(!user)return <AuthScreen/>;
    if(profile===null)return(<div className="hero-bg" style={{background:'#f1f5f9'}}><div className="nav" style={{background:'#0f172a'}}><a href="index.html" style={{display:'flex',alignItems:'center',textDecoration:'none'}}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="2.5"><path d="M15 18l-6-6 6-6"/></svg></a><div className="nav-logo" style={{color:'white'}}>🏓 PICKLECONNECT</div></div><ProfileSetup user={user} profile={null} onSave={p=>setProfile({uid:user.uid,...p})}/></div>);

    const myPosts=players.filter(p=>p.uid===user.uid);

    return(
        <div className="hero-bg">
            {/* Nav */}
            <div className="nav">
                <a href="index.html" style={{display:'flex',alignItems:'center',textDecoration:'none'}}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.6)" strokeWidth="2.5"><path d="M15 18l-6-6 6-6"/></svg></a>
                <div className="nav-logo" style={{flex:1}}>🏓 PICKLECONNECT</div>
                <button onClick={()=>setShowInbox(true)} style={{background:'none',border:'none',cursor:'pointer',position:'relative',padding:4}}>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" strokeWidth="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                    {unread>0&&<div className="badge">{unread}</div>}
                </button>
                <button className="user-pill" onClick={()=>setShowProfile(true)}>
                    {user.photoURL?<img src={user.photoURL} referrerPolicy="no-referrer"/>:<div style={{width:28,height:28,borderRadius:'50%',background:'rgba(255,255,255,.2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,color:'white'}}>{profile.name[0]}</div>}
                    <span>{profile.name.split(' ')[0]}</span>
                </button>
            </div>

            <div className="content">
                {/* Title + Post button */}
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
                    <div className="page-title">Find Players</div>
                    <button className="post-btn" onClick={()=>{setEditP(null);setShowPost(true);}}>
                        📢 Post Availability
                    </button>
                </div>

                {/* My active posts count */}
                {myPosts.length>0&&<div style={{background:'rgba(255,255,255,.12)',backdropFilter:'blur(4px)',borderRadius:10,padding:'10px 14px',marginBottom:12,display:'flex',alignItems:'center',gap:8}}>
                    <span style={{fontSize:11,color:'rgba(255,255,255,.7)'}}>You have <strong style={{color:'white'}}>{myPosts.length}</strong> active post{myPosts.length!==1?'s':''}. Tap to expand & edit.</span>
                    <button onClick={()=>{setEditP(null);setShowPost(true);}} style={{marginLeft:'auto',background:'rgba(255,255,255,.2)',border:'none',borderRadius:8,padding:'5px 12px',fontSize:11,fontWeight:700,color:'white',cursor:'pointer',fontFamily:'Outfit'}}>+ New</button>
                </div>}

                {/* Search + Filter */}
                <div className="search-bar">
                    <div style={{position:'relative',flex:1}}>
                        <svg style={{position:'absolute',left:14,top:'50%',transform:'translateY(-50%)'}} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                        <input className="search-input" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search by name, court, city…"/>
                    </div>
                    <button className={`filter-btn ${showF||fCount>0?'active':''}`} onClick={()=>setShowF(!showF)}>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
                        Filter{fCount>0&&` (${fCount})`}
                    </button>
                </div>

                {/* Filter panel — restored with all filters */}
                {showF&&<div className="filter-panel fade-in">
                    <div className="fp-row"><div className="fp-label">Skill Level</div><div className="fp-pills">
                        <button className={`fp-pill ${!fSkill?'s':''}`} onClick={()=>setFS('')}>All</button>
                        {SKILLS.map(s=><button key={s} className={`fp-pill ${fSkill===s?'s':''}`} onClick={()=>setFS(fSkill===s?'':s)}>{s}</button>)}
                    </div></div>
                    <div className="fp-row"><div className="fp-label">Play Type</div><div className="fp-pills">
                        <button className={`fp-pill ${!fType?'s':''}`} onClick={()=>setFT('')}>All</button>
                        {PTYPES.map(t=><button key={t} className={`fp-pill ${fType===t?'s':''}`} onClick={()=>setFT(fType===t?'':t)}>{PT_E[t]} {t}</button>)}
                    </div></div>
                    <div className="fp-row"><div className="fp-label">Looking For</div><div className="fp-pills">
                        <button className={`fp-pill ${!fPurpose?'s':''}`} onClick={()=>setFP('')}>All</button>
                        {PURPOSES.map(p=><button key={p.id} className={`fp-pill ${fPurpose===p.id?'s':''}`} onClick={()=>setFP(fPurpose===p.id?'':p.id)}>{p.emoji} {p.label}</button>)}
                    </div></div>
                    <div className="fp-row" style={{marginBottom:0}}><div className="fp-label">Gender</div><div className="fp-pills">
                        <button className={`fp-pill ${!fGender?'s':''}`} onClick={()=>setFG('')}>All</button>
                        {['Male','Female','Non-binary'].map(g=><button key={g} className={`fp-pill ${fGender===g?'s':''}`} onClick={()=>setFG(fGender===g?'':g)}>{g}</button>)}
                    </div></div>
                    {fCount>0&&<div style={{marginTop:10,textAlign:'right'}}><button onClick={clearFilters} style={{background:'none',border:'none',color:'#fca5a5',fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'Outfit'}}>✕ Clear all filters</button></div>}
                </div>}

                {/* Tabs */}
                <div style={{display:'flex',gap:0,marginBottom:14,background:'rgba(255,255,255,.1)',borderRadius:10,padding:3}}>
                    {[['all','🏓 All'],['now','⚡ Available Now'],['nearby','📍 Nearby']].map(([k,l])=>(
                        <button key={k} onClick={()=>setTab(k)} style={{flex:1,padding:'8px',border:'none',borderRadius:8,fontFamily:'Outfit',fontSize:12,fontWeight:600,cursor:'pointer',background:tab===k?'white':'transparent',color:tab===k?'#059669':'rgba(255,255,255,.7)',boxShadow:tab===k?'0 1px 4px rgba(0,0,0,.1)':'none'}}>{l}</button>
                    ))}
                </div>

                {/* Count */}
                <div style={{fontSize:12,color:'rgba(255,255,255,.5)',marginBottom:10,paddingLeft:4}}>{filtered.length} player{filtered.length!==1?'s':''} found</div>

                {/* Player list */}
                {loading?<>{[1,2,3].map(i=><Skel key={i}/>)}</>
                :filtered.length===0?<div style={{textAlign:'center',padding:'40px 16px'}}><div style={{fontSize:40,marginBottom:8}}>🏓</div><div style={{fontSize:16,fontWeight:700,color:'white',marginBottom:4}}>No players found</div><div style={{fontSize:13,color:'rgba(255,255,255,.6)',marginBottom:16}}>{search||fCount?'Try different filters':'Be the first to post!'}</div>{(search||fCount>0)?<button onClick={()=>{setSearch('');clearFilters();}} style={{background:'rgba(255,255,255,.15)',border:'none',borderRadius:10,padding:'8px 20px',color:'white',fontWeight:600,fontSize:13,cursor:'pointer',fontFamily:'Outfit'}}>Clear Filters</button>:<button className="btn-g" onClick={()=>{setEditP(null);setShowPost(true);}}>📢 Post Availability</button>}</div>
                :filtered.map(p=><PlayerCard key={p.id} p={p} myUid={user.uid} uLat={uLat} uLng={uLng} onChat={setChatP} onEdit={p=>{setEditP(p);setShowPost(true);}} onRemove={async id=>{if(confirm('Remove this post?'))try{await db.collection('findPlayers').doc(id).update({status:'removed'});}catch(e){alert(e.message);}}} expanded={expanded===p.id} onToggle={()=>setExpanded(expanded===p.id?null:p.id)}/>)}

                {/* Quick links — DISTINCT COLORS */}
                <div style={{display:'flex',gap:8,marginTop:16}}>
                    <a href="index.html" style={{flex:1,display:'flex',alignItems:'center',gap:10,background:'linear-gradient(135deg,#1e40af,#3b82f6)',borderRadius:12,padding:'14px 16px',textDecoration:'none',boxShadow:'0 4px 12px rgba(30,64,175,.3)'}}>
                        <span style={{fontSize:22}}>🏟️</span>
                        <div><div className="fd" style={{fontSize:14,fontWeight:800,color:'white'}}>COURTS</div><div style={{fontSize:10,color:'rgba(255,255,255,.7)'}}>Find courts near you</div></div>
                    </a>
                    <a href="tournament.html" style={{flex:1,display:'flex',alignItems:'center',gap:10,background:'linear-gradient(135deg,#7c3aed,#a78bfa)',borderRadius:12,padding:'14px 16px',textDecoration:'none',boxShadow:'0 4px 12px rgba(124,58,237,.3)'}}>
                        <span style={{fontSize:22}}>🏆</span>
                        <div><div className="fd" style={{fontSize:14,fontWeight:800,color:'white'}}>TOURNAMENTS</div><div style={{fontSize:10,color:'rgba(255,255,255,.7)'}}>Brackets & scoring</div></div>
                    </a>
                </div>

                {/* Sign out */}
                <div style={{textAlign:'center',marginTop:20}}>
                    <button onClick={signOut} style={{background:'none',border:'none',color:'rgba(255,255,255,.4)',fontSize:12,cursor:'pointer',fontFamily:'Outfit'}}>Sign Out</button>
                </div>
            </div>

            {/* FAB */}
            <button className="fab" onClick={()=>{setEditP(null);setShowPost(true);}} title="Post Availability">+</button>

            {/* Modals */}
            {showPost&&<PostForm profile={profile} onClose={()=>{setShowPost(false);setEditP(null);}} onPosted={()=>{setShowPost(false);setEditP(null);}} editData={editP} uLat={uLat} uLng={uLng}/>}
            {chatP&&<ChatModal player={chatP} myUid={user.uid} myName={profile.name} onClose={()=>setChatP(null)}/>}
            {showInbox&&<Inbox onClose={()=>setShowInbox(false)} onOpen={setChatP} myUid={user.uid} players={players}/>}
            {showProfile&&<ProfileSetup user={user} profile={profile} onSave={p=>{setProfile({uid:user.uid,...p});setShowProfile(false);}} onClose={()=>setShowProfile(false)}/>}
        </div>
    );
}
ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
