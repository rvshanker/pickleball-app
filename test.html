<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PickleConnect — DB Test</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
  body{font-family:sans-serif;background:#0D1B2A;color:#F0F4F8;padding:20px;}
  .row{background:#1A2B3C;border:1px solid #2a3b4c;border-radius:8px;padding:10px 14px;margin-bottom:8px;}
  .ok{color:#2ECC71;font-weight:700;}
  .err{color:#F75B5B;font-weight:700;}
  pre{white-space:pre-wrap;word-break:break-word;background:#142232;padding:10px;border-radius:8px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect} = React;

const FB = {
  apiKey: "AIzaSyDaFUszTD0-Ro292GOBSlS5vkZSdJM0NF4",
  authDomain: "pickleball-app-1bba7.firebaseapp.com",
  projectId: "pickleball-app-1bba7",
  storageBucket: "pickleball-app-1bba7.firebasestorage.app",
  messagingSenderId: "645604154338",
  appId: "1:645604154338:web:b92f87c2cd11d950b737bb"
};

function Test(){
  const [status, setStatus] = useState('Connecting to Firebase...');
  const [courts, setCourts] = useState(null);
  const [error, setError] = useState(null);

  useEffect(() => {
    try {
      if (!firebase.apps.length) firebase.initializeApp(FB);
      setStatus('Firebase initialized. Querying "courts" collection...');
      const db = firebase.firestore();
      db.collection('courts').limit(10).get()
        .then(snap => {
          setStatus('Query finished.');
          setCourts(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        })
        .catch(e => {
          setStatus('Query failed.');
          setError(e.code + ': ' + e.message);
        });
    } catch (e) {
      setStatus('Firebase init failed.');
      setError(e.message);
    }
  }, []);

  return (
    <div>
      <h2>🏓 PickleConnect — DB Test Page</h2>
      <p>If you can read this, React mounted successfully.</p>
      <div className="row">
        <strong>Status:</strong> {status}
      </div>
      {error && <div className="row err">Error: {error}</div>}
      {courts && (
        <div className="row">
          <div className="ok">✓ Got {courts.length} court doc(s) from Firestore</div>
          <pre>{JSON.stringify(courts, null, 2)}</pre>
        </div>
      )}
      {courts && courts.length === 0 && (
        <div className="row">Query succeeded but the "courts" collection is empty.</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Test />);
</script>
</body>
</html>
