<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India Price Compare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .card { background-color: #1e293b; border: 1px solid #334155; transition: transform 0.2s; }
        .card:hover { transform: translateY(-2px); border-color: #475569; }
        .price-row { transition: background 0.15s; }
        .price-row:hover { background: #334155; }
        .lowest { background: #064e3b !important; color: #6ee7b7 !important; font-weight: 600; }
        .out-of-stock { color: #f87171; font-style: italic; }
        .loader { border-top-color: #3b82f6; animation: spinner 0.6s linear infinite; }
        @keyframes spinner { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-8 font-sans">

    <div class="max-w-3xl mx-auto">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-white mb-2">PriceTrack <span class="text-blue-500">India</span></h1>
            <p class="text-slate-400 text-sm">Catalog-backed price comparison · Updated every 6 hours</p>
        </header>

        <div class="flex flex-col sm:flex-row gap-3 mb-8">
            <input id="searchInput" type="text" value="iphone 16" placeholder="Try: iphone 16, samsung s24, oneplus 13"
                   class="flex-1 p-4 rounded-xl bg-slate-800 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 text-white font-medium">
            <button id="searchBtn" onclick="runSearch()"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-xl font-bold transition-all shadow-lg active:scale-95">
                Search
            </button>
        </div>

        <div id="statusArea" class="flex items-center justify-center gap-3 mb-6 hidden">
            <div class="loader w-5 h-5 border-2 border-slate-700 rounded-full"></div>
            <span class="text-sm text-slate-400">Searching catalog...</span>
        </div>

        <div id="results" class="space-y-4"></div>

        <div id="emptyState" class="text-center text-slate-500 text-sm mt-8 hidden">
            No products found. The catalog is small for now — try iphone, samsung, oneplus.
        </div>
    </div>

    <script>
        // The searchCatalog Cloud Function URL.
        // Set up a hosting rewrite for /search → searchCatalog and use that:
        const SEARCH_URL = "/search?q=";

        // Allow the input box to trigger search on Enter
        document.getElementById('searchInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') runSearch();
        });

        async function runSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const resultsDiv = document.getElementById('results');
            const statusArea = document.getElementById('statusArea');
            const emptyState = document.getElementById('emptyState');
            const searchBtn = document.getElementById('searchBtn');

            resultsDiv.innerHTML = "";
            emptyState.classList.add('hidden');
            statusArea.classList.remove('hidden');
            searchBtn.disabled = true;
            searchBtn.classList.add('opacity-50');

            try {
                const response = await fetch(SEARCH_URL + encodeURIComponent(query));
                const data = await response.json();

                console.log('Search results:', data);

                if (!data.results || data.results.length === 0) {
                    emptyState.classList.remove('hidden');
                } else {
                    data.results.forEach(product => renderProduct(product));
                }
            } catch (err) {
                console.error('Search failed:', err);
                emptyState.classList.remove('hidden');
                emptyState.innerText = "Search failed. Try again in a moment.";
            }

            statusArea.classList.add('hidden');
            searchBtn.disabled = false;
            searchBtn.classList.remove('opacity-50');
        }

        function renderProduct(product) {
            const resultsDiv = document.getElementById('results');
            const fmt = (n) => '₹' + new Intl.NumberFormat('en-IN').format(n);

            // Find lowest price across in-stock prices
            const inStockPrices = Object.entries(product.prices || {})
                .filter(([_, p]) => p.inStock !== false && p.price);
            const lowestPrice = inStockPrices.length > 0
                ? Math.min(...inStockPrices.map(([_, p]) => p.price))
                : null;

            // Build price rows
            const sites = ['amazon', 'flipkart'];
            const rowsHtml = sites.map(site => {
                const p = product.prices?.[site];
                if (!p) {
                    return `
                        <div class="price-row p-3 rounded flex justify-between items-center">
                            <span class="text-slate-500 uppercase text-xs">${site}</span>
                            <span class="text-slate-500 text-sm">no data yet</span>
                        </div>
                    `;
                }
                const isLowest = lowestPrice && p.price === lowestPrice && p.inStock !== false;
                const cls = isLowest ? 'price-row lowest' : 'price-row';
                const stockHtml = p.inStock === false
                    ? '<span class="out-of-stock text-xs">out of stock</span>'
                    : '';
                return `
                    <a href="${p.url}" target="_blank" rel="noopener noreferrer" class="${cls} p-3 rounded flex justify-between items-center no-underline text-current">
                        <span class="uppercase text-xs">${site}</span>
                        <span class="flex items-center gap-2">
                            ${stockHtml}
                            <strong>${fmt(p.price)}</strong>
                        </span>
                    </a>
                `;
            }).join('');

            const lastUpdated = product.lastRefreshedAt
                ? formatRelative(product.lastRefreshedAt)
                : 'never';

            const html = `
                <div class="card p-5 rounded-2xl">
                    <h3 class="text-md font-semibold text-slate-100 mb-3">${escapeHtml(product.displayName)}</h3>
                    <div class="space-y-2">${rowsHtml}</div>
                    <div class="text-[10px] text-slate-500 mt-3 text-right">prices updated ${lastUpdated}</div>
                </div>
            `;
            resultsDiv.insertAdjacentHTML('beforeend', html);
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function formatRelative(ts) {
            const diff = Date.now() - ts;
            const mins = Math.floor(diff / 60000);
            if (mins < 1) return 'just now';
            if (mins < 60) return `${mins}m ago`;
            const hrs = Math.floor(mins / 60);
            if (hrs < 24) return `${hrs}h ago`;
            return `${Math.floor(hrs / 24)}d ago`;
        }
    </script>
</body>
</html>
