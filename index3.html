<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Pickleball Scheduler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bye-badge { background-color: #fee2e2; color: #991b1b; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; }
        .match-card { transition: all 0.2s; }
        .match-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="bg-gray-100 p-4 md:p-8">
    <div class="max-w-5xl mx-auto bg-white p-6 rounded-xl shadow-lg">
        <h1 class="text-3xl font-extrabold text-gray-800 mb-6">Pickleball Rotation Pro</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-blue-50 p-4 rounded-lg">
                <label class="block text-sm font-bold text-blue-900 mb-2">Number of Players</label>
                <input type="number" id="playerCount" value="15" min="4" 
                       class="w-full p-2 border border-blue-200 rounded focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div class="bg-green-50 p-4 rounded-lg">
                <label class="block text-sm font-bold text-green-900 mb-2">Number of Rounds</label>
                <input type="number" id="roundCount" value="10" min="1" 
                       class="w-full p-2 border border-green-200 rounded focus:ring-2 focus:ring-green-500 outline-none">
            </div>
        </div>

        <button onclick="generateUniversalSchedule()" 
                class="w-full bg-slate-800 text-white font-bold py-3 rounded-lg hover:bg-slate-900 transition shadow-md">
            Generate Balanced Schedule
        </button>

        <div id="scheduleOutput" class="mt-10 space-y-8"></div>
    </div>

    <script>
        function generateUniversalSchedule() {
            const count = parseInt(document.getElementById('playerCount').value);
            const rounds = parseInt(document.getElementById('roundCount').value);
            
            // 1. Create Player Array
            let players = Array.from({length: count}, (_, i) => `Player ${i + 1}`);
            
            // 2. If odd, add a "Ghost" player to handle Byes
            const isOdd = count % 2 !== 0;
            if (isOdd) players.push("BYE_GHOST");

            const n = players.length;
            const schedule = [];

            // 3. Circle Rotation Algorithm
            // We keep players[0] fixed and rotate the rest
            let circle = [...players];

            for (let r = 0; r < rounds; r++) {
                const roundMatches = [];
                const playersSittingOut = [];

                // Pair players from outside-in (0 with n-1, 1 with n-2...)
                for (let i = 0; i < n / 2; i++) {
                    const p1 = circle[i];
                    const p2 = circle[n - 1 - i];

                    if (p1 === "BYE_GHOST") {
                        playersSittingOut.push(p2);
                    } else if (p2 === "BYE_GHOST") {
                        playersSittingOut.push(p1);
                    } else {
                        roundMatches.push([p1, p2]);
                    }
                }

                // Convert Singles pairs into Doubles matches
                const doublesMatches = [];
                for (let j = 0; j < roundMatches.length; j += 2) {
                    if (j + 1 < roundMatches.length) {
                        doublesMatches.push({
                            team1: roundMatches[j],
                            team2: roundMatches[j+1]
                        });
                    } else {
                        // If there's an extra pair (common in odd counts), 
                        // those 2 players must also sit out or play singles
                        playersSittingOut.push(...roundMatches[j]);
                    }
                }

                schedule.push({
                    round: r + 1,
                    matches: doublesMatches,
                    byes: playersSittingOut
                });

                // 4. Rotate the circle (keep first element fixed)
                const fixed = circle[0];
                const shifters = circle.slice(1);
                shifters.unshift(shifters.pop()); // Move last to front of shiftable group
                circle = [fixed, ...shifters];
            }

            render(schedule);
        }

        function render(schedule) {
            const output = document.getElementById('scheduleOutput');
            output.innerHTML = schedule.map(r => `
                <div class="border-l-4 border-slate-800 pl-4">
                    <div class="flex flex-wrap items-center gap-3 mb-4">
                        <h3 class="text-xl font-black text-slate-800 tracking-tight">ROUND ${r.round}</h3>
                        ${r.byes.map(b => `<span class="bye-badge">Waiting: ${b}</span>`).join('')}
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${r.matches.map(m => `
                            <div class="match-card bg-white border border-gray-200 p-4 rounded-lg flex flex-col items-center justify-center gap-2">
                                <div class="text-sm font-bold text-blue-600">${m.team1[0]} & ${m.team1[1]}</div>
                                <div class="text-[10px] font-black text-gray-400">VS</div>
                                <div class="text-sm font-bold text-red-600">${m.team2[0]} & ${m.team2[1]}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
