// ── Storage (Firestore, with on-device fallback) ──────────────────────
const LS = id => 'league:'+id;
const lsGet = id => {try{return JSON.parse(localStorage.getItem(LS(id)));}catch(e){return null;}};
const lsSet = d => {try{localStorage.setItem(LS(d.id),JSON.stringify(d));}catch(e){}};
const localSubs = {};
function applyPatch(d,patch){
    const n={...d};
    Object.entries(patch).forEach(([k,v])=>{
        if(k.startsWith('scores.'))n.scores={...(n.scores||{}),[k.slice(7)]:v};
        else n[k]=v;
    });
    return n;
}
const store = {
    async create(d){
        if(fbOk)try{await db.collection('leagues').doc(d.id).set(d);return'cloud';}catch(e){console.warn('Cloud save failed, using this device:',e.code||e.message);}
        lsSet({...d,_local:true});return'local';
    },
    listen(id,cb){
        const local=lsGet(id);
        if(local&&local._local||!fbOk){
            const fn=d=>cb(d?{...d,_src:'local'}:null);
            (localSubs[id]=localSubs[id]||[]).push(fn);fn(local);
            return()=>{localSubs[id]=(localSubs[id]||[]).filter(f=>f!==fn);};
        }
        return db.collection('leagues').doc(id).onSnapshot(
            doc=>cb(doc.exists?{...doc.data(),_src:'cloud'}:null),
            err=>{console.warn('listen failed',err.code);cb({_error:err.code||'error'});}
        );
    },
    async update(league,patch){
        patch={...patch,updatedAt:Date.now()};
        if(league._src==='local'){
            const n=applyPatch(lsGet(league.id)||league,patch);lsSet(n);
            (localSubs[league.id]||[]).forEach(f=>f(n));return;
        }
        await db.collection('leagues').doc(league.id).update(patch);
    },
    async mine(uid,email){
        // Give up on the cloud after 12s so the list never spins forever
        const withTimeout=p=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),12000))]);
        const out=[];
        if(fbOk&&uid)try{(await withTimeout(db.collection('leagues').where('createdBy','==',uid).get())).docs.forEach(d=>out.push(d.data()));}catch(e){console.warn('list failed',e.code);}
        if(fbOk&&email)try{(await withTimeout(db.collection('leagues').where('adminEmails','array-contains',lc(email)).get())).docs.forEach(d=>{if(!out.find(x=>x.id===d.id))out.push({...d.data(),_coAdmin:true});});}catch(e){console.warn('admin list failed',e.code);}
        for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('league:')){const d=lsGet(k.slice(7));if(d&&d.createdBy===uid&&!out.find(x=>x.id===d.id))out.push({...d,_src:'local'});}}
        return out.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    },
    async remove(league){
        if(league._src==='local'){localStorage.removeItem(LS(league.id));return;}
        await db.collection('leagues').doc(league.id).delete();
    }
};

// ── Scoring ───────────────────────────────────────────────────────────
// mode 'capped': a game that runs past gameTo (e.g. 15-13) counts as gameTo to gameTo-minus-margin (11-9),
// so long win-by-2 games don't hand out bonus points. 'raw' counts the real score.
const DEFAULT_SCORING={mode:'capped',gameTo:11,minPct:50};
const scoringOf=l=>({...DEFAULT_SCORING,...((l&&l.scoring)||{})});
function counted(a,b,sc){
    a=+a;b=+b;
    if(sc.mode!=='capped'||a===b)return[a,b];
    const hi=Math.max(a,b),lo=Math.min(a,b);
    if(hi<=sc.gameTo)return[a,b];
    const cl=Math.max(0,sc.gameTo-(hi-lo));
    return a>b?[sc.gameTo,cl]:[cl,sc.gameTo];
}
const scoreOf=(league,mid)=>{const s=(league.scores||{})[mid];return s&&isNum(s.a)&&isNum(s.b)?s:null;};

// ── Leaderboard ───────────────────────────────────────────────────────
function calcBoard(league,weekId){
    const sc=scoringOf(league);
    const nameOf={};league.players.forEach(p=>nameOf[p.id]=p.name);
    const st={};
    const touch=id=>st[id]=st[id]||{id,name:nameOf[id]||'(removed)',pts:0,pa:0,gp:0,w:0,l:0,sat:0};
    let gamesPlayed=0; // game slots (rounds) that have at least one score
    (league.weeks||[]).forEach(w=>{
        if(weekId&&w.id!==weekId)return;
        (w.rounds||[]).forEach(r=>{
            let any=false;
            (r.matches||[]).forEach(m=>{
                const s=scoreOf(league,m.id);if(!s)return;any=true;
                const [a,b]=counted(s.a,s.b,sc);
                const side=(team,f,ag)=>team.forEach(p=>{const x=touch(p);x.pts+=f;x.pa+=ag;x.gp++;if(f>ag)x.w++;else if(f<ag)x.l++;});
                side(m.team1,a,b);side(m.team2,b,a);
            });
            if(any){gamesPlayed++;(r.sitOut||[]).forEach(p=>touch(p).sat++);}
        });
    });
    // include players with no scored games yet (current roster, active)
    league.players.filter(p=>p.active!==false).forEach(p=>touch(p.id));
    // Season minimum only kicks in once there's more than one week (on night one it would just confuse people)
    const need=weekId||kindOf(league)!=='league'||(league.weeks||[]).length<2?0:Math.ceil(gamesPlayed*(sc.minPct||0)/100);
    return Object.values(st).map(x=>({...x,diff:x.pts-x.pa,avg:x.gp?x.pts/x.gp:0,qualified:x.gp>=need,need}));
}
// Fixed-partner doubles: standings by team
function calcTeamBoard(league,weekId){
    const sc=scoringOf(league);
    const teams=league.teams||[];
    const st={};
    const touch=id=>{if(!st[id]){const t=teams.find(x=>x.id===id);st[id]={id,name:teamName(league,t),players:t?t.players:[],pts:0,pa:0,gp:0,w:0,l:0,sat:0};}return st[id];};
    let gamesPlayed=0;
    (league.weeks||[]).forEach(w=>{
        if(weekId&&w.id!==weekId)return;
        (w.rounds||[]).forEach(r=>{
            let any=false;
            (r.matches||[]).forEach(m=>{
                const s=scoreOf(league,m.id);if(!s||!m.u1)return;any=true;
                const [a,b]=counted(s.a,s.b,sc);
                const side=(u,f,ag)=>{const x=touch(u);x.pts+=f;x.pa+=ag;x.gp++;if(f>ag)x.w++;else if(f<ag)x.l++;};
                side(m.u1,a,b);side(m.u2,b,a);
            });
            if(any){gamesPlayed++;(r.sitOutUnits||[]).forEach(u=>touch(u).sat++);}
        });
    });
    teams.filter(t=>t.active!==false).forEach(t=>touch(t.id));
    const need=weekId||kindOf(league)!=='league'||(league.weeks||[]).length<2?0:Math.ceil(gamesPlayed*(sc.minPct||0)/100);
    return Object.values(st).map(x=>({...x,diff:x.pts-x.pa,avg:x.gp?x.pts/x.gp:0,qualified:x.gp>=need,need}));
}
const SORTS={
    avg:{label:'Avg / game',fn:(a,b)=>b.avg-a.avg||b.diff-a.diff||b.w-a.w},
    win:{label:'Win %',fn:(a,b)=>(b.gp?b.w/b.gp:0)-(a.gp?a.w/a.gp:0)||b.diff-a.diff||b.avg-a.avg},
    pts:{label:'Points',fn:(a,b)=>b.pts-a.pts||b.diff-a.diff||b.w-a.w},
    w:{label:'Wins',fn:(a,b)=>b.w-a.w||b.avg-a.avg},
    diff:{label:'+/-',fn:(a,b)=>b.diff-a.diff||b.avg-a.avg},
};

// ── Demo data (only on this device, never saved to the cloud) ──────────
// events.html?demo lists one sample event for every type × format combination.
const DEMO_NAMES=['Alex','Priya','Sam','Maya','Jordan','Arjun','Lee','Nina','Chris','Divya','Omar','Grace','Ben','Leah','Raj','Tara'];
const DEMOS=[
    {kind:'league',format:'rotating',name:'Thursday Mixer League',note:'12 players · 3 courts · 8 games a night · 4 weeks',n:12,courts:['4','5','7'],rounds:8,weeks:4},
    {kind:'league',format:'fixed',name:'Doubles Team League',note:'6 teams · 3 courts · full round robin each week · 3 weeks',n:6,courts:['1','2','3'],rounds:5,weeks:3},
    {kind:'league',format:'singles',name:'Singles Ladder League',note:'9 players · 4 courts (one bye each game) · 3 weeks',n:9,courts:['1','2','3','4'],rounds:9,weeks:3},
    {kind:'tournament',format:'rotating',name:'Saturday Round Robin',note:'13 players · 3 courts (one sits each game) · 10 games · in progress',n:13,courts:['A','B','C'],rounds:10,weeks:1},
    {kind:'tournament',format:'fixed',name:'Turkey Shootout (teams)',note:'8 teams · 4 courts · full round robin · in progress',n:8,courts:['1','2','3','4'],rounds:7,weeks:1},
    {kind:'tournament',format:'singles',name:'Singles Showdown',note:'6 players · 2 courts (two sit each game) · 10 games · finished',n:6,courts:['1','2'],rounds:10,weeks:1,done:true},
];
const demoId=d=>`DEMO-${d.kind}-${d.format}`;
function buildDemo(d){
    const isoAgo=days=>{const t=new Date();t.setDate(t.getDate()-days);const p=n=>String(n).padStart(2,'0');return`${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())}`;};
    const fixed=d.format==='fixed';
    const names=DEMO_NAMES.slice(0,fixed?d.n*2:d.n);
    const players=names.map((n,i)=>({id:'p'+i,name:n,active:true}));
    const teams=fixed?Array.from({length:d.n},(_,i)=>({id:'T'+i,players:['p'+(2*i),'p'+(2*i+1)],active:true})):[];
    const skill={};players.forEach((p,i)=>skill[p.id]=0.35+((i*37)%11)/16); // some players are just better
    const league={id:demoId(d),name:d.name,kind:d.kind,format:d.format,_local:true,_demo:true,createdBy:'demo',ownerName:'Demo',
        createdAt:Date.now(),updatedAt:Date.now(),isPublic:true,publicMode:'edit',adminEmails:[],players,teams,
        defaultCourts:d.courts,defaultRounds:d.rounds,weeks:[],scores:{},scoring:{...DEFAULT_SCORING,minPct:d.kind==='league'?50:0}};
    for(let w=0;w<d.weeks;w++){
        const lastThu=(new Date().getDay()+3)%7; // days since the most recent Thursday
        const date=d.kind==='league'?isoAgo(lastThu+7*(d.weeks-1-w)):isoAgo(0);
        const units=fixed?teams.map(t=>t.id):players.map(p=>p.id);
        const wk=generateWeek(league,{date,courts:d.courts,rounds:d.rounds,unitIds:units},null,0);
        league.weeks.push(wk);
        const last=w===d.weeks-1&&!d.done;
        const cut=last?Math.ceil(wk.rounds.length*0.6):wk.rounds.length; // last session is still being played
        wk.rounds.slice(0,cut).forEach(r=>r.matches.forEach(m=>{
            const s1=m.team1.reduce((n,p)=>n+skill[p],0)/m.team1.length,s2=m.team2.reduce((n,p)=>n+skill[p],0)/m.team2.length;
            const t1wins=Math.random()<0.5+(s1-s2)*0.9;
            const ot=Math.random()<0.12;
            const lose=ot?12+Math.floor(Math.random()*3):2+Math.floor(Math.random()*8);
            const win=ot?lose+2:11;
            league.scores[m.id]=t1wins?{a:win,b:lose}:{a:lose,b:win};
        }));
    }
    return league;
}
function ensureDemo(id,force){
    const d=DEMOS.find(x=>demoId(x)===id);if(!d)return;
    if(!force&&lsGet(id))return;
    lsSet(buildDemo(d));
}

                    <div style={{color:'#6ee7b7',fontSize:14,lineHeight:1.5}}>Sample data for every combination. It lives only on this device, so tap around, enter scores and try the ⚙️ admin tab.</div>
                </div>
                {groups.map(([k,title,sub])=>(

                                <div key={d.format} className="card" onClick={()=>{ensureDemo(demoId(d));onOpen(demoId(d));}} style={{cursor:'pointer',display:'flex',alignItems:'center',gap:12}}>
                                    <div style={{fontSize:26}}>{FORMATS[d.format].icon}</div>
                                    <div style={{flex:1,minWidth:0}}>
                                        <div style={{fontWeight:700,fontSize:16}}>{d.name}</div>

                                        <div className="muted" style={{fontSize:13}}>{d.note}</div>
                                    </div>
                                    <div style={{color:'#059669',fontWeight:700}}>Open →</div>
                                </div>
                            ))}
                        </div>
                    </div>
                ))}
                <button className="btn btn-ghost" style={{width:'100%'}} onClick={reset}>🔄 Reset demo data (new random draws and scores)</button>
            </div>
        </div>
    );
}

// ── App ───────────────────────────────────────────────────────────────
function App(){
    const [user,setUser]=useState(null);
    const [ready,setReady]=useState(false);
    const [leagueId,setLeagueId]=useState(()=>new URLSearchParams(location.search).get('id'));
    const [demo,setDemo]=useState(()=>new URLSearchParams(location.search).has('demo'));

    useEffect(()=>{
        if(!fbOk){setReady(true);return;}
        const t=setTimeout(()=>setReady(true),6000); // never spin forever: show the login screen
        return auth.onAuthStateChanged(u=>{
            clearTimeout(t);
            setUser(u&&!u.isAnonymous?{uid:u.uid,email:u.email,name:u.displayName||(u.email||'').split('@')[0]}:null);
            setReady(true);
        });
    },[]);
    useEffect(()=>{
        const f=()=>{const q=new URLSearchParams(location.search);setLeagueId(q.get('id'));setDemo(q.has('demo'));};
        window.addEventListener('popstate',f);return()=>window.removeEventListener('popstate',f);
    },[]);
    const open=id=>{history.pushState({},'',id?`?id=${id}`:location.pathname);setLeagueId(id);window.scrollTo(0,0);const r=document.getElementById('root');if(r&&window.PC_APP)r.scrollTo(0,0);};

    if(!ready)return<Center><div className="spinner"/></Center>;
    if(leagueId&&leagueId.startsWith('DEMO-'))ensureDemo(leagueId); // demo links work on any device
    if(leagueId)return<LeagueView id={leagueId} user={user} onHome={()=>open(null)}/>;
    if(demo)return<DemoIndex onOpen={open}/>;
    if(!user)return<LoginView/>;
    return<Dashboard user={user} onOpen={open}/>;
}

const Center=({children})=><div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:12}}>{children}</div>;

function Nav({children,onHome,user}){
    if(window.PC_APP)return( // iOS-style bar inside the app
        <div className="appbar no-print">
            {onHome?<button className="ab-btn" onClick={onHome}>‹ Back</button>:<span className="ab-btn"/>}
            <div className="ab-title">Leagues</div>
            {user?<button className="ab-btn r" onClick={()=>auth.signOut()}>Log out</button>:<span className="ab-btn"/>}
            {children}
        </div>
    );
    return(
        <div className="nav no-print">
            {onHome?<button className="link" onClick={onHome}>← Back</button>:<a href="index.html">← Home</a>}
            <div className="brand"><b>Pickle<span>Connect</span></b><em>Leagues</em></div>
            {user?<button className="link" onClick={()=>auth.signOut()}>Log out</button>:<span style={{width:60}}/>}
            {children}
        </div>
    );
}

// ── Login ─────────────────────────────────────────────────────────────
function LoginView(){
    const [email,setEmail]=useState('');const [pw,setPw]=useState('');const [pwc,setPwc]=useState('');
    const [signup,setSignup]=useState(false);const [err,setErr]=useState('');const [msg,setMsg]=useState('');const [busy,setBusy]=useState(false);
    const ERR={'auth/invalid-credential':'Incorrect email or password.','auth/wrong-password':'Incorrect password.','auth/user-not-found':'No account with this email.',
        'auth/invalid-email':'Invalid email.','auth/email-already-in-use':'Email already registered — log in instead.','auth/weak-password':'Password must be 6+ characters.',
        'auth/too-many-requests':'Too many attempts. Try again in a few minutes.'};
    const submit=async e=>{
        e.preventDefault();setErr('');setMsg('');
        if(!fbOk){setErr('Login is unavailable right now.');return;}
        if(signup&&pw.length<6){setErr('Password must be 6+ characters.');return;}
        if(signup&&pw!==pwc){setErr('Passwords do not match.');return;}
        setBusy(true);
        try{
            if(signup){const c=await auth.createUserWithEmailAndPassword(email,pw);try{await c.user.sendEmailVerification();}catch(e){}}
            else await auth.signInWithEmailAndPassword(email,pw);
        }catch(e){setErr(ERR[e.code]||e.message);}
        setBusy(false);
    };
    const reset=async()=>{
        setErr('');setMsg('');
        if(!email){setErr('Enter your email above first, then tap Forgot password.');return;}
        try{await auth.sendPasswordResetEmail(email);setMsg(`Password reset email sent to ${email}. Check your inbox (and spam).`);}
        catch(e){setErr(ERR[e.code]||e.message);}
    };
    const toggle=()=>{setSignup(!signup);setErr('');setMsg('');setPwc('');};
    return(
        <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
            <div className="hero-bg" style={{padding:'44px 20px 56px',textAlign:'center'}}>
                <div style={{color:'#6ee7b7',fontSize:12,fontWeight:700,letterSpacing:1.4,marginBottom:12}}>PICKLECONNECT</div>
                <h1 className="fd" style={{fontSize:'clamp(40px,10vw,68px)',color:'white',lineHeight:1,fontWeight:800}}>LEAGUES<span style={{color:'#34d399'}}> & TOURNEYS</span></h1>
                <p style={{color:'#94a3b8',maxWidth:460,margin:'14px auto 0',lineHeight:1.6}}>Weekly leagues or one-day tournaments. Singles, fixed-partner doubles or rotating partners, on as many courts and for as many games as you like, with live scores and standings.</p>
            </div>
            <div className="pg" style={{marginTop:-30}}>
                <div className="card" style={{maxWidth:420,margin:'0 auto'}}>
                    <div className="fd" style={{fontSize:26,fontWeight:800,marginBottom:4}}>{signup?'CREATE ACCOUNT':'LOG IN'}</div>
                    <div className="muted" style={{marginBottom:16}}>{signup?'Create an account to run a league or tournament, or to join one as an admin (use the email the organizer added).':'Organizers and admins log in here. Players can view a shared link without an account.'}</div>
                    <form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:12}}>
                        <div><label className="slbl">Email</label><input className="inp" type="email" autoComplete="email" placeholder="you@example.com" value={email} onChange={e=>setEmail(e.target.value)} required/></div>
                        <div><label className="slbl">Password</label><input className="inp" type="password" autoComplete={signup?'new-password':'current-password'} placeholder="••••••••" value={pw} onChange={e=>setPw(e.target.value)} required minLength={6}/></div>
                        {signup&&<div><label className="slbl">Confirm password</label><input className="inp" type="password" autoComplete="new-password" placeholder="••••••••" value={pwc} onChange={e=>setPwc(e.target.value)} required minLength={6}/></div>}
                        {err&&<div className="err">{err}</div>}
                        {msg&&<div className="ok">{msg}</div>}
                        <button className="btn btn-g" disabled={busy}>{busy?'Please wait…':signup?'Create account':'Log in'}</button>
                    </form>
                    <div style={{marginTop:14,display:'flex',flexDirection:'column',gap:8,alignItems:'center'}}>
                        <button onClick={toggle} style={{background:'none',border:'none',color:'#059669',fontWeight:600,cursor:'pointer',fontFamily:"'Outfit',sans-serif",fontSize:15}}>
                            {signup?'Already have an account? Log in':"Don't have an account? Sign up"}
                        </button>
                        <a href="events.html?demo" style={{color:'#059669',fontWeight:600,fontSize:15,textDecoration:'none'}}>👀 Look around with demo events</a>
                        {!signup&&<button onClick={reset} style={{background:'none',border:'none',color:'#94a3b8',cursor:'pointer',fontFamily:"'Outfit',sans-serif",fontSize:14}}>Forgot password?</button>}
                    </div>
                </div>
            </div>
        </div>
    );
}

function CreateLeague({user,onClose,onCreated}){
    const [kind,setKind]=useState('league');
    const [format,setFormat]=useState('rotating');
    const [name,setName]=useState('');
    const [names,setNames]=useState(()=>Array.from({length:12},()=>''));
    const [teams,setTeams]=useState(()=>Array.from({length:6},()=>['','']));
    const [courts,setCourts]=useState('1, 2, 3');
    const [rounds,setRounds]=useState(8);
    const [touchedRounds,setTouchedRounds]=useState(false);
    const [busy,setBusy]=useState(false);const [err,setErr]=useState('');
    const fixed=format==='fixed';
    const playerNames=fixed?teams.flat().map(n=>n.trim()).filter(Boolean):names.map(n=>n.trim()).filter(Boolean);
    const fullTeams=teams.map(t=>t.map(n=>n.trim())).filter(t=>t[0]||t[1]);
    const dup=playerNames.find((n,i)=>playerNames.findIndex(x=>x.toLowerCase()===n.toLowerCase())!==i);
    const cs=parseCourts(courts);
    const units=fixed?fullTeams.length:playerNames.length;
    const per=format==='rotating'?4:2;
    const rr=S.maxNoRepeatRounds(Math.max(units,2));
    // Tournaments default to a full round robin for singles / teams
    useEffect(()=>{if(!touchedRounds&&kind==='tournament'&&format!=='rotating'&&units>=2)setRounds(Math.min(MAX_GAMES,rr));},[kind,format,units]);
    const create=async()=>{
        if(fixed){
            if(fullTeams.some(t=>!t[0]||!t[1])){setErr('Every team needs two players.');return;}
            if(fullTeams.length<2){setErr('Add at least 2 teams.');return;}
        }else if(playerNames.length<per){setErr(`Add at least ${per} players.`);return;}
        if(dup){setErr(`"${dup}" is listed twice.`);return;}
        if(!cs.length){setErr('Enter at least one court number.');return;}
        setBusy(true);
        const id=newId();
        const players=playerNames.map(n=>({id:uid6(),name:n,active:true}));
        const pid=n=>players.find(p=>p.name===n).id;
        const doc={id,name:name.trim()||(kind==='tournament'?'Tournament':'League'),kind,format,
            createdBy:user.uid,ownerName:user.name,createdAt:Date.now(),updatedAt:Date.now(),
            isPublic:true,publicMode:kind==='tournament'?'edit':'read',adminEmails:[],
            players,teams:fixed?fullTeams.map(t=>({id:'T'+uid6(),players:[pid(t[0]),pid(t[1])],active:true})):[],
            defaultCourts:cs,defaultRounds:rounds,weeks:[],scores:{},
            scoring:{...DEFAULT_SCORING,minPct:kind==='tournament'?0:DEFAULT_SCORING.minPct}};
        await store.create(doc);
        onCreated(id);
    };
    const Opt=({on,onClick,icon,title,sub})=>(
        <button type="button" className={'opt'+(on?' on':'')} onClick={onClick}>
            <span style={{fontSize:20}}>{icon}</span>
            <span style={{minWidth:0}}><b>{title}</b><small>{sub}</small></span>
        </button>
    );
    return(
        <Modal onClose={onClose} title="New league or tournament">
            <label className="slbl">Type</label>
            <div className="grid2">
                <Opt on={kind==='league'} onClick={()=>setKind('league')} icon="🏅" title="League" sub="Every week, season standings"/>
                <Opt on={kind==='tournament'} onClick={()=>setKind('tournament')} icon="🏆" title="Tournament" sub="One day, final standings"/>
            </div>
            <label className="slbl" style={{marginTop:14}}>Format</label>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
                {Object.entries(FORMATS).map(([k,f])=><Opt key={k} on={format===k} onClick={()=>setFormat(k)} icon={f.icon} title={f.label} sub={f.desc}/>)}
            </div>
            <label className="slbl" style={{marginTop:14}}>{kind==='tournament'?'Tournament':'League'} name</label>
            <input className="inp" value={name} onChange={e=>setName(e.target.value)} placeholder={kind==='tournament'?'Saturday Shootout':'Thursday Night League'}/>
            {fixed?<>
                <div className="row" style={{justifyContent:'space-between',margin:'16px 0 8px'}}>
                    <label className="slbl" style={{margin:0}}>Teams ({fullTeams.length})</label>
                    <button className="btn btn-ghost btn-sm" onClick={()=>setTeams([...teams,['','']])}>+ Add team</button>
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:8}}>
                    {teams.map((t,i)=>(
                        <div key={i} className="row">
                            <span className="fd" style={{width:22,fontWeight:800,color:'#64748b',flexShrink:0}}>{i+1}</span>
                            <input className="inp" style={{padding:'10px 12px'}} placeholder="Player" value={t[0]} onChange={e=>{const c=teams.map(x=>x.slice());c[i][0]=e.target.value;setTeams(c);}}/>

// Number of leading games to keep when changing players: everything up to the last game with a score
function keptRounds(league,week){
    if(!week)return 0;
    let k=0;
    week.rounds.forEach((r,i)=>{if(r.matches.some(m=>(league.scores||{})[m.id]&&(isNum(league.scores[m.id].a)||isNum(league.scores[m.id].b))))k=i+1;});
    return k;
}

function generateWeek(league,{date,courts,rounds,unitIds},existing,keep){
    const fmt=fmtOf(league);
    const id=existing?existing.id:('W'+uid6());
    const prior=existing&&keep?existing.rounds.slice(0,keep):[];
    const base={id,date,courts,numRounds:rounds,createdAt:existing?existing.createdAt:Date.now(),...(existing?{updatedAt:Date.now()}:{})};
    const mid=(ri,mi)=>`${id}_r${prior.length+ri+1}_${mi+1}_${uid6()}`;
    if(fmt==='rotating'){
        const res=S.generateRotating(unitIds,courts,rounds-prior.length,S.buildHistory(league.weeks,id),{priorRounds:prior});
        const fresh=res.rounds.map((r,ri)=>({matches:r.matches.map((m,mi)=>({id:mid(ri,mi),court:m.court,team1:m.team1,team2:m.team2})),sitOut:r.sitOut}));
        return{...base,playerIds:unitIds,unitIds,rounds:prior.concat(fresh),repeatPartners:res.stats.repeatPartners};
    }
    // singles: a unit is a player · fixed doubles: a unit is a team
    const members=u=>fmt==='fixed'?(((league.teams||[]).find(t=>t.id===u)||{players:[]}).players.slice()):[u];
    const res=S.generateMatchups(unitIds,courts,rounds-prior.length,S.buildUnitHistory(league.weeks,id),{priorRounds:prior});
    const fresh=res.rounds.map((r,ri)=>({
        matches:r.matches.map((m,mi)=>({id:mid(ri,mi),court:m.court,u1:m.u1,u2:m.u2,team1:members(m.u1),team2:members(m.u2)})),
        sitOut:r.sitOutUnits.flatMap(members),sitOutUnits:r.sitOutUnits,
    }));
    return{...base,playerIds:unitIds.flatMap(members),unitIds,rounds:prior.concat(fresh),repeatOpponents:res.stats.repeatOpponents};
}

// Add a team of two (re-using roster names where they exist)
async function addTeam(league,update,n1,n2){
    n1=n1.trim();n2=n2.trim();
    if(!n1||!n2)return{error:'Enter both players.'};
    if(n1.toLowerCase()===n2.toLowerCase())return{error:'Pick two different players.'};
    const players=league.players.slice();const ids=[];
    for(const n of [n1,n2]){
        let i=players.findIndex(x=>x.name.trim().toLowerCase()===n.toLowerCase());
        if(i>=0&&(league.teams||[]).some(t=>t.active!==false&&t.players.includes(players[i].id)))return{error:`${players[i].name} is already on a team.`};
        if(i<0){players.push({id:uid6(),name:n,active:true});i=players.length-1;}
        else if(players[i].active===false)players[i]={...players[i],active:true};
        ids.push(players[i].id);
    }
    const t={id:'T'+uid6(),players:ids,active:true};
    await update({players,teams:[...(league.teams||[]),t]});
    return{team:t};
}

function NewWeekModal({league,onClose,onSave,editWeek,update}){
