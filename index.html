<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PickleConnect - Find Courts & Organize Games</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .leaflet-container { height: 100%; width: 100%; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Sample data
        const SAMPLE_COURTS = [
            { id: 1, name: "O'Fallon Community Center", address: "825 E US Hwy 50, O'Fallon, MO", courts: 6, indoor: true, outdoor: false, lat: 38.8106, lng: -90.7104, rating: 4.5 },
            { id: 2, name: "Westhoff Park", address: "900 Westhoff Park Dr, O'Fallon, MO", courts: 4, indoor: false, outdoor: true, lat: 38.7906, lng: -90.7204, rating: 4.2 },
            { id: 3, name: "Fort Zumwalt Park", address: "1000 Park View Ln, O'Fallon, MO", courts: 8, indoor: false, outdoor: true, lat: 38.8006, lng: -90.6904, rating: 4.7 },
            { id: 4, name: "Civic Park", address: "100 Civic Park Dr, O'Fallon, MO", courts: 3, indoor: false, outdoor: true, lat: 38.8206, lng: -90.7304, rating: 4.0 },
        ];

        const SKILL_LEVELS = ['Beginner (2.0-2.5)', 'Intermediate (3.0-3.5)', 'Advanced (4.0-4.5)', 'Expert (5.0+)'];

        function App() {
            const [currentView, setCurrentView] = useState('home');
            const [currentUser, setCurrentUser] = useState({ 
                name: 'Guest Player', 
                skillLevel: 'Intermediate (3.0-3.5)', 
                gamesPlayed: 0,
                avatar: '🎾' 
            });
            const [games, setGames] = useState([
                { 
                    id: 1, 
                    court: SAMPLE_COURTS[0], 
                    date: '2026-02-15', 
                    time: '10:00 AM', 
                    skillLevel: 'Intermediate (3.0-3.5)', 
                    players: ['John D.', 'Sarah M.'], 
                    maxPlayers: 4,
                    organizer: 'John D.',
                    format: 'Doubles'
                },
                { 
                    id: 2, 
                    court: SAMPLE_COURTS[1], 
                    date: '2026-02-16', 
                    time: '2:00 PM', 
                    skillLevel: 'Advanced (4.0-4.5)', 
                    players: ['Mike T.'], 
                    maxPlayers: 4,
                    organizer: 'Mike T.',
                    format: 'Round Robin'
                },
                { 
                    id: 3, 
                    court: SAMPLE_COURTS[2], 
                    date: '2026-02-14', 
                    time: '6:00 PM', 
                    skillLevel: 'Beginner (2.0-2.5)', 
                    players: ['Emma L.', 'David K.', 'Lisa R.'], 
                    maxPlayers: 8,
                    organizer: 'Emma L.',
                    format: 'Round Robin'
                },
            ]);

            const views = {
                home: <HomeView setCurrentView={setCurrentView} games={games} />,
                courts: <CourtsView setCurrentView={setCurrentView} />,
                games: <GamesView games={games} setGames={setGames} setCurrentView={setCurrentView} currentUser={currentUser} />,
                profile: <ProfileView currentUser={currentUser} setCurrentUser={setCurrentUser} />,
                roundRobin: <RoundRobinView />,
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-green-50 to-blue-50">
                    {/* Navigation */}
                    <nav className="bg-white shadow-lg sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 py-4">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center space-x-2 cursor-pointer" onClick={() => setCurrentView('home')}>
                                    <span className="text-3xl">🏓</span>
                                    <span className="text-2xl font-bold text-green-600">PickleConnect</span>
                                </div>
                                <div className="flex space-x-2">
                                    <NavButton active={currentView === 'home'} onClick={() => setCurrentView('home')}>
                                        🏠 Home
                                    </NavButton>
                                    <NavButton active={currentView === 'courts'} onClick={() => setCurrentView('courts')}>
                                        📍 Courts
                                    </NavButton>
                                    <NavButton active={currentView === 'games'} onClick={() => setCurrentView('games')}>
                                        🎮 Games
                                    </NavButton>
                                    <NavButton active={currentView === 'roundRobin'} onClick={() => setCurrentView('roundRobin')}>
                                        🔄 Round Robin
                                    </NavButton>
                                    <NavButton active={currentView === 'profile'} onClick={() => setCurrentView('profile')}>
                                        👤 Profile
                                    </NavButton>
                                </div>
                            </div>
                        </div>
                    </nav>

                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto px-4 py-8">
                        {views[currentView]}
                    </main>
                </div>
            );
        }

        function NavButton({ active, onClick, children }) {
            return (
                <button
                    onClick={onClick}
                    className={`px-4 py-2 rounded-lg font-medium transition-all ${
                        active 
                            ? 'bg-green-600 text-white shadow-lg' 
                            : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                    }`}
                >
                    {children}
                </button>
            );
        }

        function HomeView({ setCurrentView, games }) {
            const upcomingGames = games.filter(g => new Date(g.date) >= new Date()).slice(0, 3);
            
            return (
                <div className="space-y-8">
                    {/* Hero Section */}
                    <div className="bg-gradient-to-r from-green-500 to-blue-500 rounded-2xl p-8 text-white shadow-xl">
                        <h1 className="text-4xl font-bold mb-4">Welcome to PickleConnect! 🏓</h1>
                        <p className="text-xl mb-6">Find courts, organize games, and connect with players in your area</p>
                        <div className="flex space-x-4">
                            <button 
                                onClick={() => setCurrentView('courts')}
                                className="bg-white text-green-600 px-6 py-3 rounded-lg font-bold hover:bg-gray-100 transition-all shadow-lg"
                            >
                                Find Courts Near Me
                            </button>
                            <button 
                                onClick={() => setCurrentView('games')}
                                className="bg-green-700 text-white px-6 py-3 rounded-lg font-bold hover:bg-green-800 transition-all shadow-lg"
                            >
                                Browse Games
                            </button>
                        </div>
                    </div>

                    {/* Quick Stats */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <StatCard icon="📍" title="Courts" value={SAMPLE_COURTS.length} subtitle="in your area" />
                        <StatCard icon="🎮" title="Active Games" value={games.length} subtitle="this week" />
                        <StatCard icon="👥" title="Players" value="124" subtitle="in your community" />
                    </div>

                    {/* Upcoming Games */}
                    <div className="bg-white rounded-xl shadow-lg p-6">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-bold text-gray-800">Upcoming Games</h2>
                            <button 
                                onClick={() => setCurrentView('games')}
                                className="text-green-600 hover:text-green-700 font-medium"
                            >
                                View All →
                            </button>
                        </div>
                        <div className="space-y-4">
                            {upcomingGames.map(game => (
                                <GameCard key={game.id} game={game} compact />
                            ))}
                        </div>
                    </div>

                    {/* Features */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <FeatureCard 
                            icon="🗺️" 
                            title="Court Finder"
                            description="Discover pickleball courts near you with ratings, photos, and availability"
                            onClick={() => setCurrentView('courts')}
                        />
                        <FeatureCard 
                            icon="🔄" 
                            title="Round Robin Generator"
                            description="Automatically create fair round robin rotations for your games"
                            onClick={() => setCurrentView('roundRobin')}
                        />
                    </div>
                </div>
            );
        }

        function StatCard({ icon, title, value, subtitle }) {
            return (
                <div className="bg-white rounded-xl shadow-lg p-6 text-center">
                    <div className="text-4xl mb-2">{icon}</div>
                    <div className="text-3xl font-bold text-gray-800">{value}</div>
                    <div className="text-sm text-gray-600">{title}</div>
                    <div className="text-xs text-gray-500">{subtitle}</div>
                </div>
            );
        }

        function FeatureCard({ icon, title, description, onClick }) {
            return (
                <div 
                    onClick={onClick}
                    className="bg-white rounded-xl shadow-lg p-6 hover:shadow-xl transition-all cursor-pointer border-2 border-transparent hover:border-green-500"
                >
                    <div className="text-4xl mb-4">{icon}</div>
                    <h3 className="text-xl font-bold text-gray-800 mb-2">{title}</h3>
                    <p className="text-gray-600">{description}</p>
                </div>
            );
        }

        function CourtsView({ setCurrentView }) {
            const mapRef = useRef(null);
            const mapInstanceRef = useRef(null);
            const [selectedCourt, setSelectedCourt] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [filterIndoor, setFilterIndoor] = useState(false);
            const [filterOutdoor, setFilterOutdoor] = useState(false);

            useEffect(() => {
                if (mapRef.current && !mapInstanceRef.current) {
                    // Initialize map centered on O'Fallon, MO
                    const map = L.map(mapRef.current).setView([38.8106, -90.7104], 12);
                    
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap contributors'
                    }).addTo(map);

                    // Add markers for courts
                    SAMPLE_COURTS.forEach(court => {
                        const marker = L.marker([court.lat, court.lng]).addTo(map);
                        marker.bindPopup(`
                            <div style="font-family: sans-serif;">
                                <strong>${court.name}</strong><br/>
                                ${court.courts} courts<br/>
                                ${court.indoor ? 'Indoor' : ''} ${court.outdoor ? 'Outdoor' : ''}<br/>
                                ⭐ ${court.rating}/5.0
                            </div>
                        `);
                        marker.on('click', () => setSelectedCourt(court));
                    });

                    mapInstanceRef.current = map;
                }
            }, []);

            const filteredCourts = SAMPLE_COURTS.filter(court => {
                const matchesSearch = court.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                     court.address.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesIndoor = !filterIndoor || court.indoor;
                const matchesOutdoor = !filterOutdoor || court.outdoor;
                return matchesSearch && matchesIndoor && matchesOutdoor;
            });

            return (
                <div className="space-y-6">
                    <div className="bg-white rounded-xl shadow-lg p-6">
                        <h2 className="text-3xl font-bold text-gray-800 mb-4">Find Courts 📍</h2>
                        
                        {/* Search and Filters */}
                        <div className="space-y-4 mb-6">
                            <input
                                type="text"
                                placeholder="Search courts by name or location..."
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none"
                            />
                            <div className="flex space-x-4">
                                <label className="flex items-center space-x-2 cursor-pointer">
                                    <input 
                                        type="checkbox" 
                                        checked={filterIndoor}
                                        onChange={(e) => setFilterIndoor(e.target.checked)}
                                        className="w-5 h-5 text-green-600"
                                    />
                                    <span className="text-gray-700">Indoor Courts</span>
                                </label>
                                <label className="flex items-center space-x-2 cursor-pointer">
                                    <input 
                                        type="checkbox" 
                                        checked={filterOutdoor}
                                        onChange={(e) => setFilterOutdoor(e.target.checked)}
                                        className="w-5 h-5 text-green-600"
                                    />
                                    <span className="text-gray-700">Outdoor Courts</span>
                                </label>
                            </div>
                        </div>

                        {/* Map */}
                        <div className="rounded-lg overflow-hidden shadow-lg mb-6" style={{ height: '400px' }}>
                            <div ref={mapRef} style={{ height: '100%', width: '100%' }}></div>
                        </div>

                        {/* Court List */}
                        <div className="space-y-4">
                            <h3 className="text-xl font-bold text-gray-800">
                                {filteredCourts.length} Courts Found
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {filteredCourts.map(court => (
                                    <CourtCard 
                                        key={court.id} 
                                        court={court} 
                                        selected={selectedCourt?.id === court.id}
                                        onClick={() => {
                                            setSelectedCourt(court);
                                            if (mapInstanceRef.current) {
                                                mapInstanceRef.current.setView([court.lat, court.lng], 15);
                                            }
                                        }}
                                    />
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function CourtCard({ court, selected, onClick }) {
            return (
                <div 
                    onClick={onClick}
                    className={`bg-white border-2 rounded-lg p-4 cursor-pointer transition-all ${
                        selected ? 'border-green-500 shadow-lg' : 'border-gray-200 hover:border-green-300'
                    }`}
                >
                    <div className="flex justify-between items-start mb-2">
                        <h4 className="font-bold text-gray-800 text-lg">{court.name}</h4>
                        <div className="flex items-center space-x-1 text-yellow-500">
                            <span>⭐</span>
                            <span className="text-gray-700 font-medium">{court.rating}</span>
                        </div>
                    </div>
                    <p className="text-gray-600 text-sm mb-3">{court.address}</p>
                    <div className="flex items-center space-x-4 text-sm">
                        <span className="bg-green-100 text-green-700 px-3 py-1 rounded-full font-medium">
                            {court.courts} courts
                        </span>
                        {court.indoor && (
                            <span className="bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-medium">
                                Indoor
                            </span>
                        )}
                        {court.outdoor && (
                            <span className="bg-orange-100 text-orange-700 px-3 py-1 rounded-full font-medium">
                                Outdoor
                            </span>
                        )}
                    </div>
                </div>
            );
        }

        function GamesView({ games, setGames, setCurrentView, currentUser }) {
            const [showCreateForm, setShowCreateForm] = useState(false);
            const [filterSkill, setFilterSkill] = useState('All Levels');
            const [filterDate, setFilterDate] = useState('All Dates');

            const filteredGames = games.filter(game => {
                const matchesSkill = filterSkill === 'All Levels' || game.skillLevel === filterSkill;
                const matchesDate = filterDate === 'All Dates' || 
                    (filterDate === 'Today' && game.date === '2026-02-13') ||
                    (filterDate === 'This Week' && new Date(game.date) <= new Date('2026-02-19'));
                return matchesSkill && matchesDate;
            });

            return (
                <div className="space-y-6">
                    <div className="bg-white rounded-xl shadow-lg p-6">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-3xl font-bold text-gray-800">Games & Events 🎮</h2>
                            <button 
                                onClick={() => setShowCreateForm(!showCreateForm)}
                                className="bg-green-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-green-700 transition-all shadow-lg"
                            >
                                {showCreateForm ? 'Cancel' : '+ Create Game'}
                            </button>
                        </div>

                        {showCreateForm && (
                            <CreateGameForm 
                                setGames={setGames} 
                                setShowCreateForm={setShowCreateForm}
                                currentUser={currentUser}
                            />
                        )}

                        {/* Filters */}
                        <div className="flex space-x-4 mb-6">
                            <select 
                                value={filterSkill}
                                onChange={(e) => setFilterSkill(e.target.value)}
                                className="px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none"
                            >
                                <option>All Levels</option>
                                {SKILL_LEVELS.map(level => (
                                    <option key={level}>{level}</option>
                                ))}
                            </select>
                            <select 
                                value={filterDate}
                                onChange={(e) => setFilterDate(e.target.value)}
                                className="px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none"
                            >
                                <option>All Dates</option>
                                <option>Today</option>
                                <option>This Week</option>
                            </select>
                        </div>

                        {/* Games List */}
                        <div className="space-y-4">
                            {filteredGames.length === 0 ? (
                                <div className="text-center py-12 text-gray-500">
                                    <p className="text-xl mb-2">No games found</p>
                                    <p>Try adjusting your filters or create a new game!</p>
                                </div>
                            ) : (
                                filteredGames.map(game => (
                                    <GameCard 
                                        key={game.id} 
                                        game={game}
                                        setGames={setGames}
                                        currentUser={currentUser}
                                    />
                                ))
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function GameCard({ game, compact, setGames, currentUser }) {
            const handleJoinGame = () => {
                if (setGames && currentUser) {
                    setGames(prev => prev.map(g => {
                        if (g.id === game.id && g.players.length < g.maxPlayers) {
                            return {
                                ...g,
                                players: [...g.players, currentUser.name]
                            };
                        }
                        return g;
                    }));
                }
            };

            const isFull = game.players.length >= game.maxPlayers;
            const isJoined = currentUser && game.players.includes(currentUser.name);

            return (
                <div className="bg-gray-50 border-2 border-gray-200 rounded-lg p-5 hover:border-green-300 transition-all">
                    <div className="flex justify-between items-start mb-3">
                        <div>
                            <h4 className="font-bold text-gray-800 text-lg mb-1">{game.court.name}</h4>
                            <div className="flex items-center space-x-3 text-sm text-gray-600">
                                <span>📅 {game.date}</span>
                                <span>🕒 {game.time}</span>
                            </div>
                        </div>
                        <span className="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm font-medium">
                            {game.skillLevel}
                        </span>
                    </div>

                    {!compact && (
                        <>
                            <div className="mb-3">
                                <div className="flex items-center space-x-2 text-sm text-gray-700 mb-2">
                                    <span className="font-medium">Format:</span>
                                    <span>{game.format}</span>
                                </div>
                                <div className="flex items-center space-x-2 text-sm text-gray-700 mb-2">
                                    <span className="font-medium">Organized by:</span>
                                    <span>{game.organizer}</span>
                                </div>
                                <div className="flex items-center space-x-2 text-sm">
                                    <span className="font-medium">Players ({game.players.length}/{game.maxPlayers}):</span>
                                    <div className="flex flex-wrap gap-2">
                                        {game.players.map((player, idx) => (
                                            <span key={idx} className="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs">
                                                {player}
                                            </span>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            <div className="flex space-x-3">
                                <button 
                                    onClick={handleJoinGame}
                                    disabled={isFull || isJoined}
                                    className={`flex-1 px-4 py-2 rounded-lg font-medium transition-all ${
                                        isJoined 
                                            ? 'bg-green-600 text-white cursor-default'
                                            : isFull 
                                            ? 'bg-gray-300 text-gray-500 cursor-not-allowed' 
                                            : 'bg-green-600 text-white hover:bg-green-700'
                                    }`}
                                >
                                    {isJoined ? '✓ Joined' : isFull ? 'Full' : 'Join Game'}
                                </button>
                                <button className="px-4 py-2 border-2 border-gray-300 rounded-lg font-medium hover:border-green-500 transition-all">
                                    Details
                                </button>
                            </div>
                        </>
                    )}
                </div>
            );
        }

        function CreateGameForm({ setGames, setShowCreateForm, currentUser }) {
            const [formData, setFormData] = useState({
                court: SAMPLE_COURTS[0].id,
                date: '2026-02-14',
                time: '10:00 AM',
                skillLevel: 'Intermediate (3.0-3.5)',
                maxPlayers: 4,
                format: 'Doubles'
            });

            const handleSubmit = (e) => {
                e.preventDefault();
                const selectedCourt = SAMPLE_COURTS.find(c => c.id === parseInt(formData.court));
                const newGame = {
                    id: Date.now(),
                    court: selectedCourt,
                    date: formData.date,
                    time: formData.time,
                    skillLevel: formData.skillLevel,
                    players: [currentUser.name],
                    maxPlayers: parseInt(formData.maxPlayers),
                    organizer: currentUser.name,
                    format: formData.format
                };
                setGames(prev => [...prev, newGame]);
                setShowCreateForm(false);
            };

            return (
                <form onSubmit={handleSubmit} className="bg-green-50 border-2 border-green-200 rounded-lg p-6 mb-6">
                    <h3 className="text-xl font-bold text-gray-800 mb-4">Create New Game</h3>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">Court</label>
                            <select 
                                value={formData.court}
                                onChange={(e) => setFormData({...formData, court: e.target.value})}
                                className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none"
                            >
                                {SAMPLE_COURTS.map(court => (
                                    <option key={court.id} value={court.id}>{court.name}</option>
                                ))}
                            </select>
                        </div>
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">Date</label>
                            <input 
                                type="date"
                                value={formData.date}
                                onChange={(e) => setFormData({...formData, date: e.target.value})}
                                className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none"
                            />
                        </div>
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">Time</label>
                            <input 
                                type="time"
                                value={formData.time}
                                onChange={(e) => setFormData({...formData, time: e.target.value})}
                                className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none"
                            />
                        </div>
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">Skill Level</label>
                            <select 
                                value={formData.skillLevel}
                                onChange={(e) => setFormData({...formData, skillLevel: e.target.value})}
                                className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none"
                            >
                                {SKILL_LEVELS.map(level => (
                                    <option key={level}>{level}</option>
                                ))}
                            </select>
                        </div>
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">Format</label>
                            <select 
                                value={formData.format}
                                onChange={(e) => setFormData({...formData, format: e.target.value})}
                                className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none"
                            >
                                <option>Doubles</option>
                                <option>Singles</option>
                                <option>Round Robin</option>
                            </select>
                        </div>
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">Max Players</label>
                            <select

        // Storage helper functions with localStorage fallback
        const storage = {
            async set(key, value) {
                try {
                    // Try window.storage first (if available in artifact)
                    if (window.storage && typeof window.storage.set === 'function') {
                        return await window.storage.set(key, value, false);
                    }
                } catch (error) {
                    console.log('window.storage not available, using localStorage');
                }
                // Fallback to localStorage
                localStorage.setItem(key, value);
                return { key, value };
            },
            async get(key) {
                try {
                    if (window.storage && typeof window.storage.get === 'function') {
                        return await window.storage.get(key, false);
                    }
                } catch (error) {
                    console.log('window.storage not available, using localStorage');
                }
                // Fallback to localStorage
                const value = localStorage.getItem(key);
                return value ? { key, value } : null;
            },
            async delete(key) {
                try {
                    if (window.storage && typeof window.storage.delete === 'function') {
                        return await window.storage.delete(key, false);
                    }
                } catch (error) {
                    console.log('window.storage not available, using localStorage');
                }
                // Fallback to localStorage
                localStorage.removeItem(key);
                return { key, deleted: true };
            },
            async list(prefix) {
                try {
                    if (window.storage && typeof window.storage.list === 'function') {
                        return await window.storage.list(prefix, false);
                    }
                } catch (error) {
                    console.log('window.storage not available, using localStorage');
                }
                // Fallback to localStorage
                const keys = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key.startsWith(prefix)) {
                        keys.push(key);
                    }
                }
                return { keys };
            }
        };

        function RoundRobinView() {
            const [players, setPlayers] = useState(['']);
            const [courts, setCourts] = useState(1);
            const [numRounds, setNumRounds] = useState(1);
            const [schedule, setSchedule] = useState([]);
            const [scores, setScores] = useState({});
            const [tournamentId, setTournamentId] = useState(null);
            const [savedTournaments, setSavedTournaments] = useState([]);
            const [showLeaderboard, setShowLeaderboard] = useState(false);
            const [saveStatus, setSaveStatus] = useState('');

            // Load saved tournaments on mount
            useEffect(() => {
                loadTournaments();
            }, []);

            // Save tournament data whenever schedule or scores change
            useEffect(() => {
                if (tournamentId && schedule.length > 0) {
                    saveTournament();
                }
            }, [scores, schedule, tournamentId]);

            const loadTournaments = async () => {
                try {
                    const keys = await storage.list('tournament:');
                    if (keys && keys.keys) {
                        const tournaments = [];
                        for (const key of keys.keys) {
                            try {
                                const result = await storage.get(key);
                                if (result && result.value) {
                                    tournaments.push(JSON.parse(result.value));
                                }
                            } catch (error) {
                                console.log('Error loading tournament:', key, error);
                            }
                        }
                        setSavedTournaments(tournaments.sort((a, b) => b.createdAt - a.createdAt));
                    }
                } catch (error) {
                    console.log('Error loading tournaments:', error);
                }
            };

            const saveTournament = async () => {
                if (!tournamentId) return;
                
                const tournamentData = {
                    id: tournamentId,
                    players: players.filter(p => p.trim() !== ''),
                    courts,
                    numRounds,
                    schedule,
                    scores,
                    createdAt: Date.now()
                };

                try {
                    setSaveStatus('Saving...');
                    await storage.set(`tournament:${tournamentId}`, JSON.stringify(tournamentData));
                    setSaveStatus('✓ Saved');
                    setTimeout(() => setSaveStatus(''), 2000);
                    await loadTournaments();
                } catch (error) {
                    console.error('Failed to save tournament:', error);
                    setSaveStatus('✗ Save failed');
                    setTimeout(() => setSaveStatus(''), 2000);
                }
            };

            const loadTournament = async (id) => {
                try {
                    const result = await storage.get(`tournament:${id}`);
                    if (result && result.value) {
                        const data = JSON.parse(result.value);
                        setPlayers(data.players);
                        setCourts(data.courts);
                        setNumRounds(data.numRounds);
                        setSchedule(data.schedule);
                        setScores(data.scores || {});
                        setTournamentId(data.id);
                        setShowLeaderboard(true);
                    }
                } catch (error) {
                    console.log('Tournament not found:', error);
                    alert('Error loading tournament');
                }
            };

            const deleteTournament = async (id) => {
                if (!confirm('Are you sure you want to delete this tournament?')) return;
                
                try {
                    await storage.delete(`tournament:${id}`);
                    await loadTournaments();
                    if (tournamentId === id) {
                        resetTournament();
                    }
                } catch (error) {
                    console.error('Failed to delete tournament:', error);
                    alert('Error deleting tournament');
                }
            };

            const resetTournament = () => {
                setPlayers(['']);
                setCourts(1);
                setNumRounds(1);
                setSchedule([]);
                setScores({});
                setTournamentId(null);
                setShowLeaderboard(false);
            };

            const addPlayer = () => {
                setPlayers([...players, '']);
            };

            const updatePlayer = (index, value) => {
                const newPlayers = [...players];
                newPlayers[index] = value;
                setPlayers(newPlayers);
            };

            const removePlayer = (index) => {
                setPlayers(players.filter((_, i) => i !== index));
            };

            const generateSchedule = () => {
                const validPlayers = players.filter(p => p.trim() !== '');
                if (validPlayers.length < 4) {
                    alert('Need at least 4 players for round robin');
                    return;
                }

                if (numRounds < 1) {
                    alert('Need at least 1 round');
                    return;
                }

                const allRounds = [];
                const playerList = [...validPlayers];
                
                // If odd number of players, add a "BYE"
                if (playerList.length % 2 !== 0) {
                    playerList.push('BYE');
                }

                const maxPossibleRounds = playerList.length - 1;
                const actualRounds = Math.min(numRounds, maxPossibleRounds);
                const half = playerList.length / 2;

                for (let round = 0; round < actualRounds; round++) {
                    const roundMatches = [];
                    for (let i = 0; i < half; i++) {
                        const player1 = playerList[i];
                        const player2 = playerList[playerList.length - 1 - i];
                        
                        if (player1 !== 'BYE' && player2 !== 'BYE') {
                            const matchId = `r${round}-m${i}`;
                            roundMatches.push({
                                id: matchId,
                                court: (i % courts) + 1,
                                team1: [player1],
                                team2: [player2]
                            });
                        }
                    }
                    allRounds.push(roundMatches);

                    // Rotate players (keep first player fixed)
                    playerList.splice(1, 0, playerList.pop());
                }

                setSchedule(allRounds);
                setScores({});
                const newTournamentId = `tournament-${Date.now()}`;
                setTournamentId(newTournamentId);
                setShowLeaderboard(false);
            };

            const updateScore = (matchId, team, score) => {
                setScores(prev => ({
                    ...prev,
                    [matchId]: {
                        ...prev[matchId],
                        [team]: parseInt(score) || 0
                    }
                }));
            };

            const calculateLeaderboard = () => {
                const validPlayers = players.filter(p => p.trim() !== '');
                const playerStats = {};

                // Initialize stats for each player
                validPlayers.forEach(player => {
                    playerStats[player] = {
                        name: player,
                        wins: 0,
                        losses: 0,
                        pointsFor: 0,
                        pointsAgainst: 0,
                        matchesPlayed: 0
                    };
                });

                // Calculate stats from scores
                schedule.forEach(round => {
                    round.forEach(match => {
                        const matchScore = scores[match.id];
                        if (matchScore && matchScore.team1 !== undefined && matchScore.team2 !== undefined) {
                            const team1Player = match.team1[0];
                            const team2Player = match.team2[0];
                            const team1Score = matchScore.team1;
                            const team2Score = matchScore.team2;

                            playerStats[team1Player].matchesPlayed++;
                            playerStats[team2Player].matchesPlayed++;
                            playerStats[team1Player].pointsFor += team1Score;
                            playerStats[team1Player].pointsAgainst += team2Score;
                            playerStats[team2Player].pointsFor += team2Score;
                            playerStats[team2Player].pointsAgainst += team1Score;

                            if (team1Score > team2Score) {
                                playerStats[team1Player].wins++;
                                playerStats[team2Player].losses++;
                            } else if (team2Score > team1Score) {
                                playerStats[team2Player].wins++;
                                playerStats[team1Player].losses++;
                            }
                        }
                    });
                });

                // Sort by wins, then by point differential
                const leaderboard = Object.values(playerStats)
                    .sort((a, b) => {
                        if (b.wins !== a.wins) return b.wins - a.wins;
                        return (b.pointsFor - b.pointsAgainst) - (a.pointsFor - a.pointsAgainst);
                    });

                return leaderboard;
            };

            const leaderboard = schedule.length > 0 ? calculateLeaderboard() : [];

            return (
                <div className="max-w-6xl mx-auto">
                    <div className="bg-white rounded-xl shadow-lg p-8">

                                {saveStatus && (

                                        saveStatus.includes('✓') ? 'bg-green-100 text-green-700' : 
                                        saveStatus.includes('✗') ? 'bg-red-100 text-red-700' : 
                                        'bg-blue-100 text-blue-700'
                                    }`}>
                                        {saveStatus}
                                    </span>
                                )}
                                {schedule.length > 0 && (
                                    <button 
                                        onClick={resetTournament}
                                        className="bg-gray-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-gray-700 transition-all"
                                    >
                                        New Tournament
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* Saved Tournaments */}
                        {savedTournaments.length > 0 && schedule.length === 0 && (
                            <div className="mb-8">
                                <h3 className="text-xl font-bold text-gray-800 mb-4">Saved Tournaments</h3>
                                <div className="space-y-3">
                                    {savedTournaments.map(tournament => (
                                        <div key={tournament.id} className="bg-gray-50 border-2 border-gray-200 rounded-lg p-4 flex items-center justify-between">
                                            <div>
                                                <p className="font-medium text-gray-800">
                                                    {tournament.players.length} players, {tournament.numRounds} rounds
                                                </p>
                                                <p className="text-sm text-gray-600">
                                                    Created {new Date(tournament.createdAt).toLocaleDateString()}
                                                </p>
                                            </div>
                                            <div className="flex space-x-2">
                                                <button 
                                                    onClick={() => loadTournament(tournament.id)}
                                                    className="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition-all"
                                                >
                                                    Load
                                                </button>
                                                <button 
                                                    onClick={() => deleteTournament(tournament.id)}
                                                    className="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition-all"
                                                >
                                                    Delete
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {schedule.length === 0 && (
                            <>
                                <div className="mb-8">
                                    <h3 className="text-xl font-bold text-gray-800 mb-4">Add Players</h3>
                                    <div className="space-y-3 mb-4">
                                        {players.map((player, index) => (
                                            <div key={index} className="flex space-x-3">
                                                <input

                                                {players.length > 1 && (

                                    </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">

                                            {leaderboard.map((player, index) => (
                                                <div 
                                                    key={player.name} 
                                                    className={`bg-white rounded-lg p-4 flex items-center justify-between ${
                                                        index === 0 ? 'border-4 border-yellow-400 shadow-lg' : 'border-2 border-gray-200'

                                                    <div className="flex items-center space-x-4">

                                                                    onChange={(e) => updateScore(match.id, 'team1', e.target.value)}
                                                                    placeholder="0"
                                                                    className="w-16 px-3 py-2 border-2 border-gray-300 rounded-lg text-center font-bold text-lg focus:border-green-500 focus:outline-none"
                                                                />
                                                                <span className="text-gray-400 font-bold">-</span>
                                                                <input 
                                                                    type="number"
                                                                    min="0"
                                                                    value={scores[match.id]?.team2 || ''}
                                                                    onChange={(e) => updateScore(match.id, 'team2', e.target.value)}
                                                                    placeholder="0"
                                                                    className="w-16 px-3 py-2 border-2 border-gray-300 rounded-lg text-center font-bold text-lg focus:border-green-500 focus:outline-none"
                                                                />
                                                            </div>
                                                            <div className="text-left">
                                                                <span className="font-medium text-lg">{match.team2.join(', ')}</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
