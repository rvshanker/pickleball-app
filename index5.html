<!DOCTYPE html>
<html>
<head>
    <title>True Swish Smart Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">

<div class="max-w-5xl mx-auto bg-white p-8 rounded-3xl shadow-2xl">

    <h1 class="text-3xl font-black mb-6">True Swish-Style Match Engine</h1>

    <!-- Controls -->
    <div class="grid md:grid-cols-2 gap-6 mb-8">

        <div>
            <label class="font-bold">Players (one per line)</label>
            <textarea id="playerNames"
                class="w-full border p-3 rounded-xl mt-2 h-40"
                placeholder="John&#10;Mike&#10;Sarah&#10;Emma"></textarea>
        </div>

        <div class="space-y-4">
            <div>
                <label class="font-bold">Courts</label>
                <input type="number" id="courts" value="1"
                    class="w-full border p-3 rounded-xl mt-2">
            </div>

            <div>
                <label class="font-bold">Rounds</label>
                <input type="number" id="rounds" value="3"
                    class="w-full border p-3 rounded-xl mt-2">
            </div>

            <div>
                <label class="font-bold">Match Type</label>
                <select id="matchType"
                    class="w-full border p-3 rounded-xl mt-2">
                    <option value="doubles">Doubles</option>
                    <option value="singles">Singles</option>
                </select>
            </div>
        </div>
    </div>

    <button onclick="generateMatches()"
        class="bg-blue-600 text-white px-6 py-3 rounded-2xl font-bold hover:bg-blue-700">
        Generate Matches
    </button>

    <div id="output" class="mt-10 space-y-8"></div>

</div>

<script>

function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

function generateMatches() {

    const names = document.getElementById("playerNames").value
        .split("\n")
        .map(n => n.trim())
        .filter(n => n !== "");

    const C = parseInt(document.getElementById("courts").value);
    const R = parseInt(document.getElementById("rounds").value);
    const type = document.getElementById("matchType").value;

    if (names.length < 2) {
        alert("Enter at least 2 players.");
        return;
    }

    let P = names.length;

    let stats = {};
    names.forEach(p => {
        stats[p] = { games: 0, partners: {}, opponents: {} };
    });

    let html = "";

    // 🔥 SPECIAL PERFECT ROTATION FOR 4 PLAYERS DOUBLES
    if (P === 4 && C === 1 && type === "doubles") {

        const rotations = [
            [[names[0],names[1]],[names[2],names[3]]],
            [[names[0],names[2]],[names[1],names[3]]],
            [[names[0],names[3]],[names[1],names[2]]],
        ];

        for (let round = 1; round <= R; round++) {

            const combo = rotations[(round-1) % 3];

            combo.flat().forEach(p => stats[p].games++);

            html += `
            <div class="border-l-4 border-green-500 pl-6">
                <h3 class="text-xl font-black uppercase mb-3">
                    Round ${round}
                </h3>
                <div class="bg-gray-50 p-4 rounded-2xl border text-center">
                    <div class="text-blue-600 font-bold">
                        ${combo[0][0]} & ${combo[0][1]}
                    </div>
                    <div class="text-xs text-gray-400 my-1">VS</div>
                    <div class="text-red-600 font-bold">
                        ${combo[1][0]} & ${combo[1][1]}
                    </div>
                </div>
            </div>`;
        }

        document.getElementById("output").innerHTML = html;
        return;
    }

    // 🔥 GENERAL SMART ENGINE
    for (let round = 1; round <= R; round++) {

        html += `<div class="border-l-4 border-blue-500 pl-6">
                 <h3 class="text-xl font-black uppercase mb-4">
                 Round ${round}</h3>`;

        let players = shuffle([...names]);

        let perMatch = (type === "doubles") ? 4 : 2;
        let playingCount = Math.min(C * perMatch, P);

        let playing = players.slice(0, playingCount);
        let waiting = players.slice(playingCount);

        if (waiting.length > 0) {
            html += `<div class="text-sm text-gray-500 mb-4">
                     Bench: ${waiting.join(", ")}</div>`;
        }

        for (let court = 1; court <= C; court++) {

            if (playing.length < perMatch) break;

            if (type === "singles") {

                const p1 = playing.shift();
                const p2 = playing.shift();

                stats[p1].games++;
                stats[p2].games++;

                html += `
                <div class="bg-gray-50 p-4 rounded-2xl border mb-4 text-center">
                    <div class="font-bold text-blue-600">${p1}</div>
                    <div class="text-xs text-gray-400 my-1">VS</div>
                    <div class="font-bold text-red-600">${p2}</div>
                </div>`;

            } else {

                const p1 = playing.shift();
                const p2 = playing.shift();
                const p3 = playing.shift();
                const p4 = playing.shift();

                stats[p1].games++;
                stats[p2].games++;
                stats[p3].games++;
                stats[p4].games++;

                html += `
                <div class="bg-gray-50 p-4 rounded-2xl border mb-4 text-center">
                    <div class="text-blue-600 font-bold">${p1} & ${p2}</div>
                    <div class="text-xs text-gray-400 my-1">VS</div>
                    <div class="text-red-600 font-bold">${p3} & ${p4}</div>
                </div>`;
            }
        }

        html += `</div>`;
    }

    document.getElementById("output").innerHTML = html;
}

</script>

</body>
</html>
