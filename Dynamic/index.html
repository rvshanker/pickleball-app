        /* Empty state */
        .empty-state{text-align:center;padding:48px 20px;color:#94a3b8;}

        /* Loading spinner */
        @keyframes spin{to{transform:rotate(360deg)}}

        setDone(true);

                    <div style={{fontFamily:'Barlow Condensed,sans-serif',fontSize:26,fontWeight:800,color:'#0f172a'}}>💬 SEND FEEDBACK</div>

                </div>
                {done ? (
                    <div style={{textAlign:'center',padding:'32px 0'}}>

                    </div>
                ) : (
                    <div style={{display:'flex',flexDirection:'column',gap:16}}>
                        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                            <div>
                                <div style={{fontSize:11,fontWeight:700,color:'#475569',textTransform:'uppercase',letterSpacing:.5,marginBottom:6}}>Name (optional)</div>
                                <input style={{width:'100%',padding:'10px 13px',fontSize:14,border:'2px solid #e2e8f0',borderRadius:10,fontFamily:'Outfit,sans-serif',outline:'none'}} value={name} onChange={e=>setName(e.target.value)} placeholder="Your name"/>
                            </div>
                            <div>
                                <div style={{fontSize:11,fontWeight:700,color:'#475569',textTransform:'uppercase',letterSpacing:.5,marginBottom:6}}>Email (optional)</div>
                                <input type="email" style={{width:'100%',padding:'10px 13px',fontSize:14,border:'2px solid #e2e8f0',borderRadius:10,fontFamily:'Outfit,sans-serif',outline:'none'}} value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@email.com"/>
                            </div>
                        </div>
                        <div>
                            <div style={{fontSize:11,fontWeight:700,color:'#475569',textTransform:'uppercase',letterSpacing:.5,marginBottom:8}}>Feedback Type</div>
                            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                                {types.map(([v,l])=>(
                                    <button key={v} onClick={()=>setType(v)} style={{padding:'8px 14px',border:'2px solid '+(type===v?'#059669':'#e2e8f0'),borderRadius:99,background:type===v?'#f0fdf4':'white',color:type===v?'#059669':'#64748b',fontFamily:'Outfit,sans-serif',fontSize:13,fontWeight:600,cursor:'pointer'}}>
                                        {l}
                                    </button>
                                ))}
                            </div>
                        </div>
                        <div>
                            <div style={{fontSize:11,fontWeight:700,color:'#475569',textTransform:'uppercase',letterSpacing:.5,marginBottom:8}}>Overall Rating</div>
                            <div style={{display:'flex',gap:4}}>
                                {[1,2,3,4,5].map(s=>(
                                    <button key={s} onClick={()=>setRating(s)} onMouseEnter={()=>setHoverRating(s)} onMouseLeave={()=>setHoverRating(0)} style={{background:'none',border:'none',fontSize:28,cursor:'pointer',opacity:s<=(hoverRating||rating)?1:.3}}>⭐</button>
                                ))}

                        <div>

                            <textarea style={{width:'100%',padding:'10px 13px',fontSize:14,border:'2px solid #e2e8f0',borderRadius:10,fontFamily:'Outfit,sans-serif',outline:'none',resize:'vertical',minHeight:90}} value={msg} onChange={e=>setMsg(e.target.value)} placeholder="Tell us what's on your mind…"/>
                        </div>
                        <button onClick={submit} disabled={busy} style={{background:'linear-gradient(135deg,#059669,#10b981)',color:'white',border:'none',borderRadius:10,padding:'14px',fontFamily:'Outfit,sans-serif',fontSize:15,fontWeight:700,cursor:'pointer',width:'100%',boxShadow:'0 4px 12px rgba(5,150,105,.3)'}}>

// ── Geo helpers ───────────────────────────────────────────────────────
function haversine(lat1, lon1, lat2, lon2) {
    const R = 3958.8; // miles
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function fmtDist(miles) {
    if (miles < 0.1) return 'Nearby';
    if (miles < 10) return miles.toFixed(1) + ' mi';
    return Math.round(miles) + ' mi';
}

// ── Amenity definitions ───────────────────────────────────────────────
const AMENITIES = [
    {key:'restrooms',label:'🚻 Restrooms'},
    {key:'parking',label:'🅿️ Parking'},
    {key:'lights',label:'💡 Lights'},
    {key:'water',label:'💧 Water'},
    {key:'benches',label:'🪑 Benches'},

// ── Add Court Modal ───────────────────────────────────────────────────
function AddCourtModal({onClose, onAdded}) {
    const [name, setName] = useState('');
    const [address, setAddress] = useState('');
    const [numCourts, setNumCourts] = useState(4);
    const [amenities, setAmenities] = useState([]);
    const [rules, setRules] = useState('');
    const [saving, setSaving] = useState(false);
    const [locating, setLocating] = useState(false);
    const [lat, setLat] = useState(null);
    const [lng, setLng] = useState(null);

    const toggleAmenity = (key) => setAmenities(a => a.includes(key) ? a.filter(x=>x!==key) : [...a, key]);

    const geolocate = () => {
        setLocating(true);
        navigator.geolocation.getCurrentPosition(pos => {
            setLat(pos.coords.latitude);
            setLng(pos.coords.longitude);
            setLocating(false);
        }, () => {
            alert('Could not get location. Please enter address manually.');
            setLocating(false);
        });
    };

    // Simple geocode via nominatim
    const geocodeAddress = async (addr) => {
        try {
            const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addr)}&limit=1`);
            const d = await r.json();
            if (d.length) return { lat: parseFloat(d[0].lat), lng: parseFloat(d[0].lon) };
        } catch(e) {}
        return null;
    };

    const save = async () => {
        if (!name.trim()) { alert('Please enter a court name.'); return; }
        if (!address.trim()) { alert('Please enter an address.'); return; }
        setSaving(true);
        let finalLat = lat, finalLng = lng;
        if (!finalLat || !finalLng) {
            const geo = await geocodeAddress(address);
            if (geo) { finalLat = geo.lat; finalLng = geo.lng; }
            else { finalLat = 0; finalLng = 0; }
        }
        const court = {
            name: name.trim(),
            address: address.trim(),
            lat: finalLat,
            lng: finalLng,
            numberOfCourts: numCourts,
            amenities,
            courtRules: rules.trim(),
            openCourts: numCourts,
            crowdLevel: 'low',
            condition: 'open',
            createdAt: Date.now(),
        };
        try {
            if (fbOk && db) {
                const ref = await db.collection('courts').add(court);
                court.id = ref.id;
                onAdded(court);
            } else {
                alert('Database not available. Please try again.');
            }
        } catch(e) {
            alert('Failed to save court: ' + e.message);
        }
        setSaving(false);
    };

    return (
        <div className="modal-bg" onClick={e => { if(e.target.className === 'modal-bg') onClose(); }}>
            <div className="modal-sheet">
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
                    <div className="fd" style={{fontSize:26,fontWeight:800,color:'#0f172a'}}>ADD A COURT</div>
                    <button onClick={onClose} style={{background:'none',border:'none',fontSize:26,cursor:'pointer',color:'#94a3b8',lineHeight:1}}>×</button>
                </div>

                <div style={{marginBottom:14}}>
                    <span className="flbl">Court / Park Name *</span>
                    <input className="field" value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Dardenne Prairie Athletic Complex"/>
                </div>

                <div style={{marginBottom:14}}>
                    <span className="flbl">Address *</span>
                    <div style={{display:'flex',gap:8}}>
                        <input className="field" value={address} onChange={e=>setAddress(e.target.value)} placeholder="Full street address, city, state" style={{flex:1}}/>
                        <button onClick={geolocate} style={{background:'#f0fdf4',border:'2px solid #10b981',borderRadius:10,padding:'0 14px',cursor:'pointer',fontSize:18,flexShrink:0}} title="Use my location">
                            {locating ? <span className="spin">⏳</span> : '📍'}
                        </button>
                    </div>
                    {lat && <div style={{fontSize:12,color:'#059669',marginTop:4}}>📍 Location captured ({lat.toFixed(4)}, {lng.toFixed(4)})</div>}
                </div>

                <div style={{marginBottom:14}}>
                    <span className="flbl">Number of Courts</span>
                    <div style={{display:'flex',alignItems:'center',gap:12}}>
                        <button onClick={()=>setNumCourts(n=>Math.max(1,n-1))} style={{width:38,height:38,background:'#f1f5f9',border:'2px solid #e2e8f0',borderRadius:9,fontSize:20,cursor:'pointer',fontWeight:700}}>−</button>
                        <span style={{fontSize:24,fontWeight:800,fontFamily:'Barlow Condensed,sans-serif',color:'#0f172a',minWidth:32,textAlign:'center'}}>{numCourts}</span>
                        <button onClick={()=>setNumCourts(n=>Math.min(30,n+1))} style={{width:38,height:38,background:' linear-gradient(135deg,#059669,#10b981)',border:'none',borderRadius:9,fontSize:20,cursor:'pointer',fontWeight:700,color:'white'}}>+</button>
                    </div>
                </div>

                <div style={{marginBottom:14}}>
                    <span className="flbl">Amenities</span>
                    <div style={{display:'flex',flexWrap:'wrap',gap:2}}>
                        {AMENITIES.map(a => (
                            <button key={a.key} className={`amen-tag ${amenities.includes(a.key)?'on':''}`} onClick={()=>toggleAmenity(a.key)}>{a.label}</button>
                        ))}
                    </div>
                </div>

                <div style={{marginBottom:22}}>
                    <span className="flbl">Court Rules / Notes (optional)</span>
                    <textarea className="field" value={rules} onChange={e=>setRules(e.target.value)} placeholder="e.g. Open daily 6am–10pm. Bring your own balls. First come first served." rows={3} style={{resize:'vertical'}}/>
                </div>

                <button className="btn-g" onClick={save} disabled={saving} style={{width:'100%',padding:14,fontSize:16}}>
                    {saving ? '⏳ Saving…' : '➕ Add Court'}
                </button>
            </div>
        </div>
    );
}

// ── Court Card ────────────────────────────────────────────────────────
function CourtCard({court, userLat, userLng, isHero}) {
    const [checkinCount, setCheckinCount] = useState(null);

    useEffect(() => {
        if (!fbOk || !db || !court.id) return;
        // Count active check-ins in this court's subcollection
        const unsub = db.collection('courts').doc(court.id).collection('checkins')
            .where('status', '==', 'active')
            .onSnapshot(snap => setCheckinCount(snap.size), () => setCheckinCount(0));
        return () => unsub();
    }, [court.id]);

    const dist = (userLat && userLng && court.lat && court.lng)
        ? haversine(userLat, userLng, court.lat, court.lng) : null;

    const pillClass = checkinCount === null ? 'empty' : checkinCount === 0 ? 'empty' : checkinCount > 8 ? 'busy' : '';

    const open = court.openCourts !== undefined ? court.openCourts : court.numberOfCourts;
    const total = court.numberOfCourts || 4;

    const goToCourt = () => {
        localStorage.setItem('lastCourtId', court.id);
        localStorage.setItem('lastCourtName', court.name);
        window.location.href = `court.html?id=${court.id}`;
    };

    if (isHero) {
        return (
            <div className="hero-court" onClick={goToCourt} style={{cursor:'pointer'}}>
                <div style={{position:'relative',zIndex:1}}>
                    <div style={{fontSize:11,fontWeight:700,color:'#6ee7b7',textTransform:'uppercase',letterSpacing:.8,marginBottom:6}}>
                        📍 Last Visited
                    </div>
                    <div className="fd" style={{fontSize:26,fontWeight:800,color:'white',marginBottom:4,lineHeight:1.1}}>{court.name}</div>
                    <div style={{fontSize:13,color:'#94a3b8',marginBottom:14}}>{court.address}</div>
                    <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:16}}>
                        <div style={{background:'rgba(255,255,255,.1)',borderRadius:8,padding:'7px 11px',fontSize:13,color:'white',fontWeight:600,display:'flex',flexDirection:'column',gap:4}}>
                            <div style={{fontSize:10,color:'#6ee7b7',fontWeight:700,textTransform:'uppercase',letterSpacing:.5}}>Courts in Rotation</div>
                            <div style={{display:'flex',alignItems:'center',gap:6}}>
                                <div style={{display:'flex',gap:2}}>
                                    {Array.from({length:Math.min(total,8)}).map((_,i)=>(
                                        <div key={i} style={{width:10,height:10,borderRadius:2,background:i<open?'#10b981':'rgba(255,255,255,.2)'}}/>
                                    ))}
                                </div>
                                <span style={{fontSize:12}}>{open}/{total}</span>
                            </div>
                        </div>
                        {checkinCount !== null && (
                            <div style={{background:'rgba(16,185,129,.2)',borderRadius:8,padding:'5px 11px',fontSize:13,color:'#6ee7b7',fontWeight:600}}>
                                {React.createElement("img",{src:PKBALL,style:{width:16,height:16,verticalAlign:"middle",marginRight:4}})}{checkinCount} playing
                            </div>
                        )}
                        {dist !== null && (
                            <div style={{background:'rgba(255,255,255,.08)',borderRadius:8,padding:'5px 11px',fontSize:13,color:'#94a3b8',fontWeight:600}}>
                                📏 {fmtDist(dist)}
                            </div>
                        )}
                    </div>
                    <button className="btn-g" style={{fontSize:15,padding:'11px 28px'}} onClick={e=>{e.stopPropagation();goToCourt();}}>
                        Check In →
                    </button>
                </div>
            </div>
        );
    }

    return (
        <div className="court-item" onClick={goToCourt}>
            <div className="court-icon"><img src={PKBALL} style={{width:26,height:26}}/></div>
            <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:700,fontSize:15,color:'#0f172a',marginBottom:3}}>{court.name}</div>
                <div style={{fontSize:13,color:'#64748b',marginBottom:5,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:'100%'}}>{court.address}</div>
                <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}>
                    <span className={`player-pill ${pillClass}`}>
                        {React.createElement("img",{src:PKBALL,style:{width:14,height:14,verticalAlign:"middle",marginRight:3}})}{checkinCount === null ? '…' : checkinCount} playing
                    </span>
                    <span style={{fontSize:12,color:'#94a3b8'}}>🏟️ {open}/{total}</span>
                    {court.condition && court.condition !== 'open' && (
                        <span style={{fontSize:12,color:'#d97706'}}>⚠️ {court.condition}</span>
                    )}
                </div>
            </div>
            <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:6,flexShrink:0}}>
                {dist !== null && <span className="dist-badge">{fmtDist(dist)}</span>}
                <span style={{color:'#cbd5e1',fontSize:18}}>›</span>
            </div>
        </div>
    );
}

// ── Main App ──────────────────────────────────────────────────────────
function App() {
    const [courts, setCourts] = useState([]);
    const [loading, setLoading] = useState(true);
    const [userLat, setUserLat] = useState(null);
    const [userLng, setUserLng] = useState(null);
    const [search, setSearch] = useState('');
    const [showAdd, setShowAdd] = useState(false);
    const [showFB, setShowFB] = useState(false);
    const [lastCourt, setLastCourt] = useState(null);

    // Load last visited court info
    useEffect(() => {
        const lastId = localStorage.getItem('lastCourtId');
        const lastName = localStorage.getItem('lastCourtName');
        if (lastId && lastName) {
            setLastCourt({ id: lastId, name: lastName, _stub: true });
            // Fetch full details
            if (fbOk && db) {
                db.collection('courts').doc(lastId).get().then(doc => {
                    if (doc.exists) setLastCourt({ id: doc.id, ...doc.data() });
                }).catch(() => {});
            }
        }
    }, []);

    // Get user location
    useEffect(() => {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                setUserLat(pos.coords.latitude);
                setUserLng(pos.coords.longitude);
            }, () => {});
        }
    }, []);

    // Load all courts
    useEffect(() => {
        if (!fbOk || !db) { setLoading(false); return; }
        const unsub = db.collection('courts').orderBy('createdAt', 'desc').onSnapshot(snap => {
            const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            setCourts(list);
            setLoading(false);
        }, err => {
            console.error('Courts load:', err);
            setLoading(false);
        });
        return () => unsub();
    }, []);

    // Sort courts by distance if we have location
    const sortedCourts = [...courts].sort((a, b) => {
        if (!userLat || !userLng) return 0;
        const da = (a.lat && a.lng) ? haversine(userLat, userLng, a.lat, a.lng) : 9999;
        const db2 = (b.lat && b.lng) ? haversine(userLat, userLng, b.lat, b.lng) : 9999;
        return da - db2;
    });

    const filtered = sortedCourts.filter(c =>
        !search || c.name.toLowerCase().includes(search.toLowerCase()) || c.address.toLowerCase().includes(search.toLowerCase())
    );

    // Courts to show in list (exclude the last-visited one from list if hero is shown)
    const listCourts = lastCourt
        ? filtered.filter(c => c.id !== lastCourt.id)
        : filtered;

    const handleAdded = (court) => {
        setShowAdd(false);
        localStorage.setItem('lastCourtId', court.id);
        localStorage.setItem('lastCourtName', court.name);
        window.location.href = `court.html?id=${court.id}`;
    };

    return (
        <div style={{minHeight:'100vh',background:'#f1f5f9',display:'flex',flexDirection:'column'}}>
            {/* Nav */}
            <div className="nav">
                <div className="fd" style={{fontSize:24,fontWeight:800,flex:1}}>
                    <span style={{color:'white'}}>PICKLE</span><span style={{color:'#34d399'}}>CONNECT</span>
                </div>
                <div style={{width:8,height:8,borderRadius:'50%',background:'#10b981',animation:'pulse 2s infinite',flexShrink:0}}/>
                <span style={{fontSize:12,color:'#6ee7b7',fontWeight:600}}>Live</span>
            </div>

            <div className="pg">
                {/* Hero — last visited court */}
                {lastCourt && (
                    <CourtCard court={lastCourt} userLat={userLat} userLng={userLng} isHero={true}/>
                )}

                {/* Section header */}
                <div className="sec-hdr">
                    <div className="fd" style={{fontSize:20,fontWeight:800,color:'#0f172a'}}>
                        {userLat ? '📍 NEARBY COURTS' : <span><img src={PKBALL} style={{width:18,height:18,verticalAlign:'middle',marginRight:4}}/> ALL COURTS</span>}
                    </div>
                    <button className="btn-g" onClick={()=>setShowAdd(true)} style={{padding:'8px 16px',fontSize:13}}>
                        + Add Court
                    </button>
                </div>

                {/* Search */}
                <div className="search-wrap">
                    <span className="search-icon">🔍</span>
                    <input
                        className="search-inp"
                        value={search}
                        onChange={e=>setSearch(e.target.value)}
                        placeholder="Search by name or city…"
                    />
                </div>

                {/* Court list */}
                {loading ? (
                    <div style={{textAlign:'center',padding:'48px 0',color:'#94a3b8'}}>
                        <span className="spin" style={{fontSize:28}}>⚡</span>
                        <div style={{marginTop:10,fontSize:14}}>Loading courts…</div>
                    </div>
                ) : listCourts.length === 0 && !lastCourt ? (
                    <div className="empty-state">
                        <div style={{marginBottom:12}}><img src={PKBALL} style={{width:52,height:52}}/></div>
                        <div style={{fontSize:18,fontWeight:700,color:'#374151',marginBottom:6}}>
                            {search ? 'No courts found' : 'No courts yet'}
                        </div>
                        <div style={{fontSize:14,marginBottom:20}}>
                            {search ? 'Try a different search term' : 'Be the first to add your local courts!'}
                        </div>
                        {!search && <button className="btn-g" onClick={()=>setShowAdd(true)}>+ Add a Court</button>}
                    </div>
                ) : (
                    <>
                        {listCourts.map(court => (
                            <CourtCard key={court.id} court={court} userLat={userLat} userLng={userLng}/>
                        ))}
                        {listCourts.length === 0 && lastCourt && (
                            <div className="empty-state">
                                <div style={{fontSize:14}}>No other courts found nearby.</div>
                            </div>
                        )}
                    </>
                )}
            </div>

            {/* Footer */}
            <div style={{marginTop:'auto'}}>
                {/* Tournament Generator Banner */}
                <div style={{background:'linear-gradient(135deg,#4c1d95 0%,#7c3aed 50%,#a855f7 100%)',padding:'18px 20px',display:'flex',alignItems:'center',gap:16}}>
                    <div style={{width:48,height:48,background:'rgba(255,255,255,.15)',borderRadius:12,display:'flex',alignItems:'center',justifyContent:'center',fontSize:26,flexShrink:0}}>🏆</div>
                    <div style={{flex:1,minWidth:0}}>
                        <div style={{fontFamily:'Barlow Condensed,sans-serif',fontSize:20,fontWeight:800,color:'white',letterSpacing:.3}}>TOURNAMENT GENERATOR</div>
                        <div style={{fontFamily:'Outfit,sans-serif',fontSize:13,color:'#e9d5ff',marginTop:1}}>Round-robin brackets & live scoring</div>
                    </div>
                    <a href="tournament.html" style={{background:'white',color:'#7c3aed',padding:'10px 18px',borderRadius:10,fontFamily:'Outfit,sans-serif',fontSize:13,fontWeight:800,textDecoration:'none',whiteSpace:'nowrap',boxShadow:'0 4px 12px rgba(0,0,0,.2)',flexShrink:0}}>Open →</a>
                </div>
                <div style={{textAlign:'center',padding:'16px 16px 24px',fontSize:12,color:'#94a3b8',borderTop:'1px solid #e2e8f0',background:'white'}}>
                    <div style={{display:'flex',justifyContent:'center',alignItems:'center',gap:12,flexWrap:'wrap'}}>
                        <span>© 2025 PickleConnect. All rights reserved.</span>
                        <span>·</span>
                        <button onClick={()=>setShowFB(true)} style={{background:'none',border:'none',color:'#059669',fontFamily:'Outfit,sans-serif',fontSize:12,fontWeight:700,cursor:'pointer',padding:0}}>💬 Feedback</button>
                    </div>
                </div>
            </div>

            {/* Add court modal */}
            {showAdd && <AddCourtModal onClose={()=>setShowAdd(false)} onAdded={handleAdded}/>}
            {showFB && <FeedbackModal onClose={()=>setShowFB(false)}/>}
        </div>
    );
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
