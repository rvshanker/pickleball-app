<!doctype html>
<html lang="en">

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<style>
:root{--bg:#0E1A24;--bg-2:#172533;--bg-3:#1F303F;--ink:#F0E9D6;--ink-2:#A8B0BA;--ink-3:#6E7A87;--rule:#283D4F;--rule-2:#3B5163;--accent:#D4A848;--teal:#4ABFB0;--red:#C8352F;--green:#1F7A1F;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:"Inter",sans-serif;min-height:100vh;}
.serif{font-family:"Fraunces",Georgia,serif;}
.mono{font-family:"JetBrains Mono",monospace;}
.card{background:var(--bg-2);border:1px solid var(--rule);border-radius:14px;}
.btn{font-family:"JetBrains Mono",monospace;font-size:12px;padding:.5rem 1rem;border-radius:8px;cursor:pointer;border:none;transition:all .15s;white-space:nowrap;}
.btn-primary{background:var(--accent);color:var(--bg);font-weight:700;}
.btn-primary:hover{opacity:.85;}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}
.btn-ghost{background:var(--bg-3);border:1px solid var(--rule);color:var(--ink-2);}
.btn-ghost:hover:not(:disabled){border-color:var(--rule-2);color:var(--ink);}
.btn-ghost:disabled{opacity:.4;cursor:not-allowed;}
.btn-success{background:rgba(74,191,176,.15);border:1px solid rgba(74,191,176,.4);color:#4ABFB0;}
.btn-danger{background:rgba(200,53,47,.15);border:1px solid rgba(200,53,47,.4);color:#E76F51;}
.status-pill{display:inline-flex;align-items:center;gap:5px;font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:6px;}
.status-real{background:rgba(74,191,176,.12);border:1px solid rgba(74,191,176,.3);color:#4ABFB0;}
.status-synth{background:rgba(212,168,72,.1);border:1px solid rgba(212,168,72,.25);color:#D4A848;}
.status-fetching{background:rgba(74,191,176,.08);border:1px solid rgba(74,191,176,.2);color:var(--teal);}
.status-error{background:rgba(200,53,47,.12);border:1px solid rgba(200,53,47,.3);color:#E76F51;}
.progress-bar{height:3px;border-radius:2px;background:var(--rule);overflow:hidden;}
.progress-fill{height:100%;background:var(--teal);transition:width .4s;}
input[type=text]{background:var(--bg-3);border:1px solid var(--rule);color:var(--ink);border-radius:8px;padding:.5rem .8rem;font-family:"JetBrains Mono",monospace;font-size:12px;width:100%;}
input[type=text]:focus{outline:none;border-color:var(--accent);}
textarea{background:var(--bg-3);border:1px solid var(--rule);color:var(--ink);border-radius:8px;padding:.75rem;font-family:"JetBrains Mono",monospace;font-size:11px;resize:vertical;width:100%;}
textarea:focus{outline:none;border-color:var(--accent);}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:999px}
.log-line{padding:3px 0;border-bottom:1px solid rgba(40,61,79,.5);font-size:11px;font-family:"JetBrains Mono",monospace;}
.log-ok{color:#4ABFB0;}
.log-warn{color:#D4A848;}
.log-err{color:#E76F51;}
.log-info{color:var(--ink-2);}
</style>
</head>
<body>
<div id="root"></div>

// ── API FETCH ─────────────────────────────────────────────────
async function fetchYearFromWikipedia(year, addLog) {
  addLog(`info`, `Calling Claude API with web search for ${year} TN election data...`);

  const isSameDelimitation = year >= 2011;
  const delimNote = isSameDelimitation
    ? "These use the exact same 234 constituencies as the 2021 election (post-2008 delimitation)."
    : "Note: Pre-2008 delimitation applies. Map results to the current 234-seat list as best as possible using district and name matching.";

  const constList = Object.entries(CONST_NAMES).map(([no,name])=>`${no}:${name}`).join(", ");

  const prompt = `Fetch the complete constituency-by-constituency winner results for the ${year} Tamil Nadu Legislative Assembly election from Wikipedia.

${delimNote}

The current 234 constituencies (no:name) are: ${constList}

Search Wikipedia for "${year} Tamil Nadu Legislative Assembly election" and find the full results table.

Return ONLY a valid JSON array (absolutely no other text, no markdown code fences, no explanation). Each object must have exactly these fields:
{"no": <constituency number 1-234>, "name": "<constituency name>", "winner": "<winner full name>", "party": "<party code>", "district": "<district name>", "margin": <margin as integer>}

Use these party codes only: DMK, AIADMK, ADMK, INC, CPI, CPI(M), PMK, MDMK, TMC, BJP, VCK, IND
Return all 234 constituencies. If a constituency result is not found, use "Unknown" for winner and "IND" for party.`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 8000,
      system: "You are a precise data extraction assistant. You MUST return ONLY a valid JSON array with no surrounding text, no markdown, no explanation whatsoever. Just the raw JSON array starting with [ and ending with ].",
      tools: [{"type": "web_search_20250305", "name": "web_search"}],
      messages: [{role: "user", content: prompt}]
    })
  });

  if (!response.ok) {
    throw new Error(`API error ${response.status}: ${await response.text()}`);
  }

  const data = await response.json();
  addLog('info', `API response received. Processing ${data.content?.length || 0} content blocks...`);

  // Extract text from all text blocks
  const textBlocks = (data.content || []).filter(b => b.type === 'text');
  const toolResults = (data.content || []).filter(b => b.type === 'tool_result' || b.type === 'mcp_tool_result');
  addLog('info', `Found ${textBlocks.length} text blocks, ${toolResults.length} tool results`);

  const fullText = textBlocks.map(b => b.text).join('\n').trim();
  addLog('info', `Raw response preview: ${fullText.substring(0, 200)}...`);

  // Try to extract JSON array
  let parsed = null;
  const jsonMatch = fullText.match(/\[[\s\S]*\]/);
  if (jsonMatch) {
    try {
      parsed = JSON.parse(jsonMatch[0]);
      addLog('ok', `✓ Parsed ${parsed.length} constituency records`);
    } catch(e) {
      addLog('err', `JSON parse failed: ${e.message}`);
      throw new Error('Could not parse JSON from response');
    }
  } else {
    addLog('err', `No JSON array found in response`);
    addLog('info', `Full response: ${fullText.substring(0, 500)}`);
    throw new Error('No JSON array in response');
  }

  return parsed;
}

// ── MAIN APP ─────────────────────────────────────────────────
function App() {
  var s1=useState({}); var yearData=s1[0]; var setYearData=s1[1];
  var s2=useState({}); var yearStatus=s2[0]; var setYearStatus=s2[1]; // idle|fetching|done|error
  var s3=useState({}); var logs=s3[0]; var setLogs=s3[1];
  var s4=useState(null); var activeYear=s4[0]; var setActiveYear=s4[1];
  var s5=useState(''); var previewData=s5[0]; var setPreviewData=s5[1];

  function addLog(year, type, msg) {
    setLogs(function(prev) {
      var yl = prev[year] || [];
      return {...prev, [year]: [...yl, {type, msg, t: Date.now()}]};
    });
  }

  async function fetchYear(year) {
    setYearStatus(function(p){return {...p,[year]:'fetching'};});
    setLogs(function(p){return {...p,[year]:[]};});
    setActiveYear(year);
    try {
      var data = await fetchYearFromWikipedia(year, function(type,msg){addLog(year,type,msg);});
      // Validate: should have constituency data
      if (!data || data.length < 10) throw new Error(`Too few results: ${data?.length}`);
      addLog(year,'ok',`✓ Got ${data.length} constituencies. Verifying...`);

      // Enrich with party full names
      var enriched = data.map(function(c) {
        return {
          ...c,
          partyFull: PARTY_FULL[c.party] || c.party,
          votes: c.votes || 0,
          electors: c.electors || 0,
          pollPct: c.pollPct || "—",
          marginPct: c.margin ? (c.margin > 0 ? (c.margin/1000).toFixed(1)+"k" : "—") : "—",
          type: c.type || "GEN",
          alliance: c.alliance || (["DMK","INC","CPI","CPI(M)","VCK"].includes(c.party)?"dmk_front":"others"),
        };
      });

      // Count by party
      var partyCount = {};
      enriched.forEach(function(c){partyCount[c.party]=(partyCount[c.party]||0)+1;});
      var summary = Object.entries(partyCount).sort((a,b)=>b[1]-a[1]).map(([p,n])=>`${p}:${n}`).join(', ');
      addLog(year,'ok',`Party distribution: ${summary}`);
      addLog(year,'ok',`✓ Data ready for year ${year}`);

      setYearData(function(p){return {...p,[year]:enriched};});
      setYearStatus(function(p){return {...p,[year]:'done'};});
    } catch(e) {
      addLog(year,'err',`Error: ${e.message}`);
      setYearStatus(function(p){return {...p,[year]:'error'};});
    }
  }

  function exportData() {
    var out = {};
    Object.keys(yearData).forEach(function(y){out[y]=yearData[y];});
    var blob = new Blob([JSON.stringify(out,null,2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'tn-elections-real-data.json';
    a.click();
  }

  var fetchedCount = Object.keys(yearData).length;
  var totalNeeded = YEARS.length;

  return (
    <div style={{maxWidth:900,margin:"0 auto",padding:"24px 16px"}}>
      {/* Header */}
      <div style={{marginBottom:32}}>
        <div className="mono" style={{fontSize:10,letterSpacing:".3em",color:"var(--teal)",textTransform:"uppercase",marginBottom:8}}>Tamil Nadu Elections · Data Tool</div>
        <h1 className="serif" style={{fontSize:36,fontWeight:900,lineHeight:1,marginBottom:12}}>Real Data Fetcher</h1>
        <p style={{color:"var(--ink-2)",fontSize:14,lineHeight:1.6,maxWidth:620}}>
          This tool fetches official election results from Wikipedia via the Claude AI API.
          Each year is fetched independently with live web search.
          <strong style={{color:"var(--accent)"}}> 2011 and 2016 are most reliable</strong> — same 234 constituencies as 2021.
          Older years use pre-delimitation boundaries which may not map perfectly.
        </p>
        <div style={{marginTop:12,padding:"10px 14px",background:"rgba(200,53,47,.1)",border:"1px solid rgba(200,53,47,.3)",borderRadius:10,fontSize:12,color:"#E76F51"}}>
          <strong>Why 1971–2016 data was wrong:</strong> The main page used algorithmically generated placeholder names. Only seat totals (DMK won X, AIADMK won Y) were real. Every candidate name was synthetic. This tool replaces them with real Wikipedia data.
        </div>
      </div>

      {/* Progress */}
      <div className="card" style={{padding:20,marginBottom:24}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <span className="mono" style={{fontSize:11,color:"var(--ink-3)",textTransform:"uppercase",letterSpacing:".1em"}}>Overall Progress</span>
          <span className="mono" style={{fontSize:12,color:"var(--accent)",fontWeight:700}}>{fetchedCount} / {totalNeeded} years fetched</span>
        </div>
        <div className="progress-bar"><div className="progress-fill" style={{width:(fetchedCount/totalNeeded*100)+"%"}}></div></div>
        {fetchedCount === totalNeeded && (
          <button className="btn btn-primary" style={{marginTop:14,width:"100%",fontSize:13,padding:".7rem"}} onClick={exportData}>
            ⬇ Export All Real Data as JSON
          </button>
        )}
        {fetchedCount > 0 && fetchedCount < totalNeeded && (
          <button className="btn btn-ghost" style={{marginTop:14,width:"100%"}} onClick={exportData}>
            ⬇ Export {fetchedCount} Fetched Year{fetchedCount>1?"s":""} So Far
          </button>
        )}
      </div>

      {/* Year cards */}
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        {YEARS.map(function(year) {
          var status = yearStatus[year] || 'idle';
          var data = yearData[year];
          var yLogs = logs[year] || [];
          var isActive = activeYear === year;
          var isNew = year >= 2011;

          return (
            <div key={year} className="card" style={{overflow:"hidden"}}>
              <div style={{padding:"16px 20px",display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
                {/* Year + label */}
                <div style={{minWidth:100}}>
                  <div className="serif" style={{fontSize:28,fontWeight:900,lineHeight:1,color:status==='done'?"var(--teal)":status==='error'?"var(--accent-2)":"var(--ink)"}}>{year}</div>
                  <div className="mono" style={{fontSize:9,color:"var(--ink-3)",marginTop:2}}>{isNew?"SAME DELIMITATION":"PRE-2008 DELIMITATION"}</div>
                </div>

                {/* Status pill */}
                <div style={{flex:1}}>
                  {status==='idle' && <span className="status-pill status-synth">~ SYNTHETIC DATA</span>}
                  {status==='fetching' && <span className="status-pill status-fetching">⟳ FETCHING FROM WIKIPEDIA...</span>}
                  {status==='done' && <span className="status-pill status-real">✓ REAL DATA · {data?.length||0} CONSTITUENCIES</span>}
                  {status==='error' && <span className="status-pill status-error">✗ FETCH FAILED — SEE LOG</span>}
                  {!isNew && status==='idle' && <div className="mono" style={{fontSize:9,color:"var(--ink-3)",marginTop:4}}>Constituency boundaries differ from 2021. Matching by name where possible.</div>}
                </div>

                {/* Actions */}
                <div style={{display:"flex",gap:8}}>
                  {status==='done' && (
                    <button className="btn btn-ghost" style={{fontSize:11}} onClick={function(){setActiveYear(isActive?null:year);}}>
                      {isActive?"Hide":"View"} {data?.length} records
                    </button>
                  )}
                  <button
                    className={"btn "+(status==='done'?"btn-ghost":"btn-primary")}
                    disabled={status==='fetching'}
                    onClick={function(){fetchYear(year);setActiveYear(year);}}
                    style={{minWidth:120}}
                  >
                    {status==='fetching'?"Fetching...":status==='done'?"Re-fetch":"Fetch from Wikipedia"}
                  </button>
                </div>
              </div>

              {/* Logs */}
              {isActive && yLogs.length > 0 && (
                <div style={{padding:"12px 20px",borderTop:"1px solid var(--rule)",background:"var(--bg)",maxHeight:180,overflowY:"auto"}}>
                  {yLogs.map(function(l,i){
                    return <div key={i} className={"log-line log-"+l.type}>{l.msg}</div>;
                  })}
                </div>
              )}

              {/* Preview table */}
              {isActive && data && (
                <div style={{padding:"0 0 16px"}}>
                  <div style={{padding:"8px 20px",borderTop:"1px solid var(--rule)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span className="mono" style={{fontSize:10,color:"var(--ink-3)"}}>Preview — first 20 of {data.length}</span>
                    <button className="btn btn-ghost" style={{fontSize:10,padding:"3px 8px"}} onClick={function(){
                      setPreviewData(JSON.stringify(data,null,2));
                    }}>View full JSON</button>
                  </div>
                  <div style={{overflowX:"auto"}}>
                    <table style={{width:"100%",fontSize:12,borderCollapse:"collapse"}}>
                      <thead>
                        <tr style={{background:"var(--bg-3)"}}>
                          {["#","Constituency","District","Winner","Party","Margin"].map(function(h){
                            return <th key={h} style={{padding:"8px 12px",textAlign:"left",fontFamily:"JetBrains Mono",fontSize:9,letterSpacing:".1em",textTransform:"uppercase",color:"var(--ink-3)",fontWeight:400}}>{h}</th>;
                          })}
                        </tr>
                      </thead>
                      <tbody>
                        {data.slice(0,20).map(function(c,i){
                          return (
                            <tr key={c.no||i} style={{borderTop:"1px solid var(--rule)"}}>
                              <td style={{padding:"7px 12px",fontFamily:"JetBrains Mono",fontSize:11,color:"var(--ink-3)"}}>{c.no}</td>
                              <td style={{padding:"7px 12px",fontWeight:600}}>{c.name}</td>
                              <td style={{padding:"7px 12px",color:"var(--ink-2)",fontSize:12}}>{c.district}</td>
                              <td style={{padding:"7px 12px"}}>{c.winner}</td>
                              <td style={{padding:"7px 12px"}}>
                                <span style={{fontFamily:"JetBrains Mono",fontSize:10,fontWeight:700,padding:"2px 6px",borderRadius:4,background:"rgba(255,255,255,.06)",color:"var(--ink)"}}>{c.party}</span>
                              </td>
                              <td style={{padding:"7px 12px",fontFamily:"JetBrains Mono",fontSize:11,color:"var(--ink-2)"}}>{c.margin?.toLocaleString("en-IN")||"—"}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* JSON preview modal */}
      {previewData && (
        <div style={{position:"fixed",inset:0,background:"rgba(10,18,26,.9)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div className="card" style={{maxWidth:700,width:"100%",maxHeight:"80vh",display:"flex",flexDirection:"column"}}>
            <div style={{padding:"16px 20px",borderBottom:"1px solid var(--rule)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span className="mono" style={{fontSize:11,color:"var(--teal)"}}>FULL JSON DATA</span>
              <div style={{display:"flex",gap:8}}>
                <button className="btn btn-primary" style={{fontSize:11}} onClick={function(){
                  navigator.clipboard.writeText(previewData).then(function(){alert("Copied to clipboard!");});
                }}>Copy JSON</button>
                <button className="btn btn-ghost" style={{fontSize:11}} onClick={function(){setPreviewData('');}}>Close</button>
              </div>
            </div>
            <textarea style={{flex:1,minHeight:400,fontFamily:"JetBrains Mono",fontSize:10,lineHeight:1.5}} readOnly value={previewData}/>
          </div>
        </div>
      )}

      {/* Usage instructions */}
      <div style={{marginTop:24,padding:20,background:"var(--bg-2)",borderRadius:14,border:"1px solid var(--rule)"}}>
        <div className="mono" style={{fontSize:10,color:"var(--teal)",textTransform:"uppercase",letterSpacing:".1em",marginBottom:10}}>How to use</div>
        <ol style={{color:"var(--ink-2)",fontSize:13,lineHeight:1.9,paddingLeft:18}}>
          <li>Click <strong style={{color:"var(--ink)"}}>Fetch from Wikipedia</strong> for each year — starts with 2016 and 2011 for best results</li>
          <li>The AI searches Wikipedia, extracts the constituency table, and returns structured JSON</li>
          <li>Review the preview table to verify the data looks correct</li>
          <li>Once all years are done, click <strong style={{color:"var(--accent)"}}>Export All Real Data as JSON</strong></li>
          <li>The exported file can replace the synthetic data block in the main elections page</li>
        </ol>
        <div style={{marginTop:12,padding:"10px 14px",background:"rgba(74,191,176,.08)",border:"1px solid rgba(74,191,176,.2)",borderRadius:8,fontSize:12,color:"var(--teal)"}}>
          <strong>Note on older years (1977–2006):</strong> Tamil Nadu used different constituency boundaries before the 2008 delimitation. The fetch will attempt to map results to current constituency names where possible, but some may not align perfectly.
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
