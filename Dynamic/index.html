<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PickleConnect</title>
<meta name="theme-color" content="#0D1B2A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --green:#2ECC71;--green-dark:#27AE60;--green-dim:rgba(46,204,113,0.12);
  --navy:#0D1B2A;--navy2:#142232;--card:#1A2B3C;--card2:#1F3347;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --text:#F0F4F8;--muted:#7A9BB5;--muted2:rgba(122,155,181,0.5);
  --accent:#F7C948;--blue:#5B9BF7;--red:#F75B5B;
  --nav-h:62px;
}
html,body,#root{height:100%;overflow:hidden;}
html,body{max-width:100vw;overflow-x:hidden;}
body{padding-top:0!important;padding-bottom:0!important;}
body{font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--text);font-size:15px;-webkit-text-size-adjust:100%;}

/* Layout shell — sits between nav bars injected by nav.js */
.app-shell{display:flex;flex-direction:column;position:fixed;top:54px;left:0;right:0;bottom:62px;max-width:480px;margin:0 auto;background:var(--navy);}
.screen-body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:16px;}
.screen-body::-webkit-scrollbar{display:none;}
.top-bar{display:none!important;}
.bottom-nav{display:none!important;}

/* Buttons */
.btn{padding:11px 20px;border-radius:12px;border:none;font-family:'DM Sans',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:7px;justify-content:center;}
.btn-primary{background:linear-gradient(135deg,#2ECC71,#27AE60);color:white;box-shadow:0 4px 14px rgba(46,204,113,0.35);}
.btn-primary:hover{opacity:.9;}
.btn-ghost{background:transparent;color:var(--green);border:1.5px solid rgba(46,204,113,0.35);}
.btn-ghost:hover{background:var(--green-dim);}
.btn-danger{background:rgba(247,91,91,0.12);color:var(--red);border:1px solid rgba(247,91,91,0.2);}
.btn-sm{padding:7px 14px;font-size:0.78rem;border-radius:10px;}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:0.9rem;cursor:pointer;position:relative;flex-shrink:0;transition:background .15s;}
.icon-btn:hover{background:var(--card2);}
.badge-dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;border-radius:8px;background:#ef4444;color:white;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px;border:1.5px solid var(--navy);}

/* Modal overlay — z-index above nav.js (9900) */
.modal-overlay{position:fixed;inset:0;background:rgba(5,10,18,0.82);backdrop-filter:blur(8px);z-index:9950;display:flex;align-items:flex-end;justify-content:center;}
.modal-sheet{background:var(--navy2);border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;overflow-x:hidden;padding:20px 20px 90px;animation:slideUp .28s ease;}
.modal-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 18px;}
.modal-title{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;margin-bottom:4px;}

/* Forms */
.fi{width:100%;padding:11px 14px;background:var(--card2);border:1px solid var(--border2);border-radius:12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.9rem;outline:none;transition:border-color .15s;}
.fi:focus{border-color:rgba(46,204,113,0.5);}
.fi::placeholder{color:var(--muted2);}
select.fi{-webkit-appearance:none;cursor:pointer;}
textarea.fi{resize:vertical;min-height:60px;}
.fl{display:block;font-size:0.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;}
.fg{margin-bottom:14px;}
.og{display:flex;gap:6px;flex-wrap:wrap;}
.ob{padding:6px 13px;border-radius:10px;border:1px solid var(--border2);background:transparent;font-family:'DM Sans',sans-serif;font-size:0.78rem;font-weight:600;cursor:pointer;color:var(--muted);transition:all .15s;}
.ob.s{border-color:rgba(46,204,113,0.4);background:var(--green-dim);color:var(--green);}

/* Tags */
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;font-size:0.65rem;font-weight:600;white-space:nowrap;}
.t-green{background:rgba(46,204,113,0.12);color:var(--green);}
.t-amber{background:rgba(247,201,72,0.12);color:var(--accent);}
.t-blue{background:rgba(91,155,247,0.12);color:var(--blue);}
.t-muted{background:rgba(122,155,181,0.12);color:var(--muted);}
.t-red{background:rgba(247,91,91,0.12);color:var(--red);}

/* Cards */
.court-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .15s;}
.court-card:hover{border-color:var(--border2);}
.court-icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#3a7d44,#2ECC71);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}
.court-info{flex:1;min-width:0;}
.court-info h4{font-size:0.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.court-info p{font-size:0.68rem;color:var(--muted);margin-top:3px;}
.court-badge{font-size:0.62rem;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.badge-open{background:rgba(46,204,113,0.15);color:var(--green);}
.badge-busy{background:rgba(247,201,72,0.15);color:var(--accent);}
.badge-full{background:rgba(247,91,91,0.15);color:var(--red);}

/* Player card */
.player-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color .15s;}
.player-card.expanded{border-color:rgba(46,204,113,0.3);}
.pc-row{display:flex;align-items:center;gap:12px;}
.pc-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#1F3347,#2ECC71);display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;color:white;flex-shrink:0;overflow:hidden;}
.pc-info{flex:1;min-width:0;}
.pc-name{font-weight:700;font-size:0.9rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.pc-sub{font-size:0.7rem;color:var(--muted);margin-top:2px;}
.pc-skill{background:var(--green-dim);border:1px solid rgba(46,204,113,0.2);color:var(--green);font-size:0.65rem;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.pc-expand{border-top:1px solid var(--border);margin-top:12px;padding-top:12px;}

/* Filter pills */
.fp-label{font-size:0.65rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
.fp-pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
.fp-pill{padding:5px 11px;border-radius:8px;border:1.5px solid var(--border2);background:transparent;font-family:'DM Sans',sans-serif;font-size:0.72rem;font-weight:600;cursor:pointer;color:var(--muted);}
.fp-pill.s{background:var(--green-dim);color:var(--green);border-color:rgba(46,204,113,0.4);}

/* Tab pills */
.tab-pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:16px;padding-bottom:2px;}
.tab-pills::-webkit-scrollbar{display:none;}
.pill{padding:6px 14px;border-radius:20px;font-size:0.72rem;font-weight:600;white-space:nowrap;border:1px solid var(--border);color:var(--muted);background:var(--card);cursor:pointer;flex-shrink:0;transition:all .15s;}
.pill.active{background:var(--green-dim);border-color:rgba(46,204,113,0.35);color:var(--green);}

/* Stats */
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:20px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 8px;text-align:center;cursor:pointer;}
.stat-num{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:700;color:var(--text);}
.stat-num.hi{color:var(--green);}
.stat-lbl{font-size:0.6rem;color:var(--muted);margin-top:2px;font-weight:600;}

/* Section title */
.section-title{font-size:0.68rem;font-weight:700;letter-spacing:0.11em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}

/* Auth */
.auth-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding:32px 24px;text-align:center;}
.auth-logo{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;color:var(--green);margin-bottom:4px;}
.google-btn{background:white;color:#333;border:none;border-radius:12px;padding:13px 24px;font-weight:700;font-size:0.95rem;cursor:pointer;font-family:'DM Sans',sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;width:100%;max-width:320px;justify-content:center;}

/* Profile */
.profile-hero{background:linear-gradient(135deg,var(--navy2),var(--card));border-radius:20px;padding:20px;margin-bottom:16px;text-align:center;}
.profile-avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#1F3347,#2ECC71);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;color:white;margin:0 auto 12px;overflow:hidden;border:3px solid rgba(46,204,113,0.3);}
.profile-avatar img{width:100%;height:100%;object-fit:cover;}
.profile-name{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:800;}
.settings-row{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:border-color .15s;}
.settings-row:hover{border-color:var(--border2);}
.settings-row-left{display:flex;align-items:center;gap:12px;}

/* Login prompt */
.login-prompt-card{background:var(--card2);border:1px solid var(--border2);border-radius:20px;padding:24px;text-align:center;}

/* Map */
.map-box{border-radius:16px;overflow:hidden;height:140px;margin-bottom:16px;position:relative;background:#0f1f14;border:1px solid var(--border);}
.map-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(46,204,113,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(46,204,113,0.05) 1px,transparent 1px);background-size:28px 28px;}
.map-pin{position:absolute;font-size:1.3rem;}
.map-label{position:absolute;bottom:10px;right:12px;font-size:0.62rem;color:var(--green);font-weight:700;}

/* Chat */
.chat-bubble{max-width:78%;padding:9px 13px;border-radius:14px;font-size:0.85rem;line-height:1.5;margin-bottom:5px;word-wrap:break-word;}
.bubble-them{background:var(--card2);color:var(--text);border-bottom-left-radius:4px;}
.bubble-me{background:linear-gradient(135deg,#2ECC71,#27AE60);color:white;border-bottom-right-radius:4px;}
.bubble-time{font-size:0.6rem;opacity:.55;margin-top:2px;}

/* FAB */
.fab-wrap{position:fixed;bottom:62px;left:50%;transform:translateX(-50%);z-index:200;height:44px;display:flex;align-items:center;justify-content:center;pointer-events:none;width:200px;}
.fab{pointer-events:all;background:linear-gradient(135deg,#2ECC71,#27AE60);color:#fff;font-family:'Syne',sans-serif;font-size:0.68rem;font-weight:800;letter-spacing:0.06em;padding:0 18px;height:42px;border-radius:24px;display:flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 4px 16px rgba(46,204,113,0.5);cursor:pointer;border:2px solid rgba(255,255,255,0.2);transition:transform .15s;}
.fab.open{background:linear-gradient(135deg,#142232,#1A2B3C);}
.fab-overlay{position:fixed;inset:0;background:rgba(5,10,15,0.88);backdrop-filter:blur(10px);z-index:9940;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:calc(62px + 60px);animation:fadeIn .2s ease;}
.fab-sheet{width:100%;max-width:480px;padding:0 20px 8px;}
.fab-sheet-title{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;text-align:center;margin-bottom:4px;}
.fab-sheet-sub{text-align:center;font-size:0.8rem;color:var(--muted);margin-bottom:22px;}
.fab-option{background:var(--card);border:1px solid var(--border2);border-radius:18px;padding:16px 18px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;}
.fab-option::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px;}
.opt1::before{background:var(--green);}.opt2::before{background:var(--accent);}.opt3::before{background:var(--blue);}
.opt-num{font-family:'Syne',sans-serif;font-size:1.7rem;font-weight:800;width:34px;text-align:center;flex-shrink:0;}
.opt1 .opt-num{color:var(--green);}.opt2 .opt-num{color:var(--accent);}.opt3 .opt-num{color:var(--blue);}
.opt-text h3{font-family:'Syne',sans-serif;font-size:0.95rem;font-weight:700;}
.opt-text p{font-size:0.72rem;color:var(--muted);margin-top:2px;}
.fab-cancel{text-align:center;margin-top:10px;color:var(--muted);font-size:0.8rem;font-weight:600;cursor:pointer;padding:8px;}

/* Misc */
.empty-state{text-align:center;padding:48px 20px;}
.empty-icon{font-size:2.5rem;margin-bottom:10px;}
.empty-title{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;margin-bottom:6px;}
.empty-sub{font-size:0.8rem;color:var(--muted);margin-bottom:18px;}
.divider{height:1px;background:var(--border);margin:16px 0;}
.px{padding:0 18px;}
.logo{font-family:'Syne',sans-serif;font-size:1rem;font-weight:800;color:var(--green);letter-spacing:-0.02em;}
.logo span{color:var(--text);}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .2s ease;}

/* Court Detail View */
.cd-section{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin:0 16px 12px;}
.cd-name-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:4px;}
.cd-badges{display:flex;gap:6px;align-items:center;flex-shrink:0;}
.cd-live{display:inline-flex;align-items:center;gap:4px;font-size:0.6rem;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:.05em;}
.cd-live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:fadeIn 1s infinite alternate;}
.cd-crowd-badge{font-size:0.6rem;font-weight:700;padding:3px 8px;border-radius:8px;}
.cd-crowd-badge.low{background:rgba(46,204,113,0.15);color:var(--green);}
.cd-crowd-badge.medium{background:rgba(247,201,72,0.15);color:var(--accent);}
.cd-crowd-badge.high{background:rgba(247,91,91,0.15);color:var(--red);}
.cd-wx-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.cd-wx-card{background:var(--navy);border:1px solid var(--border);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;}
.cd-glance-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.cd-glance-sub{font-size:0.6rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;text-align:center;}
.cd-glance-pills{display:flex;gap:6px;}
.cd-g-pill{flex:1;background:var(--navy);border:1px solid var(--border);border-radius:10px;padding:6px 8px;text-align:center;}
.cd-g-pill.lit{background:rgba(46,204,113,0.08);border-color:rgba(46,204,113,0.25);}
.cd-g-lbl{font-size:0.5rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.cd-g-val{font-size:0.82rem;font-weight:800;color:var(--text);margin-top:1px;}
.cd-tabs{display:flex;gap:3px;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:3px;margin:0 16px 11px;}
.cd-tab{flex:1;padding:7px 3px;font-family:'DM Sans',sans-serif;font-size:0.7rem;font-weight:700;border:none;background:transparent;color:var(--muted);cursor:pointer;border-radius:8px;transition:all .15s;text-align:center;}
.cd-tab.a{background:var(--green-dim);color:var(--green);}
.cd-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:9px;}
.cd-player{background:var(--navy2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:9px;margin-bottom:5px;}
.cd-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#1F3347,#2ECC71);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:0.7rem;flex-shrink:0;}
.cd-timer{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:3px;}
.cd-timer-fill{height:100%;background:linear-gradient(90deg,#2ECC71,#27AE60);border-radius:2px;transition:width 1s linear;}
.cd-form{background:var(--card2);border:1px solid var(--border2);border-radius:14px;padding:14px;margin-bottom:10px;}
.rt-btn{padding:5px 10px;border-radius:8px;border:1.5px solid var(--border2);background:transparent;font-family:'DM Sans',sans-serif;font-size:0.72rem;font-weight:700;cursor:pointer;color:var(--muted);transition:all .15s;}
.rt-btn.s{border-color:rgba(46,204,113,0.4);background:var(--green-dim);color:var(--green);}
.dr-btn{padding:6px 10px;font-family:'DM Sans',sans-serif;font-size:0.7rem;font-weight:700;border:1.5px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;border-radius:8px;transition:all .15s;text-align:center;}
.dr-btn.a{border-color:rgba(46,204,113,0.4);background:var(--green-dim);color:var(--green);}
.wx-bar{display:flex;overflow-x:auto;scrollbar-width:none;background:var(--card);border:1px solid var(--border);border-radius:10px;}
.wx-bar::-webkit-scrollbar{display:none;}
.wx-h{display:flex;flex-direction:column;align-items:center;padding:5px 8px;min-width:52px;border-right:1px solid var(--border);flex-shrink:0;}
.wx-h:last-child{border-right:none;}
.wx-h.now{background:var(--green-dim);border-radius:7px;}
.ct-card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:12px 14px;margin-bottom:8px;}
.ct-tog{display:flex;border:1px solid var(--border2);border-radius:9px;overflow:hidden;}
.ct-tog button{flex:1;padding:8px 5px;font-family:'DM Sans',sans-serif;font-size:0.7rem;font-weight:700;border:none;cursor:pointer;transition:all .15s;color:var(--muted);background:transparent;}
.ct-tog button.on{background:var(--green);color:white;}
.ct-tog button.off{background:var(--card2);color:var(--text);}
.ct-tog button.warn{background:var(--red);color:white;}
.amen-dk{display:inline-flex;align-items:center;gap:3px;padding:5px 10px;border-radius:8px;border:1px solid var(--border2);background:transparent;font-family:'DM Sans',sans-serif;font-size:0.72rem;font-weight:600;cursor:pointer;color:var(--muted);transition:all .15s;margin:2px;}
.amen-dk.on{background:var(--green-dim);border-color:rgba(46,204,113,0.4);color:var(--green);}

/* Calendar view */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px;}
.cal-head{font-size:0.6rem;font-weight:700;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0;}
.cal-day{border-radius:8px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:all .15s;border:1.5px solid transparent;}
.cal-day.other-month{opacity:.3;}
.cal-day.today{border-color:rgba(46,204,113,0.6);}
.cal-day.selected{background:var(--green);border-color:var(--green);}
.cal-day.selected .cal-day-num{color:white!important;font-weight:800;}

/* ── ChatModal ── */
function ChatModal({player,myUid,myName,onClose}){
  const[msgs,setMsgs]=useState([]);const[inp,setInp]=useState('');const[sending,setSending]=useState(false);
  const endRef=useRef(null);const c=cid(myUid,player.uid);
  useEffect(()=>{if(!fbOk)return;const u=db.collection('chatMessages').where('convoId','==',c).orderBy('timestamp','asc').onSnapshot(s=>{setMsgs(s.docs.map(d=>({id:d.id,...d.data()})));setTimeout(()=>endRef.current?.scrollIntoView({behavior:'smooth'}),80);},e=>console.error(e));return()=>u();},[c]);
  useEffect(()=>{if(fbOk&&msgs.length)db.collection('conversations').doc(c).update({[`readBy_${myUid}`]:Date.now()}).catch(()=>{});},[msgs.length]);
  const send=async()=>{
    if(!inp.trim()||sending)return;setSending(true);const now=Date.now(),txt=inp.trim();
    try{
      const ref=db.collection('conversations').doc(c);
      const cd={participants:[myUid,player.uid].sort(),participantNames:{[myUid]:myName,[player.uid]:player.name},lastMessage:txt,lastMessageBy:myUid,lastTimestamp:now,[`readBy_${myUid}`]:now};
      try{await ref.set({...cd,createdAt:now});}catch{await ref.update({lastMessage:txt,lastMessageBy:myUid,lastTimestamp:now,[`readBy_${myUid}`]:now});}
      await db.collection('chatMessages').add({convoId:c,text:txt,senderUid:myUid,senderName:myName,timestamp:now});
      setInp('');
    }catch(e){alert('Send failed: '+e.message);}setSending(false);
  };
  return(
    <div className="modal-overlay" style={{alignItems:'stretch',paddingTop:40}}>
      <div style={{background:'var(--navy2)',borderRadius:'24px 24px 0 0',width:'100%',maxWidth:480,margin:'0 auto',display:'flex',flexDirection:'column',flex:1,animation:'slideUp .28s ease',overflow:'hidden'}}>
        <div style={{padding:'14px 16px 12px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
          <button onClick={onClose} className="icon-btn" style={{position:'static'}}>←</button>
          <div className="pc-avatar" style={{width:34,height:34,fontSize:'0.85rem'}}>{player.photoURL?<img src={player.photoURL} referrerPolicy="no-referrer"/>:player.name?.[0]||'?'}</div>
          <div style={{flex:1}}><div style={{fontWeight:700,fontSize:'0.9rem'}}>{player.name}</div><div style={{fontSize:'0.68rem',color:'var(--muted)'}}>{player.skill||'Player'}</div></div>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'12px 16px',display:'flex',flexDirection:'column',gap:2}}>
          {msgs.length===0&&<div style={{textAlign:'center',padding:'40px 20px',color:'var(--muted)'}}>💬 Say hi to {player.name}!</div>}
          {msgs.map(m=>(<div key={m.id} style={{display:'flex',flexDirection:'column',alignItems:m.senderUid===myUid?'flex-end':'flex-start'}}><div className={`chat-bubble ${m.senderUid===myUid?'bubble-me':'bubble-them'}`}>{m.text}<div className="bubble-time">{timeAgo(m.timestamp)}</div></div></div>))}
          <div ref={endRef}/>
        </div>
        <div style={{padding:'10px 14px',borderTop:'1px solid var(--border)',display:'flex',gap:8,alignItems:'flex-end',flexShrink:0,background:'var(--navy2)'}}>
          <textarea value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}} placeholder="Message…" rows={1} className="fi" style={{flex:1,resize:'none',maxHeight:80}}/>
          <button className="btn btn-primary btn-sm" onClick={send} disabled={sending||!inp.trim()} style={{opacity:(sending||!inp.trim())?.4:1,flexShrink:0}}>Send</button>
        </div>
      </div>
    </div>
  );
}

/* ── Inbox ── */
function Inbox({onClose,onOpen,myUid,allPlayers}){

  const info=cv=>{const ouid=cv.participants.find(p=>p!==myUid);const nm=cv.participantNames?.[ouid]||'Player';const rt=cv[`readBy_${myUid}`]||0;return{ouid,nm,ur:cv.lastMessageBy!==myUid&&cv.lastTimestamp>rt};};

/* ── AddCourtModal ── */
function AddCourtModal({onClose, onAdded}) {
    const [name, setName] = useState('');
    const [address, setAddress] = useState('');
    const [numCourts, setNumCourts] = useState(4);
    const [amenities, setAmenities] = useState([]);
    const [rules, setRules] = useState('');
    const [saving, setSaving] = useState(false);
    const [lat, setLat] = useState(null);
    const [lng, setLng] = useState(null);
    const [locating, setLocating] = useState(false);
    const toggleAmenity = (key) => setAmenities(a => a.includes(key) ? a.filter(x=>x!==key) : [...a, key]);
    const geolocate = () => {
        setLocating(true);
        navigator.geolocation.getCurrentPosition(pos => {
            setLat(pos.coords.latitude); setLng(pos.coords.longitude); setLocating(false);
        }, () => { alert('Could not get location.'); setLocating(false); });
    };
    const geocodeAddress = async (addr) => {
        try {
            const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(addr)+'&limit=1');
            const d = await r.json();
            if (d.length) return { lat: parseFloat(d[0].lat), lng: parseFloat(d[0].lon) };
        } catch(e) {}
        return null;
    };
    const save = async () => {
        if (!name.trim()) { alert('Please enter a court name.'); return; }
        if (!address.trim()) { alert('Please enter an address.'); return; }
        setSaving(true);
        let fLat = lat, fLng = lng;
        if (!fLat || !fLng) { const geo = await geocodeAddress(address); if (geo) { fLat=geo.lat; fLng=geo.lng; } else { fLat=0; fLng=0; } }
        const court = { name:name.trim(), address:address.trim(), lat:fLat, lng:fLng, numberOfCourts:numCourts, amenities, courtRules:rules.trim(), openCourts:numCourts, crowdLevel:'low', condition:'open', createdAt:Date.now() };
        try { if(fbOk&&db){ const ref=await db.collection('courts').add(court); court.id=ref.id; onAdded(court); } else alert('Database not available.');
        } catch(e) { alert('Failed: '+e.message); }
        setSaving(false);
    };
    return (
        <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
            <div className="modal-sheet">
                <div className="modal-handle"/>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
                    <div className="modal-title">➕ Add a Court</div>
                    <button onClick={onClose} className="icon-btn" style={{position:'static'}}>✕</button>
                </div>
                <div className="fg"><div className="fl">Court / Park Name *</div><input className="fi" value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Dardenne Prairie Athletic Complex"/></div>
                <div className="fg"><div className="fl">Address *</div>
                    <div style={{display:'flex',gap:8}}>
                        <input className="fi" value={address} onChange={e=>setAddress(e.target.value)} placeholder="Full street address, city, state" style={{flex:1}}/>
                        <button onClick={geolocate} className="icon-btn" style={{width:42,height:42,borderRadius:12}} title="Use my location">{locating?'⏳':'📍'}</button>
                    </div>
                    {lat && <div style={{fontSize:'0.7rem',color:'var(--green)',marginTop:4}}>📍 Location captured ({lat.toFixed(4)}, {lng.toFixed(4)})</div>}
                </div>
                <div className="fg"><div className="fl">Number of Courts</div>
                    <div style={{display:'flex',alignItems:'center',gap:10}}>
                        <button onClick={()=>setNumCourts(n=>Math.max(1,n-1))} className="icon-btn" style={{width:36,height:36,fontSize:'1rem'}}>−</button>
                        <span style={{fontSize:'1.3rem',fontWeight:800,fontFamily:'Syne',minWidth:28,textAlign:'center'}}>{numCourts}</span>
                        <button onClick={()=>setNumCourts(n=>Math.min(30,n+1))} style={{width:36,height:36,borderRadius:'50%',background:'var(--green)',border:'none',color:'white',fontSize:'1rem',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>+</button>
                    </div>
                </div>
                <div className="fg"><div className="fl">Amenities</div>
                    <div style={{display:'flex',flexWrap:'wrap',gap:3}}>
                        {AMENITIES.map(a=><button key={a.key} className={'amen-dk'+(amenities.includes(a.key)?' on':'')} onClick={()=>toggleAmenity(a.key)}>{a.label}</button>)}
                    </div>
                </div>
                <div className="fg"><div className="fl">Rules / Notes (optional)</div><textarea className="fi" value={rules} onChange={e=>setRules(e.target.value)} placeholder="e.g. Open daily 6am–10pm" rows={2}/></div>
                <button className="btn btn-primary" onClick={save} disabled={saving} style={{width:'100%',opacity:saving?.6:1}}>{saving?'⏳ Saving…':'➕ Add Court'}</button>
            </div>
        </div>
    );
}

const COURT_RATINGS=[{key:'under3',label:'<3.0'},{key:'3to35',label:'3.0–3.5'},{key:'35to4',label:'3.5–4.0'},{key:'over4',label:'4.0+'},{key:'5plus',label:'5.0+'}];
const COURT_DURATIONS=[{label:'1 hr',value:60},{label:'2 hr',value:120},{label:'3 hr',value:180},{label:'4 hr',value:240},{label:'All Day',value:480}];
const courtRatingInfo=key=>COURT_RATINGS.find(r=>r.key===key);
function courtHeadcount(players){return players.reduce((s,p)=>s+1+(p.guests||0),0);}
const wxIcon=(temp,wind)=>wind>20?'🌬️':temp<32?'🥶':temp<50?'🧥':temp>88?'☀️':'⛅';

function CourtPlayTimer({checkInTime,durationMins}){
    const[remaining,setRemaining]=useState(0);
    useEffect(()=>{const calc=()=>setRemaining(Math.max(0,checkInTime+durationMins*60000-Date.now()));calc();const t=setInterval(calc,10000);return()=>clearInterval(t);},[checkInTime,durationMins]);
    if(remaining<=0)return<span style={{fontSize:'0.62rem',color:'var(--red)',fontWeight:700}}>⏰ Time's up!</span>;
    const mins=Math.ceil(remaining/60000),hrs=Math.floor(mins/60),m=mins%60;
    const pct=Math.max(0,(remaining/(durationMins*60000))*100);
    return(<div style={{minWidth:70}}><span style={{fontSize:'0.62rem',color:'var(--green)',fontWeight:700}}>⏱ {hrs>0?hrs+'h ':''}{m}m left</span><div className="cd-timer"><div className="cd-timer-fill" style={{width:pct+'%'}}/></div></div>);
}

function CourtPlayerRow({p,isNow}){
    const ri=courtRatingInfo(p.rating);const nowMs=Date.now();
    const eff=isNow||p.status==='now'||(p.status==='later'&&p.arrivalTime&&nowMs>=p.arrivalTime);
    const arrLabel=p.status==='later'&&p.arrivalTime&&!eff?new Date(p.arrivalTime).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):null;
    const guests=p.guests||0;
    return(
        <div className="cd-player">
            <div className="cd-av">{(p.userName||'?')[0].toUpperCase()}</div>
            <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:700,fontSize:'0.78rem',display:'flex',alignItems:'center',gap:5,flexWrap:'wrap'}}>
                    {p.userName}{guests>0&&<span className="tag t-blue" style={{fontSize:'0.55rem'}}>+{guests}</span>}
                    {ri&&<span className="tag t-green" style={{fontSize:'0.55rem'}}>{ri.label}</span>}
                </div>
                <div style={{fontSize:'0.65rem',color:'var(--muted)',display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                    <span>{eff?'🎾 Playing':arrLabel?'⏰ '+arrLabel:'👀 Watching'}</span>
                    {eff&&p.duration&&<CourtPlayTimer checkInTime={p.timestamp} durationMins={p.duration}/>}
                </div>
                {p.comment&&<div style={{fontSize:'0.65rem',color:'var(--green)',fontStyle:'italic',marginTop:2,background:'var(--green-dim)',borderRadius:6,padding:'2px 6px',display:'inline-block'}}>💬 {p.comment}</div>}
            </div>
            <div style={{fontSize:'0.6rem',color:'var(--muted2)',flexShrink:0}}>{new Date(p.timestamp).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</div>
        </div>
    );
}

/* ── FlashAnnouncement ── */
function FlashAnnouncement({courtId,courtData,updateCourt}){
    const[text,setText]=useState(courtData.flashAnnouncement||'');
    const[saving,setSaving]=useState(false);
    const save=async()=>{setSaving(true);await updateCourt('flashAnnouncement',text.trim());setSaving(false);};
    const clear=async()=>{setText('');await updateCourt('flashAnnouncement','');};
    return(
        <div className="ct-card">
            <div style={{fontSize:'0.7rem',fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:8}}>📢 Flash Announcement</div>
            {courtData.flashAnnouncement&&<div style={{background:'rgba(247,201,72,0.12)',border:'1px solid rgba(247,201,72,0.3)',borderRadius:8,padding:'7px 10px',marginBottom:8,fontSize:'0.75rem',color:'var(--accent)',fontWeight:600}}>📢 {courtData.flashAnnouncement}</div>}
            <textarea className="fi" value={text} onChange={e=>setText(e.target.value)} placeholder="e.g. Court 3 closed for maintenance…" rows={2} style={{marginBottom:8}}/>
            <div style={{display:'flex',gap:6}}>
                <button className="btn btn-primary btn-sm" onClick={save} disabled={saving} style={{flex:1,opacity:saving?.6:1}}>{saving?'Saving…':'📢 Post'}</button>
                {courtData.flashAnnouncement&&<button className="btn btn-danger btn-sm" onClick={clear}>✕ Clear</button>}
            </div>
        </div>
    );
}

/* ── CourtDetailPage ── */
function buildTimeOpts(){const o=[];const n=new Date();const s=new Date(n);s.setMinutes(0,0,0);s.setHours(s.getHours()+1);const e=new Date(n);e.setHours(23,0,0,0);const c=new Date(s);while(c<=e){o.push({label:c.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),value:c.getTime()});c.setHours(c.getHours()+1);}return o;}

function EditCourtModal({court,onClose,onSaved}){
  const[name,setName]=useState(court.name||'');const[address,setAddress]=useState(court.address||'');
  const[numCourts,setNumCourts]=useState(court.numberOfCourts||4);
  const[amenities,setAmenities]=useState(court.amenities||[]);
  const[rules,setRules]=useState(court.courtRules||'');const[saving,setSaving]=useState(false);
  const toggleAm=k=>setAmenities(a=>a.includes(k)?a.filter(x=>x!==k):[...a,k]);
  const save=async()=>{if(!name.trim()){alert('Court name required.');return;}setSaving(true);
    try{await db.collection('courts').doc(court.id).update({name:name.trim(),address:address.trim(),numberOfCourts:numCourts,amenities,courtRules:rules.trim()});onSaved({...court,name:name.trim(),address:address.trim(),numberOfCourts:numCourts,amenities,courtRules:rules.trim()});}
    catch(e){alert('Save failed: '+e.message);}setSaving(false);};
  return(<div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal-sheet"><div className="modal-handle"/>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <div className="modal-title">✏️ Edit Court</div>
        <button onClick={onClose} className="icon-btn" style={{position:'static'}}>✕</button>
      </div>
      <div className="fg"><div className="fl">Court Name *</div><input className="fi" value={name} onChange={e=>setName(e.target.value)}/></div>
      <div className="fg"><div className="fl">Address</div><input className="fi" value={address} onChange={e=>setAddress(e.target.value)} placeholder="Full address"/></div>
      <div className="fg"><div className="fl">Number of Courts</div>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <button onClick={()=>setNumCourts(n=>Math.max(1,n-1))} className="icon-btn" style={{width:34,height:34,fontSize:'0.95rem'}}>−</button>
          <span style={{fontSize:'1.1rem',fontWeight:800,fontFamily:'Syne',minWidth:28,textAlign:'center'}}>{numCourts}</span>
          <button onClick={()=>setNumCourts(n=>Math.min(30,n+1))} style={{width:34,height:34,borderRadius:'50%',background:'var(--green)',border:'none',color:'white',fontSize:'0.95rem',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>+</button>
        </div>
      </div>
      <div className="fg"><div className="fl">Amenities</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:3}}>{AMENITIES.map(a=><button key={a.key} className={'amen-dk'+(amenities.includes(a.key)?' on':'')} onClick={()=>toggleAm(a.key)}>{a.label}</button>)}</div>
      </div>
      <div className="fg"><div className="fl">Rules / Notes</div><textarea className="fi" value={rules} onChange={e=>setRules(e.target.value)} placeholder="e.g. Open daily 6am–10pm" rows={2}/></div>
      <button className="btn btn-primary" onClick={save} disabled={saving} style={{width:'100%',opacity:saving?.6:1}}>{saving?'Saving…':'💾 Save Changes'}</button>
    </div>
  </div>);
}

function CourtDetailPage({courtId,onBack}){
    const[courtData,setCourtData]=useState(null);const[checkIns,setCheckIns]=useState([]);
    const[loading,setLoading]=useState(true);const[tab,setTab]=useState('now');
    const[showForm,setShowForm]=useState(false);const[showLater,setShowLater]=useState(false);
    const[arrivalTime,setArrivalTime]=useState('');
    const[userName,setUserName]=useState('');
    const[userRating,setUserRating]=useState('');const[duration,setDuration]=useState(120);
    const[guestCount,setGuestCount]=useState(0);const[comment,setComment]=useState('');
    const[weather,setWeather]=useState(null);const[forecast,setForecast]=useState([]);
    const[showEdit,setShowEdit]=useState(false);
    const checkInsRef=useRef([]);
    // Per-session ID — NOT persisted to localStorage — so two people on the same device
    // each get their own unique check-in slot and don't collide with each other.
    const[deviceId]=useState(()=>'dev_'+Math.random().toString(36).slice(2,14)+'_'+Date.now().toString(36));
    useEffect(()=>{const n=localStorage.getItem('pickleCourtUserName');const r=localStorage.getItem('pickleCourtRating');if(n)setUserName(n);if(r)setUserRating(r);},[]);
    useEffect(()=>{if(!courtId||!fbOk){setLoading(false);return;}const u=db.collection('courts').doc(courtId).onSnapshot(d=>{if(d.exists)setCourtData({id:d.id,...d.data()});else setCourtData(null);setLoading(false);},()=>setLoading(false));return()=>u();},[courtId]);
    useEffect(()=>{if(!courtId||!fbOk)return;const u=db.collection('courts').doc(courtId).collection('checkins').onSnapshot(snap=>{const now=Date.now(),cut=now-24*3600000;snap.docs.forEach(d=>{if(d.data().status==='checked-out')d.ref.delete().catch(()=>{});});const list=snap.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.status!=='checked-out'&&c.timestamp>cut).sort((a,b)=>(a.arrivalTime||a.timestamp)-(b.arrivalTime||b.timestamp));checkInsRef.current=list;setCheckIns(list);},e=>console.warn('CI:',e.message));return()=>u();},[courtId]);
    useEffect(()=>{if(!courtId||!fbOk)return;const tick=async()=>{const now=Date.now(),list=checkInsRef.current;for(const c of list){const st=c.status==='active'?c.timestamp:c.arrivalTime;if(c.status==='active'&&c.duration&&st&&now>st+c.duration*60000){await db.collection('courts').doc(courtId).collection('checkins').doc(c.id).delete().catch(()=>{});}if(c.status==='later'&&c.arrivalTime&&now>=c.arrivalTime){await db.collection('courts').doc(courtId).collection('checkins').doc(c.id).update({status:'active',timestamp:now}).catch(()=>{});}}};tick();const t=setInterval(tick,15000);return()=>clearInterval(t);},[courtId]);
    useEffect(()=>{if(!courtData?.lat||!courtData?.lng)return;const fx=async(la,ln)=>{try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+la+'&longitude='+ln+'&current=temperature_2m,wind_speed_10m&hourly=temperature_2m,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&forecast_days=1');const d=await r.json();setWeather({temp:Math.round(d.current.temperature_2m),wind:Math.round(d.current.wind_speed_10m)});const now=new Date();setForecast(d.hourly.time.map((t,i)=>({dt:new Date(t),temp:Math.round(d.hourly.temperature_2m[i]),wind:Math.round(d.hourly.wind_speed_10m[i])})).filter(h=>h.dt>=now&&h.dt.getDate()===now.getDate()).slice(0,10));}catch(e){}};fx(courtData.lat,courtData.lng);},[courtData?.lat,courtData?.lng]);
    const updateCourt=async(field,value)=>{if(!fbOk||!courtId)return;await db.collection('courts').doc(courtId).update({[field]:value}).catch(console.error);};
    const deleteMyCheckIns=async()=>{const snap=await db.collection('courts').doc(courtId).collection('checkins').get();await Promise.all(snap.docs.filter(d=>d.data().deviceId===deviceId).map(d=>d.ref.delete()));};
    const submitCheckIn=async(status,atTime)=>{if(!fbOk||!userName.trim()){alert(!userName.trim()?'Enter your name':'DB error');return;}try{await deleteMyCheckIns();const ciStatus=status==='now'?'active':'later';await db.collection('courts').doc(courtId).collection('checkins').add({userName,deviceId,rating:userRating||null,status:ciStatus,guests:guestCount,duration,comment:comment.trim()||'',arrivalTime:atTime||Date.now(),timestamp:Date.now()});localStorage.setItem('pickleCourtUserName',userName);localStorage.setItem('pickleCourtRating',userRating);setShowForm(false);setShowLater(false);setArrivalTime('');setGuestCount(0);setComment('');}catch(e){alert('Check-in failed: '+e.message);}};
    const handleCheckOut=async()=>{await deleteMyCheckIns();};

    if(loading)return<div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:200}}><div style={{textAlign:'center'}}><div style={{fontSize:'2rem',marginBottom:8}}>🏟</div><div style={{fontSize:'0.82rem',color:'var(--muted)'}}>Loading court…</div></div></div>;
    if(!courtData)return<div className="px fade-in" style={{paddingTop:40,textAlign:'center'}}><div style={{fontSize:'2.5rem',marginBottom:10}}>🏟</div><div className="modal-title" style={{marginBottom:8}}>Court not found</div><button className="btn btn-ghost" onClick={onBack}>← Back</button></div>;

    const nowMs=Date.now();const myCheckIn=checkIns.find(c=>c.deviceId===deviceId);
    const nowPlayers=checkIns.filter(c=>c.status==='active'||(c.status==='later'&&c.arrivalTime&&nowMs>=c.arrivalTime));
    const laterPlayers=checkIns.filter(c=>c.status==='later'&&(!c.arrivalTime||nowMs<c.arrivalTime));
    const nowTotal=courtHeadcount(nowPlayers),laterTotal=courtHeadcount(laterPlayers);
    const total=courtData.numberOfCourts||4;const open=courtData.openCourts!==undefined?courtData.openCourts:total;
    const openOpts=Array.from({length:total+1},(_,i)=>i);
    const crowdColor=courtData.crowdLevel==='low'?'g':courtData.crowdLevel==='medium'?'y':'r';
    const condMap={closed:{e:'🚫',l:'Closed',c:'r'},wet:{e:'💧',l:'Wet',c:'y'},hot:{e:'🥵',l:'Hot',c:'y'},windy:{e:'🌬️',l:'Windy',c:'y'}};
    const timeOpts=buildTimeOpts();

    return(<div className="fade-in" style={{paddingTop:8}}>

            <div className="cd-name-row">

                    <div style={{fontSize:'0.95rem',fontWeight:700,lineHeight:1.25,marginBottom:4}}>{courtData.name}</div>
                    <div style={{fontSize:'0.68rem',color:'var(--muted)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>📍 {courtData.address||'No address'}</div>
                </div>
                <div className="cd-badges">
                    <span className="cd-live"><span className="cd-live-dot"/>LIVE</span>
                    <span className={'cd-crowd-badge '+(courtData.crowdLevel||'low')}>{courtData.crowdLevel==='high'?'Packed':courtData.crowdLevel==='medium'?'Busy':'Open'}</span>
                </div>
            </div>
            {courtData.flashAnnouncement&&<div style={{marginTop:8,background:'rgba(247,201,72,0.12)',border:'1px solid rgba(247,201,72,0.3)',borderRadius:8,padding:'6px 10px',fontSize:'0.72rem',color:'var(--accent)',fontWeight:600}}>📢 {courtData.flashAnnouncement}</div>}

            {/* Weather row */}
            {weather&&<div style={{marginTop:12}}>
                <div style={{display:'grid',gridTemplateColumns:'auto 1fr',gap:8,alignItems:'start'}}>
                    {/* Current — compact */}
                    <div className="cd-wx-card" style={{padding:'7px 10px',gap:7,minWidth:0}}>
                        <div style={{fontSize:'1.2rem',lineHeight:1}}>{wxIcon(weather.temp,weather.wind)}</div>
                        <div>
                            <div style={{fontSize:'0.55rem',color:'var(--muted)',fontWeight:600}}>Now</div>
                            <div style={{fontSize:'0.88rem',fontWeight:800,whiteSpace:'nowrap'}}>{weather.temp}°F</div>
                            <div style={{fontSize:'0.55rem',color:'var(--muted)',whiteSpace:'nowrap'}}>💨 {weather.wind}mph</div>
                        </div>
                    </div>
                    {/* Next 4 hrs */}
                    <div style={{display:'flex',gap:5,overflow:'hidden'}}>
                        {forecast.slice(0,4).map((h,i)=>(
                            <div key={i} style={{flex:1,background:'var(--navy)',border:'1px solid var(--border)',borderRadius:10,padding:'5px 4px',textAlign:'center',minWidth:0}}>
                                <div style={{fontSize:'0.52rem',color:'var(--muted)',fontWeight:600,whiteSpace:'nowrap'}}>{h.dt.toLocaleTimeString([],{hour:'numeric'})}</div>
                                <div style={{fontSize:'0.75rem',fontWeight:800,marginTop:2}}>{h.temp}°</div>
                                <div style={{fontSize:'0.52rem',color:'var(--muted)',marginTop:1}}>💨{h.wind}</div>
                            </div>
                        ))}
                    </div>
                </div>
            </div>}
        </div>

        {/* ── CARD 2: At a Glance ── */}
        <div className="cd-section">
            <div style={{fontSize:'0.78rem',fontWeight:700,marginBottom:10}}>📊 At a Glance</div>
            <div className="cd-glance-grid">
                <div>
                    <div className="cd-glance-sub">Activity</div>

                            <div className="cd-g-val">{courtData.lightsOn?'ON':'OFF'}</div>

            <button className={'cd-tab'+(tab==='schedule'?' a':'')} onClick={()=>setTab('schedule')}>📅 Schedule</button>
            <button className={'cd-tab'+(tab==='controls'?' a':'')} onClick={()=>setTab('controls')}>⚙️ Controls</button>
            <button className={'cd-tab'+(tab==='info'?' a':'')} onClick={()=>setTab('info')}>ℹ️ Info</button>
        </div>

        {/* ── TAB CONTENT ── */}
        <div style={{padding:'0 16px'}}>
            {/* NOW TAB */}

                <div style={{fontSize:'0.78rem',fontWeight:700,marginBottom:10}}>👥 Who's Here?</div>

                    <div style={{background:'var(--green-dim)',border:'1px solid rgba(46,204,113,0.3)',borderRadius:12,padding:'10px 14px',marginBottom:10}}>

                                    {(myCheckIn.status==='active'||(myCheckIn.status==='later'&&myCheckIn.arrivalTime&&nowMs>=myCheckIn.arrivalTime))?'🎾 Playing now':'⏰ Arriving '+new Date(myCheckIn.arrivalTime).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}

                        <div className="fg"><div className="fl">How Long?</div><div style={{display:'flex',gap:5,flexWrap:'wrap'}}>{COURT_DURATIONS.map(d=><button key={d.value} className={'dr-btn'+(duration===d.value?' a':'')} onClick={()=>setDuration(d.value)}>{d.label}</button>)}</div></div>

                            </div>

                                    </select>

                                <div style={{display:'flex',gap:7}}>
                                    <button className="btn btn-primary" onClick={()=>{if(!arrivalTime){alert('Select a time');return;}submitCheckIn('later',parseInt(arrivalTime));}} disabled={!userName.trim()||!arrivalTime} style={{flex:1,opacity:(userName.trim()&&arrivalTime)?1:.5}}>✓ Confirm</button>
                                    <button onClick={()=>setShowLater(false)} style={{background:'none',border:'none',color:'var(--muted)',cursor:'pointer',fontSize:'0.78rem',padding:'0 8px'}}>Back</button>
                                </div>
                            </div>
                        )}
                    </div>
                ))}
                {nowPlayers.length>0?nowPlayers.map(p=><CourtPlayerRow key={p.id} p={p} isNow={true}/>):<div style={{textAlign:'center',padding:'16px 0',color:'var(--muted)',fontSize:'0.8rem'}}>No one here yet — be the first! 🎾</div>}
            </div>}

            {/* SCHEDULE TAB */}
            {tab==='schedule'&&<div className="cd-card">
                <div style={{fontSize:'0.78rem',fontWeight:700,marginBottom:10}}>📅 Coming Soon ({laterTotal})</div>
                {laterPlayers.length===0?<div style={{textAlign:'center',padding:'16px 0',color:'var(--muted)',fontSize:'0.8rem'}}>Nobody scheduled yet.</div>:laterPlayers.map(p=><CourtPlayerRow key={p.id} p={p} isNow={false}/>)}
            </div>}

            {/* CONTROLS TAB */}
            {tab==='controls'&&<div>
                <div className="ct-card"><div style={{fontSize:'0.7rem',fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:8}}>🟢 Crowd Level</div><div className="ct-tog">{[['low','Light'],['medium','Busy'],['high','Packed']].map(([v,l])=><button key={v} onClick={()=>updateCourt('crowdLevel',v)} className={courtData.crowdLevel===v?'on':''}>{l}</button>)}</div></div>
                <div className="ct-card"><div style={{fontSize:'0.7rem',fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:8}}>📋 Condition</div><div className="ct-tog">{[['open','✅ Open'],['closed','🚫 Closed'],['wet','💧 Wet']].map(([v,l])=><button key={v} onClick={()=>updateCourt('condition',v)} className={(courtData.condition||'open')===v?(v==='closed'?'warn':'on'):''}>{l}</button>)}</div></div>
                <div className="ct-card"><div style={{fontSize:'0.7rem',fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:8}}>💡 Lights</div><div className="ct-tog"><button onClick={()=>updateCourt('lightsOn',true)} className={courtData.lightsOn?'on':''}>💡 ON</button><button onClick={()=>updateCourt('lightsOn',false)} className={!courtData.lightsOn?'off':''}>🌙 OFF</button></div></div>
                <div className="ct-card"><div style={{fontSize:'0.7rem',fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:8}}>🏟 Courts in Rotation</div><div style={{display:'flex',gap:5,flexWrap:'wrap'}}>{openOpts.map(n=><button key={n} onClick={()=>updateCourt('openCourts',n)} className={'dr-btn'+(open===n?' a':'')} style={{minWidth:38}}>{n}</button>)}</div></div>
                <div className="ct-card"><div style={{fontSize:'0.7rem',fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:8}}>🚻 Restrooms</div><div className="ct-tog"><button onClick={()=>updateCourt('restroom','open')} className={(courtData.restroom||'open')==='open'?'on':''}>✅ Open</button><button onClick={()=>updateCourt('restroom','closed')} className={courtData.restroom==='closed'?'warn':''}>🚫 Closed</button></div></div>
                <div className="ct-card"><div style={{fontSize:'0.7rem',fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:8}}>🅿️ Parking</div><div className="ct-tog"><button onClick={()=>updateCourt('parking','available')} className={(courtData.parking||'available')==='available'?'on':''}>✅ Available</button><button onClick={()=>updateCourt('parking','full')} className={courtData.parking==='full'?'warn':''}>🚗 Full</button></div></div>
                <FlashAnnouncement courtId={courtId} courtData={courtData} updateCourt={updateCourt}/>
            </div>}

            {/* INFO TAB */}
            {tab==='info'&&<div className="cd-card">
                <div style={{fontSize:'0.68rem',fontWeight:700,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--muted)',marginBottom:14}}>ℹ️ Court Info</div>
                <div style={{marginBottom:14}}>
                    <div className="fl">Location</div>
                    <div style={{fontSize:'0.82rem',fontWeight:600}}>{courtData.name}</div>
                    <div style={{fontSize:'0.72rem',color:'var(--muted)',marginTop:2}}>{courtData.address}</div>
                    {courtData.address&&<a href={'https://maps.google.com/?q='+encodeURIComponent(courtData.address)} target="_blank" rel="noopener noreferrer" style={{display:'inline-block',marginTop:5,color:'var(--green)',fontSize:'0.7rem',fontWeight:600,textDecoration:'none'}}>🗺️ Open in Google Maps →</a>}
                </div>
                <div style={{marginBottom:14}}>
                    <div className="fl">Courts</div>
                    <div style={{fontSize:'0.88rem',fontWeight:700}}>{total} courts</div>
                </div>
                {courtData.amenities?.length>0&&<div style={{marginBottom:14}}>
                    <div className="fl">Amenities</div>
                    <div style={{display:'flex',flexWrap:'wrap',gap:4}}>{courtData.amenities.map(k=>{const a=AMENITIES.find(x=>x.key===k);return a?<span key={k} className="tag t-green">{a.label}</span>:null;})}</div>
                </div>}
                {courtData.courtRules&&<div style={{marginBottom:14}}>
                    <div className="fl">Rules & Notes</div>
                    <div style={{background:'var(--navy)',border:'1px solid var(--border)',borderRadius:10,padding:10,fontSize:'0.75rem',lineHeight:1.5,whiteSpace:'pre-wrap'}}>{courtData.courtRules}</div>
                </div>}
                <button className="btn btn-ghost" onClick={()=>setShowEdit(true)} style={{width:'100%'}}>✏️ Edit Court Info</button>
            </div>}
        </div>
        {showEdit&&<EditCourtModal court={courtData} onClose={()=>setShowEdit(false)} onSaved={c=>{setCourtData(c);setShowEdit(false);}}/>}
    </div>);
}



/* ── InviteStep ── */
function InviteStep({game,profile,uLat,uLng,onInvitesSent,onSkip}){
  const[players,setPlayers]=useState([]);const[loading,setLoading]=useState(true);
  const[selected,setSelected]=useState([]);const[sending,setSending]=useState(false);
  const[search,setSearch]=useState('');
  useEffect(()=>{
    if(!fbOk)return;
    db.collection('profiles').get().then(snap=>{
      let arr=snap.docs.map(d=>({uid:d.id,...d.data()})).filter(p=>p.uid!==profile.uid&&p.name);
      arr=arr.map(p=>{
        let score=0;
        if(skillInRange(p.skill,game.skillMin,game.skillMax))score+=30;
        if(uLat&&p.lat){const dist=haversine(uLat,uLng,p.lat,p.lng);if(dist<=(parseInt(game.radiusMi)||25))score+=20;p._dist=dist;}
        p._score=score;return p;
      });
      arr.sort((a,b)=>b._score-a._score);
      setPlayers(arr);setLoading(false);
    }).catch(()=>setLoading(false));
  },[]);
  const filtered=useMemo(()=>{if(!search.trim())return players;const q=search.toLowerCase();return players.filter(p=>[p.name,p.city,p.skill].some(v=>(v||'').toLowerCase().includes(q)));},[players,search]);
  const toggle=p=>{const ex=game.players?.find(i=>i.uid===p.uid);if(ex&&ex.status==='accepted')return;setSelected(s=>s.includes(p.uid)?s.filter(x=>x!==p.uid):[...s,p.uid]);};
  const sendInvites=async()=>{
    if(selected.length===0){onSkip();return;}
    setSending(true);
    try{
      const batch=db.batch();let newRoster=[...(game.players||[])];
      selected.forEach(uid=>{
        const pl=players.find(p=>p.uid===uid);if(!pl)return;
        const idx=newRoster.findIndex(i=>i.uid===uid);
        if(idx>=0)newRoster[idx]={...newRoster[idx],status:'invited',invitedAt:Date.now()};
        else newRoster.push({uid,name:pl.name,skill:pl.skill,photoURL:pl.photoURL||null,status:'invited',invitedAt:Date.now()});
        const nRef=db.collection('notifications').doc();
        batch.set(nRef,{toUid:uid,fromUid:profile.uid,fromName:profile.name,type:'invite',
          text:`${profile.name} invited you to a game on ${fmtFullDate(game.date)} at ${fmtTime(game.time)}`,
          ref:game.id,read:false,timestamp:Date.now()});
      });
      await db.collection('games').doc(game.id).update({players:newRoster,updatedAt:Date.now()});
      await batch.commit();
      onInvitesSent();
    }catch(e){alert('Error: '+e.message);}
    setSending(false);
  };
  return(
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onSkip();}}>
      <div className="modal-sheet">
        <div className="modal-handle"/>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
          <div className="modal-title">🎯 Invite Players</div>
          <button onClick={onSkip} className="icon-btn" style={{position:'static'}}>✕</button>
        </div>
        <div style={{fontSize:'0.72rem',color:'var(--muted)',marginBottom:12}}>Select players to invite. Top matches based on skill and location.</div>
        <div style={{position:'relative',marginBottom:10}}>
          <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',pointerEvents:'none'}}>🔍</span>
          <input className="fi" style={{paddingLeft:34,fontSize:'0.85rem'}} value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search players…"/>
        </div>
        {selected.length>0&&<div style={{background:'var(--green-dim)',border:'1px solid rgba(46,204,113,.25)',borderRadius:10,padding:'7px 12px',marginBottom:10,fontSize:'0.78rem',fontWeight:600,color:'var(--green)'}}>{selected.length} player{selected.length>1?'s':''} selected</div>}
        <div style={{maxHeight:300,overflowY:'auto',marginBottom:12}}>
          {loading?<div style={{textAlign:'center',padding:24,color:'var(--muted)',fontSize:'0.82rem'}}>Finding players…</div>
          :filtered.length===0?<div style={{textAlign:'center',padding:24,color:'var(--muted)',fontSize:'0.82rem'}}>No players found</div>
          :filtered.map(p=>{
            const isSel=selected.includes(p.uid);
            const ex=game.players?.find(i=>i.uid===p.uid);
            const isAccepted=ex&&ex.status==='accepted';
            const isInvited=ex&&ex.status==='invited';
            const isDeclined=ex&&ex.status==='declined';
            return(<div key={p.uid} className={`inv-card${isSel?' inv-sel':''}${isAccepted?' inv-joined':''}`} onClick={()=>toggle(p)}>
              <div className="inv-av">{p.photoURL?<img src={p.photoURL} referrerPolicy="no-referrer"/>:(p.name||'?')[0].toUpperCase()}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:'0.82rem',fontWeight:700}}>{p.name}</div>
                <div style={{fontSize:'0.68rem',color:'var(--muted)'}}>{p.skill||''}{p.city?' · '+p.city:''}{p._dist!==undefined?` · ${p._dist<1?p._dist.toFixed(1):Math.round(p._dist)} mi`:''}</div>
              </div>
              {isAccepted&&<span style={{fontSize:'0.6rem',fontWeight:700,background:'var(--green-dim)',color:'var(--green)',padding:'2px 6px',borderRadius:6}}>Joined</span>}
              {isInvited&&!isSel&&<span style={{fontSize:'0.6rem',fontWeight:700,background:'rgba(59,130,246,.15)',color:'#1d4ed8',padding:'2px 6px',borderRadius:6}}>Pending</span>}
              {isDeclined&&!isSel&&<span style={{fontSize:'0.6rem',fontWeight:700,background:'rgba(247,91,91,.15)',color:'var(--red)',padding:'2px 6px',borderRadius:6}}>Declined</span>}
              {p._score>=50&&!ex&&<span style={{fontSize:'0.6rem',fontWeight:700,background:'var(--green-dim)',color:'var(--green)',padding:'2px 6px',borderRadius:6}}>⭐ Match</span>}
              {isSel&&<span style={{color:'var(--green)',fontSize:'1rem',fontWeight:700}}>✓</span>}
            </div>);
          })}
        </div>
        <div style={{display:'flex',gap:8}}>
          <button onClick={onSkip} className="btn btn-ghost" style={{flex:1}}>Done</button>
          <button onClick={sendInvites} disabled={sending||selected.length===0} className="btn btn-primary" style={{flex:2,opacity:(sending||selected.length===0)?.5:1}}>{sending?'Sending…':`Send ${selected.length} Invite${selected.length!==1?'s':''}`}</button>
        </div>
      </div>
    </div>
  );
}

/* ── GameCard ── */
function GameCard({game,user,profile,onAction,expanded,onToggle}){
  const{dayStr,numStr,rel}=getDateParts(game.date);
  const expired=isGameExpired(game);
  const used=slotsUsed(game.players);
  const isFull=used>=game.totalSlots;
  const isOrg=game.organizerUid===user?.uid;
  const myInvite=game.players?.find(i=>i.uid===user?.uid);
  const amIn=myInvite&&myInvite.status==='accepted';
  const amInvited=myInvite&&myInvite.status==='invited';
  const amDeclined=myInvite&&myInvite.status==='declined';
  const openSlots=Math.max(0,(game.totalSlots||4)-used);
  return(
    <div className={`game-card${isFull?' gc-full':' gc-open'}${game.isPrivate?' gc-private':''}${isOrg?' gc-mine':''}${amInvited?' gc-invited':''}`} style={expired?{opacity:.5}:{}}>
      <div style={{padding:'12px 14px 10px',display:'flex',alignItems:'flex-start',gap:11,cursor:'pointer'}} onClick={onToggle}>
        <div className={`gc-date-block gc-${rel}`}>
          <div className="gc-day-lbl">{dayStr}</div>
          <div className="gc-day-num">{numStr}</div>
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:700,fontSize:'0.9rem',marginBottom:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{game.title||`${game.playType||'Casual'} Game`}</div>
          <div style={{fontSize:'0.72rem',color:'var(--muted)',marginBottom:5,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>📍 {game.court} · ⏰ {fmtTimeRange(game.time,game.timeEnd)}</div>
          <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
            <span className={`bp ${isFull?'bp-full':'bp-open'}`}>{isFull?'Full':`${openSlots} spot${openSlots!==1?'s':''} left`}</span>
            {game.isPrivate&&<span className="bp bp-priv">🔒 Private</span>}
            {!game.isPrivate&&<span className="bp bp-pub">🌍 Public</span>}
            {isOrg&&<span className="bp bp-mine">👑 You organize</span>}
            {amIn&&!isOrg&&<span className="bp bp-mine">✓ Joined</span>}
            {amInvited&&<span className="bp bp-inv">📩 Invited</span>}
            {game.skillMin&&game.skillMin!=='Any'&&<span className="bp" style={{background:'var(--card2)',color:'var(--muted)'}}>{game.skillMin}{game.skillMax&&game.skillMax!==game.skillMin&&game.skillMax!=='Any'?`–${game.skillMax}`:''}</span>}
          </div>
        </div>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" strokeWidth="2.5" style={{flexShrink:0,marginTop:5,transition:'transform .2s',transform:expanded?'rotate(180deg)':'none'}}><path d="M6 9l6 6 6-6"/></svg>
      </div>

      {/* Inline invite banner (collapsed) */}
      {amInvited&&!expanded&&<div style={{padding:'0 14px 10px'}}>
        <div className="inv-banner">
          <div style={{flex:1,fontSize:'0.82rem',fontWeight:600,color:'#93c5fd'}}>🎾 {game.organizerName} invited you to play!</div>
          <button className="btn btn-primary btn-sm" onClick={()=>onAction('accept',game)} style={{padding:'5px 12px',fontSize:'0.72rem'}}>✓ Accept</button>
          <button className="btn btn-ghost btn-sm" onClick={()=>onAction('decline',game)} style={{padding:'5px 10px',fontSize:'0.72rem',color:'var(--red)',borderColor:'rgba(247,91,91,.3)'}}>✕</button>
        </div>
      </div>}

      {expanded&&<div style={{borderTop:'1px solid var(--border)',padding:'10px 14px 12px'}}>
        {/* Roster */}
        <div style={{fontSize:'0.62rem',fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:8}}>Players ({used}/{game.totalSlots||4})</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,marginBottom:10}}>
          {Array.from({length:game.totalSlots||4}).map((_,i)=>{
            const inv=(game.players||[])[i];
            if(inv){
              const cls=inv.uid===user?.uid?'g-mine':inv.status==='declined'?'g-declined':inv.status==='invited'?'g-invited':'filled';
              return(<div key={i} className={`g-slot ${cls}`}>
                <div className="slot-av">{inv.photoURL?<img src={inv.photoURL} referrerPolicy="no-referrer"/>:(inv.name||'?')[0].toUpperCase()}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:'0.72rem',fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{inv.name}{inv.isOrganizer?<span style={{marginLeft:3,fontSize:'0.55rem',color:'var(--accent)'}}>👑</span>:''}</div>
                  <div style={{fontSize:'0.6rem',color:'var(--muted)'}}>{inv.skill||''}</div>
                </div>
                <span style={{fontSize:'0.58rem',fontWeight:700,flexShrink:0,color:inv.status==='accepted'?'var(--green)':inv.status==='invited'?'#3b82f6':'var(--red)'}}>{inv.status==='accepted'?'✓':inv.status==='invited'?'Pending':'Declined'}</span>
              </div>);
            }
            return(<div key={i} className="g-slot g-empty" onClick={()=>!isFull&&!amIn&&!amInvited&&onAction('join',game)}>
              <div style={{width:28,height:28,borderRadius:'50%',background:'var(--border)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:'0.85rem'}}>+</div>
              <div style={{fontSize:'0.7rem',color:'var(--muted)'}}>Open Spot</div>
            </div>);
          })}
        </div>
        {game.notes&&<div style={{fontSize:'0.75rem',color:'var(--muted)',fontStyle:'italic',marginBottom:10}}>"{game.notes}"</div>}
        <div style={{display:'flex',gap:7,flexWrap:'wrap',alignItems:'center'}}>
          {amInvited&&<><button className="btn btn-primary btn-sm" onClick={()=>onAction('accept',game)}>✓ Accept Invite</button><button className="btn btn-ghost btn-sm" onClick={()=>onAction('decline',game)} style={{color:'var(--red)',borderColor:'rgba(247,91,91,.3)'}}>Decline</button></>}
          {myInvite&&myInvite.status==='declined'&&!isFull&&!expired&&<button className="btn btn-primary btn-sm" onClick={()=>onAction('rejoin',game)}>🏓 Rejoin</button>}
          {!isOrg&&!myInvite&&!isFull&&!expired&&!game.isPrivate&&<button className="btn btn-primary btn-sm" onClick={()=>onAction('join',game)}>🏓 Join Game</button>}
          {amIn&&!isOrg&&<button className="btn btn-ghost btn-sm" onClick={()=>onAction('leave',game)} style={{color:'var(--red)',borderColor:'rgba(247,91,91,.3)'}}>Leave</button>}
          {isOrg&&<button className="btn btn-ghost btn-sm" onClick={()=>onAction('edit',game)}>✏️ Edit</button>}
          {isOrg&&<button className="btn btn-primary btn-sm" onClick={()=>onAction('invite',game)}>+ Invite</button>}
          {isOrg&&<button className="btn btn-ghost btn-sm" onClick={()=>onAction('cancel',game)} style={{marginLeft:'auto',color:'var(--red)',borderColor:'rgba(247,91,91,.3)',fontSize:'0.65rem'}}>Cancel Game</button>}
        </div>
        <div style={{fontSize:'0.62rem',color:'var(--muted2)',marginTop:8}}>By {game.organizerName||'organizer'} · {timeAgo(game.createdAt)}</div>
      </div>}
    </div>
  );
}

/* ── GamesCalendar ── */
function GamesCalendar({games,user,selectedDay,onSelectDay}){
  const todayRef=new Date();todayRef.setHours(0,0,0,0);
  const todayStr=ymd(todayRef);
  const[calDate,setCalDate]=useState(new Date());
  const year=calDate.getFullYear(),month=calDate.getMonth();
  const isPrevDisabled=(year===todayRef.getFullYear()&&month===todayRef.getMonth());
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const dotMap={};
  games.forEach(g=>{
    if(!g.date)return;
    const[gy,gm,gd]=g.date.split('-').map(Number);
    if(gy===year&&gm-1===month){
      if(!dotMap[gd])dotMap[gd]=[];
      const used=slotsUsed(g.players),full=used>=(g.totalSlots||4);
      const inv=g.players?.find(i=>i.uid===user?.uid);
      if(inv&&inv.status==='invited')dotMap[gd].push('inv');
      else if(full)dotMap[gd].push('full');
      else if(g.isPrivate)dotMap[gd].push('priv');
      else dotMap[gd].push('open');
    }
  });
  const cells=[];
  for(let i=0;i<firstDay;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++)cells.push(d);
  const selectDate=d=>{if(!d)return;const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;onSelectDay(selectedDay===ds?null:ds);};
  return(<div className="gcal-wrap">
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
      <button className="btn btn-ghost btn-sm" onClick={()=>setCalDate(new Date(year,month-1,1))} disabled={isPrevDisabled} style={{opacity:isPrevDisabled?.35:1,padding:'4px 10px'}}>‹</button>
      <div style={{fontFamily:'Syne',fontWeight:800,fontSize:'0.92rem'}}>{MONTHS[month]} {year}</div>
      <button className="btn btn-ghost btn-sm" onClick={()=>setCalDate(new Date(year,month+1,1))} style={{padding:'4px 10px'}}>›</button>
    </div>
    <div className="gcal-grid" style={{marginBottom:4}}>
      {DAYS_SHORT.map(d=><div key={d} className="gcal-dow">{d[0]}</div>)}
    </div>
    <div className="gcal-grid" style={{marginBottom:10}}>
      {cells.map((d,i)=>{
        if(!d)return<div key={`e${i}`}/>;
        const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const isPast=ds<todayStr;
        const isToday=ds===todayStr;
        const isSel=ds===selectedDay;
        const dots=dotMap[d]||[];
        return(<div key={d} className={`gcal-day${isPast?' gcal-past':''}${isToday?' gcal-today':''}${isSel?' gcal-sel':''}`} onClick={()=>!isPast&&selectDate(d)}>
          <div className="gcal-dn" style={isSel?{color:'white'}:{}}>{d}</div>
          {dots.length>0&&!isPast&&<div className="gcal-dots">
            {dots.slice(0,3).map((t,j)=><div key={j} className={`gcal-dot d-${t}`}/>)}
          </div>}
        </div>);
      })}
    </div>
    <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
      {[['d-open','Open'],['d-full','Full'],['d-priv','Private'],['d-inv','Invited']].map(([cls,lbl])=>(
        <div key={cls} style={{display:'flex',alignItems:'center',gap:4,fontSize:'0.62rem',color:'var(--muted)'}}>
          <div className={`gcal-dot ${cls}`}/>{lbl}
        </div>
      ))}
    </div>
  </div>);
}

/* ── GamesTab ── */
function GamesTab({user,profile,games,onNeedLogin,uLat,uLng}){
  const[tab,setTab]=useState('list');
  const[showForm,setShowForm]=useState(false);
  const[editGame,setEditGame]=useState(null);
  const[expanded,setExpanded]=useState(null);
  const[selectedDay,setSelectedDay]=useState(null);
  const[search,setSearch]=useState('');
  const[showF,setShowF]=useState(false);
  const[fType,setFT]=useState('');const[fSkill,setFS]=useState('');const[fVis,setFV]=useState('');const[fDist,setFD]=useState('');
  const fCount=[fType,fSkill,fVis,fDist].filter(Boolean).length;
  const clearF=()=>{setFT('');setFS('');setFV('');setFD('');};
  const[showInviteFor,setShowInviteFor]=useState(null);
  const[toast,setToast]=useState(null);
  const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(null),2500);};
  const today=new Date().toISOString().split('T')[0];

  const filtered=useMemo(()=>{
    let g=[...games];
    if(tab==='invited')return g.filter(x=>x.players?.some(p=>p.uid===user?.uid&&p.status==='invited'));
    if(tab==='mine')return g.filter(x=>x.organizerUid===user?.uid||(x.players||[]).some(p=>p.uid===user?.uid&&p.status!=='declined')).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.time||'').localeCompare(b.time||''));
    // list / calendar tab
    g=g.filter(x=>!x.isPrivate||x.organizerUid===user?.uid||x.players?.some(p=>p.uid===user?.uid));
    g=g.filter(x=>!x.date||x.date>=today);
    if(selectedDay)g=g.filter(x=>x.date===selectedDay);
    if(search.trim()){const q=search.toLowerCase();g=g.filter(x=>[x.title,x.court,x.organizerName,x.playType].some(v=>(v||'').toLowerCase().includes(q)));}
    if(fType)g=g.filter(x=>x.playType===fType);
    if(fSkill)g=g.filter(x=>skillInRange(fSkill,x.skillMin,x.skillMax));
    if(fVis==='public')g=g.filter(x=>!x.isPrivate);
    if(fVis==='private')g=g.filter(x=>x.isPrivate);
    if(fDist&&uLat)g=g.filter(x=>x.lat&&haversine(uLat,uLng,x.lat,x.lng)<=parseInt(fDist));
    g.sort((a,b)=>{
      const ai=a.players?.find(i=>i.uid===user?.uid),bi=b.players?.find(i=>i.uid===user?.uid);
      if(ai?.status==='invited'&&bi?.status!=='invited')return -1;
      if(bi?.status==='invited'&&ai?.status!=='invited')return 1;
      return(a.date||'').localeCompare(b.date||'')||(a.time||'').localeCompare(b.time||'');
    });
    return g;
  },[games,tab,selectedDay,search,fType,fSkill,fVis,fDist,user,uLat,uLng,today]);

  const invitedCount=games.filter(g=>g.players?.some(p=>p.uid===user?.uid&&p.status==='invited')).length;

  const handleAction=async(type,game)=>{
    if(!user||!profile){onNeedLogin(null);return;}
    if(type==='edit'){setEditGame(game);setShowForm(true);return;}
    if(type==='invite'){setShowInviteFor(game);return;}
    if(type==='cancel'){if(!confirm('Cancel this game?'))return;try{await db.collection('games').doc(game.id).update({status:'cancelled'});showToast('Game cancelled.');}catch(e){alert(e.message);}return;}
    const ref=db.collection('games').doc(game.id);
    try{
      let roster=[...(game.players||[])];
      if(type==='join'){
        if(slotsUsed(roster)>=(game.totalSlots||4)){showToast('Game is full.');return;}
        if(roster.find(i=>i.uid===user.uid&&i.status!=='declined')){showToast('Already joined.');return;}
        roster=roster.filter(i=>i.uid!==user.uid);
        roster.push({uid:user.uid,name:profile.name,skill:profile.skill||'',photoURL:profile.photoURL||null,status:'accepted',joinedAt:Date.now()});
      }else if(type==='rejoin'){roster=roster.map(i=>i.uid===user.uid?{...i,status:'accepted',joinedAt:Date.now()}:i);}
      else if(type==='accept'){roster=roster.map(i=>i.uid===user.uid?{...i,status:'accepted'}:i);}
      else if(type==='decline'){roster=roster.map(i=>i.uid===user.uid?{...i,status:'declined'}:i);}
      else if(type==='leave'){roster=roster.filter(i=>i.uid!==user.uid);}
      await ref.update({players:roster,updatedAt:Date.now()});
      if(type==='accept'||type==='join'||type==='rejoin')showToast('✅ You joined the game!');
      if(type==='decline')showToast('Invite declined.');
      if(type==='leave')showToast('Left the game.');
    }catch(e){alert(e.message);}
  };

  return(
    <div className="px fade-in">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',paddingTop:4,marginBottom:12}}>
        <div className="section-title" style={{marginBottom:0}}>Games</div>
        <button className="btn btn-primary btn-sm" onClick={()=>{if(!user){onNeedLogin(null);return;}setEditGame(null);setShowForm(true);}}>🎮 Create</button>
      </div>

      {/* Tabs */}
      <div className="tab-pills">
        {[['list','📋 All'],['mine','🏓 My Games'],['calendar','📅 Calendar'],['invited',`📩 Invited${invitedCount>0?` (${invitedCount})`:''}`]].map(([k,l])=>(
          <div key={k} className={`pill ${tab===k?'active':''}`} onClick={()=>{setTab(k);setSelectedDay(null);}}>{l}</div>
        ))}
      </div>

      {/* Calendar view */}
      {tab==='calendar'&&<>
        <GamesCalendar games={games} user={user} selectedDay={selectedDay} onSelectDay={setSelectedDay}/>
        {selectedDay&&<div style={{fontSize:'0.72rem',color:'var(--muted)',marginBottom:8,display:'flex',alignItems:'center',gap:8}}>
          📅 {fmtFullDate(selectedDay)} · {filtered.length} game{filtered.length!==1?'s':''}
          <button onClick={()=>setSelectedDay(null)} style={{background:'var(--card2)',border:'1px solid var(--border)',borderRadius:6,padding:'2px 8px',fontSize:'0.65rem',cursor:'pointer',fontFamily:'DM Sans',fontWeight:600,color:'var(--text)'}}>Clear</button>
        </div>}
      </>}

      {/* Search + filter (list + calendar + mine) */}
      {tab!=='invited'&&<>
        <div style={{display:'flex',gap:8,marginBottom:10,alignItems:'center'}}>
          <div style={{position:'relative',flex:1}}>
            <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',pointerEvents:'none'}}>🔍</span>
            <input className="fi" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search games, courts…" style={{paddingLeft:36}}/>
          </div>
          <button onClick={()=>setShowF(!showF)} style={{padding:'10px 14px',border:`1.5px solid ${showF||fCount?'var(--green)':'var(--border2)'}`,borderRadius:12,background:showF||fCount?'var(--green-dim)':'transparent',color:showF||fCount?'var(--green)':'var(--muted)',fontFamily:'DM Sans',fontSize:'0.78rem',fontWeight:700,cursor:'pointer',whiteSpace:'nowrap',flexShrink:0}}>
            ⚙ Filter{fCount>0?` (${fCount})`:''}
          </button>
        </div>
        {showF&&<div style={{background:'var(--card)',border:'1px solid var(--border2)',borderRadius:14,padding:'12px 14px',marginBottom:12,animation:'fadeIn .15s'}}>
          <div style={{marginBottom:10}}><div className="fp-label">Play Type</div><div className="fp-pills"><button className={`fp-pill ${!fType?'s':''}`} onClick={()=>setFT('')}>All</button>{GAME_PTYPES.map(t=><button key={t} className={`fp-pill ${fType===t?'s':''}`} onClick={()=>setFT(fType===t?'':t)}>{GAME_PT_E[t]} {t}</button>)}</div></div>
          <div style={{marginBottom:10}}><div className="fp-label">My Skill</div><div className="fp-pills"><button className={`fp-pill ${!fSkill?'s':''}`} onClick={()=>setFS('')}>Any</button>{GAME_SKILLS.filter(s=>s!=='Any').map(s=><button key={s} className={`fp-pill ${fSkill===s?'s':''}`} onClick={()=>setFS(fSkill===s?'':s)}>{s}</button>)}</div></div>
          <div style={{marginBottom:uLat?10:0}}><div className="fp-label">Visibility</div><div className="fp-pills"><button className={`fp-pill ${!fVis?'s':''}`} onClick={()=>setFV('')}>All</button><button className={`fp-pill ${fVis==='public'?'s':''}`} onClick={()=>setFV(fVis==='public'?'':'public')}>🌍 Public</button><button className={`fp-pill ${fVis==='private'?'s':''}`} onClick={()=>setFV(fVis==='private'?'':'private')}>🔒 Private</button></div></div>
          {uLat&&<div><div className="fp-label">Distance</div><div className="fp-pills"><button className={`fp-pill ${!fDist?'s':''}`} onClick={()=>setFD('')}>Any</button>{['5','10','25','50'].map(d=><button key={d} className={`fp-pill ${fDist===d?'s':''}`} onClick={()=>setFD(fDist===d?'':d)}>Within {d} mi</button>)}</div></div>}
          {fCount>0&&<button onClick={clearF} style={{marginTop:8,background:'none',border:'none',color:'var(--red)',fontSize:'0.72rem',fontWeight:600,cursor:'pointer'}}>✕ Clear all</button>}
        </div>}
      </>}

      <div style={{fontSize:'0.7rem',color:'var(--muted)',marginBottom:10}}>{tab==='invited'?`${invitedCount} pending invite${invitedCount!==1?'s':''}`:`${filtered.length} game${filtered.length!==1?'s':''}`}</div>

      {filtered.length===0&&<div className="empty-state">
        <div className="empty-icon">{tab==='invited'?'📩':tab==='mine'?'🏓':'🎮'}</div>
        <div className="empty-title">{tab==='invited'?'No pending invites':tab==='mine'?'No games yet':'No games found'}</div>
        <div className="empty-sub">{tab==='invited'?"You're all caught up!":tab==='mine'?'Create or join a game':selectedDay?'No games on this day':search||fCount?'Try different filters':'Be the first to create one!'}</div>
      </div>}

      {filtered.map(g=><GameCard key={g.id} game={g} user={user} profile={profile} onAction={handleAction} expanded={expanded===g.id} onToggle={()=>setExpanded(expanded===g.id?null:g.id)}/>)}
