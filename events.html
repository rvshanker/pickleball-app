    const active=units.filter(u=>u.active);
    const keep=keptRounds(league,editWeek);
    const [date,setDate]=useState(editWeek?editWeek.date:(kindOf(league)==='tournament'?todayIso():nextThursday()));
    const [courts,setCourts]=useState((editWeek?editWeek.courts:league.defaultCourts||[]).join(', '));
    const [rounds,setRounds]=useState(editWeek?editWeek.numRounds:(league.defaultRounds||8));
    const [ids,setIds]=useState(editWeek?(editWeek.unitIds||editWeek.playerIds):active.map(u=>u.id));
    const [newName,setNewName]=useState('');const [newName2,setNewName2]=useState('');const [err,setErr]=useState('');
    const [busy,setBusy]=useState(false);
    const cs=parseCourts(courts);
    const used=Math.min(cs.length,Math.floor(ids.length/per));
    const sit=ids.length-used*per;
    const maxNR=S.maxNoRepeatRounds(ids.length);
    // show the active roster plus anyone already in this session (even if since deactivated)
    const shown=units.filter(u=>u.active||ids.includes(u.id));
    const minRounds=Math.max(1,keep+1);
    useEffect(()=>{if(rounds<minRounds)setRounds(minRounds);},[minRounds]);

    const addPlayer=async()=>{
        const n=newName.trim();if(!n)return;
        setErr('');
        const existing=league.players.find(p=>p.name.trim().toLowerCase()===n.toLowerCase());
        if(existing){
            if(existing.active===false)await update({players:league.players.map(p=>p.id===existing.id?{...p,active:true}:p)});
            if(!ids.includes(existing.id))setIds([...ids,existing.id]);
            setNewName('');return;
        }
        const p={id:uid6(),name:n,active:true};
        await update({players:[...league.players,p]});
        setIds(prev=>[...prev,p.id]);setNewName('');
    };
    const addTeamHere=async()=>{
        const r=await addTeam(league,update,newName,newName2);
        if(r.error){setErr(r.error);return;}
        setErr('');setIds(prev=>[...prev,r.team.id]);setNewName('');setNewName2('');
    };
    const go=()=>{
        setBusy(true);
        setTimeout(async()=>{ // let the spinner paint
            const w=generateWeek(league,{date,courts:cs,rounds,unitIds:ids},editWeek,keep);
            await onSave(w);
        },30);
    };
    const need=fmt==='rotating'?'Need at least 4 players and 1 court.':fixed?'Need at least 2 teams and 1 court.':'Need at least 2 players and 1 court.';
    return(
        <Modal onClose={onClose} title={editWeek?`Change ${what}`:`Schedule a ${T.lower}`}>
            {editWeek&&<div className={keep?'ok':'warn'} style={{marginBottom:14}}>
                {keep?`Games 1–${keep} are kept as played (with their scores). Games ${keep+1}–${rounds} will be redrawn with the ${what} ticked below.`
                     :`No scores yet, so all games will be redrawn with the ${what} ticked below.`}
            </div>}
            <div className="grid2">
                <div><label className="slbl">Date</label><input className="inp" type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
                <div><label className="slbl">Total games</label><Stepper value={rounds} min={minRounds} max={MAX_GAMES} onChange={setRounds}/></div>
            </div>
            <label className="slbl" style={{marginTop:14}}>Court numbers you got</label>
            <input className="inp" value={courts} onChange={e=>setCourts(e.target.value)} placeholder="e.g. 4, 5, 7"/>
            <div className="row" style={{justifyContent:'space-between',margin:'14px 0 8px'}}>
                <label className="slbl" style={{margin:0}}>{fixed?'Teams playing':'Who\'s playing'} ({ids.length})</label>
                <button className="btn btn-ghost btn-sm" onClick={()=>setIds(ids.length===shown.length?[]:shown.map(u=>u.id))}>{ids.length===shown.length?'None':'All'}</button>
            </div>
            <div className={fixed?'':'grid2'} style={fixed?{display:'flex',flexDirection:'column',gap:6}:null}>
                {shown.map(u=>{const on=ids.includes(u.id);return(
                    <label key={u.id} className={'check'+(on?'':' off')}>
                        <input type="checkbox" checked={on} onChange={()=>setIds(on?ids.filter(x=>x!==u.id):[...ids,u.id])}/>
                        <span>{u.name}</span>
                    </label>);})}
            </div>
            {fixed?<div className="row" style={{marginTop:8}}>
                <input className="inp" style={{padding:'9px 12px'}} placeholder="Player" value={newName} onChange={e=>setNewName(e.target.value)}/>
                <span style={{color:'#94a3b8',fontWeight:700}}>&</span>
                <input className="inp" style={{padding:'9px 12px'}} placeholder="Partner" value={newName2} onChange={e=>setNewName2(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')addTeamHere();}}/>
                <button className="btn btn-out btn-sm" onClick={addTeamHere} style={{flexShrink:0}}>+ Team</button>
            </div>:<div className="row" style={{marginTop:8}}>
                <input className="inp" style={{padding:'9px 12px'}} placeholder="New player or sub" value={newName}
                    onChange={e=>setNewName(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')addPlayer();}}/>
                <button className="btn btn-out btn-sm" onClick={addPlayer} style={{flexShrink:0}}>+ Add</button>
            </div>}
            <div className="muted" style={{fontSize:12,marginTop:4}}>Untick anyone who isn't playing. New {what} are added to the roster too.</div>
            <div style={{marginTop:14,display:'flex',flexDirection:'column',gap:8}}>
                {err&&<div className="err">{err}</div>}
                {used<1?<div className="err">{need}</div>:
                 <div className="ok">{used} court{used>1?'s':''} in use ({cs.slice(0,used).join(', ')}) · {used*per} {what} on court each game{sit>0?(fixed?` · ${sit} team${sit>1?'s':''} on a bye each game (rotated fairly)`:` · ${sit} sit out each game (rotated fairly)`):''}</div>}
                {used<cs.length&&used>=1&&<div className="warn">Only {used} of {cs.length} courts needed for {ids.length} {what}.</div>}
                {fmt==='rotating'&&rounds>maxNR&&<div className="warn">With {ids.length} players, at most {maxNR} games can have all-new partners. Games after that will repeat a partner.</div>}
                {fmt!=='rotating'&&used>=1&&(rounds>maxNR
                    ?<div className="warn">Everyone has played everyone after {maxNR} games. Games after that are rematches.</div>
                    :rounds<maxNR&&sit<=1&&<div className="muted" style={{fontSize:13}}>A full round robin (everyone plays everyone) is {maxNR} games. <button className="btn btn-ghost btn-sm" onClick={()=>setRounds(Math.min(MAX_GAMES,Math.max(minRounds,maxNR)))}>Use {maxNR}</button></div>)}
            </div>
            <button className="btn btn-g" style={{width:'100%',marginTop:14}} disabled={busy||used<1} onClick={go}>{busy?'Generating…':editWeek?(keep?`🔀 Redraw games ${keep+1}–${rounds}`:'🔀 Redraw all games'):'🎲 Generate matchups'}</button>
        </Modal>
    );
}

function ScheduleList({league,week,canScore,update,onPlayer}){
    const name=id=>(league.players.find(p=>p.id===id)||{name:'?'}).name;
    const scores=league.scores||{};
    const sc=scoringOf(league);
    const setScore=(mid,side,val)=>{
        const cur=scores[mid]||{a:null,b:null};
        const v=val===''?null:Math.max(0,Math.min(99,parseInt(val,10)||0));
        update({['scores.'+mid]:{...cur,[side]:v}});
    };
    return(
        <div>
            <div className="tap-hint">👆 Tap a <u>name</u> to see their games</div>
            {week.rounds.map((r,ri)=>(
                <div key={ri} className="round-card">
                    <div className="round-hd">
                        <span style={{fontSize:15,fontWeight:800}}>Game {ri+1}</span>
                        <span style={{fontSize:12}}>{r.matches.filter(m=>scores[m.id]&&isNum(scores[m.id].a)&&isNum(scores[m.id].b)).length}/{r.matches.length} scored</span>
                    </div>
                    {r.matches.map(m=>{
                        const s=scores[m.id]||{};const done=isNum(s.a)&&isNum(s.b);
                        const aWin=done&&+s.a>+s.b,bWin=done&&+s.b>+s.a;
                        const [ca,cb]=done?counted(s.a,s.b,sc):[0,0];
                        const adjusted=done&&(ca!==+s.a||cb!==+s.b);
                        const names=t=>t.map((id,i)=><React.Fragment key={id}>{i>0&&' & '}<button className="pbtn" onClick={()=>onPlayer(id,week.id)}>{name(id)}</button></React.Fragment>);
                        return(
                            <div key={m.id} className="match">
                                <div className="court"><small>Court</small><b>{m.court}</b></div>
                                <div className="teams">
                                    <div className={'team'+(aWin?' win':'')}>
                                        <div className="tnames">{names(m.team1)}</div>
                                        <ScoreInput value={s.a} win={aWin} disabled={!canScore} onCommit={v=>setScore(m.id,'a',v)}/>
                                    </div>
                                    <div className={'team'+(bWin?' win':'')}>
                                        <div className="tnames">{names(m.team2)}</div>
                                        <ScoreInput value={s.b} win={bWin} disabled={!canScore} onCommit={v=>setScore(m.id,'b',v)}/>
                                    </div>
                                    {adjusted&&<div style={{fontSize:11,color:'#64748b',textAlign:'right'}}>Overtime — counts as {ca}–{cb} on the leaderboard</div>}
                                </div>
                            </div>
                        );
                    })}
                    {r.sitOut.length>0&&<div className="sit">🪑 {fmtOf(league)==='fixed'?'Bye':'Sitting out'}: {r.sitOut.map((id,i)=><React.Fragment key={id}>{i>0&&', '}<button className="pbtn" onClick={()=>onPlayer(id,week.id)}>{name(id)}</button></React.Fragment>)}</div>}
                </div>
            ))}
        </div>
    );
}

// ── Live courts: each court shows its own next unscored game ─────────
function LiveView({league,week,canScore,update,onPlayer,onAll}){
    const name=id=>(league.players.find(p=>p.id===id)||{name:'?'}).name;
    const order=c=>{const i=week.courts.indexOf(c);return i<0?99:i;};
    const courts=[...new Set(week.rounds.flatMap(r=>r.matches.map(m=>m.court)))].sort((x,y)=>order(x)-order(y));
    const live=courts.map(c=>{
        const games=[];
        week.rounds.forEach((r,ri)=>{const m=r.matches.find(x=>x.court===c);if(m)games.push({ri,m});});
        const i=games.findIndex(g=>!scoreOf(league,g.m.id));
        return i<0?{court:c,done:true,last:games[games.length-1]}:{court:c,...games[i],next:games.slice(i+1).find(g=>!scoreOf(league,g.m.id))};
    });
    const active=live.filter(x=>!x.done);
    if(!active.length)return(
        <div className="card" style={{textAlign:'center',padding:'28px 18px'}}>
            <div style={{fontSize:36}}>🎉</div>
            <div className="fd" style={{fontSize:22,fontWeight:800,margin:'6px 0'}}>ALL GAMES SCORED</div>
            <div className="muted" style={{marginBottom:12}}>Check Standings for the results.</div>
            <button className="btn btn-out btn-sm" onClick={onAll}>See all scores</button>
        </div>
    );
    // Players still on court in an earlier game (so a court that's ahead knows to wait)
    const busy={};active.forEach(x=>[...x.m.team1,...x.m.team2].forEach(p=>{busy[p]=Math.min(busy[p]??99,x.ri);}));
    const minRi=Math.min(...active.map(x=>x.ri));
    const sitting=(week.rounds[minRi].sitOut||[]);
    return(
        <div>
            <div className="tap-hint">👆 Tap a <u>name</u> to see their games</div>
            <div className="lc-grid">
            {live.map(x=>x.done?(
                <div key={x.court} className="lc" style={{opacity:.6}}>
                    <div className="lc-hd"><b>Court {x.court}</b><span>✓ All done</span></div>
                </div>
            ):(
                <LiveCard key={x.m.id} league={league} x={x} total={week.rounds.length} canScore={canScore} update={update} onPlayer={onPlayer} weekId={week.id} name={name}
                    waitingOn={[...x.m.team1,...x.m.team2].filter(p=>busy[p]<x.ri).map(name)}/>
            ))}
            </div>
            {sitting.length>0&&<div className="sit-line">🪑 Sitting out game {minRi+1}: {sitting.map(name).join(', ')}</div>}
        </div>
    );
}
function LiveCard({league,x,total,canScore,update,onPlayer,weekId,name,waitingOn}){
    const part=(league.scores||{})[x.m.id]||{};
    const [a,setA]=useState(isNum(part.a)?String(part.a):'');
    const [b,setB]=useState(isNum(part.b)?String(part.b):'');
    const [busy,setBusy]=useState(false);
    const ok=a!==''&&b!==''&&a!==b;
    const save=async()=>{
        setBusy(true);
        const n=v=>Math.max(0,Math.min(99,parseInt(v,10)||0));
        await update({['scores.'+x.m.id]:{a:n(a),b:n(b)}});
        setBusy(false);
    };
    const names=t=>t.map((id,i)=><React.Fragment key={id}>{i>0&&' & '}<button className="pbtn" onClick={()=>onPlayer(id,weekId)}>{name(id)}</button></React.Fragment>);
    const aWin=ok&&+a>+b,bWin=ok&&+b>+a;
    const Box=({v,set,win})=>canScore
        ?<input className={'score-inp live'+(win?' win':'')} type="number" inputMode="numeric" min="0" max="99" placeholder="–" value={v}
            onFocus={e=>e.target.select()} onChange={e=>set(e.target.value.slice(0,2))}/>
        :<div className="score-ro">–</div>;
    const tie=a!==''&&b!==''&&a===b;
    return(
        <div className="lc">
            <div className="lc-hd"><b>Court {x.court}</b><span>Game {x.ri+1} of {total}</span></div>
            <div className={'lc-row'+(aWin?' win':'')}><div className="tnames">{names(x.m.team1)}</div>{Box({v:a,set:setA,win:aWin})}</div>
            <div className={'lc-row'+(bWin?' win':'')}><div className="tnames">{names(x.m.team2)}</div>{Box({v:b,set:setB,win:bWin})}</div>
            {waitingOn.length>0&&<div className="lc-note">⏳ Waiting for {waitingOn.join(', ')}</div>}
            {canScore&&(a!==''||b!=='')&&<div className="lc-save">
                <button className="btn btn-g btn-sm" disabled={!ok||busy} onClick={save}>{busy?'Saving…':tie?'No ties':a===''||b===''?'Enter both scores':'✓ Save score'}</button>
            </div>}
            {x.next&&<div className="lc-next">Next: {x.next.m.team1.map(name).join(' & ')} vs {x.next.m.team2.map(name).join(' & ')}</div>}
        </div>
    );
}

function ScoreInput({value,disabled,onCommit,win}){
    const [v,setV]=useState(isNum(value)?String(value):'');
    const focused=useRef(false);
    useEffect(()=>{if(!focused.current)setV(isNum(value)?String(value):'');},[value]);
    const commit=()=>{const cur=isNum(value)?String(value):'';if(v!==cur)onCommit(v);};
    if(disabled)return<div className={'score-ro'+(win?' win':'')}>{isNum(value)?value:'–'}</div>;
    return<input className={'score-inp'+(win?' win':'')} type="number" inputMode="numeric" min="0" max="99" value={v} placeholder="–"
        onFocus={e=>{focused.current=true;e.target.select();}}
        onChange={e=>setV(e.target.value.slice(0,2))}
        onBlur={()=>{focused.current=false;commit();}}
        onKeyDown={e=>{if(e.key==='Enter')e.target.blur();}}/>;
}

// ── One player's games ────────────────────────────────────────────────
function PlayerGames({league,pid,weekId,onClose,onMap}){
    const weeks=league.weeks||[];
    const [wid,setWid]=useState(weekId||(weeks.length?weeks[weeks.length-1].id:null));
    const sc=scoringOf(league);
    const name=id=>(league.players.find(p=>p.id===id)||{name:'?'}).name;
    const week=weeks.find(w=>w.id===wid);
    const rows=[];
    if(week)week.rounds.forEach((r,ri)=>{
        if(r.sitOut.includes(pid)){rows.push({ri,sat:true});return;}
        const m=r.matches.find(m=>m.team1.includes(pid)||m.team2.includes(pid));
        if(!m)return; // not playing that game (joined later / left early)
        const mine=m.team1.includes(pid)?m.team1:m.team2, opp=m.team1.includes(pid)?m.team2:m.team1;
        const s=scoreOf(league,m.id);
        let my=null,their=null,cm=null,ct=null;
        if(s){const t1=m.team1.includes(pid);my=t1?+s.a:+s.b;their=t1?+s.b:+s.a;const [ca,cb]=counted(s.a,s.b,sc);cm=t1?ca:cb;ct=t1?cb:ca;}
        rows.push({ri,court:m.court,partner:mine.find(x=>x!==pid),opp,my,their,cm,ct});
    });
    const played=rows.filter(r=>!r.sat&&r.my!==null);
    const pts=played.reduce((n,r)=>n+r.cm,0),pa=played.reduce((n,r)=>n+r.ct,0);
    const w=played.filter(r=>r.my>r.their).length,l=played.filter(r=>r.my<r.their).length;
    return(
        <Modal onClose={onClose} title={fmtOf(league)==='fixed'&&teamOfPlayer(league,pid)?teamName(league,teamOfPlayer(league,pid)):name(pid)}>
            {weeks.length>1&&<div className="chips" style={{marginBottom:12}}>
                {weeks.map((x,i)=><button key={x.id} className={'chip'+(x.id===wid?' on':'')} onClick={()=>setWid(x.id)}>{T.short} {i+1} · {fmtDate(x.date)}</button>)}
            </div>}
            {!week?<div className="muted">No weeks scheduled yet.</div>:<>
                <div className="grid2" style={{gridTemplateColumns:'repeat(4,minmax(0,1fr))',marginBottom:10}}>
                    {[['Pts',pts],['W-L',`${w}-${l}`],['Avg',played.length?(pts/played.length).toFixed(1):'–'],['+/-',(pts-pa>0?'+':'')+(pts-pa)]].map(([k,v])=>(
                        <div key={k} style={{background:'#f8fafc',borderRadius:10,padding:'8px 4px',textAlign:'center'}}>
                            <div className="fd" style={{fontSize:22,fontWeight:800}}>{v}</div>
                            <div style={{fontSize:11,color:'#64748b',fontWeight:700,textTransform:'uppercase'}}>{k}</div>
                        </div>))}
                </div>
                {rows.length===0&&<div className="muted">Not playing this {T.lower}.</div>}
                {rows.map(r=>(
                    <div key={r.ri} className="pg-row">
                        <div style={{width:54,flexShrink:0}}>
                            <div style={{fontWeight:800,fontSize:13}}>Game {r.ri+1}</div>
                            {!r.sat&&<div style={{fontSize:11,color:'#047857',fontWeight:700}}>Court {r.court}</div>}
                        </div>
                        {r.sat?<div className="muted" style={{flex:1}}>🪑 Sat out</div>:<>
                            <div style={{flex:1,minWidth:0,fontSize:14,lineHeight:1.35}}>
                                {r.partner&&fmtOf(league)==='rotating'?<><div>with <b>{name(r.partner)}</b></div>
                                <div className="muted" style={{fontSize:13}}>vs {r.opp.map(name).join(' & ')}</div></>
                                :<div>vs <b>{r.opp.map(name).join(' & ')}</b></div>}
                            </div>
                            <div style={{textAlign:'right',flexShrink:0}}>
                                {r.my===null?<span className="res p">not scored</span>:<>
                                    <div style={{fontWeight:800,fontSize:16}}><span style={{color:r.my>r.their?'#047857':'#0f172a'}}>{r.my}</span>–{r.their} <span className={'res '+(r.my>r.their?'w':r.my<r.their?'l':'p')}>{r.my>r.their?'W':r.my<r.their?'L':'T'}</span></div>
                                    {(r.cm!==r.my||r.ct!==r.their)&&<div style={{fontSize:11,color:'#64748b'}}>counts {r.cm}–{r.ct}</div>}
                                </>}
                            </div>
                        </>}
                    </div>
                ))}
            </>}
            {onMap&&<button className="btn btn-out btn-sm" style={{marginTop:14,width:'100%'}} onClick={onMap}>🕸️ Partner &amp; opponent map</button>}
        </Modal>
    );
}

// ── Leaderboard ───────────────────────────────────────────────────────
function Leaderboard({league,onPlayer}){
    const [scope,setScope]=useState('season');
    const weeks=league.weeks||[];
    const sc=scoringOf(league);
    const rows=useMemo(()=>{
        const all=(fmtOf(league)==='fixed'?calcTeamBoard:calcBoard)(league,scope==='season'?null:scope).sort((kindOf(league)==='tournament'?SORTS.win:SORTS.avg).fn);
        return all.filter(r=>r.qualified).concat(all.filter(r=>!r.qualified)); // non-qualifiers go to the bottom
    },[league,scope]);
    const anyScores=rows.some(r=>r.gp>0);
    const latestWeek=weeks.length?weeks[weeks.length-1].id:null;
    return(
        <div>
            {weeks.length>1&&<WeekChips weeks={weeks} value={scope} onChange={setScope}
                extra={<button className={'chip'+(scope==='season'?' on':'')} onClick={()=>setScope('season')}>{kindOf(league)==='tournament'?'Overall':'Season'}</button>}/>}
            <div className="card" style={{padding:'6px 8px'}}>
                <table className="lb">
                    <thead><tr>
                        <th className="l" style={{width:34,cursor:'default'}}>#</th>
                        <th className="l" style={{cursor:'default'}}>{fmtOf(league)==='fixed'?'Team':'Player'}</th>
                        <th style={{cursor:'default'}}>Avg</th>
                        <th style={{cursor:'default'}}>W-L</th>
                        <th style={{cursor:'default'}}>+/-</th>
                    </tr></thead>
                    <tbody>
                        {rows.map((r,i)=>(
                            <tr key={r.id} onClick={()=>onPlayer(r.players?r.players[0]:r.id,scope==='season'?latestWeek:scope)} style={{cursor:'pointer',...(r.qualified?{}:{opacity:.5})}}>
                                <td className="l">{r.qualified?<span className={'rank'+(anyScores&&i<3?' g'+(i+1):'')}>{i+1}</span>:<span className="rank">–</span>}</td>
                                <td className="l" style={{fontWeight:600}}>
                                    <span className="pbtn">{r.name}</span>
                                    {!r.qualified&&<div style={{fontSize:11,color:'#94a3b8',fontWeight:400}}>needs {r.need} games</div>}
                                </td>
                                <td className="pts">{r.gp?r.avg.toFixed(1):'–'}</td>
                                <td>{r.w}-{r.l}</td>
                                <td style={{color:r.diff>0?'#059669':r.diff<0?'#dc2626':'#64748b',fontWeight:600}}>{r.diff>0?'+':''}{r.diff}</td>
                            </tr>
                        ))}
                    </tbody>
                </table>
                {!anyScores&&<div className="muted" style={{textAlign:'center',padding:'14px 0 6px'}}>Standings appear once scores are entered.</div>}
            </div>
            <details className="muted" style={{fontSize:13,marginTop:10,lineHeight:1.6}}>
                <summary style={{cursor:'pointer',fontWeight:600}}>How ranking works</summary>
                <div style={{marginTop:6}}>
                    {kindOf(league)==='tournament'
                        ?<>Ranked by <b>wins</b> (win % if some played fewer games). Ties go to <b>+/-</b>: points for minus points against.</>
                        :<>Ranked by <b>Avg</b>: average points {fmtOf(league)==='singles'?'you':'your team'} scored per game, so sitting out doesn't hurt you. Ties go to <b>+/-</b> (points for minus points against), then wins.</>}
                    {sc.mode==='capped'&&<> Overtime games count as {sc.gameTo} to {sc.gameTo}-minus-the-margin (15–13 counts as {sc.gameTo}–{sc.gameTo-2}).</>}
                    {sc.minPct>0&&kindOf(league)==='league'&&<> For the season, you need to play at least {sc.minPct}% of games to be ranked.</>}
                    {' '}Tap a {fmtOf(league)==='fixed'?'team':'player'} to see their games.
                </div>
            </details>
        </div>
    );
}

// ── Partner / opponent map ────────────────────────────────────────────
// Everything one player has done with (partners) or against (opponents) everyone else, from scored games.
function playerWeb(league,pid,weekId){
    const sc=scoringOf(league);
    const partners={},opps={},games=[];
    const get=(o,id)=>o[id]=o[id]||{id,g:0,w:0,l:0,pf:0,pa:0,games:[]};
    (league.weeks||[]).forEach((w,wi)=>{
        if(weekId&&w.id!==weekId)return;
        (w.rounds||[]).forEach((r,ri)=>(r.matches||[]).forEach(m=>{
            const t1=m.team1.includes(pid);if(!t1&&!m.team2.includes(pid))return;
            const s=scoreOf(league,m.id);if(!s)return;
            const mine=t1?m.team1:m.team2,opp=t1?m.team2:m.team1;
            const my=t1?+s.a:+s.b,their=t1?+s.b:+s.a;
            const [ca,cb]=counted(s.a,s.b,sc);
            const g={wi,date:w.date,ri,court:m.court,partner:mine.find(x=>x!==pid),opp,my,their,cm:t1?ca:cb,ct:t1?cb:ca,res:my>their?'W':my<their?'L':'T'};
            games.push(g);
            const add=x=>{x.g++;x.pf+=g.cm;x.pa+=g.ct;if(g.res==='W')x.w++;else if(g.res==='L')x.l++;x.games.push(g);};
            if(g.partner)add(get(partners,g.partner));
            opp.forEach(o=>add(get(opps,o)));
        }));
    });
    return{partners,opps,games};
}
const pctOf=x=>x&&x.g?x.w/x.g:0;
const webColor=x=>!x||!x.g?'#cbd5e1':pctOf(x)>=.6?'#10b981':pctOf(x)<=.4?'#ef4444':'#f59e0b';
// Who beat (or lost to) you in a set of games: [{id,n}] most frequent first
function tally(games,res,pick){
    const c={};games.filter(g=>g.res===res).forEach(g=>pick(g).forEach(id=>c[id]=(c[id]||0)+1));
    return Object.entries(c).map(([id,n])=>({id,n})).sort((a,b)=>b.n-a.n);
}

function MapTab({league,focus}){
    const weeks=league.weeks||[];
    const players=league.players;
    const KEY='leagueMe:'+league.id;
    const [me,setMe]=useState(()=>{
        if(focus&&players.some(p=>p.id===focus.pid))return focus.pid;
        let saved=null;try{saved=localStorage.getItem(KEY);}catch(e){}
        if(saved&&players.some(p=>p.id===saved))return saved;
        const top=calcBoard(league,null).sort(SORTS.avg.fn)[0];
        return top?top.id:(players[0]||{}).id;
    });
    const rotating=fmtOf(league)==='rotating';
    const [mode,setMode]=useState(rotating?'partners':'opps');
    const [scope,setScope]=useState('season');
    const [sel,setSel]=useState(null);
    useEffect(()=>{if(focus){setMe(focus.pid);setSel(null);}},[focus]);
    const detailRef=useRef(null);
    // On phones the details sit below the map — bring them into view when a node is tapped
    useEffect(()=>{if(sel&&detailRef.current)detailRef.current.scrollIntoView({behavior:'smooth',block:'nearest'});},[sel]);
    const pick=id=>{setMe(id);setSel(null);try{localStorage.setItem(KEY,id);}catch(e){}};

    const nameOf=useMemo(()=>{
        const m={};players.forEach(p=>m[p.id]=p.name);return id=>m[id]||'(removed)';
    },[players]);
    // Short label for the map: first name, or full name if two people share a first name
    const short=useMemo(()=>{
        const first=n=>String(n).trim().split(/\s+/)[0];
        const count={};players.forEach(p=>{const f=first(p.name).toLowerCase();count[f]=(count[f]||0)+1;});
        return id=>{const n=nameOf(id);let s=count[first(n).toLowerCase()]>1?n:first(n);return s.length>11?s.slice(0,10)+'…':s;};
    },[players,nameOf]);

    const web=useMemo(()=>me?playerWeb(league,me,scope==='season'?null:scope):null,[league,me,scope]);
    if(!players.length||!me)return<div className="card muted">Add players to see the map.</div>;

    const data=mode==='partners'?web.partners:web.opps;
    // Ring: everyone else who's active or has history with this player, in roster order (stays put when switching modes)
    const ring=players.filter(p=>p.id!==me&&(p.active!==false||web.partners[p.id]||web.opps[p.id])).map(p=>p.id);
    const all=web.games;
    const tot={w:all.filter(g=>g.res==='W').length,l:all.filter(g=>g.res==='L').length};

    // Highlights
    const list=Object.values(data);
    const min2=list.some(x=>x.g>=2)?2:1;
    const elig=list.filter(x=>x.g>=min2);
    const best=elig.slice().sort((a,b)=>pctOf(b)-pctOf(a)||(b.pf-b.pa)-(a.pf-a.pa)||b.g-a.g)[0];
    const worst=elig.slice().sort((a,b)=>pctOf(a)-pctOf(b)||(a.pf-a.pa)-(b.pf-b.pa)||b.g-a.g)[0];
    const most=list.slice().sort((a,b)=>b.g-a.g)[0];
    const notYet=mode==='partners'?ring.filter(id=>!web.partners[id]&&(players.find(p=>p.id===id)||{}).active!==false):[];
    const hl=mode==='partners'
        ?[['🔥 Best partner',best&&pctOf(best)>0?best:null,x=>`${x.w}-${x.l} together`],
          ['🥶 Toughest pairing',worst&&worst!==best&&worst.l>0?worst:null,x=>`${x.w}-${x.l} together`],
          ['🤝 Most games with',most,x=>`${x.g} game${x.g>1?'s':''}`]]
        :[['😈 Nemesis',worst&&worst.l>0?worst:null,x=>`you're ${x.w}-${x.l} vs them`],
          ['😎 Favorite matchup',best&&best.w>0?best:null,x=>`you're ${x.w}-${x.l} vs them`],
          ['⚔️ Faced most',most,x=>`${x.g} game${x.g>1?'s':''}`]];

    // Geometry
    const W=440,H=420,cx=W/2,cy=H/2,R=Math.min(150,ring.length>14?160:140);
    const nodes=ring.map((id,i)=>{
        const a=-Math.PI/2+i*2*Math.PI/Math.max(ring.length,1);
        const st=data[id];const r=st&&st.g?Math.min(28,15+st.g*2.5):12;
        return{id,st,r,x:cx+R*Math.cos(a),y:cy+R*Math.sin(a),cos:Math.cos(a),sin:Math.sin(a)};
    });
    const selSt=sel?data[sel]:null;

    return(
        <div>
            <div className="card" style={{padding:14,marginBottom:12}}>
                <div className="row" style={{marginBottom:10}}>
                    <label className="slbl" style={{margin:0,flexShrink:0}}>Player</label>
                    <select className="inp" style={{padding:'8px 10px'}} value={me} onChange={e=>pick(e.target.value)}>
                        {players.map(p=><option key={p.id} value={p.id}>{p.name}{p.active===false?' (inactive)':''}</option>)}
                    </select>
                </div>
                {rotating?<div className="chips">
                    <button className={'chip'+(mode==='partners'?' on':'')} onClick={()=>{setMode('partners');setSel(null);}}>🤝 Partners</button>
                    <button className={'chip'+(mode==='opps'?' on':'')} onClick={()=>{setMode('opps');setSel(null);}}>⚔️ Opponents</button>
                </div>:<div className="muted" style={{fontSize:13}}>⚔️ Head-to-head against everyone</div>}
            </div>
            {weeks.length>1&&<WeekChips weeks={weeks} value={scope} onChange={s=>{setScope(s);setSel(null);}}
                extra={<button className={'chip'+(scope==='season'?' on':'')} onClick={()=>{setScope('season');setSel(null);}}>Season</button>}/>}

            <div className="card" style={{padding:'8px 4px 4px'}}>
                <div className="tap-hint" style={{justifyContent:'center',margin:'2px 0 0'}}>👆 Tap {mode==='partners'?'a partner to see your games together':'an opponent to see your games against them'}</div>
                <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',maxWidth:520,display:'block',margin:'0 auto',touchAction:'manipulation'}} role="img" aria-label={`${nameOf(me)}'s ${mode==='partners'?'partner':'opponent'} map`}>
                    {nodes.map(n=>{
                        const g=n.st?n.st.g:0,dim=sel&&sel!==n.id;
                        return<line key={'e'+n.id} x1={cx} y1={cy} x2={n.x} y2={n.y} stroke={webColor(n.st)} strokeWidth={g?Math.min(10,1.5+g*1.6):1.2}
                            strokeDasharray={g?null:'4 5'} strokeLinecap="round" opacity={dim?.15:g?.55:.6}/>;
                    })}
                    <g onClick={()=>setSel(null)} style={{cursor:'pointer'}}>
                        <circle cx={cx} cy={cy} r={42} fill="#0f172a" stroke="#34d399" strokeWidth="3"/>
                        <text x={cx} y={cy-4} textAnchor="middle" fill="white" fontSize="14" fontWeight="700" fontFamily="Outfit,sans-serif">{short(me)}</text>
                        <text x={cx} y={cy+14} textAnchor="middle" fill="#6ee7b7" fontSize="12" fontWeight="700" fontFamily="Outfit,sans-serif">{all.length?`${tot.w}-${tot.l}`:'no games'}</text>
                    </g>
                    {nodes.map(n=>{
                        const g=n.st?n.st.g:0,on=sel===n.id,dim=sel&&!on;
                        const lx=n.x+(n.r+8)*n.cos,ly=n.y+(n.r+8)*n.sin;
                        const anchor=Math.abs(n.cos)<.3?'middle':n.cos>0?'start':'end';
                        const dy=Math.abs(n.cos)<.3?(n.sin>0?12:-3):4;
                        return(
                            <g key={n.id} onClick={()=>setSel(on?null:n.id)} style={{cursor:'pointer',outline:'none'}} opacity={dim?.35:1}
                               role="button" tabIndex="0" onKeyDown={e=>{if(e.key==='Enter')setSel(on?null:n.id);}}>
                                <circle cx={n.x} cy={n.y} r={n.r+10} fill="transparent"/>
                                {on&&<circle cx={n.x} cy={n.y} r={n.r+5} fill="none" stroke="#0f172a" strokeWidth="2.5"/>}
                                <circle cx={n.x} cy={n.y} r={n.r} fill={g?webColor(n.st):'white'} stroke={g?'white':'#cbd5e1'} strokeWidth="2" strokeDasharray={g?null:'3 3'}/>
                                {g>0&&<text x={n.x} y={n.y+4} textAnchor="middle" fill="white" fontSize={n.r>18?12:10} fontWeight="800" fontFamily="Outfit,sans-serif">{n.st.w}-{n.st.l}</text>}
                                <text x={lx} y={ly+dy} textAnchor={anchor} fontSize="13" fontWeight={on?800:600} fill={g?'#0f172a':'#94a3b8'} fontFamily="Outfit,sans-serif">{short(n.id)}</text>
                            </g>
                        );
                    })}
                </svg>
                <div className="row" style={{justifyContent:'center',gap:12,fontSize:11,color:'#64748b',padding:'0 6px 8px',flexWrap:'wrap'}}>
                    <span><span style={{color:'#10b981'}}>●</span> {mode==='partners'?'win together':'you win'} 60%+</span>
                    <span><span style={{color:'#f59e0b'}}>●</span> even</span>
                    <span><span style={{color:'#ef4444'}}>●</span> {mode==='partners'?'lose together':'they win'} 60%+</span>
                    <span>◌ {mode==='partners'?'not partnered yet':'not faced yet'}</span>
                </div>
            </div>

            {sel?<div ref={detailRef} style={{scrollMarginTop:70}}><WebDetail league={league} me={me} other={sel} mode={mode} st={selSt} nameOf={nameOf}
                    onFocus={id=>{setMode('opps');setSel(id);}} onPartner={id=>{setMode('partners');setSel(id);}} onCenter={()=>pick(sel)} onClose={()=>setSel(null)}/></div>
            :<>
                {all.length>0&&<div className="grid2" style={{gridTemplateColumns:'repeat(3,minmax(0,1fr))',marginTop:12}}>
                    {hl.map(([k,x,sub])=>(
                        <button key={k} className="card" disabled={!x} onClick={()=>x&&setSel(x.id)} style={{padding:'10px 8px',textAlign:'center',border:'none',cursor:x?'pointer':'default',fontFamily:'Outfit,sans-serif',color:'#1e293b'}}>
                            <div style={{fontSize:11,fontWeight:700,color:'#64748b'}}>{k}</div>
                            <div style={{fontWeight:800,fontSize:15,margin:'3px 0',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{x?nameOf(x.id):'—'}</div>
                            <div style={{fontSize:11,color:'#64748b'}}>{x?sub(x):'not enough games'}</div>
                        </button>
                    ))}
                </div>}
                {notYet.length>0&&all.length>0&&<div className="muted" style={{fontSize:13,marginTop:10}}>Haven't partnered yet: {notYet.map(nameOf).join(', ')}</div>}
                {!all.length&&<div className="muted" style={{textAlign:'center',marginTop:12}}>The map fills in once {nameOf(me)}'s games are scored.</div>}
            </>}
        </div>
    );
}

function WebDetail({league,me,other,mode,st,nameOf,onFocus,onPartner,onCenter,onClose}){
    const weeks=league.weeks||[];
    const games=st?st.games:[];
    const isP=mode==='partners';
    const diff=st?st.pf-st.pa:0;
    // Partner view: who beat you two / who you beat. Opponent view: who you were paired with in losses / wins.
    const rot=fmtOf(league)==='rotating';
    const lostTo=isP?tally(games,'L',g=>g.opp):rot?tally(games,'L',g=>g.partner?[g.partner]:[]):[];
    const beat=isP?tally(games,'W',g=>g.opp):rot?tally(games,'W',g=>g.partner?[g.partner]:[]):[];
    const Chips=({items,color,bg,onTap})=>(
        <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
            {items.map(x=><button key={x.id} className="chip" onClick={()=>onTap(x.id)} style={{background:bg,borderColor:bg,color}}>{nameOf(x.id)}{x.n>1&&<b> ×{x.n}</b>}</button>)}
        </div>
    );
    return(
        <div className="card" style={{marginTop:12}}>
            <div className="row" style={{justifyContent:'space-between',marginBottom:10}}>
                <div style={{minWidth:0}}>
                    <div className="slbl" style={{marginBottom:2}}>{isP?'Partners':'Head to head'}</div>
                    <div className="fd" style={{fontSize:22,fontWeight:800,lineHeight:1.1}}>{nameOf(me)} {isP?'+':'vs'} {nameOf(other)}</div>
                </div>
                <button className="btn btn-ghost btn-sm" onClick={onClose} aria-label="Close">✕</button>
            </div>
            {!st?<div className="muted">{isP?'Haven\'t played together yet.':'Haven\'t faced each other yet.'}</div>:<>
                <div className="grid2" style={{gridTemplateColumns:'repeat(4,minmax(0,1fr))',marginBottom:12}}>
                    {[['W-L',`${st.w}-${st.l}`],['Win %',Math.round(pctOf(st)*100)+'%'],['Avg',(st.pf/st.g).toFixed(1)],['+/-',(diff>0?'+':'')+diff]].map(([k,v])=>(
                        <div key={k} style={{background:'#f8fafc',borderRadius:10,padding:'8px 4px',textAlign:'center'}}>
                            <div className="fd" style={{fontSize:22,fontWeight:800,color:k==='+/-'?(diff>0?'#059669':diff<0?'#dc2626':'#0f172a'):'#0f172a'}}>{v}</div>
                            <div style={{fontSize:11,color:'#64748b',fontWeight:700,textTransform:'uppercase'}}>{k}</div>
                        </div>))}
                </div>
                {lostTo.length>0&&<div style={{marginBottom:10}}>
                    <div className="slbl" style={{color:'#b91c1c'}}>{isP?'😖 Lost to':`😖 Your partner when you lost`}</div>
                    <Chips items={lostTo} color="#b91c1c" bg="#fef2f2" onTap={isP?onFocus:onPartner}/>
                </div>}
                {beat.length>0&&<div style={{marginBottom:10}}>
                    <div className="slbl" style={{color:'#047857'}}>{isP?'💪 Beat':`💪 Your partner when you won`}</div>
                    <Chips items={beat} color="#047857" bg="#ecfdf5" onTap={isP?onFocus:onPartner}/>
                </div>}
                <div className="slbl" style={{marginTop:6}}>Games</div>
                {games.map((g,i)=>(
                    <div key={i} className="pg-row">
                        <div style={{width:62,flexShrink:0}}>
                            <div style={{fontWeight:800,fontSize:13}}>{weeks.length>1?`${T.short} ${g.wi+1} · `:''}G{g.ri+1}</div>
                            <div style={{fontSize:11,color:'#64748b'}}>{fmtDate(g.date)}</div>
                        </div>
                        <div style={{flex:1,minWidth:0,fontSize:14,lineHeight:1.35}}>
                            {isP?<div>vs <b>{g.opp.map(nameOf).join(' & ')}</b></div>
                                :rot?<><div>with <b>{g.partner?nameOf(g.partner):'—'}</b></div>
                                   <div className="muted" style={{fontSize:13}}>vs {g.opp.map(nameOf).join(' & ')}</div></>
                                :<div>vs <b>{g.opp.map(nameOf).join(' & ')}</b></div>}
                        </div>
                        <div style={{fontWeight:800,fontSize:16,flexShrink:0}}>
                            <span style={{color:g.res==='W'?'#047857':'#0f172a'}}>{g.my}</span>–{g.their} <span className={'res '+(g.res==='W'?'w':g.res==='L'?'l':'p')}>{g.res}</span>
                        </div>
                    </div>
                ))}
                {(lostTo.length>0||beat.length>0)&&<div className="muted" style={{fontSize:12,marginTop:8}}>Tap a name above to jump to {isP?'that opponent':'that partner'}.</div>}
            </>}
            <button className="btn btn-out btn-sm" style={{marginTop:12,width:'100%'}} onClick={onCenter}>🕸️ Show {nameOf(other)}'s map</button>
        </div>
    );
}

// ── Players tab ───────────────────────────────────────────────────────
function PlayersTab({league,isOwner,update}){
    const [editing,setEditing]=useState(null);const [val,setVal]=useState('');
    const [newName,setNewName]=useState('');const [err,setErr]=useState('');
    const players=league.players;
    const partnerCounts=useMemo(()=>S.buildHistory(league.weeks).partner,[league.weeks]);
    const taken=(n,except)=>players.some(p=>p.id!==except&&p.name.trim().toLowerCase()===n.trim().toLowerCase());
    const save=id=>{
        const n=val.trim();
        if(!n){setErr('Name can\'t be empty.');return;}
        if(taken(n,id)){setErr(`"${n}" is already on the roster.`);return;}
        update({players:players.map(p=>p.id===id?{...p,name:n}:p)});setEditing(null);setErr('');
    };
    const add=()=>{
        const n=newName.trim();if(!n)return;
        if(taken(n)){setErr(`"${n}" is already on the roster.`);return;}
        update({players:[...players,{id:uid6(),name:n,active:true}]});setNewName('');setErr('');
    };
    const toggle=p=>update({players:players.map(x=>x.id===p.id?{...x,active:x.active===false}:x)});
    const partnersOf=id=>{
        if(fmtOf(league)!=='rotating')return null;
        const others=players.filter(p=>p.id!==id&&p.active!==false);
        const played=others.filter(o=>partnerCounts[S._key(id,o.id)]).length;
        return{played,of:others.length};
    };
    return(
        <div>
            {fmtOf(league)==='fixed'&&<TeamsCard league={league} update={update} isOwner={isOwner}/>}
            <div className="card" style={{padding:0,overflow:'hidden'}}>
                {players.map((p,i)=>{const pc=partnersOf(p.id);return(
                    <div key={p.id} style={{display:'flex',alignItems:'center',gap:10,padding:'11px 14px',borderBottom:i<players.length-1?'1px solid #f1f5f9':'none',opacity:p.active===false?.5:1}}>
                        <div style={{width:30,height:30,borderRadius:'50%',background:'#ecfdf5',color:'#047857',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:13,flexShrink:0}}>{p.name.slice(0,1).toUpperCase()}</div>
                        {editing===p.id?(
                            <>
                                <input className="inp" style={{padding:'8px 10px'}} autoFocus value={val} onChange={e=>setVal(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')save(p.id);if(e.key==='Escape')setEditing(null);}}/>
                                <button className="btn btn-g btn-sm" onClick={()=>save(p.id)}>Save</button>
                                <button className="btn btn-ghost btn-sm" onClick={()=>{setEditing(null);setErr('');}}>✕</button>
                            </>
                        ):(
                            <>
                                <div style={{flex:1,minWidth:0}}>
                                    <div style={{fontWeight:600}}>{p.name}{p.active===false&&<span className="muted" style={{fontSize:12}}> · inactive</span>}</div>
                                    {pc&&(league.weeks||[]).length>0&&p.active!==false&&<div className="muted" style={{fontSize:12}}>{pc.played}/{pc.of} partners so far</div>}
                                    {fmtOf(league)==='fixed'&&<div className="muted" style={{fontSize:12}}>{teamOfPlayer(league,p.id)?'Team: '+teamName(league,teamOfPlayer(league,p.id)):'No team'}</div>}
                                </div>
                                {isOwner&&<button className="btn btn-ghost btn-sm" onClick={()=>{setEditing(p.id);setVal(p.name);setErr('');}}>✏️ Rename</button>}
                                {/* rename keeps the player's id, so all past games follow the new name */}
                                {isOwner&&<button className="btn btn-ghost btn-sm" onClick={()=>toggle(p)} title={p.active===false?'Bring back':'Remove from roster (keeps history)'}>{p.active===false?'↩︎':'🚫'}</button>}
                            </>
                        )}
                    </div>
                );})}
            </div>
            {err&&<div className="err" style={{marginTop:10}}>{err}</div>}
            {isOwner&&fmtOf(league)!=='fixed'&&<div className="row" style={{marginTop:12}}>
                <input className="inp" placeholder="Add a player or sub" value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')add();}}/>
                <button className="btn btn-g" onClick={add} style={{flexShrink:0}}>Add</button>
            </div>}
            <div className="muted" style={{fontSize:12,marginTop:8,lineHeight:1.5}}>
                Renaming updates every past schedule and the leaderboard. 🚫 takes someone off the roster without erasing their scores. Who plays each {T.lower} is picked when you make the schedule.
            </div>
        </div>
    );
}

// ── Teams (fixed-partner doubles) ─────────────────────────────────────
function TeamsCard({league,update,isOwner}){
    const teams=league.teams||[];
    const [a,setA]=useState('');const [b,setB]=useState('');const [err,setErr]=useState('');
    const add=async()=>{const r=await addTeam(league,update,a,b);if(r.error){setErr(r.error);return;}setA('');setB('');setErr('');};
    const toggle=t=>update({teams:teams.map(x=>x.id===t.id?{...x,active:x.active===false}:x)});
    return(
        <div className="card" style={{marginBottom:12,padding:0,overflow:'hidden'}}>
            <div className="slbl" style={{padding:'14px 14px 2px'}}>Teams ({teams.filter(t=>t.active!==false).length})</div>
            {teams.map((t,i)=>(
                <div key={t.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderBottom:'1px solid #f1f5f9',opacity:t.active===false?.5:1}}>
                    <div className="fd" style={{width:30,height:30,borderRadius:'50%',background:'#ecfdf5',color:'#047857',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:15,flexShrink:0}}>{i+1}</div>
                    <div style={{flex:1,minWidth:0,fontWeight:600}}>{teamName(league,t)}{t.active===false&&<span className="muted" style={{fontSize:12}}> · inactive</span>}</div>
                    {isOwner&&<button className="btn btn-ghost btn-sm" onClick={()=>toggle(t)} title={t.active===false?'Bring back':'Remove (keeps history)'}>{t.active===false?'↩︎':'🚫'}</button>}
                </div>
            ))}
            {isOwner&&<div style={{padding:12}}>
                <div className="row">
                    <input className="inp" style={{padding:'9px 12px'}} placeholder="Player" value={a} onChange={e=>setA(e.target.value)}/>
                    <span style={{color:'#94a3b8',fontWeight:700}}>&</span>
                    <input className="inp" style={{padding:'9px 12px'}} placeholder="Partner" value={b} onChange={e=>setB(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')add();}}/>
                    <button className="btn btn-g btn-sm" onClick={add} style={{flexShrink:0}}>Add</button>
                </div>
                {err&&<div className="err" style={{marginTop:8}}>{err}</div>}
            </div>}
            <div className="muted" style={{fontSize:12,padding:'0 14px 12px'}}>Rename a player below and their team name updates everywhere.</div>
        </div>
    );
}

// ── Settings tab ──────────────────────────────────────────────────────
function SettingsTab({league,update,onDeleted,isOwner}){
    const [name,setName]=useState(league.name);
    const [courts,setCourts]=useState((league.defaultCourts||[]).join(', '));
    const [rounds,setRounds]=useState(league.defaultRounds||8);
    const [saved,setSaved]=useState(false);
    const save=async()=>{await update({name:name.trim()||league.name,defaultCourts:parseCourts(courts),defaultRounds:rounds});setSaved(true);setTimeout(()=>setSaved(false),1800);};
    const mode=!league.isPublic?'private':league.publicMode==='edit'?'edit':'read';
    const setMode=m=>update(m==='private'?{isPublic:false}:{isPublic:true,publicMode:m});
    return(
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
            <div className="card">
                <label className="slbl">{kindOf(league)==='tournament'?'Tournament':'League'} name</label>
                <input className="inp" value={name} onChange={e=>setName(e.target.value)}/>
                <div className="grid2" style={{marginTop:12}}>
                    <div><label className="slbl">Usual courts</label><input className="inp" value={courts} onChange={e=>setCourts(e.target.value)}/></div>
                    <div><label className="slbl">Games per {T.night}</label><Stepper value={rounds} min={1} max={MAX_GAMES} onChange={setRounds}/></div>
                </div>
                <button className="btn btn-g" style={{marginTop:14}} onClick={save}>{saved?'✓ Saved':'Save'}</button>
            </div>
            <ScoringCard league={league} update={update}/>
            <div className="card">
                <label className="slbl">Who can see the shared link</label>
                <div style={{display:'flex',flexDirection:'column',gap:8}}>
                    {[['private','🔒 Only me and admins'],['read','👀 Anyone with the link can view'],['edit','✏️ Anyone with the link can view and enter scores']].map(([k,l])=>(
                        <label key={k} className="check" style={{background:mode===k?'#ecfdf5':'#f8fafc',borderColor:mode===k?'#6ee7b7':'#e2e8f0'}}>
                            <input type="radio" checked={mode===k} onChange={()=>setMode(k)}/><span style={{whiteSpace:'normal'}}>{l}</span>
                        </label>
                    ))}
                </div>
                <div className="muted" style={{fontSize:12,marginTop:8}}>"Enter scores" lets players fill in their own games from their phones on the night. They can't change the schedule or roster.</div>
            </div>
            <AdminsCard league={league} update={update} isOwner={isOwner}/>
            {isOwner&&<div className="card">
                <label className="slbl">Danger zone</label>
                <button className="btn btn-red" onClick={async()=>{if(confirm(`Delete "${league.name}" and all its ${T.lower}s and scores? This can't be undone.`)){await store.remove(league);onDeleted();}}}>Delete {kindOf(league)==='tournament'?'tournament':'league'}</button>
            </div>}
        </div>
    );
}

function AdminsCard({league,update,isOwner}){
    const [email,setEmail]=useState('');const [err,setErr]=useState('');const [copied,setCopied]=useState(false);
    const list=league.adminEmails||[];
    const add=()=>{
        const e=lc(email);
        if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){setErr('Enter a valid email address.');return;}
        if(list.includes(e)){setErr('Already an admin.');return;}
        update({adminEmails:[...list,e]});setEmail('');setErr('');
    };
    const url=`${location.origin}${location.pathname}?id=${league.id}`;
    const invite=`You're an admin of "${league.name}" on PickleConnect. Open ${url} and log in (or create an account) with the email I added — then you can schedule weeks, change players and enter scores.`;
    const copy=async()=>{try{await navigator.clipboard.writeText(invite);setCopied(true);setTimeout(()=>setCopied(false),2000);}catch(e){prompt('Copy this invite',invite);}};
    return(
        <div className="card">
            <label className="slbl">Admins</label>
            <div className="muted" style={{fontSize:13,marginBottom:10}}>
                {isOwner?'Admins log in with their own account and can schedule weeks, change players, enter scores and edit settings. Only you can manage admins or delete the league.'
                        :'You\'re an admin of this league. Only the league owner can add or remove admins.'}
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
                <div className="check" style={{cursor:'default',justifyContent:'space-between'}}><span>{league.ownerName||'Owner'} <span className="muted" style={{fontSize:12}}>· owner</span></span></div>
                {list.map(e=>(
                    <div key={e} className="check" style={{cursor:'default',justifyContent:'space-between'}}>
                        <span>{e}</span>
                        {isOwner&&<button className="btn btn-red btn-sm" onClick={()=>{if(confirm(`Remove ${e} as admin?`))update({adminEmails:list.filter(x=>x!==e)});}}>Remove</button>}
                    </div>
                ))}
            </div>
            {isOwner&&<>
                <div className="row" style={{marginTop:10}}>
                    <input className="inp" type="email" placeholder="admin@example.com" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')add();}}/>
                    <button className="btn btn-g" onClick={add} style={{flexShrink:0}}>Add</button>
                </div>
                {err&&<div className="err" style={{marginTop:8}}>{err}</div>}
                {list.length>0&&<button className="btn btn-out btn-sm" style={{marginTop:10}} onClick={copy}>{copied?'✓ Invite copied':'📋 Copy invite message'}</button>}
            </>}
        </div>
    );
}

function ScoringCard({league,update}){
    const sc=scoringOf(league);
    const set=patch=>update({scoring:{...sc,...patch}});
    return(
        <div className="card">
            <label className="slbl">Scoring</label>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
                {[['capped',`Overtime counts as ${sc.gameTo} minus the margin (recommended)`,`15–13 counts as ${sc.gameTo}–${sc.gameTo-2}, so long games don't give bonus points`],
                  ['raw','Count the actual score','15–13 counts as 15–13']].map(([k,l,d])=>(
                    <label key={k} className="check" style={{alignItems:'flex-start',background:sc.mode===k?'#ecfdf5':'#f8fafc',borderColor:sc.mode===k?'#6ee7b7':'#e2e8f0'}}>
                        <input type="radio" checked={sc.mode===k} onChange={()=>set({mode:k})} style={{marginTop:3}}/>
                        <span style={{whiteSpace:'normal'}}><b style={{fontWeight:600}}>{l}</b><br/><span className="muted" style={{fontSize:12}}>{d}</span></span>
                    </label>
                ))}
            </div>
            <div className="grid2" style={{marginTop:12}}>
                <div>
                    <label className="slbl">Games to</label>
                    <div className="row">{[11,15,21].map(n=><button key={n} className={'chip'+(sc.gameTo===n?' on':'')} onClick={()=>set({gameTo:n})}>{n}</button>)}</div>
                </div>
                {kindOf(league)==='league'&&<div>
                    <label className="slbl">Season: min % of games</label>
                    <Stepper value={sc.minPct} min={0} max={100} step={10} onChange={v=>set({minPct:v})}/>
                </div>}
            </div>
            {kindOf(league)==='league'&&<div className="muted" style={{fontSize:12,marginTop:8}}>Players under the minimum still show on the season board, but at the bottom and unranked. Set to 0 to turn this off.</div>}
        </div>
    );
}

// ── Small components ──────────────────────────────────────────────────
function Modal({title,onClose,children}){
    useEffect(()=>{const f=e=>{if(e.key==='Escape')onClose();};window.addEventListener('keydown',f);return()=>window.removeEventListener('keydown',f);},[]);
    return(
        <div className="modal-bg" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
            <div className="modal">
                <div className="row" style={{justifyContent:'space-between',marginBottom:14}}>
                    <div className="fd" style={{fontSize:24,fontWeight:800}}>{title.toUpperCase()}</div>
                    <button onClick={onClose} style={{background:'#f1f5f9',border:'none',borderRadius:8,width:34,height:34,fontSize:18,cursor:'pointer'}}>✕</button>
                </div>
                {children}
            </div>
        </div>
    );
}
function Stepper({value,min,max,onChange,step=1}){
    return(
        <div className="stepper">
            <button type="button" onClick={()=>onChange(Math.max(min,value-step))}>−</button>
            <span>{value}</span>
            <button type="button" onClick={()=>onChange(Math.min(max,value+step))}>+</button>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
