.input::placeholder{color:var(--ink-3);}
.pill{font-family:"JetBrains Mono",monospace;font-size:11px;padding:.4rem .75rem;border-radius:8px;border:1px solid var(--rule);color:var(--ink-2);background:var(--bg-3);cursor:pointer;transition:all .15s;white-space:nowrap;}

.archive-badge{display:inline-flex;align-items:center;gap:6px;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--teal);border:1px solid var(--teal);padding:.5rem .9rem;border-radius:8px;}
.nav-link{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);padding:.4rem .7rem;border-radius:6px;transition:all .15s;text-decoration:none;}
.nav-link:hover{color:var(--ink);background:var(--bg-3);}
.nav-link.active{color:var(--accent);background:rgba(212,168,72,.1);}
.year-tab{font-family:"JetBrains Mono",monospace;font-size:12px;padding:.5rem .85rem;border-radius:8px;border:1px solid var(--rule);color:var(--ink-3);background:transparent;cursor:pointer;transition:all .15s;white-space:nowrap;}

var ResponsiveContainer=RC.ResponsiveContainer,BarChart=RC.BarChart,Bar=RC.Bar,XAxis=RC.XAxis,YAxis=RC.YAxis,Tooltip=RC.Tooltip,Cell=RC.Cell;
var hasRecharts=!!(ResponsiveContainer&&BarChart);
var TOTAL_SEATS=234,MAJORITY=118;

var PARTY_COLORS={
  "DMK":"#C8352F","AIADMK":"#1F7A1F","ADMK":"#1F7A1F","BJP":"#FF7E00",
  "INC":"#1A8FE3","INC(I)":"#2196F3","INC(O)":"#0D73B8","VCK":"#0066B3",
  "CPI":"#B71C1C","CPI(M)":"#E53935","PMK":"#E8B423","MDMK":"#9C27B0",
  "TMC":"#00796B","DMDK":"#FF6F00","IUML":"#2E7D32","JNP":"#5C6BC0","IND":"#6E7A87",
};
function pc(p){return PARTY_COLORS[p]||"#6E7A87";}
function ordinal(n){var s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}

function allianceSummary(year,alliances){
  var totals=PARTY_TOTALS[year]||{};
  var counts={};
  alliances.forEach(function(a){counts[a.id]=0;});
  Object.entries(totals).forEach(function(kv){
    var party=kv[0],seats=kv[1];
    var found=false;
    for(var i=0;i<alliances.length;i++){
      if(alliances[i].parties.includes(party)){counts[alliances[i].id]=(counts[alliances[i].id]||0)+seats;found=true;break;}
    }
    if(!found) counts["others"]=(counts["others"]||0)+seats;
  });
  return alliances.map(function(a){return Object.assign({},a,{won:counts[a.id]||0});});
}

    <div className="border-b border-[var(--rule)] bg-[var(--bg)] sticky top-0 z-40">

          <div className="mt-4 text-[var(--ink-2)] text-base leading-relaxed max-w-xl">{meta.verdict}</div>

              <div key={a.id} className="flex items-center gap-2">
                <div className="w-3 h-3 rounded-sm" style={{background:a.color}}></div>
                <span className="mono text-[12px] text-[var(--ink-2)]">{a.name}</span>
                <span className="mono text-[14px] font-bold num">{a.won}</span>

// ── ALLIANCE TILES ────────────────────────────────────────────────
function AllianceTiles({year,alliances}){
  var summary=useMemo(function(){return allianceSummary(year,alliances);},[year,alliances]);
  var sorted=summary.filter(function(a){return a.won>0;}).sort(function(a,b){return b.won-a.won;});
  var totalSeats=Object.values(PARTY_TOTALS[year]||{}).reduce(function(s,v){return s+v;},0);
  return (
    <div className={"grid gap-4 grid-cols-2 md:grid-cols-"+Math.min(sorted.length,4)}>
      {sorted.map(function(a){
        var pct=totalSeats>0?((a.won/totalSeats)*100).toFixed(1):"—";
        var partyCounts=PARTY_TOTALS[year]||{};
        var relevantParties=a.parties.filter(function(p){return partyCounts[p]>0;});
        return (
          <div key={a.id} className="alli-tile">
            <div className="mono text-[9px] tracking-[.2em] uppercase mb-2" style={{color:a.color}}>{a.name}</div>
            <div className="num-big num" style={{color:a.color}}>{a.won}</div>
            <div className="mono text-[10px] text-[var(--ink-3)] mt-1">seats · {pct}%</div>
            <div className="mt-3 space-y-1">
              {relevantParties.slice(0,4).map(function(p){var cnt=partyCounts[p]||0;if(!cnt)return null;return(
                <div key={p} className="flex items-center gap-2">
                  <div className="w-2 h-2 rounded-sm" style={{background:pc(p)}}></div>
                  <span className="mono text-[10px] text-[var(--ink-3)]">{p}</span>
                  <span className="mono text-[11px] font-bold ml-auto num">{cnt}</span>
                </div>
              );})}
            </div>
            <div className="absolute right-0 top-0 bottom-0 w-1 rounded-r-[14px]" style={{background:a.color+"44"}}></div>
          </div>
        );
      })}
    </div>
  );
}

// ── MARGIN DONUT ──────────────────────────────────────────────────
function MarginDonut({data}){
  var validData=data.filter(function(c){return c.winner&&c.winner!=="—";});
  var buckets=useMemo(function(){
    var bs=[{label:"< 1%",min:0,max:1,count:0,color:"#E76F51"},{label:"1–5%",min:1,max:5,count:0,color:"#D4A848"},{label:"5–15%",min:5,max:15,count:0,color:"#4ABFB0"},{label:"15–25%",min:15,max:25,count:0,color:"#1A8FE3"},{label:">25%",min:25,max:100,count:0,color:"#9D2F2F"}];
    validData.forEach(function(c){
      var pct=parseFloat((c.marginPct||"0").replace('%',''))||0;
      for(var i=0;i<bs.length;i++){if(pct>=bs[i].min&&pct<bs[i].max){bs[i].count++;break;}}
    });
    return bs;
  },[validData]);
  var total=buckets.reduce(function(s,b){return s+b.count;},0);
  if(!total) return <div className="text-[var(--ink-3)] mono text-sm">No margin data</div>;
  var cx=100,cy=100,r=70,inner=42,angle=-Math.PI/2;
  var segs=buckets.map(function(b){
    var sweep=(b.count/total)*2*Math.PI,end=angle+sweep;
    var x1=cx+r*Math.cos(angle),y1=cy+r*Math.sin(angle),x2=cx+r*Math.cos(end),y2=cy+r*Math.sin(end);
    var ix1=cx+inner*Math.cos(end),iy1=cy+inner*Math.sin(end),ix2=cx+inner*Math.cos(angle),iy2=cy+inner*Math.sin(angle);
    var large=sweep>Math.PI?1:0;
    var d=["M",x1,y1,"A",r,r,0,large,1,x2,y2,"L",ix1,iy1,"A",inner,inner,0,large,0,ix2,iy2,"Z"].join(" ");
    angle=end;
    return{d,color:b.color,label:b.label,count:b.count};
  });
  return(
    <div className="flex flex-col md:flex-row items-center gap-6">
      <svg viewBox="0 0 200 200" className="w-44 h-44 flex-shrink-0">
        {segs.map(function(s,i){return <path key={i} d={s.d} fill={s.color} className="donut-segment"/>;}) }
        <text x={cx} y={cy-6} textAnchor="middle" fill="#F0E9D6" fontSize="22" fontFamily="Fraunces,serif" fontWeight="700">{total}</text>
        <text x={cx} y={cy+12} textAnchor="middle" fill="#A8B0BA" fontSize="9" fontFamily="JetBrains Mono,monospace">SEATS</text>
      </svg>
      <div className="space-y-2 flex-1">
        {buckets.map(function(b){var pct=total>0?((b.count/total)*100).toFixed(1):0;return(
          <div key={b.label} className="flex items-center gap-3">
            <div className="w-3 h-3 rounded-sm flex-shrink-0" style={{background:b.color}}></div>
            <div className="mono text-[11px] text-[var(--ink-2)] w-16">{b.label}</div>
            <div className="flex-1 h-5 rounded bg-[var(--bg-3)] overflow-hidden"><div style={{width:pct+"%",background:b.color,height:"100%"}}></div></div>
            <div className="mono text-[11px] font-bold num w-8 text-right">{b.count}</div>
            <div className="mono text-[10px] text-[var(--ink-3)] w-10">{pct}%</div>
          </div>
        );})}
      </div>
    </div>
  );
}

// ── DISTRICT CHART ────────────────────────────────────────────────
function DistrictChart({data}){
  var validData=data.filter(function(c){return c.winner&&c.winner!=="—"&&c.district&&c.district!=="—";});
  var ds=useMemo(function(){
    var m={};
    validData.forEach(function(c){
      if(!m[c.district])m[c.district]={name:c.district,parties:{}};
      m[c.district].parties[c.party]=(m[c.district].parties[c.party]||0)+1;
    });
    return Object.values(m).sort(function(a,b){
      var ta=Object.values(a.parties).reduce(function(s,v){return s+v;},0);
      var tb=Object.values(b.parties).reduce(function(s,v){return s+v;},0);
      return tb-ta;
    });
  },[validData]);
  var allParties=useMemo(function(){
    var ps={};validData.forEach(function(c){ps[c.party]=(ps[c.party]||0)+1;});
    return Object.keys(ps).sort(function(a,b){return ps[b]-ps[a];}).slice(0,8);
  },[validData]);
  if(!hasRecharts){return(
    <div className="space-y-2">{ds.map(function(d){var tot=Object.values(d.parties).reduce(function(s,v){return s+v;},0);return(
      <div key={d.name} className="flex items-center gap-3">
        <div className="w-28 text-right mono text-[11px] text-[var(--ink-2)] truncate">{d.name}</div>
        <div className="flex-1 h-5 flex rounded overflow-hidden bg-[var(--bg-3)]">
          {Object.entries(d.parties).sort(function(a,b){return b[1]-a[1];}).map(function(pv){return <div key={pv[0]} style={{width:(pv[1]/tot*100)+"%",background:pc(pv[0]),height:"100%"}} title={pv[0]+":"+pv[1]}></div>;})}
        </div>
        <div className="mono text-[10px] text-[var(--ink-3)] num w-4">{tot}</div>
      </div>
    );})}
    </div>
  );}
  var chartData=ds.map(function(d){var row={name:d.name};Object.assign(row,d.parties);return row;});
  return(
    <div style={{width:"100%",height:Math.max(360,ds.length*22+60)}}>
      <ResponsiveContainer>
        <BarChart data={chartData} layout="vertical" margin={{top:4,right:10,bottom:4,left:8}}>
          <XAxis type="number" stroke="#6E7A87" fontSize={10} tick={{fill:"#A8B0BA"}}/>
          <YAxis type="category" dataKey="name" stroke="#6E7A87" fontSize={10} tick={{fill:"#F0E9D6"}} width={105}/>
          <Tooltip contentStyle={{background:"#0E1A24",border:"1px solid #283D4F",borderRadius:8,color:"#F0E9D6",fontSize:11,fontFamily:"JetBrains Mono"}}/>
          {allParties.map(function(p){return <Bar key={p} dataKey={p} stackId="a" fill={pc(p)}/>;}) }
        </BarChart>
      </ResponsiveContainer>
    </div>
  );
}

// ── CONSTITUENCY TABLE ────────────────────────────────────────────
function ConstituencyTable({data,year}){
  var s1=useState(""); var q=s1[0]; var setQ=s1[1];
  var s2=useState("all"); var fp=s2[0]; var setFp=s2[1];
  var s3=useState("no"); var sortBy=s3[0]; var setSortBy=s3[1];
  var s4=useState(1); var sortDir=s4[0]; var setSortDir=s4[1];

  useEffect(function(){setFp("all");setQ("");},[year]);

  var validData=useMemo(function(){ return data; },[data]);

  var parties=useMemo(function(){
    var ps={};validData.forEach(function(c){ps[c.party]=(ps[c.party]||0)+1;});
    return Object.keys(ps).sort(function(a,b){return ps[b]-ps[a];});
  },[validData]);

  var filtered=useMemo(function(){
    var rows=validData.slice();
    if(q){var lq=q.toLowerCase();rows=rows.filter(function(c){return c.name.toLowerCase().includes(lq)||c.winner.toLowerCase().includes(lq)||(c.district||"").toLowerCase().includes(lq)||c.party.toLowerCase().includes(lq);});}
    if(fp!=="all")rows=rows.filter(function(c){return c.party===fp;});
    rows.sort(function(a,b){
      var va,vb;
      if(sortBy==="no"){va=a.no;vb=b.no;}
      else if(sortBy==="margin"){va=a.margin||0;vb=b.margin||0;}
      else if(sortBy==="votes"){va=a.votes||0;vb=b.votes||0;}
      else if(sortBy==="poll"){va=parseFloat((a.pollPct||"0").replace(" %","").replace("%",""))||0;vb=parseFloat((b.pollPct||"0").replace(" %","").replace("%",""))||0;}
      else{va=a.name;vb=b.name;return sortDir*va.localeCompare(vb);}
      return sortDir*(va-vb);
    });
    return rows;
  },[validData,q,fp,sortBy,sortDir]);

  function toggleSort(col){if(sortBy===col)setSortDir(function(d){return -d;});else{setSortBy(col);setSortDir(-1);}}
  function SI({col}){if(sortBy!==col)return <span className="opacity-30">↕</span>;return <span style={{color:"var(--accent)"}}>{sortDir===1?"↑":"↓"}</span>;}



  return (
    <div>
      <div className="flex flex-col md:flex-row gap-3 mb-5">
        <input className="input flex-1" placeholder="Search constituency, winner, party, district…" value={q} onChange={function(e){setQ(e.target.value);}}/>
        <div className="flex flex-wrap gap-2">
          <button onClick={function(){setFp("all");}} className={"pill"+(fp==="all"?" active":"")}>All</button>
          {parties.map(function(p){return <button key={p} onClick={function(){setFp(p);}} className={"pill"+(fp===p?" active":"")} style={fp===p?{}:{borderLeftColor:pc(p),borderLeftWidth:2}}>{p}</button>;})}
        </div>
      </div>
      <div className="flex items-center gap-3 mb-3 flex-wrap">
        <span className="mono text-[10px] text-[var(--ink-3)]">{filtered.length} of {validData.length} constituencies</span>

      </div>
      <div className="overflow-x-auto rounded-xl border border-[var(--rule)]">
        <table className="w-full text-sm">
          <thead>
            <tr className="bg-[var(--bg-3)]">
              {[["#","no"],["Constituency","name"],["District",""],["Winner",""],["Party",""],["Margin","margin"],["Votes","votes"],["Turnout","poll"]].map(function(h){return(
                <th key={h[0]} onClick={h[1]?function(){toggleSort(h[1]);}:undefined}
                  className={"px-3 py-3 text-left mono text-[10px] tracking-[.1em] uppercase text-[var(--ink-3)]"+(h[1]?" cursor-pointer hover:text-[var(--ink)]":"")}>{h[0]} {h[1]&&<SI col={h[1]}/>}</th>
              );})}
            </tr>
          </thead>
          <tbody>
            {filtered.map(function(c){return(
              <tr key={c.no} style={{borderTop:"1px solid var(--rule)"}}>
                <td className="px-3 py-3 mono text-[11px] text-[var(--ink-3)] num">{c.no}</td>
                <td className="px-3 py-3 font-semibold text-[var(--ink)]">
                  {c.name}
                  {c.type!=="GEN"&&<span className="ml-1 mono text-[9px] text-[var(--ink-3)]">{c.type}</span>}
                </td>
                <td className="px-3 py-3 text-[var(--ink-2)] text-[13px]">{c.district||"—"}</td>
                <td className="px-3 py-3 text-[var(--ink)] text-[13px]">{c.winner}</td>
                <td className="px-3 py-3">
                  <span className="mono text-[11px] font-bold px-2 py-1 rounded" style={{background:pc(c.party)+"22",color:pc(c.party)}}>{c.party}</span>
                </td>
                <td className="px-3 py-3 mono text-[12px] num text-right">
                  {c.margin>0?<><span>{c.margin.toLocaleString("en-IN")}</span><span className="text-[var(--ink-3)] text-[10px] ml-1">({c.marginPct})</span></>:"—"}
                </td>
                <td className="px-3 py-3 mono text-[12px] num text-right text-[var(--ink-2)]">{c.votes>0?c.votes.toLocaleString("en-IN"):"—"}</td>
                <td className="px-3 py-3 mono text-[12px] num text-right text-[var(--ink-2)]">{c.pollPct||"—"}</td>
              </tr>
            );})}
          </tbody>
        </table>
      </div>
    </div>
  );
}


// ── GLOBAL SEARCH ────────────────────────────────────────────────
function GlobalSearch(){
  var s1=useState(""); var q=s1[0]; var setQ=s1[1];
  var inputRef=useRef(null);

  var results=useMemo(function(){
    var lq=q.toLowerCase().trim();
    if(lq.length<2) return [];
    var out=[];
    ELECTION_YEARS.forEach(function(year){
      (ALL_DATA[year]||[]).forEach(function(c){
        if(!c.winner||c.winner==="—") return;
        if(
          c.winner.toLowerCase().includes(lq)||
          c.name.toLowerCase().includes(lq)||
          (c.district||"").toLowerCase().includes(lq)||
          c.party.toLowerCase().includes(lq)||
          (c.partyFull||"").toLowerCase().includes(lq)
        ){
          out.push(Object.assign({},c,{year:year}));
        }
      });
    });
    out.sort(function(a,b){ return b.year-a.year||a.no-b.no; });
    return out;
  },[q]);

  function hl(text){
    if(!text) return text;
    var lq=q.trim();
    var idx=text.toLowerCase().indexOf(lq.toLowerCase());
    if(idx<0) return text;
    return React.createElement(React.Fragment,null,
      text.slice(0,idx),
      React.createElement("mark",{style:{background:"rgba(212,168,72,.35)",color:"var(--ink)",borderRadius:2,padding:"0 1px"}},text.slice(idx,idx+lq.length)),
      text.slice(idx+lq.length)
    );
  }

  return (
    <div style={{borderBottom:"1px solid var(--rule)",background:"var(--bg-2)"}}>
      <div className="max-w-7xl mx-auto px-5 md:px-8 py-5">
        <div className="mono text-[10px] tracking-[.2em] text-[var(--teal)] uppercase mb-3">Global Search · All 12 Elections</div>
        <div style={{position:"relative",maxWidth:560}}>
          <input
            ref={inputRef}
            className="input"
            style={{paddingLeft:36,fontSize:15}}
            placeholder="Search winner, constituency, party, district across all years…"
            value={q}
            onChange={function(e){setQ(e.target.value);}}
          />
          <span style={{position:"absolute",left:11,top:"50%",transform:"translateY(-50%)",color:"var(--ink-3)",fontSize:15,pointerEvents:"none"}}>⌕</span>
          {q&&<button onClick={function(){setQ("");inputRef.current&&inputRef.current.focus();}} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"var(--ink-3)",cursor:"pointer",fontSize:16,lineHeight:1}}>✕</button>}
        </div>
        {q.trim().length>=2&&(
          <div style={{marginTop:16}}>
            <div className="mono text-[10px] text-[var(--ink-3)] mb-3">
              {results.length===0?"No results":results.length+" result"+(results.length!==1?"s":"")+" across all years"}
            </div>
            {results.length>0&&(
              <div className="overflow-x-auto rounded-xl border border-[var(--rule)]">
                <table className="w-full text-sm">
                  <thead>
                    <tr className="bg-[var(--bg-3)]">
                      {["Year","#","Constituency","District","Winner","Party","Margin","Votes","Turnout"].map(function(h){
                        return <th key={h} className="px-3 py-2.5 text-left mono text-[10px] tracking-[.1em] uppercase text-[var(--ink-3)]">{h}</th>;
                      })}
                    </tr>
                  </thead>
                  <tbody>
                    {results.map(function(c){return(
                      <tr key={c.year+"-"+c.no} style={{borderTop:"1px solid var(--rule)"}}>
                        <td className="px-3 py-2.5 mono font-bold num" style={{color:"var(--accent)"}}>{c.year}</td>
                        <td className="px-3 py-2.5 mono text-[11px] num" style={{color:"var(--ink-3)"}}>{c.no}</td>
                        <td className="px-3 py-2.5 font-semibold" style={{color:"var(--ink)"}}>
                          {hl(c.name)}
                          {c.type!=="GEN"&&<span className="ml-1 mono text-[9px]" style={{color:"var(--ink-3)"}}>{c.type}</span>}
                        </td>
                        <td className="px-3 py-2.5 text-[13px]" style={{color:"var(--ink-2)"}}>{c.district||"—"}</td>
                        <td className="px-3 py-2.5 text-[13px]" style={{color:"var(--ink)"}}>{hl(c.winner)}</td>
                        <td className="px-3 py-2.5">
                          <span className="mono text-[11px] font-bold px-2 py-0.5 rounded" style={{background:pc(c.party)+"22",color:pc(c.party)}}>{c.party}</span>
                        </td>
                        <td className="px-3 py-2.5 mono text-[12px] num text-right">
                          {c.margin>0?<><span>{c.margin.toLocaleString("en-IN")}</span><span className="text-[10px] ml-1" style={{color:"var(--ink-3)"}}>({c.marginPct})</span></>:"—"}
                        </td>
                        <td className="px-3 py-2.5 mono text-[12px] num text-right" style={{color:"var(--ink-2)"}}>{c.votes>0?c.votes.toLocaleString("en-IN"):"—"}</td>
                        <td className="px-3 py-2.5 mono text-[12px] num text-right" style={{color:"var(--ink-2)"}}>{c.pollPct||"—"}</td>
                      </tr>
                    );})}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────

              <div className="mono text-[10px] tracking-[.22em] text-[var(--ink-3)] uppercase">Historical Comparison</div>

            </div>
            <CrossYearChart/>

        <section className="max-w-7xl mx-auto px-5 md:px-8 pb-12">
          <div className="card p-6 md:p-8">
            <div className="mb-5">
              <div className="mono text-[10px] tracking-[.22em] text-[var(--ink-3)] uppercase">All Constituencies · {year}</div>

try{ReactDOM.createRoot(document.getElementById("root")).render(<App/>);}
