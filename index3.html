<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PickleConnect - Balanced Tournament</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-4">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        function TournamentApp() {
            const [playerCount, setPlayerCount] = useState(15);
            const [courtCount, setCourtCount] = useState(3);
            const [roundCount, setRoundCount] = useState(10);
            const [data, setData] = useState({ schedule: [], stats: {} });

            const generateSchedule = () => {
                let players = Array.from({ length: playerCount }, (_, i) => `P${i + 1}`);
                let circle = [...players];
                
                // For Odd numbers, add a "Ghost". Whoever pairs with Ghost sits out.
                if (circle.length % 2 !== 0) circle.push("GHOST");
                
                const n = circle.length;
                const schedule = [];
                const stats = {};
                players.forEach(p => stats[p] = 0);

                for (let r = 0; r < roundCount; r++) {
                    let pairs = [];
                    let waiting = [];

                    // 1. Circle Rotation (Fixed Pivot at index 0)
                    for (let i = 0; i < n / 2; i++) {
                        const p1 = circle[i];
                        const p2 = circle[n - 1 - i];
                        if (p1 === "GHOST") waiting.push(p2);
                        else if (p2 === "GHOST") waiting.push(p1);
                        else pairs.push([p1, p2]);
                    }

                    // 2. Assign to Courts (2 pairs per match)
                    const matches = [];
                    const availablePairs = [...pairs];
                    
                    while (matches.length < courtCount && availablePairs.length >= 2) {
                        const team1 = availablePairs.shift();
                        const team2 = availablePairs.shift();
                        matches.push({ team1, team2 });
                        
                        // Track games
                        [...team1, ...team2].forEach(p => stats[p]++);
                    }

                    // Anyone left in availablePairs also sits out due to court limits
                    availablePairs.forEach(pair => waiting.push(...pair));

                    schedule.push({ round: r + 1, matches, waiting });

                    // 3. Rotate the circle for next round
                    const fixed = circle[0];
                    const shifters = circle.slice(1);
                    shifters.unshift(shifters.pop());
                    circle = [fixed, ...shifters];
                }
                setData({ schedule, stats });
            };

            return (
                <div className="max-w-4xl mx-auto bg-white shadow-2xl rounded-3xl p-8 border border-slate-200">
                    <h1 className="text-3xl font-black text-slate-800 mb-8 flex items-center gap-2">
                        <span className="bg-green-500 text-white p-2 rounded-lg text-xl">P</span> 
                        Tournament Logic Fix
                    </h1>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div>
                            <label className="text-xs font-bold text-slate-400 uppercase">Players</label>
                            <input type="number" value={playerCount} onChange={e => setPlayerCount(Number(e.target.value))} className="w-full bg-slate-50 p-3 rounded-xl border-none ring-1 ring-slate-200" />
                        </div>
                        <div>
                            <label className="text-xs font-bold text-slate-400 uppercase">Courts</label>
                            <input type="number" value={courtCount} onChange={e => setCourtCount(Number(e.target.value))} className="w-full bg-slate-50 p-3 rounded-xl border-none ring-1 ring-slate-200" />
                        </div>
                        <div>
                            <label className="text-xs font-bold text-slate-400 uppercase">Rounds</label>
                            <input type="number" value={roundCount} onChange={e => setRoundCount(Number(e.target.value))} className="w-full bg-slate-50 p-3 rounded-xl border-none ring-1 ring-slate-200" />
                        </div>
                    </div>

                    <button onClick={generateSchedule} className="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl hover:bg-black transition mb-10">
                        Generate Balanced Schedule
                    </button>

                    {data.schedule.length > 0 && (
                        <>
                            <div className="mb-10 bg-green-50 p-6 rounded-2xl border border-green-100">
                                <h2 className="font-bold text-green-800 mb-4">Verification: Game Counts</h2>
                                <div className="grid grid-cols-4 sm:grid-cols-8 gap-2">
                                    {Object.entries(data.stats).map(([player, count]) => (
                                        <div key={player} className="bg-white p-2 rounded border border-green-200 text-center">
                                            <div className="text-[10px] text-slate-400 font-bold">{player}</div>
                                            <div className="font-black text-green-600">{count}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="space-y-8">
                                {data.schedule.map(round => (
                                    <div key={round.round} className="border-l-4 border-slate-100 pl-6">
                                        <div className="flex justify-between items-center mb-4">
                                            <h3 className="text-xl font-bold">Round {round.round}</h3>
                                            <div className="flex gap-1">
                                                {round.waiting.map(p => <span key={p} className="bg-red-100 text-red-600 px-2 py-1 rounded text-[10px] font-bold">Bye: {p}</span>)}
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {round.matches.map((m, i) => (
                                                <div key={i} className="bg-slate-50 p-4 rounded-xl border border-slate-100 relative">
                                                    <span className="absolute top-2 left-2 text-[9px] font-bold text-slate-300">COURT {i+1}</span>
                                                    <div className="flex justify-around items-center pt-2">
                                                        <span className="font-bold text-blue-600">{m.team1.join(' & ')}</span>
                                                        <span className="text-[10px] font-black text-slate-300 px-2">VS</span>
                                                        <span className="font-bold text-red-600">{m.team2.join(' & ')}</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<TournamentApp />);
    </script>
</body>
</html>
